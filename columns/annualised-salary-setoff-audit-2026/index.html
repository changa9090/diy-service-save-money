n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">\ubc15\ucc3d\ubbfc \ub300\ud45c\ubcc0\ud638\uc0ac (Chang Min Park)<\/div>\n            <div class=\"col-author-role\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \ub300\ud45c\ubcc0\ud638\uc0ac \u00b7 \ud638\uc8fc \ud038\uc990\ub79c\ub4dc\uc8fc \ubcc0\ud638\uc0ac\ud68c \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col04_emp_setoff_hero.jpg\" alt=\"\ud3ec\uad04\uc5f0\ubd09\uc81c(All-In Salary) \uacc4\uc57d\uc11c\uc758 \ubc30\uc2e0: Woolworths\u00b7Coles \uc5f0\ubc29\ubc95\uc6d0 \ud310\uacb0\uacfc \uc784\uae08\uc808\ub3c4 \ud615\uc0ac\ucc98\ubc8c \ub300\uc751\ubc95\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">\ud638\uc8fc \uc5f0\ubc29\ubc95\uc6d0\uc740 \uc5f0\ubd09\uc81c \uc9c1\uc6d0\uc774\ub77c\ub3c4 \uc5f0\uc7a5\uadfc\ubb34\uc640 \uc8fc\ub9d0 \uc218\ub2f9\uc744 1\ub144 \ud3c9\uade0\uc774 \uc544\ub2c8\ub77c \ub9e4\ubc88 \uc6d4\uae09\ub0a0\ub9c8\ub2e4 \uadf8 \uae30\uac04 \uae30\uc900\uc73c\ub85c \ub530\uc838 \uc9c0\uae09\ud574\uc57c \ud55c\ub2e4\uace0 \ubd84\uba85\ud788 \ubc1d\ud614\uc5b4\uc694.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">\ub9e4 \uae09\uc5ec\uc8fc\uae30 \uc815\uc0b0<\/div><div class=\"col-stat-lbl\">26\uc8fc\u00b7\uc5f0\uac04 \ud3ec\uad04\uc5f0\ubd09 \ucd08\uacfc\ubd84 \ud3c9\uade0 \uc0c1\uacc4 \ubd88\uac00 ([2025] FCA 1092)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">\uc9d5\uc5ed 10\ub144 / $9.1M<\/div><div class=\"col-stat-lbl\">\uace0\uc758 \uc784\uae08\uc808\ub3c4 \ud615\uc0ac\ucc98\ubc8c \uc0c1\ud55c (FWA s 327A \u00b7 2026.7.1 \ubc8c\uae08\ub2e8\uc704 $364)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">7\uc601\uc5c5\uc77c \uc774\ub0b4<\/div><div class=\"col-stat-lbl\">2026.7.1 \uc2dc\ud589 Payday Super 12% \ud1f4\uc9c1\uc5f0\uae08 \uc758\ubb34 \uc785\uae08 \uae30\ud55c<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">\uc774 \uce7c\ub7fc\uc758 \ubaa9\ucc28<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#\uc5f0\uac04-\ucd1d\uc561-\ud3c9\uade0\uc758-\uc885\ub9d0-woolworthscoles-\uc5f0\ubc29\ubc95\uc6d0-\ud310\uacb0\uc774-\ubc14\uafbc-\uc0c1\uacc4-\ubc95\ub9ac\" class=\"col-toc-link lvl-2\">\uc5f0\uac04 \ucd1d\uc561 \ud3c9\uade0\uc758 \uc885\ub9d0: Woolworths\u00b7Coles \uc5f0\ubc29\ubc95\uc6d0 \ud310\uacb0\uc774 \ubc14\uafbc \uc0c1\uacc4 \ubc95\ub9ac<\/a><a href=\"#\ucd9c\ud1f4\uadfc-\uce74\ub4dc-\ud0dc\uadf8\ub9cc\uc73c\ub85c\ub294-\ubd80\uc871\ud55c-\uae30\ub85d-\ubcf4\uc874-\uc758\ubb34s-535\uc640-\uc785\uc99d\ucc45\uc784-\uc804\ud658s-557c\" class=\"col-toc-link lvl-2\">\ucd9c\ud1f4\uadfc \uce74\ub4dc \ud0dc\uadf8\ub9cc\uc73c\ub85c\ub294 \ubd80\uc871\ud55c \uae30\ub85d \ubcf4\uc874 \uc758\ubb34(s 535)\uc640 \uc785\uc99d\ucc45\uc784 \uc804\ud658(s 557C)<\/a><a href=\"#2025\ub144-\uc784\uae08\uc808\ub3c4-\ud615\uc0ac\ucc98\ubc8cs-327a\uacfc-2026\ub144-7\uc6d4-\ubc8c\uae08-\ub2e8\uc704364-\uc778\uc0c1\" class=\"col-toc-link lvl-2\">2025\ub144 \uc784\uae08\uc808\ub3c4 \ud615\uc0ac\ucc98\ubc8c(s 327A)\uacfc 2026\ub144 7\uc6d4 \ubc8c\uae08 \ub2e8\uc704($364) \uc778\uc0c1<\/a><a href=\"#2026\ub144-7\uc6d4-\uc2dc\ud589-\uae09\uc5ec\uc77c-\uc5f0\ub3d9-\ud1f4\uc9c1\uc5f0\uae08payday-super\uc758-\uc5f0\uc1c4-\ud30c\uc7a5\" class=\"col-toc-link lvl-2\">2026\ub144 7\uc6d4 \uc2dc\ud589 \uae09\uc5ec\uc77c \uc5f0\ub3d9 \ud1f4\uc9c1\uc5f0\uae08(Payday Super)\uc758 \uc5f0\uc1c4 \ud30c\uc7a5<\/a><a href=\"#\uccb4\ubd88-\uaddc\ubaa8\uc640-\uae30\uc5c5-\ub9ac\uc2a4\ud06c\uc5d0-\ub9de\ub294-\ud574\uacb0-\uacbd\ub85c-\uc120\ud0dd\ud558\uae30\" class=\"col-toc-link lvl-2\">\uccb4\ubd88 \uaddc\ubaa8\uc640 \uae30\uc5c5 \ub9ac\uc2a4\ud06c\uc5d0 \ub9de\ub294 \ud574\uacb0 \uacbd\ub85c \uc120\ud0dd\ud558\uae30<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/221801513691854\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">\uace0\uc6a9\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../?lang=ko&amp;tab=employment\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 \uc9c1\uc7a5\u00b7\ubc00\ub9b0 \uc784\uae08 \uacc4\uc0b0\uae30\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">\ub808\uc2a4\ud1a0\ub791 \ud5e4\ub4dc\uc170\ud504\ub098 \ub9e4\uc7a5 \ub9e4\ub2c8\uc800\ub85c \uc77c\ud560 \ub54c \ud754\ud788 \ub4e3\ub294 \uc81c\uc548\uc774 \uc788\uc5b4\uc694. \ucd5c\uc800\uc2dc\uae09\ubcf4\ub2e4 \ub109\ub109\ud558\uac8c \uc5f0\ubd09\uc744 \uc904 \ud14c\ub2c8 \uc8fc\ub9d0 \uc218\ub2f9\uc774\ub098 \uc794\uc5c5\ube44\ub294 \ub530\ub85c \uacc4\uc0b0\ud558\uc9c0 \ub9d0\uc790\ub294 \uc57d\uc18d\uc774\uc8e0. \uc0ac\uc5c5\uc8fc\ub3c4 \ub9e4\ub2ec \ub611\uac19\uc740 \uae08\uc561\ub9cc \uc774\uccb4\ud558\uba74 \ud3b8\ud558\ub2e4\uace0 \ubbff\uace4 \ud574\uc694. \uadfc\ub85c\uacc4\uc57d\uc11c \ub9d0\ubbf8\uc5d0 \ud3ec\uad04\uc0c1\uacc4 \uc870\ud56d(Set-off Clause) \ub450 \uc904\ub9cc \ub123\uc5b4 \ub450\uba74 \uc548\uc804\ud558\ub2e4\uace0 \uc5ec\uacbc\uac70\ub4e0\uc694. \uc624\ub7ab\ub3d9\uc548 \ud55c\uc778 \uc694\uc2dd\uc5c5\uacfc \ub300\uae30\uc5c5 \uc720\ud1b5 \ud604\uc7a5\uc5d0\uc11c \ub2f9\uc5f0\ud558\uac8c \ud1b5\ud558\ub358 \uad00\ud589\uc774\uc5c8\uc5b4\uc694. \uadf8\ub7f0\ub370 2025\ub144 9\uc6d4 \uc120\uace0\ub41c \uc5f0\ubc29\ubc95\uc6d0 \ud310\uacb0 \ud558\ub098\uac00 \uc774 \uacf5\uc2dd\uc744 \ubfcc\ub9ac\uc9f8 \ub4a4\uc9d1\uc5b4 \ub193\uc558\uc5b4\uc694.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 366\" width=\"100%\" role=\"img\" aria-label=\"\ud3ec\uad04\uc5f0\ubd09 \uc0c1\uacc4(Set-off) \uc2e4\ud328 \uba54\ucee4\ub2c8\uc998\uacfc 2026\ub144 \uae30\uc5c5\u00b7\uadfc\ub85c\uc790 \ub9ac\uc2a4\ud06c\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"365\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">\uc5f0\ubc29\ubc95\uc6d0 \ud310\ub840 \uad6c\uc870 \u00b7 \ud3ec\uad04\uc5f0\ubd09 \uc0c1\uacc4 \ubb34\ub825\ud654\uc640 2026\ub144 \uc81c\uc7ac<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">\ud3ec\uad04\uc5f0\ubd09 \uc0c1\uacc4(Set-off) \uc2e4\ud328 \uba54\ucee4\ub2c8\uc998\uacfc 2026\ub144 \uae30\uc5c5\u00b7\uadfc\ub85c\uc790 \ub9ac\uc2a4\ud06c<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">\uadfc\uac70: FWO v Woolworths &amp; Coles [2025] FCA 1092 \u00b7 FWA s 327A \u00b7 Payday Super (2026.7.1)<\/text>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"36\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">TRAP 01 \u00b7 \uae09\uc5ec\uc8fc\uae30 \ud569\uc0b0 \uae08\uc9c0<\/text>\n  <text x=\"36\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">\uc5f0\uac04\u00b726\uc8fc \ud3c9\uade0 \uc0c1\uacc4 \ubb34\ud6a8<\/text>\n  <text x=\"36\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\">Woolworths / Coles [2025] FCA 1092<\/text>\n  <line x1=\"36\" y1=\"182\" x2=\"272\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">\ube44\uc218\uae30 \ucd08\uacfc\uae09\uc5ec\ub85c \uc131\uc218\uae30 \uc218\ub2f9 \uc0c1\uacc4 \ubd88\uac00<\/text>\n  <text x=\"36\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ub9e4 \uae09\uc5ec\uc8fc\uae30(Pay Period) \ub0b4 \uac1c\ubcc4 \uc815\uc0b0<\/text>\n  <text x=\"36\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc8fc\ub9d0\u00b7\uc57c\uac04\u00b7\uc5f0\uc7a5\uadfc\ub85c \ubc1c\uc0dd \uc989\uc2dc \ubbf8\uc9c0\uae09 \ud655\uc815<\/text>\n  <text x=\"36\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ud3ec\uad04\uc5f0\ubd09 \ubb38\uad6c\ub9cc\uc73c\ub85c\ub294 \uc5b4\uc6cc\ub4dc \uba74\ucc45 \ubd88\uac00<\/text>\n  <line x1=\"289\" y1=\"195\" x2=\"300\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"303,195 297,191 297,199\" fill=\"#1F242B\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"320\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">TRAP 02 \u00b7 \uc785\uc99d\ucc45\uc784 \uc5ed\uc804<\/text>\n  <text x=\"320\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">\ucd9c\ud1f4\uadfc \ud0dc\uadf8\ub9cc\uc73c\ub860 \uae30\ub85d \uc704\ubc18<\/text>\n  <text x=\"320\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E5F\">FWA s 535 \u00b7 Regs 3.33\u20133.34 \u00b7 s 557C<\/text>\n  <line x1=\"320\" y1=\"182\" x2=\"556\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"320\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">\ub2e8\uc21c \ucd9c\uc785\uce74\ub4dc\u00b7\ub85c\uc2a4\ud130\ub294 \ubc95\uc815 \uae30\ub85d \ubd88\uc778\uc815<\/text>\n  <text x=\"320\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ud560\uc99d\u00b7\ucd08\uacfc\uadfc\ubb34 \uc2dc\uac04 \ubcc4\ub3c4 \ud2b9\uc815 \ubcf4\uad00 \uc758\ubb34<\/text>\n  <text x=\"320\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc704\ubc18 \uc2dc s 557C \uc785\uc99d\ucc45\uc784 \uace0\uc6a9\uc8fc \uc804\uba74 \uc804\ud658<\/text>\n  <text x=\"320\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uadfc\ub85c\uc790 \ud569\ub9ac\uc801 \uc0b0\uc815\ud45c \uc81c\ucd9c \uc2dc \ubc29\uc5b4 \ubd88\ub2a5<\/text>\n  <line x1=\"573\" y1=\"195\" x2=\"584\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"587,195 581,191 581,199\" fill=\"#1F242B\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FEF8EC\" stroke=\"#9A6700\" stroke-width=\"1.3\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#9A6700\"/>\n  <text x=\"604\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">TRAP 03 \u00b7 \ud615\uc0ac\ucc98\ubc8c\u00b7\uc5f0\uae08<\/text>\n  <text x=\"604\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">\uc784\uae08\uc808\ub3c4 \uc9d5\uc5ed\ud615 &amp; Payday Super<\/text>\n  <text x=\"604\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#9A6700\">s 327A ($364 PU) \u00b7 12% SG (7 Bus Days)<\/text>\n  <line x1=\"604\" y1=\"182\" x2=\"840\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"604\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">\uace0\uc758 \uccb4\ubd88: \ucd5c\uace0 \uc9d5\uc5ed 10\ub144 / \uccb4\ubd88\uc561 3\ubc30<\/text>\n  <text x=\"604\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uac1c\uc778 $182\ub9cc \u00b7 \ubc95\uc778 $910\ub9cc \ubc8c\uae08 \uc0c1\ud55c<\/text>\n  <text x=\"604\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">2026.7.1 \uae09\uc5ec\uc77c \ud6c4 7\uc601\uc5c5\uc77c \ub0b4 12% \uc5f0\uae08<\/text>\n  <text x=\"604\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ubbf8\ub0a9 \uc2dc \uc77c\ubcf5\ub9ac SGC \uac00\uc0b0\uc138 \uc790\ub3d9 \ubd80\uacfc<\/text>\n  <rect x=\"22\" y=\"312\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#FEF8EC\" stroke=\"#ECD9B0\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"335\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">\uc2e4\ubb34 \ubd84\uae30\uc810: \uc18c\uc561(&lt;$50k)\uc740 \ud3ec\ud138 \uacc4\uc0b0\uae30\u00b7Form 5\ub85c \uc9c1\uc811 \ud68c\uc218\ud558\uace0, $50,000+ \ub2e4\ub144\ub3c4 \uc815\uc0b0\u00b7\uae30\uc5c5 \uae09\uc5ec\uac1c\ud3b8\uc740 \uc804\ubb38\ubcc0\ud638\uc0ac\uac00 \ub300\ub9ac\ud569\ub2c8\ub2e4.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 1: \ud3ec\uad04\uc5f0\ubd09 \uc0c1\uacc4(Set-off) \ubb34\ub825\ud654 \uad6c\uc870\uc640 \uae09\uc5ec \uc8fc\uae30\ubcc4 \uc815\uc0b0 \uc6d0\uce59<\/figcaption><\/figure>\n<h2 id=\"\uc5f0\uac04-\ucd1d\uc561-\ud3c9\uade0\uc758-\uc885\ub9d0-woolworthscoles-\uc5f0\ubc29\ubc95\uc6d0-\ud310\uacb0\uc774-\ubc14\uafbc-\uc0c1\uacc4-\ubc95\ub9ac\" class=\"doc-h2\">\uc5f0\uac04 \ucd1d\uc561 \ud3c9\uade0\uc758 \uc885\ub9d0: Woolworths\u00b7Coles \uc5f0\ubc29\ubc95\uc6d0 \ud310\uacb0\uc774 \ubc14\uafbc \uc0c1\uacc4 \ubc95\ub9ac<\/h2>\n<p class=\"doc-p\">\uae30\uc900\uc810\uc744 \ubc14\uafbc \uc0ac\uac74\uc740 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2025/1092.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Fair Work Ombudsman v Woolworths Group Limited; Fair Work Ombudsman v Coles Supermarkets Australia Pty Ltd<\/em> [2025] FCA 1092<\/a> (2025\ub144 9\uc6d4 5\uc77c \uc120\uace0) \ud310\uacb0\uc774\uc5d0\uc694. \ub450 \uc720\ud1b5 \ub300\uae30\uc5c5\uc740 \ub9e4\uc7a5 \uad00\ub9ac\uc790\ub4e4\uc5d0\uac8c \ud604\ub300\uc801 \uc9c1\uc885\ubcc4 \uae30\uc900(Modern Award) \uae30\ubcf8\uae09\ubcf4\ub2e4 \ub192\uc740 \uace0\uc815 \uc5f0\ubd09\uc744 \uc92c\uc5b4\uc694. \ud55c\uac00\ud55c \ube44\uc218\uae30 \ub2ec\uc5d0 \ubc95\uc815 \uae30\uc900\ubcf4\ub2e4 \ub354 \uc5b9\uc5b4 \uc900 \uae09\uc5ec \uc5ec\uc720\ubd84\uc744 \ubaa8\uc544 \ub450\uc5c8\ub2e4\uac00 \uc5f0\ub9d0 \uc131\uc218\uae30 \uc794\uc5c5\u00b7\uc8fc\ub9d0\uc218\ub2f9\uacfc 26\uc8fc \ub610\ub294 1\ub144 \ub2e8\uc704\ub85c \ud241\uce58\uaca0\ub2e4\ub294 \ub17c\ub9ac\uc600\uc8e0. \uacc4\uc57d\uc11c\uc5d0 \uc5f0\uac04 \uc0c1\uacc4 \uc870\ud56d\ub3c4 \uba85\uc2dc\ub3fc \uc788\uc5c8\uc5b4\uc694.<\/p>\n<p class=\"doc-p\">\uc5f0\ubc29\ubc95\uc6d0 Perram \ud310\uc0ac\uc758 \uacb0\ub860\uc740 \ub2e8\ud638\ud588\uc5b4\uc694. \uacf5\uc815\uadfc\ub85c\ubc95(Fair Work Act 2009, FWA)\uacfc Modern Award\uac00 \uc815\ud55c \ucd08\uacfc\uadfc\ubb34\uc218\ub2f9, \uc8fc\ub9d0\u00b7\uacf5\ud734\uc77c \uac00\uc0b0\uc218\ub2f9, \uac01\uc885 \uc81c\uc218\ub2f9\uc740 \ubc18\ub4dc\uc2dc \uac01\uac01\uc758 \uac1c\ubcc4 \uae09\uc5ec \uc8fc\uae30(each individual pay period) \uc548\uc5d0\uc11c \uc804\uc561 \uc815\uc0b0\ub418\uc5b4\uc57c \ud55c\ub2e4\uace0 \ubabb \ubc15\uc558\uac70\ub4e0\uc694. \ube44\uc218\uae30 \ub2ec\uc5d0 \uba87\ubc31 \ub2ec\ub7ec\ub97c \ub354 \uc92c\ub354\ub77c\ub3c4 \uc774\ubc88 \uae09\uc5ec \uc8fc\uae30\uc5d0 \ubc1c\uc0dd\ud55c \ud734\uc77c\u00b7\uc57c\uac04 \uc218\ub2f9 \ubbf8\ub2ec\ubd84\uc744 \uba54\uc6b8 \uc218\ub294 \uc5c6\uc5b4\uc694. \uc5f0\ubc29\ub300\ubc95\uc6d0\uc774 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2021/23.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>WorkPac Pty Ltd v Rossato<\/em> [2021] HCA 23<\/a> \ud310\uacb0\uc5d0\uc11c \uc138\uc6b4 \uc6d0\uce59\ub3c4 \uadf8\ub300\ub85c \uc774\uc5b4\uc838\uc694. \uc57d\uc815 \uae09\uc5ec\ub85c \ud2b9\uc815 \ubc95\uc815 \uc218\ub2f9\uc744 \uc0c1\uacc4\ud558\ub824\uba74 \ub450 \uc9c0\uae09 \ud56d\ubaa9\uc758 \uacc4\uc57d\uc0c1 \ubaa9\uc801(contractual purpose)\uc774 \uc815\ud655\ud788 \ub9de\ubb3c\ub824\uc57c \ud558\uac70\ub4e0\uc694. \ubaa8\ub4e0 \uc218\ub2f9\uc744 \uc5f0\ubd09\uc5d0 \ud3ec\ud568\ud55c\ub2e4\ub294 \ub450\ub8e8\ubb49\uc220\ud55c \ubb38\uad6c \ud558\ub098\ub85c\ub294 \uc131\uc218\uae30 \ucd08\uacfc\uadfc\ubb34 \uccb4\ubd88\uc744 \ub9c9\uc544\ub0bc \uc218 \uc5c6\uc5b4\uc694.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">\ud575\uc2ec \uc810\uac80 \ud56d\ubaa9<\/th><th style=\"text-align:left\">\uacfc\uac70 \ud604\uc7a5\uc758 \ud754\ud55c \uc624\ud574<\/th><th style=\"text-align:left\">[2025] FCA 1092 \ubc0f 2025\u20132026 \ud604\ud589 \uae30\uc900<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>\uae09\uc5ec \uc0c1\uacc4(Set-off) \ub2e8\uc704<\/strong><\/td><td style=\"text-align:left\">\uc5f0\uac04 \ucd1d\uc5f0\ubd09\uc774 Award \ucd5c\uc800\uce58\ubcf4\ub2e4 \ub192\uc73c\uba74 \uc801\ubc95<\/td><td style=\"text-align:left\">\uac1c\ubcc4 \uae09\uc5ec \uc8fc\uae30(\uc8fc\uae09\u00b7\uaca9\uc8fc\uae09\u00b7\uc6d4\uae09)\ubcc4 \ub3c5\ub9bd \uc815\uc0b0 \ud544\uc218 \u00b7 26\uc8fc/\uc5f0\uac04 \ud3c9\uade0 \ud569\uc0b0 \ubd88\uac00<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uae30\ub85d \ubcf4\uc874 \uc758\ubb34(FWA s 535)<\/strong><\/td><td style=\"text-align:left\">\uc5f0\ubd09\uc81c \uc9c1\uc6d0\uc740 \ucd9c\ud1f4\uadfc \ud0dc\uadf8 \ub85c\uadf8\ub098 \uadfc\ubb34\ud45c\ub9cc \uc788\uc73c\uba74 \ucda9\ubd84<\/td><td style=\"text-align:left\">Fair Work Regulations 2009 regs 3.33\u20133.34\uc5d0 \ub530\ub77c \ucd08\uacfc\uadfc\ubb34\u00b7\uac00\uc0b0\uc218\ub2f9 \uc2dc\uac04\uc744 \uc8fc\uae30\ubcc4\ub85c \uc0b0\ucd9c\u00b7\ubcf4\uc874<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc785\uc99d\ucc45\uc784 \uc804\ud658(FWA s 557C)<\/strong><\/td><td style=\"text-align:left\">\uccad\uad6c\ud558\ub294 \uadfc\ub85c\uc790\uac00 6\ub144 \uce58 \uadfc\ubb34\uc2dc\uac04\uc744 \uc804\ubd80 \uc99d\uba85<\/td><td style=\"text-align:left\">\uace0\uc6a9\uc8fc\uac00 s 535 \uae30\ub85d \uc758\ubb34\ub97c \uc5b4\uae30\uba74 \uace0\uc6a9\uc8fc\uc5d0\uac8c \ubc18\uc99d \ucc45\uc784 \uc804\uba74 \uc804\ud658<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc784\uae08\uc808\ub3c4 \ud615\uc0ac\ucc98\ubc8c(FWA s 327A)<\/strong><\/td><td style=\"text-align:left\">\uc801\ubc1c \uc2dc \ubc00\ub9b0 \ucc28\uc561\uacfc \ubbfc\uc0ac \uacfc\ud0dc\ub8cc\ub9cc \ub0b4\uba74 \uc885\uacb0<\/td><td style=\"text-align:left\">2025.01.01 \uc2dc\ud589 \u00b7 \ucd5c\uace0 \uc9d5\uc5ed 10\ub144 \ubc0f \uccb4\ubd88\uc561 3\ubc30 \ub610\ub294 \uac1c\uc778 $1,820,000 / \ubc95\uc778 $9,100,000 \ubc8c\uae08<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ud1f4\uc9c1\uc5f0\uae08(12% SG) \ub0a9\ubd80<\/strong><\/td><td style=\"text-align:left\">\ubd84\uae30 \uc885\ub8cc \ud6c4 28\uc77c \uc774\ub0b4\uc5d0 \uc77c\uad04 \ub0a9\ubd80<\/td><td style=\"text-align:left\">2026.07.01 Payday Super \uc2dc\ud589 \u00b7 \ub9e4 \uae09\uc5ec\uc77c \ud6c4 7\uc601\uc5c5\uc77c \uc774\ub0b4 \uae30\uae08 \uc785\uae08 \uc644\ub8cc (\uc704\ubc18 \uc2dc \uc77c\ubcf5\ub9ac SGC)<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"\ucd9c\ud1f4\uadfc-\uce74\ub4dc-\ud0dc\uadf8\ub9cc\uc73c\ub85c\ub294-\ubd80\uc871\ud55c-\uae30\ub85d-\ubcf4\uc874-\uc758\ubb34s-535\uc640-\uc785\uc99d\ucc45\uc784-\uc804\ud658s-557c\" class=\"doc-h2\">\ucd9c\ud1f4\uadfc \uce74\ub4dc \ud0dc\uadf8\ub9cc\uc73c\ub85c\ub294 \ubd80\uc871\ud55c \uae30\ub85d \ubcf4\uc874 \uc758\ubb34(s 535)\uc640 \uc785\uc99d\ucc45\uc784 \uc804\ud658(s 557C)<\/h2>\n<p class=\"doc-p\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2025/1092.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Woolworths &amp; Coles<\/em> [2025] FCA 1092<\/a> \ud310\uacb0\uc5d0\uc11c\ub294 \ub450 \ubc88\uc9f8 \ud3ed\ud0c4\ub3c4 \ud568\uaed8 \ud130\uc84c\uc5b4\uc694. \ubc14\ub85c FWA s 535 \ubc0f \uc2dc\ud589\ub839(regs 3.33\u20133.34)\uc0c1 \uadfc\ub85c\uc2dc\uac04 \uae30\ub85d \ubcf4\uc874 \uc758\ubb34\uc608\uc694. \ub9ce\uc740 \uc0ac\uc5c5\uc7a5\uc774 \ud0dc\ube14\ub9bf \ucd9c\ud1f4\uadfc \ud0dc\uadf8(swipe logs)\ub098 \uc8fc\uac04 \uadfc\ubb34\ud45c(rosters)\ub9cc \ub0a8\uc544 \uc788\uc73c\uba74 \ucda9\ubd84\ud558\ub2e4\uace0 \uc0dd\uac01\ud558\uc8e0. \uc5f0\ubc29\ubc95\uc6d0\uc740 \uadf8\ub7f0 \uc6d0\uc2dc \ub85c\uadf8\ub9cc \uc313\uc544 \ub450\ub294 \ubc29\uc2dd\uc740 \uc801\ubc95\ud55c \uae30\ub85d \ubcf4\uc874\uc73c\ub85c \ubcfc \uc218 \uc5c6\ub2e4\uace0 \ud310\ub2e8\ud588\uc5b4\uc694. Award \uc801\uc6a9\uc744 \ubc1b\ub294 \uc5f0\ubd09\uc81c \uc9c1\uc6d0\uc774\ub77c\uba74 \ub9e4 \uae09\uc5ec \uc8fc\uae30\ub9c8\ub2e4 \uc2e4\uc81c \ubc1c\uc0dd\ud55c \ucd08\uacfc\uadfc\ubb34\uc640 \uc8fc\ub9d0\u00b7\uc2ec\uc57c \uac00\uc0b0\uc218\ub2f9 \uc2dc\uac04\uc744 \uc5f4\ub78c \uac00\ub2a5\ud55c \ud615\ud0dc\ub85c \uc9d1\uacc4\ud574 \ub46c\uc57c \ud574\uc694.<\/p>\n<p class=\"doc-p\">\uc774 \uae30\ub85d \uc758\ubb34\ub97c \ub193\uce58\uba74 \uacb0\uacfc\ub294 \uce58\uba85\uc801\uc774\uc5d0\uc694. \ubc14\ub85c \uc785\uc99d\ucc45\uc784 \uc804\ud658 \ub54c\ubb38\uc774\uc8e0. \ud569\ub2f9\ud55c \uc0ac\uc720 \uc5c6\uc774 s 535 \uae30\ub85d\uc744 \uac16\ucd94\uc9c0 \ubabb\ud55c \uc21c\uac04 FWA s 557C\uc5d0 \ub530\ub77c \ubc95\uc815 \uc785\uc99d\ucc45\uc784\uc774 \uace0\uc6a9\uc8fc\uc5d0\uac8c \ub4a4\uc9d1\ud788\uac70\ub4e0\uc694(reverse onus of proof). \ud1f4\uc0ac\ud55c \uc8fc\ubc29\uc7a5\uc774\ub098 \ub9e4\ub2c8\uc800\uac00 \uc9c0\ub09c 6\ub144 \uce58 \uac1c\uc778 \uadfc\ubb34 \uba54\ubaa8\uc640 \uad6c\uae00 \ud0c0\uc784\ub77c\uc778 \uc704\uce58 \uae30\ub85d, \ub9e4\uc7a5 \ud3ec\uc2a4\uae30 \ub85c\uadf8\uc778 \ub0b4\uc5ed\uc744 \ubb36\uc5b4 \uc8fc\ub2f9 55\uc2dc\uac04 \uadfc\ubb34 \uc815\uc0b0\ud45c\ub97c \ubc95\uc6d0\uc5d0 \uc81c\ucd9c\ud588\ub2e4\uace0 \uac00\uc815\ud574 \ubcfc\uae4c\uc694? \uc774\uc81c\ub294 \uace0\uc6a9\uc8fc\uac00 \uadf8 \uc9c1\uc6d0\uc774 \ud574\ub2f9 \uc2dc\uac04\uc5d0 \uc77c\ud558\uc9c0 \uc54a\uc558\ub2e4\ub294 \uac1d\uad00\uc801 \ubc18\uc99d\uc744 \uc9c1\uc811 \ub300\uc57c \ud574\uc694. \uc815\uc0b0 \uae30\ub85d\uc774 \uc5c6\ub294 \uc0ac\uc5c5\uc7a5\uc740 \ubc29\uc5b4 \uc218\ub2e8\uc744 \ud1b5\uc9f8\ub85c \uc783\uc5b4\uc694.<\/p>\n<h2 id=\"2025\ub144-\uc784\uae08\uc808\ub3c4-\ud615\uc0ac\ucc98\ubc8cs-327a\uacfc-2026\ub144-7\uc6d4-\ubc8c\uae08-\ub2e8\uc704364-\uc778\uc0c1\" class=\"doc-h2\">2025\ub144 \uc784\uae08\uc808\ub3c4 \ud615\uc0ac\ucc98\ubc8c(s 327A)\uacfc 2026\ub144 7\uc6d4 \ubc8c\uae08 \ub2e8\uc704($364) \uc778\uc0c1<\/h2>\n<p class=\"doc-p\">\ubbfc\uc0ac \ubc30\uc0c1\uc744 \ub118\uc5b4 \ud615\uc0ac\ucc98\ubc8c \ubb38\ud131\ub3c4 \uc774\ubbf8 \uc5f4\ub838\uc5b4\uc694. 2025\ub144 1\uc6d4 1\uc77c \ubc1c\ud6a8\ub41c FWA s 327A \uc5f0\ubc29 \uc784\uae08\uc808\ub3c4(Criminal Wage Theft) \uc870\ud56d \ub54c\ubb38\uc774\uc5d0\uc694. \ubc95\uc815 \uc784\uae08\uc774\ub098 Modern Award \uc218\ub2f9\uc744 \uace0\uc758\ub85c(intentionally) \uacfc\uc18c \uc9c0\uae09\ud558\uba74 \uac1c\uc778\uc5d0\uac8c \ucd5c\uace0 \uc9d5\uc5ed 10\ub144\uc774 \uc120\uace0\ub420 \uc218 \uc788\uc5b4\uc694. \ubc8c\uae08 \uc0c1\ud55c\ub3c4 \ud6cc\uca4d \ub6f0\uc5c8\uc8e0. 2026\ub144 7\uc6d4 1\uc77c\ubd80\ud130 \uc5f0\ubc29 \ubc94\uc8c4\ubc95(Crimes Act 1914 s 4AA)\uc0c1 1\ubc8c\uae08 \ub2e8\uc704(Penalty Unit)\uac00 $364\ub85c \uc62c\ub790\uac70\ub4e0\uc694. \ubc95\uc6d0\uc740 \uccb4\ubd88\uc561\uc758 3\ubc30 \ub610\ub294 \uc815\uc561 \uc0c1\ud55c\uc778 \uac1c\uc778 $1,820,000(5,000 PU), \ubc95\uc778 $9,100,000(25,000 PU) \uc911 \ub354 \ud070 \uae08\uc561\uc744 \ubc8c\uae08\uc73c\ub85c \ubb3c\ub9b4 \uc218 \uc788\uc5b4\uc694.<\/p>\n<p class=\"doc-p\">\ub2e8\uc21c\ud55c \uacc4\uc0b0 \uc2e4\uc218\uae4c\uc9c0 \uace7\uc7a5 \ubc94\uc8c4\uac00 \ub418\uc9c0\ub294 \uc54a\uc544\uc694. \uc9c4\uc9dc \uc704\ud5d8\ud55c \uac74 \uacbd\uace0\ub97c \ubb34\uc2dc\ud558\uace0 \ubc29\uce58\ud558\ub294 \ud0dc\ub3c4\uc608\uc694. \uc9c1\uc6d0\uc774 \uc218\ub2f9 \ub204\ub77d\uc744 \uc9c0\uc801\ud588\uac70\ub098 [2025] FCA 1092 \ud310\uacb0 \uc774\ud6c4 \uae30\uc874 \ud3ec\uad04\uc5f0\ubd09\uc81c\uc758 \uacb0\ud568\uc744 \uc54c\uace0\ub3c4 \uae09\uc5ec \uccb4\uacc4\ub97c \uace0\uce58\uc9c0 \uc54a\uc558\ub2e4\uba74 \uace0\uc758\ubc94\uc73c\ub85c \uc5ee\uc77c \ube4c\ubbf8\uac00 \ub3fc\uc694. 482\u00b7186 \uc2a4\ud3f0\uc11c \ubc95\uc778\uc774\ub77c\uba74 \ub0b4\ubb34\ubd80 \ub178\ubbf8\ub124\uc774\uc158 \uac70\uc808 \uc0ac\uc720\uc778 \ubd88\ub9ac\ud55c \uc815\ubcf4(adverse information)\ub85c\ub3c4 \uc9c1\uacb0\ub418\uc8e0.<\/p>\n<h2 id=\"2026\ub144-7\uc6d4-\uc2dc\ud589-\uae09\uc5ec\uc77c-\uc5f0\ub3d9-\ud1f4\uc9c1\uc5f0\uae08payday-super\uc758-\uc5f0\uc1c4-\ud30c\uc7a5\" class=\"doc-h2\">2026\ub144 7\uc6d4 \uc2dc\ud589 \uae09\uc5ec\uc77c \uc5f0\ub3d9 \ud1f4\uc9c1\uc5f0\uae08(Payday Super)\uc758 \uc5f0\uc1c4 \ud30c\uc7a5<\/h2>\n<p class=\"doc-p\">\uc138\ubb34 \uc804\uc0b0\ub9dd\uc758 \uc555\ubc15\ub3c4 \ub3d9\uc2dc\uc5d0 \uc2dc\uc791\ub410\uc5b4\uc694. 2026\ub144 7\uc6d4 1\uc77c \uc2dc\ud589\ub41c \uae09\uc5ec\uc77c \uc5f0\ub3d9 \ud1f4\uc9c1\uc5f0\uae08\ubc95(Treasury Laws Amendment (Payday Superannuation) Act 2025)\uc774 \ubd84\uae30\ubcc4 \ub0a9\ubd80 \uad00\ud589\uc744 \ud3d0\uc9c0\ud588\uac70\ub4e0\uc694. \uc774\uc81c \uc801\uaca9 \uae09\uc5ec(Qualifying Earnings)\uc758 12% \ud1f4\uc9c1\uc5f0\uae08\uc774 \ub9e4 \uae09\uc5ec\uc77c\ub85c\ubd80\ud130 7\uc601\uc5c5\uc77c \uc774\ub0b4\uc5d0 \uc9c1\uc6d0 \uc5f0\uae08 \uae30\uae08\uc5d0 \uc2e4\uc81c \uc785\uae08\ub3fc\uc57c\ub9cc \uc81c\uc7ac\ub97c \ud53c\ud560 \uc218 \uc788\uc5b4\uc694.<\/p>\n<p class=\"doc-p\">\ud558\ub8e8\ub77c\ub3c4 \ub2a6\uc73c\uba74 \uad6d\uc138\uccad(ATO) \uae09\uc5ec \ubcf4\uace0(STP) \ub300\uc870\ub9dd\uc5d0 \uc989\uc2dc \ud3ec\ucc29\ub3fc\uc694. \uc77c\ubcf5\ub9ac \uc774\uc790\uac00 \ubd99\ub294 \ud1f4\uc9c1\uc5f0\uae08\ubcf4\uc7a5\ubd80\ub2f4\uae08(SGC)\uc774 \ubd80\uacfc\ub418\uc8e0. \ud3ec\uad04\uc5f0\ubd09 \uc0c1\uacc4\uac00 \uae68\uc838 \uae09\uc5ec \uae30\uc900\uc561\uc774 \ub2e4\uc2dc \uc7a1\ud788\uba74 \uae09\uc5ec\uc77c\ub9c8\ub2e4 \ubbf8\ub0a9 \uc5f0\uae08\uacfc \uc9c0\uc5f0\uc774\uc790\uac00 \uc5f0\uc1c4\uc801\uc73c\ub85c \ubd88\uc5b4\ub098\uac8c \ub3fc\uc694.<\/p>\n<h2 id=\"\uccb4\ubd88-\uaddc\ubaa8\uc640-\uae30\uc5c5-\ub9ac\uc2a4\ud06c\uc5d0-\ub9de\ub294-\ud574\uacb0-\uacbd\ub85c-\uc120\ud0dd\ud558\uae30\" class=\"doc-h2\">\uccb4\ubd88 \uaddc\ubaa8\uc640 \uae30\uc5c5 \ub9ac\uc2a4\ud06c\uc5d0 \ub9de\ub294 \ud574\uacb0 \uacbd\ub85c \uc120\ud0dd\ud558\uae30<\/h2>\n<p class=\"doc-p\">\ub300\uc751 \uacbd\ub85c\ub294 \uae08\uc561\uacfc \uc785\uc7a5\uc5d0 \ub530\ub77c \uba85\ud655\ud788 \ub098\ub258\uc5b4\uc694. \uc608\uc0c1 \ubbf8\uc9c0\uae09\uc561\uc774 $50,000 \ubbf8\ub9cc\uc774\uac70\ub098 \uc544\uc9c1 \uae09\uc5ec \uc8fc\uae30\ubcc4 \ubd80\uc871\ubd84\uc744 \uacc4\uc0b0\ud574 \ubcf4\uc9c0 \uc54a\uc740 \uadfc\ub85c\uc790\ub77c\uba74 \ubcc0\ud638\uc0ac\ub97c \uc120\uc784\ud558\uc2e4 \ud544\uc694\uac00 \uc5c6\uc5b4\uc694. \uc5f0\ubc29\uc21c\ud68c\u00b7\uac00\uc871\ubc95\uc6d0(FCFCOA) FWA s 548 \uc18c\uc561\uccad\uad6c\ub294 \ud328\uc18c\uc790\uc5d0\uac8c \ubcc0\ud638\uc0ac\ube44\ub97c \ubb3c\ub9ac\uc9c0 \uc54a\ub294 \ubb34\uc18c\uc1a1\ube44\uc6a9 \uad00\ud560(s 570)\uc774\uac70\ub4e0\uc694. \ubcf8 \ud3ec\ud138\uc758 \ubb34\ub8cc <a href=\"../../?lang=ko#employment\" class=\"doc-link\">\uc9c1\uc885\ubcc4 Award \ud504\ub9ac\uc14b \uacc4\uc0b0\uae30<\/a>\uc640 <a href=\"../../files/KO/Excel_Calculator/Park_Co_Underpayment_Self_Calculator_2026_KO.xlsx\" download class=\"doc-link\">208\uc218\uc2dd \uc790\ub3d9 \uc815\uc0b0 \uc5d1\uc140(.xlsx)<\/a>\ub85c \uba3c\uc800 \ucc28\uc561\uc744 \uc9c1\uc811 \uc0b0\ucd9c\ud574 \ubcf4\uc138\uc694. \uc774\uc5b4\uc11c <a href=\"../../files/KO/PDF/02_Employment_Underpayment_Self_Calculation_and_Evidence_Manual_2026_KO.pdf\" download class=\"doc-link\">\uccb4\ubd88\uc784\uae08 \uc140\ud504 \uc815\uc0b0 \ubc0f Form 5 \ub9e4\ub274\uc5bc<\/a>\uc744 \ub530\ub77c 7\uc77c \ucd5c\uace0\uc7a5 \ubc1c\uc1a1\uacfc Form 5 \uc811\uc218\ub97c \uc9c1\uc811 \uc9c4\ud589\ud558\uc2dc\uba74 \ud68c\uc218\uae08 \uc804\uc561\uc744 \uc9c0\ud0a4\uc2e4 \uc218 \uc788\uc5b4\uc694.<\/p>\n<p class=\"doc-p\">\ubc18\uba74 \uacf5\uc815\uadfc\ub85c\uc634\ubd80\uc988\ub9e8(FWO) \uac10\uc0ac \uc804\uc5d0 \ud3ec\uad04\uc5f0\ubd09 \uacc4\uc57d\uc11c\uc640 s 535 \uc815\uc0b0 \uccb4\uacc4\ub97c \uc190\ubcf4\ub824\ub294 \ubcf5\uc7a1\ud55c \uae30\uc5c5\u00b7\uc2a4\ud3f0\uc11c \ubc95\uc778 \ub178\ubb34 \uac10\uc0ac, \uadf8\ub9ac\uace0 \ubcf8 \ud3ec\ud138 \uc5d1\uc140\ub85c \uc9c1\uc811 \uc0b0\ucd9c\ud55c \ub2e4\ub144 \uce58 \ubbf8\uc9c0\uae09 \ucd1d\uc561\uc774 $50,000~$200,000 \uc774\uc0c1\uc778 \ub9e4\ub2c8\uc800\u00b7\uc170\ud504 \uace0\uc561 \uccad\uad6c \uc0ac\uac74\uc740 \uc815\uad50\ud55c \ubcf8\uc548 \uc18c\uc1a1\uacfc \uacc4\uc57d \uc7ac\uc124\uacc4\uac00 \uc131\ud328\ub97c \uac08\ub77c\uc694. \ubc15\uc564\ucf54 \uace0\uc6a9\ubc95 \uc804\uc6a9 \ucc3d\uad6c(<a href=\"https://form.jotform.com/221801513691854\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\uace0\uc6a9\ubc95 \uc0ac\uc548 \uc811\uc218 \ubc14\ub85c\uac00\uae30<\/a>)\uc640 \uacf5\uc2dd \uc548\ub0b4 \ud398\uc774\uc9c0(<a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ubc15\uc564\ucf54 \uacf5\uc2dd \ub9c1\ud06c \ud5c8\ube0c<\/a>)\ub85c \uc815\uc0b0\ud45c\ub098 \uacc4\uc57d\uc11c\ub97c \ub0a8\uaca8 \uc8fc\uc138\uc694. \uc774\ud574\ucda9\ub3cc \uc810\uac80 \ud6c4 \uac00\uc7a5 \uc2e4\uc775\uc774 \ud070 \ud574\ubc95\uc744 \uc9da\uc5b4 \ub4dc\ub9b4\uac8c\uc694.<\/p>\n\n          <div class=\"col-sources-box\">\n            \uadfc\uac70 \ubc95\ub839 \ubc0f \ud310\ub840: Fair Work Ombudsman v Woolworths Group Ltd; FWO v Coles Supermarkets Australia Pty Ltd [2025] FCA 1092 \u00b7 WorkPac v Rossato [2021] HCA 23 \u00b7 Fair Work Act 2009 ss 327A, 535, 557C \u00b7 Fair Work Regulations 2009 regs 3.33\u20133.34 \u00b7 Treasury Laws Amendment (Payday Superannuation) Act 2025 (eff. 1 July 2026).\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">\ud63c\uc790 \uc9c4\ud589\uc744 \uba48\ucd94\uace0 \ubcc0\ud638\uc0ac\ub97c \ucc3e\uc544\uc57c \ud558\ub294 \uc21c\uac04<\/span>\n            <h3 class=\"col-cta-title\">\ud68c\uc0ac \uae09\uc5ec\u00b7\uacc4\uc57d\uc11c \uc810\uac80, \ud574\uace0 21\uc77c \ub9c8\uac10 \uae30\ud55c, \ub610\ub294 \uc9c1\uc811 \uacc4\uc0b0\uc744 \ub9c8\uce5c $50,000 \uc774\uc0c1 \ubbf8\uc9c0\uae09 \uc0ac\uac74\uc778\uac00\uc694?<\/h3>\n            <p class=\"col-cta-desc\">$50,000 \ubbf8\ub9cc\uc758 \uc77c\ubc18 \ubc00\ub9b0 \uae09\uc5ec\ub294 \ud3ec\ud138 \ubb34\ub8cc \uacc4\uc0b0\uae30\uc640 208\uc218\uc2dd \uc5d1\uc140\ub85c \uc9c1\uc811 \uacc4\uc0b0\ud574 \uccad\uad6c\ud558\uc154\uc57c \ubc1b\uc73c\uc2e4 \ub3c8\ubcf4\ub2e4 \ubcc0\ud638\uc0ac\ube44\uac00 \ub354 \ucee4\uc9c0\ub294 \uc77c\uc744 \ub9c9\uc744 \uc218 \uc788\uc5b4\uc694. \ubc18\uba74 \ud574\uace0 \ud6c4 21\uc77c \uae30\ud55c\uc774 \uc784\ubc15\ud588\uac70\ub098 \ud68c\uc0ac \uc2a4\ud3f0\uc11c\uc2ed \ubc29\uc5b4\u00b7$50,000 \uc774\uc0c1 \uace0\uc561 \uccad\uad6c\u00b7\ud3d0\uc5c5 \ub300\ud45c\uc790 \ucc45\uc784 \ucd94\uad81(s 550) \ub2e8\uacc4\ub77c\uba74 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uc54c\ub824 \uc8fc\uc138\uc694.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/221801513691854\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">\uace0\uc6a9\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../files/KO/PDF/02_Employment_Underpayment_Self_Calculation_and_Evidence_Manual_2026_KO.pdf\" download class=\"col-btn-ghost\">02 \ubc00\ub9b0 \uc784\uae08 \uacc4\uc0b0\u00b7\uccad\uad6c \uc694\uc57d PDF \ubc1b\uae30<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">\ubc15\uc564\ucf54 \uacf5\uc2dd \uc0c1\ub2f4 \ub9c1\ud06c \ud5c8\ube0c<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">\ubc95\ub960 \uc548\ub0b4: \uc774 \uce7c\ub7fc\uc740 \ud638\uc8fc \uacf5\uc815\uadfc\ub85c\ubc95(Fair Work Act 2009), \ud1f4\uc9c1\uc5f0\uae08\ubc95, \uc774\ubbfc\ubc95\ub839\uacfc \ubc95\uc6d0 \ud310\ub840\ub97c \ubc14\ud0d5\uc73c\ub85c \uc54c\uae30 \uc27d\uac8c \ud480\uc5b4 \uc4f4 \uc77c\ubc18 \ubc95\ub960 \uc815\ubcf4\uc608\uc694. \uac1c\ubcc4 \uc0ac\uac74\uc5d0 \ub300\ud55c \ubc95\ub960 \uc790\ubb38\uc774\ub098 \uc218\uc784 \uacc4\uc57d \uc131\ub9bd\uc744 \ub73b\ud558\uc9c0 \uc54a\uc73c\ub2c8 FWC 21\uc77c \ub9c8\uac10 \uae30\ud55c \ub4f1\uc774 \uc784\ubc15\ud588\ub2e4\uba74 \uc9c0\uccb4 \uc5c6\uc774 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uac80\ud1a0\ub97c \ubc1b\uc544 \ubcf4\uc138\uc694.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">\ud568\uaed8 \uc77d\uc73c\uba74 \uc88b\uc740 \uace0\uc6a9\ubc95 \ud310\ub840 \uce7c\ub7fc<\/h3>\n        <a href=\"../../?lang=ko&amp;tab=employment\" class=\"col-back-link num\">\u2190 \uc9c1\uc7a5\u00b7\ubc00\ub9b0 \uc784\uae08 \uacc4\uc0b0\uae30\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../director-accountant-liability-s550/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubc95\uc778\ud3d0\uc5c5\u00b7\uc5f0\ub300\ucc45\uc784 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 05<\/span><h4 class=\"col-sib-title\">\ud68c\uc0ac\ub97c \ud3d0\uc5c5(Liquidation)\ud558\uba74 \ub05d\uc77c\uae4c: \ub300\ud45c\uc774\uc0ac\u00b7\ud68c\uacc4\uc0ac \uac1c\uc778 \uc7ac\uc0b0\uc744 \ucd94\uad81\ud558\ub294 FWA s 550 \uc5f0\ub300\ucc45\uc784<\/h4><p class=\"col-sib-desc\">\ubb38\uc744 \ub2eb\uc740 \ube48 \uaecd\ub370\uae30 \ud68c\uc0ac\ub9cc \uc0c1\ub300\ub85c \uc18c\uc1a1\ud558\uba74 \uc65c \ub3c8\uc744 \ud55c \ud47c\ub3c4 \ubabb \ubc1b\ub294\uc9c0 \uc54c\uc544\ubcf4\uace0 \uc0ac\uc7a5\ub2d8\u00b7\uad00\uc5ec \ud68c\uacc4\uc0ac \uac1c\uc778 \uc7ac\uc0b0\uc5d0 \ucc45\uc784\uc744 \ubb3b\ub294 s 550 \uaddc\uc815\uc744 \uc27d\uac8c \uc124\uba85\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../sham-contracting-abn-s15aa/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ABN \uc704\uc7a5\ub3c4\uae09 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 06<\/span><h4 class=\"col-sib-title\">ABN \ud504\ub9ac\ub79c\uc11c \uacc4\uc57d\uc11c \uc37c\uc73c\ub2c8 \uadfc\ub85c\uc790\uac00 \uc544\ub2c8\ub2e4? FWA s 15AA \uc2e4\uc9c8 \uc2ec\uc0ac\uc640 6\ub144 \uce58 \uc5f0\uae08\u00b7\uc218\ub2f9 \uc5ed\ucd94\uc9d5<\/h4><p class=\"col-sib-desc\">\ud504\ub9ac\ub79c\uc11c \uacc4\uc57d\uc11c\ub97c \uc4f0\uace0\ub3c4 \uc815\uc2dd \uc9c1\uc6d0\uc73c\ub85c \uc778\uc815\ubc1b\uc544 \ubcf5\uc9c1\ud55c \uc0ac\ub840\uc640 \uc5f0\ubd09 $190,100 \uc774\uc0c1\uc77c \ub54c \uc608\uc678\uac00 \uc778\uc815\ub41c \ucd5c\uc2e0 \ud310\ub840\ub97c \ub098\ub780\ud788 \ube44\uad50\ud574 \ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../sponsored-worker-dismissal-482-186/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ube44\uc790\uc5f0\ub3d9 \ud574\uace0 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 07<\/span><h4 class=\"col-sib-title\">482\u00b7186 \uc2a4\ud3f0\uc11c \ube44\uc790 \uc911 \ud574\uace0 \ud1b5\ubcf4: 21\uc77c\uacfc 180\uc77c\uc758 \uc774\uc911 \uc2dc\uacc4\uc640 \ud569\uc758\uc11c(Deed) \ud568\uc815<\/h4><p class=\"col-sib-desc\">\uc2a4\ud3f0\uc11c \ube44\uc790\ub85c \uc77c\ud558\ub2e4 \ud574\uace0\ub410\uc744 \ub54c \uc65c \ub178\ub3d9\ubc95\uacfc \uc774\ubbfc\ubc95\uc744 \ub530\ub85c \ubcf4\uba74 \uc704\ud5d8\ud55c\uc9c0 \uc9da\uc5b4 \ubcf4\uace0 \ud1f4\uc0ac\uc77c\uc744 \uc870\uc728\ud558\ub294 \ud569\uc758\uc11c \uc791\uc131\ubc95\uacfc \uc8fc\uc758\uc810\uc744 \uc815\ub9ac\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../executive-dismissal-general-protections-restraints/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc784\uc6d0\ud574\uace0\u00b7\uacbd\uc5c5\uae08\uc9c0 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 08<\/span><h4 class=\"col-sib-title\">\uc5f0\ubd09 $190,100 \uc774\uc0c1 \uc784\uc6d0 \ud574\uace0\uc640 \ubb34\uc81c\ud55c \uc77c\ubc18\ubcf4\ud638 \uc18c\uc1a1\uc758 \ucc29\uac01: $520\ub9cc \ud310\uacb0 \ud30c\uae30 \uc0ac\ub840\uc640 \uacbd\uc5c5\uae08\uc9c0 \uac00\ucc98\ubd84<\/h4><p class=\"col-sib-desc\">\ud68c\uc0ac\uc5d0 \ubb38\uc81c\ub97c \uc81c\uae30\ud55c \uc9c1\ud6c4 \ud574\uace0\ub418\uba74 \ubb34\uc870\uac74 \uac70\uc561 \ubc30\uc0c1\uc744 \ubc1b\ub294\ub2e4\ub294 \uc624\ud574\ub97c \ubc14\ub85c\uc7a1\uace0 \uace0\uc5f0\ubd09 \uc784\uc6d0 \ud1f4\uc0ac \ud611\uc0c1\uacfc \uacbd\uc5c5\uae08\uc9c0 \uc870\ud56d \ub300\uc751\ubc95\uc744 \uc27d\uac8c \ud480\uc5c8\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}, "en": {"doc_title": "Why Annualised Salary Set-Off Clauses Fail After Woolworths and Coles [2025] FCA 1092 \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">All Guides Hub<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=en\">Visa Solution Guide<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=en\">Employment Navigator<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=en\">DIY & Cost-Smart Guide<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\">Consult Park & Co \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=en&amp;tab=employment\" class=\"col-back-btn\">\u2190 Back to Employment Self-Help Hub<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">Park &amp; Co Lawyers \u00b7 Employment Law Deep-Dive Column<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn\">KO<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn active\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">Consult Park &amp; Co \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">ANNUALISED SALARIES \u00b7 EMPLOYMENT 04<\/span>\n          <span class=\"col-verified-pill num\">Primary-Source Verified (Nov 2026)<\/span>\n          <span class=\"col-time-pill num\">8 min read<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">Why Annualised Salary Set-Off Clauses Fail After Woolworths and Coles [2025] FCA 1092<\/h1>\n        <p class=\"col-subtitle\">Pay-period set-off limits, raw swipe-log breaches triggering the s 557C reverse onus, s 327A criminal penalties, and July 2026 Payday Super<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">Chang Min Park<\/div>\n            <div class=\"col-author-role\">Legal Practitioner Director, Park &amp; Co Lawyers \u00b7 Accredited Specialist in Immigration Law (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col04_emp_setoff_hero.jpg\" alt=\"Why Annualised Salary Set-Off Clauses Fail After Woolworths and Coles [2025] FCA 1092\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">Under [2025] FCA 1092, contractual set-off clauses cannot pool above-award salary payments across multiple pay cycles to cancel peak-season overtime and penalty rates.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">Single Pay Cycle<\/div><div class=\"col-stat-lbl\">No 26-week or annual salary pooling across pay periods ([2025] FCA 1092)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">10 Yrs / $9.1M<\/div><div class=\"col-stat-lbl\">Max s 327A intentional wage theft penalty ($364 Commonwealth penalty unit)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">7 Business Days<\/div><div class=\"col-stat-lbl\">12% Payday Super fund receipt deadline from 1 July 2026<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">In This Column<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#pay-period-isolation-why-annual-pooling-collapse\" class=\"col-toc-link lvl-2\">Pay-period isolation: why annual pooling collapsed in Woolworths and Coles<\/a><a href=\"#swipe-logs-fail-s-535-and-trigger-the-s-557c-rev\" class=\"col-toc-link lvl-2\">Swipe logs fail s 535 and trigger the s 557C reverse onus<\/a><a href=\"#criminal-wage-theft-under-s-327a-at-the-364-fede\" class=\"col-toc-link lvl-2\">Criminal wage theft under s 327A at the $364 federal penalty unit<\/a><a href=\"#payday-superannuation-from-1-july-2026-compounds\" class=\"col-toc-link lvl-2\">Payday superannuation from 1 July 2026 compounds every payroll error<\/a><a href=\"#auditing-complex-payrolls-and-pursuing-multi-yea\" class=\"col-toc-link lvl-2\">Auditing complex payrolls and pursuing multi-year salaried claims<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">Open Employment Consultation Form<\/a>\n              <a href=\"../../?lang=en&amp;tab=employment\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 Back to Employment Self-Help Hub<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">Putting a restaurant manager, head chef, or retail department supervisor on an &quot;all-in&quot; salary of $80,000 or $95,000 has been standard Australian payroll practice for twenty years. Employers drop a two-line set-off clause into the contract stating that the annual figure satisfies all modern award overtime, weekend penalty rates, public holiday loadings, and split-shift allowances, then stop tracking daily hours. On 5 September 2025, Justice Perram dismantled both halves of that payroll model in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2025/1092.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Fair Work Ombudsman v Woolworths Group Limited; Fair Work Ombudsman v Coles Supermarkets Australia Pty Ltd<\/em> [2025] FCA 1092<\/a>. Read alongside the federal criminal wage theft offence (s 327A) and the 1 July 2026 start of Payday Super, legacy set-off templates leave solvent businesses exposed to six-figure backpay claims and severe statutory penalties.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 366\" width=\"100%\" role=\"img\" aria-label=\"Why Annualised Set-Off Clauses Collapse &amp; 2026 Employer Exposure\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"365\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">FEDERAL COURT AUDIT \u00b7 [2025] FCA 1092 &amp; PAYDAY SUPER<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">Why Annualised Set-Off Clauses Collapse &amp; 2026 Employer Exposure<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">Authorities: FWO v Woolworths &amp; Coles [2025] FCA 1092 \u00b7 FWA s 327A \u00b7 Payday Super (1 Jul 2026)<\/text>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"36\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">TRAP 01 \u00b7 PAY-PERIOD SILO<\/text>\n  <text x=\"36\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">No Cross-Cycle Averaging<\/text>\n  <text x=\"36\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\">Woolworths / Coles [2025] FCA 1092<\/text>\n  <line x1=\"36\" y1=\"182\" x2=\"272\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">Quiet weeks cannot offset peak overtime<\/text>\n  <text x=\"36\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Award owed strictly inside each pay cycle<\/text>\n  <text x=\"36\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Unpaid penalties accrue each fortnight<\/text>\n  <text x=\"36\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Generic all-in wording fails Rossato<\/text>\n  <line x1=\"289\" y1=\"195\" x2=\"300\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"303,195 297,191 297,199\" fill=\"#1F242B\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"320\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">TRAP 02 \u00b7 REVERSE ONUS<\/text>\n  <text x=\"320\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">Swipe Logs Fail s 535<\/text>\n  <text x=\"320\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E5F\">FWA s 535 \u00b7 Regs 3.33\u20133.34 \u00b7 s 557C<\/text>\n  <line x1=\"320\" y1=\"182\" x2=\"556\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"320\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">Raw gate swipes &amp; rosters fail reg 3.34<\/text>\n  <text x=\"320\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Must record discrete overtime/penalty hrs<\/text>\n  <text x=\"320\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Triggers s 557C reverse onus in Court<\/text>\n  <text x=\"320\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Employer must disprove worker schedule<\/text>\n  <line x1=\"573\" y1=\"195\" x2=\"584\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"587,195 581,191 581,199\" fill=\"#1F242B\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FEF8EC\" stroke=\"#9A6700\" stroke-width=\"1.3\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#9A6700\"/>\n  <text x=\"604\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">TRAP 03 \u00b7 2026 PENALTIES<\/text>\n  <text x=\"604\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">s 327A Crime &amp; Payday Super<\/text>\n  <text x=\"604\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#9A6700\">s 327A ($364 PU) \u00b7 12% SG (7 Bus Days)<\/text>\n  <line x1=\"604\" y1=\"182\" x2=\"840\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"604\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">Intentional theft: 10 yrs / 3x shortfall<\/text>\n  <text x=\"604\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Max $1.82M indiv / $9.1M corp ($364 PU)<\/text>\n  <text x=\"604\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">12% SG due within 7 bus days of payday<\/text>\n  <text x=\"604\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Daily compounding ATO SGC interest<\/text>\n  <rect x=\"22\" y=\"312\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#FEF8EC\" stroke=\"#ECD9B0\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"335\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">Cost-Smart Guide: Use our free Award Calculator &amp; Form 5 for &lt;$50k claims; retain counsel for &gt;$50k schedules &amp; B2B payroll audits.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 1: Pay-Period Set-Off Failure, s 557C Reverse Onus and 2026 Penalty Exposure<\/figcaption><\/figure>\n<h2 id=\"pay-period-isolation-why-annual-pooling-collapse\" class=\"doc-h2\">Pay-period isolation: why annual pooling collapsed in Woolworths and Coles<\/h2>\n<p class=\"doc-p\">Payroll teams long treated an above-award annual salary as a single twelve-month pool. If a salaried manager earned $15,000 above the bare award base rate across the financial year, the employer assumed quiet winter fortnights paid for 60-hour December trading rosters, Easter public holidays, and late-night stocktakes.<\/p>\n<p class=\"doc-p\">Justice Perram rejected that approach in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2025/1092.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Fair Work Ombudsman v Woolworths Group Limited; Fair Work Ombudsman v Coles Supermarkets Australia Pty Ltd<\/em> [2025] FCA 1092<\/a>. Applying the High Court&#x27;s requirement for strict alignment of contractual purpose in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2021/23.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>WorkPac Pty Ltd v Rossato<\/em> [2021] HCA 23<\/a>, the Federal Court held that contractual set-off clauses cannot pool or average salary surpluses across 26-week or annual cycles. Under s 323 of the <em>Fair Work Act 2009<\/em> (Cth) (FWA) and modern award pay-cycle clauses, award entitlements crystallise inside each individual fortnightly or monthly pay period. Unless an employer complies strictly with a formal annualised wage arrangement clause inside the relevant award (complete with written outer-limit hour caps, signed acknowledgements, and annual reconciliations), an overpayment in May cannot offset unpaid Sunday overtime in December.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">Compliance Area<\/th><th style=\"text-align:left\">Legacy Payroll Assumption<\/th><th style=\"text-align:left\">Post-2025 Statutory &amp; Judicial Rule<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Contractual Set-Off Horizon<\/strong><\/td><td style=\"text-align:left\">Above-award annual salary averages out seasonal peaks over 26 or 52 weeks<\/td><td style=\"text-align:left\">Award overtime, weekend penalties, and allowances must be satisfied inside each individual pay period (<a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2025/1092.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Woolworths &amp; Coles<\/em> [2025] FCA 1092<\/a>; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2021/23.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Rossato<\/em> [2021] HCA 23<\/a>)<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Salaried Time &amp; Wage Records<\/strong><\/td><td style=\"text-align:left\">Biometric clock data, POS logins, and rosters satisfy record duties<\/td><td style=\"text-align:left\">Raw swipe logs and rosters breach FWA s 535 and Fair Work Regulations 2009 regs 3.33-3.34 unless overtime and penalty hours are discretely recorded<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Courtroom Burden of Proof<\/strong><\/td><td style=\"text-align:left\">Claimant employee must prove every unrecorded overtime hour from scratch<\/td><td style=\"text-align:left\">Defective s 535 records trigger the s 557C reverse onus, forcing the employer to disprove the worker&#x27;s reconstructed hours<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Criminal Wage Theft (FWA s 327A)<\/strong><\/td><td style=\"text-align:left\">Underpayments remain civil remediation matters settled via backpay<\/td><td style=\"text-align:left\">Intentional underpayment (since 1 Jan 2025) carries up to 10 years&#x27; prison and fines of 3x shortfall or $1,820,000 (individual) / $9,100,000 (corporate) at the $364 penalty unit<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Payday Superannuation (1 Jul 2026)<\/strong><\/td><td style=\"text-align:left\">Employer super can be remitted quarterly by the 28th day after quarter-end<\/td><td style=\"text-align:left\"><em>Treasury Laws Amendment (Payday Superannuation) Act 2025<\/em> requires 12% SG on Qualifying Earnings to reach the fund within 7 business days of each payday<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"swipe-logs-fail-s-535-and-trigger-the-s-557c-rev\" class=\"doc-h2\">Swipe logs fail s 535 and trigger the s 557C reverse onus<\/h2>\n<p class=\"doc-p\"><em>Woolworths and Coles<\/em> also exposed a major flaw in electronic attendance systems. Both retailers argued that rosters, point-of-sale logins, and biometric clock-in and clock-out swipe data met their statutory record duties for salaried managers.<\/p>\n<p class=\"doc-p\">The Federal Court disagreed. Under FWA s 535 and regs 3.33 to 3.34 of the <em>Fair Work Regulations 2009<\/em> (Cth), employee records must sit in a readily accessible, legible format rather than raw data streams requiring forensic assembly, and they must discretely state overtime hours and penalty-rate hours worked by award-covered staff. Telling a salaried chef or venue manager that salaried staff do not log overtime guarantees an s 535 breach. Under FWA s 557C, failing to keep compliant s 535 records without a narrow reasonable excuse flips the courtroom onus onto the employer. When a former manager produces six years of reconstructed shifts backed by Google Timeline location history, WhatsApp lock-up messages, and diary notes, the court presumes those hours were worked unless the company disproves them with hard evidence.<\/p>\n<h2 id=\"criminal-wage-theft-under-s-327a-at-the-364-fede\" class=\"doc-h2\">Criminal wage theft under s 327A at the $364 federal penalty unit<\/h2>\n<p class=\"doc-p\">Since 1 January 2025, FWA s 327A has made intentional underpayment of statutory or award entitlements a federal indictable crime. Honest payroll calculation mistakes do not satisfy criminal intention under the <em>Criminal Code<\/em>. Criminal exposure arises when a board or owner receives an accountant&#x27;s warning, an employee&#x27;s shortfall schedule, or advice on <em>Woolworths and Coles<\/em> [2025] FCA 1092, sees that peak-season pay runs fall short of award minimums, and leaves rosters and pay unchanged. At the $364 Commonwealth penalty unit effective 1 July 2026 (<em>Crimes Act 1914<\/em> (Cth) s 4AA), s 327A carries up to 10 years&#x27; imprisonment and fines set at the greater of three times the underpayment or 5,000 penalty units ($1,820,000) for individuals and 25,000 penalty units ($9,100,000) for body corporates.<\/p>\n<h2 id=\"payday-superannuation-from-1-july-2026-compounds\" class=\"doc-h2\">Payday superannuation from 1 July 2026 compounds every payroll error<\/h2>\n<p class=\"doc-p\">On 1 July 2026, the <em>Treasury Laws Amendment (Payday Superannuation) Act 2025<\/em> abolished quarterly superannuation cycles. Employers must ensure 12% Superannuation Guarantee (SG) on Qualifying Earnings clears into the employee&#x27;s fund within 7 business days of each payday. Where a faulty salary clause hides unpaid ordinary-hours loadings or public holiday rates that belong inside Qualifying Earnings, missing that 7-business-day clearing window triggers daily compounding Superannuation Guarantee Charge (SGC) interest and non-deductible administrative penalties on every pay cycle.<\/p>\n<h2 id=\"auditing-complex-payrolls-and-pursuing-multi-yea\" class=\"doc-h2\">Auditing complex payrolls and pursuing multi-year salaried claims<\/h2>\n<p class=\"doc-p\">If your unpaid overtime or penalty rates total less than $50,000, private legal fees will consume too much of your claim; run your shifts through our free Self-Help Award Calculator and file directly using our Form 5 Small Claims guide. Park &amp; Co&#x27;s complex employment practice acts for corporate employers and visa sponsors conducting privileged payroll audits and post-<em>Woolworths<\/em> contract restructures ahead of Fair Work Ombudsman inspections, and for salaried managers, chefs, or supervisors pursuing self-calculated multi-year shortfalls exceeding $50,000 to $200,000+ in the Federal Court. Send your contract and roster summary via the <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Employment Consultation Form<\/a> or visit the <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Official Links Hub<\/a>.<\/p>\n\n          <div class=\"col-sources-box\">\n            Primary Authorities: Fair Work Ombudsman v Woolworths Group Ltd; FWO v Coles Supermarkets Australia Pty Ltd [2025] FCA 1092 \u00b7 WorkPac v Rossato [2021] HCA 23 \u00b7 Fair Work Act 2009 (Cth) ss 327A, 535, 557C \u00b7 Fair Work Regulations 2009 regs 3.33\u20133.34 \u00b7 Payday Superannuation Act 2025 (eff. 1 July 2026).\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">WHEN TO CONSULT PARK &amp; CO LAWYERS \u00b7 EMPLOYMENT<\/span>\n            <h3 class=\"col-cta-title\">Facing a 21-Day Dismissal Deadline, Corporate Audit, or &gt;$50,000 / s 550 Claim?<\/h3>\n            <p class=\"col-cta-desc\">For modest &lt;$50k wage shortfalls, self-calculating with our free Award Calculator and 208-formula Excel protects 100% of your payout. Once your matter involves a 21-day dismissal bar, sponsor defence, or &gt;$50k / s 550 director exposure, submit our online consultation form.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">Open Employment Consultation Form<\/a>\n              <a href=\"../../files/EN/PDF/02_Employment_Underpayment_Self_Calculation_and_Evidence_Manual_2026_EN.pdf\" download class=\"col-btn-ghost\">Download Manual 02 (Employment PDF)<\/a>\n              <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">Park &amp; Co Official Consultation Hub<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">Legal Disclaimer: This publication provides general legal information grounded in the Fair Work Act 2009 (Cth), superannuation/migration statutes and Australian court authorities current as at November 2026. It does not constitute legal advice or create a solicitor-client relationship. Strict 21-day FWC limits apply.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">More Curated Employment Law Columns<\/h3>\n        <a href=\"../../?lang=en&amp;tab=employment\" class=\"col-back-link num\">\u2190 Back to Employment Self-Help Hub<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../director-accountant-liability-s550/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">DIRECTOR LIABILITY \u00b7 EMPLOYMENT 05<\/span><h4 class=\"col-sib-title\">Liquidating the Company Will Not Shield Directors or Accountants From s 550 Liability<\/h4><p class=\"col-sib-desc\">How FWA s 550 pierces insolvent corporate shells to reach directors, HR managers and external accountants who had actual knowledge of award breaches.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../sham-contracting-abn-s15aa/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ABN &amp; SHAM CONTRACTING \u00b7 EMPLOYMENT 06<\/span><h4 class=\"col-sib-title\">ABN Contractor or Employee? How Section 15AA Overturned High Court Contract Primacy<\/h4><p class=\"col-sib-desc\">Compares Dickerson [2025] FWC 2219, Crooks v Hyundai Rotem [2026] FWC 1104 and Barakat [2026] FWC 1941 across multi-year leave, penalty and super exposure.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../sponsored-worker-dismissal-482-186/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">VISA WORKER DISMISSALS \u00b7 EMPLOYMENT 07<\/span><h4 class=\"col-sib-title\">Dismissed on a Subclass 482 Visa: Managing the 21-Day FWC Bar, 180-Day Mobility Rule and Deed Traps<\/h4><p class=\"col-sib-desc\">How to structure FWC settlement deeds around new SID 482 nominations without breaking Subclass 186 TRT qualifying service or triggering visa cancellation.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../executive-dismissal-general-protections-restraints/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">EXECUTIVES &amp; RESTRAINTS \u00b7 EMPLOYMENT 08<\/span><h4 class=\"col-sib-title\">Executive Dismissals Above $190,100, General Protections Myths and Post-Employment Restraints<\/h4><p class=\"col-sib-desc\">Dissects Barclay subjective causation under s 361, executive notice/bonus claims, Supreme Court injunction risks, and upcoming federal non-compete reforms.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}}</script>

  function lastDays(n) {
    var p = today.split('-').map(Number), base = Date.UTC(p[0], p[1] - 1, p[2]), out = [];
    for (var i = n - 1; i >= 0; i--) {
      var s = new Date(base - i * 864e5).toISOString().slice(0, 10);
      if (s >= START) out.push(s);
    }
    return out.length ? out : [today];
  }

  var activeRange = 7;
  var modal = document.createElement('div');
  modal.id = 'vc-modal';
  modal.innerHTML = '<div class="vc-dialog" role="dialog" aria-modal="true" aria-labelledby="vc-modal-title">' +
    '<button type="button" class="vc-close" aria-label="Close">&times;</button>' +
    '<h3 id="vc-modal-title"></h3>' +
    '<div class="vc-body">Loading&hellip;</div></div>';
  document.body.appendChild(modal);
  syncCounterLang();

  function close() { modal.classList.remove('open'); }
  modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
  modal.querySelector('.vc-close').addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

  function copyShareLink(refCode, btnEl) {
    try {
      var u = new URL(location.href);
      u.searchParams.delete('utm_source');
      u.searchParams.set('ref', refCode);
      var text = u.toString();
      var done = function () {
        if (!btnEl) return;
        var prev = btnEl.getAttribute('data-orig') || btnEl.textContent;
        btnEl.setAttribute('data-orig', prev);
        btnEl.textContent = uiLang() === 'en' ? 'Copied ✓' : '복사됨 ✓';
        setTimeout(function () { btnEl.textContent = prev; }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () {});
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      }
    } catch (e) {}
  }

  modal.addEventListener('click', function (e) {
    var chip = e.target && e.target.closest ? e.target.closest('.vc-share-chip') : null;
    if (chip) {
      var rc = chip.getAttribute('data-ref-code');
      if (rc) copyShareLink(rc, chip);
      return;
    }
    var rbtn = e.target && e.target.closest ? e.target.closest('.vc-range-btn') : null;
    if (rbtn) {
      var nr = Number(rbtn.getAttribute('data-range')) || 7;
      if (nr !== activeRange) {
        activeRange = nr;
        loadAndRenderModal(false);
      }
    }
  });

  function renderShareBar(isEn) {
    var lbl = isEn
      ? 'Copy Tracked Referral Share Link (?ref=)'
      : '채널별 유입 측정 공유 링크 복사 (?ref=)';
    var chips = SHARE_CHANNELS.map(function (c) {
      var name = isEn ? c.en : c.ko;
      return '<button type="button" class="vc-share-chip" data-ref-code="' + c.ref + '">' +
        name + ' (?ref=' + c.ref + ')</button>';
    }).join('');
    return '<div id="vc-share-box" class="vc-share-box"><div class="vc-share-lbl">' + lbl +
      '</div><div class="vc-share-chips">' + chips + '</div></div>';
  }

  function renderToolbar(isEn, fullDaysLen) {
    if (fullDaysLen <= 7) return '';
    var b7 = '<button type="button" class="vc-range-btn' + (activeRange === 7 ? ' active' : '') + '" data-range="7">' +
      (isEn ? 'Last 7 days' : '최근 7일') + '</button>';
    var b30 = '<button type="button" class="vc-range-btn' + (activeRange === 30 ? ' active' : '') + '" data-range="30">' +
      (isEn ? 'Last 30 days' : '최근 30일') + '</button>';
    return '<div class="vc-toolbar"><div class="vc-range-tabs">' + b7 + b30 + '</div></div>';
  }

  function renderChartSvg(days, rows, isEn) {
    var W = 640, H = 240, L = 40, R = 12, T = 14, B = 38;
    var max = Math.max(1, Math.max.apply(null, rows.map(function (r) { return Math.max(r[0], r[1]); })));
    var step = (W - L - R) / days.length, bw = Math.min(36, Math.max(4, step * 0.6));
    var y = function (v) { return T + (H - T - B) * (1 - v / max); };
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="vc-svg" role="img" aria-label="Daily visits chart">';
    [0, 0.5, 1].forEach(function (f) {
      var v = Math.round(max * f), yy = y(v);
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" class="vc-grid"/>' +
        '<text x="' + (L - 6) + '" y="' + (yy + 4) + '" class="vc-ylab">' + fmt(v) + '</text>';
    });
    var pts = [];
    days.forEach(function (d, i) {
      var cx = L + step * i + step / 2, views = rows[i][0], vis = rows[i][1];
      svg += '<rect x="' + (cx - bw / 2) + '" y="' + y(views) + '" width="' + bw + '" height="' +
        (H - B - y(views)) + '" class="vc-bar"><title>' + d + ': ' + fmt(views) + (isEn ? ' page views' : '회 조회') + '</title></rect>';
      pts.push(cx + ',' + y(vis));
      if (days.length <= 10 || i % Math.ceil(days.length / 8) === 0 || i === days.length - 1)
        svg += '<text x="' + cx + '" y="' + (H - B + 16) + '" class="vc-xlab">' + d.slice(5) + '</text>';
    });
    svg += '<polyline points="' + pts.join(' ') + '" class="vc-line"/>';
    pts.forEach(function (p, i) {
      var xy = p.split(',');
      svg += '<circle cx="' + xy[0] + '" cy="' + xy[1] + '" r="3.5" class="vc-dot"><title>' + days[i] + ': ' +
        fmt(rows[i][1]) + (isEn ? ' visitors' : '명 방문자') + '</title></circle>';
    });
    svg += '</svg>';
    var sum = rows.reduce(function (a, r) { return [a[0] + r[0], a[1] + r[1]]; }, [0, 0]);
    var summaryLine = isEn
      ? (days.length + ' day(s) &middot; ' + fmt(sum[0]) + ' page views &middot; ' + fmt(sum[1]) + ' daily visitors (since ' + START + '; 1 daily visitor per browser).')
      : ('표시 구간 ' + days.length + '일 합계 &middot; 페이지 조회 ' + fmt(sum[0]) + '회 &middot; 일별 순방문자 ' + fmt(sum[1]) + '명 (' + START + ' 집계 시작 &middot; 하루 브라우저당 1회)');
    return svg + '<div class="vc-legend"><span><i class="vc-k-bar"></i>' + (isEn ? 'Page views' : '페이지 조회') + '</span>' +
      '<span><i class="vc-k-line"></i>' + (isEn ? 'Daily visitors' : '일별 순방문자') + '</span></div>' +
      '<p class="vc-sum">' + summaryLine + '</p>';
  }

  function loadTodayReferrers(dayKey) {
    if (liveTodayViews === 0 && liveTodayVis === 0) {
      return Promise.resolve({});
    }
    var out = {};
    var remaining = [];
    REF_BUCKETS.forEach(function (b) {
      if (typeof liveRefHints[b.id] === 'number') {
        out[b.id] = liveRefHints[b.id];
      } else {
        remaining.push(b);
      }
    });
    var firstSlice = remaining.slice(0, 6);
    var secondSlice = remaining.slice(6);
    return Promise.all(firstSlice.map(function (b) {
      return call('get', 'ref-' + b.id + '-' + dayKey).catch(function () { return 0; }).then(function (v) { out[b.id] = v || 0; });
    })).then(function () {
      return secondSlice.length ? delay(260) : Promise.resolve();
    }).then(function () {
      return Promise.all(secondSlice.map(function (b) {
        return call('get', 'ref-' + b.id + '-' + dayKey).catch(function () { return 0; }).then(function (v) { out[b.id] = v || 0; });
      }));
    }).then(function () {
      return out;
    });
  }

  function renderReferrerBox(countsMap) {
    var isEn = uiLang() === 'en';
    var items = REF_BUCKETS.map(function (b) {
      return { id: b.id, label: isEn ? b.en : b.ko, count: countsMap[b.id] || 0 };
    }).filter(function (x) { return x.count > 0; }).sort(function (a, b) { return b.count - a.count; });
    var totalRef = items.reduce(function (acc, x) { return acc + x.count; }, 0);
    var head = '<div class="vc-ref-title"><span>' +
      (isEn ? ('Today&rsquo;s Referral Channels (' + today + ')') : ('오늘 유입 채널 분포 (' + today + ')')) +
      '</span><small>' + (isEn ? ('Tracked visitors: ' + fmt(totalRef)) : ('채널 집계 방문자: ' + fmt(totalRef) + '명')) + '</small></div>';
    if (!items.length) {
      return head + '<p class="vc-ref-note">' +
        (isEn
          ? 'Anonymous referral channel buckets (Naver, Cafe, KakaoTalk, Threads, Hub, Direct) are recorded once per browser per day as new visits arrive (zero personal or URL path data stored).'
          : '익명 유입 경로(검색·카페·카카오톡·스레드·허브 이동 등) 집계는 신규 방문부터 하루 브라우저당 1회씩 기록돼요 (세부 URL·개인정보 미수집).') +
        '</p>';
    }
    var rowsHtml = items.map(function (item) {
      var pct = totalRef > 0 ? Math.round((item.count / totalRef) * 100) : 0;
      return '<div class="vc-ref-row">' +
        '<span class="vc-ref-name" title="' + item.label + '">' + item.label + '</span>' +
        '<div class="vc-ref-track"><div class="vc-ref-fill" style="width:' + Math.max(4, pct) + '%"></div></div>' +
        '<span class="vc-ref-val">' + fmt(item.count) + ' (' + pct + '%)</span>' +
        '</div>';
    }).join('');
    var note = isEn
      ? 'Privacy-safe coarse channel buckets only (1 per browser/day; zero IP, query string, or full referrer URL stored).'
      : '개인정보 보호형 채널 그룹 집계 (하루 브라우저당 1회 기준 &middot; 검색어·세부 URL·IP 미수집)';
    return head + '<div class="vc-ref-list">' + rowsHtml + '</div><p class="vc-ref-note">' + note + '</p>';
  }

  function loadHistoryRows(days) {
    var histCache = {};
    try { histCache = JSON.parse(localStorage.getItem(HIST_KEY) || '{}') || {}; } catch (e) {}
    var results = new Array(days.length);
    var pending = [];
    days.forEach(function (d, idx) {
      if (d < today && Array.isArray(histCache[d])) {
        results[idx] = histCache[d];
      } else if (d === today && typeof liveTodayViews === 'number' && typeof liveTodayVis === 'number') {
        results[idx] = [liveTodayViews, liveTodayVis];
      } else {
        pending.push({ d: d, idx: idx });
      }
    });

    var batchSize = pending.length > 7 ? 4 : 6;
    var pauseMs = pending.length > 7 ? 2900 : 180;
    var chain = Promise.resolve();
    for (var c = 0; c < pending.length; c += batchSize) {
      (function (slice, waitFirst) {
        chain = chain.then(function () {
          return (waitFirst ? delay(pauseMs) : Promise.resolve()).then(function () {
            return Promise.all(slice.map(function (item) {
              var k = item.d.replace(/-/g, '');
              var pViews = (item.d === today && typeof liveTodayViews === 'number')
                ? Promise.resolve(liveTodayViews)
                : call('get', 'day-' + k).catch(function () { return null; });
              var pVis = (item.d === today && typeof liveTodayVis === 'number')
                ? Promise.resolve(liveTodayVis)
                : call('get', 'vday-' + k).catch(function () { return null; });
              return Promise.all([pViews, pVis]).then(function (pair) {
                var v0 = pair[0] == null ? 0 : pair[0];
                var v1 = pair[1] == null ? 0 : pair[1];
                results[item.idx] = [v0, v1];
                if (item.d < today && pair[0] !== null && pair[1] !== null) {
                  histCache[item.d] = [v0, v1];
                }
              });
            }));
          });
        });
      })(pending.slice(c, c + batchSize), c > 0);
    }
    return chain.then(function () {
      try { localStorage.setItem(HIST_KEY, JSON.stringify(histCache)); } catch (e) {}
      return results.map(function (r) { return r || [0, 0]; });
    });
  }

  var cachedRefMap = null;

  function loadAndRenderModal(refreshRefs) {
    syncCounterLang();
    var isEn = uiLang() === 'en';
    var fullDays = lastDays(30);
    var days = activeRange === 7 ? lastDays(7) : fullDays;
    var body = modal.querySelector('.vc-body');
    var chartWaitMsg = isEn ? 'Loading daily statistics&hellip;' : '일별 통계를 불러오는 중이에요&hellip;';
    var refWaitMsg = isEn ? 'Loading today&rsquo;s referral channels&hellip;' : '오늘 유입 채널 집계를 불러오는 중이에요&hellip;';
    var existingRefHtml = (!refreshRefs && cachedRefMap) ? renderReferrerBox(cachedRefMap) : ('<div class="vc-ref-note">' + refWaitMsg + '</div>');

    /* Render toolbar, loading placeholder, referral box, and 1-click share bar IMMEDIATELY (0ms) */
    body.innerHTML = renderToolbar(isEn, fullDays.length) +
      '<div id="vc-chart-slot"><p class="vc-sum">' + chartWaitMsg + '</p></div>' +
      '<div id="vc-ref-box" class="vc-ref-box">' + existingRefHtml + '</div>' +
      renderShareBar(isEn);

    loadHistoryRows(days)
      .then(function (rows) {
        var slot = document.getElementById('vc-chart-slot');
        if (slot) slot.innerHTML = renderChartSvg(days, rows, uiLang() === 'en');
        if (!refreshRefs && cachedRefMap) return cachedRefMap;
        return delay(180).then(function () { return loadTodayReferrers(day); });
      })
      .then(function (refMap) {
        if (refMap) cachedRefMap = refMap;
        var refBox = document.getElementById('vc-ref-box');
        if (refBox && refMap) refBox.innerHTML = renderReferrerBox(refMap);
      })
      .catch(function () {
        var slot = document.getElementById('vc-chart-slot');
        if (slot && !slot.querySelector('svg')) {
          slot.textContent = uiLang() === 'en' ? 'Could not load the chart.' : '그래프를 불러오지 못했어요.';
        }
      });
  }

  function open() {
    activeRange = 7;
    modal.classList.add('open');
    loadAndRenderModal(true);
  }
  box.setAttribute('role', 'button');
  box.setAttribute('tabindex', '0');
  box.addEventListener('click', open);
  box.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
})();
  </script>
</body>
</html>
