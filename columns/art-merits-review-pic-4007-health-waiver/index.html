\uc0ac\uac74\uc5d0 \ub9de\ub294 \ub2e4\uc74c \ub2e8\uacc4 \uc810\uac80\ud558\uae30<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/220391469091053\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">\uc774\ubbfc\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../?lang=ko&amp;tab=immigration\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 \ube44\uc790\u00b7\uc774\ubbfc \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">\ub0b4\ubb34\ubd80 \ube44\uc790 \uac70\uc808 \ud1b5\uc9c0\uc11c\ub97c \uc950\uace0 \uc0c1\ub2f4\uc2e4 \ubb38\uc744 \uc5ec\uc2dc\ub294 \ubd84\ub4e4\uc740 \ud45c\uc815\ubd80\ud130 \uad73\uc5b4 \uacc4\uc138\uc694. \uc218\ub144\uac04 \uc77c\uad70 \ud638\uc8fc \uc0dd\ud65c\uc774 \ub2f9\uc7a5 \ubb34\ub108\uc9c8\uae4c \ubd10 \uc7a0\uc744 \uc124\uce5c \ucc44 \uc624\uc2dc\uac70\ub4e0\uc694. \uadf8\ub7f0\ub370 \uac70\uc808 \uc0ac\uc720\uc11c\ub97c \ucc28\ubd84\ud788 \uc77d\ub2e4 \ubcf4\uba74 \ubc18\uc804 \uc5ec\uc9c0\uac00 \uaf64 \ub9ce\uc544\uc694. \ud3ec\uae30\ud558\uae30\uc5d4 \uc544\uc9c1 \uc774\ub974\ub2e4\ub294 \ub73b\uc774\uc8e0. \ud638\uc8fc \ud589\uc815\uc7ac\uc2ec\uae30\uad6c(Administrative Review Tribunal \u00b7 ART)\uc740 \ubc95\ub9ac \uc624\ud574\ub9cc \ub530\uc9c0\ub294 \uc0c1\uace0\uc2ec\uacfc\ub294 \ub2ec\ub77c\uc694. \uc0ac\uac74\uc744 \ubc31\uc9c0\uc0c1\ud0dc\uc5d0\uc11c \ub2e4\uc2dc \uc0b4\ud53c\uace0 \uc0c8 \uc99d\uac70\uae4c\uc9c0 \ud3ed\ub113\uac8c \ubc1b\uc544 \ud310\ub2e8\ud558\ub294 \uc804\uba74 \uc0ac\uc2e4\uc2ec(de novo merits review) \uae30\uad00\uc774\uac70\ub4e0\uc694. \uc2b9\ud328\ub294 \ud1b5\uc9c0 \uc9c1\ud6c4 \uccab \uc77c\uc8fc\uc77c\uc758 \uc124\uacc4\uc5d0\uc11c \uac08\ub824\uc694. \ub2e4\uae09\ud55c \ub9c8\uc74c\uc5d0 \uac10\uc815 \ud638\uc18c\ubb38\ub9cc \ub35c\ucee5 \ub0c8\ub2e4\uac00 \ud328\uc18c \uc0ac\uc720\ub97c \uc2a4\uc2a4\ub85c \ub0a8\uae30\uae30\ub3c4 \ud558\uc8e0.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 382\" width=\"100%\" role=\"img\" aria-label=\"ART \uc7ac\uc2ec \uc2b9\ud328\ub97c \uac00\ub974\ub294 \uc2dc\uc810 \ubc95\ub9ac\uc640 $86,000 \uc758\ub8cc\ube44 \uac70\uc808 \ub300\uc751 \uc804\ub7b5\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"381\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">\ud589\uc815\uc7ac\uc2ec\uc6d0(ART $3,727) \ubcf8\uc548 \uc7ac\uc2ec \u00b7 $86,000 \uac74\uac15 \uc694\uac74(PIC 4005\u00b74007) \ub3cc\ud30c<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">ART \uc7ac\uc2ec \uc2b9\ud328\ub97c \uac00\ub974\ub294 \uc2dc\uc810 \ubc95\ub9ac\uc640 $86,000 \uc758\ub8cc\ube44 \uac70\uc808 \ub300\uc751 \uc804\ub7b5<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">\uadfc\uac70: ART Filing Fee $3,727 (2026.7.1) \u00b7 SCT $86,000 \u00b7 Robinson [2005] FCA 1626 \u00b7 Bui [1999] FCA 118<\/text>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"38\" y=\"115\" fon font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">\ud2b8\ub799 2 \u00b7 $86,000 \uac74\uac15 \uc694\uac74(MOC \uc18c\uacac) \uaca9\ud30c 2\ub300 \ubb34\uae30<\/text>\n  <circle cx=\"470\" cy=\"144\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ubb34\uae30 A \u00b7 Robinson \uc911\uc99d\ub3c4 \uac1c\ubcc4\ud654 \uc624\ub958 \uacf5\uaca9 (4005\u00b74007 \uacf5\ud1b5)<\/text>\n  <text x=\"482\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">\uc9c8\ud658\uba85 \ud3c9\uade0 \ube44\uc6a9\ub9cc \uae30\uacc4\uc801\uc73c\ub85c \ub300\uc785\ud55c MOC \uc18c\uacac\uc740 \uc704\ubc95 \ubb34\ud6a8 ([2005] FCA 1626).<\/text>\n  <circle cx=\"470\" cy=\"196\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ubb34\uae30 B \u00b7 PIC 4007(2) \uac74\uac15 \uba74\uc81c(Health Waiver) \ubc1c\ub3d9<\/text>\n  <text x=\"482\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">\ud30c\ud2b8\ub108\u00b7SID 482\u00b7186 TRT \ube44\uc790\ub294 \uace0\uc18c\ub4dd \ub0a9\uc138\u00b7\uac00\uc871 \uc720\ub300\ub85c \uba74\uc81c \uac00\ub2a5 (Bui).<\/text>\n  <circle cx=\"470\" cy=\"248\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">5\ub144(\uc601\uad6c \uc9c8\ud658 \ucd5c\ub300 10\ub144) \ube44\uc6a9 \uc0b0\uc2dd \uc815\ubc00 \ud574\ubd80<\/text>\n  <text x=\"482\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">\uc804\ubb38\uc758 \uae30\ub2a5\uc218\uc900 \uc18c\uacac\uc11c + \uc8fc\uc815\ubd80 \ud2b9\uc218\uad50\uc721\u00b7\uc57d\uc81c\ube44 \uc2e4\uc81c \ub2e8\uac00 \ubc18\ubc15.<\/text>\n  <rect x=\"22\" y=\"328\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"351\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1D6B48\">\ud575\uc2ec \uc870\uc5b8: \uc790\ub140 \ubc1c\ub2ec\uc9c0\uc5f0\u00b7\uc790\ud3d0\ub098 \ub9cc\uc131\uc9c8\ud658\uc73c\ub85c $86,000 \ucd08\uacfc \ud1b5\uc9c0\ub97c \ubc1b\uc544\ub3c4 \ud3ec\uae30\ud558\uc9c0 \ub9c8\uc138\uc694. MOC \uc0b0\uc2dd \uc624\ub958\uc640 4007 \uba74\uc81c\ub85c \ub4a4\uc9d1\ud788\ub294 \uc0ac\uac74\uc774 \ub9ce\uc2b5\ub2c8\ub2e4.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 1: \ud589\uc815\uc7ac\uc2ec\uae30\uad6c(ART) \uc7ac\uc2ec \uc2dc\uc810 \ubc95\ub9ac\uc640 $86,000 \uac74\uac15 \uc694\uac74(PIC 4005\u00b74007) \ub300\uc751 \uad6c\uc870<\/figcaption><\/figure>\n<h2 id=\"\ub2e8-1\ubd84\ub3c4-\ubd10\uc8fc\uc9c0-\uc54a\ub294-\ud589\uc815\uc7ac\uc2ec\uae30\uad6cart-\uc81c\uc18c-\uae30\ud55c\uacfc-\uc2dc\uc810\ubcc4-\uc694\uac74-\ubc95\ub9ac\" class=\"doc-h2\">\ub2e8 1\ubd84\ub3c4 \ubd10\uc8fc\uc9c0 \uc54a\ub294 \ud589\uc815\uc7ac\uc2ec\uae30\uad6c(ART) \uc81c\uc18c \uae30\ud55c\uacfc \uc2dc\uc810\ubcc4 \uc694\uac74 \ubc95\ub9ac<\/h2>\n<p class=\"doc-p\">\uac70\uc808 \ub808\ud130\ub97c \uc5f4\uc790\ub9c8\uc790 \ubcfc \uac83\uc740 \ub2ec\ub825\uacfc \uc2dc\uacc4\uc608\uc694. \ud638\uc8fc \ub0b4 \uc77c\ubc18 \ube44\uc790 \uac70\uc808\uc758 \uc7ac\uc2ec \uae30\ud55c\uc740 \ud1b5\uc0c1 \uc218\ub839\uc77c\ub85c\ubd80\ud130 28\uc77c\uc774\uc8e0. \ubc18\uba74 \ucde8\uc18c\ub098 \ube0c\ub9bf\uc9d5\u00b7\uad6c\uae08 \uc0ac\uac74\uc740 14\uc77c\u00b79\uc77c\u00b77\uc601\uc5c5\uc77c\ub85c \ud6e8\uc52c \uc9e7\uc544\uc694. \ubcd1\uc6d0 \uc785\uc6d0\uc774\ub098 \uce74\ub4dc \uc624\ub958\ub97c \ub9d0\ud558\uba74 \ud558\ub8e8\ucbe4 \ubd10\uc904\uae4c\uc694? \ub300\ub2f5\uc740 \ub0c9\ud639\ud574\uc694. \uc7ac\uc2ec \uae30\ud55c\uc5d0\ub294 \uc5f0\uc7a5 \uc7ac\ub7c9\uc774 \ub2e8 1%\ub3c4 \uc5c6\uac70\ub4e0\uc694. \ub2e8 1\ubd84\ub3c4 \uc608\uc678\uac00 \uc5c6\uc5b4\uc694. \ub9c8\uac10\uc744 \ub118\uae30\ub294 \uc21c\uac04 \uad00\ud560\uad8c(jurisdiction)\uc744 \uc601\uc6d0\ud788 \uc783\uc5b4\uc694. 2026\ub144 7\uc6d4 1\uc77c \uae30\uc900 \uc7ac\uc2ec \uc218\uc218\ub8cc\ub294 $3,727\uc608\uc694. \ub9c8\uac10\uc77c \ubc24 \uacb0\uc81c\uac00 \ub2a6\uc5b4\uc838 \uc601\uc8fc\uad8c\uc744 \ub0a0\ub9ac\ub294 \uc77c\uc774 \ud574\ub9c8\ub2e4 \uc0dd\uaca8\uc694.<\/p>\n<p class=\"doc-p\">\uae30\ud55c \ub0b4 \uc811\uc218\ub97c \ub9c8\ucce4\ub2e4\uba74 \uc2dc\uac04\ud45c\ubd80\ud130 \ubc1c\ub77c\ub0b4\uc57c \ud574\uc694. \ud638\uc8fc \uc774\ubbfc\ubc95(Migration Regulations 1994) \uc694\uac74\uc740 \ud06c\uac8c \ub450 \uae30\ub465\uc73c\ub85c \ub098\ub258\uac70\ub4e0\uc694. \ubc14\ub85c \uc2e0\uccad \uc2dc\uc810(time of application)\uacfc \uacb0\uc815 \uc2dc\uc810(time of decision) \uc694\uac74\uc774\uc5d0\uc694. \uc5f0\ub839 \uc0c1\ud55c\uc774\ub098 \uc811\uc218 \ub2f9\uc77c \ud544\uc218 \uc601\uc5b4 \uc810\uc218\u00b7\uae30\uc220\uc2ec\uc0ac\ucc98\ub7fc \uc2e0\uccad \uc2dc\uc810\uc5d0 \uace0\uc815\ub41c \uc694\uac74\uc774 \ucc98\uc74c\ubd80\ud130 \ube60\uc838 \uc788\uc5c8\ub2e4\uba74 \uc5b4\ub5a8\uae4c\uc694? \ub300\uae30 \uae30\uac04\uc5d0 \uc0c8 \uc810\uc218\ub97c \ub530\ub3c4 \uacfc\uac70 \uacb0\ud568\uc744 \uba54\uc6b8 \uae38\uc774 \uc5c6\uc5b4\uc694. \ubc18\ub300\ub85c \uad00\uacc4 \uc9c0\uc18d\uc131\uc774\ub098 \uc7ac\uc815 \ub2a5\ub825\u00b7\uac74\uac15 \uba74\uc81c \uc0ac\uc720\ub294 \uacb0\uc815 \uc2dc\uc810\uc744 \uae30\uc900\uc73c\ub85c \uc2ec\uc0ac\ud574\uc694. \uc2ec\ub9ac\uae30\uc77c\uae4c\uc9c0 \uc313\uc740 \ud0c4\ud0c4\ud55c \uc2e0\uaddc \uc99d\uac70\ub85c 1\ucc28 \uac70\uc808 \ub17c\ub9ac\ub97c \uc815\uba74\uc5d0\uc11c \ub4a4\uc9d1\uc744 \uc218 \uc788\uc8e0.<\/p>\n<h2 id=\"\ub178\ubbf8\ub124\uc774\uc158\uc774-\ubb34\ub108\uc9c4-\uc2a4\ud3f0\uc11c-\ube44\uc790-\uac70\uc808\uacfc-\ub2e8\ub3c5-\uc7ac\uc2ec\uc758-\ud568\uc815\" class=\"doc-h2\">\ub178\ubbf8\ub124\uc774\uc158\uc774 \ubb34\ub108\uc9c4 \uc2a4\ud3f0\uc11c \ube44\uc790 \uac70\uc808\uacfc \ub2e8\ub3c5 \uc7ac\uc2ec\uc758 \ud568\uc815<\/h2>\n<p class=\"doc-p\">\uace0\uc6a9\uc8fc \uc2a4\ud3f0\uc11c \ube44\uc790(SID Subclass 482 \u00b7 Subclass 186)\uc5d0\uc11c\ub294 \uc5f0\uacb0\uace0\ub9ac \uc810\uac80\uc774 \ud544\uc218\uc608\uc694. \ud68c\uc0ac\uc758 \ub178\ubbf8\ub124\uc774\uc158(Nomination) \uac70\uc808\ub85c \uadfc\ub85c\uc790 \ube44\uc790\uae4c\uc9c0 \uc5f0\ub2ec\uc544 \uac70\uc808\ub418\ub294 \uc0ac\ub840\uac00 \uc815\ub9d0 \ud754\ud558\uac70\ub4e0\uc694. \uc774\ub54c \ud68c\uc0ac\ub294 \ube44\uc6a9 \ubd80\ub2f4\uc5d0 \ubd88\ubcf5\uc744 \ud3ec\uae30\ud574 \ubc84\ub824\uc694. \uccb4\ub958\uac00 \uae09\ud55c \uadfc\ub85c\uc790\ub9cc \ud640\ub85c \ubcf8\uc778 \ube44\uc790 \uc7ac\uc2ec\uc744 \uac78\uc5b4 \ub450\uace4 \ud558\uc8e0.<\/p>\n<p class=\"doc-p\">\uc774\ub7f0 \ubc18\ucabd\uc9dc\ub9ac \ub2e8\ub3c5 \uc7ac\uc2ec\uc740 \ub9c9\ub2e4\ub978 \uace8\ubaa9\uacfc \uac19\uc544\uc694. \uc774\uc720\uac00 \ubb58\uae4c\uc694? \uc2a4\ud3f0\uc11c \ube44\uc790\uac00 \uc2b9\uc778\ub418\ub824\uba74 \uc7ac\uc2ec \uacb0\uc815 \uc21c\uac04\uc5d0 \uc0b4\uc544 \uc788\ub294 \uc2b9\uc778 \ub178\ubbf8\ub124\uc774\uc158 \uace0\ub9ac\uac00 \ubc18\ub4dc\uc2dc \ub9de\ubb3c\ub824\uc57c \ud558\uac70\ub4e0\uc694. \ubfcc\ub9ac\uac00 \ub418\ub294 \ub178\ubbf8\ub124\uc774\uc158 \uac70\uc808\uc744 \ud568\uaed8 \ub2e4\ud22c\uc5b4 \uc0b4\ub824\ub0b4\uac70\ub098 \uc801\ubc95\ud55c \ub300\uccb4 \uc2a4\ud3f0\uc11c\uc2ed \uacbd\ub85c\ub97c \ud655\ubcf4\ud558\uc9c0 \ubabb\ud55c \ucc44 \ube44\uc790 \uc7ac\uc2ec\ub9cc \ub4e4\uace0 \ub4e4\uc5b4\uac00\uba74 \uc7ac\uc2ec \uc704\uc6d0\uc5d0\uac8c\ub3c4 \uc2b9\uc778 \uad8c\ud55c\uc774 \uc5c6\uc5b4\uc694. \ub0b4 \ube44\uc790 \uacb0\uc815\ubb38\ub9cc \uc77d\uc744 \ub54c\uac00 \uc544\ub2c8\uc5d0\uc694. \ud68c\uc0ac \ub178\ubbf8\ub124\uc774\uc158 \uc7ac\uc2ec \uacc4\ub958 \uc5ec\ubd80\uc640 \uc601\uc5c5 \uc720\uc9c0 \uc0c1\ud0dc\ubd80\ud130 \ud55c \ubb36\uc74c\uc73c\ub85c \uc0b4\ud3b4\uc57c \ud574\uc694.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">\ud575\uc2ec \uc7c1\uc810 \uad6c\ubd84<\/th><th style=\"text-align:left\">\uc801\uc6a9 \uaddc\uc815\u00b7\uc218\uce58 \ubc0f \uc8fc\uc694 \ud310\ub840<\/th><th style=\"text-align:left\">\uc2e4\ubb34\uc0c1 \uce58\uba85\uc801 \ud568\uc815\uacfc \ub3cc\ud30c \uc804\ub7b5<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>ART \uc81c\uc18c \uae30\ud55c<\/strong><\/td><td style=\"text-align:left\">\uc77c\ubc18 \uac70\uc808 28\uc77c (\ucde8\uc18c\u00b7\uad6c\uae08 7~14\uc601\uc5c5\uc77c) \u00b7 \uc218\uc218\ub8cc $3,727 (2026.07.01)<\/td><td style=\"text-align:left\">\uc5f0\uc7a5 \uc7ac\ub7c9 0% (1\ubd84 \ub3c4\uacfc \uc2dc \uad00\ud560 \uc0c1\uc2e4) \u00b7 \ud1b5\uc9c0 \uc218\ub839\uc77c \uc989\uc2dc \ud2b9\uc815<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc2e0\uccad \ub300 \uacb0\uc815 \uc2dc\uc810<\/strong><\/td><td style=\"text-align:left\">Migration Regulations 1994 \uc2dc\uc810\ubcc4 \uc694\uac74 \ubd84\ub9ac<\/td><td style=\"text-align:left\">\uc2e0\uccad \uc2dc\uc810 \uacb0\ud568\uc740 \ubcf4\uc644 \ubd88\uac00 \u00b7 \uacb0\uc815 \uc2dc\uc810 \uc99d\uac70 \ubc0f 482 \ub178\ubbf8\ub124\uc774\uc158 \ubcf5\uc6d0<\/td><\/tr><tr><td style=\"text-align:left\"><strong>$86,000 \uac74\uac15 \uae30\uc900\uc120<\/strong><\/td><td style=\"text-align:left\">reg 2.25A \uc5f0\ubc29\uc758\ubb34\uad00(MOC) \u00b7 \uae30\uc900\uc561 $86,000 (5\ub144 / 75\uc138+ 3\ub144 / \ucd5c\ub300 10\ub144)<\/td><td style=\"text-align:left\">\uc9c4\ub2e8\uba85\ub9cc\uc73c\ub85c \ud2b9\uc218\uad50\uc721\u00b7\uc758\ub8cc\ube44\ub97c \uacfc\ub2e4 \ucd94\uc0b0\ud55c \uae30\uacc4\uc801 \uc0b0\uc815 \uac10\ubcc4<\/td><\/tr><tr><td style=\"text-align:left\"><strong>PIC 4005 \ube44\uc790<\/strong><\/td><td style=\"text-align:left\">\uba74\uc81c \uc5c6\uc74c (189\u00b7190\u00b7186 DE) \u00b7 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2005/1626.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Robinson<\/em> [2005] FCA 1626<\/a> ([39]\u2013[43])<\/td><td style=\"text-align:left\">\uc2e4\uc81c \uc911\uc99d\ub3c4 \ub204\ub77d MOC \uc18c\uacac\uc740 \uad00\ud560\uad8c \uc77c\ud0c8 \ubb34\ud6a8 \u00b7 \uacbd\uc99d \uae30\ub2a5 \uac10\uc815 \ud0c4\ud575<\/td><\/tr><tr><td style=\"text-align:left\"><strong>PIC 4007 \ube44\uc790<\/strong><\/td><td style=\"text-align:left\">PIC 4007(2) \uba74\uc81c (820\u00b7SID 482\u00b7186 TRT) \u00b7 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/1999/118.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Bui<\/em> [1999] FCA 118<\/a><\/td><td style=\"text-align:left\">\uac00\uc871 \uc720\ub300\u00b7\uace0\uc219\ub828 \ub0a9\uc138\u00b7\ubbfc\uac04 \ub3cc\ubd04 \uc7ac\ub825\uc73c\ub85c \uacfc\ub3c4\ud55c \ube44\uc6a9(undue) \ubd80\uc815<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"86000-\uac74\uac15-\uae30\uc900\uc120sct\uacfc-\uc758\ubb34\uad00-\uc18c\uacac\uc744-\uae68\ub294-robinson-\ubc95\ub9ac\" class=\"doc-h2\">$86,000 \uac74\uac15 \uae30\uc900\uc120(SCT)\uacfc \uc758\ubb34\uad00 \uc18c\uacac\uc744 \uae68\ub294 Robinson \ubc95\ub9ac<\/h2>\n<p class=\"doc-p\">\uc2e0\uccb4\uac80\uc0ac \ub2e8\uacc4\uc5d0\uc11c \ubc1c\ubaa9 \uc7a1\ud788\ub294 \uac00\uc871\ub3c4 \ucc38 \ub9ce\uc544\uc694. \uc790\ub140\uc758 \uc790\ud3d0 \uc2a4\ud399\ud2b8\ub7fc\u00b7\ubc1c\ub2ec \uc9c0\uc5f0\uc774\ub098 \uc2e0\uccad\uc778\uc758 \ub9cc\uc131 \uc9c8\ud658\uc774 \ud655\uc778\ub418\uba74 \ub0b4\ubb34\ubd80\ub294 reg 2.25A\uc5d0 \ub530\ub77c \uc5f0\ubc29\uc758\ubb34\uad00(MOC)\uc5d0\uac8c \ube44\uc6a9 \ud3c9\uac00\ub97c \ub118\uae30\uc8e0. 2026\ub144 11\uc6d4 \ud604\uc7ac \ud638\uc8fc\uc758 \uc911\ub300 \ube44\uc6a9 \uae30\uc900\uc120(SCT)\uc740 $86,000\uc608\uc694. \uc784\uc2dc\ube44\uc790\ub294 \uc608\uc815 \uccb4\ub958 \uae30\uac04\uc744 \uae30\uc900\uc73c\ub85c \uc0bc\uc544\uc694. \uc601\uc8fc\ube44\uc790\ub294 \uc6d0\uce59 5\ub144(75\uc138 \uc774\uc0c1 3\ub144 \u00b7 \uc601\uad6c \uc9c0\uc18d \uc9c8\ud658 \ucd5c\ub300 10\ub144) \ub3d9\uc548 \uc608\uc0c1\ub418\ub294 \uacf5\uc801 \uc758\ub8cc\u00b7\ud2b9\uc218\uad50\uc721\u00b7\uc7a5\uc560 \ubcf5\uc9c0\ube44\ub97c \ud569\uc0b0\ud574 $86,000\ub97c \ub118\uae30\uba74 \ubd80\uc801\ud569 \uc18c\uacac\uc774 \ub0b4\ub824\uc838\uc694.<\/p>\n<p class=\"doc-p\">\ub3c5\ub9bd\uae30\uc220(189)\uc774\ub098 \uc8fc\uc815\ubd80 \ub2f4\ubcf4(190)\u00b7\uc9c1\uc811\uc601\uc8fc\uad8c(186 DE) \uac19\uc740 PIC 4005 \ube44\uc790\uc5d0\ub294 \uac74\uac15 \uba74\uc81c \uc870\ud56d\uc774 \uc544\uc608 \uc5c6\uc5b4\uc694. \uadf8\ub798\uc11c \uc9c0\ub808 \ud3ec\uae30\ud558\uae30 \uc27d\uc8e0. \ubc14\ub85c \uc5ec\uae30\uc11c \uae38\uc744 \uc5ec\ub294 \ubb34\uae30\uac00 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2005/1626.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Robinson v Minister for Immigration and Multicultural and Indigenous Affairs<\/em> [2005] FCA 1626<\/a> ([39]\u2013[43]) \ud310\uacb0\uc774\uc5d0\uc694. \uc5f0\ubc29\ubc95\uc6d0\uc740 \uc758\ubb34\uad00\uc774 \ud3ec\uad04\uc801 \uc9c4\ub2e8\uba85\ub9cc \ubcf4\uace0 \ud3c9\uade0 \ud658\uc790 \ube44\uc6a9\ud45c\ub97c \uae30\uacc4\uc801\uc73c\ub85c \ub300\uc785\ud588\ub2e4\uba74 \uad00\ud560\uad8c \uc77c\ud0c8\uc758 \uc704\ubc95(jurisdictional error)\uc774\ub77c\uace0 \ubabb \ubc15\uc558\uc5b4\uc694. \ub2f9\uc0ac\uc790 \uc9c8\ud658\uc758 \uad6c\uccb4\uc801 \ud615\ud0dc\uc640 \uc2e4\uc81c \uc911\uc99d\ub3c4(specific form or level of severity)\ub97c \uba3c\uc800 \ud2b9\uc815\ud574\uc57c \uc801\ubc95\ud55c \uc18c\uacac\uc73c\ub85c \uc778\uc815\ub3fc\uc694. \uc704\ubc95\ud55c \uc18c\uacac\uc740 \uc7ac\uc2ec\uc6d0\uc744 \uad6c\uc18d\ud558\uc9c0 \ubabb\ud558\uac70\ub4e0\uc694. \uc804\ubb38\uc758\uc640 \uce58\ub8cc\uc0ac\uc758 \uac1d\uad00\uc801 \uacbd\uc99d \uae30\ub2a5 \ud3c9\uac00\uc11c\ub85c \uc804\uc81c \uc624\ub958\ub97c \ud0c0\uaca9\ud558\uba74 \uba74\uc81c \uc5c6\ub294 PIC 4005 \ube44\uc790\ub3c4 \uc0b4\uc544\ub0a0 \uc218 \uc788\uc5b4\uc694.<\/p>\n<h2 id=\"pic-40072-\uac74\uac15-\uc694\uac74-\uba74\uc81c-\uc2b9\ud328\ub97c-\uac00\ub974\ub294-bui-\ud615\ub7c9-\uacf5\uc2dd\" class=\"doc-h2\">PIC 4007(2) \uac74\uac15 \uc694\uac74 \uba74\uc81c \uc2b9\ud328\ub97c \uac00\ub974\ub294 Bui \ud615\ub7c9 \uacf5\uc2dd<\/h2>\n<p class=\"doc-p\">\ud30c\ud2b8\ub108\ube44\uc790(820/801)\ub098 \uc2a4\ud3f0\uc11c \ube44\uc790(SID 482 \u00b7 186 TRT)\ub294 \uc5b4\ub5a8\uae4c\uc694? \ub2e4\ud589\ud788 \ub450 \ubc88\uc9f8 \ubb38\uc774 \uc5f4\ub824 \uc788\uc5b4\uc694. \uc124\ub839 $86,000 \ucd08\uacfc \uc18c\uacac\uc774 \uc801\ubc95\ud558\ub354\ub77c\ub3c4 PIC 4007(2) \uac74\uac15 \uc694\uac74 \uba74\uc81c(Health Waiver)\ub97c \uccad\uad6c\ud560 \uc218 \uc788\uac70\ub4e0\uc694. \uc774 \uc2ec\uc0ac\uc758 \uae30\uc900\uc810\uc774 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/1999/118.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Bui v Minister for Immigration &amp; Multicultural Affairs<\/em> [1999] FCA 118<\/a> \ud310\uacb0\uc774\uc5d0\uc694.<\/p>\n<p class=\"doc-p\"><em>Bui<\/em> \ubc95\ub9ac\uc758 \uc694\uc9c0\ub294 \uba85\ucf8c\ud574\uc694. \ube44\uc790 \uc2b9\uc778\uc774 \ud638\uc8fc \uc0ac\ud68c\uc5d0 \uacfc\ub3c4\ud55c \ube44\uc6a9(undue cost)\uc774\ub098 \uc758\ub8cc\u00b7\ubcf5\uc9c0 \uc811\uadfc\uad8c \uce68\ud574\ub97c \ubd80\ub974\uc9c0 \uc54a\ub294\ub2e4\uba74 \uacb0\uc815 \uc2dc\uc810 \uc7ac\ub7c9\uc73c\ub85c \uac74\uac15 \uc694\uac74\uc744 \uba74\uc81c\ud560 \uc218 \uc788\uc5b4\uc694. \uacfc\ub3c4\ud568 \uc5ec\ubd80\ub97c \uc7ac\ub294 \uc800\uc6b8\uc740 \uc785\uccb4\uc801\uc774\uc5d0\uc694. \ud55c\ucabd\uc5d0\ub294 \ucd94\uc0b0\ub41c \uacf5\uc801 \ube44\uc6a9\uc744 \uc62c\ub9ac\uace0 \ubc18\ub300\ucabd\uc5d0\ub294 \uc2dc\ubbfc\uad8c\u00b7\uc601\uc8fc\uad8c \uac00\uc871 \uc720\ub300\uc640 \uace0\uc18c\ub4dd \ub0a9\uc138 \uae30\uc5ec\uc561 \ubc0f \ubbfc\uac04 \uc7ac\ud65c \ube44\uc6a9\uc744 \uac10\ub2f9\ud560 \uc790\uc0b0 \uc5ec\ub825\uacfc \uc9c0\uc5ed\uc0ac\ud68c \uacf5\uc775\uc744 \ud568\uaed8 \uc62c\ub824 \uc800\uc6b8\uc9c8\ud558\uc8e0. \ub300\uae30 \uc911 \uc544\uc774\uac00 \uc815\uaddc \ud559\uae09\uc5d0 \uc798 \uc801\uc751\ud588\uac70\ub098 \ubd80\ubaa8 \uc18c\ub4dd\uc774 \ub298\uc5c8\ub2e4\uba74 \uadf8 \ubcc0\ud654\uac00 \uba74\uc81c \uc2b9\uc778\uc758 \uc5f4\uc1e0\uac00 \ub3fc\uc694.<\/p>\n<h2 id=\"\ub0b4-\uc0ac\uac74\uc5d0-\ub9de\ub294-\ub2e4\uc74c-\ub2e8\uacc4-\uc810\uac80\ud558\uae30\" class=\"doc-h2\">\ub0b4 \uc0ac\uac74\uc5d0 \ub9de\ub294 \ub2e4\uc74c \ub2e8\uacc4 \uc810\uac80\ud558\uae30<\/h2>\n<p class=\"doc-p\">\uac70\uc808 \uacb0\uc815\ubb38\uc774\ub098 PIC 4005\u00b74007 \uc18c\uba85 \ud1b5\uc9c0\ub97c \ubc1b\uc73c\uc168\ub2e4\uba74 \ud0c4\uc6d0\uc11c\ubcf4\ub2e4 \ubc95\uc801 \uad6c\uc870 \ud574\ubd80\uac00 \uba3c\uc800\uc608\uc694. \uc81c\uc18c \uc2dc\ud55c\uacfc \ub178\ubbf8\ub124\uc774\uc158 \uc5f0\uc1c4 \uac70\uc808 \ubc0f $86,000 \uac74\uac15 \ube44\uc6a9 \ucd08\uacfc\uac00 \uc5bd\ud78c \ubcf5\uc7a1\ud55c \uc0ac\uac74\uc77c\uc218\ub85d \uccab \ubc29\ud5a5\uc774 \uc2b9\ud328\ub97c \uac00\ub974\uac70\ub4e0\uc694. \ucd08\uae30 \uc704\uae30 \ub300\uc751 \uc218\uce59\uc740 \ubc15\uc564\ucf54 \uae34\uae09 \ucc3d\uad6c(<a href=\"https://parklawyers.com.au/case-emergency/visa/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ube44\uc790 \uac70\uc808\u00b7\ucde8\uc18c \uae34\uae09 \ub300\uc751 \ud5c8\ube0c<\/a>)\uc5d0\uc11c \ubc14\ub85c \ubcf4\uc2e4 \uc218 \uc788\uc5b4\uc694. \uc815\ubc00 \uc2b9\uc18c \uc124\uacc4\uac00 \ud544\uc694\ud558\uc2dc\ub2e4\uba74 \uc628\ub77c\uc778 \uc9c8\ubb38\uc9c0(<a href=\"https://form.jotform.com/220391469091053\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\uc774\ubbfc\u00b7\ube44\uc790 \uc0ac\uc548 \uc811\uc218 \ubc14\ub85c\uac00\uae30<\/a>)\ub098 \uacf5\uc2dd \ud1b5\ud569 \ucc3d\uad6c(<a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ubc15\uc564\ucf54 \uacf5\uc2dd \ub9c1\ud06c \ud5c8\ube0c<\/a>)\ub85c \uacb0\uc815\ubb38 \uc218\ub839\uc77c\uacfc \ube44\uc790 \uc885\ub958\ub97c \ub0a8\uaca8 \uc8fc\uc138\uc694. \ud038\uc990\ub79c\ub4dc\uc8fc \ubcc0\ud638\uc0ac\ud611\ud68c \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac(Accredited Specialist in Immigration Law (QLS)) \uae30\uc900\uc73c\ub85c \ud655\uc2e4\ud55c \ub3cc\ud30c \uacbd\ub85c\ub97c \uc9da\uc5b4 \ub4dc\ub9b4\uac8c\uc694.<\/p>\n\n          <div class=\"col-sources-box\">\n            \uadfc\uac70 \ubc95\ub839 \ubc0f \ud310\ub840: Administrative Review Tribunal Act 2024 \u00b7 Migration Act 1958 Part 5 \u00b7 Migration Regulations 1994 reg 2.25A, Sch 4 PIC 4005 &amp; PIC 4007 \u00b7 Robinson v MIMIA [2005] FCA 1626 \u00b7 Bui v MIMA [1999] FCA 118.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#E6C98C;\">QLS \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac \ub3c4\uc6c0\uc774 \uaf2d \ud544\uc694\ud55c \uc21c\uac04<\/span>\n            <h3 class=\"col-cta-title\">\uc774\ubbfc\uc131 \uc18c\uba85 \uc694\uccad(s 57)\u00b7\ube44\uc790 \ucde8\uc18c \ud1b5\uc9c0(NOICC)\u00b7\ud589\uc815\uc7ac\uc2ec\uae30\uad6c(ART) \uc7ac\uc2ec \ub9c8\uac10 \uae30\ud55c\uc774 \ud750\ub974\uace0 \uc788\uac70\ub098 \ud68c\uc0ac \uc2a4\ud3f0\uc11c\uc2ed\uc744 \uc900\ube44 \uc911\uc774\uc2ed\ub2c8\uae4c?<\/h3>\n            <p class=\"col-cta-desc\">\uc774\ubbfc\uc131 \ub2f5\ubcc0 \uae30\ud55c\uacfc \ud589\uc815\uc7ac\uc2ec\uae30\uad6c(ART) \uc7ac\uc2ec \uc811\uc218 \uae30\ud55c\uc740 \ub2e8 \ud558\ub8e8\ub3c4 \ub2a6\ucd9c \uc218 \uc5c6\uc2b5\ub2c8\ub2e4. \ubc1b\uc73c\uc2e0 \ud1b5\uc9c0\ubb38(Decision Record / s 57 / NOICC)\uc774\ub098 \ud68c\uc0ac \uc2a4\ud3f0\uc11c\uc2ed \ub0b4\uc6a9\uc744 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\uc5d0 \uc62c\ub824 \uc8fc\uc2dc\uba74 \ud574\uacb0 \ubc29\ud5a5\uc744 \ube60\ub974\uac8c \uc9da\uc5b4 \ub4dc\ub9bd\ub2c8\ub2e4.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/220391469091053\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">\uc774\ubbfc\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../files/KO/PDF/01_Immigration_Self_Diagnosis_and_Official_Forms_Manual_2026_KO.pdf\" download class=\"col-btn-ghost\">01 \ube44\uc790 \uc11c\ub958\u00b7\uc18c\uba85 \uc810\uac80 \uc694\uc57d PDF \ubc1b\uae30<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">\ubc15\uc564\ucf54 \uacf5\uc2dd \uc0c1\ub2f4 \ub9c1\ud06c \ud5c8\ube0c<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">\ubc95\ub960 \uc548\ub0b4: \uc774 \uce7c\ub7fc\uc740 \ud638\uc8fc \uc774\ubbfc\ubc95(Migration Act 1958), \uc774\ubbfc\uaddc\uc815, \uc7a5\uad00\ud6c8\ub839 \uc81c123\ud638\uc640 \ubc95\uc6d0 \ud310\ub840\ub97c \ubc14\ud0d5\uc73c\ub85c \uc54c\uae30 \uc27d\uac8c \uc815\ub9ac\ud55c \uc77c\ubc18 \ubc95\ub960 \uc815\ubcf4\uc785\ub2c8\ub2e4. \uac1c\ubcc4 \uc0ac\uac74\uc5d0 \ub300\ud55c \ubc95\ub960 \uc790\ubb38\uc774\ub098 \uc218\uc784 \uacc4\uc57d \uc131\ub9bd\uc744 \ub73b\ud558\uc9c0 \uc54a\uc73c\ubbc0\ub85c \ube44\uc790 \ub9cc\ub8cc\uc77c\uc774\ub098 \uc7ac\uc2ec \ub9c8\uac10\uc77c \uc804\uc5d0 \uaf2d \uc804\ubb38\ubcc0\ud638\uc0ac\uc758 \uc9c4\ub2e8\uc744 \ubc1b\uc544 \ubcf4\uc2dc\uae30 \ubc14\ub78d\ub2c8\ub2e4.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">\ud568\uaed8 \uc77d\uc73c\uba74 \uc88b\uc740 \uc774\ubbfc\ubc95 \ud310\ub840 \uce7c\ub7fc<\/h3>\n        <a href=\"../../?lang=ko&amp;tab=immigration\" class=\"col-back-link num\">\u2190 \ube44\uc790\u00b7\uc774\ubbfc \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../pic-4020-s57-bogus-documents-withdrawal/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PIC 4020 \uc18c\uba85 \u00b7 \uc774\ubbfc\ubc95 \uce7c\ub7fc 09<\/span><h4 class=\"col-sib-title\">PIC 4020 \uc18c\uba85 \ub808\ud130(s 57)\ub97c \ubc1b\uc558\uc744 \ub54c \ube44\uc790\ub9cc \ucde8\ud558\ud558\uba74 3\ub144 \uc785\uad6d\uae08\uc9c0\ub97c \ud53c\ud560 \uc218 \uc788\uc744\uae4c<\/h4><p class=\"col-sib-desc\">\uacfc\uac70 \ub300\ud589\uc0ac \uacfc\uc2e4\uc774\ub098 \uacbd\ub825 \uc99d\ube59 \ubb38\uc81c\ub85c \uc18c\uba85 \uc694\uad6c(s 57)\ub97c \ubc1b\uc558\uc744 \ub54c \uc131\uae09\ud788 \ube44\uc790\ub97c \ucde8\ud558\ud558\uba74 \ube0c\ub9ac\uc9d5\ube44\uc790\uac00 \uc18c\uba78\ud558\uace0 \uc804\uc0b0 \ud50c\ub798\uadf8\ub9cc \ub0a8\ub294 \uc774\uc720\ub97c \uc124\uba85\ud569\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../noicc-visa-cancellation-direction-123/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ube44\uc790\ucde8\uc18c\u00b7\ud6c8\ub839 123\ud638 \u00b7 \uc774\ubbfc\ubc95 \uce7c\ub7fc 10<\/span><h4 class=\"col-sib-title\">\uc720\uc8c4 \ud310\uacb0 \uc804 \uae30\uc18c\ub9cc\uc73c\ub85c \ube44\uc790 \ucde8\uc18c \uc608\uace0(NOICC)\uac00 \uc624\ub294 \uc774\uc720\uc640 2026\ub144 10\uc6d4 \uc7a5\uad00\ud6c8\ub839 \uc81c123\ud638 \uae34\uae09 \ubd84\uc11d<\/h4><p class=\"col-sib-desc\">\uacbd\ucc30 \uc870\uc0ac\ub97c \ubc1b\uc740 \uc9c1\ud6c4 \ub0a0\uc544\uc628 \ube44\uc790 \ucde8\uc18c \uc608\uace0\uc7a5(NOICC)\uc5d0 \uc123\ubd88\ub9ac \ubc18\uc131\ubb38\ubd80\ud130 \ub0b4\uba74 \uc65c \ud615\uc0ac \uc7ac\ud310\uacfc \ube44\uc790 \ubaa8\ub450 \uc704\ud5d8\ud574\uc9c0\ub294\uc9c0 \ucd5c\uc2e0 \uc7a5\uad00\ud6c8\ub839 123\ud638 \uae30\uc900\uc73c\ub85c \uc124\uba85\ud569\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../corporate-nomination-genuine-position-csit/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uae30\uc5c5\uc2a4\ud3f0\uc11c \ub178\ubbf8\ub124\uc774\uc158 \u00b7 \uc774\ubbfc\ubc95 \uce7c\ub7fc 11<\/span><h4 class=\"col-sib-title\">\ucd5c\uc800\uc5f0\ubd09 $79,423(CSIT)\ub9cc \ub9de\ucd94\uba74 \ub05d\uc77c\uae4c: SID 482\u00b7186 \ub178\ubbf8\ub124\uc774\uc158 \uac70\uc808 1\uc704 &#x27;\uc9c4\uc815\ud55c \uc9c1\uc704&#x27;\uc640 ABN \ubcc0\uacbd\uc758 \ub36b<\/h4><p class=\"col-sib-desc\">\uc218\ucc9c \ub2ec\ub7ec \ud6c8\ub828\ubd80\ub2f4\uae08(SAF)\uc744 \ub0a0\ub9ac\uc9c0 \uc54a\uc73c\ub824\uba74 \uc811\uc218 \uc804 \ubb34\uc5c7\uc744 \ubd10\uc57c \ud558\ub294\uc9c0, \ud68c\uc0ac \ub9e4\ucd9c \uaddc\ubaa8\uc640 \uc870\uc9c1\ub3c4 \uc810\uac80\ubd80\ud130 ABN \ubcc0\uacbd \ub54c \uc0dd\uae30\ub294 \ud568\uc815\uae4c\uc9c0 \uc27d\uac8c \ud480\uc5b4 \ub4dc\ub9bd\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../schedule-3-waiver-section-48-partner-visa/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc624\ubc84\uc2a4\ud14c\uc774\u00b7Schedule 3 \u00b7 \uc774\ubbfc\ubc95 \uce7c\ub7fc 12<\/span><h4 class=\"col-sib-title\">\ube44\uc790 \uac70\uc808\u00b7\uc624\ubc84\uc2a4\ud14c\uc774 \ud6c4 \ud638\uc8fc \uc548\uc5d0\uc11c \ud30c\ud2b8\ub108\ube44\uc790(820) \uc2e0\uccad\ud558\uae30: Section 48 \uc7a5\ubcbd\uacfc Schedule 3 \uba74\uc81c \ubc95\ub9ac<\/h4><p class=\"col-sib-desc\">\ube0c\ub9ac\uc9d5\ube44\uc790\ub098 \ube44\uc790 \ub9cc\ub8cc \uc0c1\ud0dc\uc5d0\uc11c &#x27;\uc9c4\uc2e4\ud55c \uc0ac\ub791\uacfc \uacb0\ud63c&#x27;\ub9cc \ub0b4\uc138\uc6b0\uba74 \uc65c \uac70\uc808\ub418\ub294\uc9c0, \ud638\uc8fc \uc548\uc5d0\uc11c \uba74\uc81c\ub97c \ubc1b\ub294 \uae38\uacfc \ud574\uc678 \uc2e0\uccad(309) \uc911 \uc5b4\ub290 \ucabd\uc774 \uc548\uc804\ud55c\uc9c0 \uc9da\uc5b4 \ub4dc\ub9bd\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}, "en": {"doc_title": "Winning at the Administrative Review Tribunal (ART) and Challenging $86,000 Health Refusals \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">All Guides Hub<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=en\">Visa Solution Guide<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=en\">Employment Navigator<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=en\">DIY & Cost-Smart Guide<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/?lang=en\" target=\"_blank\" rel=\"noopener\">Consult Park & Co \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=en&amp;tab=immigration\" class=\"col-back-btn\">\u2190 Back to Immigration Self-Help Hub<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">Park &amp; Co Lawyers \u00b7 Accredited Specialist Immigration Column<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn\">KO<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn active\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/220391121528851\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">Consult Park &amp; Co \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">ART APPEALS &amp; HEALTH WAIVERS \u00b7 IMMIGRATION 13<\/span>\n          <span class=\"col-verified-pill num\">QLS Accredited Specialist Verified (Nov 2026)<\/span>\n          <span class=\"col-time-pill num\">9 min read<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">Winning at the Administrative Review Tribunal (ART) and Challenging $86,000 Health Refusals<\/h1>\n        <p class=\"col-subtitle\">Strict ART filing windows ($3,727 fee), de novo time-of-decision evidence, attacking generic MOC opinions under Robinson, and PIC 4007(2) waivers under Bui<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">Chang Min Park<\/div>\n            <div class=\"col-author-role\">Legal Practitioner Director, Park &amp; Co Lawyers \u00b7 Accredited Specialist in Immigration Law (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col13_immi_art_health_hero.jpg\" alt=\"Winning at the Administrative Review Tribunal (ART) and Challenging $86,000 Health Refusals\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">At the ART, de novo review assesses time-of-decision criteria fresh on the hearing date, while Robinson [2005] FCA 1626 invalidates generic MOC health costings that ignore individual severity.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">$3,727 ART Fee<\/div><div class=\"col-stat-lbl\">FY 2026\u201327 Migration review fee; zero statutory power to extend deadlines<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">$86,000 SCT<\/div><div class=\"col-stat-lbl\">Significant Cost Threshold assessed over 5 years (max 10 yrs permanent)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">Robinson &amp; Bui<\/div><div class=\"col-stat-lbl\">Dual legal challenge: invalidate generic MOC opinion + PIC 4007(2) waiver<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">In This Column<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#zero-time-extensions-at-the-art-and-the-time-of-\" class=\"col-toc-link lvl-2\">Zero time extensions at the ART and the time-of-application trap<\/a><a href=\"#how-the-86000-significant-cost-threshold-and-moc\" class=\"col-toc-link lvl-2\">How the $86,000 Significant Cost Threshold and MOC opinions bind delegates<\/a><a href=\"#invalidating-generic-form-884-costings-on-pic-40\" class=\"col-toc-link lvl-2\">Invalidating generic Form 884 costings on PIC 4005 visas under Robinson<\/a><a href=\"#winning-a-pic-40072-health-waiver-at-the-time-of\" class=\"col-toc-link lvl-2\">Winning a PIC 4007(2) health waiver at the time of decision under Bui<\/a><a href=\"#triaging-your-refusal-notice-before-the-3727-art\" class=\"col-toc-link lvl-2\">Triaging your refusal notice before the $3,727 ART deadline closes<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/220391121528851\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">Open Immigration Consultation Form<\/a>\n              <a href=\"../../?lang=en&amp;tab=immigration\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 Back to Immigration Self-Help Hub<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">Receiving a visa refusal notice from the Department of Home Affairs feels final, particularly when the decision rests on a Medical Officer of the Commonwealth (MOC) costing above the $86,000 Significant Cost Threshold (SCT) or a refusal of an employer&#x27;s nomination. At the Administrative Review Tribunal (ART), merits review remains the primary statutory mechanism for rescuing refused Australian visas and sponsorships, provided you lodge inside a rigid statutory time bar and distinguish curable time-of-decision criteria from fatal lodgement defects.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 382\" width=\"100%\" role=\"img\" aria-label=\"Winning at the ART &amp; Challenging $86,000 MOC Health Cost Opinions\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"381\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">ART MERITS REVIEW ($3,727) \u00b7 PIC 4005 / 4007 ($86,000 SCT)<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">Winning at the ART &amp; Challenging $86,000 MOC Health Cost Opinions<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">Authorities: ART Fee $3,727 (1 Jul 2026) \u00b7 $86,000 SCT \u00b7 Robinson [2005] FCA 1626 \u00b7 Bui [1999] FCA 118<\/text>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"38\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">1. ART JURISDICTION &amp; TIME-OF-DECISION RULES<\/text>\n  <circle cx=\"42\" cy=\"144\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"54\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Zero Discretion to Extend Deadlines ($3,727)<\/text>\n  <text x=\"54\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">Missing the 28-day (or 7/9/14-day) statutory window kills jurisdiction.<\/text>\n  <circle cx=\"42\" cy=\"196\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"54\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Time-of-Application vs Time-of-Decision<\/text>\n  <text x=\"54\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">De novo review cures ToD criteria with fresh evidence up to hearing.<\/text>\n  <circle cx=\"42\" cy=\"248\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"54\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Linked Nomination &amp; Visa Strategy<\/text>\n  <text x=\"54\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">Subclass 482/186 refusals require preserving a live approved nomination.<\/text>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"466\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">2. CHALLENGING $86,000 HEALTH REFUSALS<\/text>\n  <circle cx=\"470\" cy=\"144\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Weapon A: Robinson Severity Error (4005 &amp; 4007)<\/text>\n  <text x=\"482\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">Generic MOC cost assumptions ignoring actual severity are invalid in law.<\/text>\n  <circle cx=\"470\" cy=\"196\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Weapon B: PIC 4007(2) Undue-Cost Waiver (Bui)<\/text>\n  <text x=\"482\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">Available on Partner, SID 482 &amp; 186 TRT visas via tax/family mitigation.<\/text>\n  <circle cx=\"470\" cy=\"248\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">5-Year (Max 10-Year) Costing Deconstruction<\/text>\n  <text x=\"482\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">Specialist functional reports rebut inflated NDIS/special-ed estimates.<\/text>\n  <rect x=\"22\" y=\"328\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"351\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1D6B48\">Takeaway: An $86,000+ MOC costing is rarely the final word; audit Robinson validity and PIC 4007(2) mitigation immediately.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 1: ART De Novo Review Architecture and PIC 4005 vs PIC 4007 Health Cost Challenges<\/figcaption><\/figure>\n<h2 id=\"zero-time-extensions-at-the-art-and-the-time-of-\" class=\"doc-h2\">Zero time extensions at the ART and the time-of-application trap<\/h2>\n<p class=\"doc-p\">Unlike state courts, the ART possesses zero statutory discretion to extend a missed migration filing deadline, even by one minute, regardless of illness, postal confusion, or agent oversight. Standard onshore visa refusals generally carry a 28-calendar-day limit from deemed notification alongside a $3,727 filing fee for FY 2026-27 (with a 50% refund upon a favourable outcome, or a 50% upfront reduction for severe financial hardship). Shorter statutory bars govern cancellations and detention files: onshore s 116 cancellations often drop to 7 working days, while expedited character reviews under s 500(6B) enforce an unforgiving 9-day filing limit.<\/p>\n<p class=\"doc-p\">Lodging in time unlocks <em>de novo<\/em> merits review, allowing the Tribunal Member to stand in the Minister&#x27;s shoes and decide the case afresh on updated evidence at hearing. That power still hits a wall on strict time-of-application criteria. If a points-tested Skilled visa was refused because you lacked competent English or a valid skills assessment required on the day of application, passing an English test two years later cannot cure the breach. Likewise, if a Subclass 482 visa failed because the employer&#x27;s nomination was refused, appealing the worker&#x27;s visa alone without a live nomination review or approved nomination leaves cl 482.212 unfulfilled.<\/p>\n<h2 id=\"how-the-86000-significant-cost-threshold-and-moc\" class=\"doc-h2\">How the $86,000 Significant Cost Threshold and MOC opinions bind delegates<\/h2>\n<p class=\"doc-p\">Health refusals under Schedule 4 Public Interest Criteria PIC 4005 and PIC 4007 derail families and sponsors alike, magnified by the &quot;one fails, all fail&quot; rule covering secondary applicants and, in many permanent visas, non-migrating dependent children. Under reg 2.25A of the <em>Migration Regulations 1994<\/em> (Cth), where an applicant presents with a condition such as autism spectrum disorder, developmental delay, intellectual disability, HIV, chronic renal disease, or malignancy, a MOC issues a Form 884 opinion estimating hypothetical public health and community service costs.<\/p>\n<p class=\"doc-p\">Current as at November 2026, the Significant Cost Threshold sits at $86,000. Costings span the intended stay for temporary visas, or generally 5 years for permanent visas (3 years if aged 75 or older, and up to 10 years for permanent ongoing conditions with reasonably predictable trajectories). State special-education funding, NDIS-equivalent disability support, PBS medicines, and public hospital care are tallied regardless of private health cover or a family&#x27;s willingness to self-fund. Under reg 2.25A(3), both Home Affairs and the ART must accept a legally valid MOC opinion as correct.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">Visa Stream / Tribunal Issue<\/th><th style=\"text-align:left\">Governing Criterion &amp; Case Law<\/th><th style=\"text-align:left\">Health Waiver or Legal Challenge Pathway at the ART<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Points-Tested Skilled (189, 190, 491) &amp; 186 Direct Entry<\/strong><\/td><td style=\"text-align:left\">PIC 4005 (No waiver power) &amp; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2005/1626.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Robinson<\/em> [2005] FCA 1626<\/a> ([39]-[43])<\/td><td style=\"text-align:left\">Zero health waiver exists; won only by proving the MOC opinion is legally invalid under <em>Robinson<\/em> and securing a fresh RMOC costing under $86,000<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Employer Sponsored SID 482, 494 &amp; 186 TRT Stream<\/strong><\/td><td style=\"text-align:left\">PIC 4007 (Waiver under 4007(2)) &amp; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/1999/118.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Bui<\/em> [1999] FCA 118<\/a><\/td><td style=\"text-align:left\">Can challenge Form 884 validity under <em>Robinson<\/em> and seek a PIC 4007(2) waiver showing costs are not &quot;undue&quot; given tax and skill contributions<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Partner (820/801, 309/100) &amp; Humanitarian/Child Visas<\/strong><\/td><td style=\"text-align:left\">PIC 4007 (cl 820.223 / cl 309.225) &amp; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/1999/118.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Bui<\/em> [1999] FCA 118<\/a><\/td><td style=\"text-align:left\">Broad PIC 4007(2) waiver weighing Australian citizen sponsor/child hardship and family care capacity (standard Parent visas carry PIC 4005)<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Standard Onshore Refusal Merits Review (Part 5)<\/strong><\/td><td style=\"text-align:left\">Migration Act 1958 s 347 ($3,727 fee from 1 July 2026)<\/td><td style=\"text-align:left\">Strict 28-calendar-day bar (7 working days on many onshore s 116 cancellations); zero Tribunal discretion to extend time<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Employer Nomination + Linked 482/186 Refusal<\/strong><\/td><td style=\"text-align:left\">reg 2.72 / reg 5.19 &amp; cl 482.212<\/td><td style=\"text-align:left\">Nomination and visa appeals must be aligned at the ART; approving the nomination unlocks <em>de novo<\/em> visa remittal<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"invalidating-generic-form-884-costings-on-pic-40\" class=\"doc-h2\">Invalidating generic Form 884 costings on PIC 4005 visas under Robinson<\/h2>\n<p class=\"doc-p\">Visas governed by PIC 4005, including Subclass 189, 190, 491, and Subclass 186 Direct Entry, offer no health waiver at all. Overcoming an adverse costing above $86,000 on a PIC 4005 visa depends on dismantling the legal validity of the Form 884 opinion itself under <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2005/1626.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Robinson v Minister for Immigration and Multicultural and Indigenous Affairs<\/em> [2005] FCA 1626<\/a> ([39]-[43]).<\/p>\n<p class=\"doc-p\">Justice Siopis held in <em>Robinson<\/em> that a MOC commits jurisdictional error, making the opinion invalid and non-binding on both PIC 4005 and PIC 4007 files, if they apply generic population cost assumptions for a broad diagnostic label without first identifying the specific form or level of severity of that applicant&#x27;s condition. Assuming a mildly affected child on the autism spectrum will need special-school placement and supported adult housing, when paediatric, speech-pathology, and mainstream school reports prove independent functioning, invalidates the costing. At the ART, targeted clinical reports regularly compel a fresh Review Medical Officer of the Commonwealth (RMOC) assessment cleanly below $86,000.<\/p>\n<h2 id=\"winning-a-pic-40072-health-waiver-at-the-time-of\" class=\"doc-h2\">Winning a PIC 4007(2) health waiver at the time of decision under Bui<\/h2>\n<p class=\"doc-p\">Where a visa incorporates PIC 4007, including Partner 820/801 and 309/100, SID Subclass 482, Subclass 494, and Subclass 186 in the Temporary Residence Transition (TRT) stream (making 186 TRT far safer than 186 Direct Entry when a family member has a medical condition), applicants can also invoke the PIC 4007(2) health waiver.<\/p>\n<p class=\"doc-p\">In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/1999/118.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Bui v Minister for Immigration &amp; Multicultural Affairs<\/em> [1999] FCA 118<\/a>, the Full Federal Court confirmed that PIC 4007(2) confers a broad time-of-decision discretion asking whether granting the visa would be unlikely to result in <em>undue<\/em> cost or <em>undue<\/em> prejudice to scarce services. Years of Australian tax paid while awaiting review, scarce occupational skills, regional service, Australian citizen children, savings, and private family care plans all weigh strongly at the ART toward waiving even six-figure costings.<\/p>\n<h2 id=\"triaging-your-refusal-notice-before-the-3727-art\" class=\"doc-h2\">Triaging your refusal notice before the $3,727 ART deadline closes<\/h2>\n<p class=\"doc-p\">Every refusal letter fixes an unextendable statutory cutoff date. Before risking $3,727 on a time-of-application defect, or immediately upon receiving a Form 884 health costing or refusal decision, upload your refusal record and medical opinion via the <a href=\"https://form.jotform.com/220391121528851\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Immigration Consultation Form<\/a> or visit the <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Official Links Hub<\/a> so an Accredited Specialist in Immigration Law (QLS) can assess jurisdiction, challenge flawed <em>Robinson<\/em> costings, or build a <em>Bui<\/em> health waiver submission.<\/p>\n\n          <div class=\"col-sources-box\">\n            Primary Authorities: Administrative Review Tribunal Act 2024 (Cth) \u00b7 Migration Regulations 1994 reg 2.25A, Sch 4 PIC 4005 &amp; PIC 4007 \u00b7 Robinson v MIMIA [2005] FCA 1626 \u00b7 Bui v MIMA [1999] FCA 118.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#E6C98C;\">WHEN TO CONSULT A QLS ACCREDITED SPECIALIST<\/span>\n            <h3 class=\"col-cta-title\">Facing an Urgent s 57 / NOICC / ART Deadline or Planning Corporate Sponsorship?<\/h3>\n            <p class=\"col-cta-desc\">Departmental response windows and ART review deadlines carry zero extension discretion. Attach your notice or corporate sponsorship details via our online consultation form for prompt specialist assessment.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/220391121528851\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">Open Immigration Consultation Form<\/a>\n              <a href=\"../../files/EN/PDF/01_Immigration_Self_Diagnosis_and_Official_Forms_Manual_2026_EN.pdf\" download class=\"col-btn-ghost\">Download Manual 01 (Immigration PDF)<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=en\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">Park &amp; Co Official Consultation Hub<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">Legal Disclaimer: This publication provides general legal information grounded in the Migration Act 1958 (Cth), Migration Regulations 1994, Ministerial Direction No. 123 and Federal Court authorities current as at November 2026. It does not constitute legal advice or create a solicitor-client relationship.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">More Curated Immigration Law Columns<\/h3>\n        <a href=\"../../?lang=en&amp;tab=immigration\" class=\"col-back-link num\">\u2190 Back to Immigration Self-Help Hub<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../pic-4020-s57-bogus-documents-withdrawal/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PIC 4020 &amp; INTEGRITY \u00b7 IMMIGRATION 09<\/span><h4 class=\"col-sib-title\">Received an s 57 Natural Justice Letter Over PIC 4020? Why Withdrawing Will Not Erase the Risk<\/h4><p class=\"col-sib-desc\">Examines purposeful falsity vs innocent mistake, skills assessment traps (Arora), why blind s 49 withdrawal backfires onshore, and Kaur waiver proof.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../noicc-visa-cancellation-direction-123/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">NOICC &amp; DIRECTION 123 \u00b7 IMMIGRATION 10<\/span><h4 class=\"col-sib-title\">NOICC Cancellations on Pending Charges and the 31 October 2026 Shift to Ministerial Direction 123<\/h4><p class=\"col-sib-desc\">Why untested police charges trigger s 116(1)(e) notices under Gong, how DIY apology letters prejudice criminal trials, and how to plead under Direction 123.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a><a href=\"../corporate-nomination-genuine-position-csit/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">CORPORATE SPONSORSHIP \u00b7 IMMIGRATION 11<\/span><h4 class=\"col-sib-title\">Why Employer Nominations Fail Despite Paying the $79,423 CSIT: Genuine Position Audits and ABN Restructures<\/h4><p class=\"col-sib-desc\">Protects Australian sponsors from non-refundable SAF levy losses across SID Subclass 482 and Subclass 186 ENS nominations, restructures and FWO/ATO audits.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../schedule-3-waiver-section-48-partner-visa/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">SECTION 48 &amp; SCHEDULE 3 \u00b7 IMMIGRATION 12<\/span><h4 class=\"col-sib-title\">Lodging an Onshore Partner Visa After Refusal or Overstay: Section 48 Bars and Schedule 3 Waivers<\/h4><p class=\"col-sib-desc\">Why genuine marriage alone never waives Criterion 3001, how post-application births or clinical dependencies count up to decision, and when offshore 309 is safer.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}}</script>

    (function () {
      const payload = JSON.parse(document.getElementById('col-payload').textContent);
      const root = document.getElementById('col-root');
      let cleanupScroll = null;

      function getLang() {
        const q = new URLSearchParams(window.location.search).get('lang');
        return q === 'en' ? 'en' : 'ko';
      }

      function bindTocSpy() {
        if (cleanupScroll) cleanupScroll();
        const links = Array.from(root.querySelectorAll('.col-toc-link'));
        if (!links.length) return;
        const targets = links
          .map((a) => document.getElementById(a.getAttribute('href').slice(1)))
          .filter(Boolean);
        function onScroll() {
          let activeIdx = 0;
          const offset = window.scrollY + 130;
          for (let i = 0; i < targets.length; i++) {
            if (targets[i].offsetTop <= offset) activeIdx = i;
          }
          links.forEach((a, idx) => a.classList.toggle('active', idx === activeIdx));
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        cleanupScroll = () => window.removeEventListener('scroll', onScroll);
        onScroll();
      }

      function render(lg) {
        const data = payload[lg] || payload.ko;
        document.documentElement.lang = lg;
        document.title = data.doc_title;
        root.innerHTML = data.html;
        root.querySelectorAll('[data-set-lang]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const next = btn.getAttribute('data-set-lang');
            const url = new URL(window.location.href);
            url.searchParams.set('lang', next);
            window.history.replaceState({}, '', url.toString());
            render(next);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });
        bindTocSpy();
      }

      render(getLang());
    })();
  </script>

(function () {

  /* 429-aware retry spanning >15s across retries to cleanly outlast Abacus 30;w=10 windows */
  function fetchRetry(url, isHit, attempt) {

    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 15000) : null;

    return fetch(url, opts)
      .then(function (r) {

        if (r.status === 429) {

        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();

        if (typeof j.value !== 'number') throw new Error('bad payload');
        return j.value;
      })
      .catch(function (err) {
        if (timer) clearTimeout(timer);
        var maxTries = (err && err.isRateLimit) ? 3 : 2;
        if (tries < maxTries) {
          var waitMs = (err && err.isRateLimit) ? (3800 + tries * 3600) : (1100 * (tries + 1));
          return new Promise(function (res) { setTimeout(res, waitMs); })
            .then(function () { return fetchRetry(url, isHit, tries + 1); });
        }
        throw err;
      });
  }

        (isEn
          ? 'Anonymous referral channel buckets (Naver, Cafe, KakaoTalk, Threads, Hub, Direct) are recorded once per browser per day as new visits arrive (zero personal or URL path data stored).'
          : '익명 유입 경로(검색·카페·카카오톡·스레드·허브 이동 등) 집계는 신규 방문부터 하루 브라우저당 1회씩 기록됩니다 (세부 URL·개인정보 미수집).') +
        '</p>';
    }
    var rowsHtml = items.map(function (item) {
      var pct = totalRef > 0 ? Math.round((item.count / totalRef) * 100) : 0;
      return '<div class="vc-ref-row">' +
        '<span class="vc-ref-name" title="' + item.label + '">' + item.label + '</span>' +
        '<div class="vc-ref-track"><div class="vc-ref-fill" style="width:' + Math.max(4, pct) + '%"></div></div>' +
        '<span class="vc-ref-val">' + fmt(item.count) + ' (' + pct + '%)</span>' +
        '</div>';
    }).join('');
    var note = isEn
      ? 'Privacy-safe coarse channel buckets only (1 per browser/day; zero IP, query string, or full referrer URL stored).'
      : '개인정보 보호형 채널 그룹 집계 (하루 브라우저당 1회 기준 &middot; 검색어·세부 URL·IP 미수집)';
    return head + '<div class="vc-ref-list">' + rowsHtml + '</div><p class="vc-ref-note">' + note + '</p>';
  }

  function loadHistoryRows(days) {
    var histCache = {};
    try { histCache = JSON.parse(localStorage.getItem(HIST_KEY) || '{}') || {}; } catch (e) {}
    var results = new Array(days.length);
    var pending = [];
    days.forEach(function (d, idx) {
      if (d < today && Array.isArray(histCache[d])) {
        results[idx] = histCache[d];
      } else if (d === today && typeof liveTodayViews === 'number' && typeof liveTodayVis === 'number') {
        results[idx] = [liveTodayViews, liveTodayVis];
      } else {
        pending.push({ d: d, idx: idx });
      }
    });

    var batchSize = pending.length > 7 ? 4 : 6;
    var pauseMs = pending.length > 7 ? 2900 : 180;
    var chain = Promise.resolve();
    for (var c = 0; c < pending.length; c += batchSize) {
      (function (slice, waitFirst) {
        chain = chain.then(function () {
          return (waitFirst ? delay(pauseMs) : Promise.resolve()).then(function () {
            return Promise.all(slice.map(function (item) {
              var k = item.d.replace(/-/g, '');
              var pViews = (item.d === today && typeof liveTodayViews === 'number')
                ? Promise.resolve(liveTodayViews)
                : call('get', 'day-' + k).catch(function () { return null; });
              var pVis = (item.d === today && typeof liveTodayVis === 'number')
                ? Promise.resolve(liveTodayVis)
                : call('get', 'vday-' + k).catch(function () { return null; });
              return Promise.all([pViews, pVis]).then(function (pair) {
                var v0 = pair[0] == null ? 0 : pair[0];
                var v1 = pair[1] == null ? 0 : pair[1];
                results[item.idx] = [v0, v1];
                if (item.d < today && pair[0] !== null && pair[1] !== null) {
                  histCache[item.d] = [v0, v1];
                }
              });
            }));
          });
        });
      })(pending.slice(c, c + batchSize), c > 0);
    }
    return chain.then(function () {
      try { localStorage.setItem(HIST_KEY, JSON.stringify(histCache)); } catch (e) {}
      return results.map(function (r) { return r || [0, 0]; });
    });
  }

  var cachedRefMap = null;

  function loadAndRenderModal(refreshRefs) {
    syncCounterLang();
    var isEn = uiLang() === 'en';
    var fullDays = lastDays(30);
    var days = activeRange === 7 ? lastDays(7) : fullDays;
    var body = modal.querySelector('.vc-body');
    var chartWaitMsg = isEn ? 'Loading daily statistics&hellip;' : '일별 통계를 불러오는 중입니다&hellip;';
    var refWaitMsg = isEn ? 'Loading today&rsquo;s referral channels&hellip;' : '오늘 유입 채널 집계를 불러오는 중입니다&hellip;';
    var existingRefHtml = (!refreshRefs && cachedRefMap) ? renderReferrerBox(cachedRefMap) : ('<div class="vc-ref-note">' + refWaitMsg + '</div>');

    /* Render toolbar, loading placeholder, referral box, and 1-click share bar IMMEDIATELY (0ms) */
    body.innerHTML = renderToolbar(isEn, fullDays.length) +
      '<div id="vc-chart-slot"><p class="vc-sum">' + chartWaitMsg + '</p></div>' +
      '<div id="vc-ref-box" class="vc-ref-box">' + existingRefHtml + '</div>' +
      renderShareBar(isEn);

    loadHistoryRows(days)
      .then(function (rows) {
        var slot = document.getElementById('vc-chart-slot');
        if (slot) slot.innerHTML = renderChartSvg(days, rows, uiLang() === 'en');
        if (!refreshRefs && cachedRefMap) return cachedRefMap;
        return delay(180).then(function () { return loadTodayReferrers(day); });
      })
      .then(function (refMap) {
        if (refMap) cachedRefMap = refMap;
        var refBox = document.getElementById('vc-ref-box');
        if (refBox && refMap) refBox.innerHTML = renderReferrerBox(refMap);
      })
      .catch(function () {
        var slot = document.getElementById('vc-chart-slot');
        if (slot && !slot.querySelector('svg')) {
          slot.textContent = uiLang() === 'en' ? 'Could not load the chart.' : '그래프를 불러오지 못했습니다.';
        }
      });
  }

  function open() {
    activeRange = 7;
    modal.classList.add('open');
    loadAndRenderModal(true);
  }
  box.setAttribute('role', 'button');
  box.setAttribute('tabindex', '0');
  box.addEventListener('click', open);
  box.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
})();
  </script>
</body>
</html>
