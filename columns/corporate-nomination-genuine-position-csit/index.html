;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">\ubc15\ucc3d\ubbfc \ub300\ud45c\ubcc0\ud638\uc0ac (Chang Min Park)<\/div>\n            <div class=\"col-author-role\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \ub300\ud45c\ubcc0\ud638\uc0ac \u00b7 \ud638\uc8fc \ud038\uc990\ub79c\ub4dc\uc8fc \ubcc0\ud638\uc0ac\ud68c \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col11_immi_sponsorship_hero.jpg\" alt=\"\ucd5c\uc800\uc5f0\ubd09 $79,423(CSIT)\ub9cc \ub9de\ucd94\uba74 \ub05d\uc77c\uae4c: SID 482\u00b7186 \ub178\ubbf8\ub124\uc774\uc158 \uac70\uc808 1\uc704 &#x27;\uc9c4\uc815\ud55c \uc9c1\uc704&#x27;\uc640 ABN \ubcc0\uacbd\uc758 \ub36b\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">\uc774\ubbfc\uc131\uc740 \uacc4\uc57d\uc11c\uc5d0 \uc801\ud78c \uc5f0\ubd09 \uc22b\uc790\ub9cc \ubcf4\uc9c0 \uc54a\uc544\uc694. Cargo First [2016] FCA 30 \ud310\uacb0\uc5d0 \ub530\ub77c \ud68c\uc0ac \uaddc\ubaa8\uc640 \uc2e4\uc81c \ud558\ub294 \uc77c\uc774 \uc9c0\uba85 \uc9c1\uc885\uc5d0 \uaf2d \ub9de\ub294\uc9c0 \uaf3c\uaf3c\ud788 \ub4e4\uc5ec\ub2e4\ubd10\uc694.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">$79,423 / $146,576<\/div><div class=\"col-stat-lbl\">2026.7.1 \ubc1c\ud6a8 CSIT(\uc77c\ubc18\u00b7186) \ubc0f SSIT(\uace0\uc18c\ub4dd) \ucd5c\uc800\uc5f0\ubd09 \uae30\uc900 (F2026L00874)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">\uc9c8\uc801 \uc2e4\uc9c8 \uc2ec\uc0ac<\/div><div class=\"col-stat-lbl\">\ube44\uc790 \ubaa9\uc801 \uac00\uacf5 \uc9c1\uc704 \uac70\uc808 \uc6d0\uce59 (Cargo First [2016] FCA 30)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">\ud658\ubd88 \ubd88\uac00 SAF<\/div><div class=\"col-stat-lbl\">\ub178\ubbf8\ub124\uc774\uc158 \uac70\uc808\u00b7\uc0c8 ABN \uc624\ub958 \uc2dc \uc18c\uba78\ud558\ub294 $4,800\u2013$7,200+ \ud6c8\ub828\ubd80\ub2f4\uae08<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">\uc774 \uce7c\ub7fc\uc758 \ubaa9\ucc28<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#2026\ub144-7\uc6d4-1\uc77c-\uae30\uc220\ube44\uc790-\uc18c\ub4dd-\uae30\uc900-\uc778\uc0c1f2026l00874-79423-csit\uc640\" class=\"col-toc-link lvl-2\">2026\ub144 7\uc6d4 1\uc77c \uae30\uc220\ube44\uc790 \uc18c\ub4dd \uae30\uc900 \uc778\uc0c1(F2026L00874): $79,423 CSIT\uc640 \uc2dc\uc7a5 \uc5f0\ubd09\uc758 \uc774\uc911 \uad00\ubb38<\/a><a href=\"#cargo-first-\ud310\uacb0\uc774-\uc138\uc6b4-\uc9c4\uc815\ud55c-\uc9c1\uc704\uc758-\uc9c8\uc801-\uc2ec\uc0ac-\uae30\uc900\" class=\"col-toc-link lvl-2\">Cargo First \ud310\uacb0\uc774 \uc138\uc6b4 &#x27;\uc9c4\uc815\ud55c \uc9c1\uc704&#x27;\uc758 \uc9c8\uc801 \uc2ec\uc0ac \uae30\uc900<\/a><a href=\"#\ud68c\uacc4\uc0ac-\uc870\uc5b8\ub9cc-\ubbff\uace0-\ubc14\uafbc-\uc2e0\uaddc-abn\ubc95\uc778-\uc804\ud658\uc774-\ubd80\ub974\ub294-condition-8607-\uc704\ubc18\" class=\"col-toc-link lvl-2\">\ud68c\uacc4\uc0ac \uc870\uc5b8\ub9cc \ubbff\uace0 \ubc14\uafbc \uc2e0\uaddc ABN\u00b7\ubc95\uc778 \uc804\ud658\uc774 \ubd80\ub974\ub294 Condition 8607 \uc704\ubc18<\/a><a href=\"#\uc5f0\uad00-\ubc95\uc778-\ubd88\ub9ac\ud55c-\uc815\ubcf4reg-113a-\ucd94\uc801\uacfc-\ud658\ubd88-\ubd88\uac00\ub2a5\ud55c-saf-\uae30\uae08-\uc190\uc2e4\" class=\"col-toc-link lvl-2\">\uc5f0\uad00 \ubc95\uc778 \ubd88\ub9ac\ud55c \uc815\ubcf4(reg 1.13A) \ucd94\uc801\uacfc \ud658\ubd88 \ubd88\uac00\ub2a5\ud55c SAF \uae30\uae08 \uc190\uc2e4<\/a><a href=\"#\ub178\ 525B67\">\uadfc\uac70: Migration Instrument F2026L00874 \u00b7 Cargo First [2016] FCA 30 \u00b7 Migration Regs regs 1.13A, 2.72, 5.19<\/text>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"36\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">GATE 01 \u00b7 2026.7.1 \uc5f0\ubd09 \uae30\uc900<\/text>\n  <text x=\"36\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">CSIT $79,423 &amp; AMSR \ub3d9\uc2dc \ucda9\uc871<\/text>\n  <text x=\"36\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E5F\">LIN F2026L00874 (eff. 1 Jul 2026)<\/text>\n  <line x1=\"36\" y1=\"182\" x2=\"272\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">Core Skills \u00b7 186 ENS: $79,423 \uc774\uc0c1<\/text>\n  <text x=\"36\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Specialist Skills \uace0\uc18c\ub4dd: $146,576 \uc774\uc0c1<\/text>\n  <text x=\"36\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ubcc0\ub3d9 \ud301\u00b7\ube44\ubcf4\uc7a5 \uc218\ub2f9 \uc81c\uc678 \uae30\ubcf8\uae09 \uae30\uc900<\/text>\n  <text x=\"36\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ud638\uc8fc \uc2dc\uc7a5 \uc5f0\ubd09(AMSR) \uc785\uc99d \uc790\ub8cc \ubd88\uc77c\uce58 \uac70\uc808<\/text>\n  <line x1=\"289\" y1=\"195\" x2=\"300\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"303,195 297,191 297,199\" fill=\"#1F242B\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"320\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">GATE 02 \u00b7 \uc9c4\uc815\ud55c \uc9c1\uc704 \uc2ec\uc0ac<\/text>\n  <text x=\"320\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">\uc9c1\ubb34\uc758 \uc9c8\uc801 \uc2e4\uc9c8\uc131(Qualitative)<\/text>\n  <text x=\"320\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\">Cargo First Pty Ltd [2016] FCA 30<\/text>\n  <line x1=\"320\" y1=\"182\" x2=\"556\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"320\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">\ube44\uc790 \ubc1c\uae09\uc6a9\uc73c\ub85c \ud3ec\uc7a5\ub41c \uc9c1\ud568 \uc989\uc2dc \uac04\ud30c<\/text>\n  <text x=\"320\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ub9e4\ucd9c \uaddc\ubaa8\u00b7\uc870\uc9c1\ub3c4\u00b7\ud558\uc704 \uc778\ub825 \uad6c\uc870 \ub300\uc870<\/text>\n  <text x=\"320\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc2e4\uc81c \uc5c5\ubb34\uac00 ANZSCO \uc219\ub828\ub3c4\uc640 \ubd80\ud569\ud574\uc57c \uc2b9\uc778<\/text>\n  <text x=\"320\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uac70\uc808 \uc2dc SAF \ubd80\ub2f4\uae08($4.8k\u2013$7.2k+) \ud658\ubd88 \ubd88\uac00<\/text>\n  <line x1=\"573\" y1=\"195\" x2=\"584\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"587,195 581,191 581,199\" fill=\"#1F242B\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FEF8EC\" stroke=\"#9A6700\" stroke-width=\"1.3\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#9A6700\"/>\n  <text x=\"604\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">GATE 03 \u00b7 \ubc95\uc778\u00b7\ubd88\ub9ac\uc815\ubcf4<\/text>\n  <text x=\"604\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">ABN \ubcc0\uacbd &amp; FWO/ATO \uc774\ub825 \uc804\uc5fc<\/text>\n  <text x=\"604\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#9A6700\">Condition 8607 \u00b7 Regs 1.13A\u20131.13B<\/text>\n  <line x1=\"604\" y1=\"182\" x2=\"840\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"604\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">\uc591\uc218\ub3c4\u00b7\ubc95\uc778 \uc804\ud658(\uc0c8 ABN)\uc740 \ubcc4\uac1c \uace0\uc6a9\uc8fc!<\/text>\n  <text x=\"604\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc2e0\uaddc \ub178\ubbf8\ub124\uc774\uc158 \uc804 \uadfc\ubb34 \uc2dc 8607 \uc704\ubc18<\/text>\n  <text x=\"604\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uad00\uacc4\uc0ac \uc784\uae08\uccb4\ubd88\u00b7\uc138\uae08 \uccb4\ub0a9\uc740 1.13A \ubd88\ub9ac\uc815\ubcf4<\/text>\n  <text x=\"604\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc0ac\uc804 \uad6c\uc870 \uac1c\ud3b8 \ubc0f \ud569\ub9ac\uc801 \ubb34\uc2dc \uc0ac\uc720 \uc18c\uba85 \ud544\uc218<\/text>\n  <rect x=\"22\" y=\"312\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#FEF8EC\" stroke=\"#ECD9B0\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"335\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">\uae30\uc5c5 \uc2e4\ubb34 \uc870\uc5b8: SAF \ubd80\ub2f4\uae08 \uacb0\uc81c\ub098 \ubc95\uc778 \uad6c\uc870\ubcc0\uacbd(ABN \uad50\uccb4) \uc804\uc5d0 \uc9c1\ubb34\uae30\uc220\uc11c\u00b7\uc7ac\ubb34\uc81c\ud45c\u00b7\uc5f0\uad00 \ubc95\uc778 \uc774\ub825\uc744 \uc804\ubb38\ubcc0\ud638\uc0ac\uac00 \uba3c\uc800 \uac10\uc0ac\ud574\uc57c \ud569\ub2c8\ub2e4.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 1: SID 482\u00b7186 \uae30\uc5c5 \ub178\ubbf8\ub124\uc774\uc158 \uc9c4\uc815\ud55c \uc9c1\uc704(Genuine Position) \ubc0f ABN \ubcc0\uacbd \ub9ac\uc2a4\ud06c \uc810\uac80\ud45c<\/figcaption><\/figure>\n<h2 id=\"2026\ub144-7\uc6d4-1\uc77c-\uae30\uc220\ube44\uc790-\uc18c\ub4dd-\uae30\uc900-\uc778\uc0c1f2026l00874-79423-csit\uc640\" class=\"doc-h2\">2026\ub144 7\uc6d4 1\uc77c \uae30\uc220\ube44\uc790 \uc18c\ub4dd \uae30\uc900 \uc778\uc0c1(F2026L00874): $79,423 CSIT\uc640 \uc2dc\uc7a5 \uc5f0\ubd09\uc758 \uc774\uc911 \uad00\ubb38<\/h2>\n<p class=\"doc-p\">\uc22b\uc790 \uae30\uc900\ubd80\ud130 \uc815\ud655\ud788 \uc9da\uc5b4 \ubcfc\uae4c\uc694? \uc5f0\ubc29 \uc785\ubc95\uace0\uc2dc F2026L00874 \ubc1c\ud6a8\ub85c 2026\ub144 7\uc6d4 1\uc77c \uc774\ud6c4 \uc811\uc218\ub418\ub294 \uace0\uc6a9\uc8fc \ub178\ubbf8\ub124\uc774\uc158\uc758 \uc18c\ub4dd \uae30\uc900\uc774 \uc77c\uc81c\ud788 \uc62c\ub790\uc5b4\uc694. SID Subclass 482 \ud575\uc2ec\uae30\uc220 \uc2a4\ud2b8\ub9bc(Core Skills)\uacfc \uc601\uc8fc\uad8c Subclass 186 ENS\uc5d0 \uacf5\ud1b5 \uc801\uc6a9\ub418\ub294 \ud575\uc2ec\uae30\uc220 \uc18c\ub4dd \uae30\uc900(CSIT, Core Skills Income Threshold)\uc740 \uc5f0\ubd09 $79,423\uc774\uc5d0\uc694. \uace0\uc18c\ub4dd \uc804\ubb38 \uc778\ub825\uc6a9 \uc804\ubb38\uae30\uc220 \uc18c\ub4dd \uae30\uc900(SSIT, Specialist Skills Income Threshold)\uc740 $146,576\uc73c\ub85c \ub6f0\uc5c8\uace0 \uc9c0\uc815\uc9c0\uc5ed \uc774\ubbfc\ud611\uc815(DAMA) \uae30\uc900\ub3c4 $71,481\ub85c \uc0c1\ud5a5\ub410\uc8e0. \ubaa8\ub450 \ubc95\uc815 \ud1f4\uc9c1\uc5f0\uae08(12%)\uacfc \ube44\ubcf4\uc7a5 \uc218\ub2f9\uc744 \uc81c\uc678\ud55c \uc21c\uc218 \ubcf4\uc7a5 \uc5f0\uac04 \uc18c\ub4dd\uc774\uc5d0\uc694.<\/p>\n<p class=\"doc-p\">\uc5ec\uae30\uc11c \uccab \ubc88\uc9f8 \ucc29\uc2dc\uac00 \uc0dd\uaca8\uc694. $79,423\ub9cc \ub9de\ucd94\uba74 \uae09\uc5ec \uc2ec\uc0ac\uac00 \ub05d\ub09c\ub2e4\ub294 \uc624\ud574\uc608\uc694. \uc774\ubbfc\ubc95 \uc2dc\ud589\uaddc\uce59(Migration Regulations 1994) reg 2.72(15)\ub294 \ud638\uc8fc \ub178\ub3d9\uc2dc\uc7a5\uc758 \uc5f0\uac04 \uc2dc\uc7a5 \uc5f0\ubd09 \uc218\uc900(AMSR)\uc744 \ud568\uaed8 \ucda9\uc871\ud558\ub3c4\ub85d \uc694\uad6c\ud574\uc694. \ub3d9\uc885 \uc5c5\uacc4 \ud638\uc8fc\uc778 \uc9c1\uc6d0\uc774 $92,000\uc744 \ubc1b\ub294 \uc790\ub9ac\uc778\ub370 $79,423\ub9cc \uc81c\uc2dc\ud558\uba74 \uc2dc\uc7a5 \uc784\uae08 \ubbf8\ub2ec\ub85c \ud0c8\ub77d\ud558\uc8e0. \ubc18\ub300\ub85c \ud3c9\uc18c $65,000\uc744 \ubc1b\ub358 \uc9c1\uc6d0 \uae09\uc5ec\ub97c \ube44\uc790 \uc811\uc218 \uc9c1\uc804\uc5d0\ub9cc \uadfc\uac70 \uc5c6\uc774 $79,423\uc73c\ub85c \uc62c\ub9ac\uba74 \uc5b4\ub5bb\uac8c \ub420\uae4c\uc694? \uc2ec\uc0ac\uad00\uc740 \ube44\uc790\uc6a9\uc73c\ub85c \uae09\uc870\ud55c \uc790\ub9ac\ub77c\uace0 \uc758\uc2ec\ud558\uba70 \uc9c1\uc704 \uc9c4\uc815\uc131 \uc815\ubc00 \uac10\uc0ac\uc5d0 \ub4e4\uc5b4\uac00\uc694.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">\ud575\uc2ec \uc2ec\uc0ac \ucd95<\/th><th style=\"text-align:left\">\uadfc\uac70 \ubc95\ub839 \u00b7 \uace0\uc2dc \u00b7 \ud310\ub840<\/th><th style=\"text-align:left\">2026\ub144 \uc2e4\ubb34 \uae30\uc900 \ubc0f \ub300\ud45c \uac70\uc808 \ub9ac\uc2a4\ud06c<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>\ubc95\uc815 \uc18c\ub4dd \ud558\ud55c\u00b7\uc2dc\uc7a5 \uc5f0\ubd09<\/strong><\/td><td style=\"text-align:left\">\uc785\ubc95\uace0\uc2dc F2026L00874 (2026.07.01 \uc2dc\ud589) \u00b7 reg 2.72(15)<\/td><td style=\"text-align:left\">CSIT $79,423 (SID 482 Core \u00b7 186 ENS), SSIT $146,576, DAMA $71,481 (\uc5f0\uae08 12% \ubcc4\ub3c4) + \ud604\uc9c0 AMSR \ub3d9\uc2dc \ucda9\uc871<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc9c4\uc815\ud55c \uc9c1\uc704 \uc2ec\uc0ac<\/strong><\/td><td style=\"text-align:left\">reg 2.72(10) \u00b7 reg 5.19 \u00b7 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2016/30.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Cargo First<\/em> [2016] FCA 30<\/a><\/td><td style=\"text-align:left\">\ud45c\uc900 \uc9c1\ubb34\uae30\uc220\uc11c \ubcf5\ubd99 \ubd88\uc778\uc815 \u00b7 \uc2e4\uc81c \uc77c\uc0c1 \uc5c5\ubb34, \uc219\ub828\ub3c4, \ub9e4\ucd9c\u00b7\uc870\uc9c1 \uaddc\ubaa8\uc758 \uc9c8\uc801 \ubd80\ud569\uc131 \uac80\uc99d<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ubc95\uc778 \uc804\ud658\u00b7\uc2e0\uaddc ABN<\/strong><\/td><td style=\"text-align:left\">Migration Regulations Sch 8 Condition 8607<\/td><td style=\"text-align:left\">\uc2e0\uaddc Pty Ltd\u00b7\uc0c8 ABN\uc740 \ubcc4\uac1c\uc758 \ubc95\uc778\uaca9 \u00b7 \uc0ac\uc804 \uc2a4\ud3f0\uc11c\uc2ed\u00b7\ub178\ubbf8\ub124\uc774\uc158 \uc2b9\uc778 \uc804 \uadfc\ubb34 \uc2dc \ube44\uc790 \uc704\ubc18 \ubc0f 186 TRT \uacbd\ub825 \ub2e8\uc808<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc5f0\uad00 \ubc95\uc778 \ubd88\ub9ac\ud55c \uc815\ubcf4<\/strong><\/td><td style=\"text-align:left\">Migration Regulations reg 1.13A \u00b7 reg 1.13B<\/td><td style=\"text-align:left\">\uc784\uc6d0\u00b7\uc8fc\uc8fc\uc758 \uacfc\uac70 \ud0c0 \ubc95\uc778 FWO \uc784\uae08\uccb4\ubd88\u00b7ATO \uc138\uae08 \ubc0f \uc5f0\uae08 \ubbf8\ub0a9\u00b7\uc81c\uc7ac \uc774\ub825\uc774 \uc2e0\uc124 \ubc95\uc778 \uc2ec\uc0ac\uae4c\uc9c0 \uc5f0\ub3d9<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uae30\ub0a9\ubd80 SAF \ub9e4\ubab0 \uc190\uc2e4<\/strong><\/td><td style=\"text-align:left\"><em>Migration (Skilling Australians Fund) Charges Act<\/em><\/td><td style=\"text-align:left\">\uc9c4\uc815\uc131 \ubbf8\ub2ec\u00b7reg 1.13A \uac70\uc808 \uc2dc \uc120\ub0a9\ud55c SAF \ubd80\ub2f4\uae08($4,800~$7,200+) \ud658\ubd88 \ubd88\uac00<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"cargo-first-\ud310\uacb0\uc774-\uc138\uc6b4-\uc9c4\uc815\ud55c-\uc9c1\uc704\uc758-\uc9c8\uc801-\uc2ec\uc0ac-\uae30\uc900\" class=\"doc-h2\">Cargo First \ud310\uacb0\uc774 \uc138\uc6b4 &#x27;\uc9c4\uc815\ud55c \uc9c1\uc704&#x27;\uc758 \uc9c8\uc801 \uc2ec\uc0ac \uae30\uc900<\/h2>\n<p class=\"doc-p\">\ub178\ubbf8\ub124\uc774\uc158 \uac70\uc808 \ud1b5\uc9c0\uc11c\uc5d0 \ub2e8\uace8\ub85c \ucc0d\ud788\ub294 \ud310\ub840\uac00 \uc788\uc5b4\uc694. \ubc14\ub85c \uc5f0\ubc29\ubc95\uc6d0\uc758 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2016/30.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Cargo First Pty Ltd v Minister for Immigration and Border Protection<\/em> [2016] FCA 30<\/a> ([30]\u2013[34], Flick J) \ud310\uacb0\uc774\uc5d0\uc694. \ub2f9\uc2dc \uc5c5\uccb4 \uce21\uc740 \ud604\uc7a5\uc5d0 \uc77c\ud560 \uc0ac\ub78c\uc774 \uc2e4\uc81c\ub85c \ud544\uc694\ud558\uace0 \ud53c\uc9c0\uba85\uc778\uc774 \uadf8 \uc5c5\ubb34\ub97c \ub9e1\uc744 \ud14c\ub2c8 \uc9c4\uc815\ud55c \uc9c1\uc704\uac00 \ub9de\ub2e4\uace0 \ub9de\uc130\uc5b4\uc694. \uc5b8\ub73b \uc0c1\uc2dd\uc801\uc778 \ud56d\ubcc0 \uac19\uc8e0. \ud558\uc9c0\ub9cc \ud50c\ub9ad(Flick) \ud310\uc0ac\ub294 \uc774\ub97c \ub2e8\ud638\ud788 \ubc30\ucc99\ud588\uc5b4\uc694.<\/p>\n<p class=\"doc-p\">\uc5f0\ubc29\ubc95\uc6d0\uc758 \ubc95\ub9ac\ub294 \uba85\ucf8c\ud574\uc694. reg 2.72\uc640 reg 5.19\uac00 \ubb3b\ub294 \uc9c4\uc815\uc131\uc740 \uc0ac\uc5c5\uccb4\uc5d0 \uc77c\uc190\uc774 \ubd80\uc871\ud55c\uc9c0 \uc5ec\ubd80\ub85c \ub05d\ub098\uc9c0 \uc54a\uc544\uc694. \uc2ec\uc0ac\uad00\uc740 \uc9c1\ud568 \ub108\uba38\ub97c \ub4e4\uc5ec\ub2e4\ubcf4\uba70 \uc2e4\uc81c \ub9e4\uc77c \uc218\ud589\ud560 \uc5c5\ubb34 \ub0b4\uc6a9\uacfc \uc219\ub828\ub3c4, \uc0ac\uc5c5\uccb4 \uaddc\ubaa8\uac00 \uc9c0\uba85 \uc9c1\uc885(ANZSCO / OSCA)\uc758 \ubcf8\uc9c8\uc801 \uc5ed\ud560\uc5d0 \ubd80\ud569\ud558\ub294\uc9c0 \uc9c8\uc801 \ubd84\uc11d(qualitative analysis)\uc744 \ud574\uc57c \ud55c\ub2e4\uace0 \ud310\uc2dc\ud588\uc8e0. \ube44\uc790 \ubc1c\uae09 \ud3b8\uc758\ub97c \uc704\ud574 \uc77c\ubc18 \uc2e4\ubb34 \uc77c\uc790\ub9ac\uc5d0 \ub9e4\ub2c8\uc800\ub098 \uc2a4\ud398\uc15c\ub9ac\uc2a4\ud2b8 \uc9c1\ud568\ub9cc \uc50c\uc6b4 \ud754\uc801\uc774 \ubcf4\uc774\uba74 \uac70\uc808\uc774 \ub9c8\ub545\ud558\ub2e4\ub294 \ub73b\uc774\uc5d0\uc694. \ud640 \uc9c1\uc6d0\uc774 \uac70\uc758 \uc5c6\ub294 \uc18c\uaddc\ubaa8 \uc2dd\ub2f9\uc758 \ub808\uc2a4\ud1a0\ub791 \ub9e4\ub2c8\uc800\uac00 \uc11c\ube59\uacfc \uc124\uac70\uc9c0\ub97c \ub3c4\ub9e1\uac70\ub098 \uc9c1\uc6d0 3\uba85\uc9dc\ub9ac \uc5c5\uccb4\uac00 \uc804\ub2f4 \ub9c8\ucf00\ud305 \uc804\ubb38\uac00\ub97c \ubf51\uaca0\ub2e4\uace0 \ub098\uc11c\ub294 \uc0ac\ub840\uac00 \ub300\ud45c \ud45c\uc801\uc774\uc5d0\uc694.<\/p>\n<h2 id=\"\ud68c\uacc4\uc0ac-\uc870\uc5b8\ub9cc-\ubbff\uace0-\ubc14\uafbc-\uc2e0\uaddc-abn\ubc95\uc778-\uc804\ud658\uc774-\ubd80\ub974\ub294-condition-8607-\uc704\ubc18\" class=\"doc-h2\">\ud68c\uacc4\uc0ac \uc870\uc5b8\ub9cc \ubbff\uace0 \ubc14\uafbc \uc2e0\uaddc ABN\u00b7\ubc95\uc778 \uc804\ud658\uc774 \ubd80\ub974\ub294 Condition 8607 \uc704\ubc18<\/h2>\n<p class=\"doc-p\">\uc0ac\uc5c5\uc774 \ucee4\uc9c0\uba74\uc11c \uc5c9\ub6b1\ud55c \uacf3\uc5d0\uc11c \ube44\uc790 \uc0ac\uace0\uac00 \ud130\uc9c0\uae30\ub3c4 \ud574\uc694. \ud68c\uacc4\uc0ac\uc758 \uc808\uc138 \uc870\uc5b8\uc5d0 \ub530\ub77c \uc0ac\uc5c5 \uad6c\uc870\ub97c \ubc14\uafb8\ub294 \uc21c\uac04\uc774\uc8e0. \uac1c\uc778\uc0ac\uc5c5\uc790(Sole Trader)\ub098 \uac00\uc871\uc2e0\ud0c1(Family Trust) \ub9e4\uc7a5\uc744 \uc2e0\uaddc \ubc95\uc778(Pty Ltd)\uc73c\ub85c \uc62e\uae30\uac70\ub098 \uc9c0\uc810\uc744 \ucabc\uac1c\uba70 \uc0c8 ABN\uc744 \ub0b4\ub294 \uc77c\uc740 \ud754\ud558\uac70\ub4e0\uc694. \uac04\ud310\ub3c4 \uc0ac\uc7a5\ub2d8\ub3c4 \uc8fc\ubc29\ub3c4 \uadf8\ub300\ub85c\uc774\ub2c8 \uae30\uc874 482 \uc9c1\uc6d0\uc758 \uae09\uc5ec \ubc1c\uc2e0\uc778\ub9cc \uc0c8 \ubc95\uc778\uc73c\ub85c \ubc14\uafd4 \uc77c\ud558\uac8c \ub450\uace4 \ud574\uc694.<\/p>\n<p class=\"doc-p\">\uc774\ubbfc\ubc95\uc0c1 \uc774\ub294 \ubb34\uba74\ud5c8 \uc6b4\uc804\uacfc \ub2e4\ub984\uc5c6\uc5b4\uc694. \uc0c8 Pty Ltd\uc640 \uc0c8 ABN\uc740 \uae30\uc874 \uc2a4\ud3f0\uc11c\uc640 \uc644\uc804\ud788 \ubcc4\uac1c\uc758 \ubc95\uc778\uaca9(distinct legal entity)\uc774\uac70\ub4e0\uc694. \uc2e0\uaddc \ubc95\uc778\uc774 \ud45c\uc900\uc0ac\uc5c5\uc790\uc2a4\ud3f0\uc11c(SBS)\uc640 \uc0c8 \ub178\ubbf8\ub124\uc774\uc158 \uc2b9\uc778\uc744 \ubc1b\uae30 \uc804\uc5d0 \uae09\uc5ec(STP)\ub97c \uc8fc\uba70 \uc77c\ud558\uac8c \ud558\uba74 \ud544\uc218 \uc870\uac74\uc778 Condition 8607 \uc704\ubc18\uc774 \ub3fc\uc694. \ub354 \ud070 \ud6c4\ud3ed\ud48d\uc740 \uc601\uc8fc\uad8c(186 TRT) \ub2e8\uacc4\uc5d0\uc11c \ud130\uc838\uc694. \uad6d\uc138\uccad \uc18c\ub4dd\uba85\uc138\uc11c\uc758 \uace0\uc6a9\uc8fc ABN\uacfc \uc2b9\uc778\ub41c \uc2a4\ud3f0\uc11c ABN\uc774 \uc5b4\uae0b\ub09c \uae30\uac04\uc774 \ub4dc\ub7ec\ub098\uba74\uc11c \uc601\uc8fc\uad8c \uc790\uaca9 \uacbd\ub825\uc774 \ub04a\uae30\ub294 \ube44\uadf9\uc774 \ubc8c\uc5b4\uc9c0\uc8e0.<\/p>\n<h2 id=\"\uc5f0\uad00-\ubc95\uc778-\ubd88\ub9ac\ud55c-\uc815\ubcf4reg-113a-\ucd94\uc801\uacfc-\ud658\ubd88-\ubd88\uac00\ub2a5\ud55c-saf-\uae30\uae08-\uc190\uc2e4\" class=\"doc-h2\">\uc5f0\uad00 \ubc95\uc778 \ubd88\ub9ac\ud55c \uc815\ubcf4(reg 1.13A) \ucd94\uc801\uacfc \ud658\ubd88 \ubd88\uac00\ub2a5\ud55c SAF \uae30\uae08 \uc190\uc2e4<\/h2>\n<p class=\"doc-p\">\uacfc\uac70 \ubc95\uc778\uc5d0 \uacf5\uc815\uadfc\ub85c\uc634\ubd80\uc988\ub9e8(FWO) \uc784\uae08\uccb4\ubd88 \uc870\uc0ac\ub098 \uad6d\uc138\uccad(ATO) \uc5f0\uae08\u00b7\uc138\uae08 \uccb4\ub0a9\uc774 \uc0dd\uae30\uc790 \uae68\ub057\ud55c \uc0c8 \ubc95\uc778\uacfc \uc0c8 ABN\uc744 \ub0b4\uc5b4 \uc2a4\ud3f0\uc11c\uc2ed\uc744 \uc2e0\uccad\ud558\ub824\ub294 \ubd84\ub3c4 \uacc4\uc138\uc694. reg 1.13A \ubd88\ub9ac\ud55c \uc815\ubcf4(Adverse Information) \uaddc\uc815\uc744 \uac04\uacfc\ud55c \uc704\ud5d8\ud55c \ubc1c\uc0c1\uc774\uc5d0\uc694. \ub0b4\ubb34\ubd80\ub294 \ub300\ud45c\uc774\uc0ac\ub098 \uc8fc\uc8fc\ub85c \uc5bd\ud78c \uc5f0\uad00 \ubc95\uc778(associated entities)\uc758 \ub178\ub3d9\ubc95\u00b7\uc138\ubc95\u00b7\uc774\ubbfc\ubc95 \uc704\ubc18 \uc774\ub825\uc744 \uad50\ucc28 \ucd94\uc801\ud574\uc694. \uc774\ub97c \uc228\uae30\uba74 \ud5c8\uc704 \uc9c4\uc220 \uc2dc\ube44\uae4c\uc9c0 \uacb9\uce58\uace0 \uc790\uc9c4 \uacf5\uac1c\ud558\ub354\ub77c\ub3c4 \ubb34\uc2dc\ud560 \ud569\ub9ac\uc801 \uc0ac\uc720\ub97c \uc785\uc99d\ud558\uc9c0 \ubabb\ud558\uba74 \uac70\uc808\ub3fc\uc694.<\/p>\n<p class=\"doc-p\">\uae08\uc804 \uc190\uc2e4\ub3c4 \ubf08\uc544\ud30c\uc694. \uc120\ub0a9\ud558\ub294 \ud638\uc8fc\uc778 \uae30\uc220\uae30\uae08(SAF) \ubd80\ub2f4\uae08\uc740 \uc911\uc18c\uae30\uc5c5 \uae30\uc900 482 4\ub144 \uce58\uac00 $4,800, \ub9e4\ucd9c 1\ucc9c\ub9cc \ub2ec\ub7ec \uc774\uc0c1 \uae30\uc5c5\uc740 $7,200(\uc601\uc8fc\uad8c 186\uc740 $3,000~$5,000)\uc5d0 \uc774\ub974\uac70\ub4e0\uc694. \uc9c4\uc815\uc131 \ubd80\uc871\uc774\ub098 reg 1.13A \ubb38\uc81c\ub85c \uac70\uc808\ub418\uba74 \uc774 \uc218\ucc9c \ub2ec\ub7ec\ub294 \ub2e8 1\ub2ec\ub7ec\ub3c4 \ud658\ubd88\ubc1b\uc9c0 \ubabb\ud574\uc694.<\/p>\n<h2 id=\"\ub178\ubbf8\ub124\uc774\uc158-\uc811\uc218-\ubc0f-\ubc95\uc778-\uac1c\ud3b8-\uc804-\uc0ac\uc804-\uac10\uc0ac-\uccb4\ud06c\ub9ac\uc2a4\ud2b8\" class=\"doc-h2\">\ub178\ubbf8\ub124\uc774\uc158 \uc811\uc218 \ubc0f \ubc95\uc778 \uac1c\ud3b8 \uc804 \uc0ac\uc804 \uac10\uc0ac \uccb4\ud06c\ub9ac\uc2a4\ud2b8<\/h2>\n<p class=\"doc-p\">\uae30\uc5c5 \uc2a4\ud3f0\uc11c\uc2ed\uc758 \uc131\ud328\ub294 \uc811\uc218 3\uac1c\uc6d4 \uc804\uc5d0 \uac08\ub824\uc694. \uc9c0\uba85 \uc9c1\uc885\uc774 \ucd5c\uadfc \ubd80\uac00\uc138 \uc2e0\uace0\uc11c(BAS), \ub9e4\ucd9c \uaddc\ubaa8, \ud558\uc704 \uc9c1\uc6d0 \uad6c\uc131\uacfc \ub9de\ubb3c\ub9ac\ub294\uc9c0 \uba3c\uc800 \uc0b4\ud3b4\ubcf4\uc138\uc694. \ubc95\uc778 \uc804\ud658\uc774\ub098 \uc591\uc218\ub3c4, \uc2e0\uaddc ABN \ubc1c\uae09\uc744 \uc55e\ub450\uc168\ub2e4\uba74 \ub4f1\uae30 \ubcc0\uacbd \uc804\uc5d0 \uc2a4\ud3f0\uc11c\uc2ed \uc7ac\uc2b9\uc778 \uc77c\uc815\uacfc 186 TRT \uacbd\ub825 \ubcf4\ud638 \ub300\ucc45\ubd80\ud130 \uc138\uc6b0\uc154\uc57c \uc548\uc804\ud574\uc694.<\/p>\n<p class=\"doc-p\">\uc18c\uaddc\ubaa8 \uc0ac\uc5c5\uc7a5 \ub9e4\ub2c8\uc800\u00b7\uc804\ubb38\uc9c1 \uc9c0\uba85, \uac70\uc808 \ud6c4 \uc7ac\uc811\uc218, \ubc95\uc778 \uac1c\ud3b8\uacfc reg 1.13A \uc18c\uba85\uc774 \uc5bd\ud78c \ubcf5\uc7a1\ud55c \uae30\uc5c5 \uc774\ubbfc \uc0ac\uc548\uc740 \uacb0\uc81c \uc804 \uc0ac\uc804 \uac10\uc0ac\uac00 \ud070 \ube44\uc6a9\uc744 \uc544\uaef4 \uc918\uc694. \ubc15\uc564\ucf54 \uc774\ubbfc\u00b7\uc2a4\ud3f0\uc11c\uc2ed \uc804\uc6a9 \uc628\ub77c\uc778 \uc9c8\ubb38\uc9c0(<a href=\"https://form.jotform.com/220391469091053\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\uae30\uc5c5 \uc2a4\ud3f0\uc11c\uc2ed \ubc0f \ube44\uc790 \uc0ac\uc548 \uc811\uc218\ud558\uae30<\/a>)\ub97c \uc774\uc6a9\ud574 \ubcf4\uc2dc\uac70\ub098 \uac70\uc808\u00b7\uac10\uc0ac \ud1b5\uc9c0\ub97c \ubc1b\uc740 \uae09\ubc15\ud55c \uc0c1\ud669\uc774\ub77c\uba74 \ube44\uc790 \uae34\uae09 \ub300\uc751 \ud5c8\ube0c(<a href=\"https://parklawyers.com.au/case-emergency/visa/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ube44\uc790\u00b7\ub178\ubbf8\ub124\uc774\uc158 \uae34\uae09 \ub300\uc751 \ubc14\ub85c\uac00\uae30<\/a>) \ubc0f \uacf5\uc2dd \uc548\ub0b4 \ucc3d\uad6c(<a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ubc15\uc564\ucf54 \uacf5\uc2dd \ub9c1\ud06c \ud5c8\ube0c<\/a>)\ub85c \ud604\ud669\uc744 \ub0a8\uaca8 \uc8fc\uc138\uc694. \uc0ac\uc5c5\uccb4 \uaddc\ubaa8\uc640 \uc7ac\ubb34 \uc9c0\ud45c\uc5d0 \ub9de\ub294 \uac00\uc7a5 \uc548\uc804\ud55c \uc2a4\ud3f0\uc11c\uc2ed \uacbd\ub85c\ub97c \uc9da\uc5b4 \ub4dc\ub9b4\uac8c\uc694.<\/p>\n\n          <div class=\"col-sources-box\">\n            \uadfc\uac70 \ubc95\ub839 \ubc0f \ud310\ub840: Migration Regulations 1994 regs 1.13A, 1.13B, 2.72, 5.19, Sch 8 cl 8607 \u00b7 Legislative Instrument LIN 26/040 (F2026L00874, eff. 1 July 2026) \u00b7 Cargo First Pty Ltd v MIBP [2016] FCA 30.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">QLS \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac \ub3c4\uc6c0\uc774 \uaf2d \ud544\uc694\ud55c \uc21c\uac04<\/span>\n            <h3 class=\"col-cta-title\">\uc774\ubbfc\uc131 \uc18c\uba85 \uc694\uccad(s 57)\u00b7\ube44\uc790 \ucde8\uc18c \ud1b5\uc9c0(NOICC)\u00b7ART \uc7ac\uc2ec \ub9c8\uac10 \uae30\ud55c\uc774 \ud750\ub974\uace0 \uc788\uac70\ub098 \ud68c\uc0ac \uc2a4\ud3f0\uc11c\uc2ed\uc744 \uc900\ube44 \uc911\uc774\uc2e0\uac00\uc694?<\/h3>\n            <p class=\"col-cta-desc\">\uc774\ubbfc\uc131 \ub2f5\ubcc0 \uae30\ud55c\uacfc ART \uc7ac\uc2ec \uc811\uc218 \uae30\ud55c\uc740 \ub2e8 \ud558\ub8e8\ub3c4 \ub2a6\ucd9c \uc218 \uc5c6\uc5b4\uc694. \ubc1b\uc73c\uc2e0 \ud1b5\uc9c0\ubb38(Decision Record / s 57 / NOICC)\uc774\ub098 \ud68c\uc0ac \uc2a4\ud3f0\uc11c\uc2ed \ub0b4\uc6a9\uc744 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\uc5d0 \uc62c\ub824 \uc8fc\uc2dc\uba74 \ud574\uacb0 \ubc29\ud5a5\uc744 \ube60\ub974\uac8c \uc9da\uc5b4 \ub4dc\ub824\uc694.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/220391469091053\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">\uc774\ubbfc\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../files/KO/PDF/01_Immigration_Self_Diagnosis_and_Official_Forms_Manual_2026_KO.pdf\" download class=\"col-btn-ghost\">01 \ube44\uc790 \uc11c\ub958\u00b7\uc18c\uba85 \uc810\uac80 \uc694\uc57d PDF \ubc1b\uae30<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">\ubc15\uc564\ucf54 \uacf5\uc2dd \uc0c1\ub2f4 \ub9c1\ud06c \ud5c8\ube0c<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">\ubc95\ub960 \uc548\ub0b4: \uc774 \uce7c\ub7fc\uc740 \ud638\uc8fc \uc774\ubbfc\ubc95(Migration Act 1958), \uc774\ubbfc\uaddc\uc815, \uc7a5\uad00\ud6c8\ub839 \uc81c123\ud638\uc640 \ubc95\uc6d0 \ud310\ub840\ub97c \ubc14\ud0d5\uc73c\ub85c \uc54c\uae30 \uc27d\uac8c \uc815\ub9ac\ud55c \uc77c\ubc18 \ubc95\ub960 \uc815\ubcf4\uc608\uc694. \uac1c\ubcc4 \uc0ac\uac74\uc5d0 \ub300\ud55c \ubc95\ub960 \uc790\ubb38\uc774\ub098 \uc218\uc784 \uacc4\uc57d \uc131\ub9bd\uc744 \ub73b\ud558\uc9c0 \uc54a\uc73c\ub2c8 \ube44\uc790 \ub9cc\ub8cc\uc77c\uc774\ub098 \uc7ac\uc2ec \ub9c8\uac10\uc77c \uc804\uc5d0 \uaf2d \uc804\ubb38\ubcc0\ud638\uc0ac\uc758 \uc9c4\ub2e8\uc744 \ubc1b\uc544 \ubcf4\uc138\uc694.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">\ud568\uaed8 \uc77d\uc73c\uba74 \uc88b\uc740 \uc774\ubbfc\ubc95 \ud310\ub840 \uce7c\ub7fc<\/h3>\n        <a href=\"../../?lang=ko&amp;tab=immigration\" class=\"col-back-link num\">\u2190 \ube44\uc790\u00b7\uc774\ubbfc \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../pic-4020-s57-bogus-documents-withdrawal/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PIC 4020 \uc18c\uba85 \u00b7 \uc774\ubbfc\ubc95 \uce7c\ub7fc 09<\/span><h4 class=\"col-sib-title\">PIC 4020 \uc18c\uba85 \ub808\ud130(s 57)\ub97c \ubc1b\uc558\uc744 \ub54c \ube44\uc790\ub9cc \ucde8\ud558\ud558\uba74 3\ub144 \uc785\uad6d\uae08\uc9c0\ub97c \ud53c\ud560 \uc218 \uc788\uc744\uae4c<\/h4><p class=\"col-sib-desc\">\uc608\uc804 \ub300\ud589\uc0ac \uc2e4\uc218\ub098 \uacbd\ub825\uc11c\ub958 \ubb38\uc81c\ub85c \uc18c\uba85 \uc694\uad6c(s 57)\ub97c \ubc1b\uc558\uc744 \ub54c \ub35c\ucee5 \ube44\uc790\ubd80\ud130 \ucde8\uc18c(\ucde8\ud558)\ud558\uba74 \uc65c \ube0c\ub9ac\uc9d5\ube44\uc790\uac00 \ub04a\uae30\uace0 \uc758\uc2ec \uae30\ub85d\ub9cc \ub0a8\ub294\uc9c0 \uc54c\ub824\ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../noicc-visa-cancellation-direction-123/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ube44\uc790\ucde8\uc18c\u00b7\ud6c8\ub839 123\ud638 \u00b7 \uc774\ubbfc\ubc95 \uce7c\ub7fc 10<\/span><h4 class=\"col-sib-title\">\uc720\uc8c4 \ud310\uacb0 \uc804 \uae30\uc18c\ub9cc\uc73c\ub85c \ube44\uc790 \ucde8\uc18c \uc608\uace0(NOICC)\uac00 \uc624\ub294 \uc774\uc720\uc640 2026\ub144 10\uc6d4 \uc7a5\uad00\ud6c8\ub839 \uc81c123\ud638 \uae34\uae09 \ubd84\uc11d<\/h4><p class=\"col-sib-desc\">\uacbd\ucc30 \uc870\uc0ac\ub97c \ubc1b\uc740 \uc9c1\ud6c4 \ub0a0\uc544\uc628 \ube44\uc790 \ucde8\uc18c \uc608\uace0\uc7a5(NOICC)\uc5d0 \uc123\ubd88\ub9ac \ubc18\uc131\ubb38\ubd80\ud130 \ub0b4\uba74 \uc65c \ud615\uc0ac \uc7ac\ud310\uacfc \ube44\uc790 \ubaa8\ub450 \uc704\ud5d8\ud574\uc9c0\ub294\uc9c0 \ucd5c\uc2e0 \uc7a5\uad00\ud6c8\ub839 123\ud638 \uae30\uc900\uc73c\ub85c \uc124\uba85\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../schedule-3-waiver-section-48-partner-visa/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc624\ubc84\uc2a4\ud14c\uc774\u00b7Schedule 3 \u00b7 \uc774\ubbfc\ubc95 \uce7c\ub7fc 12<\/span><h4 class=\"col-sib-title\">\ube44\uc790 \uac70\uc808\u00b7\uc624\ubc84\uc2a4\ud14c\uc774 \ud6c4 \ud638\uc8fc \uc548\uc5d0\uc11c \ud30c\ud2b8\ub108\ube44\uc790(820) \uc2e0\uccad\ud558\uae30: Section 48 \uc7a5\ubcbd\uacfc Schedule 3 \uba74\uc81c \ubc95\ub9ac<\/h4><p class=\"col-sib-desc\">\ube0c\ub9ac\uc9d5\ube44\uc790\ub098 \ube44\uc790 \ub9cc\ub8cc \uc0c1\ud0dc\uc5d0\uc11c &#x27;\uc9c4\uc2e4\ud55c \uc0ac\ub791\uacfc \uacb0\ud63c&#x27;\ub9cc \ub0b4\uc138\uc6b0\uba74 \uc65c \uac70\uc808\ub420\uae4c\uc694? \ud638\uc8fc \uc548\uc5d0\uc11c \uba74\uc81c\ub97c \ubc1b\ub294 \uae38\uacfc \ud574\uc678 \uc2e0\uccad(309) \uc911 \uc5b4\ub290 \ucabd\uc774 \uc548\uc804\ud55c\uc9c0 \uc9da\uc5b4 \ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../art-merits-review-pic-4007-health-waiver/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ART \uc7ac\uc2ec\u00b7\uac74\uac15\uc694\uac74 \u00b7 \uc774\ubbfc\ubc95 \uce7c\ub7fc 13<\/span><h4 class=\"col-sib-title\">\ube44\uc790 \uac70\uc808 \ud6c4 \ud589\uc815\uc7ac\uc2ec\uc6d0(ART) \uc2b9\uc18c \uc804\ub7b5\uacfc $86,000 \uac74\uac15 \uc694\uac74(PIC 4007) \uba74\uc81c \ub3cc\ud30c\ubc95<\/h4><p class=\"col-sib-desc\">\ucc98\uc74c \ub0c8\ub358 \uc11c\ub958\ub9cc \ub2e4\uc2dc \ub0b4\ub2e4 \uc7ac\uc2ec\uc5d0\uc11c \uc9c0\ub294 \uc2e4\uc218\ub97c \ub9c9\uc544 \ub4dc\ub824\uc694. \uc790\ub140 \ubc1c\ub2ec\uc9c0\uc5f0\uc774\ub098 \ub9cc\uc131\uc9c8\ud658\uc73c\ub85c $86,000 \ucd08\uacfc \ud310\uc815\uc744 \ubc1b\uc558\uc744 \ub54c \ub3cc\ud30c\ud558\ub294 2\ub2e8\uacc4 \ud574\ubc95\uc744 \uc815\ub9ac\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}, "en": {"doc_title": "Why Employer Nominations Fail Despite Paying the $79,423 CSIT: Genuine Position Audits and ABN Restructures \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">All Guides Hub<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=en\">Visa Solution Guide<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=en\">Employment Navigator<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=en\">DIY & Cost-Smart Guide<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\">Consult Park & Co \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=en&amp;tab=immigration\" class=\"col-back-btn\">\u2190 Back to Immigration Self-Help Hub<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">Park &amp; Co Lawyers \u00b7 Accredited Specialist Immigration Column<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn\">KO<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn active\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/220391121528851\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">Consult Park &amp; Co \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">CORPORATE SPONSORSHIP \u00b7 IMMIGRATION 11<\/span>\n          <span class=\"col-verified-pill num\">QLS Accredited Specialist Verified (Nov 2026)<\/span>\n          <span class=\"col-time-pill num\">8 min read<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">Why Employer Nominations Fail Despite Paying the $79,423 CSIT: Genuine Position Audits and ABN Restructures<\/h1>\n        <p class=\"col-subtitle\">FY 2026\u201327 CSIT ($79,423) and SSIT ($146,576) rules, Cargo First qualitative position audits, corporate ABN restructures, and reg 1.13A adverse history<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">Chang Min Park<\/div>\n            <div class=\"col-author-role\">Legal Practitioner Director, Park &amp; Co Lawyers \u00b7 Accredited Specialist in Immigration Law (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col11_immi_sponsorship_hero.jpg\" alt=\"Why Employer Nominations Fail Despite Paying the $79,423 CSIT: Genuine Position Audits and ABN Restructures\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">Meeting the $79,423 CSIT floor will not save a SID 482 or 186 nomination if BAS ratios, staffing charts or an unannounced ABN restructure fail reg 2.72 or reg 5.19.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">$79,423 / $146,576<\/div><div class=\"col-stat-lbl\">1 July 2026 CSIT &amp; SSIT skilled salary floors (F2026L00874)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">Qualitative Test<\/div><div class=\"col-stat-lbl\">Cargo First [2016] FCA 30 scrutiny of real duties vs ANZSCO tasks<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">New ABN = New Entity<\/div><div class=\"col-stat-lbl\">Corporate restructures trigger Condition 8607 &amp; 186 TRT traps<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">In This Column<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#meeting-the-79423-csit-and-146576-ssit-floors-do\" class=\"col-toc-link lvl-2\">Meeting the $79,423 CSIT and $146,576 SSIT floors does not pass the genuine-position test<\/a><a href=\"#qualitative-scrutiny-under-cargo-first-where-gen\" class=\"col-toc-link lvl-2\">Qualitative scrutiny under Cargo First: where generic position descriptions collapse<\/a><a href=\"#the-accountants-new-abn-restructure-trap-and-sub\" class=\"col-toc-link lvl-2\">The accountant&#x27;s new-ABN restructure trap and Subclass 186 TRT continuity<\/a><a href=\"#adverse-information-under-reg-113a-and-non-refun\" class=\"col-toc-link lvl-2\">Adverse information under reg 1.13A and non-refundable SAF levy forfeitures<\/a><a href=\"#pre-lodgement-sponsorship-audits-for-employers-a\" class=\"col-toc-link lvl-2\">Pre-lodgement sponsorship audits for employers and sponsored nominees<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/220391121528851\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">Open Immigration Consultation Form<\/a>\n              <a href=\"../../?lang=en&amp;tab=immigration\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 Back to Immigration Self-Help Hub<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">Australian employers frequently treat Subclass 482 Skills in Demand (SID) and Subclass 186 Employer Nomination Scheme (ENS) sponsorship as a simple salary-floor checklist. Once payroll confirms the employment contract meets the $79,423 Core Skills Income Threshold (CSIT) effective from 1 July 2026 under legislative instrument F2026L00874 (or $146,576 under the Specialist Skills Income Threshold SSIT, and $71,481 under concessional DAMA agreements), directors assume approval is routine. Weeks later, Home Affairs refuses the nomination on &quot;genuine position&quot; grounds or uncovers an unreported corporate restructure, forfeiting thousands in Skilling Australians Fund (SAF) levies and derailing a sponsored worker&#x27;s residency.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 366\" width=\"100%\" role=\"img\" aria-label=\"Three Audits Every SID 482 &amp; 186 Nomination Must Clear (FY 2026\u201327)\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"365\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">EMPLOYER SPONSORSHIP AUDIT \u00b7 F2026L00874 &amp; REG 2.72<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">Three Audits Every SID 482 &amp; 186 Nomination Must Clear (FY 2026\u201327)<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">Authorities: Instrument F2026L00874 \u00b7 Cargo First [2016] FCA 30 \u00b7 Migration Regs regs 1.13A, 2.72 &amp; 5.19<\/text>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"36\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">GATE 01 \u00b7 SALARY FLOORS<\/text>\n  <text x=\"36\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">CSIT $79,423 + Market Rate<\/text>\n  <text x=\"36\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E5F\">LIN F2026L00874 (eff. 1 Jul 2026)<\/text>\n  <line x1=\"36\" y1=\"182\" x2=\"272\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">Core Skills &amp; 186 ENS: $79,423 CSIT<\/text>\n  <text x=\"36\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Specialist Skills stream: $146,576 SSIT<\/text>\n  <text x=\"36\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Guaranteed monetary earnings only<\/text>\n  <text x=\"36\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Must also match Australian Market Salary<\/text>\n  <line x1=\"289\" y1=\"195\" x2=\"300\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"303,195 297,191 297,199\" fill=\"#1F242B\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"320\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">GATE 02 \u00b7 GENUINE POSITION<\/text>\n  <text x=\"320\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">Cargo First Qualitative Test<\/text>\n  <text x=\"320\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\">Cargo First Pty Ltd [2016] FCA 30<\/text>\n  <line x1=\"320\" y1=\"182\" x2=\"556\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"320\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">Position cannot be created for visa outcome<\/text>\n  <text x=\"320\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">DHA audits BAS turnover, org chart &amp; duties<\/text>\n  <text x=\"320\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Real tasks must match ANZSCO skill level<\/text>\n  <text x=\"320\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Refusal forfeits $4,800\u2013$7,200+ SAF levy<\/text>\n  <line x1=\"573\" y1=\"195\" x2=\"584\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"587,195 581,191 581,199\" fill=\"#1F242B\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FEF8EC\" stroke=\"#9A6700\" stroke-width=\"1.3\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#9A6700\"/>\n  <text x=\"604\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">GATE 03 \u00b7 ABN &amp; REG 1.13A<\/text>\n  <text x=\"604\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">New ABN &amp; Adverse History<\/text>\n  <text x=\"604\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#9A6700\">Condition 8607 \u00b7 Regs 1.13A\u20131.13B<\/text>\n  <line x1=\"604\" y1=\"182\" x2=\"840\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"604\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">New Pty Ltd / ABN = new legal entity<\/text>\n  <text x=\"604\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Working before new nomination breaches 8607<\/text>\n  <text x=\"604\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Related-entity FWO/ATO fines trigger 1.13A<\/text>\n  <text x=\"604\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Requires proactive corporate &amp; legal audit<\/text>\n  <rect x=\"22\" y=\"312\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#FEF8EC\" stroke=\"#ECD9B0\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"335\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">Corporate Rule: Audit organisational duties, BAS ratios &amp; reg 1.13A history BEFORE paying SAF levies or restructuring ABNs.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 1: Qualitative Genuine-Position Scrutiny Under Cargo First and ABN Entity Traps<\/figcaption><\/figure>\n<h2 id=\"meeting-the-79423-csit-and-146576-ssit-floors-do\" class=\"doc-h2\">Meeting the $79,423 CSIT and $146,576 SSIT floors does not pass the genuine-position test<\/h2>\n<p class=\"doc-p\">Clearing the statutory income threshold merely lets an employer file a valid nomination. Under Migration Regulations 1994 (Cth) reg 2.72(15) (for SID Subclass 482) and reg 5.19 (for Subclass 186), sponsors must also satisfy the Annual Market Salary Rate (AMSR). If comparable Australian workers in Brisbane, Sydney, or Melbourne earn $95,000 for that role on enterprise or recruitment data, offering $79,423 guarantees a refusal despite matching the CSIT floor.<\/p>\n<p class=\"doc-p\">Salary figures also cannot save a role that fails the genuine-position requirement under reg 2.72(10)(a) or reg 5.19(4)(h) / (9)(c). Case officers cross-examine Business Activity Statements (BAS), company tax returns, Single Touch Payroll (STP) headcounts, and floor plans to test whether a business of your actual revenue and staffing structure requires that skilled occupation full-time, rather than inflating a job title to retain a temporary visa holder.<\/p>\n<h2 id=\"qualitative-scrutiny-under-cargo-first-where-gen\" class=\"doc-h2\">Qualitative scrutiny under Cargo First: where generic position descriptions collapse<\/h2>\n<p class=\"doc-p\">The governing Federal Court authority is <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2016/30.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Cargo First Pty Ltd v Minister for Immigration and Border Protection<\/em> [2016] FCA 30<\/a> ([30]-[34]). In <em>Cargo First<\/em>, a small freight business argued its nominated position was &quot;genuine&quot; because the job truly existed and the business needed someone handling daily freight tasks. Dismissing the appeal, Justice Flick held that reg 2.72 requires a qualitative analysis of the position itself: the delegate must examine real day-to-day duties, skill depth, autonomy, and organisational scale to verify that the role genuinely matches the nominated ANZSCO or OSCA skilled occupation, rather than an operational or supervisory job dressed up with a managerial title.<\/p>\n<p class=\"doc-p\">Pasting six generic lines from an occupation dictionary into an employment contract invites an immediate s 56 request or refusal. Cafe or restaurant Manager nominations in lean venues where the nominee spends most shifts making coffee and clearing plates, Marketing Specialist filings in small trades businesses with negligible ad budgets, and ICT Business Analyst nominations lacking real systems-design scope consistently fail <em>Cargo First<\/em> scrutiny unless backed by granular work samples, client contracts, and credible reporting lines.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">High-Risk Sponsorship Scenario<\/th><th style=\"text-align:left\">Governing Rule / Authority<\/th><th style=\"text-align:left\">Practical Consequence &amp; Financial Exposure<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Inflated Managerial / Specialist Title in Lean Team<\/strong><\/td><td style=\"text-align:left\">reg 2.72(10) / reg 5.19 &amp; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2016/30.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Cargo First<\/em> [2016] FCA 30<\/a> ([30]-[34])<\/td><td style=\"text-align:left\">Refused on qualitative task-matching grounds; 100% forfeiture of SAF levy ($4,800-$7,200 on 4-yr 482; $3,000-$5,000 on 186)<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Contract Set at $79,423 CSIT Below Market (AMSR)<\/strong><\/td><td style=\"text-align:left\">F2026L00874 (CSIT $79,423 / SSIT $146,576) &amp; reg 2.72(15)<\/td><td style=\"text-align:left\">Refused if comparable Australian market rate exceeds $79,423, or if non-guaranteed overtime/commissions were counted toward base pay<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Business Transferred to New Pty Ltd / New ABN<\/strong><\/td><td style=\"text-align:left\">Condition 8607 &amp; Corporations Act 2001 s 50AAA<\/td><td style=\"text-align:left\">New ABN creates a new legal entity; working without fresh sponsorship/nomination breaches Condition 8607 and disrupts 186 TRT service<\/td><\/tr><tr><td style=\"text-align:left\"><strong>FWO Backpay Notice or ATO Super Arrears in Group<\/strong><\/td><td style=\"text-align:left\">Migration Regulations reg 1.13A (&quot;adverse information&quot;)<\/td><td style=\"text-align:left\">Taints associated entities sharing directors or controllers; triggers nomination refusal or sponsorship bar unless formally addressed<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Nomination Refusal While Worker Holds Bridging Visa<\/strong><\/td><td style=\"text-align:left\">cl 482.212 / cl 186.223 &amp; Migration Act s 48<\/td><td style=\"text-align:left\">Linked visa application fails once nomination is refused; onshore worker faces s 48 bar if substantive visa has expired<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"the-accountants-new-abn-restructure-trap-and-sub\" class=\"doc-h2\">The accountant&#x27;s new-ABN restructure trap and Subclass 186 TRT continuity<\/h2>\n<p class=\"doc-p\">One of the costliest sponsorship failures starts in an accountant&#x27;s office rather than ImmiAccount. A growing clinic, building company, or hospitality group moves its trading operations out of a sole-trader, trust, or older company into a clean Pty Ltd with a new Australian Business Number (ABN) for tax or asset-protection reasons. Because the shopfront, equipment, and management stay identical, nobody alerts Home Affairs.<\/p>\n<p class=\"doc-p\">Under Australian corporate and migration law, a new ABN is a distinct legal entity. Standard Business Sponsorships and nominations attach to the exact entity approved. Unless a narrow Corporations Act 2001 (Cth) s 50AAA associated-entity link applies (which frequently fails across discretionary trusts or sole-trader conversions), moving a Subclass 482 worker onto the new company&#x27;s Single Touch Payroll without first lodging a new sponsorship and nomination breaches Condition 8607. Two years later, when that worker applies for permanent residence under Subclass 186 Temporary Residence Transition (TRT), Home Affairs matches ATO STP employer ABNs against the original nomination and refuses permanent residency for lacking qualifying sponsored employment.<\/p>\n<h2 id=\"adverse-information-under-reg-113a-and-non-refun\" class=\"doc-h2\">Adverse information under reg 1.13A and non-refundable SAF levy forfeitures<\/h2>\n<p class=\"doc-p\">Compliance history across sister entities carries similar danger. Under reg 1.13A, &quot;adverse information&quot; covers Fair Work Ombudsman (FWO) infringement notices, underpayment audits, safety prosecutions, and ATO superannuation defaults involving the sponsoring company or any director, officeholder, or s 50AAA associated entity. Failing to declare a past FWO notice or director liquidation invites a PIC 4020 false-statement refusal alongside reg 1.13A, whereas upfront disclosure backed by verified rectification evidence lets a delegate lawfully disregard the history.<\/p>\n<p class=\"doc-p\">Every nomination refusal hurts financially because statutory SAF levy refunds under reg 2.73AA do not cover genuine-position, AMSR, or reg 1.13A failures. Sponsors lose $3,000 to $7,200+ outright, and Migration Act s 245AR makes recouping SAF levies from the sponsored worker a serious offence.<\/p>\n<h2 id=\"pre-lodgement-sponsorship-audits-for-employers-a\" class=\"doc-h2\">Pre-lodgement sponsorship audits for employers and sponsored nominees<\/h2>\n<p class=\"doc-p\">Before filing a SID Subclass 482 or Subclass 186 nomination, or before executing any business sale, trust restructure, or ABN change involving sponsored staff, submit your entity structure, proposed remuneration, and position details via the <a href=\"https://form.jotform.com/220391121528851\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Immigration Consultation Form<\/a> or visit the <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Official Links Hub<\/a> so an Accredited Specialist in Immigration Law (QLS) can audit <em>Cargo First<\/em> duties and entity continuity before SAF levies are put on the line.<\/p>\n\n          <div class=\"col-sources-box\">\n            Primary Authorities: Migration Regulations 1994 (Cth) regs 1.13A, 1.13B, 2.72, 5.19, Sch 8 cl 8607 \u00b7 Instrument F2026L00874 (eff. 1 July 2026) \u00b7 Cargo First Pty Ltd v MIBP [2016] FCA 30.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">WHEN TO CONSULT A QLS ACCREDITED SPECIALIST<\/span>\n            <h3 class=\"col-cta-title\">Facing an Urgent s 57 / NOICC / ART Deadline or Planning Corporate Sponsorship?<\/h3>\n            <p class=\"col-cta-desc\">Departmental response windows and ART review deadlines carry zero extension discretion. Attach your notice or corporate sponsorship details via our online consultation form for prompt specialist assessment.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/220391121528851\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">Open Immigration Consultation Form<\/a>\n              <a href=\"../../files/EN/PDF/01_Immigration_Self_Diagnosis_and_Official_Forms_Manual_2026_EN.pdf\" download class=\"col-btn-ghost\">Download Manual 01 (Immigration PDF)<\/a>\n              <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">Park &amp; Co Official Consultation Hub<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">Legal Disclaimer: This publication provides general legal information grounded in the Migration Act 1958 (Cth), Migration Regulations 1994, Ministerial Direction No. 123 and Federal Court authorities current as at November 2026. It does not constitute legal advice or create a solicitor-client relationship.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">More Curated Immigration Law Columns<\/h3>\n        <a href=\"../../?lang=en&amp;tab=immigration\" class=\"col-back-link num\">\u2190 Back to Immigration Self-Help Hub<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../pic-4020-s57-bogus-documents-withdrawal/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PIC 4020 &amp; INTEGRITY \u00b7 IMMIGRATION 09<\/span><h4 class=\"col-sib-title\">Received an s 57 Natural Justice Letter Over PIC 4020? Why Withdrawing Will Not Erase the Risk<\/h4><p class=\"col-sib-desc\">Examines purposeful falsity vs innocent mistake, skills assessment traps (Arora), why blind s 49 withdrawal backfires onshore, and Kaur waiver proof.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../noicc-visa-cancellation-direction-123/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">NOICC &amp; DIRECTION 123 \u00b7 IMMIGRATION 10<\/span><h4 class=\"col-sib-title\">NOICC Cancellations on Pending Charges and the 31 October 2026 Shift to Ministerial Direction 123<\/h4><p class=\"col-sib-desc\">Why untested police charges trigger s 116(1)(e) notices under Gong, how DIY apology letters prejudice criminal trials, and how to plead under Direction 123.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a><a href=\"../schedule-3-waiver-section-48-partner-visa/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">SECTION 48 &amp; SCHEDULE 3 \u00b7 IMMIGRATION 12<\/span><h4 class=\"col-sib-title\">Lodging an Onshore Partner Visa After Refusal or Overstay: Section 48 Bars and Schedule 3 Waivers<\/h4><p class=\"col-sib-desc\">Why genuine marriage alone never waives Criterion 3001, how post-application births or clinical dependencies count up to decision, and when offshore 309 is safer.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../art-merits-review-pic-4007-health-waiver/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ART APPEALS &amp; HEALTH WAIVERS \u00b7 IMMIGRATION 13<\/span><h4 class=\"col-sib-title\">Winning at the Administrative Review Tribunal (ART) and Challenging $86,000 Health Refusals<\/h4><p class=\"col-sib-desc\">How to cure refusals on de novo review, dismantle inflated MOC special-education or pharmaceutical costings, and win PIC 4007 undue-cost health waivers.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}}</script>

    (function () {
      const payload = JSON.parse(document.getElementById('col-payload').textContent);
      const root = document.getElementById('col-root');
      let cleanupScroll = null;

      function getLang() {
        const q = new URLSearchParams(window.location.search).get('lang');
        return q === 'en' ? 'en' : 'ko';
      }

      function bindTocSpy() {
        if (cleanupScroll) cleanupScroll();
        const links = Array.from(root.querySelectorAll('.col-toc-link'));
        if (!links.length) return;
        const targets = links
          .map((a) => document.getElementById(a.getAttribute('href').slice(1)))
          .filter(Boolean);
        function onScroll() {
          let activeIdx = 0;
          const offset = window.scrollY + 130;
          for (let i = 0; i < targets.length; i++) {
            if (targets[i].offsetTop <= offset) activeIdx = i;
          }
          links.forEach((a, idx) => a.classList.toggle('active', idx === activeIdx));
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        cleanupScroll = () => window.removeEventListener('scroll', onScroll);
        onScroll();
      }

      function render(lg) {
        const data = payload[lg] || payload.ko;
        document.documentElement.lang = lg;
        document.title = data.doc_title;
        root.innerHTML = data.html;
        root.querySelectorAll('[data-set-lang]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const next = btn.getAttribute('data-set-lang');
            const url = new URL(window.location.href);
            url.searchParams.set('lang', next);
            window.history.replaceState({}, '', url.toString());
            render(next);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });
        bindTocSpy();
      }

      render(getLang());
    })();
  </script>

  function fetchRetry(url, isHit, attempt) {

        return j.value;
      })
      .catch(function (err) {
        if (timer) clearTimeout(timer);
        var maxTries = (err && err.isRateLimit) ? 3 : 2;
        if (tries < maxTries) {
          var waitMs = (err && err.isRateLimit) ? (3800 + tries * 3600) : (1100 * (tries + 1));
          return new Promise(function (res) { setTimeout(res, waitMs); })
            .then(function () { return fetchRetry(url, isHit, tries + 1); });
        }
        throw err;
      });
  }

    var rowsHtml = items.map(function (item) {
      var pct = totalRef > 0 ? Math.round((item.count / totalRef) * 100) : 0;
      return '<div class="vc-ref-row">' +
        '<span class="vc-ref-name" title="' + item.label + '">' + item.label + '</span>' +
        '<div class="vc-ref-track"><div class="vc-ref-fill" style="width:' + Math.max(4, pct) + '%"></div></div>' +
        '<span class="vc-ref-val">' + fmt(item.count) + ' (' + pct + '%)</span>' +
        '</div>';
    }).join('');
    var note = isEn
      ? 'Privacy-safe coarse channel buckets only (1 per browser/day; zero IP, query string, or full referrer URL stored).'
      : '개인정보 보호형 채널 그룹 집계 (하루 브라우저당 1회 기준 &middot; 검색어·세부 URL·IP 미수집)';
    return head + '<div class="vc-ref-list">' + rowsHtml + '</div><p class="vc-ref-note">' + note + '</p>';
  }

  function loadHistoryRows(days) {
    var histCache = {};
    try { histCache = JSON.parse(localStorage.getItem(HIST_KEY) || '{}') || {}; } catch (e) {}
    var results = new Array(days.length);
    var pending = [];
    days.forEach(function (d, idx) {
      if (d < today && Array.isArray(histCache[d])) {
        results[idx] = histCache[d];
      } else if (d === today && typeof liveTodayViews === 'number' && typeof liveTodayVis === 'number') {
        results[idx] = [liveTodayViews, liveTodayVis];
      } else {
        pending.push({ d: d, idx: idx });
      }
    });

    var batchSize = pending.length > 7 ? 4 : 6;
    var pauseMs = pending.length > 7 ? 2900 : 180;
    var chain = Promise.resolve();
    for (var c = 0; c < pending.length; c += batchSize) {
      (function (slice, waitFirst) {
        chain = chain.then(function () {
          return (waitFirst ? delay(pauseMs) : Promise.resolve()).then(function () {
            return Promise.all(slice.map(function (item) {
              var k = item.d.replace(/-/g, '');
              var pViews = (item.d === today && typeof liveTodayViews === 'number')
                ? Promise.resolve(liveTodayViews)
                : call('get', 'day-' + k).catch(function () { return null; });
              var pVis = (item.d === today && typeof liveTodayVis === 'number')
                ? Promise.resolve(liveTodayVis)
                : call('get', 'vday-' + k).catch(function () { return null; });
              return Promise.all([pViews, pVis]).then(function (pair) {
                var v0 = pair[0] == null ? 0 : pair[0];
                var v1 = pair[1] == null ? 0 : pair[1];
                results[item.idx] = [v0, v1];
                if (item.d < today && pair[0] !== null && pair[1] !== null) {
                  histCache[item.d] = [v0, v1];
                }
              });
            }));
          });
        });
      })(pending.slice(c, c + batchSize), c > 0);
    }
    return chain.then(function () {
      try { localStorage.setItem(HIST_KEY, JSON.stringify(histCache)); } catch (e) {}
      return results.map(function (r) { return r || [0, 0]; });
    });
  }

  var cachedRefMap = null;

  function loadAndRenderModal(refreshRefs) {
    syncCounterLang();
    var isEn = uiLang() === 'en';
    var fullDays = lastDays(30);
    var days = activeRange === 7 ? lastDays(7) : fullDays;
    var body = modal.querySelector('.vc-body');
    var chartWaitMsg = isEn ? 'Loading daily statistics&hellip;' : '일별 통계를 불러오는 중이에요&hellip;';
    var refWaitMsg = isEn ? 'Loading today&rsquo;s referral channels&hellip;' : '오늘 유입 채널 집계를 불러오는 중이에요&hellip;';
    var existingRefHtml = (!refreshRefs && cachedRefMap) ? renderReferrerBox(cachedRefMap) : ('<div class="vc-ref-note">' + refWaitMsg + '</div>');

    /* Render toolbar, loading placeholder, referral box, and 1-click share bar IMMEDIATELY (0ms) */
    body.innerHTML = renderToolbar(isEn, fullDays.length) +
      '<div id="vc-chart-slot"><p class="vc-sum">' + chartWaitMsg + '</p></div>' +
      '<div id="vc-ref-box" class="vc-ref-box">' + existingRefHtml + '</div>' +
      renderShareBar(isEn);

    loadHistoryRows(days)
      .then(function (rows) {
        var slot = document.getElementById('vc-chart-slot');
        if (slot) slot.innerHTML = renderChartSvg(days, rows, uiLang() === 'en');
        if (!refreshRefs && cachedRefMap) return cachedRefMap;
        return delay(180).then(function () { return loadTodayReferrers(day); });
      })
      .then(function (refMap) {
        if (refMap) cachedRefMap = refMap;
        var refBox = document.getElementById('vc-ref-box');
        if (refBox && refMap) refBox.innerHTML = renderReferrerBox(refMap);
      })
      .catch(function () {
        var slot = document.getElementById('vc-chart-slot');
        if (slot && !slot.querySelector('svg')) {
          slot.textContent = uiLang() === 'en' ? 'Could not load the chart.' : '그래프를 불러오지 못했어요.';
        }
      });
  }

  function open() {
    activeRange = 7;
    modal.classList.add('open');
    loadAndRenderModal(true);
  }
  box.setAttribute('role', 'button');
  box.setAttribute('tabindex', '0');
  box.addEventListener('click', open);
  box.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
})();
  </script>
</body>
</html>
