=\"col-topbar-brand\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \u00b7 \ud638\uc8fc \uac00\uc871\ubc95 \uc26c\uc6b4 \ud310\ub840 \uce7c\ub7fc<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn active\">\ud55c\uad6d\uc5b4<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">\uc628\ub77c\uc778 \uc0c1\ub2f4 \uc2e0\uccad \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">\uc0ac\uc2e4\ud63c \uacbd\uacc4\u00b7\uae30\ud55c\ub3c4\uacfc \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 18<\/span>\n          <span class=\"col-verified-pill num\">1\ucc28 \ubc95\ub839\u00b7\ud310\ub840 \uac80\uc99d \uc644\ub8cc (2026.11)<\/span>\n          <span class=\"col-time-pill num\">\uc57d 9\ubd84 \uc18c\uc694<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">\ub3d9\uac70\ub294 \uc548 \ud558\uace0 \uc0dd\ud65c\ube44\ub9cc \uc92c\ub294\ub370 \uc0ac\uc2e4\ud63c(De Facto) \uc18c\uc1a1\uc774 \ub4e4\uc5b4\uc654\ub2e4\uba74: \uc0ac\uc2e4\ud63c \uc778\uc815 \uae30\uc900(s 4AA)\uacfc \ub9c8\uac10 \uae30\ud55c \uc608\uc678 \uc2e0\uccad(s 44)<\/h1>\n        <p class=\"col-subtitle\">17\ub144 \uad50\uc81c\u00b7\ub9e4\ub2ec \uc0dd\ud65c\ube44 \uc9c0\uc6d0\uc5d0\ub3c4 \uc0ac\uc2e4\ud63c\uc744 \uc778\uc815\ud558\uc9c0 \uc54a\uc740 Jonah &amp; White \ud310\uacb0, \uc694\uc591\uc6d0 \uc785\uc18c \ud6c4 \uacb0\ubcc4 \uae30\uc900(Fairbairn), 1\ub144\u00b72\ub144 \ub9c8\uac10 \uae30\ud55c \ub4a4 \uc608\uc678 \ud5c8\uac00 \ubd84\uc11d<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">\ubc15\ucc3d\ubbfc \ub300\ud45c\ubcc0\ud638\uc0ac (Chang Min Park)<\/div>\n            <div class=\"col-author-role\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \ub300\ud45c\ubcc0\ud638\uc0ac \u00b7 \ud638\uc8fc \ud038\uc990\ub79c\ub4dc\uc8fc \ubcc0\ud638\uc0ac\ud68c \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col18_fam_defacto_hero.jpg\" alt=\"\ub3d9\uac70\ub294 \uc548 \ud558\uace0 \uc0dd\ud65c\ube44\ub9cc \uc92c\ub294\ub370 \uc0ac\uc2e4\ud63c(De Facto) \uc18c\uc1a1\uc774 \ub4e4\uc5b4\uc654\ub2e4\uba74: \uc0ac\uc2e4\ud63c \uc778\uc815 \uae30\uc900(s 4AA)\uacfc \ub9c8\uac10 \uae30\ud55c \uc608\uc678 \uc2e0\uccad(s 44)\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">\ubc95\ub960\ud63c \uc0c1\ud0dc\uc5d0\uc11c\ub3c4 \uc81c3\uc790\uc640 \uc0ac\uc2e4\ud63c\uc774 \uc778\uc815\ub420 \uc218\ub294 \uc788\uc5b4\uc694(s 4AA(5)(b)). \ub2e4\ub9cc 17\ub144 \ub3d9\uc548 \ub9e4\ub2ec \uc0dd\ud65c\ube44\ub97c \ubcf4\ub0c8\ub354\ub77c\ub3c4 \uc2e4\uc81c\ub85c \uc0b6\uc744 \ud569\uce58\uc9c0 \uc54a\uc558\ub2e4\uba74 \uc7ac\uc0b0\ubd84\ud560 \uccad\uad6c\ub294 \uae30\uac01\ub3fc\uc694.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">17\ub144 \uad50\uc81c \uae30\uac01<\/div><div class=\"col-stat-lbl\">\ub9e4\uc6d4 \uae08\uc804 \uc9c0\uc6d0\uc5d0\ub3c4 \ubcc4\uac1c \uac00\uad6c \uc720\uc9c0\ub85c \uc0ac\uc2e4\ud63c \ubd80\uc815 (Jonah &amp; White [2012])<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">\uae30\ud63c \uc911 \uc131\ub9bd \uac00\ub2a5<\/div><div class=\"col-stat-lbl\">\ubc95\ub960\ud63c\uacfc \ubcd1\uc874\ud558\ub294 \uc0ac\uc2e4\ud63c \uc778\uc815 \uc870\ud56d (s 4AA(5)(b)) \ubc0f \uc5c4\uaca9 \uc785\uc99d<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">12\uac1c\uc6d4 / 24\uac1c\uc6d4<\/div><div class=\"col-stat-lbl\">\ub3c4\uacfc \uc2dc \uc2e4\uc9c8\uc801 \uace4\uad81(Hardship)\uacfc \uc9c0\uccb4 \uc0ac\uc720\ub97c \uc785\uc99d\ud574\uc57c \uc5f4\ub9ac\ub294 s 44 \uad00\ubb38<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">\uc774 \uce7c\ub7fc\uc758 \ubaa9\ucc28<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#\ubc95\ub960\ud63c-\ubc30\uc6b0\uc790\uac00-\uc788\uc5b4\ub3c4-\uc0ac\uc2e4\ud63c\uc774-\ub41c\ub2e4\uace0-jonah-white\uac00-\uadf8\uc740-\uc0b6\uc758-\uacb0\ud569-\uacbd\uacc4\uc120\" class=\"col-toc-link lvl-2\">\ubc95\ub960\ud63c \ubc30\uc6b0\uc790\uac00 \uc788\uc5b4\ub3c4 \uc0ac\uc2e4\ud63c\uc774 \ub41c\ub2e4\uace0? Jonah &amp; White\uac00 \uadf8\uc740 \uc0b6\uc758 \uacb0\ud569 \uacbd\uacc4\uc120<\/a><a href=\"#\ubab8\uc774-\ub5a8\uc5b4\uc838-\uc0b4\uba74-\uc0ac\uc2e4\ud63c\uc774-\ub05d\ub09c-\uac78\uae4c-fairbairn-v-radecki-\uc5f0\ubc29\ub300\ubc95\uc6d0-\ud310\" class=\"col-toc-link lvl-2\">\ubab8\uc774 \ub5a8\uc5b4\uc838 \uc0b4\uba74 \uc0ac\uc2e4\ud63c\uc774 \ub05d\ub09c \uac78\uae4c? Fairbairn v Radecki \uc5f0\ubc29\ub300\ubc95\uc6d0 \ud310\uacb0<\/a><a href=\"#\ub2e8-\ud558\ub8e8\ub9cc-\ub2a6\uc5b4\ub3c4-\ub2eb\ud788\ub294-\uc2dc\uacc4-\uc774\ud63c-\ud6c4-12\uac1c\uc6d4\uc0ac\uc2e4\ud63c-\ubcc4\uac70-\ud6c4-2\ub144\uacfc-s-44-\ud2b9\ubcc4\ud5c8\uac00\" class=\"col-toc-link lvl-2\">\ub2e8 \ud558\ub8e8\ub9cc \ub2a6\uc5b4\ub3c4 \ub2eb\ud788\ub294 \uc2dc\uacc4: \uc774\ud63c \ud6c4 12\uac1c\uc6d4\u00b7\uc0ac\uc2e4\ud63c \ubcc4\uac70 \ud6c4 2\ub144\uacfc s 44 \ud2b9\ubcc4\ud5c8\uac00<\/a><a href=\"#\uc0ac\uc2e4\ud63c-\ubc29\uc5b4\uc640-\uc81c\ucc99\uae30\uac04-\ub3c4\uacfc-\uc0ac\uac74\uc5d0\uc11c-\ucd08\ub3d9-\ub300\uc751\uc774-\uc2b9\ud328\ub97c-\uac00\ub974\ub294-\uc774\uc720\" class=\"col-toc-link lvl-2\">\uc0ac\uc2e4\ud63c \ubc29\uc5b4\uc640 \uc81c\ucc99\uae30\uac04 \ub3c4\uacfc \uc0ac\uac74\uc5d0\uc11c \ucd08\ub3d9 \ub300\uc751\uc774 \uc2b9\ud328\ub97c \uac00\ub974\ub294 \uc774\uc720<\/a><a href=\"#\uc0ac\uc2e4\ud63c-\uacbd\uacc4\uc120-\ub2e4\ud23c\uacfc-\uc2dc\ud55c-\ub3c4\uacfc-\ub2a6\uae30-\uc804\uc5d0-\uc9c4\ub2e8\ubc1b\uc73c\uc138\uc694\" class=\"col-toc-link lvl-2\">\uc0ac\uc2e4\ud63c \uacbd\uacc4\uc120 \ub2e4\ud23c\uacfc \uc2dc\ud55c \ub3c4\uacfc, \ub2a6\uae30 \uc804\uc5d0 \uc9c4\ub2e8\ubc1b\uc73c\uc138\uc694<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">\uac00\uc871\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../?lang=ko&amp;tab=family\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">\ubc95\ub960\ud63c\uc740 \ud63c\uc778\uc2e0\uace0\uc11c\uc640 \uc774\ud63c \uba85\ub839\uc11c\uac00 \uc2dc\uc791\uc77c\uacfc \uc885\ub8cc\uc77c\uc744 \ub2ec\ub825 \uc704\uc5d0 \ucc0d\uc5b4 \uc918\uc694. \ubc18\uba74 \ud638\uc8fc \uc0ac\uc2e4\ud63c(De Facto)\uc740 \uc99d\uba85\uc11c \ud55c \uc7a5 \uc5c6\uc774 \uc77c\uc0c1\uc758 \ud754\uc801\ub9cc\uc73c\ub85c \uc7ac\uc0b0\ubd84\ud560(s 90SM) \uccad\uad6c\uad8c\uc774 \uc0dd\uaca8\ub098\uc8e0. \uc774\ub807\ub2e4 \ubcf4\ub2c8 \ubcf8\uc548 \uacc4\uc0b0\ud45c\ub97c \ud3b4 \ubcf4\uae30\ub3c4 \uc804\uc5d0 \ubc95\uc6d0 \ud604\uad00\ubb38 \uc55e\uc5d0\uc11c \uce58\uc5f4\ud55c \uad00\ubb38 \ub2e4\ud23c\uc774 \ubc8c\uc5b4\uc838\uc694. \uc9d1\ub3c4 \ub530\ub85c \uc37c\uace0 \ubc95\ub960\uc0c1 \ubc30\uc6b0\uc790\uae4c\uc9c0 \uc788\uc5c8\ub294\ub370 \uc0dd\ud65c\ube44 \uc880 \ubcf4\ud0dc\uc92c\ub2e4\uace0 \ubb34\uc2a8 \uc0ac\uc2e4\ud63c\uc774\ub0d0\uba70 \uc5b5\uc6b8\ud574\ud558\uc2dc\ub294 \ubd84\uc774 \uacc4\uc138\uc694. \ubc18\ub300\ub85c \ud5e4\uc5b4\uc9c4 \uc9c0 2\ub144 \uba87 \uac1c\uc6d4\uc774 \uc9c0\ub098\uc11c\uc57c \ub2eb\ud78c \uc2dc\uacc4\ub97c \ub418\ub3cc\ub9b4 \uae38\uc774 \uc5c6\ub290\ub0d0\uba70 \ub2e4\uae09\ud788 \ucc3e\uc544\uc624\uc2dc\ub294 \ubd84\ub3c4 \uacc4\uc2dc\uc8e0. \uacfc\uc5f0 \uc5b4\ub514\uae4c\uc9c0\uac00 \uc0ac\uc2e4\ud63c\uc77c\uae4c\uc694? \ud638\uc8fc \uac00\uc871\ubc95(Family Law Act 1975)\uc774 \uae0b\ub294 \uc131\ub9bd\u00b7\ud30c\ud0c4 \uacbd\uacc4\uc120\uacfc \uc81c\ucc99\uae30\uac04 \ub3c4\uacfc \ud2b9\ubcc4\ud5c8\uac00(s 44) \uae30\uc900\uc744 \ud310\ub840\ub85c \uc9da\uc5b4 \ubcfc\uac8c\uc694.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 382\" width=\"100%\" role=\"img\" aria-label=\"\uc0ac\uc2e4\ud63c \uc7ac\uc0b0\ubd84\ud560 \uc18c\uc1a1\uc758 2\ub300 \uc120\uacb0 \uad00\ubb38: \uad00\uacc4 \uc131\ub9bd\uacfc \uc81c\ucc99\uae30\uac04 \ub3c4\uacfc \ud5c8\uac00\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"381\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">\ubcf8\uc548 \uc804 \uad00\ud560\uad8c \uc804\uc7c1 \u00b7 \uc0ac\uc2e4\ud63c \uc131\ub9bd(s 4AA) \uacbd\uacc4\uc120\uacfc \ub3c4\uacfc \uad6c\uc81c(s 44)<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">\uc0ac\uc2e4\ud63c \uc7ac\uc0b0\ubd84\ud560 \uc18c\uc1a1\uc758 2\ub300 \uc120\uacb0 \uad00\ubb38: \uad00\uacc4 \uc131\ub9bd\uacfc \uc81c\ucc99\uae30\uac04 \ub3c4\uacfc \ud5c8\uac00<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">\uadfc\uac70: Jonah &amp; White [2012] FamCAFC 200 \u00b7 Fairbairn v Radecki [2022] HCA 18 \u00b7 Whitford [1979] \u00b7 Skelton [2022]<\/text>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"38\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">\uad00\ubb38 1 \u00b7 \uc5f0\uc778\u00b7\ud6c4\uc6d0 vs \ubc95\uc801 \uc0ac\uc2e4\ud63c (s 4AA / s 90SB)<\/text>\n  <circle cx=\"42\" cy=\"144\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"54\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\uae30\ud63c\uc790\uc640\uc758 \uc774\uc911 \uc0ac\uc2e4\ud63c\ub3c4 \ubc95\ub9ac\uc0c1 \uac00\ub2a5 (s 4AA(5)(b))<\/text>\n  <text x=\"54\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">\ubc95\ub960\ud63c \uc720\uc9c0 \uc911\uc774\ub77c\ub3c4 \uc81c3\uc790\uc640 \uc0ac\uc2e4\ud63c \uc131\ub9bd \uac00\ub2a5 \u00b7 \ub2e8 \uc785\uc99d \uae30\uc900\uc774 \ub9e4\uc6b0 \uc5c4\uaca9.<\/text>\n  <circle cx=\"42\" cy=\"196\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"54\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ud575\uc2ec \uc7a3\ub300: &#x27;\uc0b6\uc758 \uacb0\ud569(Coupledom)&#x27; \uc720\ubb34 (Jonah &amp; White)<\/text>\n  <text x=\"54\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">17\ub144 \uad50\uc81c\u00b7\ub9e4\ub2ec \uc0dd\ud65c\ube44 \uc1a1\uae08\uc5d0\ub3c4 \uac01\uc790 \uac00\uc815\uc744 \uc720\uc9c0\ud574 \uc0ac\uc2e4\ud63c \uae30\uac01!<\/text>\n  <circle cx=\"42\" cy=\"248\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"54\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ubcc4\uac70 \uc2dc\uc810 \uac1d\uad00\uc801 \ud655\uc815 (Fairbairn v Radecki HCA)<\/text>\n  <text x=\"54\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">\uce58\ub9e4 \uc694\uc591\uc6d0 \uc785\uc18c \uc790\uccb4\ubcf4\ub2e4 \uc7ac\uc0b0 \ubd84\ub9ac\u00b7\uc0c1\ud638 \ubd80\uc591 \uac70\uc808 \uc2dc\uc810\uc774 \ud30c\ud0c4\uc77c.<\/text>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"466\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">\uad00\ubb38 2 \u00b7 \uae30\ud55c \ub3c4\uacfc \ud6c4 \ud2b9\ubcc4\ud5c8\uac00 (s 44(3) 1\ub144 / s 44(5) 2\ub144)<\/text>\n  <circle cx=\"470\" cy=\"144\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">1\ub2e8\uacc4: \uc2e4\uc9c8\uc801 \uace4\uad81(Substantial Hardship) \uc785\uc99d<\/text>\n  <text x=\"482\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">\ub2e8\uc21c\ud55c \uccad\uad6c\uad8c \uc0c1\uc2e4\uc774 \uc544\ub2c8\ub77c \uc608\uc0c1 \ubc30\uc0c1\uc561 \ub300\ube44 \uc18c\uc1a1\ube44 \uc2e4\uc775\uae4c\uc9c0 \uc2ec\uc0ac(Whitford).<\/text>\n  <circle cx=\"470\" cy=\"196\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">2\ub2e8\uacc4: \uc9c0\uccb4 \uc0ac\uc720 \uc18c\uba85 \ubc0f \uc0c1\ub300\ubc29 \ubd88\uc774\uc775 \ud615\ub7c9<\/text>\n  <text x=\"482\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">\uc77c\ubd80 \uae30\uac04 \uc124\uba85 \uacf5\ubc31\ub9cc\uc73c\ub85c \uae30\uacc4\uc801 \uae30\uac01 \ubd88\uac00\ud558\ub098 \uc124\ub4dd\ub825 \ud544\uc218(Gadzen; Skelton).<\/text>\n  <circle cx=\"470\" cy=\"248\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ud328\uc18c \uc2dc \uc0c1\ub300\ubc29 \ubcc0\ud638\uc0ac\ube44 \ubc30\uc0c1(Costs Order) \uc9c1\uaca9\ud0c4<\/text>\n  <text x=\"482\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">\uad00\ud560\uad8c \uc608\ube44\uc2ec\ubb38(Threshold Hearing) \uc804\uc5d0 \uc2b9\uc0b0\uacfc \ube44\uc6a9 \ub9ac\uc2a4\ud06c\ub97c \ub0c9\uc815\ud788 \ub530\uc838\uc57c \ud568.<\/text>\n  <rect x=\"22\" y=\"328\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"351\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1D6B48\">\uc2e4\uc804 \ud3ec\uc778\ud2b8: \uc0ac\uc2e4\ud63c \uc131\ub9bd \ubd80\uc778 \ubc29\uc5b4(s 90RD)\ub098 1\ub144\u00b72\ub144 \ub3c4\uacfc \uc0ac\uac74 \uad6c\uc81c\ub294 \ubcf8\uc548 \uc804\uc5d0 \uc5f4\ub9ac\ub294 \uc608\ube44 \uad00\ud560 \uc2ec\ub9ac\uc5d0\uc11c \ubaa8\ub4e0 \uc2b9\ubd80\uac00 \uac08\ub9bd\ub2c8\ub2e4.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 1: \uc0ac\uc2e4\ud63c(s 4AA) \uc131\ub9bd \ud310\ub2e8 \uae30\uc900\uacfc \uc81c\ucc99\uae30\uac04 \ub3c4\uacfc \ud6c4 \ud2b9\ubcc4\ud5c8\uac00(s 44) \uad00\ubb38<\/figcaption><\/figure>\n<h2 id=\"\ubc95\ub960\ud63c-\ubc30\uc6b0\uc790\uac00-\uc788\uc5b4\ub3c4-\uc0ac\uc2e4\ud63c\uc774-\ub41c\ub2e4\uace0-jonah-white\uac00-\uadf8\uc740-\uc0b6\uc758-\uacb0\ud569-\uacbd\uacc4\uc120\" class=\"doc-h2\">\ubc95\ub960\ud63c \ubc30\uc6b0\uc790\uac00 \uc788\uc5b4\ub3c4 \uc0ac\uc2e4\ud63c\uc774 \ub41c\ub2e4\uace0? Jonah &amp; White\uac00 \uadf8\uc740 \uc0b6\uc758 \uacb0\ud569 \uacbd\uacc4\uc120<\/h2>\n<p class=\"doc-p\">\uba3c\uc800 \ub9ce\uc740 \ubd84\uc774 \ub180\ub77c\uc2dc\ub294 \uc870\ubb38\ubd80\ud130 \ubcfc\uae4c\uc694? \ud638\uc8fc \uac00\uc871\ubc95 s 4AA(5)(b)\ub294 \ud55c\ucabd\uc774 \uc81c3\uc790\uc640 \ubc95\ub960\ud63c \uc0c1\ud0dc\uc5d0 \uc788\uac70\ub098 \ub2e4\ub978 \uc0ac\uc2e4\ud63c \uad00\uacc4\uc5d0 \uc788\ub354\ub77c\ub3c4 \ubcc4\uac1c\uc758 \uc0ac\uc2e4\ud63c\uc774 \ub3d9\uc2dc\uc5d0 \uc131\ub9bd\ud560 \uc218 \uc788\ub2e4\uace0 \uba85\uc2dc\ud574\uc694. \ubcf8\uac00\uc5d0\uc11c \uc544\ub0b4\uc640 \uc0b4\uc558\uc73c\ub2c8 \uad50\uc81c \uc0c1\ub300\ubc29\uc740 \uc808\ub300 \uc7ac\uc0b0\ubd84\ud560\uc744 \uccad\uad6c\ud560 \uc218 \uc5c6\uc744 \uac70\ub77c\ub294 \ubbff\uc74c\uc740 \ubc95\uc870\ubb38 \uc55e\uc5d0\uc11c \uace7\ubc14\ub85c \uae68\uc838\uc694.<\/p>\n<p class=\"doc-p\">\ubb3c\ub860 \ub3c8\uacfc \uc2dc\uac04\uc744 \ub098\ub234\ub2e4\uace0 \ubaa8\ub450 \uc0ac\uc2e4\ud63c\uc774 \ub418\uc9c0\ub294 \uc54a\uc544\uc694. \uc774 \uacbd\uacc4\uc120\uc744 \uba85\ud655\ud788 \uadf8\uc740 \ud310\ub840\uac00 \ud56d\uc18c\ubd80\uc758 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2012/200.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Jonah &amp; White<\/em> [2012] FamCAFC 200<\/a> \ud310\uacb0\uc774\uc5d0\uc694. \uae30\ud63c \ub0a8\uc131\uc774 \ubcf8\uac00\uc5d0\uc11c \uc544\ub0b4\u00b7\uc790\ub140\uc640 \uc0b4\uba74\uc11c \ub2e4\ub978 \uc5ec\uc131\uacfc 17\ub144 \ub3d9\uc548 \ube44\ubc00 \uad00\uacc4\ub97c \uc774\uc5b4 \uc654\uc5b4\uc694. \ub9e4\ub2ec \uc0dd\ud65c\ube44\ub97c \ubcf4\ub0c8\uace0 \uc8fc\ud0dd \ub9e4\uc785 \uc790\uae08 $24,000\ub3c4 \uc9c0\uc6d0\ud588\uc8e0. \uacb0\ubcc4 \ud6c4 \uc5ec\uc131\uc740 s 90RD \uc0ac\uc2e4\ud63c \ud655\uc778 \uc2e0\uccad\uc744 \ub0c8\uc5b4\uc694. \ubc95\uc6d0\uc758 \ub2f5\uc740 \uae30\uac01\uc774\uc5c8\uc5b4\uc694. \uc9c4\uc815\ud55c \uac00\uc0ac \uacf5\ub3d9\uccb4 \uae30\ubc18(genuine domestic basis \u00b7 s 4AA(1))\uc758 \ud575\uc2ec\uc740 \ub450 \uc0b6\uc758 \uacb0\ud569(coupledom \u00b7 \ub450 \uac1c\ubcc4 \uc0b6\uc774 \ud558\ub098\uc758 \uacf5\ub3d9 \uc0b6\uc73c\ub85c \ud569\uccd0\uc84c\ub294\uc9c0 \uc5ec\ubd80)\uc774\ub77c\uace0 \ubcf8 \uac70\uc608\uc694. \ub450 \uc0ac\ub78c\uc740 17\ub144 \ub0b4\ub0b4 \uac70\ucc98\ub97c \ubd84\ub9ac\ud588\uace0 \ub300\uc678 \ubaa8\uc784\uc5d0 \ucee4\ud50c\ub85c \ub098\uc11c\uc9c0 \uc54a\uc558\uc73c\uba70 \uac00\uacc4\ub97c \ud569\uce5c \uc801\ub3c4 \uc5c6\uc5c8\uac70\ub4e0\uc694. \uc815\uae30 \uc1a1\uae08\uc774 \uc788\uc5c8\ub354\ub77c\ub3c4 \uc0b6\uc774 \ud558\ub098\ub85c \ud569\uccd0\uc9c4 \ud754\uc801\uc774 \uc5c6\uc73c\uba74 s 4AA(2) \ubb38\ud131\uc744 \ub118\uc9c0 \ubabb\ud574\uc694. \ubcf8\uc548 \uccad\uad6c\ub97c \ud558\ub824\uba74 \ucd1d \uae30\uac04 2\ub144 \uc774\uc0c1\uc774\ub098 \uacf5\ub3d9 \uc790\ub140 \ub610\ub294 \uc911\ub300\ud55c \uae30\uc5ec\ub77c\ub294 s 90SB \uc694\uac74\ub3c4 \ud568\uaed8 \uac16\ucdb0\uc57c \ud558\uc8e0.<\/p>\n<h2 id=\"\ubab8\uc774-\ub5a8\uc5b4\uc838-\uc0b4\uba74-\uc0ac\uc2e4\ud63c\uc774-\ub05d\ub09c-\uac78\uae4c-fairbairn-v-radecki-\uc5f0\ubc29\ub300\ubc95\uc6d0-\ud310\" class=\"doc-h2\">\ubab8\uc774 \ub5a8\uc5b4\uc838 \uc0b4\uba74 \uc0ac\uc2e4\ud63c\uc774 \ub05d\ub09c \uac78\uae4c? Fairbairn v Radecki \uc5f0\ubc29\ub300\ubc95\uc6d0 \ud310\uacb0<\/h2>\n<p class=\"doc-p\">\uc0ac\uc2e4\ud63c \uc131\ub9bd\uc740 \uba85\ubc31\ud574\ub3c4 \uc815\ud655\ud788 \uc5b8\uc81c \ud30c\ud0c4 \ub0ac\ub294\uac00\ub97c \ub450\uace0 \uc2b9\ud328\uac00 \uac08\ub9ac\uae30\ub3c4 \ud574\uc694. \ud30c\ud0c4\uc77c\uc5d0 \ub530\ub77c \ubd84\ud560 \uc790\uc0b0 \ubc94\uc704\uc640 \ubcc4\uac70 \ud6c4 2\ub144 \uc81c\ucc99\uae30\uac04\uc758 \ucd9c\ubc1c\uc810\uc774 \uc815\ud574\uc9c0\uac70\ub4e0\uc694. \uc5f0\ubc29\ub300\ubc95\uc6d0 \uc804\uc6d0\uc77c\uce58 \ud310\uacb0\uc778 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2022/18.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Fairbairn v Radecki<\/em> [2022] HCA 18<\/a>\uc774 \ud655\uace0\ud55c \uae30\uc900\uc810\uc774\uc5d0\uc694.<\/p>\n<p class=\"doc-p\">\ud3c9\uc18c \uc7ac\uc0b0\uc744 \ubd84\ub9ac\ud574 \uad00\ub9ac\ud558\ub358 \ub178\ub144 \uc0ac\uc2e4\ud63c \ucee4\ud50c\uc774 \uc788\uc5c8\uc5b4\uc694. \uc5ec\uc131\uc5d0\uac8c \uc911\uc99d \uce58\ub9e4\uac00 \ucc3e\uc544\uc640 \uc694\uc591\uc2dc\uc124(aged care)\uc5d0 \uc601\uad6c \uc785\uc18c\ud588\uace0 \uacf5\uacf5\uc2e0\ud0c1\uad00\ub9ac\uc778\uc774 \uc694\uc591\ube44 \ub9c8\ub828\uc744 \uc704\ud574 \uc5ec\uc131 \uc8fc\ud0dd \ub9e4\uac01\uc5d0 \ub098\uc130\uc8e0. \uadf8\ub7ec\uc790 \ub0a8\uc131 \ud30c\ud2b8\ub108\ub294 \uc790\uc0b0 \ubd84\ub9ac \ud0dc\ub3c4\ub97c \uace0\uc218\ud55c \ucc44 \uc5ec\uc131 \ubcf5\ub9ac\uc5d0 \ud544\uc694\ud55c \uc7ac\uc815 \ud611\uc870\ub97c \uac70\ubd80\ud558\uba70 \uc0c8 \uc704\uc784\uc7a5\uacfc \uc720\uc5b8\uc7a5 \uc791\uc131\ub9cc \uc694\uad6c\ud588\uc5b4\uc694. \uc5f0\ubc29\ub300\ubc95\uc6d0\uc740 \ub450 \uac00\uc9c0 \uc6d0\uce59\uc744 \ubc1d\ud614\uc5b4\uc694. \uccab\uc9f8\ub85c \uc694\uc591\uc2dc\uc124 \uc785\uc18c\ub098 \uad11\uc0b0 \uad50\ub300\uadfc\ubb34(FIFO)\ucc98\ub7fc \ubd88\uac00\ud53c\ud55c \ubb3c\ub9ac\uc801 \ubcc4\uac70\ub9cc\uc73c\ub85c\ub294 \uc0ac\uc2e4\ud63c\uc774 \uc790\ub3d9 \uc885\ub8cc\ub418\uc9c0 \uc54a\uc544\uc694. \ub3d9\uac70\uac00 \uc874\uc18d\uc758 \ud544\uc218 \uc694\uac74\uc740 \uc544\ub2c8\uac70\ub4e0\uc694. \ub458\uc9f8\ub85c \uacf5\ub3d9\uc758 \uc0b6\uc744 \uc774\uc5b4 \uac00\ub294 \ub370 \ud544\uc694\ud55c \uc7ac\uc815\u00b7\uc0dd\ud65c\uc0c1 \uc870\uc815(necessary adjustments)\uc744 \uac1d\uad00\uc801\uc73c\ub85c \uac70\ubd80\ud558\uba70 \uac01\uc790 \uc7ac\uc0b0 \ubcf4\ud638\uc5d0\ub9cc \ub9e4\ub2ec\ub9b0 \uc2dc\uc810\uc5d0\ub294 s 90SM\uc0c1 \uc0ac\uc2e4\ud63c\uc774 \ucd5c\uc885 \ud30c\ud0c4 \ub09c \uac83\uc73c\ub85c \ud310\uc815\ud588\uc5b4\uc694.<\/p>\n<h2 id=\"\ub2e8-\ud558\ub8e8\ub9cc-\ub2a6\uc5b4\ub3c4-\ub2eb\ud788\ub294-\uc2dc\uacc4-\uc774\ud63c-\ud6c4-12\uac1c\uc6d4\uc0ac\uc2e4\ud63c-\ubcc4\uac70-\ud6c4-2\ub144\uacfc-s-44-\ud2b9\ubcc4\ud5c8\uac00\" class=\"doc-h2\">\ub2e8 \ud558\ub8e8\ub9cc \ub2a6\uc5b4\ub3c4 \ub2eb\ud788\ub294 \uc2dc\uacc4: \uc774\ud63c \ud6c4 12\uac1c\uc6d4\u00b7\uc0ac\uc2e4\ud63c \ubcc4\uac70 \ud6c4 2\ub144\uacfc s 44 \ud2b9\ubcc4\ud5c8\uac00<\/h2>\n<p class=\"doc-p\">\ub450 \ubc88\uc9f8 \uad00\ubb38\uc740 \ub0c9\ud639\ud55c \uc81c\ucc99\uae30\uac04\uc774\uc5d0\uc694. \ubc95\ub960\ud63c\uc740 \uc774\ud63c \ubc1c\ud6a8\uc77c(s 55(1))\ub85c\ubd80\ud130 12\uac1c\uc6d4 \uc774\ub0b4(s 44(3))\uc5d0 \uc18c\uc7a5\uc744 \ub0b4\uc57c \ud574\uc694. \uc0ac\uc2e4\ud63c\uc740 \ucd5c\uc885 \ubcc4\uac70\uc77c\ub85c\ubd80\ud130 2\ub144(24\uac1c\uc6d4) \uc774\ub0b4(s 44(5))\uac00 \uc808\ub300 \uc2dc\ud55c\uc774\uc8e0. \ub2e8 \ud558\ub8e8\ub9cc \ub2a6\uc5b4\ub3c4 \ub2f9\uc5f0 \uc81c\uc18c\uad8c\uc740 \uc0ac\ub77c\uc838\uc694. \ubc95\uc6d0\uc758 \ud2b9\ubcc4\ud5c8\uac00(s 44(4) \u00b7 s 44(6))\ub97c \uba3c\uc800 \ud1b5\uacfc\ud574\uc57c\ub9cc \ubcf8\uc548\uc744 \ub2e4\ud234 \uc218 \uc788\uc5b4\uc694.<\/p>\n<p class=\"doc-p\">\ud2b9\ubcc4\ud5c8\uac00\uc758 3\ub300 \ud310\ub840 \ubb38\ud131\uc740 \ub192\uc544\uc694. \uba3c\uc800 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCA/1979/3.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Whitford &amp; Whitford<\/em> [1979] FamCA 3<\/a> \ud310\uacb0\uc740 \ud5c8\uac00 \uac70\uc808 \uc2dc \uc2e0\uccad\uc778\uc5d0\uac8c \uc911\ub300\ud55c \uacbd\uc81c\uc801 \uace4\uad81(substantial hardship)\uc774 \uc0dd\uaca8\uc57c \ud55c\ub2e4\uace0 \ubabb \ubc15\uc558\uc5b4\uc694. \uc2b9\uc0b0 \uc788\ub294 \uccad\uad6c\uad8c(prima facie claim)\uc744 \uc783\uc5b4 \uc2e4\uc9c8\uc801 \ud0c0\uaca9\uc744 \uc785\ub294\ub2e4\ub294 \uc810\uc744 \uc22b\uc790\ub85c \uc785\uc99d\ud574\uc57c \ud558\uc8e0. \uc774\uc5b4\uc11c <em>Gadzen &amp; Simkin<\/em> [2018] FamCAFC 218; (2018) FLC 93-871 \ud310\uacb0\uc740 \uace4\uad81\uc774 \uc778\uc815\ub3fc\ub3c4 \ud5c8\uac00\uac00 \uc790\ub3d9\uc740 \uc544\ub2c8\ub77c\uace0 \ubc1d\ud614\uc5b4\uc694. \uc9c0\uc5f0 \uc804 \uae30\uac04\uc5d0 \ub300\ud55c \ub0a9\ub4dd\ud560 \ub9cc\ud55c \uc18c\uba85(adequate explanation)\uacfc \uc0c1\ub300\ubc29\uc774 \uc785\uc744 \ubd88\uc774\uc775(prejudice)\uae4c\uc9c0 \uc7ac\ub7c9\uc73c\ub85c \uc800\uc6b8\uc9c8\ud558\uac70\ub4e0\uc694. \ub098\uc544\uac00 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2022/47.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Skelton &amp; Lindop<\/em> [2022] FedCFamC1A 47<\/a> \ud310\uacb0\uc740 \uc18c\uc1a1\ube44\uc6a9 \ub300\ube44 \uc2e4\uc775 \ube44\ub840\uc131\uc744 \ub530\uc84c\uc5b4\uc694. \uc608\uc0c1 \uc815\uc0b0\uae08\ubcf4\ub2e4 \uc591\uce21 \ubcc0\ud638\uc0ac \ube44\uc6a9\uc774 \ube44\uc2b7\ud558\uac70\ub098 \ub354 \ud06c\ub2e4\uba74 \uc18c \uc81c\uae30\ub97c \ub9c9\uc544\ub3c4 \uc2e4\uc9c8\uc801 \uace4\uad81\uc774 \uc5c6\ub2e4\uace0 \ubcf4\uc544 \uae30\uac01\ud560 \uc218 \uc788\uc5b4\uc694.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"4\"><thead><tr><th style=\"text-align:left\">\uad00\ubb38 \uc7c1\uc810 \uad6c\ubd84<\/th><th style=\"text-align:left\">\uc801\uc6a9 \uc870\ubb38 \ubc0f \ud575\uc2ec \uc120\ub840<\/th><th style=\"text-align:left\">\ubc95\uc6d0\uc758 \ud575\uc2ec \uc2ec\uc0ac \uae30\uc900<\/th><th style=\"text-align:left\">\uc2e4\ubb34\uc0c1 \uc2b9\ud328 \ud3ec\uc778\ud2b8<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>\uc0ac\uc2e4\ud63c \uc131\ub9bd \uc874\ubd80<\/strong> (s 4AA \u00b7 s 90RD)<\/td><td style=\"text-align:left\">s 4AA(1)\u2013(5) \u00b7 s 90SB \u00b7 <em>Jonah &amp; White<\/em> [2012] FamCAFC 200<\/td><td style=\"text-align:left\">\uae30\ud63c\uc790 \uc911\ubcf5 \uc131\ub9bd \uac00\ub2a5(s 4AA(5)(b))\ud558\ub098 \ub450 \uc0b6\uc758 \uacb0\ud569(coupledom) \ubc0f 2\ub144\u00b7\uc790\ub140\u00b7\uae30\uc5ec \ud544\uc218<\/td><td style=\"text-align:left\">\ubcc4\ub3c4 \uac70\ucc98\u00b7\uc0ac\ud68c\uc801 \ubd84\ub9ac\u00b7\ub3c5\ub9bd \uac00\uacc4 \uc785\uc99d \uc2dc \uc815\uae30 \uc0dd\ud65c\ube44 \uc1a1\uae08\uc774 \uc788\uc5b4\ub3c4 \uae30\uac01 \uac00\ub2a5<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc0ac\uc2e4\ud63c \ud30c\ud0c4 \uc2dc\uc810<\/strong> (s 90SM)<\/td><td style=\"text-align:left\"><em>Fairbairn v Radecki<\/em> [2022] HCA 18<\/td><td style=\"text-align:left\">\ubb3c\ub9ac\uc801 \ubcc4\uac70\ub9cc\uc73c\ub85c \uc790\ub3d9 \uc885\ub8cc \uc544\ub2d8 \u00b7 \uacf5\ub3d9 \uc0b6\uc744 \uc704\ud55c \ud544\uc218 \uc7ac\uc815 \uc870\uc815 \uac70\ubd80 \uc2dc \ud30c\ud0c4<\/td><td style=\"text-align:left\">\ud30c\ud0c4\uc77c \ud2b9\uc815\uc5d0 \ub530\ub77c 2\ub144 \uc81c\ucc99\uae30\uac04 \ub3c4\uacfc \uc5ec\ubd80\uc640 \ud3c9\uac00 \uc790\uc0b0 \ubc94\uc704\uac00 \uac08\ub9bc<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ubc95\ub960\ud63c 12\uac1c\uc6d4 \ub3c4\uacfc<\/strong> (s 44(3)\u2013(4))<\/td><td style=\"text-align:left\"><em>Whitford<\/em> [1979] FamCA 3 \u00b7 <em>Gadzen &amp; Simkin<\/em> [2018] FamCAFC 218; (2018) FLC 93-871<\/td><td style=\"text-align:left\">\uc774\ud63c \ubc1c\ud6a8 \ud6c4 12\uac1c\uc6d4 \uacbd\uacfc \uc2dc \u2460 \uc2b9\uc0b0 \uc788\ub294 \uccad\uad6c \uc0c1\uc2e4 \uc911\ub300 \uace4\uad81 + \u2461 \uc9c0\uc5f0 \uc18c\uba85\u00b7\ubd88\uc774\uc775 \ud615\ub7c9<\/td><td style=\"text-align:left\">\uad6c\ub450 \ud569\uc758 \uc57d\uc18d\u00b7\uac74\uac15 \uc704\uae30\u00b7\uac15\uc555 \ud1b5\uc81c \ub4f1 \uc9c0\uc5f0 \uacbd\uc704\ub97c \uac1d\uad00 \uae30\ub85d\uc73c\ub85c \uc18c\uba85<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc0ac\uc2e4\ud63c 2\ub144 \ub3c4\uacfc\u00b7\uc2e4\uc775<\/strong> (s 44(5)\u2013(6))<\/td><td style=\"text-align:left\"><em>Skelton &amp; Lindop<\/em> [2022] FedCFamC1A 47<\/td><td style=\"text-align:left\">\ubcc4\uac70 \ud6c4 24\uac1c\uc6d4 \uacbd\uacfc \uc2dc \uc608\uc0c1 \ud68c\uc218 \uae08\uc561 \ub300 \uc608\uc0c1 \uc18c\uc1a1\ube44\uc6a9 \ube44\ub840\uc131 \uc5c4\uaca9 \ub300\uc870<\/td><td style=\"text-align:left\">\uc18c\uc1a1\ube44\uac00 \uccad\uad6c \uc2e4\uc775\uc744 \uc0bc\ud0a4\ub294 \uad6c\uc870\uba74 \uae30\uac01 \u00b7 \ucd08\uae30 \uc21c\uc2e4\uc775 \uacc4\uc0b0\ud45c \uc81c\uc2dc \ud544\uc218<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"\uc0ac\uc2e4\ud63c-\ubc29\uc5b4\uc640-\uc81c\ucc99\uae30\uac04-\ub3c4\uacfc-\uc0ac\uac74\uc5d0\uc11c-\ucd08\ub3d9-\ub300\uc751\uc774-\uc2b9\ud328\ub97c-\uac00\ub974\ub294-\uc774\uc720\" class=\"doc-h2\">\uc0ac\uc2e4\ud63c \ubc29\uc5b4\uc640 \uc81c\ucc99\uae30\uac04 \ub3c4\uacfc \uc0ac\uac74\uc5d0\uc11c \ucd08\ub3d9 \ub300\uc751\uc774 \uc2b9\ud328\ub97c \uac00\ub974\ub294 \uc774\uc720<\/h2>\n<p class=\"doc-p\">\uc774 \ub450 \uc720\ud615\uc740 \uccab \ub2e8\ucd94\uac00 \uac00\uc7a5 \uc911\uc694\ud574\uc694. \ubb34\ub9ac\ud55c \uc0ac\uc2e4\ud63c \uccad\uad6c\ub97c \ub2f9\ud55c \ud53c\uc2e0\uccad\uc778\uc774\ub77c\uba74 \uc123\ubd88\ub9ac \ubc95\uc778 \uc7a5\ubd80\ubd80\ud130 \ub0b4\uc8fc\uc5b4\uc11c\ub294 \uace4\ub780\ud574\uc694. \uc5f0\ubc29\uc21c\ud68c\u00b7\uac00\uc871\ubc95\uc6d0(FCFCOA)\uc5d0 s 90RD \uc120\uacb0 \ubd84\ub9ac \uc2ec\ub9ac(threshold hearing)\ub97c \uc2e0\uccad\ud574 \uc784\ub300\ucc28\uacc4\uc57d\uc11c\u00b7\uc138\uae08\uc2e0\uace0\uc11c\u00b7\ub3c5\ub9bd \uac00\uacc4 \uc99d\ube59\uc73c\ub85c \uc870\uae30 \uac01\ud558\ub97c \ub178\ub9ac\ub294 \ud3b8\uc774 \ud6e8\uc52c \ud6a8\uacfc\uc801\uc774\uc5d0\uc694.<\/p>\n<p class=\"doc-p\">\ubc18\ub300\ub85c \uc2dc\ud55c \ub9c8\uac10\uc774 \uc784\ubc15\ud588\uac70\ub098 \uc774\ubbf8 \ub3c4\uacfc\ud55c \uc2e0\uccad\uc778\uc774\ub77c\uba74 \uc0ac\uc801\uc778 \ubb38\uc790 \ud638\uc18c\ub294 \uce58\uba85\uc801\uc774\uc5d0\uc694. \ub9c8\uac10 \uc804\uc774\ub77c\uba74 \uc989\uc2dc \uc815\uc2dd \uc2e0\uccad\uc11c\ub97c \uc811\uc218\ud574 \uc2dc\uacc4\ubd80\ud130 \uba48\ucdb0 \uc138\uc6cc\uc57c \ud574\uc694. \uc774\ubbf8 \uc2dc\ud55c\uc744 \ub118\uacbc\ub2e4\uba74 <em>Whitford<\/em>\uc640 <em>Gadzen &amp; Simkin<\/em> \ubc0f <em>Skelton &amp; Lindop<\/em> \uae30\uc900\uc5d0 \ub9de\ucd98 \uc21c\uc2e4\uc775 \uacc4\uc0b0\ud45c\uc640 \uc6d4\ubcc4 \uc9c0\uc5f0 \uc99d\ube59\uc744 \uccab \uc120\uc11c\uc9c4\uc220\uc11c(Affidavit)\uc5d0 \ube48\ud2c8\uc5c6\uc774 \ub2f4\uc544\uc57c \uad00\ubb38\uc774 \uc5f4\ub824\uc694.<\/p>\n<h2 id=\"\uc0ac\uc2e4\ud63c-\uacbd\uacc4\uc120-\ub2e4\ud23c\uacfc-\uc2dc\ud55c-\ub3c4\uacfc-\ub2a6\uae30-\uc804\uc5d0-\uc9c4\ub2e8\ubc1b\uc73c\uc138\uc694\" class=\"doc-h2\">\uc0ac\uc2e4\ud63c \uacbd\uacc4\uc120 \ub2e4\ud23c\uacfc \uc2dc\ud55c \ub3c4\uacfc, \ub2a6\uae30 \uc804\uc5d0 \uc9c4\ub2e8\ubc1b\uc73c\uc138\uc694<\/h2>\n<p class=\"doc-p\">\uc0ac\uc2e4\ud63c \uc131\ub9bd \uc5ec\ubd80\uc640 \ud30c\ud0c4 \uc2dc\uc810 \uadf8\ub9ac\uace0 \uc9c0\ub09c \uc2dc\ud55c\uc744 \ub418\uc0b4\ub9b4 \uc2e4\uc775\uc740 \ucd08\uae30 \uc99d\uac70 \uc124\uacc4\uc5d0\uc11c \ud310\uac00\ub984 \ub098\uc694. \uac10\uc815\uc2f8\uc6c0\uc774\ub098 \uc774\uba54\uc77c \ubb38\ub2f5\uc73c\ub85c \ub0a8\uc740 \uace8\ub4e0\ud0c0\uc784\ub9c8\uc800 \ub193\uce58\uc9c0 \ub9c8\uc138\uc694. \ubc15\uc564\ucf54 \uac00\uc871\ubc95 \uc804\uc6a9 \uc628\ub77c\uc778 \uc9c8\ubb38\uc9c0(<a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\uac00\uc871\ubc95 \uc0ac\uc548 \uc811\uc218 \ubc14\ub85c\uac00\uae30<\/a>)\ub098 \uacf5\uc2dd \ud1b5\ud569 \uc548\ub0b4 \ucc3d\uad6c(<a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ubc15\uc564\ucf54 \uacf5\uc2dd \ub9c1\ud06c \ud5c8\ube0c<\/a>)\uc5d0 \uad00\uacc4 \uae30\uac04\uacfc \uc7ac\uc0b0 \ub0b4\uc5ed\uc744 \ub0a8\uaca8 \uc8fc\uc138\uc694. \uc774\ud574\ucda9\ub3cc \uc870\ud68c \ud6c4 \ubc29\uc5b4 \uac00\ub2a5\uc131\uc774\ub098 s 44 \ud2b9\ubcc4\ud5c8\uac00 \uc2e4\uc775\uc744 \ub0c9\uc815\ud558\uac8c \uc9da\uc5b4 \ub4dc\ub9b4\uac8c\uc694.<\/p>\n\n          <div class=\"col-sources-box\">\n            \uadfc\uac70 \ubc95\ub839 \ubc0f \ud310\ub840: Family Law Act 1975 ss 4AA, 44(3)\u2013(6), 90RD, 90SB, 90SM \u00b7 Jonah &amp; White [2012] FamCAFC 200 \u00b7 Fairbairn v Radecki [2022] HCA 18 \u00b7 Whitford [1979] FamCA 3 \u00b7 Gadzen &amp; Simkin [2018] FamCAFC 218 \u00b7 Skelton &amp; Lindop [2022] FedCFamC1A 47.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">\ud63c\uc790 \uc9c4\ud589\uc744 \uba48\ucd94\uace0 \ubcc0\ud638\uc0ac\ub97c \ucc3e\uc544\uc57c \ud558\ub294 \uc21c\uac04 \u00b7 \uac00\uc871\ubc95<\/span>\n            <h3 class=\"col-cta-title\">\ud569\uc758\ub41c \uc870\uac74\uc744 \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950)\uc73c\ub85c \ud655\uc815\ud558\uace0 \uc2f6\uac70\ub098 \uc5f0\ub77d\uc744 \ud53c\ud558\ub294 \ubc30\uc6b0\uc790\uc640 \uc7ac\uc0b0\ubd84\ud560 \ud611\uc0c1\uc744 \uc2dc\uc791\ud574\uc57c \ud558\ub098\uc694?<\/h3>\n            <p class=\"col-cta-desc\">\ub2e8\uc21c \uc628\ub77c\uc778 \uc774\ud63c \uc2e0\uccad\uc740 \ud3ec\ud138 \uc124\uba85\uc11c\ub97c \ubcf4\uace0 \uc9c1\uc811 \uc9c4\ud589\ud558\uba74 \uc218\ucc9c \ub2ec\ub7ec\ub97c \uc544\ub07c\uc2e4 \uc218 \uc788\uc5b4\uc694. \ubc18\uba74 \ubc95\uc801 \ud6a8\ub825\uc774 \uc788\ub294 \uc7ac\uc0b0\u00b7\uc591\uc721 \ud569\uc758\uba85\ub839(Consent Orders) \uc791\uc131\uc774\ub098 \uc5f0\ub77d\uc744 \ud53c\ud558\ub294 \ubc30\uc6b0\uc790\uc758 \uc7ac\uc0b0 \uacf5\uac1c \uc694\uad6c\u00b7\ud55c\uad6d\uacfc \ud638\uc8fc\uc5d0 \uac78\uce5c \uc7ac\uc0b0\ubd84\ud560\uc774 \ud544\uc694\ud560 \ub54c\ub294 3\ubd84 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \ud575\uc2ec \ub0a0\uc9dc\uc640 \uc7ac\uc0b0 \ub0b4\uc5ed\uc744 \ub0a8\uaca8 \uc8fc\uc138\uc694.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">\uac00\uc871\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../files/KO/PDF/03_Family_Law_Divorce_Property_Parenting_and_Settlement_Manual_2026_KO.pdf\" download class=\"col-btn-ghost\">03 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc694\uc57d PDF \ubc1b\uae30<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">\ubc15\uc564\ucf54 \uacf5\uc2dd \uc0c1\ub2f4 \ub9c1\ud06c \ud5c8\ube0c<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">\ubc95\ub960 \uc548\ub0b4: \uc774 \uce7c\ub7fc\uc740 \ud638\uc8fc \uc5f0\ubc29 \uac00\uc871\ubc95(Family Law Act 1975)\uacfc \uacf5\uc2dd \ud1b5\uacc4\u00b7\ud310\ub840\ub97c \ubc14\ud0d5\uc73c\ub85c \uc54c\uae30 \uc27d\uac8c \uc815\ub9ac\ud55c \uc77c\ubc18 \ubc95\ub960 \uc815\ubcf4\uc608\uc694. \uac1c\ubcc4 \uc0ac\uac74\uc5d0 \ub300\ud55c \ubc95\ub960 \uc790\ubb38\uc774\ub098 \uc218\uc784 \uacc4\uc57d \uc131\ub9bd\uc744 \ub73b\ud558\uc9c0 \uc54a\uc73c\ub2c8 \uc774\ud63c \ud6c4 12\uac1c\uc6d4\u00b7\uc0ac\uc2e4\ud63c \uacb0\ubcc4 \ud6c4 2\ub144 \ub9c8\uac10 \uae30\ud55c\uc774\ub098 \ube44\uc790 \uae30\ud55c\uc774 \uc784\ubc15\ud588\ub2e4\uba74 \uc9c0\uccb4 \uc5c6\uc774 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uac80\ud1a0\ub97c \ubc1b\uc544 \ubcf4\uc138\uc694.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">\ud568\uaed8 \uc77d\uc73c\uba74 \uc88b\uc740 \uac00\uc871\ubc95 \ud310\ub840 \uce7c\ub7fc<\/h3>\n        <a href=\"../../?lang=ko&amp;tab=family\" class=\"col-back-link num\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../property-reforms-2026/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">2025\u20132026 \uac1c\uc815 \ud574\uc124 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 01<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \uac00\uc871\ubc95 \uc7ac\uc0b0\ubd84\ud560 \uac1c\ud3b8 \ud575\uc2ec: \uacbd\uc81c\uc801 \ud559\ub300 \ubc18\uc601, \ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ud574\uc678\uc790\uc0b0, \ubc18\ub824\ub3d9\ubb3c \ubc0f \uc81c\ucc99\uae30\uac04 \ucd1d\uc815\ub9ac<\/h4><p class=\"col-sib-desc\">\uc774\ubbf8 \uc368\ubc84\ub9b0 \ub3c8 \ud569\uc0b0(Add-backs) \ud3d0\uc9c0, \uacbd\uc81c\uc801 \ud559\ub300 \ubc18\uc601, \ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ud55c\uad6d \uc7ac\uc0b0 \uacf5\uac1c \uc758\ubb34, \ubc18\ub824\ub3d9\ubb3c \uadc0\uc18d \uae30\uc900, \uadf8\ub9ac\uace0 12\uac1c\uc6d4/2\ub144 \uc7ac\uc0b0\ubd84\ud560 \ub9c8\uac10 \uae30\ud55c\uae4c\uc9c0 \uc54c\uae30 \uc27d\uac8c \uc815\ub9ac\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../divorce-parenting-reality-guide/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc2e4\uc804 \uac00\uc774\ub4dc \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 02<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \uc774\ud63c \uc808\ucc28\uc640 \uc7ac\uc0b0\ubd84\ud560\u00b7\uc591\uc721\uad8c, \ubcc0\ud638\uc0ac \uc120\uc784 \uc804 \ubc18\ub4dc\uc2dc \uc54c\uc544\uc57c \ud560 \ud604\uc2e4 \uae30\uc900<\/h4><p class=\"col-sib-desc\">\uc678\ub3c4 \uc704\uc790\ub8cc\uc5d0 \ub300\ud55c \uc624\ud574\uc640 \ud55c\uacb0 \uc26c\uc6cc\uc9c4 \uc11c\uba74 \uc774\ud63c \uc808\ucc28, \ubc18\ubc18 \uacf5\ub3d9\uc591\uc721 \ucd94\uc815 \ud3d0\uc9c0, \uadf8\ub9ac\uace0 \uc18c\uc561 \uc7ac\uc0b0 \uc0ac\uac74(\u2264$550k)\uacfc \uc815\uc561 \ud569\uc758\uba85\ub839($4,950) \uc911 \ubb34\uc5c7\uc774 \uc774\ub4dd\uc778\uc9c0 \uc9da\uc5b4 \ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../partner-visa-breakdown-crossborder/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc774\ubbfc\u00b7\uac00\uc871\ubc95 \uad50\ucc28 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 03<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \ud30c\ud2b8\ub108\ube44\uc790 \uc9c4\ud589 \uc911 \uacb0\ubcc4\u00b7\uac00\uc815\ud3ed\ub825\uacfc \ud55c\u00b7\ud638 \uad6d\uc81c \uc7ac\uc0b0\ubd84\ud560 \uc2e4\uc804 \ub300\ucc98\ubc95<\/h4><p class=\"col-sib-desc\">\ubc30\uc6b0\uc790\uc758 \ube44\uc790 \ucde8\uc18c \ud611\ubc15\uc5d0 \ub300\ucc98\ud558\ub294 \ubc95\ubd80\ud130 \uac00\uc815\ud3ed\ub825 \uc601\uc8fc\uad8c \uad6c\uc81c \uc694\uac74, \ud55c\uad6d\u00b7\ud638\uc8fc \uc591\uad6d \uc7ac\uc0b0 \uc815\ub9ac, \uc544\uc774\ub97c \ub3d9\uc758 \uc5c6\uc774 \ub370\ub9ac\uace0 \ucd9c\uad6d\ud558\uba74 \uc548 \ub418\ub294 \uc774\uc720\uae4c\uc9c0 \uc27d\uac8c \ud480\uc5b4\uc37c\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../parental-advances-loans-gifts-divorce/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubd80\ubaa8 \uc9c0\uc6d0\uae08\u00b7\ucc28\uc6a9\uc99d \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 14<\/span><h4 class=\"col-sib-title\">\ud55c\uad6d \ubd80\ubaa8\ub2d8\uc774 \ubcf4\ud0dc\uc900 \uc9d1\uac12 3\uc5b5, \ud638\uc8fc \uc774\ud63c\ud560 \ub54c \ub3cc\ub824\uc904 \ub300\uc5ec\uae08\uc77c\uae4c \ub098\ub20c \uc99d\uc5ec\uc77c\uae4c<\/h4><p class=\"col-sib-desc\">\ud55c\uad6d\u00b7\ud638\uc8fc \ubd80\ubaa8\ub2d8\uc774 \uc9d1 \uc0b4 \ub54c \ubcf4\ud0dc\uc8fc\uc2e0 \ub3c8\uc774 \uac1a\uc544\uc57c \ud560 \ube5a\uc73c\ub85c \uba3c\uc800 \ube60\uc9c0\ub294 \uacbd\uc6b0\uc640 \ubd80\ubd80 \uc7ac\uc0b0\uc5d0 \uc11e\uc774\ub294 \ucc28\uc774\ub97c \uc2e4\uc81c \ud310\ub840\ub85c \uc54c\uae30 \uc27d\uac8c \ube44\uad50\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../family-trusts-companies-valuation-divorce/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uac00\uc871\uc2e0\ud0c1\u00b7\ubc95\uc778\uac10\uc815 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 15<\/span><h4 class=\"col-sib-title\">\uc7ac\uc0b0\uc744 \uac00\uc871\uc2e0\ud0c1(Family Trust)\uc774\ub098 Pty Ltd \ubc95\uc778\uc5d0 \ub123\uc5b4\ub450\uba74 \uc774\ud63c \uc7ac\uc0b0\ubd84\ud560\uc5d0\uc11c \uc548\uc804\ud560\uae4c<\/h4><p class=\"col-sib-desc\">\ub204\uac00 \uc2e0\ud0c1\uc758 \uc2e4\uc81c \uacb0\uc815\uad8c(Appointor)\uc744 \uc950\uace0 \uc788\ub294\uc9c0 \ub530\uc9c0\ub294 \uae30\uc900\ubd80\ud130 \uacf5\ub3d9 \uac10\uc815\uc778 \uc808\ucc28\uc640 \ubc95\uc778 \ub3c8\uc744 \uc62e\uae38 \ub54c \uc138\uae08\uc744 \uc544\ub07c\ub294 \ubc29\ubc95\uae4c\uc9c0 \uc9da\uc5b4 \ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../post-separation-inheritances-windfalls-delay/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubcc4\uac70 \ud6c4 \uc0c1\uc18d\u00b7\uc9c0\uccb4\uc704\ud5d8 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 16<\/span><h4 class=\"col-sib-title\">\ubcc4\uac70\ud55c \uc9c0 4\ub144 \uc9c0\ub0ac\uc73c\ub2c8 \uc0c8\ub85c \ubc1b\uc740 \uc0c1\uc18d\uc774\ub098 \uc9d1\uac12 \uc0c1\uc2b9\ubd84\uc740 \ub0b4 \uac83\uc774\uaca0\uc9c0: \ud569\uc758\uba85\ub839(Consent Orders)\uc744 \ubbf8\ub8ec \ub300\uac00<\/h4><p class=\"col-sib-desc\">\ubcc4\uac70 \ub4a4 \uc11c\ub958 \uc815\ub9ac\ub97c \ud3c9\uade0 4\ub144\uc529 \ubbf8\ub8e8\ub2e4 \ub098\uc911\uc5d0 \ubc1b\uc740 \uc0c1\uc18d\uae08\uc774\ub098 \uc624\ub978 \uc9d1\uac12\uae4c\uc9c0 \ub098\ub204\uac8c \ub418\ub294 \uc774\uc720\uc640 $4,950 \ubc95\uc6d0 \ud569\uc758\uba85\ub839\uc73c\ub85c \uc548\uc804\ud558\uac8c \ub9c8\ubb34\ub9ac\ud558\ub294 \ubc95\uc744 \ub2f4\uc558\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../prenups-bfa-vs-consent-orders/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ud63c\uc804\uacc4\uc57d BFA \ub300 \ud569\uc758\uba85\ub839 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 17<\/span><h4 class=\"col-sib-title\">\ubcc0\ud638\uc0ac \uc99d\uba85\uc11c\uae4c\uc9c0 \ubd99\uc778 \ud63c\uc804\uacc4\uc57d\uc11c(BFA)\uac00 \ub300\ubc95\uc6d0\uc5d0\uc11c \uae68\uc9c4 \uc774\uc720: \uc7ac\uc0b0\ubd84\ud560 \ud569\uc758\uc11c(BFA) \ub300 \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950) \uc120\ud0dd \uae30\uc900<\/h4><p class=\"col-sib-desc\">\uacb0\ud63c\u00b7\ub3d9\uac70 \uc804\uc5d0 \uc7ac\uc0b0\uc744 \uc548\uc804\ud558\uac8c \uc9c0\ud0a4\ub294 BFA \uc791\uc131 \uc694\ub839\uacfc \uc774\ubbf8 \ud5e4\uc5b4\uc9c4 \ubd80\ubd80\uac00 \uc591\ucabd \ubcc0\ud638\uc0ac\ube44\uac00 \ub4dc\ub294 BFA \ub300\uc2e0 \uc815\uc561 \ud569\uc758\uba85\ub839\uc744 \uace8\ub77c\uc57c \ud558\ub294 \uc774\uc720\ub97c \ube44\uad50\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}, "en": {"doc_title": "\"Were We Even De Facto?\" Litigating s 4AA Thresholds, Concurrent Marriages and Out-of-Time Leave \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">All Guides Hub<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=en\">Visa Solution Guide<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=en\">Employment Navigator<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=en\">DIY & Cost-Smart Guide<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\">Consult Park & Co \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=en&amp;tab=family\" class=\"col-back-btn\">\u2190 Back to Family Law Self-Help Hub<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">Park &amp; Co Lawyers \u00b7 Family Law Deep-Dive Column<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn\">KO<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn active\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">Consult Park &amp; Co \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">DE FACTO &amp; TIME BARS \u00b7 FAMILY 18<\/span>\n          <span class=\"col-verified-pill num\">Primary-Source Verified (Nov 2026)<\/span>\n          <span class=\"col-time-pill num\">9 min read<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">&quot;Were We Even De Facto?&quot; Litigating s 4AA Thresholds, Concurrent Marriages and Out-of-Time Leave<\/h1>\n        <p class=\"col-subtitle\">Coupledom in Jonah &amp; White, separation dates under Fairbairn v Radecki [2022] HCA 18, and winning or defeating out-of-time leave under s 44(4) and s 44(6)<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">Chang Min Park<\/div>\n            <div class=\"col-author-role\">Legal Practitioner Director, Park &amp; Co Lawyers \u00b7 Accredited Specialist in Immigration Law (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col18_fam_defacto_hero.jpg\" alt=\"&quot;Were We Even De Facto?&quot; Litigating s 4AA Thresholds, Concurrent Marriages and Out-of-Time Leave\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">Threshold litigation under s 90RD and s 44 turns on objective evidence of merged &#x27;coupledom&#x27;, pinpointed financial breakdown dates, and whether legal costs outweigh hardship.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">17-Yr Claim Dismissed<\/div><div class=\"col-stat-lbl\">Monthly allowances without merged &#x27;coupledom&#x27; failed (Jonah &amp; White)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">s 4AA(5)(b) Rule<\/div><div class=\"col-stat-lbl\">De facto tie can legally coexist with marriage if coupledom is proven<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">12m / 24m Hard Bars<\/div><div class=\"col-stat-lbl\">Out-of-time s 44 leave requires substantial hardship &amp; delay explanation<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">In This Column<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#concurrent-marriages-and-the-coupledom-threshold\" class=\"col-toc-link lvl-2\">Concurrent marriages and the &quot;coupledom&quot; threshold in Jonah &amp; White<\/a><a href=\"#pinpointing-the-date-of-breakdown-after-fairbair\" class=\"col-toc-link lvl-2\">Pinpointing the date of breakdown after Fairbairn v Radecki<\/a><a href=\"#the-12-month-post-divorce-and-24-month-de-facto-\" class=\"col-toc-link lvl-2\">The 12-month post-divorce and 24-month de facto limitation bars<\/a><a href=\"#proving-s-44-hardship-under-whitford-gadzen-simk\" class=\"col-toc-link lvl-2\">Proving s 44 hardship under Whitford, Gadzen &amp; Simkin and Skelton &amp; Lindop<\/a><a href=\"#defending-threshold-disputes-or-acting-quickly-o\" class=\"col-toc-link lvl-2\">Defending threshold disputes or acting quickly on out-of-time claims<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">Open Family Law Consultation Form<\/a>\n              <a href=\"../../?lang=en&amp;tab=family\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 Back to Family Law Self-Help Hub<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">Two preliminary threshold fights decide whether thousands of Australian property claims ever leave the starting blocks. In the first, a claimant seeks a split under s 90SM of the <em>Family Law Act 1975<\/em> (Cth) and the respondent raises a threshold defence: &quot;We dated, kept separate homes, and helped with bills, yet we were never de facto.&quot; In the second, a separated spouse or partner misses the strict limitation bar in s 44 and must seek special leave just to enter the property list. Losing either gate ends the claim before the pool is valued.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 382\" width=\"100%\" role=\"img\" aria-label=\"Two Threshold Battles: Proving s 4AA De Facto Status &amp; s 44 Leave\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"381\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">JURISDICTIONAL GATEWAYS \u00b7 s 4AA COUPLEDOM &amp; s 44 LEAVE<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">Two Threshold Battles: Proving s 4AA De Facto Status &amp; s 44 Leave<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">Authorities: Jonah &amp; White [2012] FamCAFC 200 \u00b7 Fairbairn v Radecki [2022] HCA 18 \u00b7 Whitford [1979] \u00b7 Skelton [2022]<\/text>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"38\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">GATEWAY 1 \u00b7 DATING / AFFAIR VS s 4AA DE FACTO<\/text>\n  <circle cx=\"42\" cy=\"144\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"54\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Concurrent Marriage Does Not Bar s 4AA(5)(b)<\/text>\n  <text x=\"54\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">A de facto tie can legally coexist with marriage, subject to strict proof.<\/text>\n  <circle cx=\"42\" cy=\"196\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"54\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Touchstone: Merger of Lives (&#x27;Coupledom&#x27;)<\/text>\n  <text x=\"54\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">Jonah &amp; White [2012]: 17-yr secret affair + monthly allowance dismissed!<\/text>\n  <circle cx=\"42\" cy=\"248\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"54\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Breakdown Date Objectively Tested (Fairbairn)<\/text>\n  <text x=\"54\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">HCA [2022]: Refusing mutual financial support marks separation date.<\/text>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"466\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">GATEWAY 2 \u00b7 OUT-OF-TIME LEAVE (s 44(4) &amp; s 44(6))<\/text>\n  <circle cx=\"470\" cy=\"144\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Step 1: Prima Facie Claim &amp; Substantial Hardship<\/text>\n  <text x=\"482\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">Weighs claim size against legal fees required to litigate it (Whitford).<\/text>\n  <circle cx=\"470\" cy=\"196\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Step 2: Delay Explanation &amp; Prejudice Balance<\/text>\n  <text x=\"482\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">Holistic discretion on delay &amp; third-party reliance (Gadzen; Skelton [2022]).<\/text>\n  <circle cx=\"470\" cy=\"248\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">High Adverse Costs Exposure at Threshold Trial<\/text>\n  <text x=\"482\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">Weak s 90RD or out-of-time filings regularly attract adverse costs orders.<\/text>\n  <rect x=\"22\" y=\"328\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"351\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1D6B48\">Practice Rule: Threshold s 90RD disputes and out-of-time s 44 applications are won or lost on forensic affidavit detail at the gate.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 1: Proving s 4AA Coupledom and Clearing Out-of-Time s 44 Hardship Gateways<\/figcaption><\/figure>\n<h2 id=\"concurrent-marriages-and-the-coupledom-threshold\" class=\"doc-h2\">Concurrent marriages and the &quot;coupledom&quot; threshold in Jonah &amp; White<\/h2>\n<p class=\"doc-p\">Under s 4AA(1), two people are in a de facto relationship if they are not married to each other, are not related by family, and have a relationship as a couple living together on a genuine domestic basis across all the circumstances. Section 4AA(2)(a)\u2013(i) lists nine composite indicators, covering duration, common residence, sexual relationship, financial interdependence, joint property, mutual commitment to a shared life, and public reputation. Even after clearing s 4AA, a claimant must satisfy one of the four s 90SB gateways: at least two years&#x27; aggregate duration, a child of the relationship, substantial s 90SM(4) contributions where refusing an order causes serious injustice, or formal state relationship registration.<\/p>\n<p class=\"doc-p\">Section 4AA(5)(b) catches married respondents off guard more than any other clause: a de facto relationship can legally exist even while one party remains married to someone else or in another de facto relationship. Maintaining a marital home with a spouse and children offers no immunity against a concurrent claim.<\/p>\n<p class=\"doc-p\">Long-term intimacy paired with generous monthly allowances still fails s 4AA unless two lives genuinely merge. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2012/200.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Jonah &amp; White<\/em> [2012] FamCAFC 200<\/a>, a married businessman kept a 17-year secret relationship with the appellant, paid her $2,000 to $3,000 a month, contributed $24,000 toward her house purchase, and spent regular interstate time together while living with his wife and children. Dismissing her s 90RD appeal, the Full Court held ([60]) that the core of s 4AA is the manifestation of &quot;coupledom&quot;, the merger of two individual lives into one shared household life. Keeping strictly separate homes, separate social circles, and unmerged domestic finances defeated her claim despite 17 years together.<\/p>\n<h2 id=\"pinpointing-the-date-of-breakdown-after-fairbair\" class=\"doc-h2\">Pinpointing the date of breakdown after Fairbairn v Radecki<\/h2>\n<p class=\"doc-p\">Threshold disputes regularly turn on <em>when<\/em> a relationship ended, a calendar date that governs both the two-year s 90SB(a) duration rule and the start of the s 44(5) two-year limitation clock. Living under two roofs does not automatically end a de facto relationship, just as sharing one house does not guarantee it continues.<\/p>\n<p class=\"doc-p\">In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2022/18.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Fairbairn v Radecki<\/em> [2022] HCA 18<\/a>, the High Court unanimously held that &quot;living together&quot; in s 4AA means sharing a life as a couple rather than occupying one dwelling. Placing a partner with dementia into aged care did not end the relationship by itself; breakdown occurred when the respondent refused necessary financial adjustments while keeping assets strictly separate ([42]\u2013[46]). Bank changes, Centrelink single-status filings, tax returns, and leases carry far heavier weight in s 90RD hearings than hindsight affidavits.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">Threshold or Limitation Scenario<\/th><th style=\"text-align:left\">Statutory Provision &amp; Leading Case<\/th><th style=\"text-align:left\">Practical Gatekeeping Rule in the FCFCOA<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Long Secret Relationship + Allowance<\/strong><\/td><td style=\"text-align:left\">s 4AA(5)(b) &amp; s 90RD; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2012/200.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Jonah &amp; White<\/em> [2012] FamCAFC 200<\/a><\/td><td style=\"text-align:left\">Concurrent marriage is no bar, yet separate households without merged &quot;coupledom&quot; fail s 4AA<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Separate Roofs / Aged Care Placement<\/strong><\/td><td style=\"text-align:left\">s 4AA &amp; s 90SM; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2022/18.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Fairbairn v Radecki<\/em> [2022] HCA 18<\/a><\/td><td style=\"text-align:left\">Physical separation alone does not end relationship; refusal to adjust finances marks breakdown<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Short De Facto (&lt;2 Years, No Child)<\/strong><\/td><td style=\"text-align:left\">s 90SB(c) &amp; s 90RD<\/td><td style=\"text-align:left\">Barred unless unregistered claimant proves substantial contributions + serious injustice<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Married Claim &gt;12 Months Post-Divorce<\/strong><\/td><td style=\"text-align:left\">s 44(3)\u2013(4); <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCA/1979/3.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Whitford &amp; Whitford<\/em> [1979] FamCA 3<\/a><\/td><td style=\"text-align:left\">Statute-barred absent respondent consent unless substantial hardship + delay explanation proved<\/td><\/tr><tr><td style=\"text-align:left\"><strong>De Facto Claim &gt;24 Months Post-Separation<\/strong><\/td><td style=\"text-align:left\">s 44(5)\u2013(6); <em>Gadzen &amp; Simkin<\/em> [2018] FamCAFC 218; (2018) FLC 93-871; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2022/47.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Skelton &amp; Lindop<\/em> [2022] FedCFamC1A 47<\/a><\/td><td style=\"text-align:left\">Leave refused if likely net recovery would be swallowed by legal costs or delay prejudices respondent<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"the-12-month-post-divorce-and-24-month-de-facto-\" class=\"doc-h2\">The 12-month post-divorce and 24-month de facto limitation bars<\/h2>\n<p class=\"doc-p\">Missing the s 44 limitation clock blocks even an undisputed marriage or ten-year de facto relationship. Married spouses have strictly 12 months from the date a divorce order takes effect (s 44(3), one month and one day after grant) to file property or maintenance proceedings. De facto partners have strictly 24 months (two years) from final separation (s 44(5)). Although s 44(3) and s 44(5) let former partners file out of time if both consent, a spouse holding most of the equity rarely agrees once the deadline passes, forcing the late party to seek Court leave under s 44(4) or s 44(6).<\/p>\n<h2 id=\"proving-s-44-hardship-under-whitford-gadzen-simk\" class=\"doc-h2\">Proving s 44 hardship under Whitford, Gadzen &amp; Simkin and Skelton &amp; Lindop<\/h2>\n<p class=\"doc-p\">Judges never grant out-of-time leave out of sympathy. Under <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCA/1979/3.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Whitford &amp; Whitford<\/em> [1979] FamCA 3<\/a>, the claimant must first prove that refusing leave causes substantial hardship to a party or child, meaning the loss of a reasonably arguable <em>prima facie<\/em> property claim worth pursuing in dollar terms rather than the bare loss of a right to sue.<\/p>\n<p class=\"doc-p\">In <em>Gadzen &amp; Simkin<\/em> [2018] FamCAFC 218; (2018) FLC 93-871, the Full Court sharpened the proportionality test inside hardship: if likely net recovery at trial would be swallowed by estimated legal costs on both sides, refusing leave inflicts no substantive hardship. Second, the claimant must justify residual discretion by explaining every month of delay and disproving unfair prejudice to an ex-partner who rearranged finances relying on finality. As confirmed in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2022/47.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Skelton &amp; Lindop<\/em> [2022] FedCFamC1A 47<\/a>, thin excuses for years of inaction sink s 44(6) applications summarily with adverse costs.<\/p>\n<h2 id=\"defending-threshold-disputes-or-acting-quickly-o\" class=\"doc-h2\">Defending threshold disputes or acting quickly on out-of-time claims<\/h2>\n<p class=\"doc-p\">Whether you face an opportunistic s 90SM claim after a non-cohabiting relationship or an expiring s 44 bar, rapid evidence gathering decides the result. Where former partners agree to finalise property amicably (including out of time by mutual consent), Park &amp; Co files Court-sealed Consent Orders for a $4,950 fixed fee (plus the $215 court fee). Where relationship status, breakdown dates, or s 44 bars are contested, or an ex-partner withholds records, we run s 90RD defences, s 44(4) / s 44(6) leave applications, and s 71B / s 90RI disclosure demands. Lodge your timeline and asset details via the <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Family Law Consultation Form<\/a> or visit the <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Official Links Hub<\/a> for conflict checking.<\/p>\n\n          <div class=\"col-sources-box\">\n            Primary Authorities: Family Law Act 1975 (Cth) ss 4AA, 44(3)\u2013(6), 90RD, 90SB, 90SM \u00b7 Jonah &amp; White [2012] FamCAFC 200 \u00b7 Fairbairn v Radecki [2022] HCA 18 \u00b7 Whitford [1979] FamCA 3 \u00b7 Gadzen &amp; Simkin [2018] FamCAFC 218 \u00b7 Skelton &amp; Lindop [2022] FedCFamC1A 47.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">WHEN TO CONSULT PARK &amp; CO LAWYERS \u00b7 FAMILY LAW<\/span>\n            <h3 class=\"col-cta-title\">Ready to Lock In $4,950 Consent Orders, Compel Disclosure, or Protect Family Assets?<\/h3>\n            <p class=\"col-cta-desc\">Save thousands on straightforward No-Fault Divorce using our DIY manual; when you need enforceable Consent Orders, formal financial disclosure demands, or cross-border property protection, submit your key dates via our 3-minute consultation form.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">Open Family Law Consultation Form<\/a>\n              <a href=\"../../files/EN/PDF/03_Family_Law_Divorce_Property_Parenting_and_Settlement_Manual_2026_EN.pdf\" download class=\"col-btn-ghost\">Download Manual 03 (Family Law PDF)<\/a>\n              <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">Park &amp; Co Official Consultation Hub<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">Legal Disclaimer: This publication provides general legal information grounded in Australian legislation, official statistics and superior court authorities current as at November 2026. It does not constitute legal advice for your specific circumstances or create a solicitor-client relationship. Seek formal advice promptly before statutory limitation or visa deadlines expire.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">More Curated Family Law Columns<\/h3>\n        <a href=\"../../?lang=en&amp;tab=family\" class=\"col-back-link num\">\u2190 Back to Family Law Self-Help Hub<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../property-reforms-2026/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">2025\u20132026 REFORM BRIEFING \u00b7 FAMILY 01<\/span><h4 class=\"col-sib-title\">Australia&#x27;s 2025\u20132026 Property Settlement Overhaul: Economic Abuse, Separate Accounts, Family Pets &amp; Limitation Bars<\/h4><p class=\"col-sib-desc\">Covers the abolition of balance-sheet add-backs, s 4AB(2A) economic abuse proof thresholds, separate accounts and overseas assets under s 71B, the ban on shared pet custody, and strict s 44 time bars.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../divorce-parenting-reality-guide/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PRACTICAL REALITY GUIDE \u00b7 FAMILY 02<\/span><h4 class=\"col-sib-title\">Divorce, Parenting &amp; Property in Australia: The Practical Reality Check Before You Hire a Lawyer<\/h4><p class=\"col-sib-desc\">Explains s 48 no-fault DIY divorce and June 2025 s 98A paper hearings, the repeal of equal-time parenting presumptions (Gallagher, Picard, Radecki), PPP &lt;=$550k vs $4,950 Consent Orders.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../partner-visa-breakdown-crossborder/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">FAMILY &amp; VISA INTERSECTION \u00b7 FAMILY 03<\/span><h4 class=\"col-sib-title\">Partner Visa Breakdown, Division 1.5 Family Violence PR &amp; Cross-Border Property Traps<\/h4><p class=\"col-sib-desc\">Why sponsors cannot cancel visas, clearing the Gupta genuine-relationship gate and July 2024 Subclass 309 entry rules, aligning FCFCOA and DHA affidavits, and avoiding s 65Y travel offences.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a><a href=\"../parental-advances-loans-gifts-divorce/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PARENTAL ADVANCES \u00b7 FAMILY 14<\/span><h4 class=\"col-sib-title\">The Bank of Mum and Dad in Australian Divorce: Repayable Loan, Resulting Trust or Gift?<\/h4><p class=\"col-sib-desc\">Distinguishes deductible balance-sheet debts from s 79(4) contributions, resulting trusts vs advancement presumptions, and third-party parent interventions.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../family-trusts-companies-valuation-divorce/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">TRUSTS &amp; VALUATIONS \u00b7 FAMILY 15<\/span><h4 class=\"col-sib-title\">Family Trusts, Private Pty Ltd Companies and Shadow Business Valuations in Property Settlements<\/h4><p class=\"col-sib-desc\">Covers appointor/trustee control vs genuine third-party partners (Ascot), mandatory Single Expert Witness rules, s 106B clawbacks, and tax-effective s 79 orders.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a><a href=\"../post-separation-inheritances-windfalls-delay/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">POST-SEPARATION WEALTH \u00b7 FAMILY 16<\/span><h4 class=\"col-sib-title\">Why Delaying Consent Orders Exposes Post-Separation Inheritances, Lotto Wins and New Equity<\/h4><p class=\"col-sib-desc\">How leaving informal separations unsealed exposes inheritances received 4 years later, $5M\u2013$6M lottery windfalls and rising home equity, and how $4,950 Consent Orders close the door.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../prenups-bfa-vs-consent-orders/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PRENUPS &amp; CONSENT ORDERS \u00b7 FAMILY 17<\/span><h4 class=\"col-sib-title\">Why Prenups Get Crushed Under Thorne v Kennedy and When $4,950 Consent Orders Beat a BFA<\/h4><p class=\"col-sib-desc\">Explains how pre-marital wealth-protection BFAs survive scrutiny and why separated couples who agree save thousands with fixed-fee $4,950 Court Consent Orders.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}}</script>

  /* 429-aware retry spanning >15s across retries to cleanly outlast Abacus 30;w=10 windows */
  function fetchRetry(url, isHit, attempt) {

        if (r.status === 429) {

        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();

            .then(function () { return fetchRetry(url, isHit, tries + 1); });
        }
        throw err;
      });
  }

      })
      .catch(function () {
        var slot = document.getElementById('vc-chart-slot');
        if (slot && !slot.querySelector('svg')) {
          slot.textContent = uiLang() === 'en' ? 'Could not load the chart.' : '그래프를 불러오지 못했어요.';
        }
      });
  }

  function open() {
    activeRange = 7;
    modal.classList.add('open');
    loadAndRenderModal(true);
  }
  box.setAttribute('role', 'button');
  box.setAttribute('tabindex', '0');
  box.addEventListener('click', open);
  box.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
})();
  </script>
</body>
</html>
