0b7 \ud638\uc8fc \uc9c1\uc7a5\u00b7\uace0\uc6a9\ubc95 \uc26c\uc6b4 \ud310\ub840 \uce7c\ub7fc<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn active\">\ud55c\uad6d\uc5b4<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/221801513691854\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">\uc628\ub77c\uc778 \uc0c1\ub2f4 \uc2e0\uccad \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">\ubc95\uc778\ud3d0\uc5c5\u00b7\uc5f0\ub300\ucc45\uc784 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 05<\/span>\n          <span class=\"col-verified-pill num\">1\ucc28 \ubc95\ub839\u00b7\ud310\ub840 \uac80\uc99d \uc644\ub8cc (2026.11)<\/span>\n          <span class=\"col-time-pill num\">\uc57d 8\ubd84 \uc18c\uc694<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">\ud68c\uc0ac\ub97c \ud3d0\uc5c5(Liquidation)\ud558\uba74 \ub05d\uc77c\uae4c: \ub300\ud45c\uc774\uc0ac\u00b7\ud68c\uacc4\uc0ac \uac1c\uc778 \uc7ac\uc0b0\uc744 \ucd94\uad81\ud558\ub294 FWA s 550 \uc5f0\ub300\ucc45\uc784<\/h1>\n        <p class=\"col-subtitle\">4\uac1c \ubc95\uc778 \uccad\uc0b0 \ud6c4\uc5d0\ub3c4 \ucd1d $1,530\ub9cc(\ub300\ud45c \uac1c\uc778 $160\ub9cc) \uc81c\uc7ac\ub97c \ubd80\uacfc\ud55c Sushi Bay \ud310\uacb0\uacfc \uc678\ubd80 \ud68c\uacc4\ubc95\uc778 \ucc45\uc784\uc744 \uc778\uc815\ud55c EZY Accounting \ud310\ub840 \ubd84\uc11d<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">\ubc15\ucc3d\ubbfc \ub300\ud45c\ubcc0\ud638\uc0ac (Chang Min Park)<\/div>\n            <div class=\"col-author-role\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \ub300\ud45c\ubcc0\ud638\uc0ac \u00b7 \ud638\uc8fc \ud038\uc990\ub79c\ub4dc\uc8fc \ubcc0\ud638\uc0ac\ud68c \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col05_emp_s550_hero.jpg\" alt=\"\ud68c\uc0ac\ub97c \ud3d0\uc5c5(Liquidation)\ud558\uba74 \ub05d\uc77c\uae4c: \ub300\ud45c\uc774\uc0ac\u00b7\ud68c\uacc4\uc0ac \uac1c\uc778 \uc7ac\uc0b0\uc744 \ucd94\uad81\ud558\ub294 FWA s 550 \uc5f0\ub300\ucc45\uc784\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">\ubc95\uc778\uc744 \uccad\uc0b0\uc2dc\ud0a4\uba74 \ud574\ub2f9 \ud68c\uc0ac\uc5d0 \ub300\ud55c \uc18c\uc1a1 \uc808\ucc28\ub9cc \uc815\uc9c0\ub420 \ubfd0\uc774\uba70 \uc704\ubc18 \uc0ac\uc2e4\uc744 \uc778\uc9c0\ud558\uace0 \uad00\uc5ec\ud55c \ub300\ud45c\uc774\uc0ac\uc640 \ud68c\uacc4\uc0ac \uac1c\uc778\uc758 \ubc30\uc0c1 \ucc45\uc784(s 550)\uc740 \uba74\uc81c\ub418\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">$1,530\ub9cc \uc81c\uc7ac<\/div><div class=\"col-stat-lbl\">Sushi Bay 4\uac1c \ubc95\uc778 \uccad\uc0b0\uc5d0\ub3c4 \ubd80\uacfc\ub41c \ucd1d \uacfc\ud0dc\ub8cc (\ub300\ud45c \uac1c\uc778 $160\ub9cc \u00b7 [2024] FCA 869)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">\uc678\ubd80 \ud68c\uacc4\uc0ac \ud3ec\ud568<\/div><div class=\"col-stat-lbl\">\ucd5c\uc800\uc2dc\uae09 \ubbf8\ub2ec \uc778\uc9c0 \ud6c4 \uae09\uc5ec \uae30\uc7a5 \uc2dc s 550 \uacf5\ubc94 \uc131\ub9bd (EZY Accounting [2018])<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">6\ub144 \uc18c\uba78\uc2dc\ud6a8<\/div><div class=\"col-stat-lbl\">\ubbf8\uc9c0\uae09 \uc784\uae08\u00b7\uc218\ub2f9 \ubbfc\uc0ac \ubc30\uc0c1 \ubc0f s 550 \uac1c\uc778 \uc5f0\ub300\ucc45\uc784 \ucd94\uad81 \uc2dc\ud6a8<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">\uc774 \uce7c\ub7fc\uc758 \ubaa9\ucc28<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#\uc720\ud55c\ucc45\uc784-\uc7a5\ub9c9\uc744-\uc6b0\ud68c\ud558\ub294-fwa-s-550-\uad00\uc5ec\uc790-\ucc45\uc784\uc758-\uc791\ub3d9-\uc6d0\ub9ac\" class=\"col-toc-link lvl-2\">\uc720\ud55c\ucc45\uc784 \uc7a5\ub9c9\uc744 \uc6b0\ud68c\ud558\ub294 FWA s 550 \uad00\uc5ec\uc790 \ucc45\uc784\uc758 \uc791\ub3d9 \uc6d0\ub9ac<\/a><a href=\"#\uc2a4\uc2dc\ubca0\uc774sushi-bay-\uc5f0\ubc29\ubc95\uc6d0-\ud310\uacb0-4\uac1c-\ubc95\uc778-\uccad\uc0b0-\ub4a4-\ub300\ud45c-\uac1c\uc778\uc5d0\uac8c-\ub5a8\uc5b4\uc9c4-160\" class=\"col-toc-link lvl-2\">\uc2a4\uc2dc\ubca0\uc774(Sushi Bay) \uc5f0\ubc29\ubc95\uc6d0 \ud310\uacb0: 4\uac1c \ubc95\uc778 \uccad\uc0b0 \ub4a4 \ub300\ud45c \uac1c\uc778\uc5d0\uac8c \ub5a8\uc5b4\uc9c4 160\ub9cc \ub2ec\ub7ec \uc81c\uc7ac<\/a><a href=\"#\uc2dc\ud0a8-\ub300\ub85c-\uae09\uc5ec\ub9cc-\ub3cc\ub838\ub2e4\ub294-\ud56d\ubcc0\uc758-\ubd95\uad34-\uc678\ubd80-\ud68c\uacc4\ubc95\uc778\uae4c\uc9c0-\ub36e\uce5c-ezy-accountin\" class=\"col-toc-link lvl-2\">\uc2dc\ud0a8 \ub300\ub85c \uae09\uc5ec\ub9cc \ub3cc\ub838\ub2e4\ub294 \ud56d\ubcc0\uc758 \ubd95\uad34: \uc678\ubd80 \ud68c\uacc4\ubc95\uc778\uae4c\uc9c0 \ub36e\uce5c EZY Accounting \ud310\ub840<\/a><a href=\"#\ud3d0\uc5c5-\ubc95\uc778-\uc0c1\ub300\ub85c-\ub098\ud640\ub85c-\uc18c\uc561\uccad\uad6cs-548\ub97c-\ub0b4\uba74-\ud734\uc9c0-\uc870\uac01-\ud310\uacb0\ubb38\ub9cc-\ub0a8\ub294-\uc774\uc720\" class=\"col-toc-link lvl-2\">\ud3d0\uc5c5 \ubc95\uc778 \uc0c1\ub300\ub85c \ub098\ud640\ub85c \uc18c\uc561\uccad\uad6c(s 548)\ub97c \ub0b4\uba74 \ud734\uc9c0 \uc870\uac01 \ud310\uacb0\ubb38\ub9cc \ub0a8\ub294 \uc774\uc720<\/a><a href=\"#\uccad\uad6c-\uae08\uc561\uacfc-\ub2f9\uc0ac\uc790-\uc9c0\uc704\uc5d0-\ub530\ub978-\uc2e4\uc804-\ub300\uc751-\uc548\ub0b4\" class=\"col-toc-link lvl-2\">\uccad\uad6c \uae08\uc561\uacfc \ub2f9\uc0ac\uc790 \uc9c0\uc704\uc5d0 \ub530\ub978 \uc2e4\uc804 \ub300\uc751 \uc548\ub0b4<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/221801513691854\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">\uace0\uc6a9\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../?lang=ko&amp;tab=employment\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 \uc9c1\uc7a5\u00b7\ubc00\ub9b0 \uc784\uae08 \uacc4\uc0b0\uae30\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">\ubc00\ub9b0 \uae09\uc5ec\uc640 \uc5f0\uae08\uc744 \ub2ec\ub77c\uace0 \ucd5c\uace0\uc7a5\uc744 \ubcf4\ub0c8\ub354\ub2c8 \uba70\uce60 \ub4a4 \uace0\uc6a9\uc8fc \ubc95\uc778(Pty Ltd)\uc774 \uccad\uc0b0\uc778(Liquidator)\uc744 \uc120\uc784\ud558\uace0 \ud3d0\uc5c5\ud574 \ubc84\ub9ac\ub294 \uc77c\uc774 \uc788\uc5b4\uc694. \uadf8\ub7ec\uace0\ub294 \ubc14\ub85c \uc606 \uac74\ubb3c\uc774\ub098 \uac19\uc740 \uc8fc\ubc29\uc5d0\uc11c \ubc95\uc778 \uc774\ub984\ub9cc \ubc14\uafbc \uc0c8 \ud68c\uc0ac\ub85c \uc601\uc5c5\uc744 \ud0dc\uc5f0\ud788 \uc774\uc5b4\uac00\uc8e0. \ud638\uc8fc\uc5d0\uc11c \ud53c\ub2c9\uc2a4(Phoenixing) \uc218\ubc95\uc774\ub77c \ubd80\ub974\ub294 \uc804\ud615\uc801\uc778 \ucc44\ubb34 \ud68c\ud53c \ud589\ud0dc\uc608\uc694. \uc77c\ubd80 \uc0ac\uc5c5\uc8fc\ub4e4\ub3c4 \uc8fc\uc2dd\ud68c\uc0ac\ub294 \uc720\ud55c\ucc45\uc784\uc774\ub2c8 \ubc95\uc778\ub9cc \ub2eb\uc73c\uba74 \ub0b4 \uc9d1\uacfc \uac1c\uc778 \uc608\uae08\uc740 \ubb34\uc0ac\ud560 \uac70\ub77c\uace0 \ubbff\uace4 \ud574\uc694. \uacf5\uc815\uadfc\ub85c\ubc95(Fair Work Act 2009, FWA) s 550 \uad00\uc5ec\uc790 \uc5f0\ub300\ucc45\uc784(Accessorial Liability) \uc870\ud56d\uc744 \ubaa8\ub974\uace0 \ub0b4\ub9ac\ub294 \uc704\ud5d8\ud55c \ucc29\uac01\uc774\uc5d0\uc694.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 382\" width=\"100%\" role=\"img\" aria-label=\"\ud3d0\uc5c5\ud55c \ubc95\uc778\ub9cc \uc0c1\ub300\ud558\ub294 \uc18c\uc561\uc18c\uc1a1 vs s 550 \ub300\ud45c\uc774\uc0ac\u00b7\ud68c\uacc4\uc0ac \uac1c\uc778 \ucd94\uad81\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"381\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">\ubc95\uc778\uaca9 \ubc29\ud328 \ubb34\ub825\ud654 \u00b7 FWA s 550 \uad00\uc5ec\uc790 \uac1c\uc778 \uc5f0\ub300\ucc45\uc784<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">\ud3d0\uc5c5\ud55c \ubc95\uc778\ub9cc \uc0c1\ub300\ud558\ub294 \uc18c\uc561\uc18c\uc1a1 vs s 550 \ub300\ud45c\uc774\uc0ac\u00b7\ud68c\uacc4\uc0ac \uac1c\uc778 \ucd94\uad81<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">\uadfc\uac70: FWO v Sushi Bay (No 2)/(No 3) [2024] FCA 76, 869 ($15.3M \uc81c\uc7ac) \u00b7 EZY Accounting 123 [2018] FCAFC 134<\/text>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#FAF9F6\" stroke=\"#76808F\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#76808F\"/>\n  <text x=\"38\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">PATH A \u00b7 \ud3d0\uc5c5 \ubc95\uc778(In Liq) \ub2e8\ub3c5 \uc81c\uc18c\uc758 \ud568\uc815<\/text>\n  <circle cx=\"42\" cy=\"144\" r=\"4\" fill=\"#76808F\"/>\n  <text x=\"54\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ubc95\uc778 \uccad\uc0b0 \uc2dc \uc18c\uc1a1 \uc790\ub3d9 \uc911\uc9c0 (Corps Act s 471B)<\/text>\n  <text x=\"54\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">\ube48 \uaecd\ub370\uae30 Pty Ltd\ub9cc \ud53c\uace0\ub85c \uc801\uc73c\uba74 \uc9d1\ud589\ud560 \uc790\uc0b0\uc774 0\uc6d0\uc785\ub2c8\ub2e4.<\/text>\n  <circle cx=\"42\" cy=\"196\" r=\"4\" fill=\"#76808F\"/>\n  <text x=\"54\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ud734\uc9c0\uc870\uac01 \uc2b9\uc18c \ud310\uacb0\ubb38 \uc704\ud5d8<\/text>\n  <text x=\"54\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">\uc0c8 \ubc95\uc778(Phoenix)\uc73c\ub85c \uac04\ud310\ub9cc \ubc14\uafd4 \uc601\uc5c5\ud574\ub3c4 \uae30\uc874 \ud310\uacb0\ub85c \uc555\ub958 \ubd88\uac00.<\/text>\n  <circle cx=\"42\" cy=\"248\" r=\"4\" fill=\"#76808F\"/>\n  <text x=\"54\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\uc18c\uc561\uc808\ucc28(s 548)\uc758 \uad6c\uc870\uc801 \ud55c\uacc4<\/text>\n  <text x=\"54\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">\uc0ac\uc2e4\uad00\uacc4 \uc778\uc815(Actual Knowledge) \ubc95\ub9ac \uc785\uc99d \uc5c6\uc774\ub294 \uac1c\uc778 \ucd94\uc2ec \uc2e4\ud328.<\/text>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"466\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">PATH B \u00b7 FWA s 550 \ub300\ud45c\uc774\uc0ac\u00b7\ud68c\uacc4\uc0ac \uac1c\uc778 \ucd94\uad81<\/text>\n  <circle cx=\"470\" cy=\"144\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ub300\ud45c\uc774\uc0ac \uac1c\uc778 \uc8fc\ud0dd\u00b7\uc608\uae08 \uc9c1\uc811 \uc9d1\ud589 (Sushi Bay)<\/text>\n  <text x=\"482\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">4\uac1c \ubc95\uc778 \uccad\uc0b0\uc5d0\ub3c4 \ub300\ud45c \uac1c\uc778\uc5d0\uac8c $160\ub9cc \uc81c\uc7ac \ubd80\uacfc ([2024] FCA 869).<\/text>\n  <circle cx=\"470\" cy=\"196\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\uc678\ubd80 \uae30\uc7a5 \ud68c\uacc4\uc0ac\u00b7HR \ub9e4\ub2c8\uc800 \uc5f0\ub300\ucc45\uc784 (EZY)<\/text>\n  <text x=\"482\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">\ubc95\uc815 \ucd5c\uc800\uc2dc\uae09 \ubbf8\ub2ec \uc0ac\uc2e4\uc744 \uc54c\uace0\ub3c4 \uae09\uc5ec \ucc98\ub9ac \uc2dc \uacf5\ub3d9 \uad00\uc5ec\uc790 \uc131\ub9bd.<\/text>\n  <circle cx=\"470\" cy=\"248\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ud575\uc2ec \uc694\uac74: \uc704\ubc18 \uc0ac\uc2e4\uc694\uc18c\uc758 \ud604\uc2e4\uc801 \uc778\uc2dd \uc785\uc99d<\/text>\n  <text x=\"482\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">\uc9c0\uc2dc\u00b7\uc774\uba54\uc77c\u00b7\ud398\uc774\uc2ac\ub9bd \uacb0\uc7ac \ud754\uc801\uc73c\ub85c \uac1c\uc778 \ubc30\uc0c1 \ubc0f \uacfc\ud0dc\ub8cc \ubcd1\ud569 \uccad\uad6c.<\/text>\n  <rect x=\"22\" y=\"328\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"351\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1D6B48\">\ud575\uc2ec \uad50\ud6c8: \ud3d0\uc5c5 \uc9d5\ud6c4\uac00 \uc788\ub294 $50,000+ \uccb4\ubd88 \ud68c\uc218\ub098 FWO\uc758 s 550 \uac1c\uc778 \uc18c\uba85 \uc694\uad6c\ub294 \ucd08\uae30 \ubc95\ub9ac \uc124\uacc4\uac00 \uac1c\uc778 \uc7ac\uc0b0 \uc0dd\uc0ac\ub97c \uac00\ub985\ub2c8\ub2e4.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 1: \ubc95\uc778 \uccad\uc0b0 \ud6c4\uc5d0\ub3c4 \uc0b4\uc544\ub0a8\ub294 FWA s 550 \uac1c\uc778 \uc5f0\ub300\ucc45\uc784 \ucd94\uad81 \uad6c\uc870<\/figcaption><\/figure>\n<h2 id=\"\uc720\ud55c\ucc45\uc784-\uc7a5\ub9c9\uc744-\uc6b0\ud68c\ud558\ub294-fwa-s-550-\uad00\uc5ec\uc790-\ucc45\uc784\uc758-\uc791\ub3d9-\uc6d0\ub9ac\" class=\"doc-h2\">\uc720\ud55c\ucc45\uc784 \uc7a5\ub9c9\uc744 \uc6b0\ud68c\ud558\ub294 FWA s 550 \uad00\uc5ec\uc790 \ucc45\uc784\uc758 \uc791\ub3d9 \uc6d0\ub9ac<\/h2>\n<p class=\"doc-p\">\uc77c\ubc18 \uc0c1\uc0ac \ubd84\uc7c1\uc5d0\uc11c\ub294 \ubc95\uc778\uc774 \uccad\uc0b0 \uc808\ucc28(Liquidation)\uc5d0 \ub4e4\uc5b4\uac00\uba74 \ud68c\uc0ac\ubc95(Corporations Act 2001 s 471B\u00b7s 500(2))\uc5d0 \ub530\ub77c \uadf8 \ubc95\uc778\uc744 \uc0c1\ub300\ub85c \ud55c \uc18c\uc1a1\uc774 \uace7\ubc14\ub85c \uba48\ucdb0 \uc11c\uc694. \ud558\uc9c0\ub9cc \ud638\uc8fc \uacf5\uc815\uadfc\ub85c\ubc95\uc740 \uc774 \uc7a5\ub9c9\uc744 \uc6b0\ud68c\ud558\ub294 \uc9c1\ud1b5 \uacbd\ub85c\ub97c \ub530\ub85c \uc5f4\uc5b4 \ub450\uc5c8\uc5b4\uc694. \ubc14\ub85c FWA s 550 \uc870\ud56d\uc774\uc5d0\uc694. \uae30\uc5c5\uc758 \ub178\ub3d9\ubc95 \uc704\ubc18\uc744 \uad50\uc0ac\u00b7\ubc29\uc870\ud588\uac70\ub098 \uc5b4\ub5a4 \ud615\ud0dc\ub85c\ub4e0 \uace0\uc758\ub85c \uad00\uc5ec\ud55c(knowingly concerned in) \uc790\uc5f0\uc778\uacfc \uc678\ubd80 \uc790\ubb38\uc0ac\ub97c \ubc95 \uc704\ubc18\uc744 \uc9c1\uc811 \uc800\uc9c0\ub978 \uc8fc\ubc94\uacfc \ub611\uac19\uc774 \ucde8\uae09\ud55c\ub2e4\uace0 \ubabb \ubc15\uc558\uac70\ub4e0\uc694.<\/p>\n<p class=\"doc-p\">\uac00\uc7a5 \ubb34\uc11c\uc6b4 \ub300\ubaa9\uc740 \ubc95\uc778\uc758 \uc0dd\uc0ac\uc640 \uac1c\uc778 \ucc45\uc784\uc774 \uc644\uc804\ud788 \ubd84\ub9ac\ub41c\ub2e4\ub294 \uc810\uc774\uc5d0\uc694. \uc6d0\ub798 \uace0\uc6a9\uc8fc\uc600\ub358 Pty Ltd \uaecd\ub370\uae30 \ubc95\uc778\uc774 \ube48\ud138\ud130\ub9ac\ub85c \uccad\uc0b0\ub418\ub354\ub77c\ub3c4 \uc790\uc5f0\uc778 \ud53c\uace0\uc5d0 \ub300\ud55c \uc7ac\ud310\uc740 \uadf8\ub300\ub85c \uad74\ub7ec\uac00\uc694. \ubc95\uc6d0\uc740 \uc704\ubc18\uc5d0 \uad00\uc5ec\ud55c \ub4f1\uae30 \ub300\ud45c\uc774\uc0ac, \uc2e4\uc9c8 \uc0ac\uc8fc, \uc778\uc0ac \ub9e4\ub2c8\uc800, \uc678\ubd80 \uae30\uc7a5 \ud68c\uacc4\uc0ac \uac1c\uc778 \uba85\uc758\ub85c \ubbfc\uc0ac \uc81c\uc7ac\uae08(civil penalties)\uacfc \ubbf8\uc9c0\uae09 \uc784\uae08\u00b7\uc5f0\uae08 \uc6d0\uae08 \uc804\uc561 \ubc30\uc0c1 \uba85\ub839(s 545)\uc744 \ud568\uaed8 \ub0b4\ub9b4 \uc218 \uc788\uc5b4\uc694. \ud68c\uc0ac\ub97c \ud3d0\uc5c5\ud588\ub294\ub370\ub3c4 \ub300\ud45c \uac1c\uc778 \uc790\ud0dd\uc5d0 \uc555\ub958\uac00 \ub4e4\uc5b4\uc624\ub294 \uc774\uc720\uac00 \ubc14\ub85c \uc5ec\uae30\uc5d0 \uc788\uc8e0.<\/p>\n<h2 id=\"\uc2a4\uc2dc\ubca0\uc774sushi-bay-\uc5f0\ubc29\ubc95\uc6d0-\ud310\uacb0-4\uac1c-\ubc95\uc778-\uccad\uc0b0-\ub4a4-\ub300\ud45c-\uac1c\uc778\uc5d0\uac8c-\ub5a8\uc5b4\uc9c4-160\" class=\"doc-h2\">\uc2a4\uc2dc\ubca0\uc774(Sushi Bay) \uc5f0\ubc29\ubc95\uc6d0 \ud310\uacb0: 4\uac1c \ubc95\uc778 \uccad\uc0b0 \ub4a4 \ub300\ud45c \uac1c\uc778\uc5d0\uac8c \ub5a8\uc5b4\uc9c4 160\ub9cc \ub2ec\ub7ec \uc81c\uc7ac<\/h2>\n<p class=\"doc-p\">\uc774 \ubc95\ub9ac\uc758 \uc704\ub825\uc744 \ud55c\uc778 \uc0ac\ud68c\uc640 \ud638\uc8fc \uc694\uc2dd\uc5c5\uacc4\uc5d0 \uac01\uc778\uc2dc\ud0a8 \uc0ac\uac74\uc774 \uc5f0\ubc29\ubc95\uc6d0\uc758 \uc2a4\uc2dc\ubca0\uc774 \uc5f0\uc18d \ud310\uacb0\uc774\uc5d0\uc694. \ucc45\uc784 \uc131\ub9bd\uc744 \uc778\uc815\ud55c <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2024/76.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Fair Work Ombudsman v Sushi Bay Pty Ltd (in liq) (No 2)<\/em> [2024] FCA 76<\/a> (2024\ub144 2\uc6d4 14\uc77c \uc120\uace0) \ud310\uacb0\uacfc \uc591\ud615\uc744 \ud655\uc815\ud55c <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2024/869.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Fair Work Ombudsman v Sushi Bay Pty Ltd (in liq) (No 3)<\/em> [2024] FCA 869<\/a> (2024\ub144 8\uc6d4 5\uc77c \uc120\uace0) \uc0ac\uac74\uc774\uc8e0. 4\uac1c \uc6b4\uc601 \ubc95\uc778\uc740 \ud55c\uad6d\uc778 \ube44\uc790 \uc18c\uc9c0\uc790\uac00 \ub300\ub2e4\uc218\uc778 \uadfc\ub85c\uc790 163\uba85\uc5d0\uac8c $650,000 \uc774\uc0c1\uc758 \uc784\uae08\uacfc \uc8fc\ub9d0\u00b7\ucd08\uacfc\uadfc\ubb34 \uc218\ub2f9\uc744 \uace0\uc758\ub85c \ub35c \uc9c0\uae09\ud588\uc5b4\uc694. \ud5c8\uc704 \uae09\uc5ec \ub300\uc7a5\uc744 \uafb8\ubbf8\uace0 \ubd88\ubc95 \ube44\uc790 \uc2a4\ud3f0\uc11c\uc2ed \uce90\uc2dc\ubc31 \uacf5\uc81c\uae4c\uc9c0 \ubc18\ubcf5\ud558\ub2e4\uac00 FWA s 557A \uc911\ub300 \uc704\ubc18(serious contraventions)\uc73c\ub85c \uae30\uc18c\ub410\uc8e0.<\/p>\n<p class=\"doc-p\">\uc7ac\ud310 \ub3c4\uc911 4\uac1c \ubc95\uc778\uc740 \uc804\ubd80 \uccad\uc0b0 \uc808\ucc28(in liq)\ub85c \ub118\uc5b4\uac14\uc5b4\uc694. \uadf8\ub7fc\uc5d0\ub3c4 \uc5f0\ubc29\ubc95\uc6d0 Katzmann \ud310\uc0ac\ub294 \ucd1d $15.3 million(1,530\ub9cc \ub2ec\ub7ec)\uc774\ub77c\ub294 \uae30\ub85d\uc801\uc778 \uc81c\uc7ac\uae08\uc744 \uc120\uace0\ud588\uc5b4\uc694. \ud2b9\ud788 \uadf8\uc911 $1.6 million(160\ub9cc \ub2ec\ub7ec)\uc744 \ub2e8\ub3c5 \uc8fc\uc8fc\uc774\uc790 \ub4f1\uae30 \ub300\ud45c\uc774\uc0ac\uc600\ub358 \uc2e0\uc774\uc815(Yi Jeong &quot;Rebecca&quot; Shin) \uc528 \uac1c\uc778\uc5d0\uac8c FWA s 550 \ucc45\uc784\uc73c\ub85c \uc9c1\uc811 \ubd80\uacfc\ud588\uc5b4\uc694. \ubc95\uc778 \ud3d0\uc5c5\uc774 \ub300\ud45c \uac1c\uc778\uc758 \uc7ac\uc0b0\uc744 \ud55c \ud47c\ub3c4 \uac00\ub824 \uc8fc\uc9c0 \ubabb\ud55c \uac70\uc608\uc694.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"4\"><thead><tr><th style=\"text-align:left\">\ucd94\uad81 \ub300\uc0c1 \ubc0f \uc808\ucc28 \uad6c\ubd84<\/th><th style=\"text-align:left\">\ubc95\uc778 \ud3d0\uc5c5(Liquidation) \uc601\ud5a5<\/th><th style=\"text-align:left\">FWA s 550 \uc131\ub9bd \uae30\uc900 \ubc0f \ud575\uc2ec \ud310\ub840<\/th><th style=\"text-align:left\">\uc2e4\uc9c8 \ud68c\uc218 \ubc0f \ubc29\uc5b4 \uacb0\uacfc<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>\uccad\uc0b0 \ubc95\uc778(Pty Ltd in liq) \ub2e8\ub3c5<\/strong><\/td><td style=\"text-align:left\">\ud68c\uc0ac\ubc95\uc0c1 \uc18c\uc1a1 \uc790\ub3d9 \uc815\uc9c0 \u00b7 \ubb34\uc790\ub825<\/td><td style=\"text-align:left\">\ubc95\uc778 \uc790\uccb4\uc758 FWA \uc704\ubc18\ub9cc \uc2ec\ub9ac<\/td><td style=\"text-align:left\">\uc794\uc5ec \uc790\uc0b0\uc774 \uc5c6\uc73c\uba74 \uc2e4\uc9c8 \ud68c\uc218\uc561 $0 \ud734\uc9c0 \uc870\uac01<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ub4f1\uae30 \ub300\ud45c\uc774\uc0ac \u00b7 \uc2e4\uc9c8 \uc0ac\uc8fc<\/strong><\/td><td style=\"text-align:left\"><strong>\uc18c\uc1a1 \uc815\uc9c0 \uc5c6\uc74c<\/strong> \u00b7 \uac1c\uc778 \uc7ac\uc0b0 \ucd94\uad81<\/td><td style=\"text-align:left\">\uc704\ubc18 \ud575\uc2ec \uc0ac\uc2e4\uc5d0 \ub300\ud55c \ud604\uc2e4\uc801 \uc778\uc2dd (<em>Sushi Bay (No 3)<\/em> [2024] FCA 869)<\/td><td style=\"text-align:left\">\uac1c\uc778 160\ub9cc \ub2ec\ub7ec \uc81c\uc7ac\uae08 \ubc0f s 545 \uccb4\ubd88 \uc6d0\uae08 \ubcc0\uc81c \uba85\ub839<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc678\ubd80 \ud68c\uacc4\uc0ac \u00b7 \uae09\uc5ec \ub300\ud589\uc0ac<\/strong><\/td><td style=\"text-align:left\">\ud3d0\uc5c5\uacfc \ubb34\uad00\ud558\uac8c \ub3c5\ub9bd \ud53c\uace0 \uc720\uc9c0<\/td><td style=\"text-align:left\">\ucd5c\uc800\uc2dc\uae09 \ubbf8\ub2ec \uc778\uc9c0 \ud6c4 \uae09\uc5ec \ucc98\ub9ac (<em>EZY Accounting<\/em> [2018] FCAFC 134)<\/td><td style=\"text-align:left\">\uc678\ubd80 \ud68c\uacc4\ubc95\uc778\uae4c\uc9c0 s 550 \uad00\uc5ec\uc790 \uc81c\uc7ac\u00b7\ubc30\uc0c1 \ucc45\uc784 \uc778\uc815<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc778\uc0ac(HR) \u00b7 \ucd1d\uad04 \ub9e4\ub2c8\uc800<\/strong><\/td><td style=\"text-align:left\">\uac1c\uc778 \uc790\uaca9 \uacf5\ub3d9 \ud53c\uace0\ub85c \uc2ec\ub9ac<\/td><td style=\"text-align:left\">\ud5c8\uc704 \uadfc\ubb34\ud45c\u00b7\uc218\ub2f9 \ub204\ub77d \uae09\uc5ec \uc2b9\uc778 \uad00\uc5ec<\/td><td style=\"text-align:left\">\uc9c1\uae09 \ub4a4\uc5d0 \uc228\uc9c0 \ubabb\ud558\uace0 \uac1c\uc778 \ubbfc\uc0ac \uc81c\uc7ac\uae08 \ubd80\uacfc<\/td><\/tr><tr><td style=\"text-align:left\"><strong>s 548 \uc18c\uc561 \ub300 s 550 \ubcf8\uc548<\/strong><\/td><td style=\"text-align:left\">\uc18c\uc561\uccad\uad6c \ubc95\uc778 \ub2e8\ub3c5 \uae30\uc7ac \uc2dc \ubb34\ub825\ud654<\/td><td style=\"text-align:left\">\ubcf8\uc548 \uc18c\uc7a5\uc5d0\uc11c \uad00\uc5ec\uc790\uc758 \ud604\uc2e4\uc801 \uc778\uc2dd(actual knowledge) \ud2b9\uc815<\/td><td style=\"text-align:left\">$50,000 \uc774\uc0c1 \uc0ac\uac74\uc5d0\uc11c \uc0ac\uc8fc \uac1c\uc778 \uc790\uc0b0 \uc9d1\ud589 \uac00\ub2a5<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"\uc2dc\ud0a8-\ub300\ub85c-\uae09\uc5ec\ub9cc-\ub3cc\ub838\ub2e4\ub294-\ud56d\ubcc0\uc758-\ubd95\uad34-\uc678\ubd80-\ud68c\uacc4\ubc95\uc778\uae4c\uc9c0-\ub36e\uce5c-ezy-accountin\" class=\"doc-h2\">\uc2dc\ud0a8 \ub300\ub85c \uae09\uc5ec\ub9cc \ub3cc\ub838\ub2e4\ub294 \ud56d\ubcc0\uc758 \ubd95\uad34: \uc678\ubd80 \ud68c\uacc4\ubc95\uc778\uae4c\uc9c0 \ub36e\uce5c EZY Accounting \ud310\ub840<\/h2>\n<p class=\"doc-p\">\uc678\ubd80 \ud68c\uacc4\uc0ac\ub098 \uae09\uc5ec \ub2f4\ub2f9\uc790\ub294 \uace0\uac1d\uc0ac\uac00 \ubd88\ub7ec \uc900 \uc22b\uc790\ub9cc \uc785\ub825\ud588\uc73c\ub2c8 \uad1c\ucc2e\uc744\uae4c\uc694? \uc804\ud600 \uadf8\ub807\uc9c0 \uc54a\uc544\uc694. \uc5f0\ubc29\ubc95\uc6d0 \uc804\uc6d0\uc7ac\ud310\ubd80\uc758 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCAFC/2018/134.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>EZY Accounting 123 Pty Ltd v Fair Work Ombudsman<\/em> [2018] FCAFC 134<\/a> (2018\ub144 8\uc6d4 20\uc77c \uc120\uace0) \ud310\uacb0\uc774 \uadf8 \uae30\ub300\ub97c \uae68\ub728\ub838\uac70\ub4e0\uc694. \ub2f9\uc2dc \uc678\ubd80 \ud68c\uacc4\ubc95\uc778\uc740 \uc0ac\uc5c5\uc8fc\uac00 \uac74\ub124\uc900 \uc2dc\uae09\ud45c\ub97c \uc804\uc0b0 \uc785\ub825\ud588\uc744 \ubfd0 \uc2dc\uae09 \uacb0\uc815\uad8c\uc774 \uc5c6\uc5c8\ub2e4\uace0 \ub9de\uc130\uc5b4\uc694.<\/p>\n<p class=\"doc-p\">\uc7ac\ud310\ubd80\uc758 \ud310\ub2e8\uc740 \ub2e8\ud638\ud588\uc5b4\uc694. \ud68c\uacc4\uc0ac\uac00 \uc138\ubd80 Award \uc870\ud56d \ubc88\ud638\uae4c\uc9c0 \ub2e4 \uc678\uc6b8 \ud544\uc694\ub294 \uc5c6\ub2e4\uace0 \ubd24\uc5b4\uc694. \uc704\ubc18\uc744 \uc774\ub8e8\ub294 \ud575\uc2ec \uc0ac\uc2e4 \uc694\uc18c(essential factual elements)\ub97c \ud604\uc2e4\uc801\uc73c\ub85c \uc778\uc2dd(actual knowledge)\ud588\ub2e4\uba74 \uadf8\uac78\ub85c \ucda9\ubd84\ud574\uc694. \ud574\ub2f9 \ud68c\uacc4\ubc95\uc778\uc740 \uc774\uc804 \uac10\uc0ac\ub85c \ucd5c\uc800\uc2dc\uae09 \uae30\uc900\uc744 \uc54c\uba74\uc11c\ub3c4 \uc8fc\ub9d0 \uac00\uc0b0\uc218\ub2f9 \uc5c6\ub294 \ub0ae\uc740 \ub2e8\uc77c \uc2dc\uae09 \uae09\uc5ec\ud45c\ub97c \uacc4\uc18d \ucc98\ub9ac\ud574 \uc92c\uc5b4\uc694. \uc758\ub8b0\uc778\uc774 \uc2dc\ucf30\ub2e4\ub294 \ubcc0\uba85\uc740 \ud1b5\ud558\uc9c0 \uc54a\uc544\uc694. \uc704\ubc95 \uc815\uc0b0\uc744 \ub3c4\uc6b4 \uc21c\uac04 \ud68c\uacc4\uc0ac\uc640 \uc778\uc0ac \ub9e4\ub2c8\uc800\ub3c4 \uacf5\ubc94 \uc790\ub9ac\uc5d0 \uc11c\uac8c \ub3fc\uc694.<\/p>\n<h2 id=\"\ud3d0\uc5c5-\ubc95\uc778-\uc0c1\ub300\ub85c-\ub098\ud640\ub85c-\uc18c\uc561\uccad\uad6cs-548\ub97c-\ub0b4\uba74-\ud734\uc9c0-\uc870\uac01-\ud310\uacb0\ubb38\ub9cc-\ub0a8\ub294-\uc774\uc720\" class=\"doc-h2\">\ud3d0\uc5c5 \ubc95\uc778 \uc0c1\ub300\ub85c \ub098\ud640\ub85c \uc18c\uc561\uccad\uad6c(s 548)\ub97c \ub0b4\uba74 \ud734\uc9c0 \uc870\uac01 \ud310\uacb0\ubb38\ub9cc \ub0a8\ub294 \uc774\uc720<\/h2>\n<p class=\"doc-p\">\uc5ec\uae30\uc11c \ud53c\ud574 \uadfc\ub85c\uc790\ub4e4\uc774 \uc790\uc8fc \ube60\uc9c0\ub294 \ud568\uc815\uc774 \ub098\uc640\uc694. \uc5f0\ubc29\uc21c\ud68c\u00b7\uac00\uc871\ubc95\uc6d0(FCFCOA) FWA s 548 \uc18c\uc561\uccad\uad6c(Form 5)\uc5d0 \ube48 \uaecd\ub370\uae30 Pty Ltd \ud68c\uc0ac \uc774\ub984\ub9cc \uc801\uc5b4 \ub0b4\ub294 \uc2e4\uc218\uc608\uc694. \uc815\uc0c1 \uc601\uc5c5 \uc911\uc778 \ud68c\uc0ac\ub77c\uba74 \uc18c\uc561\uccad\uad6c\uac00 \ud6a8\uacfc\uc801\uc774\uc8e0. \ud558\uc9c0\ub9cc \uc790\uc0b0\uc744 \ube7c\ub3cc\ub9ac\uace0 \ud3d0\uc5c5\ud558\ub294 \ud53c\ub2c9\uc2a4 \uc5c5\uccb4\ub77c\uba74 \ubc95\uc778 \ub2e8\ub3c5 \ud310\uacb0\ubb38\uc740 \uc885\uc787\uc7a5\uc5d0 \ubd88\uacfc\ud574\uc694. \uac8c\ub2e4\uac00 \uacf5\uc815\uadfc\ub85c\ubc95 \uc808\ucc28\ub294 \ubb34\uc18c\uc1a1\ube44\uc6a9 \uad00\ud560(s 570)\uc774\uc5d0\uc694. \uc18c\uc561 \ubd84\uc7c1\uc5d0\uc11c\ub294 \uc815\uc2dd \uc18c\uc1a1\uc744 \ub9e1\uae30\uae30\ub3c4 \uc5b4\ub835\uc8e0.<\/p>\n<p class=\"doc-p\">\ud3d0\uc5c5 \uc9d5\ud6c4\uac00 \ub69c\ub837\ud55c \uc0ac\uc5c5\uc8fc\uc5d0\uac8c\uc11c $50,000 \uc774\uc0c1\uc758 \uace0\uc561 \uccb4\ubd88\uae08\uc744 \ubc1b\uc544\ub0b4\ub824\uba74 \uc5f0\ubc29\uc21c\ud68c\u00b7\uac00\uc871\ubc95\uc6d0(FCFCOA) \uc77c\ubc18 \ubcf8\uc548\uc774\ub098 \uc5f0\ubc29\ubc95\uc6d0 \uc18c\uc1a1\uc73c\ub85c \uccab \ub2e8\ucd94\ub97c \uaff0\uc5b4\uc57c\ub9cc \uc2b9\uc0b0\uc774 \uc0dd\uaca8\uc694. \ub300\ud45c\uc774\uc0ac\uc640 \uc2e4\uc9c8 \uc6b4\uc601\uc790 \uac1c\uc778\uc744 \ud53c\uace0\ub85c \uc138\uc6b0\uace0 \uc218\ub2f9 \ubbf8\ub2ec \uc0ac\uc2e4\uc744 \uc9c0\uc2dc\u00b7\uc778\uc2dd\ud588\ub2e4\ub294 s 550 \uc99d\uac70\ub97c \ubb38\uc790\uc640 \uae09\uc5ec \uc2b9\uc778 \ub0b4\uc5ed\uc73c\ub85c \ucd18\ucd18\ud788 \ubb36\uc5b4\ub0b4\uc57c \ud558\uac70\ub4e0\uc694. \ubc18\ub300\ub85c \uacf5\uc815\uadfc\ub85c\uc634\ubd80\uc988\ub9e8(FWO) \uc870\uc0ac \ud1b5\uc9c0\ub098 s 550 \uc18c\uc7a5\uc744 \ubc1b\uc740 \ub300\ud45c\uc774\uc0ac\u00b7\uc778\uc0ac \uad00\ub9ac\uc790\u00b7\ud68c\uacc4\uc0ac\ub77c\uba74 \uc9c0\uccb4\ud560 \uc5ec\uc720\uac00 \uc5c6\uc5b4\uc694. \ud68c\uc0ac \uc774\uc775\uacfc \uac1c\uc778 \ubc29\uc5b4\uc120\uc774 \ucda9\ub3cc\ud558\ub294 \ub9cc\ud07c \uc989\uc2dc \ub3c5\ub9bd\ub41c \uac1c\uc778 \ubc29\uc5b4 \ub300\ub9ac\uc778\uc744 \uc120\uc784\ud574 \uc0ac\uc2e4 \uc778\uc2dd \uc5ec\ubd80\ub97c \ub2e4\ud22c\ub294 \ud3b8\uc774 \uc548\uc804\ud574\uc694.<\/p>\n<h2 id=\"\uccad\uad6c-\uae08\uc561\uacfc-\ub2f9\uc0ac\uc790-\uc9c0\uc704\uc5d0-\ub530\ub978-\uc2e4\uc804-\ub300\uc751-\uc548\ub0b4\" class=\"doc-h2\">\uccad\uad6c \uae08\uc561\uacfc \ub2f9\uc0ac\uc790 \uc9c0\uc704\uc5d0 \ub530\ub978 \uc2e4\uc804 \ub300\uc751 \uc548\ub0b4<\/h2>\n<p class=\"doc-p\">\ub0b4 \uc0c1\ud669\uc5d0 \ub9de\ub294 \uacbd\ub85c\ub97c \uba3c\uc800 \uac00\ub824 \ubcf4\uc138\uc694. \uace0\uc6a9\uc8fc \ubc95\uc778\uc774 \uc815\uc0c1 \uc601\uc5c5 \uc911\uc774\uace0 \ubbf8\uc9c0\uae09 \uc608\uc0c1\uc561\uc774 $50,000 \ubbf8\ub9cc\uc774\uac70\ub098 \uc544\uc9c1 \uccb4\ubd88\uc561\uc744 \uacc4\uc0b0\ud574 \ubcf4\uc9c0 \uc54a\uc73c\uc168\ub2e4\uba74 \uc9c1\uc811 \uccad\uad6c\ud558\uc2dc\ub294 \uae38\uc774 \uc720\ub9ac\ud574\uc694. \ubcf8 \ud3ec\ud138\uc758 \ubb34\ub8cc <a href=\"../../?lang=ko#employment\" class=\"doc-link\">\uc9c1\uc885\ubcc4 Award \ud504\ub9ac\uc14b \uacc4\uc0b0\uae30<\/a>\uc640 <a href=\"../../files/KO/Excel_Calculator/Park_Co_Underpayment_Self_Calculator_2026_KO.xlsx\" download class=\"doc-link\">208\uc218\uc2dd \uc790\ub3d9 \uc815\uc0b0 \uc5d1\uc140(.xlsx)<\/a>\ub85c \ubd80\uc871\ubd84\uc744 \uc9c1\uc811 \uc0b0\ucd9c\ud574 \ubcf4\uc138\uc694. \uc774\uc5b4\uc11c <a href=\"../../files/KO/PDF/02_Employment_Underpayment_Self_Calculation_and_Evidence_Manual_2026_KO.pdf\" download class=\"doc-link\">\uccb4\ubd88\uc784\uae08 \uc140\ud504 \uc815\uc0b0 \ubc0f Form 5 \ub9e4\ub274\uc5bc<\/a>\uc744 \ub530\ub77c 7\uc77c \ucd5c\uace0\uc7a5 \ubc1c\uc1a1\uacfc Form 5 \uc18c\uc561\uccad\uad6c\ub85c \ud68c\uc218\uae08 100%\ub97c \uc9c0\ud0a4\uc2dc\uba74 \ub3fc\uc694.<\/p>\n<p class=\"doc-p\">\ubc18\uba74 \ubcf8 \ud3ec\ud138 \uacc4\uc0b0\uae30\ub85c \uc9c1\uc811 \uc0b0\ucd9c\ud55c \uccb4\ubd88 \uc6d0\uae08\uc774 $50,000 \uc774\uc0c1\uc774\uba74\uc11c \ud3d0\uc5c5\u00b7\ud53c\ub2c9\uc2a4 \uc0ac\uc8fc \uac1c\uc778 \uc7ac\uc0b0\uc744 \ucd94\uad81\ud558\ub294 \ubcf5\uc7a1\ud55c FWA s 550 \ubcf8\uc548 \uc18c\uc1a1\uc740 \ucd08\uae30 \uc18c\uc7a5 \uc124\uacc4\uac00 \ud68c\uc218\ub97c \uc88c\uc6b0\ud574\uc694. FWO \uc870\uc0ac\ub098 s 550 \uac1c\uc778 \uccad\uad6c\uc5d0 \uc9c1\uba74\ud55c \ub300\ud45c\uc774\uc0ac\u00b7\uc778\uc0ac \ub2f4\ub2f9\uc790\u00b7\uc678\ubd80 \ud68c\uacc4\uc0ac \ubc29\uc5b4 \uc0ac\uac74 \uc5ed\uc2dc \ucd08\uae30 \ub300\uc751\uc774 \ud575\uc2ec\uc774\uc8e0. \ubc15\uc564\ucf54 \uace0\uc6a9\ubc95 \uc804\uc6a9 \ucc3d\uad6c(<a href=\"https://form.jotform.com/221801513691854\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\uace0\uc6a9\ubc95 \uc0ac\uc548 \uc811\uc218 \ubc14\ub85c\uac00\uae30<\/a>)\uc640 \uacf5\uc2dd \uc548\ub0b4 \ud398\uc774\uc9c0(<a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ubc15\uc564\ucf54 \uacf5\uc2dd \ub9c1\ud06c \ud5c8\ube0c<\/a>)\ub85c \uc815\uc0b0\ud45c\ub098 \ud1b5\uc9c0\uc11c\ub97c \uc811\uc218\ud574 \uc8fc\uc138\uc694. \uc774\ud574\ucda9\ub3cc \uc870\ud68c \ud6c4 \ud655\uc2e4\ud55c \uc804\ub7b5\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9b4\uac8c\uc694.<\/p>\n\n          <div class=\"col-sources-box\">\n            \uadfc\uac70 \ubc95\ub839 \ubc0f \ud310\ub840: Fair Work Act 2009 (Cth) ss 545, 548, 550, 557A, 570 \u00b7 Corporations Act 2001 s 471B \u00b7 FWO v Sushi Bay Pty Ltd (in liq) (No 2) [2024] FCA 76 &amp; (No 3) [2024] FCA 869 \u00b7 EZY Accounting 123 Pty Ltd v FWO [2018] FCAFC 134.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#E6C98C;\">\ud63c\uc790 \uc9c4\ud589\uc744 \uba48\ucd94\uace0 \ubcc0\ud638\uc0ac\ub97c \ucc3e\uc544\uc57c \ud558\ub294 \uc21c\uac04<\/span>\n            <h3 class=\"col-cta-title\">\ud68c\uc0ac \uae09\uc5ec\u00b7\uacc4\uc57d\uc11c \uc810\uac80, \ud574\uace0 21\uc77c \ub9c8\uac10 \uae30\ud55c, \ub610\ub294 \uc9c1\uc811 \uacc4\uc0b0\uc744 \ub9c8\uce5c $50,000 \uc774\uc0c1 \ubbf8\uc9c0\uae09 \uc0ac\uac74\uc785\ub2c8\uae4c?<\/h3>\n            <p class=\"col-cta-desc\">$50,000 \ubbf8\ub9cc\uc758 \uc77c\ubc18 \ubc00\ub9b0 \uae09\uc5ec\ub294 \ud3ec\ud138 \ubb34\ub8cc \uacc4\uc0b0\uae30\uc640 208\uc218\uc2dd \uc5d1\uc140\ub85c \uc9c1\uc811 \uacc4\uc0b0\ud574 \uccad\uad6c\ud558\uc154\uc57c \ubc1b\uc73c\uc2e4 \ub3c8\ubcf4\ub2e4 \ubcc0\ud638\uc0ac\ube44\uac00 \ub354 \ucee4\uc9c0\ub294 \uc77c\uc744 \ub9c9\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \ubc18\uba74 \ud574\uace0 \ud6c4 21\uc77c \uae30\ud55c\uc774 \uc784\ubc15\ud588\uac70\ub098 \ud68c\uc0ac \uc2a4\ud3f0\uc11c\uc2ed \ubc29\uc5b4\u00b7$50,000 \uc774\uc0c1 \uace0\uc561 \uccad\uad6c\u00b7\ud3d0\uc5c5 \ub300\ud45c\uc790 \ucc45\uc784 \ucd94\uad81(s 550) \ub2e8\uacc4\ub77c\uba74 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uc54c\ub824 \uc8fc\uc2ed\uc2dc\uc624.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/221801513691854\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">\uace0\uc6a9\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../files/KO/PDF/02_Employment_Underpayment_Self_Calculation_and_Evidence_Manual_2026_KO.pdf\" download class=\"col-btn-ghost\">02 \ubc00\ub9b0 \uc784\uae08 \uacc4\uc0b0\u00b7\uccad\uad6c \uc694\uc57d PDF \ubc1b\uae30<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">\ubc15\uc564\ucf54 \uacf5\uc2dd \uc0c1\ub2f4 \ub9c1\ud06c \ud5c8\ube0c<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">\ubc95\ub960 \uc548\ub0b4: \uc774 \uce7c\ub7fc\uc740 \ud638\uc8fc \uacf5\uc815\uadfc\ub85c\ubc95(Fair Work Act 2009), \ud1f4\uc9c1\uc5f0\uae08\ubc95, \uc774\ubbfc\ubc95\ub839\uacfc \ubc95\uc6d0 \ud310\ub840\ub97c \ubc14\ud0d5\uc73c\ub85c \uc54c\uae30 \uc27d\uac8c \ud480\uc5b4 \uc4f4 \uc77c\ubc18 \ubc95\ub960 \uc815\ubcf4\uc785\ub2c8\ub2e4. \uac1c\ubcc4 \uc0ac\uac74\uc5d0 \ub300\ud55c \ubc95\ub960 \uc790\ubb38\uc774\ub098 \uc218\uc784 \uacc4\uc57d \uc131\ub9bd\uc744 \ub73b\ud558\uc9c0 \uc54a\uc73c\ubbc0\ub85c FWC 21\uc77c \ub9c8\uac10 \uae30\ud55c \ub4f1\uc774 \uc784\ubc15\ud588\ub2e4\uba74 \uc9c0\uccb4 \uc5c6\uc774 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uac80\ud1a0\ub97c \ubc1b\uc544 \ubcf4\uc2dc\uae30 \ubc14\ub78d\ub2c8\ub2e4.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">\ud568\uaed8 \uc77d\uc73c\uba74 \uc88b\uc740 \uace0\uc6a9\ubc95 \ud310\ub840 \uce7c\ub7fc<\/h3>\n        <a href=\"../../?lang=ko&amp;tab=employment\" class=\"col-back-link num\">\u2190 \uc9c1\uc7a5\u00b7\ubc00\ub9b0 \uc784\uae08 \uacc4\uc0b0\uae30\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../annualised-salary-setoff-audit-2026/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ud3ec\uad04\uc5f0\ubd09\u00b7\uc784\uae08\uc808\ub3c4 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 04<\/span><h4 class=\"col-sib-title\">\ud3ec\uad04\uc5f0\ubd09\uc81c(All-In Salary) \uacc4\uc57d\uc11c\uc758 \ubc30\uc2e0: Woolworths\u00b7Coles \uc5f0\ubc29\ubc95\uc6d0 \ud310\uacb0\uacfc \uc784\uae08\uc808\ub3c4 \ud615\uc0ac\ucc98\ubc8c \ub300\uc751\ubc95<\/h4><p class=\"col-sib-desc\">&#x27;\uc5f0\ubd09\uc5d0 \uc8fc\ub9d0\u00b7\uc57c\uac04\uc218\ub2f9\uc774 \ubaa8\ub450 \ud3ec\ud568\ub410\ub2e4&#x27;\ub294 \uacc4\uc57d \uc870\ud56d\uc774 \uc5f0\ubc29\ubc95\uc6d0([2025] FCA 1092)\uc5d0\uc11c \ubc30\ucc99\ub41c \ubc95\ub9ac\ub97c \ubd84\uc11d\ud558\uace0 \uae30\uc5c5 \uae09\uc5ec \uac10\uc0ac \ubc0f $50,000 \uc774\uc0c1 \uc218\ub2f9 \uccad\uad6c \uae30\uc900\uc744 \uc548\ub0b4\ud569\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../sham-contracting-abn-s15aa/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ABN \uc704\uc7a5\ub3c4\uae09 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 06<\/span><h4 class=\"col-sib-title\">ABN \ud504\ub9ac\ub79c\uc11c \uacc4\uc57d\uc11c \uc37c\uc73c\ub2c8 \uadfc\ub85c\uc790\uac00 \uc544\ub2c8\ub2e4? FWA s 15AA \uc2e4\uc9c8 \uc2ec\uc0ac\uc640 6\ub144 \uce58 \uc5f0\uae08\u00b7\uc218\ub2f9 \uc5ed\ucd94\uc9d5<\/h4><p class=\"col-sib-desc\">\uc678\uc8fc \ub3c4\uae09 \uacc4\uc57d\uc11c\ub97c \uc791\uc131\ud558\uace0\ub3c4 \uc815\uc2dd \uadfc\ub85c\uc790\ub85c \uc778\uc815\ubc1b\uc544 \ubcf5\uc9c1\ud55c \ud310\ub840\uc640 \uc5f0\ubd09 $190,100 \uc774\uc0c1 \uad6c\uac04\uc5d0\uc11c \uc801\uc6a9 \uc81c\uc678 \ud1b5\uc9c0\uac00 \uc778\uc815\ub41c \ucd5c\uc2e0 \uacb0\uc815\ub840\ub97c \ub300\uc870\ud569\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../sponsored-worker-dismissal-482-186/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ube44\uc790\uc5f0\ub3d9 \ud574\uace0 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 07<\/span><h4 class=\"col-sib-title\">482\u00b7186 \uc2a4\ud3f0\uc11c \ube44\uc790 \uc911 \ud574\uace0 \ud1b5\ubcf4: 21\uc77c\uacfc 180\uc77c\uc758 \uc774\uc911 \uc2dc\uacc4\uc640 \ud569\uc758\uc11c(Deed) \ud568\uc815<\/h4><p class=\"col-sib-desc\">\uc2a4\ud3f0\uc11c \ube44\uc790 \uc7ac\uc9c1 \uc911 \ud574\uace0 \uc2dc \ub178\ub3d9\ubc95\uacfc \uc774\ubbfc\ubc95 \uae30\ud55c\uc744 \ubd84\ub9ac \ub300\uc751\ud560 \ub54c \ubc1c\uc0dd\ud558\ub294 \uc704\ud5d8\uc744 \uc9da\uace0 \uc885\ub8cc\uc77c \uc870\uc815 \ud569\uc758\uc11c(Deed) \uc124\uacc4 \uc6d0\uce59\uc744 \uc815\ub9ac\ud588\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../executive-dismissal-general-protections-restraints/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc784\uc6d0\ud574\uace0\u00b7\uacbd\uc5c5\uae08\uc9c0 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 08<\/span><h4 class=\"col-sib-title\">\uc5f0\ubd09 $190,100 \uc774\uc0c1 \uc784\uc6d0 \ud574\uace0\uc640 \ubb34\uc81c\ud55c \uc77c\ubc18\ubcf4\ud638 \uc18c\uc1a1\uc758 \ucc29\uac01: $520\ub9cc \ud310\uacb0 \ud30c\uae30 \uc0ac\ub840\uc640 \uacbd\uc5c5\uae08\uc9c0 \uac00\ucc98\ubd84<\/h4><p class=\"col-sib-desc\">\uc0ac\ub0b4 \ubb38\uc81c \uc81c\uae30 \uc9c1\ud6c4 \ud574\uace0\ub418\uba74 \ub2f9\uc5f0\ud788 \ubc30\uc0c1\uc774 \uc778\uc815\ub41c\ub2e4\ub294 \ud1b5\ub150\uc744 \ud310\ub840\ub85c \uac80\uc99d\ud558\uace0 \uace0\uc5f0\ubd09 \uc784\uc6d0 \ud1f4\uc9c1 \ud611\uc0c1\uacfc \uacbd\uc5c5\uae08\uc9c0 \uac00\ucc98\ubd84 \ubc29\uc5b4 \uc804\ub7b5\uc744 \ud574\uc124\ud569\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}, "en": {"doc_title": "Liquidating the Company Will Not Shield Directors or Accountants From s 550 Liability \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">All Guides Hub<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=en\">Visa Solution Guide<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=en\">Employment Navigator<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=en\">DIY & Cost-Smart Guide<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/?lang=en\" target=\"_blank\" rel=\"noopener\">Consult Park & Co \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=en&amp;tab=employment\" class=\"col-back-btn\">\u2190 Back to Employment Self-Help Hub<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">Park &amp; Co Lawyers \u00b7 Employment Law Deep-Dive Column<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn\">KO<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn active\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">Consult Park &amp; Co \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">DIRECTOR LIABILITY \u00b7 EMPLOYMENT 05<\/span>\n          <span class=\"col-verified-pill num\">Primary-Source Verified (Nov 2026)<\/span>\n          <span class=\"col-time-pill num\">8 min read<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">Liquidating the Company Will Not Shield Directors or Accountants From s 550 Liability<\/h1>\n        <p class=\"col-subtitle\">Lessons from the $15.3m Sushi Bay penalties ([2024] FCA 869), EZY Accounting [2018] FCAFC 134, and why DIY claims against phoenix companies fail<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">Chang Min Park<\/div>\n            <div class=\"col-author-role\">Legal Practitioner Director, Park &amp; Co Lawyers \u00b7 Accredited Specialist in Immigration Law (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col05_emp_s550_hero.jpg\" alt=\"Liquidating the Company Will Not Shield Directors or Accountants From s 550 Liability\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">Placing an operating Pty Ltd into liquidation stays claims against the company under s 471B, leaving directors and knowing payroll advisors personally exposed under FWA s 550.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">$15.3M Penalties<\/div><div class=\"col-stat-lbl\">Sushi Bay group total including $1.6M personally on sole director ([2024] FCA 869)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">Advisors Caught<\/div><div class=\"col-stat-lbl\">External payroll firm held liable under s 550 (EZY Accounting [2018] FCAFC 134)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">Actual Knowledge<\/div><div class=\"col-stat-lbl\">Strict evidentiary threshold required to plead or defeat personal s 550 claims<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">In This Column<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#how-fwa-s-550-turns-corporate-contraventions-int\" class=\"col-toc-link lvl-2\">How FWA s 550 turns corporate contraventions into personal debts<\/a><a href=\"#lessons-from-the-153-million-sushi-bay-liquidati\" class=\"col-toc-link lvl-2\">Lessons from the $15.3 million Sushi Bay liquidation judgments<\/a><a href=\"#external-accountants-and-hr-managers-after-ezy-a\" class=\"col-toc-link lvl-2\">External accountants and HR managers after EZY Accounting 123<\/a><a href=\"#why-diy-small-claims-fail-against-phoenix-operat\" class=\"col-toc-link lvl-2\">Why DIY small claims fail against phoenix operators<\/a><a href=\"#personal-defence-counsel-and-phoenix-recovery-ab\" class=\"col-toc-link lvl-2\">Personal defence counsel and phoenix recovery above $50,000<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">Open Employment Consultation Form<\/a>\n              <a href=\"../../?lang=en&amp;tab=employment\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 Back to Employment Self-Help Hub<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">When a Fair Work Ombudsman investigation or six-figure backpay demand lands on a restaurant group, cleaning contractor, or building subcontractor, a common boardroom instinct is to empty the operating account, put the employing Pty Ltd into voluntary liquidation, and reopen nearby under a clean ACN. Winding up the company stays unsecured court proceedings against the corporate shell under the <em>Corporations Act 2001<\/em> (Cth). Under s 550 of the <em>Fair Work Act 2009<\/em> (Cth) (FWA), liquidation does nothing to protect the individuals who ran the payroll. Accessorial liability bypasses corporate limited liability and attaches straight to the personal bank accounts, home equity, and careers of directors, general managers, HR officers, and external accountants.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 382\" width=\"100%\" role=\"img\" aria-label=\"Suing an Insolvent Pty Ltd Alone vs Pleading s 550 Personal Liability\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"381\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">ACCESSORIAL LIABILITY \u00b7 FAIR WORK ACT s 550<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">Suing an Insolvent Pty Ltd Alone vs Pleading s 550 Personal Liability<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">Authorities: FWO v Sushi Bay [2024] FCA 76 &amp; 869 ($15.3M penalties) \u00b7 EZY Accounting 123 [2018] FCAFC 134<\/text>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#FAF9F6\" stroke=\"#76808F\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#76808F\"/>\n  <text x=\"38\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">PATH A \u00b7 SUING INSOLVENT PTY LTD ALONE<\/text>\n  <circle cx=\"42\" cy=\"144\" r=\"4\" fill=\"#76808F\"/>\n  <text x=\"54\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Automatic Stay on Liquidation (s 471B)<\/text>\n  <text x=\"54\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">Naming only a gutted Pty Ltd leaves zero corporate assets to enforce.<\/text>\n  <circle cx=\"42\" cy=\"196\" r=\"4\" fill=\"#76808F\"/>\n  <text x=\"54\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Phoenix Asset-Stripping Trap<\/text>\n  <text x=\"54\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">Operators reopen under a fresh ABN while leaving an empty judgment.<\/text>\n  <circle cx=\"42\" cy=\"248\" r=\"4\" fill=\"#76808F\"/>\n  <text x=\"54\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">DIY Small Claims Limitation<\/text>\n  <text x=\"54\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">Unpleaded claims against directors fail strict s 550 knowledge rules.<\/text>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"466\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">PATH B \u00b7 PLEADED s 550 PERSONAL LIABILITY<\/text>\n  <circle cx=\"470\" cy=\"144\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Reaches Director Personal Equity (Sushi Bay)<\/text>\n  <text x=\"482\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">$1.6M personal penalty ordered despite 4 liquidations ([2024] FCA 869).<\/text>\n  <circle cx=\"470\" cy=\"196\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">External Accountants &amp; HR Caught (EZY)<\/text>\n  <text x=\"482\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">Processing known below-award flat rates triggers accessory liability.<\/text>\n  <circle cx=\"470\" cy=\"248\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"482\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Strict Proof: Actual Knowledge of Elements<\/text>\n  <text x=\"482\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">Requires forensic pleading of payroll control, rosters &amp; award rates.<\/text>\n  <rect x=\"22\" y=\"328\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"351\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1D6B48\">Key Takeaway: Recovering &gt;$50k from phoenix operators, or defending personal s 550 claims, hinges on actual-knowledge pleadings.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 1: How FWA s 550 Pierces Corporate Liquidation to Reach Directors and Advisors<\/figcaption><\/figure>\n<h2 id=\"how-fwa-s-550-turns-corporate-contraventions-int\" class=\"doc-h2\">How FWA s 550 turns corporate contraventions into personal debts<\/h2>\n<p class=\"doc-p\">Under FWA s 550(1) and (2), any person &quot;involved in&quot; a civil remedy contravention is treated in law as having personally committed that breach. Involvement covers aiding, abetting, counselling, or procuring the contravention, or being by act or omission directly or indirectly knowingly concerned in it.<\/p>\n<p class=\"doc-p\">Directors often assume personal exposure is limited to regulatory fines. Paired with s 545, however, s 550 allows a federal court to order an individual accessory to pay both pecuniary penalties and 100% of the unpaid wages, leave, and superannuation directly to underpaid staff. Once a Pty Ltd enters liquidation, the Fair Work Ombudsman (FWO) or an employee litigant simply leaves the insolvent company behind and prosecutes the sole director, operational controller, or payroll advisor to personal judgment, backed by bankruptcy enforcement against personal assets.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">Target / Litigation Path<\/th><th style=\"text-align:left\">Governing Rule &amp; Leading Case<\/th><th style=\"text-align:left\">Outcome After Corporate Liquidation<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Liquidated Pty Ltd Employer<\/strong><\/td><td style=\"text-align:left\"><em>Corporations Act 2001<\/em> insolvency stay on unsecured claims<\/td><td style=\"text-align:left\">Paper judgment against an empty shell yields zero recovery beyond capped government schemes<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Sole Owner / Company Director<\/strong><\/td><td style=\"text-align:left\">FWA s 550 &amp; s 557A; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2024/76.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Sushi Bay (No 2)<\/em> [2024] FCA 76<\/a> &amp; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2024/869.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Sushi Bay (No 3)<\/em> [2024] FCA 869<\/a><\/td><td style=\"text-align:left\">$15.3m total group penalties despite liquidation, including $1.6m personally against sole director Yi Jeong Shin<\/td><\/tr><tr><td style=\"text-align:left\"><strong>External Accountant / Payroll Firm<\/strong><\/td><td style=\"text-align:left\">FWA s 550 actual knowledge test; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCAFC/2018/134.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>EZY Accounting 123 v FWO<\/em> [2018] FCAFC 134<\/a><\/td><td style=\"text-align:left\">Processing flat rates known to sit below award minimums creates personal accessory liability; &quot;following client instructions&quot; fails<\/td><\/tr><tr><td style=\"text-align:left\"><strong>DIY s 548 Small Claims Filing<\/strong><\/td><td style=\"text-align:left\">FWA s 548 Small Claims (s 570 default no-costs rule)<\/td><td style=\"text-align:left\">Suing only the Pty Ltd fails on phoenix collapse; pleading s 550 against individuals requires strict proof of actual knowledge<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"lessons-from-the-153-million-sushi-bay-liquidati\" class=\"doc-h2\">Lessons from the $15.3 million Sushi Bay liquidation judgments<\/h2>\n<p class=\"doc-p\">The collapse of the liquidation strategy stood out plainly in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2024/76.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Fair Work Ombudsman v Sushi Bay Pty Ltd (in liq) (No 2)<\/em> [2024] FCA 76<\/a> (14 February 2024) and <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2024/869.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Fair Work Ombudsman v Sushi Bay Pty Ltd (in liq) (No 3)<\/em> [2024] FCA 869<\/a> (5 August 2024). Across outlets in New South Wales, Canberra, and Darwin, the Sushi Bay group deliberately underpaid more than $650,000 across 163 predominantly Korean visa workers, falsified payroll records, and deducted unlawful cashbacks from sponsored Subclass 482 staff who asked for overtime pay.<\/p>\n<p class=\"doc-p\">All four corporate entities entered liquidation before final penalty orders were made. Justice Katzmann held that the systematic underpayments and falsified records constituted s 557A serious contraventions (multiplying maximum civil penalties tenfold) and imposed $15.3 million in total penalties across the liquidated group, including $1.6 million personally against sole owner and director Yi Jeong (&quot;Rebecca&quot;) Shin under FWA s 550. An earlier FWO audit warning stripped away any claim of honest mistake and left the controlling director carrying personal liability long after the restaurants closed.<\/p>\n<h2 id=\"external-accountants-and-hr-managers-after-ezy-a\" class=\"doc-h2\">External accountants and HR managers after EZY Accounting 123<\/h2>\n<p class=\"doc-p\">Shareholders and directors are not the only individuals caught by s 550. External tax accountants, bookkeepers, payroll bureaus, and internal HR managers often assume they carry zero personal risk for a client&#x27;s unpaid wages so long as they hold no equity in the employer.<\/p>\n<p class=\"doc-p\">The Full Federal Court rejected that excuse in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCAFC/2018/134.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>EZY Accounting 123 Pty Ltd v Fair Work Ombudsman<\/em> [2018] FCAFC 134<\/a> (20 August 2018). An accounting practice processed payroll for a fast-food employer paying flat rates well below the modern award minimum, even after an earlier audit had flagged the shortfall. On appeal, the firm argued it merely keyed in numbers supplied by the client without checking individual duties. The Full Court confirmed that s 550 requires actual knowledge of the essential factual elements of the breach rather than memorising specific award clause numbers. Knowing a hospitality or cleaning client pays flat adult rates below statutory minimums and processing the pay run anyway turns an external advisor into a statutory accessory.<\/p>\n<h2 id=\"why-diy-small-claims-fail-against-phoenix-operat\" class=\"doc-h2\">Why DIY small claims fail against phoenix operators<\/h2>\n<p class=\"doc-p\">On the claimant side, s 550 explains why self-represented claims fail against phoenix operators. Under FWA s 548, workers can file a Form 5 Small Claims application without lawyers inside s 570&#x27;s default no-costs jurisdiction. That track works well for modest disputes against a solvent supermarket, yet naming only XYZ Hospitality Pty Ltd produces a worthless paper judgment the day a phoenix director appoints a liquidator. Recovering $50,000 or more from the individuals behind an insolvent shell requires pleading admissible facts in the Federal Circuit and Family Court (Division 2) or Federal Court proving each named controller&#x27;s actual knowledge of award coverage, hours worked, and non-payment.<\/p>\n<h2 id=\"personal-defence-counsel-and-phoenix-recovery-ab\" class=\"doc-h2\">Personal defence counsel and phoenix recovery above $50,000<\/h2>\n<p class=\"doc-p\">Straightforward unpaid wage claims under $50,000 against a solvent employer belong in our free Self-Help Award Calculator and Form 5 Small Claims guide. Park &amp; Co&#x27;s complex employment litigation practice acts for directors, HR managers, and accounting firms requiring independent personal defence counsel on FWO s 712 notices or s 550 pleadings, and for senior staff or worker groups pursuing self-calculated claims above $50,000 against phoenix controllers personally. Submit your ASIC extract, FWO notice, or shortfall calculation via the <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Employment Consultation Form<\/a> or visit the <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Official Links Hub<\/a>.<\/p>\n\n          <div class=\"col-sources-box\">\n            Primary Authorities: Fair Work Act 2009 (Cth) ss 545, 548, 550, 557A, 570 \u00b7 Corporations Act 2001 s 471B \u00b7 FWO v Sushi Bay Pty Ltd (in liq) (No 2) [2024] FCA 76 &amp; (No 3) [2024] FCA 869 \u00b7 EZY Accounting 123 Pty Ltd v FWO [2018] FCAFC 134.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#E6C98C;\">WHEN TO CONSULT PARK &amp; CO LAWYERS \u00b7 EMPLOYMENT<\/span>\n            <h3 class=\"col-cta-title\">Facing a 21-Day Dismissal Deadline, Corporate Audit, or &gt;$50,000 / s 550 Claim?<\/h3>\n            <p class=\"col-cta-desc\">For modest &lt;$50k wage shortfalls, self-calculating with our free Award Calculator and 208-formula Excel protects 100% of your payout. Once your matter involves a 21-day dismissal bar, sponsor defence, or &gt;$50k / s 550 director exposure, submit our online consultation form.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">Open Employment Consultation Form<\/a>\n              <a href=\"../../files/EN/PDF/02_Employment_Underpayment_Self_Calculation_and_Evidence_Manual_2026_EN.pdf\" download class=\"col-btn-ghost\">Download Manual 02 (Employment PDF)<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=en\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">Park &amp; Co Official Consultation Hub<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">Legal Disclaimer: This publication provides general legal information grounded in the Fair Work Act 2009 (Cth), superannuation/migration statutes and Australian court authorities current as at November 2026. It does not constitute legal advice or create a solicitor-client relationship. Strict 21-day FWC limits apply.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">More Curated Employment Law Columns<\/h3>\n        <a href=\"../../?lang=en&amp;tab=employment\" class=\"col-back-link num\">\u2190 Back to Employment Self-Help Hub<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../annualised-salary-setoff-audit-2026/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ANNUALISED SALARIES \u00b7 EMPLOYMENT 04<\/span><h4 class=\"col-sib-title\">Why Annualised Salary Set-Off Clauses Fail After Woolworths and Coles [2025] FCA 1092<\/h4><p class=\"col-sib-desc\">Why &#x27;all-in&#x27; salaries cannot average overtime across quiet weeks, how missing penalty records flip the onus onto employers, and when &gt;$50k recovery or B2B restructuring applies.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../sham-contracting-abn-s15aa/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ABN &amp; SHAM CONTRACTING \u00b7 EMPLOYMENT 06<\/span><h4 class=\"col-sib-title\">ABN Contractor or Employee? How Section 15AA Overturned High Court Contract Primacy<\/h4><p class=\"col-sib-desc\">Compares Dickerson [2025] FWC 2219, Crooks v Hyundai Rotem [2026] FWC 1104 and Barakat [2026] FWC 1941 across multi-year leave, penalty and super exposure.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../sponsored-worker-dismissal-482-186/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">VISA WORKER DISMISSALS \u00b7 EMPLOYMENT 07<\/span><h4 class=\"col-sib-title\">Dismissed on a Subclass 482 Visa: Managing the 21-Day FWC Bar, 180-Day Mobility Rule and Deed Traps<\/h4><p class=\"col-sib-desc\">How to structure FWC settlement deeds around new SID 482 nominations without breaking Subclass 186 TRT qualifying service or triggering visa cancellation.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../executive-dismissal-general-protections-restraints/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">EXECUTIVES &amp; RESTRAINTS \u00b7 EMPLOYMENT 08<\/span><h4 class=\"col-sib-title\">Executive Dismissals Above $190,100, General Protections Myths and Post-Employment Restraints<\/h4><p class=\"col-sib-desc\">Dissects Barclay subjective causation under s 361, executive notice/bonus claims, Supreme Court injunction risks, and upcoming federal non-compete reforms.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}}</script>
  <script>
    (function () {
      const payload = JSON.parse(document.getElementById('col-payload').textContent);
      const root = document.getElementById('col-root');
      let cleanupScroll = null;

      function getLang() {
        const q = new URLSearchParams(window.location.search).get('lang');
        return q === 'en' ? 'en' : 'ko';
      }

      function bindTocSpy() {
        if (cleanupScroll) cleanupScroll();
        const links = Array.from(root.querySelectorAll('.col-toc-link'));
        if (!links.length) return;
        const targets = links
          .map((a) => document.getElementById(a.getAttribute('href').slice(1)))
          .filter(Boolean);
        function onScroll() {
          let activeIdx = 0;
          const offset = window.scrollY + 130;
          for (let i = 0; i < targets.length; i++) {
            if (targets[i].offsetTop <= offset) activeIdx = i;
          }
          links.forEach((a, idx) => a.classList.toggle('active', idx === activeIdx));
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        cleanupScroll = () => window.removeEventListener('scroll', onScroll);
        onScroll();
      }

      function render(lg) {
        const data = payload[lg] || payload.ko;
        document.documentElement.lang = lg;
        document.title = data.doc_title;
        root.innerHTML = data.html;
        root.querySelectorAll('[data-set-lang]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const next = btn.getAttribute('data-set-lang');
            const url = new URL(window.location.href);
            url.searchParams.set('lang', next);
            window.history.replaceState({}, '', url.toString());
            render(next);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });
        bindTocSpy();
      }

      render(getLang());

      : ('표시 구간 ' + days.length + '일 합계 &middot; 페이지 조회 ' + fmt(sum[0]) + '회 &middot; 일별 순방문자 ' + fmt(sum[1]) + '명 (' + START + ' 집계 시작 &middot; 하루 브라우저당 1회)');
    return svg + '<div class="vc-legend"><span><i class="vc-k-bar"></i>' + (isEn ? 'Page views' : '페이지 조회') + '</span>' +
      '<span><i class="vc-k-line"></i>' + (isEn ? 'Daily visitors' : '일별 순방문자') + '</span></div>' +
      '<p class="vc-sum">' + summaryLine + '</p>';
  }

  function loadTodayReferrers(dayKey) {
    if (liveTodayViews === 0 && liveTodayVis === 0) {
      return Promise.resolve({});
    }
    var out = {};
    var remaining = [];
    REF_BUCKETS.forEach(function (b) {
      if (typeof liveRefHints[b.id] === 'number') {
        out[b.id] = liveRefHints[b.id];
      } else {
        remaining.push(b);
      }
    });
    var firstSlice = remaining.slice(0, 6);
    var secondSlice = remaining.slice(6);
    return Promise.all(firstSlice.map(function (b) {
      return call('get', 'ref-' + b.id + '-' + dayKey).catch(function () { return 0; }).then(function (v) { out[b.id] = v || 0; });
    })).then(function () {
      return secondSlice.length ? delay(260) : Promise.resolve();
    }).then(function () {
      return Promise.all(secondSlice.map(function (b) {
        return call('get', 'ref-' + b.id + '-' + dayKey).catch(function () { return 0; }).then(function (v) { out[b.id] = v || 0; });
      }));
    }).then(function () {
      return out;
    });
  }

  function renderReferrerBox(countsMap) {
    var isEn = uiLang() === 'en';
    var items = REF_BUCKETS.map(function (b) {
      return { id: b.id, label: isEn ? b.en : b.ko, count: countsMap[b.id] || 0 };
    }).filter(function (x) { return x.count > 0; }).sort(function (a, b) { return b.count - a.count; });
    var totalRef = items.reduce(function (acc, x) { return acc + x.count; }, 0);
    var head = '<div class="vc-ref-title"><span>' +
      (isEn ? ('Today&rsquo;s Referral Channels (' + today + ')') : ('오늘 유입 채널 분포 (' + today + ')')) +
      '</span><small>' + (isEn ? ('Tracked visitors: ' + fmt(totalRef)) : ('채널 집계 방문자: ' + fmt(totalRef) + '명')) + '</small></div>';
    if (!items.length) {
      return head + '<p class="vc-ref-note">' +
        (isEn
          ? 'Anonymous referral channel buckets (Naver, Cafe, KakaoTalk, Threads, Hub, Direct) are recorded once per browser per day as new visits arrive (zero personal or URL path data stored).'
          : '익명 유입 경로(검색·카페·카카오톡·스레드·허브 이동 등) 집계는 신규 방문부터 하루 브라우저당 1회씩 기록됩니다 (세부 URL·개인정보 미수집).') +
        '</p>';
    }
    var rowsHtml = items.map(function (item) {
      var pct = totalRef > 0 ? Math.round((item.count / totalRef) * 100) : 0;
      return '<div class="vc-ref-row">' +
        '<span class="vc-ref-name" title="' + item.label + '">' + item.label + '</span>' +
        '<div class="vc-ref-track"><div class="vc-ref-fill" style="width:' + Math.max(4, pct) + '%"></div></div>' +
        '<span class="vc-ref-val">' + fmt(item.count) + ' (' + pct + '%)</span>' +
        '</div>';
    }).join('');
    var note = isEn
      ? 'Privacy-safe coarse channel buckets only (1 per browser/day; zero IP, query string, or full referrer URL stored).'
      : '개인정보 보호형 채널 그룹 집계 (하루 브라우저당 1회 기준 &middot; 검색어·세부 URL·IP 미수집)';
    return head + '<div class="vc-ref-list">' + rowsHtml + '</div><p class="vc-ref-note">' + note + '</p>';
  }

  function loadHistoryRows(days) {
    var histCache = {};
    try { histCache = JSON.parse(localStorage.getItem(HIST_KEY) || '{}') || {}; } catch (e) {}
    var results = new Array(days.length);
    var pending = [];
    days.forEach(function (d, idx) {
      if (d < today && Array.isArray(histCache[d])) {
        results[idx] = histCache[d];
      } else if (d === today && typeof liveTodayViews === 'number' && typeof liveTodayVis === 'number') {
        results[idx] = [liveTodayViews, liveTodayVis];
      } else {
        pending.push({ d: d, idx: idx });
      }
    });

    var batchSize = pending.length > 7 ? 4 : 6;
    var pauseMs = pending.length > 7 ? 2900 : 180;
    var chain = Promise.resolve();
    for (var c = 0; c < pending.length; c += batchSize) {
      (function (slice, waitFirst) {
        chain = chain.then(function () {
          return (waitFirst ? delay(pauseMs) : Promise.resolve()).then(function () {
            return Promise.all(slice.map(function (item) {
              var k = item.d.replace(/-/g, '');
              var pViews = (item.d === today && typeof liveTodayViews === 'number')
                ? Promise.resolve(liveTodayViews)
                : call('get', 'day-' + k).catch(function () { return null; });
              var pVis = (item.d === today && typeof liveTodayVis === 'number')
                ? Promise.resolve(liveTodayVis)
                : call('get', 'vday-' + k).catch(function () { return null; });
              return Promise.all([pViews, pVis]).then(function (pair) {
                var v0 = pair[0] == null ? 0 : pair[0];
                var v1 = pair[1] == null ? 0 : pair[1];
                results[item.idx] = [v0, v1];
                if (item.d < today && pair[0] !== null && pair[1] !== null) {
                  histCache[item.d] = [v0, v1];
                }
              });
            }));
          });
        });
      })(pending.slice(c, c + batchSize), c > 0);
    }
    return chain.then(function () {
      try { localStorage.setItem(HIST_KEY, JSON.stringify(histCache)); } catch (e) {}
      return results.map(function (r) { return r || [0, 0]; });
    });
  }

  var cachedRefMap = null;

  function loadAndRenderModal(refreshRefs) {
    syncCounterLang();
    var isEn = uiLang() === 'en';
    var fullDays = lastDays(30);
    var days = activeRange === 7 ? lastDays(7) : fullDays;
    var body = modal.querySelector('.vc-body');
    var chartWaitMsg = isEn ? 'Loading daily statistics&hellip;' : '일별 통계를 불러오는 중입니다&hellip;';
    var refWaitMsg = isEn ? 'Loading today&rsquo;s referral channels&hellip;' : '오늘 유입 채널 집계를 불러오는 중입니다&hellip;';
    var existingRefHtml = (!refreshRefs && cachedRefMap) ? renderReferrerBox(cachedRefMap) : ('<div class="vc-ref-note">' + refWaitMsg + '</div>');

    /* Render toolbar, loading placeholder, referral box, and 1-click share bar IMMEDIATELY (0ms) */
    body.innerHTML = renderToolbar(isEn, fullDays.length) +
      '<div id="vc-chart-slot"><p class="vc-sum">' + chartWaitMsg + '</p></div>' +
      '<div id="vc-ref-box" class="vc-ref-box">' + existingRefHtml + '</div>' +
      renderShareBar(isEn);

    loadHistoryRows(days)
      .then(function (rows) {
        var slot = document.getElementById('vc-chart-slot');
        if (slot) slot.innerHTML = renderChartSvg(days, rows, uiLang() === 'en');
        if (!refreshRefs && cachedRefMap) return cachedRefMap;
        return delay(180).then(function () { return loadTodayReferrers(day); });
      })
      .then(function (refMap) {
        if (refMap) cachedRefMap = refMap;
        var refBox = document.getElementById('vc-ref-box');
        if (refBox && refMap) refBox.innerHTML = renderReferrerBox(refMap);
      })
      .catch(function () {
        var slot = document.getElementById('vc-chart-slot');
        if (slot && !slot.querySelector('svg')) {
          slot.textContent = uiLang() === 'en' ? 'Could not load the chart.' : '그래프를 불러오지 못했습니다.';
        }
      });
  }

  function open() {
    activeRange = 7;
    modal.classList.add('open');
    loadAndRenderModal(true);
  }
  box.setAttribute('role', 'button');
  box.setAttribute('tabindex', '0');
  box.addEventListener('click', open);
  box.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
})();
  </script>
</body>
</html>
