  <script id="col-payload" type="application/json">{"ko": {"doc_title": "\ud638\uc8fc \uc774\ud63c \uc808\ucc28\uc640 \uc7ac\uc0b0\ubd84\ud560\u00b7\uc591\uc721\uad8c, \ubcc0\ud638\uc0ac \uc120\uc784 \uc804 \ubc18\ub4dc\uc2dc \uc54c\uc544\uc57c \ud560 \ud604\uc2e4 \uae30\uc900 \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">\uc804\uccb4 \uac00\uc774\ub4dc \ud648<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=ko\">\ube44\uc790 \uc194\ub8e8\uc158 \uac00\uc774\ub4dc<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=ko\">\uace0\uc6a9\ubc95 \ub0b4\ube44\uac8c\uc774\ud130<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=ko\">\uc140\ud504 \ubc95\ub960 \ud574\uacb0 \u00b7 \ubcc0\ud638\uc0ac \uc0c1\ub2f4 \uc2dc\uc810 \uac00\uc774\ub4dc<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\">\ubc15\uc564\ucf54 \uc0c1\ub2f4 \uc2e0\uccad \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=ko&amp;tab=family\" class=\"col-back-btn\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \u00b7 \ud638\uc8fc \uac00\uc871\ubc95 \uc26c\uc6b4 \ud310\ub840 \uce7c\ub7fc<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn active\">\ud55c\uad6d\uc5b4<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">\uc628\ub77c\uc778 \uc0c1\ub2f4 \uc2e0\uccad \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">\uc2e4\uc804 \uac00\uc774\ub4dc \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 02<\/span>\n          <span class=\"col-verified-pill num\">1\ucc28 \ubc95\ub839\u00b7\ud310\ub840 \uac80\uc99d \uc644\ub8cc (2026.11)<\/span>\n          <span class=\"col-time-pill num\">\uc57d 8\ubd84 \uc18c\uc694<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">\ud638\uc8fc \uc774\ud63c \uc808\ucc28\uc640 \uc7ac\uc0b0\ubd84\ud560\u00b7\uc591\uc721\uad8c, \ubcc0\ud638\uc0ac \uc120\uc784 \uc804 \ubc18\ub4dc\uc2dc \uc54c\uc544\uc57c \ud560 \ud604\uc2e4 \uae30\uc900<\/h1>\n        <p class=\"col-subtitle\">\ubcf8\uc548 \uc18c\uc1a1 90.0% \ube44(\u975e)\ud310\uacb0 \uc885\uacb0 \ud1b5\uacc4, \ubb34\uacfc\uc2e4 \ud30c\ud0c4\uc8fc\uc758(s 48), \uc548\uc804 \ucd5c\uc6b0\uc120 \uc591\uc721\uad8c(s 60CC), \uadf8\ub9ac\uace0 \uc218\uc784\ub8cc \uc190\uc775\ubd84\uae30\uc810 \ubd84\uc11d<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">\ubc15\ucc3d\ubbfc \ub300\ud45c\ubcc0\ud638\uc0ac (Chang Min Park)<\/div>\n            <div class=\"col-author-role\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \ub300\ud45c\ubcc0\ud638\uc0ac \u00b7 \ud638\uc8fc \ud038\uc990\ub79c\ub4dc\uc8fc \ubcc0\ud638\uc0ac\ud68c \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col02_divorce_parenting_hero.jpg\" alt=\"\ud638\uc8fc \uc774\ud63c \uc808\ucc28\uc640 \uc7ac\uc0b0\ubd84\ud560\u00b7\uc591\uc721\uad8c, \ubcc0\ud638\uc0ac \uc120\uc784 \uc804 \ubc18\ub4dc\uc2dc \uc54c\uc544\uc57c \ud560 \ud604\uc2e4 \uae30\uc900\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">\uc5f0\ubc29\uc21c\ud68c\u00b7\uac00\uc871\ubc95\uc6d0(FCFCOA) \ubcf8\uc548 \uc18c\uc1a1\uc758 90.0%\ub294 \uc7ac\ud310\ubd80 \ud310\uacb0 \uc804 \ud569\uc758\ub85c \uc885\uacb0\ub429\ub2c8\ub2e4. \uc790\ub140 \uc548\uc804\uacfc \uc21c\uc790\uc0b0\uc744 \ubcf4\uc804\ud558\ub294 \ucd9c\ubc1c\uc810\uc740 \uc0ac\uc548 \uaddc\ubaa8\uc5d0 \ub9de\ub294 \uc808\ucc28 \uc120\ud0dd\uc785\ub2c8\ub2e4.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">90.0% \ud569\uc758\u00b7\ube44\ud310\uacb0<\/div><div class=\"col-stat-lbl\">FCFCOA \ubcf8\uc548 \uc18c\uc1a1 \uc911 \ud310\uc0ac \ud310\uacb0\ubb38 \uc5c6\uc774 \uc885\uacb0\ub418\ub294 \ube44\uc728 (2025\u201326 \uc5f0\ub840\ubcf4\uace0\uc11c)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">92% \uc704\ud5d8 \uc694\uc778<\/div><div class=\"col-stat-lbl\">\uc591\uc721 \uc18c\uc1a1 \uc911 \uac00\uc815\ud3ed\ub825(84%) \ub4f1 1\uac1c \uc774\uc0c1 \uc704\ud5d8 \uc694\uc778 \ub3d9\ubc18 \ube44\uc728 (s 60CC \uac1c\uc815 \ubc30\uacbd)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">$4,950 + $215<\/div><div class=\"col-stat-lbl\">\ubc15\uc564\ucf54 \ud655\uc815 \uc218\uc784\ub8cc \ud569\uc758\uba85\ub839(Consent Orders) \ub300 \ubcf8\uc548 \uc7ac\ud310 15.8\u201327\uac1c\uc6d4 \uc18c\uc694<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">\uc774 \uce7c\ub7fc\uc758 \ubaa9\ucc28<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#\uc22b\uc790\uac00-\uba3c\uc800-\ub9d0\ud574\uc8fc\ub294-\ud638\uc8fc-\uac00\uc871\ubc95\uc6d0\uc758-\uc9c4\uc9dc-\ud604\uc2e4\" class=\"col-toc-link lvl-2\">\uc22b\uc790\uac00 \uba3c\uc800 \ub9d0\ud574\uc8fc\ub294 \ud638\uc8fc \uac00\uc871\ubc95\uc6d0\uc758 \uc9c4\uc9dc \ud604\uc2e4<\/a><a href=\"#\uc774\ud63c-\uc2e0\uccads-48-2025\ub144-6\uc6d4-\uac1c\uc815\uc73c\ub85c-\ud6e8\uc52c-\uac00\ubcbc\uc6cc\uc9c4-\ub098\ud640\ub85c-\uc9c4\ud589-\uc601\uc5ed\" class=\"col-toc-link lvl-2\">\uc774\ud63c \uc2e0\uccad(s 48): 2025\ub144 6\uc6d4 \uac1c\uc815\uc73c\ub85c \ud6e8\uc52c \uac00\ubcbc\uc6cc\uc9c4 \ub098\ud640\ub85c \uc9c4\ud589 \uc601\uc5ed<\/a><a href=\"#\uc591\uc721\uad8cpart-vii-50\ub30050-\uacf5\ub3d9\uc591\uc721-\ucd94\uc815\uc758-\ud3d0\uc9c0\uc640-\uc548\uc804-\ucd5c\uc6b0\uc120-\uc6d0\uce59s-60cc\" class=\"col-toc-link lvl-2\">\uc591\uc721\uad8c(Part VII): 50\ub30050 \uacf5\ub3d9\uc591\uc721 \ucd94\uc815\uc758 \ud3d0\uc9c0\uc640 \uc548\uc804 \ucd5c\uc6b0\uc120 \uc6d0\uce59(s 60CC)<\/a><a href=\"#\ub0b4-\ub3c8\uc744-\uc9c0\ud0a4\ub294-\ubcc0\ud638\uc0ac-\uc120\uc784\uc758-\uc190\uc775\ubd84\uae30\uc810-\uc5b8\uc81c-\uc9c1\uc811-\ud558\uace0-\uc5b8\uc81c-\ub9e1\uaca8\uc57c-\ud560\uae4c\" class=\"col-toc-link lvl-2\">\ub0b4 \ub3c8\uc744 \uc9c0\ud0a4\ub294 \ubcc0\ud638\uc0ac \uc120\uc784\uc758 \uc190\uc775\ubd84\uae30\uc810: \uc5b8\uc81c \uc9c1\uc811 \ud558\uace0 \uc5b8\uc81c \ub9e1\uaca8\uc57c \ud560\uae4c<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">\uac00\uc871\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../?lang=ko&amp;tab=family\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">\ubc30\uc6b0\uc790\uc758 \uc678\ub3c4 \uba54\uc2dc\uc9c0\ub098 \ud3ed\uc5b8 \ub179\ucde8\ub85d\uc744 \uc218\uc2ed \uac74 \ubaa8\uc544 \uc624\uc2dc\ub294 \ubd84\ub4e4\uc744 \uc790\uc8fc \ubd2c\uc694. \ubc95\uc815\uc5d0\uc11c \uc0c1\ub300\ubc29\uc758 \uc798\ubabb\uc744 \ub0b1\ub0b1\uc774 \ubc1d\ud788\uace0 \uc704\uc790\ub8cc\ub97c \ubc1b\uc544\ub2ec\ub77c\uace0 \uc694\uccad\ud558\uc2dc\ub294\ub370\uc694. \ubc30\uc2e0\uac10\uc5d0 \ubc24\uc7a0\uc744 \uc124\uce58\uc2e0 \ub9c8\uc74c\uc740 \ub204\uad6c\ubcf4\ub2e4 \uae4a\uc774 \uacf5\uac10\ud574\uc694. \ub2e4\ub9cc \ud638\uc8fc \uac00\uc871\ubc95 \ubcc0\ud638\uc0ac\ub85c\uc11c \ucc98\uc74c \ub9c8\uc8fc \uc549\uc558\uc744 \ub54c \ub4dc\ub9ac\ub294 \uc870\uc5b8\uc740 \uaf64 \ucc28\uac11\uac8c \ub4e4\ub9ac\uc2e4 \uc218\ub3c4 \uc788\uc5b4\uc694. \ud638\uc8fc\ub294 \ubc18\uc138\uae30 \uc804\ubd80\ud130 \ucca0\uc800\ud55c \ubb34\uacfc\uc2e4 \ud30c\ud0c4\uc8fc\uc758(No-Fault Divorce, s 48)\ub97c \ucc44\ud0dd\ud558\uace0 \uc788\uac70\ub4e0\uc694. \ubc30\uc6b0\uc790\uc758 \ubd88\ub95c \uc790\uccb4\ub97c \uc774\uc720\ub85c \uc9d5\ubc8c\uc801 \uc704\uc790\ub8cc\ub97c \ubb3c\ub9ac\uac70\ub098 \uc7ac\uc0b0\uc744 \ubab0\uc218\ud558\uc9c0 \uc54a\uc544\uc694. \uc774 \uad6c\uc870\uc801\uc778 \ucc28\uc774\ub97c \ubaa8\ub978 \ucc44 \uac10\uc815\uc801\uc778 \uc720\ucc45 \uacf5\ubc29\uc5d0 \ub6f0\uc5b4\ub4e4\uba74 \uc815\uc791 \ub0b4 \ubaab\uc73c\ub85c \uc9c0\ucf1c\uc57c \ud560 \uc9d1 \uc9c0\ubd84\uacfc \uc544\uc774\ub4e4 \uad50\uc721\ube44\ub9cc \uc591\ucabd \ubcc0\ud638\uc0ac \ube44\uc6a9\uc73c\ub85c \ub179\uc544\ub0b4\ub9ac\uac8c \ub3fc\uc694. \ubcc0\ud638\uc0ac\ub97c \uc120\uc784\ud558\uae30 \uc804\uc5d0 \ud638\uc8fc \ubc95\uc6d0\uc774 \uc2e4\uc81c\ub85c \uc5b4\ub5bb\uac8c \uad74\ub7ec\uac00\ub294\uc9c0 \uacf5\uc2dd \ud1b5\uacc4\uc640 \ucd5c\uc2e0 \ud310\ub840 \uae30\uc900\ubd80\ud130 \ub0c9\uc815\ud558\uac8c \uc9da\uc5b4 \ubcf4\uc154\uc57c \ud558\ub294 \uc774\uc720\uc608\uc694.<\/p>\n<h2 id=\"\uc22b\uc790\uac00-\uba3c\uc800-\ub9d0\ud574\uc8fc\ub294-\ud638\uc8fc-\uac00\uc871\ubc95\uc6d0\uc758-\uc9c4\uc9dc-\ud604\uc2e4\" class=\"doc-h2\">\uc22b\uc790\uac00 \uba3c\uc800 \ub9d0\ud574\uc8fc\ub294 \ud638\uc8fc \uac00\uc871\ubc95\uc6d0\uc758 \uc9c4\uc9dc \ud604\uc2e4<\/h2>\n<p class=\"doc-p\">\ub9c9\uc5f0\ud788 \uc774\ud63c \uc18c\uc1a1\uc744 \ub5a0\uc62c\ub9ac\uba74 \uc591\uce21 \ubcc0\ud638\uc0ac\uac00 \ubc95\uc815\uc5d0\uc11c \ub05d\uc7a5 \ubcc0\ub860\uc744 \ubc8c\uc774\uace0 \ud310\uc0ac\uac00 \ub9dd\uce58\ub97c \ub450\ub4dc\ub9ac\ub294 \uc7a5\uba74\uc744 \uc0c1\uc0c1\ud558\uae30 \uc27d\uc8e0. \uc2e4\uc81c \ud1b5\uacc4\ub294 \uc815\ubc18\ub300 \uc774\uc57c\uae30\ub97c \ub4e4\ub824\uc918\uc694. \ud638\uc8fc \ud1b5\uacc4\uccad(ABS)\uc774 2026\ub144 7\uc6d4\uc5d0 2025\ub144 \ud63c\uc778\u00b7\uc774\ud63c \ud1b5\uacc4\ub97c \ubc1c\ud45c\ud588\ub294\ub370\uc694. \ud55c \ud574 \ub3d9\uc548 \ud655\uc815\ub41c \uc774\ud63c\uc740 \ucd1d 49,158\uac74(16\uc138 \uc774\uc0c1 \uc778\uad6c 1\ucc9c \uba85\ub2f9 \uc870\uc774\ud63c\uc728 2.2\uac74)\uc774\uc5c8\uc5b4\uc694. \uc774 \uac00\uc6b4\ub370 \uc808\ubc18\uc744 \ub118\ub294 50.4%(24,763\uac74)\uac00 \ubd80\ubd80\uac00 \ud568\uaed8 \uc11c\uba85\ud574 \uc811\uc218\ud55c \uacf5\ub3d9 \uc2e0\uccad(Joint Application)\uc774\uc5c8\uc8e0. \ud63c\uc778\uc5d0\uc11c \ubcc4\uac70\uae4c\uc9c0 \uc911\uc704 \uae30\uac04\uc740 9.4\ub144, \uc774\ud63c \ud655\uc815\uae4c\uc9c0\ub294 13.4\ub144\uc774\uc5d0\uc694. \uc804\uccb4 \uc774\ud63c\uc758 46.7%(22,941\uac74, \ubbf8\uc131\ub144 \uc544\ub3d9 40,748\uba85)\uc5d0 18\uc138 \ubbf8\ub9cc \uc790\ub140\uac00 \ud3ec\ud568\ub418\uc5b4 \uc788\uc5b4\uc694.<\/p>\n<p class=\"doc-p\">\uc5f0\ubc29\uc21c\ud68c\u00b7\uac00\uc871\ubc95\uc6d0(FCFCOA)\uc758 2025\u201326 \ud68c\uacc4\uc5f0\ub3c4 \uc5f0\ub840\ubcf4\uace0\uc11c\ub97c \ud3bc\uccd0 \ubcf4\uba74 \ub354 \uacb0\uc815\uc801\uc778 \uc22b\uc790\uac00 \ub098\uc640\uc694. \ud55c \ud574 \uc811\uc218\ub41c 1\uc2ec \uac00\uc871\ubc95 \uc0ac\uac74 105,836\uac74 \uc911 \ubc95\uc815 \ub2e4\ud23c \uc5c6\uc774 \ud569\uc758 \ub0b4\uc6a9\uc744 \ubc95\uc6d0 \uba85\ub839\uc73c\ub85c \ud655\uc815\ubc1b\ub294 \ud569\uc758\uba85\ub839(Consent Orders) \uc2e0\uccad\uc774 17,144\uac74\uc5d0 \ub2ec\ud558\ub294\ub370\uc694. \ub300\ubd80\ubd84 \uc57d 4\uc8fc \ub0a8\uc9d3\ud55c \uc11c\uba74 \uc2ec\uc0ac\ub85c \uc2e0\uc18d\ud558\uac8c \ub9c8\ubb34\ub9ac\ub3fc\uc694. \uc2ec\uc9c0\uc5b4 \uac08\ub4f1\uc774 \uae4a\uc5b4 \uc815\uc2dd \ubcf8\uc548 \uc18c\uc1a1(Division 2 Final Orders, \uc5f0\uac04 15,311\uac74)\uc73c\ub85c \uc9c1\ud589\ud55c \uc0ac\uac74\ub4e4\uc870\ucc28 81.8%\ub294 \ubcf8\uc548 \uc7ac\ud310\uc774 \uc5f4\ub9ac\uae30 \uc804\uc5d0 \ud569\uc758\ub85c \ub05d\ub098\uc694. \ub610 8.3%\ub294 \uc7ac\ud310 \ub3c4\uc911\uc5d0 \ud569\uc758\ub85c \ub05d\ub098 \uacb0\uad6d \uc804\uccb4 \ubcf8\uc548 \uc18c\uc1a1\uc758 90.0%\uac00 \ud310\uc0ac\uc758 \ucd5c\uc885 \ud310\uacb0\ubb38 \uc5c6\uc774 \uc885\uacb0\ub3fc\uc694. \ub05d\uae4c\uc9c0 \uac00\uc11c \ud310\uacb0\uc744 \ubc1b\ub294 \ub098\uba38\uc9c0 10.0% \uc0ac\uac74\uc758 \ub2f9\uc0ac\uc790\ub4e4\uc740 \uc77c\ubc18 \uc0ac\uac74 \uae30\uc900 \uc911\uc704 15.8\uac1c\uc6d4, \uc911\ub300\u00b7\uace0\uc561 \uc0ac\uac74\uc744 \ub2e4\ub8e8\ub294 Division 1\uc5d0\uc11c\ub294 \ubb34\ub824 27\uac1c\uc6d4\uc774\ub77c\ub294 \uae34 \uc138\uc6d4\uacfc \ub9c9\ub300\ud55c \uc18c\uc1a1 \ube44\uc6a9\uc744 \uac10\ub2f9\ud574\uc57c \ud574\uc694. \ud638\uc8fc\uac00\uc871\uc5f0\uad6c\uc18c(AIFS) \uc870\uc0ac\uc5d0\uc11c\ub3c4 \ubcc4\uac70 \ubd80\ubaa8\uc758 97%\uac00 \ubc95\uc6d0 \uc7ac\ud310\uc744 \uc8fc\ub41c \ud574\uacb0 \ud1b5\ub85c\ub85c \uc4f0\uc9c0 \uc54a\ub294\ub2e4\uace0 \ub2f5\ud588\uc5b4\uc694. \uadf8\ub9cc\ud07c \ud638\uc8fc \uac00\uc871\ubc95\uc758 \ubcf8\ub958\ub294 \uc7ac\ud310\uc774 \uc544\ub2c8\ub77c \ubc95\uc801 \uae30\uc900\uc120 \uc704\uc5d0\uc11c \uce58\ubc00\ud558\uac8c \uc124\uacc4\ub41c \ud569\uc758\uc608\uc694.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 392\" width=\"100%\" role=\"img\" aria-label=\"\ud638\uc8fc \uc5f0\ubc29\uc21c\ud68c\u00b7\uac00\uc871\ubc95\uc6d0(FCFCOA) \ubcf8\uc548 \uc0ac\uac74 \uc885\uacb0 \ubc29\uc2dd\uacfc \uc591\uc721 \uc18c\uc1a1 \uc704\ud5d8 \uc694\uc778 \uc2e4\ud0dc\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"391\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"78\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"79\" x2=\"879\" y2=\"79\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"28\" y=\"29\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.06em\">\ubc95\uc6d0 \uacf5\uc2dd \ub370\uc774\ud130 \u00b7 \ubcf8\uc548 \uc18c\uc1a1\uc758 90.0%\ub294 \ud310\uacb0\ubb38 \uc5c6\uc774 \ud569\uc758\ub85c \ub05d\ub0a9\ub2c8\ub2e4<\/text>\n  <text x=\"28\" y=\"52\" font-size=\"16.8\" font-weight=\"800\" fill=\"#1F242B\">\ud638\uc8fc \uc5f0\ubc29\uc21c\ud68c\u00b7\uac00\uc871\ubc95\uc6d0(FCFCOA) \ubcf8\uc548 \uc0ac\uac74 \uc885\uacb0 \ubc29\uc2dd\uacfc \uc591\uc721 \uc18c\uc1a1 \uc704\ud5d8 \uc694\uc778 \uc2e4\ud0dc<\/text>\n  <text x=\"28\" y=\"70\" font-size=\"11.3\" fill=\"#525B67\">\ucd9c\ucc98: FCFCOA 2025\u201326 \uc5f0\ub840\ubcf4\uace0\uc11c (1\uc2ec \ucd1d 105,836\uac74 \uc811\uc218) \u00b7 \ud638\uc8fc \ud1b5\uacc4\uccad(ABS) 2025 \ud63c\uc778\u00b7\uc774\ud63c \ud1b5\uacc4 (\uc774\ud63c 49,158\uac74 \uc911 \uacf5\ub3d9\uc2e0\uccad 50.4%)<\/text>\n  <rect x=\"22\" y=\"96\" width=\"408\" height=\"278\" rx=\"10\" fill=\"#FAF9F6\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"38\" y=\"122\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1F242B\">\u2460 \ubcf8\uc548 \uc18c\uc1a1(Div 2 Final Orders) \uc885\uacb0 \ube44\uc728<\/text>\n  <rect x=\"38\" y=\"138\" width=\"307\" height=\"34\" rx=\"5\" fill=\"#1F4E5F\"/>\n  <rect x=\"345\" y=\"138\" width=\"31\" height=\"34\" fill=\"#9A6700\"/>\n  <rect x=\"376\" y=\"138\" width=\"38\" height=\"34\" rx=\"5\" fill=\"#7A1F2B\"/>\n  <text x=\"191\" y=\"160\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">81.8%<\/text>\n  <rect x=\"38\" y=\"192\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#1F4E5F\"/>\n  <text x=\"58\" y=\"203\" font-size=\"12.2\" font-weight=\"700\" fill=\"#1F242B\">\uc7ac\ud310 \uc804 \ud569\uc758\u00b7\ucde8\ud558 \uc885\uacb0: 81.8%<\/text>\n  <text x=\"58\" y=\"220\" font-size=\"11.2\" fill=\"#525B67\">\uc870\uc815\u00b7\ud611\uc0c1 \ub2e8\uacc4\uc5d0\uc11c \ub9c8\ubb34\ub9ac<\/text>\n  <rect x=\"38\" y=\"240\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#9A6700\"/>\n  <text x=\"58\" y=\"251\" font-size=\"12.2\" font-weight=\"700\" fill=\"#1F242B\">\uc7ac\ud310 \uc9c4\ud589 \uc911 \ubc95\uc815 \ud569\uc758: 8.3%<\/text>\n  <text x=\"58\" y=\"268\" font-size=\"11.2\" fill=\"#525B67\">\ub3c4\ud569 90.0%\uac00 \ud310\uacb0\ubb38 \uc5c6\uc774 \uc885\uacb0!<\/text>\n  <rect x=\"38\" y=\"288\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#7A1F2B\"/>\n  <text x=\"58\" y=\"299\" font-size=\"12.2\" font-weight=\"700\" fill=\"#1F242B\">\ub05d\uae4c\uc9c0 \ud310\uc0ac \ud310\uacb0 \uc120\uace0: 10.0%<\/text>\n  <text x=\"58\" y=\"316\" font-size=\"11.2\" fill=\"#525B67\">\uc911\uc704 15.8\uac1c\uc6d4 \uc18c\uc694 (Div 1\uc740 27\uac1c\uc6d4)<\/text>\n  <rect x=\"36\" y=\"334\" width=\"380\" height=\"28\" rx=\"6\" fill=\"#EDF7F2\"/>\n  <text x=\"48\" y=\"352\" font-size=\"11.3\" font-weight=\"700\" fill=\"#1D6B48\">\ube44\uad50 \u00b7 \ud569\uc758\uba85\ub839(Consent Orders): \uc5f0\uac04 17,423\uac74 \uc11c\uba74 \uc885\uacb0 (\ud3c9\uade0 \uc57d 4\uc8fc)<\/text>\n  <rect x=\"448\" y=\"96\" width=\"410\" height=\"278\" rx=\"10\" fill=\"#FAF9F6\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"464\" y=\"122\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">\u2461 \uc591\uc721 \ubcf8\uc548 \uc0ac\uac74 \uc704\ud5d8 \uc694\uc778 \ube44\uc728 (s 60CC \uc548\uc804 \ucd5c\uc6b0\uc120 \ubc30\uacbd)<\/text>\n  <text x=\"464\" y=\"158\" font-size=\"11.8\" font-weight=\"600\" fill=\"#1F242B\">\ucd5c\uc18c 1\uac1c \uc774\uc0c1 \uc704\ud5d8 \uc694\uc778 \uc874\uc7ac<\/text>\n  <rect x=\"646\" y=\"144\" width=\"185\" height=\"18\" rx=\"4\" fill=\"#EAE6DF\"/>\n  <rect x=\"646\" y=\"144\" width=\"170\" height=\"18\" rx=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"838\" y=\"158\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#7A1F2B\">92%<\/text>\n  <text x=\"464\" y=\"198\" font-size=\"11.8\" font-weight=\"600\" fill=\"#1F242B\">\ub2f9\uc0ac\uc790 \uac00\uc815\ud3ed\ub825 \ud53c\ud574 \uc8fc\uc7a5<\/text>\n  <rect x=\"646\" y=\"184\" width=\"185\" height=\"18\" rx=\"4\" fill=\"#EAE6DF\"/>\n  <rect x=\"646\" y=\"184\" width=\"155\" height=\"18\" rx=\"4\" fill=\"#A63A48\"/>\n  <text x=\"838\" y=\"198\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#A63A48\">84%<\/text>\n  <text x=\"464\" y=\"238\" font-size=\"11.8\" font-weight=\"600\" fill=\"#1F242B\">\uc544\ub3d9\uc758 \uac00\uc815\ud3ed\ub825 \ub178\ucd9c\u00b7\ud53c\ud574<\/text>\n  <rect x=\"646\" y=\"224\" width=\"185\" height=\"18\" rx=\"4\" fill=\"#EAE6DF\"/>\n  <rect x=\"646\" y=\"224\" width=\"148\" height=\"18\" rx=\"4\" fill=\"#C04A5A\"/>\n  <text x=\"838\" y=\"238\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#C04A5A\">80%<\/text>\n  <text x=\"464\" y=\"278\" font-size=\"11.8\" font-weight=\"600\" fill=\"#1F242B\">\ub2f9\uc0ac\uc790 \uc815\uc2e0\uac74\uac15 \uc704\ud5d8 \uc694\uc778<\/text>\n  <rect x=\"646\" y=\"264\" width=\"185\" height=\"18\" rx=\"4\" fill=\"#EAE6DF\"/>\n  <rect x=\"646\" y=\"264\" width=\"112\" height=\"18\" rx=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"838\" y=\"278\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F4E5F\">61%<\/text>\n  <text x=\"464\" y=\"318\" font-size=\"11.8\" font-weight=\"600\" fill=\"#1F242B\">\uc57d\ubb3c\u00b7\uc54c\ucf54\uc62c \ub0a8\uc6a9 \uc704\ud5d8 \uc694\uc778<\/text>\n  <rect x=\"646\" y=\"304\" width=\"185\" height=\"18\" rx=\"4\" fill=\"#EAE6DF\"/>\n  <rect x=\"646\" y=\"304\" width=\"99\" height=\"18\" rx=\"4\" fill=\"#3B6E82\"/>\n  <text x=\"838\" y=\"318\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#3B6E82\">54%<\/text>\n  <text x=\"464\" y=\"355\" font-size=\"10.8\" font-weight=\"700\" fill=\"#7A1F2B\">\u2192 2024.05.06 \uade0\ub4f1 \uacf5\ub3d9\uc591\uc721 \ucd94\uc815(\uad6c s 61DA) \uc644\uc804 \ud3d0\uc9c0 \u00b7 \uc548\uc804 \ucd5c\uc6b0\uc120(s 60CC(2)(a))<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 1: \ud638\uc8fc \uc5f0\ubc29\uc21c\ud68c\u00b7\uac00\uc871\ubc95\uc6d0(FCFCOA) \ubcf8\uc548 \uc0ac\uac74 \uc885\uacb0 \ubc29\uc2dd\uacfc \uc591\uc721 \uc18c\uc1a1 \uc704\ud5d8 \uc694\uc778 \uc2e4\ud0dc<\/figcaption><\/figure>\n<h2 id=\"\uc774\ud63c-\uc2e0\uccads-48-2025\ub144-6\uc6d4-\uac1c\uc815\uc73c\ub85c-\ud6e8\uc52c-\uac00\ubcbc\uc6cc\uc9c4-\ub098\ud640\ub85c-\uc9c4\ud589-\uc601\uc5ed\" class=\"doc-h2\">\uc774\ud63c \uc2e0\uccad(s 48): 2025\ub144 6\uc6d4 \uac1c\uc815\uc73c\ub85c \ud6e8\uc52c \uac00\ubcbc\uc6cc\uc9c4 \ub098\ud640\ub85c \uc9c4\ud589 \uc601\uc5ed<\/h2>\n<p class=\"doc-p\">\ud638\uc8fc\uc5d0\uc11c \ubc95\ub960\ud63c \ud574\uc18c(Divorce), \uc7ac\uc0b0\ubd84\ud560(Property), \uc591\uc721(Parenting)\uc740 \ud558\ub098\uc758 \ubb36\uc74c \uc18c\uc1a1\uc774 \uc544\ub2c8\ub77c \uac01\uae30 \ubcc4\uac1c\uc758 \uc808\ucc28\ub85c \ub3cc\uc544\uac00\uc694. \uadf8\uc911 \ubc95\uc801 \ud63c\uc778 \uad00\uacc4\ub9cc \uc815\ub9ac\ud558\ub294 \uc774\ud63c \uc2e0\uccad\uc740 \ud63c\uc778\uc774 \ud68c\ubcf5 \ubd88\uac00\ub2a5\ud558\uac8c \ud30c\ud0c4 \ub0ac\ub2e4\ub294 \uc99d\uac70\ub85c \ucd5c\uc18c 12\uac1c\uc6d4 \uc774\uc0c1\uc758 \ubcc4\uac70(s 48) \uc0ac\uc2e4\ub9cc \uc785\uc99d\ud558\uba74 \ucda9\ubd84\ud574\uc694. \uacbd\uc81c\uc801 \uc0ac\uc815\uc774\ub098 \uc721\uc544 \ub54c\ubb38\uc5d0 \uac19\uc740 \uc9d1\uc5d0\uc11c \ubc29\uacfc \uc0b4\ub9bc\ub9cc \ubd84\ub9ac\ud574 \uc9c0\ub0b8 \ud55c \uc9c0\ubd95 \uc544\ub798 \ubcc4\uac70(separation under one roof)\ub3c4 \uc81c3\uc790 \uc9c4\uc220\uc11c\ub85c \uc18c\uba85\ud558\uba74 \uc778\uc815\ub418\uc8e0. \uc5f0\ubc29 \ubc95\uc6d0 \ud3ec\ud138(<a href=\"https://www.comcourts.gov.au\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">comcourts.gov.au<\/a>)\uc744 \ud1b5\ud574 \ubcc0\ud638\uc0ac \uc5c6\uc774 \uc9c1\uc811 \uc628\ub77c\uc778\uc73c\ub85c \uc811\uc218\ud560 \uc218 \uc788\uc5b4\uc694. 2026\u201327 \ud68c\uacc4\uc5f0\ub3c4 \uae30\uc900 \ubc95\uc6d0 \uc778\uc9c0\ub300\ub294 \uc77c\ubc18 $1,170, \ud5ec\uc2a4\ucf00\uc5b4\uce74\ub4dc \ub4f1 \uac10\uba74 \ub300\uc0c1\uc790\ub294 $390(\ub2e8, \uacf5\ub3d9 \uc2e0\uccad\uc740 \ubd80\ubd80 \ub450 \uc0ac\ub78c \ubaa8\ub450 \uac10\uba74 \uce74\ub4dc\ub97c \uc18c\uc9c0\ud574\uc57c \uc801\uc6a9)\uc774\uc5d0\uc694.<\/p>\n<p class=\"doc-p\">\ud2b9\ud788 2025\ub144 6\uc6d4 10\uc77c \uac1c\uc815\ubc95 \uc2dc\ud589\uc73c\ub85c \uc2a4\uc2a4\ub85c \uc774\ud63c\uc744 \uc2e0\uccad\ud558\ub824\ub294 \ubd84\ub4e4\uc758 \ubd80\ub2f4\uc774 \ud55c\uacb0 \uc904\uc5c8\uc5b4\uc694. \uacfc\uac70\uc5d0\ub294 \ud63c\uc778 \uae30\uac04\uc774 2\ub144 \ubbf8\ub9cc\uc778 \ubd80\ubd80\uac00 \uc774\ud63c\ud558\ub824\uba74 \uc758\ubb34\uc801\uc73c\ub85c \uc0c1\ub2f4\uc0ac\uc640 \uba74\ub2f4\ud558\uace0 \uc0c1\ub2f4 \ud655\uc778\uc11c\ub97c \uc81c\ucd9c\ud574\uc57c \ud588\ub294\ub370\uc694. \uc774 \uaddc\uc815(\uad6c s 44(1B))\uc774 \uc774\uc81c \uc644\uc804\ud788 \ud3d0\uc9c0\ub410\uac70\ub4e0\uc694. \ub610\ud55c 18\uc138 \ubbf8\ub9cc \uc790\ub140\uac00 \uc788\ub294 \ub2e8\ub3c5 \uc774\ud63c \uc2e0\uccad \uc0ac\uac74\ub3c4 \uc808\ucc28(s 98A)\uac00 \uac04\uc18c\ud654\ub410\uc5b4\uc694. \uc0c1\ub300\ubc29\uc774 \uc774\uc758\ub97c \uc81c\uae30\ud558\uc9c0 \uc54a\uc73c\uba74 \uc608\uc804\ucc98\ub7fc \ubc95\uc815\uc5d0 \ucd9c\uc11d\ud560 \ud544\uc694 \uc5c6\uc774 \uc11c\uba74 \uc2ec\uc0ac\ub9cc\uc73c\ub85c \uc774\ud63c\uc774 \ud655\uc815\ub418\uc8e0. \ub2e4\ub9cc \ub2e8\ub3c5 \uc2e0\uccad \uc2dc \uc2e0\uccad\uc778 \ubcf8\uc778\uc774 \ubc30\uc6b0\uc790\uc5d0\uac8c \uc9c1\uc811 \uc774\ud63c \uc11c\ub958\ub97c \uac74\ub124\uc8fc\ub294 \uc1a1\ub2ec\uc740 \ubc95\uc801\uc73c\ub85c \ubb34\ud6a8\uc608\uc694. \ubc18\ub4dc\uc2dc \ub9cc 18\uc138 \uc774\uc0c1\uc758 \uc81c3\uc790\ub098 \uc804\ubb38 \uc1a1\ub2ec\uc778\uc744 \ud1b5\ud574 \uc804\ub2ec\ud558\uace0 \uc1a1\ub2ec \ud655\uc778\uc11c\ub97c \ubc1b\uc544\uc57c \ud55c\ub2e4\ub294 \uae30\ubcf8 \uc218\uce59\ub9cc \uaf2d \uc9c0\ud0a4\uc2dc\uba74 \ub3fc\uc694.<\/p>\n<h2 id=\"\uc591\uc721\uad8cpart-vii-50\ub30050-\uacf5\ub3d9\uc591\uc721-\ucd94\uc815\uc758-\ud3d0\uc9c0\uc640-\uc548\uc804-\ucd5c\uc6b0\uc120-\uc6d0\uce59s-60cc\" class=\"doc-h2\">\uc591\uc721\uad8c(Part VII): 50\ub30050 \uacf5\ub3d9\uc591\uc721 \ucd94\uc815\uc758 \ud3d0\uc9c0\uc640 \uc548\uc804 \ucd5c\uc6b0\uc120 \uc6d0\uce59(s 60CC)<\/h2>\n<p class=\"doc-p\">\uc0c1\ub2f4 \uc911 \uc5ec\uc804\ud788 \ub9ce\uc740 \ubd80\ubaa8\ub2d8\uc774 \ud638\uc8fc\ub294 \uc774\ud63c\ud558\uba74 \ubb34\uc870\uac74 \uc544\uc774 \uc2dc\uac04\uc744 50\ub30050 \ubc18\ubc18\uc529 \ub098\ub204\ub294 \ub098\ub77c \uc544\ub2c8\ub0d0\uace0 \ubb3c\uc73c\uc138\uc694. \ub2e8\uc5b8\ucee8\ub300 \uc9c0\uae08\uc740 \uadf8\ub807\uc9c0 \uc54a\uc544\uc694. 2024\ub144 5\uc6d4 6\uc77c \uac1c\uc815 \uac00\uc871\ubc95(Family Law Amendment Act 2023)\uc774 \ubc1c\ud6a8\ub410\uae30 \ub54c\ubb38\uc778\ub370\uc694. \ubd80\ubaa8\uc758 \uade0\ub4f1 \uacf5\ub3d9 \uce5c\uad8c \ucd94\uc815 \uaddc\uc815(\uad6c s 61DA)\uacfc \uade0\ub4f1 \uc591\uc721\uc2dc\uac04 \uc758\ubb34 \uac80\ud1a0 \uc870\ud56d(\uad6c s 65DAA)\uc744 \ubc95\uc804\uc5d0\uc11c \uc644\uc804\ud788 \uc0ad\uc81c\ud588\uc5b4\uc694. \uc65c \ubc95\uc774 \uc774\ub807\uac8c \ubc14\ub00c\uc5c8\uc744\uae4c\uc694? FCFCOA 2025\u201326 \uc5f0\ub840\ubcf4\uace0\uc11c\uc758 \uc704\ud5d8 \uc694\uc778 \ud1b5\uacc4\ub97c \ubcf4\uba74 \uc591\uc721 \ubcf8\uc548 \uc18c\uc1a1\uc758 84%\uc5d0\uc11c \ub2f9\uc0ac\uc790 \uac00\uc815\ud3ed\ub825 \ud53c\ud574\uac00, 80%\uc5d0\uc11c \uc544\ub3d9\uc758 \uac00\uc815\ud3ed\ub825 \ub178\ucd9c\uc774, 61%\uc5d0\uc11c \uc815\uc2e0\uac74\uac15 \uc704\ud5d8\uc774, 54%\uc5d0\uc11c \uc57d\ubb3c\u00b7\uc54c\ucf54\uc62c \ub0a8\uc6a9\uc774 \uc81c\uae30\ub410\uc5b4\uc694. \uc804\uccb4 \uc0ac\uac74\uc758 92%\uac00 \ucd5c\uc18c 1\uac1c \uc774\uc0c1\uc758 \uc704\ud5d8 \uc694\uc778(81%\ub294 3\uac1c \uc774\uc0c1 \ubcf5\ud569 \uc704\ud5d8)\uc744 \uc548\uace0 \uc788\uc5c8\uac70\ub4e0\uc694. \uae30\uacc4\uc801\uc778 \ubc18\ubc18 \uc591\uc721 \ucd94\uc815\uc774 \uc624\ud788\ub824 \uc544\uc774\uc640 \ud53c\ud574 \ubd80\ubaa8\ub97c \uc704\ud5d8\uc5d0 \ubb36\uc5b4 \ub454\ub2e4\ub294 \ubc18\uc131\uc774 \ubc95 \uac1c\uc815\uc744 \uc774\ub048 \uc148\uc774\uc5d0\uc694.<\/p>\n<p class=\"doc-p\">\ud604\ud589 s 60CC(2)\ub294 \uc544\ub3d9\uc758 \ucd5c\uc120\uc758 \uc774\uc775(s 60CA)\uc744 \ud310\ub2e8\ud558\ub294 6\uac00\uc9c0 \ud575\uc2ec \uae30\uc900 \uac00\uc6b4\ub370 \uc544\ub3d9 \ubc0f \ub3cc\ubd04 \uc81c\uacf5\uc790\ub97c \uac00\uc815\ud3ed\ub825\u00b7\ud559\ub300\u00b7\ubc29\uc784\u00b7\uc704\ud574\ub85c\ubd80\ud130 \uc9c0\ud0a4\ub294 \uc548\uc804(s 60CC(2)(a))\uc744 \uac00\uc7a5 \uc55e\uc790\ub9ac\uc5d0 \ub450\uc5c8\uc5b4\uc694. \uc591\ucabd \ubd80\ubaa8\uc640 \uc758\ubbf8 \uc788\ub294 \uad00\uacc4\ub97c \uc720\uc9c0\ud558\ub294 \uc774\uc775(s 60CC(2)(e)) \uc5ed\uc2dc \uc548\uc804\uc774 \ubcf4\uc7a5\ub418\ub294 \uacbd\uc6b0\uc5d0 \ud55c\ud558\uc5ec(where it is safe to do so) \uace0\ub824\ud558\ub3c4\ub85d \ubabb \ubc15\uc558\uc8e0. \ucd5c\uadfc \ud310\uacb0\uc778 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC2F/2025/36.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Gallagher &amp; Day [2025] FedCFamC2F 36<\/em><\/a> ([204])\uc774 \uc774 \uae30\uc870\ub97c \uc0dd\uc0dd\ud558\uac8c \ubcf4\uc5ec\uc918\uc694. \uac15\uc555\uc801 \ud1b5\uc81c \ud3ed\ub825\uc744 \uc800\uc9c0\ub974\uace0\ub3c4 \ubb38\uc81c\uc758\uc2dd\uc774 \uc5c6\ub294 \ubd80\uce5c\uc774 \uac10\ub3c5 \uba74\uc811\uad50\uc12d\uc774\ub77c\ub3c4 \ud5c8\uc6a9\ud574 \ub2ec\ub77c\uace0 \uc694\uad6c\ud588\ub294\ub370\uc694. \ubc95\uc6d0\uc740 \uac00\ud574 \ubd80\ubaa8\uac00 \uc5b8\uc820\uac00 \ubcc0\ud558\uae30\ub97c \ub9c9\uc5f0\ud788 \uae30\ub300\ud558\uba70 \ubd80\ub140 \uad00\uacc4\uc758 \ub048\ub9cc \uc774\uc5b4\uc8fc\ub294 \uc5b4\uc815\uca61\ud55c \uc808\ucda9\uc548(halfway house)\uc744 \ub9cc\ub4e4\uc5b4 \uc8fc\ub294 \uac83\uc740 \ubc95\uc6d0\uc758 \uc5ed\ud560\uc774 \uc544\ub2c8\ub77c\uace0 \ubc1d\ud614\uc5b4\uc694. \uc774\uc5d0 \ubaa8\uce5c \ub2e8\ub3c5 \uc758\uc0ac\uacb0\uc815\uad8c\uacfc \uba74\uc811\u00b7\uc5f0\ub77d \uc804\uba74 \uae08\uc9c0(no time) \uba85\ub839\uc744 \ub0b4\ub838\uc8e0.<\/p>\n<p class=\"doc-p\">\ud55c\ud3b8 \ud0c0 \uc8fc(interstate)\ub85c \uc544\uc774\uc640 \ud568\uaed8 \uc774\uc0ac\ud558\ub824\ub294 \ubd80\ubaa8\uc5d0\uac8c \uc801\uc6a9\ub418\ub294 \uae30\uc900\ub3c4 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC2F/2025/37.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Picard &amp; Picard (No 2) [2025] FedCFamC2F 37<\/em><\/a> ([52], [192]\u2013[193]) \ud310\uacb0\uc5d0\uc11c \uba85\ud655\ud788 \uc7ac\ud655\uc778\ub410\uc5b4\uc694. \ubc95\uc6d0\uc740 \ud038\uc990\ub79c\ub4dc\ub97c \ub5a0\ub098 \ud37c\uc2a4\ub85c \uc774\uc8fc\ud558\ub824\ub294 \ubaa8\uce5c\uc5d0\uac8c \uad73\uc774 \ubd88\uac00\ud53c\ud55c \uc0ac\uc720(compelling reasons)\uae4c\uc9c0 \uc99d\uba85\ud560 \uc758\ubb34\ub294 \uc5c6\ub2e4\uace0 \ubd24\uc5b4\uc694. \ubaa8\uce5c\uc758 \uadf9\uc2ec\ud55c \uc2a4\ud2b8\ub808\uc2a4\uc640 \ubd88\uc548\uc744 \ub35c\uc5b4\uc8fc\ub294 \uac83\uc774 \uace7 \uc790\ub140\ub4e4\uc5d0\uac8c \uae0d\uc815\uc801\uc778 \ud30c\uae09 \ud6a8\uacfc\ub85c \ub3cc\uc544\uc628\ub2e4\uace0 \ud310\ub2e8\ud588\uac70\ub4e0\uc694. \ubc18\ub300\ub85c \uc774\ubbf8 \ud655\uc815\ub41c \ucd5c\uc885 \uc591\uc721 \uba85\ub839\uc744 \ub098\uc911\uc5d0 \ub2e4\uc2dc \ub4a4\uc9d1\uc73c\ub824\ub294 \uacbd\uc6b0\uc5d0\ub294 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2024/246.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Radecki &amp; Radecki [2024] FedCFamC1A 246<\/em><\/a> ([79]) \uc804\uc6d0\uc7ac\ud310\ubd80 \ud310\uacb0\uc5d0 \ub530\ub77c 2024\ub144 \ubc95 \uac1c\uc815 \uc0ac\uc2e4 \uc790\uccb4\ub9cc\uc73c\ub85c\ub294 \ubd80\uc871\ud558\uace0 \uc885\uc804 \uba85\ub839 \uc774\ud6c4 \uc911\ub300\ud55c \uc0ac\uc815 \ubcc0\uacbd(s 65DAAA)\uc774 \uc2e4\uc81c\ub85c \uc788\uc5c8\uc74c\uc744 \uba3c\uc800 \uc785\uc99d\ud574\uc57c \ud574\uc694. \uc544\uc6b8\ub7ec \uc591\uc721 \uc18c\uc1a1\uc744 \ub0b4\uae30 \uc804\uc5d0\ub294 \uc815\ubd80 \uc9c0\uc6d0 \uac00\uc871\uad00\uacc4\uc13c\ud130(1800 050 321) \ub4f1\uc744 \ud1b5\ud55c \uac00\uc871\ubd84\uc7c1\uc870\uc815 \ud655\uc778\uc11c(s 60I(7)\u2013(8)) \ucca8\ubd80\uac00 \ud544\uc218\uc608\uc694. 2025\ub144 6\uc6d4 \uac1c\uc815\uc73c\ub85c \ud655\uc778\uc11c\ub098 \ubc95\uc815 \uba74\uc81c \uc0ac\uc720(s 60I(9), \uac00\uc815\ud3ed\ub825\u00b7\uc544\ub3d9\ud559\ub300\u00b7\uae34\uae09 \uc0ac\uc548) \uc5c6\uc774\ub294 \uc18c\uc7a5 \uc811\uc218 \uc790\uccb4\uac00 \ubc18\ub824\ub418\ub2c8 \uc21c\uc11c\ub97c \uaf2d \ucc59\uae30\uc154\uc57c \ud574\uc694.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 416\" width=\"100%\" role=\"img\" aria-label=\"\uc0ac\uac74 \uc720\ud615\ubcc4 \uc608\uc0c1 \ube44\uc6a9 \uc18c\ubaa8(Fee Burn) \ub300 \uc21c\uc790\uc0b0 \ubcf4\uc874 \ud2b8\ub799 \ube44\uad50 (2026\u201327 \ud68c\uacc4\uc5f0\ub3c4 \uae30\uc900)\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"415\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"66\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"67\" x2=\"879\" y2=\"67\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"28\" y=\"27\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.06em\">\ubcc0\ud638\uc0ac \uc120\uc784 \uc190\uc775\ubd84\uae30\uc810 \u00b7 \ub0b4 \uc0ac\uac74\uc740 \uc5b4\ub290 \ud2b8\ub799\uc5d0 \ub193\uc5ec \uc788\ub294\uac00<\/text>\n  <text x=\"28\" y=\"50\" font-size=\"16.2\" font-weight=\"800\" fill=\"#1F242B\">\uc0ac\uac74 \uc720\ud615\ubcc4 \uc608\uc0c1 \ube44\uc6a9 \uc18c\ubaa8(Fee Burn) \ub300 \uc21c\uc790\uc0b0 \ubcf4\uc874 \ud2b8\ub799 \ube44\uad50 (2026\u201327 \ud68c\uacc4\uc5f0\ub3c4 \uae30\uc900)<\/text>\n  <rect x=\"22\" y=\"84\" width=\"836\" height=\"68\" rx=
