\uc778\uc9c0\ub300 $215<\/text>\n  <text x=\"840\" y=\"216\" text-anchor=\"end\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">\uc57d 4\uc8fc \uc11c\uba74 \uc885\uacb0<\/text>\n  <rect x=\"22\" y=\"244\" width=\"836\" height=\"68\" rx=\"10\" fill=\"#FEF8EC\" stroke=\"#9A6700\" stroke-width=\"1.1\"/>\n  <text x=\"38\" y=\"268\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1F242B\">\ud2b8\ub799 C \u00b7 \uc18c\uc561\uc7ac\uc0b0 \ubc95\uc6d0 \ud2b8\ub799 (PPP)<\/text>\n  <text x=\"38\" y=\"291\" font-size=\"11.5\" fill=\"#525B67\">\uc18c\uc561 \ub2e4\ud23c \uc2dc \ubc95\uc6d0 \uc8fc\ub3c4 \uac04\uc774 \uacf5\uac1c\u00b7\uc870\uc815(\uc218\uc218\ub8cc $510) \ud65c\uc6a9 \u00b7 \uacfc\ub3c4\ud55c \uc218\uc784\ub8cc \uc18c\ubaa8 \ubc29\uc9c0<\/text>\n  <rect x=\"615\" y=\"255\" width=\"228\" height=\"22\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"615\" y=\"255\" width=\"155\" height=\"22\" rx=\"5\" fill=\"#9A6700\" opacity=\"0.18\"/>\n  <text x=\"625\" y=\"270\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#9A6700\">\uc5f0\uae08 \uc81c\uc678 \uc21c\uc790\uc0b0 \u2264 $550k<\/text>\n  <text x=\"840\" y=\"296\" text-anchor=\"end\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">\uc870\uc815 \ud654\ud574\uc728 76.2%<\/text>\n  <rect x=\"22\" y=\"324\" width=\"836\" height=\"68\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.1\"/>\n  <text x=\"38\" y=\"348\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1F242B\">\ud2b8\ub799 D \u00b7 \uc804\uba74 \ubcf8\uc548 \uc7ac\ud310 \ub05d\uc7a5 \uc18c\uc1a1<\/text>\n  <text x=\"38\" y=\"371\" font-size=\"11.5\" fill=\"#525B67\">\uc740\ub2c9 \uc790\uc0b0\u00b7\uc911\ub300 \ud3ed\ub825\u00b7\uace0\uc561 \ubd84\uc7c1 \uc678\uc5d0 \uac10\uc815\uc2f8\uc6c0\uc73c\ub85c \uc9c4\uc785\ud558\uba74 \uc21c\uc790\uc0b0 \ub300\ubd80\ubd84\uc774 \uc218\uc784\ub8cc\ub85c \uc99d\ubc1c<\/text>\n  <rect x=\"615\" y=\"335\" width=\"228\" height=\"22\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"615\" y=\"335\" width=\"228\" height=\"22\" rx=\"5\" fill=\"#7A1F2B\" opacity=\"0.18\"/>\n  <text x=\"625\" y=\"350\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#7A1F2B\">\uc591\uce21 \ud569\uc0b0 $80k\u2013$180k+<\/text>\n  <text x=\"840\" y=\"376\" text-anchor=\"end\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">15.8~27\uac1c\uc6d4 \uc18c\uc694<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 2: \uc0ac\uac74 \uc720\ud615\ubcc4 \uc608\uc0c1 \ube44\uc6a9 \uc18c\ubaa8 \ub300 \uc21c\uc790\uc0b0 \ubcf4\uc874 \ud2b8\ub799 \ube44\uad50<\/figcaption><\/figure>\n<h2 id=\"\ub0b4-\ub3c8\uc744-\uc9c0\ud0a4\ub294-\ubcc0\ud638\uc0ac-\uc120\uc784\uc758-\uc190\uc775\ubd84\uae30\uc810-\uc5b8\uc81c-\uc9c1\uc811-\ud558\uace0-\uc5b8\uc81c-\ub9e1\uaca8\uc57c-\ud560\uae4c\" class=\"doc-h2\">\ub0b4 \ub3c8\uc744 \uc9c0\ud0a4\ub294 \ubcc0\ud638\uc0ac \uc120\uc784\uc758 \uc190\uc775\ubd84\uae30\uc810: \uc5b8\uc81c \uc9c1\uc811 \ud558\uace0 \uc5b8\uc81c \ub9e1\uaca8\uc57c \ud560\uae4c<\/h2>\n<p class=\"doc-p\">\uadf8\ub807\ub2e4\uba74 \ube44\uc6a9 \ub300\ube44 \uc2e4\uc775 \uad00\uc810\uc5d0\uc11c \uc5b4\ub5a4 \uc0ac\uac74\uc744 \uc9c1\uc811 \ucc98\ub9ac\ud558\uace0 \uc5b4\ub5a4 \uc21c\uac04\uc5d0 \ubcc0\ud638\uc0ac\ub97c \ud22c\uc785\ud574\uc57c \ud604\uba85\ud560\uae4c\uc694? \uc5f0\uae08\uc744 \uc81c\uc678\ud55c \uc21c\uc790\uc0b0 \uaddc\ubaa8\uac00 $550,000 \uc774\ud558\uc774\uace0 \ubcf5\uc7a1\ud55c \uc2e0\ud0c1\uc774\ub098 \ud574\uc678 \uc790\uc0b0\uc774 \uc5c6\ub294 \uc7ac\uc0b0 \ub2e4\ud23c\uc774\ub77c\uba74 \ubc95\uc6d0\uc774 \uc6b4\uc601\ud558\ub294 \uc6b0\uc120\uc18c\uc561\uc7ac\uc0b0\uc0ac\uac74(FAM-PPP) \ud2b8\ub799\uc774\ub098 \ubb34\ub8cc \ubc95\ub960\uad6c\uc870 \uc0c1\ub2f4\ubd80\ud130 \ud65c\uc6a9\ud558\uc2dc\ub294 \ud3b8\uc774 \ub098\uc544\uc694. FCFCOA \ud1b5\uacc4\ub97c \ubcf4\uba74 \ucd5c\uadfc \ub204\uc801 3,671\uac74(\uc804\uccb4 \uc7ac\uc0b0 \ub2e8\ub3c5 \uc18c\uc1a1\uc758 25.1%)\uc774 \uc774 \uc18c\uc561 \ud2b8\ub799\uc73c\ub85c \ubd84\ub958\ub418\uc5c8\ub294\ub370\uc694. \uc870\uc815\uae30\uc77c(Conciliation Conference, \uc218\uc218\ub8cc $510) \ub2e8\uacc4\uc5d0\uc11c \ubb34\ub824 76.2%\uac00 \ud654\ud574\ub85c \uc885\uacb0\ub410\uc5b4\uc694. \ud638\uc8fc\uac00\uc871\uc5f0\uad6c\uc18c \ud3c9\uac00\uc5d0\uc11c\ub3c4 \ud22c\uc790 \ube44\uc6a9 1\ub2ec\ub7ec\ub2f9 $3.88\uc758 \uc0ac\ud68c\uc801 \ud3b8\uc775\uc744 \ub0b8 \uac83\uc73c\ub85c \ud655\uc778\ub410\uc8e0. \uc21c\uc790\uc0b0\uc774 \uc791\uc740 \uc0ac\uac74\uc5d0\uc11c \uc591\ucabd\uc774 \uc218\ub9cc \ub2ec\ub7ec\uc529 \uc18c\uc1a1 \uc218\uc784\ub8cc\ub97c \uc4f0\uba74 \uc774\uaca8\ub3c4 \ub0a8\ub294 \ub3c8\uc774 \uc5c6\ub294 \uc5ed\uc804\uc774 \ubc8c\uc5b4\uc838\uc694.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"4\"><thead><tr><th style=\"text-align:left\">\ud574\uacb0 \ud2b8\ub799 \uad6c\ubd84<\/th><th style=\"text-align:left\">2026\u201327 \ubc95\uc6d0 \uc218\uc218\ub8cc \ubc0f \uc608\uc0c1 \ube44\uc6a9<\/th><th style=\"text-align:left\">\ud3c9\uade0 \uc18c\uc694 \uae30\uac04<\/th><th style=\"text-align:left\">\uac00\uc7a5 \uc801\ud569\ud55c \uc0ac\uac74 \uc720\ud615<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>1. \ub098\ud640\ub85c \uc628\ub77c\uc778 \uc774\ud63c (s 48)<\/strong><\/td><td style=\"text-align:left\">\ubc95\uc6d0 \uc778\uc9c0\ub300 $1,170 (\uac10\uba74 $390) \u00b7 \ubcc0\ud638\uc0ac\ube44 $0<\/td><td style=\"text-align:left\">\uc57d 3\u20134\uac1c\uc6d4 (s 98A \ubb34\ucd9c\uc11d \uc11c\uba74\uc2ec\uc0ac)<\/td><td style=\"text-align:left\">12\uac1c\uc6d4 \ubcc4\uac70 \uc694\uac74 \ucda9\uc871 \ud6c4 \ubc95\uc801 \ud63c\uc778 \ud574\uc18c\ub9cc \ud544\uc694\ud55c \uacbd\uc6b0 (\uc81c3\uc790 \uc1a1\ub2ec \uc900\uc218)<\/td><\/tr><tr><td style=\"text-align:left\"><strong>2. \ubc15\uc564\ucf54 \uc815\uc561 \ud569\uc758\uba85\ub839 (Consent Orders)<\/strong><\/td><td style=\"text-align:left\">\uc815\uc561 \uc218\uc784\ub8cc $4,950 + \ubc95\uc6d0 \uc218\uc218\ub8cc $215<\/td><td style=\"text-align:left\">\uc11c\uba85 \ud6c4 \uc57d 4\uc8fc \uc11c\uba74 \uc885\uacb0<\/td><td style=\"text-align:left\">\uc8fc\ud0dd\u00b7\ud1f4\uc9c1\uc5f0\uae08\u00b7\uc591\uc721 \ud070 \ud2c0 \ud569\uc758 \uc644\ub8cc \uc2dc \u00b7 \uc601\uad6c \uc9d1\ud589\ub825 + \uc778\uc9c0\uc138 \uba74\uc81c + \uc5f0\uae08 \uc218\ud0c1\uc790 28\uc77c \ud1b5\uc9c0 \ud3ec\ud568<\/td><\/tr><tr><td style=\"text-align:left\"><strong>3. \ubc95\uc6d0 \uc6b0\uc120\uc18c\uc561\uc7ac\uc0b0 \ud2b8\ub799 (FAM-PPP)<\/strong><\/td><td style=\"text-align:left\">\uc811\uc218\ube44 $455 + \uc870\uc815\uae30\uc77c $510<\/td><td style=\"text-align:left\">\uc57d 5\u20138\uac1c\uc6d4 (\uc870\uc815 \ud654\ud574\uc728 76.2%)<\/td><td style=\"text-align:left\">\uc5f0\uae08 \uc81c\uc678 \uc21c\uc790\uc0b0 $550,000 \uc774\ud558 \ub2e8\uc21c \uc7ac\uc0b0 \ubd84\uc7c1 (\uacfc\ub3c4\ud55c \uc18c\uc1a1\ube44 \uc18c\ubaa8 \ubc29\uc9c0)<\/td><\/tr><tr><td style=\"text-align:left\"><strong>4. \ubb34\uc751\ub2f5 \ubc30\uc6b0\uc790 \uc18c\ud658 \u00b7 \uc815\uc2dd \ub300\ub9ac<\/strong><\/td><td style=\"text-align:left\">\ub2e8\uacc4\ubcc4 \uc57d\uc815 (\ubcf8\uc548 \uc811\uc218 $455\u2013$895, \uc2ec\ub9ac \uc77c\ub2f9 $820\u2013$1,115)<\/td><td style=\"text-align:left\">\ud611\uc0c1 \ud0c0\uacb0 \uc2dc 4\u201312\uc8fc (\ub05d\uc7a5 \ud310\uacb0 \uc2dc 15.8\u201327\uac1c\uc6d4)<\/td><td style=\"text-align:left\">\uc5f0\ub77d \ud68c\ud53c\u00b7\uc7ac\uc0b0 \uc740\ub2c9 \ubc30\uc6b0\uc790 \ud14c\uc774\ube14 \ud638\ucd9c, $300k\u2013$2M+ \ud55c\u00b7\ud638 \ubcf5\ud569 \uc790\uc0b0, \ud30c\ud2b8\ub108\ube44\uc790 Div 1.5<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"doc-p\">\ubc18\ub300\ub85c \ubcc0\ud638\uc0ac \uc120\uc784\uc774 \uc218\uc784\ub8cc\uc758 \uba87 \ubc30 \uc774\uc0c1 \uac00\uce58\ub97c \ubc1c\ud718\ud558\ub294 \ub450 \uac00\uc9c0 \ud655\uc2e4\ud55c \uad6c\uac04\uc774 \uc788\uc5b4\uc694. \uccab\uc9f8\ub294 \ubd80\ubd80\uac00 \uc7ac\uc0b0\uacfc \uc5f0\uae08, \uc591\uc721\uc758 \ud070 \uc904\uae30\uc5d0 \uc5b4\ub290 \uc815\ub3c4 \ud569\uc758\ud588\uc744 \ub54c \uc774\ub97c \ubc95\uc6d0 \uc778\uc7a5 \ud569\uc758\uba85\ub839(Consent Orders)\uc73c\ub85c \ub2e8\ub2e8\ud558\uac8c \uc7a0\uadf8\ub294 \uc791\uc5c5\uc774\uc5d0\uc694. \uc0ac\uc801\uc778 \ud569\uc758 \uac01\uc11c\ub294 \uc5b8\uc81c\ub4e0 \ud55c\ucabd\uc774 \ub9c8\uc74c\uc744 \ubc14\uafb8\uba74 \ud734\uc9c0 \uc870\uac01\uc774 \ub3fc\uc694. \ube44\uc790 \uc2e0\ubd84\uc774 \ubd88\uc548\uc815\ud55c \ubc30\uc6b0\uc790\ub97c \uc555\ubc15\ud574 \uc77c\ubc29\uc801\uc73c\ub85c \uc11c\uba85\ud558\uac8c \ud55c \uc7ac\uc0b0\uc57d\uc815(BFA) \uc5ed\uc2dc \ub3c5\ub9bd\uc801 \ubc95\ub960\uc790\ubb38\uc744 \uac70\ucce4\ub354\ub77c\ub3c4 \ubd80\ub2f9\uc704\uc555\uacfc \ubd88\uacf5\uc815 \ud589\uc704\ub85c \ud1b5\uc9f8\ub85c \ucde8\uc18c\ub420 \uc218 \uc788\uc5b4\uc694. \uc5f0\ubc29\ub300\ubc95\uc6d0 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2017/49.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Thorne v Kennedy [2017] HCA 49<\/em><\/a> ([38], [56], [64]) \ud310\uacb0\uc774 \ubc14\ub85c \uadf8\ub7f0 \uc0ac\ub840\uc608\uc694. \ubc15\uc564\ucf54\uc758 \ud655\uc815 \uc218\uc784\ub8cc \ud569\uc758\uba85\ub839 \ud328\ud0a4\uc9c0($4,950 \uc815\uc561 + \ubc95\uc6d0 \uc778\uc9c0\ub300 $215, \ud1f4\uc9c1\uc5f0\uae08 \uc218\ud0c1\uc790 28\uc77c \uc0ac\uc804 \ud1b5\uc9c0 \uc808\ucc28 \ud3ec\ud568)\ub294 \uc815\uc2dd \uc18c\uc1a1 \ube44\uc6a9\uc758 \uc2ed\ubd84\uc758 \uc77c\ub3c4 \uc548 \ub418\ub294 \uc608\uc0b0\uc73c\ub85c \uc591\uce21\uc758 \ubd84\uc7c1\uc744 \uc601\uad6c \uc885\uacb0\uc9c0\uc5b4\uc694. \ubd80\ub3d9\uc0b0 \uc774\uc804 \uc778\uc9c0\uc138 \uba74\uc81c\uae4c\uc9c0 \ud655\ubcf4\ud574 \uc8fc\uc8e0.<\/p>\n<p class=\"doc-p\">\ub458\uc9f8\ub294 \uc0c1\ub300\ubc29\uc774 \uc5f0\ub77d\uc744 \uc544\uc608 \ubb34\uc2dc\ud558\uac70\ub098 \uacc4\uc88c\uc640 \ubd80\ub3d9\uc0b0 \ub0b4\uc5ed\uc744 \uc228\uae30\uba70 \ubc84\ud2f8 \ub54c \ud569\uc758 \ud14c\uc774\ube14\ub85c \ub04c\uc5b4\ub0b4\ub294 \uc791\uc5c5\uc774\uc5d0\uc694. \uac1c\uc778 \uce74\uce74\uc624\ud1a1\uc774\ub098 \ubb38\uc790\uc5d0\ub294 \uc77d\uc539\uc73c\ub85c \uc77c\uad00\ud558\ub358 \ubc30\uc6b0\uc790\uc5d0\uac8c \ubcc0\ud638\uc0ac \uba85\uc758\ub85c s 71B \uc804\uba74 \uc7ac\uc0b0\uacf5\uac1c \uc694\uad6c \ubc0f \ud611\uc0c1 \uac1c\uc2dc \ucd5c\uace0\uc7a5\uc744 \ubc1c\uc1a1\ud558\ub294 \ubc29\ubc95\uc778\ub370\uc694. \ube44\ud611\uc870 \uc2dc \ud5a5\ud6c4 \uc18c\uc1a1\ube44\uc6a9 \ubc30\uc0c1 \ubd88\uc774\uc775 \uacbd\uace0\uae4c\uc9c0 \ud3ec\ud568\ub41c \ucd5c\uace0\uc7a5\uc744 \uc1a1\ub2ec\ubc1b\uc73c\uba74 \ube44\ub85c\uc18c \uc790\uae30 \ubcc0\ud638\uc0ac\ub97c \uc120\uc784\ud574 \ud611\uc0c1 \ud14c\uc774\ube14\ub85c \ub098\uc624\ub294 \uacbd\uc6b0\uac00 \ud604\uc7a5\uc5d0\uc11c \uc815\ub9d0 \ub9ce\uac70\ub4e0\uc694. \uac10\uc815 \uc18c\ubaa8\uc801\uc778 \uc774\uba54\uc77c \uc0c1\ub2f4 \ub300\uc2e0 \ubc15\uc564\ucf54 \uac00\uc871\ubc95 \uc804\uc6a9 \uc628\ub77c\uc778 \uc9c8\ubb38\uc9c0(<a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\uac00\uc871\ubc95 \uc0ac\uc548 \uc811\uc218 \ubc14\ub85c\uac00\uae30<\/a>)\uc640 \uacf5\uc2dd \uc548\ub0b4 \ud5c8\ube0c(<a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ubc15\uc564\ucf54 \uacf5\uc2dd \ub9c1\ud06c \ud5c8\ube0c<\/a>)\uc5d0\uc11c \ud604\uc7ac \ubcc4\uac70 \uae30\uac04\uacfc \uc790\uc0b0 \uad6c\uc131\uc744 \uc815\ub9ac\ud574 \uc811\uc218\ud574 \uc8fc\uc138\uc694. \uc9c0\uae08 \uc9c1\uc811 \uc9c4\ud589\ud558\uc2e4 \uc601\uc5ed\uacfc \ubcc0\ud638\uc0ac\uac00 \uac1c\uc785\ud574 \uc2e4\uc775\uc744 \uc9c0\ucf1c\ub4dc\ub9b4 \uc601\uc5ed\uc744 \ud22c\uba85\ud558\uac8c \uac00\ub824 \ub4dc\ub9b4\uac8c\uc694.<\/p>\n\n          <div class=\"col-sources-box\">\n            \uadfc\uac70 \ubc95\ub839 \ubc0f \ud1b5\uacc4: Family Law Act 1975 (Cth) (s 48, s 60CA, s 60CC(2), s 60I, s 65DAAA, s 98A) \u00b7 FCFCOA Annual Report 2025\u201326 (Tabled Oct 2026) \u00b7 ABS Marriages and Divorces 2025 \u00b7 Federal Courts Legislation Amendment Fees Gazette C2026G00343 (eff. 1 July 2026).\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#E6C98C;\">\ud63c\uc790 \uc9c4\ud589\uc744 \uba48\ucd94\uace0 \ubcc0\ud638\uc0ac\ub97c \ucc3e\uc544\uc57c \ud558\ub294 \uc21c\uac04 \u00b7 \uac00\uc871\ubc95<\/span>\n            <h3 class=\"col-cta-title\">\ud569\uc758\ub41c \uc870\uac74\uc744 \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950)\uc73c\ub85c \ud655\uc815\ud558\uace0 \uc2f6\uac70\ub098 \uc5f0\ub77d\uc744 \ud53c\ud558\ub294 \ubc30\uc6b0\uc790\uc640 \uc7ac\uc0b0\ubd84\ud560 \ud611\uc0c1\uc744 \uc2dc\uc791\ud574\uc57c \ud569\ub2c8\uae4c?<\/h3>\n            <p class=\"col-cta-desc\">\ub2e8\uc21c \uc628\ub77c\uc778 \uc774\ud63c \uc2e0\uccad\uc740 \ud3ec\ud138 \uc124\uba85\uc11c\ub97c \ubcf4\uace0 \uc9c1\uc811 \uc9c4\ud589\ud558\uba74 \uc218\ucc9c \ub2ec\ub7ec\ub97c \uc544\ub07c\uc2e4 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \ubc18\uba74 \ubc95\uc801 \ud6a8\ub825\uc774 \uc788\ub294 \uc7ac\uc0b0\u00b7\uc591\uc721 \ud569\uc758\uba85\ub839(Consent Orders) \uc791\uc131\uc774\ub098 \uc5f0\ub77d\uc744 \ud53c\ud558\ub294 \ubc30\uc6b0\uc790\uc758 \uc7ac\uc0b0 \uacf5\uac1c \uc694\uad6c\u00b7\ud55c\uad6d\uacfc \ud638\uc8fc\uc5d0 \uac78\uce5c \uc7ac\uc0b0\ubd84\ud560\uc774 \ud544\uc694\ud560 \ub54c\ub294 3\ubd84 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \ud575\uc2ec \ub0a0\uc9dc\uc640 \uc7ac\uc0b0 \ub0b4\uc5ed\uc744 \ub0a8\uaca8 \uc8fc\uc2ed\uc2dc\uc624.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">\uac00\uc871\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../files/KO/PDF/03_Family_Law_Divorce_Property_Parenting_and_Settlement_Manual_2026_KO.pdf\" download class=\"col-btn-ghost\">03 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc694\uc57d PDF \ubc1b\uae30<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">\ubc15\uc564\ucf54 \uacf5\uc2dd \uc0c1\ub2f4 \ub9c1\ud06c \ud5c8\ube0c<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">\ubc95\ub960 \uc548\ub0b4: \uc774 \uce7c\ub7fc\uc740 \ud638\uc8fc \uc5f0\ubc29 \uac00\uc871\ubc95(Family Law Act 1975)\uacfc \uacf5\uc2dd \ud1b5\uacc4\u00b7\ud310\ub840\ub97c \ubc14\ud0d5\uc73c\ub85c \uc54c\uae30 \uc27d\uac8c \uc815\ub9ac\ud55c \uc77c\ubc18 \ubc95\ub960 \uc815\ubcf4\uc785\ub2c8\ub2e4. \uac1c\ubcc4 \uc0ac\uac74\uc5d0 \ub300\ud55c \ubc95\ub960 \uc790\ubb38\uc774\ub098 \uc218\uc784 \uacc4\uc57d \uc131\ub9bd\uc744 \ub73b\ud558\uc9c0 \uc54a\uc73c\ubbc0\ub85c \uc774\ud63c \ud6c4 12\uac1c\uc6d4\u00b7\uc0ac\uc2e4\ud63c \uacb0\ubcc4 \ud6c4 2\ub144 \ub9c8\uac10 \uae30\ud55c\uc774\ub098 \ube44\uc790 \uae30\ud55c\uc774 \uc784\ubc15\ud588\ub2e4\uba74 \uc9c0\uccb4 \uc5c6\uc774 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uac80\ud1a0\ub97c \ubc1b\uc544 \ubcf4\uc2dc\uae30 \ubc14\ub78d\ub2c8\ub2e4.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">\ud568\uaed8 \uc77d\uc73c\uba74 \uc88b\uc740 \uac00\uc871\ubc95 \ud310\ub840 \uce7c\ub7fc<\/h3>\n        <a href=\"../../?lang=ko&amp;tab=family\" class=\"col-back-link num\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../property-reforms-2026/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">2025\u20132026 \uac1c\uc815 \ud574\uc124 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 01<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \uac00\uc871\ubc95 \uc7ac\uc0b0\ubd84\ud560 \uac1c\ud3b8 \ud575\uc2ec: \uacbd\uc81c\uc801 \ud559\ub300 \ubc18\uc601, \ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ud574\uc678\uc790\uc0b0, \ubc18\ub824\ub3d9\ubb3c \ubc0f \uc81c\ucc99\uae30\uac04 \ucd1d\uc815\ub9ac<\/h4><p class=\"col-sib-desc\">\uc774\ubbf8 \uc18c\ube44\ub41c \uc7ac\uc0b0 \ud569\uc0b0(Add-backs) \ud3d0\uc9c0, \uacbd\uc81c\uc801 \ud559\ub300 \ubc18\uc601, \ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ud55c\uad6d \uc790\uc0b0 \uacf5\uac1c \uc758\ubb34, \ubc18\ub824\ub3d9\ubb3c \uadc0\uc18d \uae30\uc900, 12\uac1c\uc6d4\u00b72\ub144 \uc7ac\uc0b0\ubd84\ud560 \uc81c\ucc99\uae30\uac04\uc744 \uccb4\uacc4\uc801\uc73c\ub85c \uc815\ub9ac\ud588\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../partner-visa-breakdown-crossborder/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc774\ubbfc\u00b7\uac00\uc871\ubc95 \uad50\ucc28 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 03<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \ud30c\ud2b8\ub108\ube44\uc790 \uc9c4\ud589 \uc911 \uacb0\ubcc4\u00b7\uac00\uc815\ud3ed\ub825\uacfc \ud55c\u00b7\ud638 \uad6d\uc81c \uc7ac\uc0b0\ubd84\ud560 \uc2e4\uc804 \ub300\ucc98\ubc95<\/h4><p class=\"col-sib-desc\">\ubc30\uc6b0\uc790\uc758 \ube44\uc790 \ucde8\uc18c \uc704\ud611 \ub300\uc751 \uc6d0\uce59\ubd80\ud130 \uac00\uc815\ud3ed\ub825 \uc601\uc8fc\uad8c \ud2b9\ub840 \uc694\uac74\uacfc \ud55c\u00b7\ud638 \uc591\uad6d \uc790\uc0b0 \uc815\ub9ac \ubc0f \ub3d9\uc758 \uc5c6\ub294 \uc544\ub3d9 \ud574\uc678 \uc774\ub3d9 \uae08\uc9c0 \ubc95\ub9ac\uae4c\uc9c0 \uc885\ud569 \ud574\uc124\ud569\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../parental-advances-loans-gifts-divorce/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubd80\ubaa8 \uc9c0\uc6d0\uae08\u00b7\ucc28\uc6a9\uc99d \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 14<\/span><h4 class=\"col-sib-title\">\ud55c\uad6d \ubd80\ubaa8\ub2d8\uc774 \ubcf4\ud0dc\uc900 \uc9d1\uac12 3\uc5b5, \ud638\uc8fc \uc774\ud63c\ud560 \ub54c \ub3cc\ub824\uc904 \ub300\uc5ec\uae08\uc77c\uae4c \ub098\ub20c \uc99d\uc5ec\uc77c\uae4c<\/h4><p class=\"col-sib-desc\">\ud55c\uad6d\u00b7\ud638\uc8fc \ubd80\ubaa8\ub2d8\uc774 \uc9d1 \uc0b4 \ub54c \ubcf4\ud0dc\uc8fc\uc2e0 \ub3c8\uc774 \uac1a\uc544\uc57c \ud560 \ube5a\uc73c\ub85c \uba3c\uc800 \ube60\uc9c0\ub294 \uacbd\uc6b0\uc640 \ubd80\ubd80 \uc7ac\uc0b0\uc5d0 \uc11e\uc774\ub294 \ucc28\uc774\ub97c \uc2e4\uc81c \ud310\ub840\ub85c \uc54c\uae30 \uc27d\uac8c \ube44\uad50\ud588\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../family-trusts-companies-valuation-divorce/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uac00\uc871\uc2e0\ud0c1\u00b7\ubc95\uc778\uac10\uc815 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 15<\/span><h4 class=\"col-sib-title\">\uc7ac\uc0b0\uc744 \uac00\uc871\uc2e0\ud0c1(Family Trust)\uc774\ub098 Pty Ltd \ubc95\uc778\uc5d0 \ub123\uc5b4\ub450\uba74 \uc774\ud63c \uc7ac\uc0b0\ubd84\ud560\uc5d0\uc11c \uc548\uc804\ud560\uae4c<\/h4><p class=\"col-sib-desc\">\ub204\uac00 \uc2e0\ud0c1\uc758 \uc2e4\uc81c \uacb0\uc815\uad8c(Appointor)\uc744 \uc950\uace0 \uc788\ub294\uc9c0 \ub530\uc9c0\ub294 \uae30\uc900\ubd80\ud130 \uacf5\ub3d9 \uac10\uc815\uc778 \uc808\ucc28\uc640 \ubc95\uc778 \ub3c8\uc744 \uc62e\uae38 \ub54c \uc138\uae08\uc744 \uc544\ub07c\ub294 \ubc29\ubc95\uae4c\uc9c0 \uc9da\uc5b4 \ub4dc\ub9bd\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../post-separation-inheritances-windfalls-delay/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubcc4\uac70 \ud6c4 \uc0c1\uc18d\u00b7\uc9c0\uccb4\uc704\ud5d8 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 16<\/span><h4 class=\"col-sib-title\">\ubcc4\uac70\ud55c \uc9c0 4\ub144 \uc9c0\ub0ac\uc73c\ub2c8 \uc0c8\ub85c \ubc1b\uc740 \uc0c1\uc18d\uc774\ub098 \uc9d1\uac12 \uc0c1\uc2b9\ubd84\uc740 \ub0b4 \uac83\uc774\uaca0\uc9c0: \ud569\uc758\uba85\ub839(Consent Orders)\uc744 \ubbf8\ub8ec \ub300\uac00<\/h4><p class=\"col-sib-desc\">\ubcc4\uac70 \ub4a4 \uc11c\ub958 \uc815\ub9ac\ub97c \ud3c9\uade0 4\ub144\uc529 \ubbf8\ub8e8\ub2e4 \ub098\uc911\uc5d0 \ubc1b\uc740 \uc0c1\uc18d\uae08\uc774\ub098 \uc624\ub978 \uc9d1\uac12\uae4c\uc9c0 \ub098\ub204\uac8c \ub418\ub294 \uc774\uc720\uc640 $4,950 \ubc95\uc6d0 \ud569\uc758\uba85\ub839\uc73c\ub85c \uc548\uc804\ud558\uac8c \ub9c8\ubb34\ub9ac\ud558\ub294 \ubc95\uc744 \ub2f4\uc558\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../prenups-bfa-vs-consent-orders/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ud63c\uc804\uacc4\uc57d BFA \ub300 \ud569\uc758\uba85\ub839 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 17<\/span><h4 class=\"col-sib-title\">\ubcc0\ud638\uc0ac \uc99d\uba85\uc11c\uae4c\uc9c0 \ubd99\uc778 \ud63c\uc804\uacc4\uc57d\uc11c(BFA)\uac00 \ub300\ubc95\uc6d0\uc5d0\uc11c \uae68\uc9c4 \uc774\uc720: \uc7ac\uc0b0\ubd84\ud560 \ud569\uc758\uc11c(BFA) \ub300 \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950) \uc120\ud0dd \uae30\uc900<\/h4><p class=\"col-sib-desc\">\uacb0\ud63c\u00b7\ub3d9\uac70 \uc804\uc5d0 \uc7ac\uc0b0\uc744 \uc548\uc804\ud558\uac8c \uc9c0\ud0a4\ub294 BFA \uc791\uc131 \uc694\ub839\uacfc \uc774\ubbf8 \ud5e4\uc5b4\uc9c4 \ubd80\ubd80\uac00 \uc591\ucabd \ubcc0\ud638\uc0ac\ube44\uac00 \ub4dc\ub294 BFA \ub300\uc2e0 \uc815\uc561 \ud569\uc758\uba85\ub839\uc744 \uace8\ub77c\uc57c \ud558\ub294 \uc774\uc720\ub97c \ube44\uad50\ud588\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../de-facto-threshold-disputes-out-of-time-s44/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc0ac\uc2e4\ud63c \uacbd\uacc4\u00b7\uae30\ud55c\ub3c4\uacfc \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 18<\/span><h4 class=\"col-sib-title\">\ub3d9\uac70\ub294 \uc548 \ud558\uace0 \uc0dd\ud65c\ube44\ub9cc \uc92c\ub294\ub370 \uc0ac\uc2e4\ud63c(De Facto) \uc18c\uc1a1\uc774 \ub4e4\uc5b4\uc654\ub2e4\uba74: \uc0ac\uc2e4\ud63c \uc778\uc815 \uae30\uc900(s 4AA)\uacfc \ub9c8\uac10 \uae30\ud55c \uc608\uc678 \uc2e0\uccad(s 44)<\/h4><p class=\"col-sib-desc\">\ub2e8\uc21c \uc5f0\uc778 \uad00\uacc4\uc640 \ubc95\uc801 \uc0ac\uc2e4\ud63c\uc744 \uac00\ub974\ub294 &#x27;\ud558\ub098\uc758 \uc0b6(Coupledom)&#x27; \uae30\uc900\ubd80\ud130 \uae30\ud63c\uc790\uc640\uc758 \uc774\uc911 \uc0ac\uc2e4\ud63c, \ub9c8\uac10 \uae30\ud55c\uc774 \uc9c0\ub09c \uc0ac\uac74\uc758 \ub300\uc751\ubc95\uae4c\uc9c0 \uc27d\uac8c \uc815\ub9ac\ud588\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}, "en": {"doc_title": "Divorce, Parenting & Property in Australia: The Practical Reality Check Before You Hire a Lawyer \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">All Guides Hub<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=en\">Visa Solution Guide<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=en\">Employment Navigator<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=en\">DIY & Cost-Smart Guide<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/?lang=en\" target=\"_blank\" rel=\"noopener\">Consult Park & Co \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=en&amp;tab=family\" class=\"col-back-btn\">\u2190 Back to Family Law Self-Help Hub<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">Park &amp; Co Lawyers \u00b7 Family Law Deep-Dive Column<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn\">KO<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn active\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">Consult Park &amp; Co \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">PRACTICAL REALITY GUIDE \u00b7 FAMILY 02<\/span>\n          <span class=\"col-verified-pill num\">Primary-Source Verified (Nov 2026)<\/span>\n          <span class=\"col-time-pill num\">8 min read<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">Divorce, Parenting &amp; Property in Australia: The Practical Reality Check Before You Hire a Lawyer<\/h1>\n        <p class=\"col-subtitle\">Why 90.0% of contested cases finish without a trial judgment, how post-May 2024 s 60CC safety rules work, and where legal fees actually pay off<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">Chang Min Park<\/div>\n            <div class=\"col-author-role\">Legal Practitioner Director, Park &amp; Co Lawyers \u00b7 Accredited Specialist in Immigration Law (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col02_divorce_parenting_hero.jpg\" alt=\"Divorce, Parenting &amp; Property in Australia: The Practical Reality Check Before You Hire a Lawyer\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">Ninety per cent of contested Division 2 family law filings finish without a trial judgment. Protecting child safety (s 60CC(2)(a)) and net equity starts with picking the right resolution track.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">90.0% Non-Trial<\/div><div class=\"col-stat-lbl\">Contested Div 2 Final Orders resolved without a judge&#x27;s trial judgment (FCFCOA 2025\u201326)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">92% Risk Profile<\/div><div class=\"col-stat-lbl\">Parenting filings alleging &gt;=1 major risk factor, including 84% party FV<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">$4,950 + $215<\/div><div class=\"col-stat-lbl\">Fixed-Fee Consent Orders (~4 wks) vs 15.8\u201327 months median wait to trial judgment<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">In This Column<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#what-abs-and-fcfcoa-numbers-say-about-going-to-t\" class=\"col-toc-link lvl-2\">What ABS and FCFCOA numbers say about going to trial<\/a><a href=\"#no-fault-divorce-under-s-48-is-now-largely-a-diy\" class=\"col-toc-link lvl-2\">No-fault divorce under s 48 is now largely a DIY process<\/a><a href=\"#parenting-after-may-2024-the-equal-time-myth-is-\" class=\"col-toc-link lvl-2\">Parenting after May 2024: the equal-time myth is gone and safety comes first<\/a><a href=\"#fee-burn-economics-when-to-self-manage-and-when-\" class=\"col-toc-link lvl-2\">Fee-burn economics: when to self-manage and when a lawyer pays for themselves<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">Open Family Law Consultation Form<\/a>\n              <a href=\"../../?lang=en&amp;tab=family\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 Back to Family Law Self-Help Hub<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">Almost every week in family law practice, a separated spouse brings in a thick folder of text messages proving an affair or bitter arguments and asks to have their ex-partner penalised in court. That impulse makes complete human sense, particularly for clients who grew up near civil-law systems where marital fault still drives damages. Under Australian law, it gets nowhere. Since the <em>Family Law Act 1975<\/em> (Cth) introduced no-fault divorce (s 48), Australian courts do not punish infidelity or award moral compensation for a broken marriage. Trying to litigate who caused the breakup will not shift your share of the house by a single dollar; it only turns your children&#x27;s future deposit into legal fees on both sides. Before paying a litigation retainer, you should look hard at what official court statistics, the post-2024 parenting reforms, and legal fee economics actually show.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 392\" width=\"100%\" role=\"img\" aria-label=\"FCFCOA Contested Case Outcomes &amp; Parenting Risk Profile (FY 2025\u201326)\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"391\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"78\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"79\" x2=\"879\" y2=\"79\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"28\" y=\"29\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.06em\">COURT REALITY DATA \u00b7 FCFCOA ANNUAL REPORT 2025\u201326<\/text>\n  <text x=\"28\" y=\"52\" font-size=\"16.8\" font-weight=\"800\" fill=\"#1F242B\">FCFCOA Contested Case Outcomes &amp; Parenting Risk Profile (FY 2025\u201326)<\/text>\n  <text x=\"28\" y=\"70\" font-size=\"11.3\" fill=\"#525B67\">Sources: FCFCOA Annual Report 2025\u201326 (105,836 filings) &amp; ABS Marriages and Divorces 2025 (49,158 divorces; 50.4% joint)<\/text>\n  <rect x=\"22\" y=\"96\" width=\"408\" height=\"278\" rx=\"10\" fill=\"#FAF9F6\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"38\" y=\"122\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1F242B\">1. How Contested Div 2 Final Orders Resolve<\/text>\n  <rect x=\"38\" y=\"138\" width=\"307\" height=\"34\" rx=\"5\" fill=\"#1F4E5F\"/>\n  <rect x=\"345\" y=\"138\" width=\"31\" height=\"34\" fill=\"#9A6700\"/>\n  <rect x=\"376\" y=\"138\" width=\"38\" height=\"34\" rx=\"5\" fill=\"#7A1F2B\"/>\n  <text x=\"191\" y=\"160\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">81.8%<\/text>\n  <rect x=\"38\" y=\"192\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#1F4E5F\"/>\n  <text x=\"58\" y=\"203\" font-size=\"12.2\" font-weight=\"700\" fill=\"#1F242B\">Resolved Before Trial: 81.8%<\/text>\n  <text x=\"58\" y=\"220\" font-size=\"11.2\" fill=\"#525B67\">Finalised via negotiation / FDR / conciliation<\/text>\n  <rect x=\"38\" y=\"240\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#9A6700\"/>\n  <text x=\"58\" y=\"251\" font-size=\"12.2\" font-weight=\"700\" fill=\"#1F242B\">Settled During Trial: 8.3%<\/text>\n  <text x=\"58\" y=\"268\" font-size=\"11.2\" fill=\"#525B67\">90.0% total resolve WITHOUT a trial judgment<\/text>\n  <rect x=\"38\" y=\"288\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#7A1F2B\"/>\n  <text x=\"58\" y=\"299\" font-size=\"12.2\" font-weight=\"700\" fill=\"#1F242B\">Trial Judgment by Judge: 10.0%<\/text>\n  <text x=\"58\" y=\"316\" font-size=\"11.2\" fill=\"#525B67\">Median 15.8 months wait (27 months in Div 1)<\/text>\n  <rect x=\"36\" y=\"334\" width=\"380\" height=\"28\" rx=\"6\" fill=\"#EDF7F2\"/>\n  <text x=\"48\" y=\"352\" font-size=\"11.3\" font-weight=\"700\" fill=\"#1D6B48\">Contrast \u00b7 Consent Orders: 17,423 finalised on the papers (~4 weeks)<\/text>\n  <rect x=\"448\" y=\"96\" width=\"410\" height=\"278\" rx=\"10\" fill=\"#FAF9F6\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"464\" y=\"122\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">2. Risk Prevalence in Parenting Filings (Why s 60CC Changed)<\/text>\n  <text x=\"464\" y=\"158\" font-size=\"11.8\" font-weight=\"600\" fill=\"#1F242B\">At least 1 major risk factor alleged<\/text>\n  <rect x=\"646\" y=\"144\" width=\"185\" height=\"18\" rx=\"4\" fill=\"#EAE6DF\"/>\n  <rect x=\"646\" y=\"144\" width=\"170\" height=\"18\" rx=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"838\" y=\"158\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#7A1F2B\">92%<\/text>\n  <text x=\"464\" y=\"198\" font-size=\"11.8\" font-weight=\"600\" fill=\"#1F242B\">Party experienced family violence<\/text>\n  <rect x=\"646\" y=\"184\" width=\"185\" height=\"18\" rx=\"4\" fill=\"#EAE6DF\"/>\n  <rect x=\"646\" y=\"184\" width=\"155\" height=\"18\" rx=\"4\" fill=\"#A63A48\"/>\n  <text x=\"838\" y=\"198\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#A63A48\">84%<\/text>\n  <text x=\"464\" y=\"238\" font-size=\"11.8\" font-weight=\"600\" fill=\"#1F242B\">Child experienced / exposed to FV<\/text>\n  <rect x=\"646\" y=\"224\" width=\"185\" height=\"18\" rx=\"4\" fill=\"#EAE6DF\"/>\n  <rect x=\"646\" y=\"224\" width=\"148\" height=\"18\" rx=\"4\" fill=\"#C04A5A\"/>\n  <text x=\"838\" y=\"238\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#C04A5A\">80%<\/text>\n  <text x=\"464\" y=\"278\" font-size=\"11.8\" font-weight=\"600\" fill=\"#1F242B\">Mental health risk alleged<\/text>\n  <rect x=\"646\" y=\"264\" width=\"185\" height=\"18\" rx=\"4\" fill=\"#EAE6DF\"/>\n  <rect x=\"646\" y=\"264\" width=\"112\" height=\"18\" rx=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"838\" y=\"278\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F4E5F\">61%<\/text>\n  <text x=\"464\" y=\"318\" font-size=\"11.8\" font-weight=\"600\" fill=\"#1F242B\">Alcohol or substance misuse alleged<\/text>\n  <rect x=\"646\" y=\"304\" width=\"185\" height=\"18\" rx=\"4\" fill=\"#EAE6DF\"/>\n  <rect x=\"646\" y=\"304\" width=\"99\" height=\"18\" rx=\"4\" fill=\"#3B6E82\"/>\n  <text x=\"838\" y=\"318\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#3B6E82\">54%<\/text>\n  <text x=\"464\" y=\"355\" font-size=\"10.8\" font-weight=\"700\" fill=\"#7A1F2B\">-&gt; Old s 61DA equal-time presumption repealed May 2024 (s 60CC safety #1)<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 1: FCFCOA Contested Case Outcomes and Parenting Risk Profile<\/figcaption><\/figure>\n<h2 id=\"what-abs-and-fcfcoa-numbers-say-about-going-to-t\" class=\"doc-h2\">What ABS and FCFCOA numbers say about going to trial<\/h2>\n<p class=\"doc-p\">Television paints family law as a multi-day courtroom trial decided from the bench. Official statistics tell the opposite story. In the Australian Bureau of Statistics release <em>Marriages and Divorces, Australia, 2025<\/em> (published July 2026), 49,158 divorces were granted nationwide (a crude rate of 2.2 per 1,000 residents aged 16+), and 50.4% (24,763) were lodged cooperatively as Joint Applications, up from well under half ten years ago. Nearly half of all divorces (46.7%, affecting 40,748 children under 18) involved minor children, with median age at divorce sitting at 47.3 for men and 44.4 for women.<\/p>\n<p class=\"doc-p\">Registry figures from the Federal Circuit and Family Court of Australia (<em>FCFCOA Annual Report 2025\u201326<\/em>, tabled October 2026) point the same way. Out of 105,836 first-instance family law filings in 2025\u201326, 17,144 were uncontested Applications for Consent Orders (17,423 finalised at a 102% clearance rate, typically sealed by a registrar on the papers in around four weeks). Even among high-conflict couples who filed contested Division 2 Final Orders (15,311 filings), 81.8% resolved before trial and another 8.3% settled during the hearing itself, meaning 90.0% of contested proceedings ended without a trial judgment. Only 10.0% went the full distance to a contested judgment, after waiting a median 15.8 months in Division 2 or 27 months in Division 1. Research by the Australian Institute of Family Studies (AIFS) confirms that 97% of separated parents sort out arrangements outside a courtroom. Sensible family law representation means preparing the evidence as if a trial judge will read every page, then using that leverage to settle on commercial terms.<\/p>\n<h2 id=\"no-fault-divorce-under-s-48-is-now-largely-a-diy\" class=\"doc-h2\">No-fault divorce under s 48 is now largely a DIY process<\/h2>\n<p class=\"doc-p\">Australian law runs Divorce (ending the legal marriage), Property/Maintenance, and Parenting on three separate tracks. Applying for a divorce requires proving one fact under s 48: irretrievable breakdown shown by at least 12 months of continuous separation, including separation under one roof where corroborated by a short third-party affidavit. Most people can lodge the application themselves on the Commonwealth Courts Portal (<a href=\"https://www.comcourts.gov.au\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">comcourts.gov.au<\/a>) for a FY 2026\u201327 filing fee of $1,170, reduced to $390 where qualifying concession cards apply (on a joint application, both spouses must hold eligible cards).<\/p>\n<p class=\"doc-p\">Two old procedural hurdles also vanished on 10 June 2025 under the <em>Family Law Amendment Act 2024<\/em>. Couples married for less than two years (&lt;2-year marriages) no longer have to obtain a mandatory counselling certificate before filing, following the repeal of old s 44(1B). Just as usefully, amended s 98A removed compulsory court attendance for undefended sole divorce applications involving children under 18. Registrars now deal with those files entirely in chambers on the papers once valid third-party service is proved, though the basic rule of service still stands: you can never hand divorce papers to your spouse yourself.<\/p>\n<h2 id=\"parenting-after-may-2024-the-equal-time-myth-is-\" class=\"doc-h2\">Parenting after May 2024: the equal-time myth is gone and safety comes first<\/h2>\n<p class=\"doc-p\">Community forums still repeat the claim that Australian law starts from an automatic &quot;50/50 shared custody&quot; rule. That presumption left the statute book on 6 May 2024, when the <em>Family Law Amendment Act 2023<\/em> repealed both s 61DA (the presumption of equal shared parental responsibility) and s 65DAA (the mandatory equal-time gateway). FCFCOA risk-screening figures for 2025\u201326 (Table 2.5) show why Parliament scrapped them: 84% of parenting filings allege a party experienced family violence, 80% allege a child experienced or was exposed to family violence, 61% raise mental health risk, and 54% raise substance misuse. Overall, 92% of parenting applications flag at least one major risk factor, and 81% flag three or more. Treating equal time as the default starting point was routinely placing children and victim-survivors in danger.<\/p>\n<p class=\"doc-p\">Under current s 60CA and s 60CC(2)(a)\u2013(f), judges weigh six streamlined best-interests factors, led by s 60CC(2)(a): promoting the safety of the child and each caregiver from family violence, abuse, neglect or other harm. The benefit to a child of having a relationship with both parents (s 60CC(2)(e)) applies expressly &quot;where it is safe to do so&quot;. Published judgments show how firmly benches apply that wording. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC2F/2025/36.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Gallagher &amp; Day<\/em> [2025] FedCFamC2F 36<\/a> ([204]), Judge Betts granted the mother sole decision-making alongside no-time and no-communication orders against a father who perpetrated coercive family violence without insight, observing that <em>&quot;it is not the Court&#x27;s role to craft some sort of &#x27;halfway house&#x27; outcome which keeps the father/daughter relationship alive while the father sorts out his problems.&quot;<\/em> Interstate relocation cases have shifted too: permitting a mother to move to Perth in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC2F/2025/37.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Picard &amp; Picard (No 2)<\/em> [2025] FedCFamC2F 37<\/a> ([52], [192]\u2013[193]), Judge Bertone confirmed that a relocating parent does not have to prove &quot;compelling reasons&quot; and that relieving severe maternal stress produces flow-on benefits for the children.<\/p>\n<p class=\"doc-p\">Parents who already hold older final orders cannot reopen litigation simply because the legislation changed in May 2024. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2024/246.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Radecki &amp; Radecki<\/em> [2024] FedCFamC1A 246<\/a> ([79]), the Full Court confirmed that new s 65DAAA codifies <em>Rice &amp; Asplund<\/em>, requiring proof of a significant change in circumstances before existing final parenting orders will be revisited. Before filing any fresh parenting application, registries also enforce s 60I(7) strictly: unless a s 60I(9) family-violence or urgency exemption applies, you must file a valid s 60I Family Dispute Resolution (FDR) certificate, which can be obtained free or at subsidised rates through Family Relationship Centres on 1800 050 321.<\/p>\n<h2 id=\"fee-burn-economics-when-to-self-manage-and-when-\" class=\"doc-h2\">Fee-burn economics: when to self-manage and when a lawyer pays for themselves<\/h2>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 416\" width=\"100%\" role=\"img\" aria-label=\"Legal Fee-Burn vs Net Asset Preservation Across 4 Resolution Tracks (FY 2026\u201327)\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"415\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"66\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"67\" x2=\"879\" y2=\"67\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"28\" y=\"27\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.06em\">ECONOMIC BREAK-EVEN MATRIX \u00b7 CHOOSE THE RIGHT TRACK<\/text>\n  <text x=\"28\" y=\"50\" font-size=\"16.2\" font-weight=\"800\" fill=\"#1F242B\">Legal Fee-Burn vs Net Asset Preservation Across 4 Resolution Tracks (FY 2026\u201327)<\/text>\n  <rect x=\"22\" y=\"84\" width=\"836\" height=\"68\" rx=\"10\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1.1\"/>\n  <text x=\"38\" y=\"108\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1F242B\">Track A \u00b7 DIY Online Divorce<\/text>\n  <text x=\"38\" y=\"131\" font-size=\"11.5\" fill=\"#525B67\">Divorce-only (s 48) via comcourts.gov.au; undefended sole apps with children on papers (s 98A)<\/text>\n  <rect x=\"615\" y=\"95\" width=\"228\" height=\"22\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"615\" y=\"95\" width=\"28\" height=\"22\" rx=\"5\" fill=\"#1D6B48\" opacity=\"0.18\"/>\n  <text x=\"625\" y=\"110\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1D6B48\">$1,170 ($390 conc.)<\/text>\n  <text x=\"840\" y=\"136\" text-anchor=\"end\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">$0 Solicitor Fee<\/text>\n  <rect x=\"22\" y=\"164\" width=\"836\" height=\"68\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.1\"/>\n  <text x=\"38\" y=\"188\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1F242B\">Track B \u00b7 Fixed-Fee Consent Orders<\/text>\n  <text x=\"38\" y=\"211\" font-size=\"11.5\" fill=\"#525B67\">Broad agreement reached; locks in finality, stamp-duty exemption &amp; 28-day Super split notice<\/text>\n  <rect x=\"615\" y=\"175\" width=\"228\" height=\"22\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"615\" y=\"175\" width=\"82\" height=\"22\" rx=\"5\" fill=\"#1F4E5F\" opacity=\"0.18\"/>\n  <text x=\"625\" y=\"190\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F4E5F\">$4,950 + $215 Court Fee<\/text>\n  <text x=\"840\" y=\"216\" text-anchor=\"end\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">~4 Weeks on Papers<\/text>\n  <rect x=\"22\" y=\"244\" width=\"836\" height=\"68\" rx=\"10\" fill=\"#FEF8EC\" stroke=\"#9A6700\" stroke-width=\"1.1\"/>\n  <text x=\"38\" y=\"268\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1F242B\">Track C \u00b7 Priority Small Pool (PPP)<\/text>\n  <text x=\"38\" y=\"291\" font-size=\"11.5\" fill=\"#525B67\">Registrar-led simplified disclosure &amp; $510 Conciliation Conference; $3.88 SROI per $1 spent<\/text>\n  <rect x=\"615\" y=\"255\" width=\"228\" height=\"22\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"615\" y=\"255\" width=\"155\" height=\"22\" rx=\"5\" fill=\"#9A6700\" opacity=\"0.18\"/>\n  <text x=\"625\" y=\"270\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#9A6700\">Net Pool &lt;= $550k ex-super<\/text>\n  <text x=\"840\" y=\"296\" text-anchor=\"end\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">76.2% Settle at FDR/CC<\/text>\n  <rect x=\"22\" y=\"324\" width=\"836\" height=\"68\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.1\"/>\n  <text x=\"38\" y=\"348\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1F242B\">Track D \u00b7 Contested Trial to Judgment<\/text>\n  <text x=\"38\" y=\"371\" font-size=\"11.5\" fill=\"#525B67\">Essential for major asset hiding or severe risk, but catastrophic fee-burn for emotional fault fights<\/text>\n  <rect x=\"615\" y=\"335\" width=\"228\" height=\"22\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"615\" y=\"335\" width=\"228\" height=\"22\" rx=\"5\" fill=\"#7A1F2B\" opacity=\"0.18\"/>\n  <text x=\"625\" y=\"350\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#7A1F2B\">$80k\u2013$180k+ Combined<\/text>\n  <text x=\"840\" y=\"376\" text-anchor=\"end\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">15.8\u201327 Months Wait<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 2: Legal Fee-Burn vs Net Asset Preservation Across 4 Resolution Tracks<\/figcaption><\/figure>\n<p class=\"doc-p\">Legal representation should be judged as a net-benefit calculation. Where your net property pool sits under $550,000 excluding superannuation and consists of ordinary Australian bank and home equity balances, start by looking at the Court&#x27;s Priority Property Pool (FAM-PPP) track or Legal Aid mediation. Across 3,671 PPP files tracked to June 2026 (25.1% of property-only filings), 76.2% settled at Registrar-led Conciliation Conferences ($510 court fee), and an independent AIFS evaluation measured $3.88 in social return for every $1 spent alongside faster turnaround. Spending $60,000 a side on contested lawyers over a $300,000 pool helps nobody.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"4\"><thead><tr><th style=\"text-align:left\">Resolution Track<\/th><th style=\"text-align:left\">FY 2026\u201327 Court &amp; Legal Cost<\/th><th style=\"text-align:left\">Typical Timeframe<\/th><th style=\"text-align:left\">Best-Fit Scenario<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>1. DIY Online Divorce (s 48)<\/strong><\/td><td style=\"text-align:left\">$1,170 court fee ($390 concession); $0 legal fee<\/td><td style=\"text-align:left\">~3\u20134 months (s 98A paper hearing)<\/td><td style=\"text-align:left\">Ending legal marriage after 12m separation; no complex international service<\/td><\/tr><tr><td style=\"text-align:left\"><strong>2. Park &amp; Co Fixed-Fee Consent Orders<\/strong><\/td><td style=\"text-align:left\">$4,950 fixed solicitor fee + $215 court filing fee<\/td><td style=\"text-align:left\">~4 weeks from joint signing<\/td><td style=\"text-align:left\">Broad agreement reached on house, super &amp; parenting; needs permanent finality + stamp-duty exemption<\/td><\/tr><tr><td style=\"text-align:left\"><strong>3. Court FAM-PPP Small Pool Track<\/strong><\/td><td style=\"text-align:left\">$455 filing + $510 Conciliation fee<\/td><td style=\"text-align:left\">~5\u20138 months (76.2% settle at CC)<\/td><td style=\"text-align:left\">Contested property-only pool up to $550,000 net ex-super without complex trusts<\/td><\/tr><tr><td style=\"text-align:left\"><strong>4. Solicitor Demand &amp; Active Representation<\/strong><\/td><td style=\"text-align:left\">Scoped stage-by-stage retainer (Initiating App $455\u2013$895; daily trial $820\u2013$1,115)<\/td><td style=\"text-align:left\">Targeted 4\u201312 wk negotiation (vs 15.8\u201327m full trial)<\/td><td style=\"text-align:left\">Ex-partner stonewalling/hiding assets, $300k\u2013$2M+ AU/overseas pools, or Partner Visa Div 1.5 DV<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"doc-p\">Paying a family lawyer earns its keep in two clear scenarios. First, if you already have a handshake deal, converting it into Court-sealed Consent Orders ($4,950 fixed solicitor fee plus $215 court fee) buys permanent legal finality. Informal notes will not stop an ex-partner coming back for a second bite months later. Lopsided Binding Financial Agreements pressed onto a visa-dependent or financially weaker partner are also regularly set aside for undue influence and unconscionable conduct, even where independent legal advice was given, as the High Court held in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2017/49.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Thorne v Kennedy<\/em> [2017] HCA 49<\/a> ([1], [38], [56], [64]). Properly drafted Consent Orders lock in s 79 or s 90SM finality, trigger state stamp-duty exemptions on house transfers, and handle mandatory 28-day superannuation trustee splits.<\/p>\n<p class=\"doc-p\">Second, targeted representation breaks deadlocks when an ex-partner goes silent or hides balances. A former spouse who ignores personal text messages rarely ignores a formal Solicitor&#x27;s Demand enforcing s 71B or s 90RI worldwide financial disclosure and putting them on notice of adverse costs orders if they force an unnecessary court filing.<\/p>\n<p class=\"doc-p\">Rather than burning billable hours on open-ended preliminary emails, lodge your key dates and asset snapshot once through the <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Family Law Consultation Form<\/a> or visit the <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Official Links Hub<\/a> so our team can run conflict checks and map out the most cost-effective settlement track.<\/p>\n\n          <div class=\"col-sources-box\">\n            Primary Authorities: Family Law Act 1975 (Cth) (s 48, s 60CA, s 60CC(2), s 60I, s 65DAAA, s 98A) \u00b7 FCFCOA Annual Report 2025\u201326 (Oct 2026) \u00b7 ABS Marriages and Divorces 2025 \u00b7 Federal Court &amp; FCFCOA Fee Gazette C2026G00343 (eff. 1 July 2026).\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#E6C98C;\">WHEN TO CONSULT PARK &amp; CO LAWYERS \u00b7 FAMILY LAW<\/span>\n            <h3 class=\"col-cta-title\">Ready to Lock In $4,950 Consent Orders, Compel Disclosure, or Protect Family Assets?<\/h3>\n            <p class=\"col-cta-desc\">Save thousands on straightforward No-Fault Divorce using our DIY manual; when you need enforceable Consent Orders, formal financial disclosure demands, or cross-border property protection, submit your key dates via our 3-minute consultation form.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">Open Family Law Consultation Form<\/a>\n              <a href=\"../../files/EN/PDF/03_Family_Law_Divorce_Property_Parenting_and_Settlement_Manual_2026_EN.pdf\" download class=\"col-btn-ghost\">Download Manual 03 (Family Law PDF)<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=en\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">Park &amp; Co Official Consultation Hub<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">Legal Disclaimer: This publication provides general legal information grounded in Australian legislation, official statistics and superior court authorities current as at November 2026. It does not constitute legal advice for your specific circumstances or create a solicitor-client relationship. Seek formal advice promptly before statutory limitation or visa deadlines expire.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">More Curated Family Law Columns<\/h3>\n        <a href=\"../../?lang=en&amp;tab=family\" class=\"col-back-link num\">\u2190 Back to Family Law Self-Help Hub<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../property-reforms-2026/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">2025\u20132026 REFORM BRIEFING \u00b7 FAMILY 01<\/span><h4 class=\"col-sib-title\">Australia&#x27;s 2025\u20132026 Property Settlement Overhaul: Economic Abuse, Separate Accounts, Family Pets &amp; Limitation Bars<\/h4><p class=\"col-sib-desc\">Covers the abolition of balance-sheet add-backs, s 4AB(2A) economic abuse proof thresholds, separate accounts and overseas assets under s 71B, the ban on shared pet custody, and strict s 44 time bars.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../partner-visa-breakdown-crossborder/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">FAMILY y, and how $4,950 Consent Orders close the door.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../prenups-bfa-vs-consent-orders/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PRENUPS &amp; CONSENT ORDERS \u00b7 FAMILY 17<\/span><h4 class=\"col-sib-title\">Why Prenups Get Crushed Under Thorne v Kennedy and When $4,950 Consent Orders Beat a BFA<\/h4><p class=\"col-sib-desc\">Explains how pre-marital wealth-protection BFAs survive scrutiny and why separated couples who agree save thousands with fixed-fee $4,950 Court Consent Orders.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../de-facto-threshold-disputes-out-of-time-s44/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">DE FACTO &amp; TIME BARS \u00b7 FAMILY 18<\/span><h4 class=\"col-sib-title\">&quot;Were We Even De Facto?&quot; Litigating s 4AA Thresholds, Concurrent Marriages and Out-of-Time Leave<\/h4><p class=\"col-sib-desc\">Why a 17-year secret relationship with monthly allowances failed s 4AA, when concurrent marriages still allow de facto claims, and how courts weigh s 44 hardship and delay.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}}</script>

          return 'other-web';
        }
      }
      if (/KAKAOTALK/i.test(ua)) return 'kakaotalk';
      if (/NAVER\(inapp/i.test(ua)) return 'naver-search';
      if (/Barcelona|Threads|Instagram/i.test(ua)) return 'threads-ig';
    } catch (e) {}
    return 'direct';
  }

  function fmt(n) { return typeof n === 'number' && !isNaN(n) ? Number(n).toLocaleString('en-AU') : '-'; }

  function renderBadge(tot, tod, vis) {
    var elTot = document.getElementById('vc-total');
    var elTod = document.getElementById('vc-today');
    var elVis = document.getElementById('vc-visitors');
    if (tot != null && elTot) elTot.textContent = fmt(tot);
    if (tod != null && elTod) elTod.textContent = fmt(tod);
    if (vis != null && elVis) elVis.textContent = fmt(vis);
    if (tot != null || tod != null || vis != null) box.hidden = false;
  }

  var seedTot = Number(box.getAttribute('data-seed-total')) || LEGACY_TOTAL || 0;
  var seedVis = Number(box.getAttribute('data-seed-visitors')) || LEGACY_VIS || 0;
  var initTot = Math.max(cached.total || 0, seedTot) || null;
  var initVis = Math.max(cached.visitors || 0, seedVis) || null;
  if (initTot != null || initVis != null) {
    renderBadge(initTot, liveTodayViews, initVis);
  }

  /* 429-aware retry spanning >15s across retries to cleanly outlast Abacus 30;w=10 windows */
  function fetchRetry(url, isHit, attempt) {
    var tries = attempt || 0;
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 15000) : null;
    var opts = { mode: 'cors' };
    if (ctrl) opts.signal = ctrl.signal;
    if (isHit) opts.keepalive = true;
    return fetch(url, opts)
      .then(function (r) {
        if (timer) clearTimeout(timer);
        if (!isHit && r.status === 404) return { value: 0 };
        if (r.status === 429) {
          var err429 = new Error('HTTP 429');
          err429.isRateLimit = true;
          throw err429;
        }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (j) {
        if (typeof j.value !== 'number') throw new Error('bad payload');
        return j.value;
      })
      .catch(function (err) {
        if (timer) clearTimeout(timer);
        var maxTries = (err && err.isRateLimit) ? 3 : 2;
        if (tries < maxTries) {
          var waitMs = (err && err.isRateLimit) ? (3800 + tries * 3600) : (1100 * (tries + 1));
          return new Promise(function (res) { setTimeout(res, waitMs); })
            .then(function () { return fetchRetry(url, isHit, tries + 1); });
        }
        throw err;
      });
  }

  function call(kind, key) {
    return fetchRetry(API + kind + '/' + NS + '/' + P + '-' + key, kind === 'hit', 0);
  }
  function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  if (lastDay !== day) {
    call('hit', 'vday-' + day).then(function (v) {
      liveTodayVis = v;
      try {
        localStorage.setItem(P + '-day', day);
        var cur = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}') || {};
        cur.todayVis = v;
        cur.day = day;
        localStorage.setItem(CACHE_KEY, JSON.stringify(cur));
      } catch (e) {}
    }).catch(function () {});
  }

  if (lastRefDay !== day) {
    var refBucket = classifyReferralBucket();
    delay(220).then(function () {
      return call('hit', 'ref-' + refBucket + '-' + day);
    }).then(function (rv) {
      liveRefHints[refBucket] = rv;
      try {
        localStorage.setItem(P + '-ref-day', day);
        localStorage.setItem(P + '-ref-bucket', refBucket);
      } catch (e) {}
    }).catch(function () {});
  }

  Promise.allSettled([
    call('hit', 'total'),
    delay(80).then(function () { return call('hit', 'day-' + day); }),
    delay(160).then(function () {
      return call(seen ? 'get' : 'hit', 'visitors').then(function (val) {
        if (!seen) {
          try { localStorage.setItem(P + '-seen', '1'); } catch (e) {}
        }
        return val;
      });
    })
  ]).then(function (res) {
    var tot = res[0].status === 'fulfilled' ? (res[0].value + LEGACY_TOTAL) : initTot;
    var tod = res[1].status === 'fulfilled' ? res[1].value : liveTodayViews;
    var vis = res[2].status === 'fulfilled' ? (res[2].value + LEGACY_VIS) : initVis;
    if (typeof tod === 'number') liveTodayViews = tod;
    renderBadge(tot, tod, vis);
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        total: tot != null ? tot : initTot,
        today: tod != null ? tod : liveTodayViews,
        todayVis: liveTodayVis,
        visitors: vis != null ? vis : initVis,
        day: day
      }));
    } catch (e) {}
  });

  function lastDays(n) {
    var p = today.split('-').map(Number), base = Date.UTC(p[0], p[1] - 1, p[2]), out = [];
    for (var i = n - 1; i >= 0; i--) {
      var s = new Date(base - i * 864e5).toISOString().slice(0, 10);
      if (s >= START) out.push(s);
    }
    return out.length ? out : [today];
  }

  var activeRange = 7;
  var modal = document.createElement('div');
  modal.id = 'vc-modal';
  modal.innerHTML = '<div class="vc-dialog" role="dialog" aria-modal="true" aria-labelledby="vc-modal-title">' +
    '<button type="button" class="vc-close" aria-label="Close">&times;</button>' +
    '<h3 id="vc-modal-title"></h3>' +
    '<div class="vc-body">Loading&hellip;</div></div>';
  document.body.appendChild(modal);
  syncCounterLang();

  function close() { modal.classList.remove('open'); }
  modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
  modal.querySelector('.vc-close').addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

  function copyShareLink(refCode, btnEl) {
    try {
      var u = new URL(location.href);
      u.searchParams.delete('utm_source');
      u.searchParams.set('ref', refCode);
      var text = u.toString();
      var done = function () {
        if (!btnEl) return;
        var prev = btnEl.getAttribute('data-orig') || btnEl.textContent;
        btnEl.setAttribute('data-orig', prev);
        btnEl.textContent = uiLang() === 'en' ? 'Copied ✓' : '복사됨 ✓';
        setTimeout(function () { btnEl.textContent = prev; }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () {});
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      }
    } catch (e) {}
  }

  modal.addEventListener('click', function (e) {
    var chip = e.target && e.target.closest ? e.target.closest('.vc-share-chip') : null;
    if (chip) {
      var rc = chip.getAttribute('data-ref-code');
      if (rc) copyShareLink(rc, chip);
      return;
    }
    var rbtn = e.target && e.target.closest ? e.target.closest('.vc-range-btn') : null;
    if (rbtn) {
      var nr = Number(rbtn.getAttribute('data-range')) || 7;
      if (nr !== activeRange) {
        activeRange = nr;
        loadAndRenderModal(false);
      }
    }
  });

  function renderShareBar(isEn) {
    var lbl = isEn
      ? 'Copy Tracked Referral Share Link (?ref=)'
      : '채널별 유입 측정 공유 링크 복사 (?ref=)';
    var chips = SHARE_CHANNELS.map(function (c) {
      var name = isEn ? c.en : c.ko;
      return '<button type="button" class="vc-share-chip" data-ref-code="' + c.ref + '">' +
        name + ' (?ref=' + c.ref + ')</button>';
    }).join('');
    return '<div id="vc-share-box" class="vc-share-box"><div class="vc-share-lbl">' + lbl +
      '</div><div class="vc-share-chips">' + chips + '</div></div>';
  }

  function renderToolbar(isEn, fullDaysLen) {
    if (fullDaysLen <= 7) return '';
    var b7 = '<button type="button" class="vc-range-btn' + (activeRange === 7 ? ' active' : '') + '" data-range="7">' +
      (isEn ? 'Last 7 days' : '최근 7일') + '</button>';
    var b30 = '<button type="button" class="vc-range-btn' + (activeRange === 30 ? ' active' : '') + '" data-range="30">' +
      (isEn ? 'Last 30 days' : '최근 30일') + '</button>';
    return '<div class="vc-toolbar"><div class="vc-range-tabs">' + b7 + b30 + '</div></div>';
  }

  function renderChartSvg(days, rows, isEn) {
    var W = 640, H = 240, L = 40, R = 12, T = 14, B = 38;
    var max = Math.max(1, Math.max.apply(null, rows.map(function (r) { return Math.max(r[0], r[1]); })));
    var step = (W - L - R) / days.length, bw = Math.min(36, Math.max(4, step * 0.6));
    var y = function (v) { return T + (H - T - B) * (1 - v / max); };
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="vc-svg" role="img" aria-label="Daily visits chart">';
    [0, 0.5, 1].forEach(function (f) {
      var v = Math.round(max * f), yy = y(v);
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" class="vc-grid"/>' +
        '<text x="' + (L - 6) + '" y="' + (yy + 4) + '" class="vc-ylab">' + fmt(v) + '</text>';
    });
    var pts = [];
    days.forEach(function (d, i) {
      var cx = L + step * i + step / 2, views = rows[i][0], vis = rows[i][1];
      svg += '<rect x="' + (cx - bw / 2) + '" y="' + y(views) + '" width="' + bw + '" height="' +
        (H - B - y(views)) + '" class="vc-bar"><title>' + d + ': ' + fmt(views) + (isEn ? ' page views' : '회 조회') + '</title></rect>';
      pts.push(cx + ',' + y(vis));
      if (days.length <= 10 || i % Math.ceil(days.length / 8) === 0 || i === days.length - 1)
        svg += '<text x="' + cx + '" y="' + (H - B + 16) + '" class="vc-xlab">' + d.slice(5) + '</text>';
    });
    svg += '<polyline points="' + pts.join(' ') + '" class="vc-line"/>';
    pts.forEach(function (p, i) {
      var xy = p.split(',');
      svg += '<circle cx="' + xy[0] + '" cy="' + xy[1] + '" r="3.5" class="vc-dot"><title>' + days[i] + ': ' +
        fmt(rows[i][1]) + (isEn ? ' visitors' : '명 방문자') + '</title></circle>';
    });
    svg += '</svg>';
    var sum = rows.reduce(function (a, r) { return [a[0] + r[0], a[1] + r[1]]; }, [0, 0]);
    var summaryLine = isEn
      ? (days.length + ' day(s) &middot; ' + fmt(sum[0]) + ' page views &middot; ' + fmt(sum[1]) + ' daily visitors (since ' + START + '; 1 daily visitor per browser).')
      : ('표시 구간 ' + days.length + '일 합계 &middot; 페이지 조회 ' + fmt(sum[0]) + '회 &middot; 일별 순방문자 ' + fmt(sum[1]) + '명 (' + START + ' 집계 시작 &middot; 하루 브라우저당 1회)');
    return svg + '<div class="vc-legend"><span><i class="vc-k-bar"></i>' + (isEn ? 'Page views' : '페이지 조회') + '</span>' +
      '<span><i class="vc-k-line"></i>' + (isEn ? 'Daily visitors' : '일별 순방문자') + '</span></div>' +
      '<p class="vc-sum">' + summaryLine + '</p>';
  }

  function loadTodayReferrers(dayKey) {
    if (liveTodayViews === 0 && liveTodayVis === 0) {
      return Promise.resolve({});
    }
    var out = {};
    var remaining = [];
    REF_BUCKETS.forEach(function (b) {
      if (typeof liveRefHints[b.id] === 'number') {
        out[b.id] = liveRefHints[b.id];
      } else {
        remaining.push(b);
      }
    });
    var firstSlice = remaining.slice(0, 6);
    var secondSlice = remaining.slice(6);
    return Promise.all(firstSlice.map(function (b) {
      return call('get', 'ref-' + b.id + '-' + dayKey).catch(function () { return 0; }).then(function (v) { out[b.id] = v || 0; });
    })).then(function () {
      return secondSlice.length ? delay(260) : Promise.resolve();
    }).then(function () {
      return Promise.all(secondSlice.map(function (b) {
        return call('get', 'ref-' + b.id + '-' + dayKey).catch(function () { return 0; }).then(function (v) { out[b.id] = v || 0; });
      }));
    }).then(function () {
      return out;
    });
  }

  function renderReferrerBox(countsMap) {
    var isEn = uiLang() === 'en';
    var items = REF_BUCKETS.map(function (b) {
      return { id: b.id, label: isEn ? b.en : b.ko, count: countsMap[b.id] || 0 };
    }).filter(function (x) { return x.count > 0; }).sort(function (a, b) { return b.count - a.count; });
    var totalRef = items.reduce(function (acc, x) { return acc + x.count; }, 0);
    var head = '<div class="vc-ref-title"><span>' +
      (isEn ? ('Today&rsquo;s Referral Channels (' + today + ')') : ('오늘 유입 채널 분포 (' + today + ')')) +
      '</span><small>' + (isEn ? ('Tracked visitors: ' + fmt(totalRef)) : ('채널 집계 방문자: ' + fmt(totalRef) + '명')) + '</small></div>';
    if (!items.length) {
      return head + '<p class="vc-ref-note">' +
        (isEn
          ? 'Anonymous referral channel buckets (Naver, Cafe, KakaoTalk, Threads, Hub, Direct) are recorded once per browser per day as new visits arrive (zero personal or URL path data stored).'
          : '익명 유입 경로(검색·카페·카카오톡·스레드·허브 이동 등) 집계는 신규 방문부터 하루 브라우저당 1회씩 기록됩니다 (세부 URL·개인정보 미수집).') +
        '</p>';
    }
    var rowsHtml = items.map(function (item) {
      var pct = totalRef > 0 ? Math.round((item.count / totalRef) * 100) : 0;
      return '<div class="vc-ref-row">' +
        '<span class="vc-ref-name" title="' + item.label + '">' + item.label + '</span>' +
        '<div class="vc-ref-track"><div class="vc-ref-fill" style="width:' + Math.max(4, pct) + '%"></div></div>' +
        '<span class="vc-ref-val">' + fmt(item.count) + ' (' + pct + '%)</span>' +
        '</div>';
    }).join('');
    var note = isEn
      ? 'Privacy-safe coarse channel buckets only (1 per browser/day; zero IP, query string, or full referrer URL stored).'
      : '개인정보 보호형 채널 그룹 집계 (하루 브라우저당 1회 기준 &middot; 검색어·세부 URL·IP 미수집)';
    return head + '<div class="vc-ref-list">' + rowsHtml + '</div><p class="vc-ref-note">' + note + '</p>';
  }

  function loadHistoryRows(days) {
    var histCache = {};
    try { histCache = JSON.parse(localStorage.getItem(HIST_KEY) || '{}') || {}; } catch (e) {}
    var results = new Array(days.length);
    var pending = [];
    days.forEach(function (d, idx) {
      if (d < today && Array.isArray(histCache[d])) {
        results[idx] = histCache[d];
      } else if (d === today && typeof liveTodayViews === 'number' && typeof liveTodayVis === 'number') {
        results[idx] = [liveTodayViews, liveTodayVis];
      } else {
        pending.push({ d: d, idx: idx });
      }
    });

    var batchSize = pending.length > 7 ? 4 : 6;
    var pauseMs = pending.length > 7 ? 2900 : 180;
    var chain = Promise.resolve();
    for (var c = 0; c < pending.length; c += batchSize) {
      (function (slice, waitFirst) {
        chain = chain.then(function () {
          return (waitFirst ? delay(pauseMs) : Promise.resolve()).then(function () {
            return Promise.all(slice.map(function (item) {
              var k = item.d.replace(/-/g, '');
              var pViews = (item.d === today && typeof liveTodayViews === 'number')
                ? Promise.resolve(liveTodayViews)
                : call('get', 'day-' + k).catch(function () { return null; });
              var pVis = (item.d === today && typeof liveTodayVis === 'number')
                ? Promise.resolve(liveTodayVis)
                : call('get', 'vday-' + k).catch(function () { return null; });
              return Promise.all([pViews, pVis]).then(function (pair) {
                var v0 = pair[0] == null ? 0 : pair[0];
                var v1 = pair[1] == null ? 0 : pair[1];
                results[item.idx] = [v0, v1];
                if (item.d < today && pair[0] !== null && pair[1] !== null) {
                  histCache[item.d] = [v0, v1];
                }
              });
            }));
          });
        });
      })(pending.slice(c, c + batchSize), c > 0);
    }
    return chain.then(function () {
      try { localStorage.setItem(HIST_KEY, JSON.stringify(histCache)); } catch (e) {}
      return results.map(function (r) { return r || [0, 0]; });
    });
  }

  var cachedRefMap = null;

  function loadAndRenderModal(refreshRefs) {
    syncCounterLang();
    var isEn = uiLang() === 'en';
    var fullDays = lastDays(30);
    var days = activeRange === 7 ? lastDays(7) : fullDays;
    var body = modal.querySelector('.vc-body');
    var chartWaitMsg = isEn ? 'Loading daily statistics&hellip;' : '일별 통계를 불러오는 중입니다&hellip;';
    var refWaitMsg = isEn ? 'Loading today&rsquo;s referral channels&hellip;' : '오늘 유입 채널 집계를 불러오는 중입니다&hellip;';
    var existingRefHtml = (!refreshRefs && cachedRefMap) ? renderReferrerBox(cachedRefMap) : ('<div class="vc-ref-note">' + refWaitMsg + '</div>');

    /* Render toolbar, loading placeholder, referral box, and 1-click share bar IMMEDIATELY (0ms) */
    body.innerHTML = renderToolbar(isEn, fullDays.length) +
      '<div id="vc-chart-slot"><p class="vc-sum">' + chartWaitMsg + '</p></div>' +
      '<div id="vc-ref-box" class="vc-ref-box">' + existingRefHtml + '</div>' +
      renderShareBar(isEn);

    loadHistoryRows(days)
      .then(function (rows) {
        var slot = document.getElementById('vc-chart-slot');
        if (slot) slot.innerHTML = renderChartSvg(days, rows, uiLang() === 'en');
        if (!refreshRefs && cachedRefMap) return cachedRefMap;
        return delay(180).then(function () { return loadTodayReferrers(day); });
      })
      .then(function (refMap) {
        if (refMap) cachedRefMap = refMap;
        var refBox = document.getElementById('vc-ref-box');
        if (refBox && refMap) refBox.innerHTML = renderReferrerBox(refMap);
      })
      .catch(function () {
        var slot = document.getElementById('vc-chart-slot');
        if (slot && !slot.querySelector('svg')) {
          slot.textContent = uiLang() === 'en' ? 'Could not load the chart.' : '그래프를 불러오지 못했습니다.';
        }
      });
  }

  function open() {
    activeRange = 7;
    modal.classList.add('open');
    loadAndRenderModal(true);
  }
  box.setAttribute('role', 'button');
  box.setAttribute('tabindex', '0');
  box.addEventListener('click', open);
  box.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
})();
  </script>
</body>
