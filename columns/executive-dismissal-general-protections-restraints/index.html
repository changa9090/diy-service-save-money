4 \uc77c\uae4c\uc9c0 \uacb9\uce58\uace4 \ud558\uc8e0. \uace0\uc5f0\ubd09 \uc784\uc6d0 \ubd84\uc7c1\uc740 \uccab \ub2e8\ucd94\uc5d0 \ub530\ub77c \uac70\uc561 \ud569\uc758\uc640 \uc18c\uc1a1 \uc218\ub801\uc73c\ub85c \uac08\ub77c\uc838\uc694.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 382\" width=\"100%\" role=\"img\" aria-label=\"\ubb34\uc81c\ud55c \ubc30\uc0c1(General Protections) \uc785\uc99d \ud604\uc2e4 vs \uc8fc\ubcc4 \uacbd\uc5c5\uae08\uc9c0 \ud6a8\ub825\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"381\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">\uc784\uc6d0\u00b7\uace0\uc5f0\ubd09\uc790 \ubd84\uc7c1 \u00b7 $190,100 \uae30\uc900\uc120\uacfc \uc77c\ubc18\ubcf4\ud638\u00b7\uacbd\uc5c5\uae08\uc9c0 \ubc95\ub9ac<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">\ubb34\uc81c\ud55c \ubc30\uc0c1(General Protections) \uc785\uc99d \ud604\uc2e4 vs \uc8fc\ubcc4 \uacbd\uc5c5\uae08\uc9c0 \ud6a8\ub825<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">\uadfc\uac70: FWA ss 340, 361, 382 \u00b7 Roohizadegan (No 6) [2025] FCA 1619 \u00b7 Just Group [2016] VSCA 334<\/text>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"38\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">\uc7c1\uc810 1 \u00b7 \uc77c\ubc18\ubcf4\ud638(s 340) \uc5ed\uc785\uc99d\ucc45\uc784\uc758 \ub0c9\uc815\ud55c \ud604\uc2e4<\/text>\n  <circle cx=\"42\" cy=\"144\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\uc5f0\ubd09 $190,100+ \uc784\uc6d0\uc740 \uc77c\ubc18 \ubd80\ub2f9\ud574\uace0 \uc81c\uc678<\/text>\n  <text x=\"54\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">\uc5b4\uc6cc\ub4dc \ubbf8\uc801\uc6a9 \uace0\uc5f0\ubd09\uc790\ub294 s 340 \uc77c\ubc18\ubcf4\ud638\u00b7\uacc4\uc57d\uc704\ubc18\uc73c\ub85c\ub9cc \ub2e4\ud23d\ub2c8\ub2e4.<\/text>\n  <circle cx=\"42\" cy=\"196\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">$520\ub9cc \uc2b9\uc18c \ud310\uacb0 \ud30c\uae30 \ud6c4 \ucd5c\uc885 \ud328\uc18c (Roohizadegan)<\/text>\n  <text x=\"54\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">[2025] FCA 1619 \uc7ac\uc2ec\ub9ac\uc5d0\uc11c \uc131\uacfc\u00b7\ud488\uc704 \uc0ac\uc720 \uc778\uc815\ub418\uc5b4 \uccad\uad6c \uae30\uac01 + \uc18c\uc1a1\ube44 \ud328\uc18c.<\/text>\n  <circle cx=\"42\" cy=\"248\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\uacb0\uc815\uad8c\uc790\uc758 \uc8fc\uad00\uc801 \ud574\uace0 \ub3d9\uae30 \uc785\uc99d (Barclay)<\/text>\n  <text x=\"54\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">\ubd88\ub9cc \uc81c\uae30\uc640 \ud574\uace0 \uc0ac\uc774\uc758 \uc778\uacfc\uad00\uacc4\uac00 \uac1d\uad00\uc801 \uc778\uc0ac\uae30\ub85d\uc73c\ub85c \ubc18\ubc15\ub418\uba74 \ud328\uc18c.<\/text>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"466\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">\uc7c1\uc810 2 \u00b7 \ud1f4\uc0ac \ud6c4 \uacbd\uc5c5\uae08\uc9c0(Restraint) \uc8fc\ubcc4 \ud6a8\ub825<\/text>\n  <circle cx=\"470\" cy=\"144\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">QLD \u00b7 VIC \ucee4\uba3c\ub85c: \uc6d0\uce59\uc801 \ubb34\ud6a8 (Prima Facie Void)<\/text>\n  <text x=\"482\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">\uc815\ub2f9\ud55c \uc601\uc5c5\uc774\uc775 \ubcf4\ud638 \ubc94\uc704\ub97c \ub118\uc73c\uba74 \ubb38\uad6c \uc0ad\uc81c(Blue-pencil) \uc678 \uc804\ubd80 \ubb34\ud6a8.<\/text>\n  <circle cx=\"470\" cy=\"196\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">NSW \ub2e8\ub3c5 \uc608\uc678: \ubc95\uc6d0 \uc9c1\uad8c \ucd95\uc18c \uc720\ud6a8\ud654 (s 4(1))<\/text>\n  <text x=\"482\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">Restraints of Trade Act 1976 (NSW)\ub294 \uacfc\ub3c4\ud55c \uc57d\uc815\ub3c4 \ud569\ub9ac\uc801 \ubc94\uc704\ub85c \uac10\ucd95 \uc9d1\ud589.<\/text>\n  <circle cx=\"470\" cy=\"248\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">2026.9 \uc5f0\ubc29 \uc7ac\ubb34\ubd80 \uacbd\uc5c5\uae08\uc9c0 \uae08\uc9c0 \ubc95\uc548 \ucd08\uc548<\/text>\n  <text x=\"482\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">2027\ub144 \uc2dc\ud589 \ubaa9\ud45c\ub85c $190,100 \ubbf8\ub9cc \uadfc\ub85c\uc790 \uacbd\uc5c5\uae08\uc9c0 \ubc0f \uacc4\ub2e8\uc2dd \uc870\ud56d \uc804\uba74 \uae08\uc9c0 \ucd94\uc9c4.<\/text>\n  <rect x=\"22\" y=\"328\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"351\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1D6B48\">\uc2e4\ubb34 \ud575\uc2ec: \uc784\uc6d0 \ud574\uace0 \uc804 \uc774\uc0ac\ud68c \ubb38\uc11c \uc124\uacc4\uc640 \uc774\uc9c1 \uc2dc \uc8fc(QLD vs NSW) \uad00\ud560\uc5d0 \ub9de\ucd98 \uacbd\uc5c5\uae08\uc9c0 \uac00\ucc98\ubd84 \ubc29\uc5b4\ub294 \ucd08\uae30 48\uc2dc\uac04 \ub0b4\uc5d0 \uacb0\uc815\ub429\ub2c8\ub2e4.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 1: \uace0\uc5f0\ubd09($190,100+) \uc784\uc6d0 \ud574\uace0 \uc2dc \uc77c\ubc18\ubcf4\ud638 \uc785\uc99d \uad6c\uc870\uc640 \uc8fc\ubcc4 \uacbd\uc5c5\uae08\uc9c0 \ud6a8\ub825 \ube44\uad50<\/figcaption><\/figure>\n<h2 id=\"2026\ub144-7\uc6d4-\uace0\uc18c\ub4dd-\uae30\uc900\uc120-190100-\uc778\uc0c1\uacfc-\ubd80\ub2f9\ud574\uace0-\ubb38\ud131\uc758-\ucc28\ub2e8\" class=\"doc-h2\">2026\ub144 7\uc6d4 \uace0\uc18c\ub4dd \uae30\uc900\uc120 $190,100 \uc778\uc0c1\uacfc \ubd80\ub2f9\ud574\uace0 \ubb38\ud131\uc758 \ucc28\ub2e8<\/h2>\n<p class=\"doc-p\">\uac00\uc7a5 \uba3c\uc800 \ubcfc \uc22b\uc790\ub294 \uacf5\uc815\uadfc\ub85c\ubc95(Fair Work Act 2009, FWA)\uc0c1 \uace0\uc18c\ub4dd \uae30\uc900\uc561(High Income Threshold)\uc774\uc5d0\uc694. 2026\ub144 7\uc6d4 1\uc77c\ubd80\ub85c \uc774 \uae30\uc900\uc120(ss 333, 382(b)(iii))\uc774 \uc5f0 $190,100\uc73c\ub85c \uc62c\ub790\uc5b4\uc694. \uc77c\ubc18 \ubd80\ub2f9\ud574\uace0(Unfair Dismissal)\uc758 \uacf5\uc815\uadfc\ub85c\uc704\uc6d0\ud68c(FWC) \ubc30\uc0c1 \uc0c1\ud55c(s 392(5))\uc740 \uc808\ubc18\uc778 $95,050\uc774\uc5d0\uc694. \ub178\uc0ac\ud611\uc57d(Award) \uc81c\uc678 \uc784\uc6d0\uc758 \ud655\uc815 \uc5f0\uac04 \ubcf4\uc218(\ubc95\uc815 \uc5f0\uae08\u00b7\ubd88\ud655\uc815 \uc131\uacfc\uae09 \uc81c\uc678, \ud655\uc815 \ucc28\ub7c9 \uc218\ub2f9 \ud3ec\ud568)\uac00 $190,100 \uc774\uc0c1\uc774\uba74 \uc5b4\ub5a8\uae4c\uc694? \uc77c\ubc18 \ubd80\ub2f9\ud574\uace0 \ubb38\ud131 \uc790\uccb4\uac00 \uc6d0\ucc9c \ucc28\ub2e8\ub3fc\uc694.<\/p>\n<p class=\"doc-p\">\uacb0\uad6d \uace0\uc5f0\ubd09\uc790\uac00 \uc958 \uacf5\uaca9 \uce74\ub4dc\ub294 \ub450 \uac08\ub798\ubfd0\uc774\uc5d0\uc694. \uccab\uc9f8\ub294 \uc608\uace0\uae30\uac04(notice period)\uc774\ub098 \ud655\uc815 \uc778\uc13c\ud2f0\ube0c \ubbf8\uc9c0\uae09\uc744 \ub2e4\ud22c\ub294 \ubcf4\ud1b5\ubc95\uc0c1 \uace0\uc6a9\uacc4\uc57d \uc704\ubc18 \uccad\uad6c\uc608\uc694. \ub458\uc9f8\ub294 \ubc30\uc0c1 \uc0c1\ud55c\uc774 \uc5c6\ub294 FWA s 545 \uc190\ud574\ubc30\uc0c1\uc744 \uaca8\ub0e5\ud55c \uc77c\ubc18\ubcf4\ud638(General Protections, s 340) \uc18c\uc1a1\uc774\uc8e0. \ud574\uace0\uac00 \uc218\ubc18\ub41c \uc77c\ubc18\ubcf4\ud638 \uc2e0\uccad(Form F8) \uc5ed\uc2dc \ud574\uace0\uc77c\ub85c\ubd80\ud130 \ub2ec\ub825 21\uc77c \uc548\uc5d0 FWC\ub97c \uac70\uccd0\uc57c \ud574\uc694.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"4\"><thead><tr><th style=\"text-align:left\">\uc7c1\uc810 \uad6c\ubd84<\/th><th style=\"text-align:left\">\uadfc\uac70 \ubc95\ub839 \ubc0f \uad00\ud560<\/th><th style=\"text-align:left\">\ud575\uc2ec \uc218\uce58\u00b7\ubc95\ub9ac \uae30\uc900<\/th><th style=\"text-align:left\">\uc784\uc6d0\u00b7\uae30\uc5c5 \uc2e4\ubb34 \uc2dc\uc0ac\uc810<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>\ubd80\ub2f9\ud574\uace0 \uad6c\uc81c<\/strong><\/td><td style=\"text-align:left\">FWA ss 382(b)(iii), 392(5) \u00b7 FWC<\/td><td style=\"text-align:left\">\uc5f0\ubd09 $190,100 \ubbf8\ub9cc \u00b7 \uc0c1\ud55c $95,050<\/td><td style=\"text-align:left\">\uc5b4\uc6cc\ub4dc \uc81c\uc678 \uace0\uc5f0\ubd09 \uc784\uc6d0\uc740 \uc2e0\uccad \uc790\uaca9 \uc6d0\ucc9c \ubc30\uc81c<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc77c\ubc18\ubcf4\ud638 \uc18c\uc1a1<\/strong><\/td><td style=\"text-align:left\">FWA ss 340, 361, 545 \u00b7 \uc5f0\ubc29\ubc95\uc6d0<\/td><td style=\"text-align:left\">\ubc30\uc0c1 \ubb34\uc81c\ud55c \u00b7 s 361 \uc785\uc99d \uc804\ud658 (<em>Barclay<\/em>)<\/td><td style=\"text-align:left\">\uc758\uc0ac\uacb0\uc815\uad8c\uc790\uc758 \uc801\ubc95\ud55c \uc8fc\uad00\uc801 \ub3d9\uae30 \uc785\uc99d \uc2dc \uae30\uac01<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc7a5\ub798 \uad8c\ub9ac \ubcf4\ud638<\/strong><\/td><td style=\"text-align:left\">FWA s 340(1)(b) \u00b7 <em>Qantas v TWU<\/em><\/td><td style=\"text-align:left\">\uc7a5\ub798 \uc9c1\uc7a5 \uad8c\ub9ac \uc0ac\uc804 \ubd09\uc1c4\ub3c4 \uc704\ubc95<\/td><td style=\"text-align:left\">\ubcf4\ub108\uc2a4 \ub3c4\ub798\u00b7\ud734\uc9c1\u00b7\uad50\uc12d \uc9c1\uc804 \uc120\uc81c \ud574\uace0 \uc2dc \uace0\uc704\ud5d8<\/td><\/tr><tr><td style=\"text-align:left\"><strong>QLD\u00b7VIC \uacbd\uc5c5\uae08\uc9c0<\/strong><\/td><td style=\"text-align:left\">\ubcf4\ud1b5\ubc95 \u00b7 <em>Just Group<\/em> \u00b7 <em>AECI<\/em><\/td><td style=\"text-align:left\">\uc6d0\uce59 \ubb34\ud6a8 \u00b7 \uccad\uc0c9 \uc5f0\ud544(blue-pencil) \uc808\ub2e8<\/td><td style=\"text-align:left\">\uacfc\ub3c4\ud55c \ubb38\uad6c\ub97c \ubc95\uc6d0\uc774 \uc784\uc758\ub85c \ucd95\uc18c \uc218\uc815 \ubd88\uac00<\/td><\/tr><tr><td style=\"text-align:left\"><strong>NSW \ubc0f 2026 \uac1c\ud3b8\uc548<\/strong><\/td><td style=\"text-align:left\">Restraints of Trade Act 1976 (NSW) s 4(1)<\/td><td style=\"text-align:left\">NSW \ucd95\uc18c \uc801\uc6a9(read-down) \u00b7 $190,100 \ubbf8\ub9cc \uae08\uc9c0\uc548<\/td><td style=\"text-align:left\">\uace0\uc5f0\ubd09 \uc784\uc6d0\uc740 \uac00\ucc98\ubd84 \uc874\uc18d \u00b7 \ub2e8\uacc4\ud615 \uc870\ud56d \ud3d0\uc9c0 \uc608\uace0<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"\uc77c\ubc18\ubcf4\ud638general-protections-\uc785\uc99d\ucc45\uc784-\uc804\ud658s-361\uc758-\ube5b\uacfc-\uadf8\ub9bc\uc790\" class=\"doc-h2\">\uc77c\ubc18\ubcf4\ud638(General Protections) \uc785\uc99d\ucc45\uc784 \uc804\ud658(s 361)\uc758 \ube5b\uacfc \uadf8\ub9bc\uc790<\/h2>\n<p class=\"doc-p\">\uc784\uc6d0\ub4e4\uc774 \uc77c\ubc18\ubcf4\ud638 \uc18c\uc1a1\uc744 \ud0dd\ud558\ub294 \uc774\uc720\ub294 \ubb34\uc81c\ud55c \ubc30\uc0c1\uacfc FWA s 361 \uc785\uc99d\ucc45\uc784 \uc804\ud658 \ub54c\ubb38\uc774\uc5d0\uc694. \uadfc\ub85c\uc790\uac00 \uc9c1\uc7a5 \ub0b4 \uad8c\ub9ac \ud589\uc0ac(\uc608\ucee8\ub300 s 341(1)(c)(ii)\uc0c1 \uc815\ub2f9\ud55c \ubd88\ub9cc \uc81c\uae30)\uc640 \ud574\uace0 \uc0ac\uc2e4\uc744 \uc18c\uba85\ud558\uba74 \uc785\uc99d \ubd80\ub2f4\uc774 \ud68c\uc0ac\ub85c \ub118\uc5b4\uac00\uc694. \ud68c\uc0ac\uac00 \ubcf4\ubcf5 \ubaa9\uc801\uc774 \uc5c6\uc5c8\uc74c\uc744 \uc2a4\uc2a4\ub85c \uc99d\uba85\ud574\uc57c \ud558\uac70\ub4e0\uc694. \uc5f0\ubc29\ub300\ubc95\uc6d0\uc740 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2023/27.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Qantas Airways Limited v Transport Workers Union of Australia<\/em> [2023] HCA 27<\/a> \ud310\uacb0\uc5d0\uc11c s 340(1)(b) \ubc94\uc704\ub3c4 \ub113\ud614\uc5b4\uc694. \uc7a5\ucc28 \uc0dd\uaca8\ub0a0 \uc9c1\uc7a5 \ub0b4 \uad8c\ub9ac \ud589\uc0ac\ub97c \ubbf8\ub9ac \ub9c9\uc73c\ub824\ub294 \uc120\uc81c \ud574\uace0 \uc5ed\uc2dc \uc704\ubc95\uc774\ub77c\uace0 \ubabb \ubc15\uc558\uc8e0.<\/p>\n<p class=\"doc-p\">\uadf8\ub807\ub2e4\uba74 \ud574\uace0 \uc9c1\uc804\uc5d0 \ubd88\ub9cc \uba54\uc77c \ud55c \ud1b5\ub9cc \ubcf4\ub0b4 \ub450\uba74 \ubb34\uc801\uc758 \ubc29\ud328\uac00 \ub420\uae4c\uc694? \uc808\ub300 \uadf8\ub807\uc9c0 \uc54a\uc544\uc694. \uc5f0\ubc29\ub300\ubc95\uc6d0 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2012/32.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Board of Bendigo Regional Institute of TAFE v Barclay<\/em> [2012] HCA 32<\/a> \ud310\uacb0\uc758 \uc7a3\ub300\ub294 \ub9e4\uc6b0 \uc5c4\uaca9\ud574\uc694. \ubc95\uc6d0\uc740 \ud574\uace0\uc758 \uac1d\uad00\uc801 \uacf5\uc815\uc131\uc744 \uc2ec\uc0ac\ud558\uc9c0 \uc54a\uac70\ub4e0\uc694. \uc624\uc9c1 \uc2e4\uc81c \ud574\uace0\ub97c \uacb0\ub2e8\ud55c \uc758\uc0ac\uacb0\uc815\uad8c\uc790\uc758 \uc8fc\uad00\uc801 \uc2e4\uc81c \ub3d9\uae30(subjective operative reasons)\uc5d0 \ubcf4\ubcf5 \uc0ac\uc720\uac00 \uc791\ub3d9\ud588\ub294\uc9c0\ub9cc \uac00\ub824\ub0b4\uc694. \ub2f9\ub300 \uae30\ub85d\uc73c\ub85c \ud574\uace0 \ubc29\uce68\uc774 \uc774\ubbf8 \uad73\uc5b4 \uc788\uc5c8\ub2e4\uba74 s 361 \ucd94\uc815\uc740 \ub2e8\ubc88\uc5d0 \uae68\uc838\uc694.<\/p>\n<h2 id=\"520\ub9cc-\ubc30\uc0c1-\ud310\uacb0\uc774-\ud30c\uae30\ud658\uc1a1-\ub05d\uc5d0-\ud328\uc18c\ub85c-\ub4a4\uc9d1\ud78c-roohizadegan-\uc0ac\uac74\uc758-\uad50\ud6c8\" class=\"doc-h2\">$520\ub9cc \ubc30\uc0c1 \ud310\uacb0\uc774 \ud30c\uae30\ud658\uc1a1 \ub05d\uc5d0 \ud328\uc18c\ub85c \ub4a4\uc9d1\ud78c Roohizadegan \uc0ac\uac74\uc758 \uad50\ud6c8<\/h2>\n<p class=\"doc-p\">\uc774 \ud604\uc2e4\uc744 \uac00\uc7a5 \uadf9\uc801\uc73c\ub85c \ubcf4\uc5ec\uc900 \uc2e4\ud654\uac00 \uc0c1\uc7a5\uc0ac \uc784\uc6d0 \uc18c\uc1a1\uc778 <em>Roohizadegan<\/em> \uc0ac\uac74\uc774\uc5d0\uc694. \uc8fc \ucd1d\uad04 \uc784\uc6d0\uc774\ub358 \uc6d0\uace0\ub294 \ud574\uace0 \uc804 \uad34\ub86d\ud798 \uc9c4\uc815\uc744 \ub0c8\uc5b4\uc694. \uc774\uc5b4\uc9c4 1\uc2ec <em>Roohizadegan v TechnologyOne Limited (No 2)<\/em> [2020] FCA 1407\uc5d0\uc11c 520\ub9cc \ub2ec\ub7ec\uac00 \ub118\ub294 \ubc30\uc0c1 \ud310\uacb0\uc744 \ubc1b\uc544 \ub0c8\uc8e0. \uc544\uc9c1\ub3c4 \uc628\ub77c\uc778\uc5d0\ub294 \uc774 \uc2b9\uc18c \uae30\uc0ac\ub9cc \ub5a0\ub3cc\uc544\uc694.<\/p>\n<p class=\"doc-p\">\ud558\uc9c0\ub9cc \uacb0\ub9d0\uc740 \uc644\uc804\ud788 \ub4a4\uc9d1\ud614\uc5b4\uc694. \uc5f0\ubc29\ubc95\uc6d0 \ud56d\uc18c\ubd80\ub294 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCAFC/2021/137.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>TechnologyOne Limited v Roohizadegan<\/em> [2021] FCAFC 137<\/a> \ud310\uacb0\uc744 \ud1b5\ud574 520\ub9cc \ub2ec\ub7ec 1\uc2ec \ud310\uacb0\uc744 \ud30c\uae30\ud558\uace0 \uc7ac\uc2ec\uc744 \uba85\ud588\uc5b4\uc694. 1\uc2ec\uc774 \ud68c\uc7a5\uc758 \uc2e4\uc81c \ud574\uace0 \ub3d9\uae30\uc640 \uac1d\uad00\uc801 \uc99d\uac70\ub97c \uc798\ubabb \ub2e4\ub918\ub2e4\ub294 \uc774\uc720\uc600\uc8e0. \uadf8\ub9ac\uace0 \uae34 \uc7ac\uc2ec \ub05d\uc5d0 2025\ub144 12\uc6d4 18\uc77c <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2025/1619.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Roohizadegan v Technology One Ltd (No 6)<\/em> [2025] FCA 1619<\/a> (McElwaine J) \ud310\uacb0\uc774 \uc120\uace0\ub410\uc5b4\uc694. \uacb0\uacfc\ub294 \uc6d0\uace0 \uccad\uad6c \uc804\ubd80 \uae30\uac01(dismissed in full)\uc774\uc5c8\uc8e0. \ub2f9\ub300 \uacbd\uc601\uc9c4 \uae30\ub85d\uc0c1 \ud574\uace0\uc758 \uc9c4\uc9dc \uc6d0\uc778\uc740 \uc624\ub79c \uc2e4\uc801 \ubd80\uc9c4\uacfc \ub9ac\ub354\uc2ed \ud30c\ud0c4\uc774\uc5c8\uac70\ub4e0\uc694. \ub4a4\uc774\uc740 [2026] FCA 187 \uacb0\uc815\uc5d0\uc11c\ub294 \uc804 \uc784\uc6d0\uc5d0\uac8c \uac70\uc561\uc758 \uc18c\uc1a1\ube44\uc6a9 \ubc30\uc0c1 \uba85\ub839(adverse costs)\uae4c\uc9c0 \ub5a8\uc5b4\uc84c\uc5b4\uc694. \ub9c9\ud310 \ud56d\uc758 \uba54\uc77c\ub9cc \ubbff\uace0 \uc18c\uc1a1\uc73c\ub85c \uc9c1\ud589\ud558\uba74 \ub178\ud6c4 \uc790\uc0b0\uae4c\uc9c0 \uc783\uc744 \uc218 \uc788\ub2e4\ub294 \uacbd\uace0\uc608\uc694.<\/p>\n<h2 id=\"\ud1f4\uc0ac-\ud6c4-\uacbd\uc5c5\uae08\uc9c0restraint-of-trade-\uac00\ucc98\ubd84-\uc8fc\ubcc4-\ubc95\ub9ac\uc640-2026\ub144-\uac1c\uc815\uc548\" class=\"doc-h2\">\ud1f4\uc0ac \ud6c4 \uacbd\uc5c5\uae08\uc9c0(Restraint of Trade) \uac00\ucc98\ubd84: \uc8fc\ubcc4 \ubc95\ub9ac\uc640 2026\ub144 \uac1c\uc815\uc548<\/h2>\n<p class=\"doc-p\">\uc784\uc6d0 \ud1f4\uc9c1 \ubd84\uc7c1\uc758 \ud6c4\ubc18\uc804\uc740 \uacc4\uc57d\uc11c \ub9d0\ubbf8\uc758 \uacbd\uc5c5\uae08\uc9c0(restraint of trade) \uc870\ud56d\uc5d0\uc11c \ud130\uc838\uc694. \ud638\uc8fc \uc8fc(State)\ub9c8\ub2e4 \ubc95\ub9ac\uac00 \uc804\ud600 \ub2ec\ub77c\uc694. \ud038\uc990\ub79c\ub4dc(QLD)\uc640 \ube45\ud1a0\ub9ac\uc544(VIC)\uc5d0\uc11c\ub294 \uacbd\uc5c5\uae08\uc9c0 \uc57d\uc815\uc744 \uc6d0\uce59\uc801 \ubb34\ud6a8(prima facie void)\ub85c \ub2e4\ub904\uc694. \ud68c\uc0ac\uac00 \uc601\uc5c5\ube44\ubc00\u00b7\uac70\ub798\ucc98 \ubcf4\ud638\uc5d0 \uaf2d \ud544\uc694\ud55c \ucd5c\uc18c \ubc94\uc704\uc600\uc74c\uc744 \uc99d\uba85\ud574\uc57c\ub9cc \ud6a8\ub825\uc774 \uc0b4\uc8e0. \uacfc\ub3c4\ud55c \ubb38\uad6c\ub294 \ubb38\uc81c \uc5b4\uad6c\ub9cc \uc9c0\uc6cc\ub3c4 \ubb38\uc7a5\uc774 \uc131\ub9bd\ud558\ub294 \uccad\uc0c9 \uc5f0\ud544(blue-pencil) \uc808\ub2e8\ub9cc \ud5c8\uc6a9\ub3fc\uc694. <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/vic/VSCA/2016/334.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Just Group Limited v Peck<\/em> [2016] VSCA 334<\/a> \ud310\uacb0\uacfc \ud038\uc990\ub79c\ub4dc\uc8fc \ub300\ubc95\uc6d0 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/qld/QSC/2020/207.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>AECI Australia Pty Ltd v Convey<\/em> [2020] QSC 207<\/a> \ud310\uacb0\uc774 \ud655\uc778\ud588\ub4ef \ubc95\uc6d0\uc774 \ubb38\uad6c\ub97c \uc0c8\ub85c \uace0\uccd0 \uc8fc\uc9c0\ub294 \uc54a\uac70\ub4e0\uc694. \ubc18\uba74 \ub274\uc0ac\uc6b0\uc2a4\uc6e8\uc77c\uc2a4(NSW)\ub9cc \uc720\uc77c\ud558\uac8c Restraints of Trade Act 1976 (NSW) s 4(1)\ub85c \ud569\ub9ac\uc801 \ucd95\uc18c \uc801\uc6a9(read-down)\uc744 \ud5c8\uc6a9\ud574\uc694.<\/p>\n<p class=\"doc-p\">\uc5ec\uae30\uc5d0 2026\ub144 9\uc6d4 \uc5f0\ubc29 \uc7ac\ubb34\ubd80 \uc785\ubc95\uc608\uace0\uc548(<em>Competition and Fair Work Legislation Amendment (Banning Unfair Non-Competes) Bill 2026<\/em>)\uc774 \ub098\uc654\uc5b4\uc694. 2027\ub144\ubd80\ud130 $190,100 \ubbf8\ub9cc \uadfc\ub85c\uc790\uc758 \ud1f4\uc0ac \ud6c4 \uacbd\uc5c5\uae08\uc9c0\ub97c \uae08\uc9c0\ud558\uace0 \uae30\uac04\u00b7\uac70\ub9ac\ub97c \uacb9\uacb9\uc774 \ub098\uc5f4\ud558\ub358 \ub2e8\uacc4\ubcc4 \uc911\ucca9 \uc870\ud56d(cascading clauses)\uc744 \ubd88\ubc95\ud654\ud558\uaca0\ub2e4\ub294 \ucd08\uc548\uc774\uc5d0\uc694. \uacb0\uad6d $190,100 \uc774\uc0c1 \uc784\uc6d0\uc740 \uc55e\uc73c\ub85c\ub3c4 \uc8fc \ub300\ubc95\uc6d0 \uac00\ucc98\ubd84 \uc804\uc7a5\uc5d0 \uadf8\ub300\ub85c \ub0a8\uc544\uc694. \uae30\uc5c5 \uc5ed\uc2dc \ub0a1\uc740 \ub2e8\uacc4\ud615 \uacc4\uc57d\uc11c\ub97c \ubc29\uce58\ud558\uba74 \ud575\uc2ec \uc784\uc6d0 \uc774\ud0c8 \ub54c \uc57d\uc815 \uc804\uccb4\uac00 \ubb34\ud6a8\ub85c \ub0a0\uc544\uac08 \uc218 \uc788\uc8e0.<\/p>\n<h2 id=\"\uace0\uc5f0\ubd09-\uc784\uc6d0-\ud1f4\ucd9c\uc601\uc785-\ubd84\uc7c1\uc5d0\uc11c-\uc2e4\uc775\uc744-\uc9c0\ud0a4\ub294-\ub300\uc751-\uc21c\uc11c\" class=\"doc-h2\">\uace0\uc5f0\ubd09 \uc784\uc6d0 \ud1f4\ucd9c\u00b7\uc601\uc785 \ubd84\uc7c1\uc5d0\uc11c \uc2e4\uc775\uc744 \uc9c0\ud0a4\ub294 \ub300\uc751 \uc21c\uc11c<\/h2>\n<p class=\"doc-p\">\uc784\uc6d0 \ud1f4\ucd9c \ud1b5\ubcf4 \uc9c1\ud6c4\uc758 \uace8\ub4e0\ud0c0\uc784\uc740 \ub2e8 \uba70\uce60\ubfd0\uc774\uc5d0\uc694. \uc808\ub300 \ud68c\uc0ac \uc790\ub8cc\ub97c \uac1c\uc778 \uacc4\uc815\uc73c\ub85c \uc62e\uae30\uc9c0 \ub9c8\uc138\uc694. \ubc18\ucd9c \uae30\ub85d\uc740 \uace7\uc7a5 \uac00\ucc98\ubd84 \uc18c\uc1a1\uc758 \ud0c4\uc57d\uc774 \ub418\uac70\ub4e0\uc694. \ub300\uc2e0 21\uc77c \uae30\ud55c \uc548\uc5d0 s 340 \uce74\ub4dc\uc640 \uc608\uace0\uae30\uac04\u00b7\ubcf4\ub108\uc2a4 \uc815\uc0b0 \ubc0f \uacbd\uc5c5\uae08\uc9c0 \uc644\ud654(carve-out)\ub97c \ubb36\uc5b4 \ube44\uacf5\uac1c \ud654\ud574\ud569\uc758\uc11c\ub85c \ud478\ub294 \ud3b8\uc774 \ud6e8\uc52c \uc720\ub9ac\ud574\uc694. \uae30\uc5c5 \uacbd\uc601\uc9c4\ub3c4 \uc784\uc6d0 \uad50\uccb4 \uc804 Barclay\uc640 Roohizadegan (No 6) \uae30\uc900\uc5d0 \ub9de\ub294 \ub2f9\ub300 \uae30\ub85d\ubd80\ud130 \uac16\ucdb0\uc57c \uc548\uc804\ud558\uc8e0. \uace0\uc561 \ubcf4\uc218\uc640 \uacbd\uc5c5\uae08\uc9c0\uac00 \ub9de\ubb3c\ub9b0 \ubcf5\uc7a1\ud55c \uc0ac\uac74\uc774\ub77c\uba74 \ubc15\uc564\ucf54 \uace0\uc6a9\ubc95 \uc804\uc6a9 \uc9c8\ubb38\uc9c0(<a href=\"https://form.jotform.com/221801513691854\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\uace0\uc6a9\u00b7\uc784\uc6d0 \ubd84\uc7c1 \uc811\uc218 \ubc14\ub85c\uac00\uae30<\/a>)\ub098 \uacf5\uc2dd \ucc3d\uad6c(<a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ubc15\uc564\ucf54 \uacf5\uc2dd \ub9c1\ud06c \ud5c8\ube0c<\/a>)\ub85c \uacc4\uc57d\uc11c\uc640 \ud604\ud669\uc744 \ub0a8\uaca8 \uc8fc\uc138\uc694. \uc774\ud574\ucda9\ub3cc \uc870\ud68c \ud6c4 \ud611\uc0c1 \uc9c0\ub81b\ub300\uc640 \uac00\ucc98\ubd84 \ubc29\uc5b4\uc120\uc744 \uc138\uc6b0\ub294 \uc804\ub7b5\uc744 \uc9da\uc5b4 \ub4dc\ub9b4\uac8c\uc694.<\/p>\n\n          <div class=\"col-sources-box\">\n            \uadfc\uac70 \ubc95\ub839 \ubc0f \ud310\ub840: Fair Work Act 2009 ss 340, 361, 382, 392 \u00b7 Bendigo TAFE v Barclay [2012] HCA 32 \u00b7 Qantas v TWU [2023] HCA 27 \u00b7 TechnologyOne v Roohizadegan [2021] FCAFC 137 &amp; Roohizadegan (No 6) [2025] FCA 1619 \u00b7 Just Group v Peck [2016] VSCA 334 \u00b7 AECI v Convey [2020] QSC 207 \u00b7 Restraints of Trade Act 1976 (NSW) s 4(1).\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">\ud63c\uc790 \uc9c4\ud589\uc744 \uba48\ucd94\uace0 \ubcc0\ud638\uc0ac\ub97c \ucc3e\uc544\uc57c \ud558\ub294 \uc21c\uac04<\/span>\n            <h3 class=\"col-cta-title\">\ud68c\uc0ac \uae09\uc5ec\u00b7\uacc4\uc57d\uc11c \uc810\uac80, \ud574\uace0 21\uc77c \ub9c8\uac10 \uae30\ud55c, \ub610\ub294 \uc9c1\uc811 \uacc4\uc0b0\uc744 \ub9c8\uce5c $50,000 \uc774\uc0c1 \ubbf8\uc9c0\uae09 \uc0ac\uac74\uc778\uac00\uc694?<\/h3>\n            <p class=\"col-cta-desc\">$50,000 \ubbf8\ub9cc\uc758 \uc77c\ubc18 \ubc00\ub9b0 \uae09\uc5ec\ub294 \ud3ec\ud138 \ubb34\ub8cc \uacc4\uc0b0\uae30\uc640 208\uc218\uc2dd \uc5d1\uc140\ub85c \uc9c1\uc811 \uacc4\uc0b0\ud574 \uccad\uad6c\ud558\uc154\uc57c \ubc1b\uc73c\uc2e4 \ub3c8\ubcf4\ub2e4 \ubcc0\ud638\uc0ac\ube44\uac00 \ub354 \ucee4\uc9c0\ub294 \uc77c\uc744 \ub9c9\uc744 \uc218 \uc788\uc5b4\uc694. \ubc18\uba74 \ud574\uace0 \ud6c4 21\uc77c \uae30\ud55c\uc774 \uc784\ubc15\ud588\uac70\ub098 \ud68c\uc0ac \uc2a4\ud3f0\uc11c\uc2ed \ubc29\uc5b4\u00b7$50,000 \uc774\uc0c1 \uace0\uc561 \uccad\uad6c\u00b7\ud3d0\uc5c5 \ub300\ud45c\uc790 \ucc45\uc784 \ucd94\uad81(s 550) \ub2e8\uacc4\ub77c\uba74 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uc54c\ub824 \uc8fc\uc138\uc694.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/221801513691854\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">\uace0\uc6a9\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../files/KO/PDF/02_Employment_Underpayment_Self_Calculation_and_Evidence_Manual_2026_KO.pdf\" download class=\"col-btn-ghost\">02 \ubc00\ub9b0 \uc784\uae08 \uacc4\uc0b0\u00b7\uccad\uad6c \uc694\uc57d PDF \ubc1b\uae30<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">\ubc15\uc564\ucf54 \uacf5\uc2dd \uc0c1\ub2f4 \ub9c1\ud06c \ud5c8\ube0c<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">\ubc95\ub960 \uc548\ub0b4: \uc774 \uce7c\ub7fc\uc740 \ud638\uc8fc \uacf5\uc815\uadfc\ub85c\ubc95(Fair Work Act 2009), \ud1f4\uc9c1\uc5f0\uae08\ubc95, \uc774\ubbfc\ubc95\ub839\uacfc \ubc95\uc6d0 \ud310\ub840\ub97c \ubc14\ud0d5\uc73c\ub85c \uc54c\uae30 \uc27d\uac8c \ud480\uc5b4 \uc4f4 \uc77c\ubc18 \ubc95\ub960 \uc815\ubcf4\uc608\uc694. \uac1c\ubcc4 \uc0ac\uac74\uc5d0 \ub300\ud55c \ubc95\ub960 \uc790\ubb38\uc774\ub098 \uc218\uc784 \uacc4\uc57d \uc131\ub9bd\uc744 \ub73b\ud558\uc9c0 \uc54a\uc73c\ub2c8 FWC 21\uc77c \ub9c8\uac10 \uae30\ud55c \ub4f1\uc774 \uc784\ubc15\ud588\ub2e4\uba74 \uc9c0\uccb4 \uc5c6\uc774 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uac80\ud1a0\ub97c \ubc1b\uc544 \ubcf4\uc138\uc694.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">\ud568\uaed8 \uc77d\uc73c\uba74 \uc88b\uc740 \uace0\uc6a9\ubc95 \ud310\ub840 \uce7c\ub7fc<\/h3>\n        <a href=\"../../?lang=ko&amp;tab=employment\" class=\"col-back-link num\">\u2190 \uc9c1\uc7a5\u00b7\ubc00\ub9b0 \uc784\uae08 \uacc4\uc0b0\uae30\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../annualised-salary-setoff-audit-2026/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ud3ec\uad04\uc5f0\ubd09\u00b7\uc784\uae08\uc808\ub3c4 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 04<\/span><h4 class=\"col-sib-title\">\ud3ec\uad04\uc5f0\ubd09\uc81c(All-In Salary) \uacc4\uc57d\uc11c\uc758 \ubc30\uc2e0: Woolworths\u00b7Coles \uc5f0\ubc29\ubc95\uc6d0 \ud310\uacb0\uacfc \uc784\uae08\uc808\ub3c4 \ud615\uc0ac\ucc98\ubc8c \ub300\uc751\ubc95<\/h4><p class=\"col-sib-desc\">&#x27;\uc5f0\ubd09\uc5d0 \uc8fc\ub9d0\u00b7\uc57c\uadfc\uc218\ub2f9\uc774 \ub2e4 \ud3ec\ud568\ub410\ub2e4&#x27;\ub294 \uacc4\uc57d\uc11c \ubb38\uad6c\uac00 \uc65c \uc5f0\ubc29\ubc95\uc6d0([2025] FCA 1092)\uc5d0\uc11c \uae68\uc84c\ub294\uc9c0 \uc0b4\ud3b4\ubcf4\uace0 \ud68c\uc0ac\uc758 \uae09\uc5ec \uc810\uac80\uacfc $50,000 \uc774\uc0c1 \ubc00\ub9b0 \uc218\ub2f9 \uccad\uad6c \uae30\uc900\uc744 \uc54c\ub824\ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../director-accountant-liability-s550/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubc95\uc778\ud3d0\uc5c5\u00b7\uc5f0\ub300\ucc45\uc784 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 05<\/span><h4 class=\"col-sib-title\">\ud68c\uc0ac\ub97c \ud3d0\uc5c5(Liquidation)\ud558\uba74 \ub05d\uc77c\uae4c: \ub300\ud45c\uc774\uc0ac\u00b7\ud68c\uacc4\uc0ac \uac1c\uc778 \uc7ac\uc0b0\uc744 \ucd94\uad81\ud558\ub294 FWA s 550 \uc5f0\ub300\ucc45\uc784<\/h4><p class=\"col-sib-desc\">\ubb38\uc744 \ub2eb\uc740 \ube48 \uaecd\ub370\uae30 \ud68c\uc0ac\ub9cc \uc0c1\ub300\ub85c \uc18c\uc1a1\ud558\uba74 \uc65c \ub3c8\uc744 \ud55c \ud47c\ub3c4 \ubabb \ubc1b\ub294\uc9c0 \uc54c\uc544\ubcf4\uace0 \uc0ac\uc7a5\ub2d8\u00b7\uad00\uc5ec \ud68c\uacc4\uc0ac \uac1c\uc778 \uc7ac\uc0b0\uc5d0 \ucc45\uc784\uc744 \ubb3b\ub294 s 550 \uaddc\uc815\uc744 \uc27d\uac8c \uc124\uba85\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../sham-contracting-abn-s15aa/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ABN \uc704\uc7a5\ub3c4\uae09 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 06<\/span><h4 class=\"col-sib-title\">ABN \ud504\ub9ac\ub79c\uc11c \uacc4\uc57d\uc11c \uc37c\uc73c\ub2c8 \uadfc\ub85c\uc790\uac00 \uc544\ub2c8\ub2e4? FWA s 15AA \uc2e4\uc9c8 \uc2ec\uc0ac\uc640 6\ub144 \uce58 \uc5f0\uae08\u00b7\uc218\ub2f9 \uc5ed\ucd94\uc9d5<\/h4><p class=\"col-sib-desc\">\ud504\ub9ac\ub79c\uc11c \uacc4\uc57d\uc11c\ub97c \uc4f0\uace0\ub3c4 \uc815\uc2dd \uc9c1\uc6d0\uc73c\ub85c \uc778\uc815\ubc1b\uc544 \ubcf5\uc9c1\ud55c \uc0ac\ub840\uc640 \uc5f0\ubd09 $190,100 \uc774\uc0c1\uc77c \ub54c \uc608\uc678\uac00 \uc778\uc815\ub41c \ucd5c\uc2e0 \ud310\ub840\ub97c \ub098\ub780\ud788 \ube44\uad50\ud574 \ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../sponsored-worker-dismissal-482-186/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ube44\uc790\uc5f0\ub3d9 \ud574\uace0 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 07<\/span><h4 class=\"col-sib-title\">482\u00b7186 \uc2a4\ud3f0\uc11c \ube44\uc790 \uc911 \ud574\uace0 \ud1b5\ubcf4: 21\uc77c\uacfc 180\uc77c\uc758 \uc774\uc911 \uc2dc\uacc4\uc640 \ud569\uc758\uc11c(Deed) \ud568\uc815<\/h4><p class=\"col-sib-desc\">\uc2a4\ud3f0\uc11c \ube44\uc790\ub85c \uc77c\ud558\ub2e4 \ud574\uace0\ub410\uc744 \ub54c \uc65c \ub178\ub3d9\ubc95\uacfc \uc774\ubbfc\ubc95\uc744 \ub530\ub85c \ubcf4\uba74 \uc704\ud5d8\ud55c\uc9c0 \uc9da\uc5b4 \ubcf4\uace0 \ud1f4\uc0ac\uc77c\uc744 \uc870\uc728\ud558\ub294 \ud569\uc758\uc11c \uc791\uc131\ubc95\uacfc \uc8fc\uc758\uc810\uc744 \uc815\ub9ac\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}, "en": {"doc_title": "Executive Dismissals Above $190,100, General Protections Myths and Post-Employment Restraints \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">All Guides Hub<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=en\">Visa Solution Guide<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=en\">Employment Navigator<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=en\">DIY & Cost-Smart Guide<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\">Consult Park & Co \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=en&amp;tab=employment\" class=\"col-back-btn\">\u2190 Back to Employment Self-Help Hub<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">Park &amp; Co Lawyers \u00b7 Employment Law Deep-Dive Column<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn\">KO<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn active\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">Consult Park &amp; Co \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">EXECUTIVES &amp; RESTRAINTS \u00b7 EMPLOYMENT 08<\/span>\n          <span class=\"col-verified-pill num\">Primary-Source Verified (Nov 2026)<\/span>\n          <span class=\"col-time-pill num\">9 min read<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">Executive Dismissals Above $190,100, General Protections Myths and Post-Employment Restraints<\/h1>\n        <p class=\"col-subtitle\">Why the $5.2m TechnologyOne award ended in total dismissal ([2025] FCA 1619), QLD/VIC vs NSW restraint enforcement, and the Sep 2026 Non-Compete Bill<\/p>\n\n        <div class=\"col-byline\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">Chang Min Park<\/div>\n            <div class=\"col-author-role\">Legal Practitioner Director, Park &amp; Co Lawyers \u00b7 Accredited Specialist in Immigration Law (QLS)<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col08_emp_executive_hero.jpg\" alt=\"Executive Dismissals Above $190,100, General Protections Myths and Post-Employment Restraints\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">Above the $190,100 threshold, executive exit leverage turns on contemporaneous board records under s 361 and whether post-employment restraints survive common-law severance.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">$190,100 HIT<\/div><div class=\"col-stat-lbl\">FY 2026\u201327 Fair Work High Income Threshold ($95,050 UD cap)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">$5.2M Overturned<\/div><div class=\"col-stat-lbl\">All claims dismissed on retrial in Roohizadegan (No 6) [2025] FCA 1619<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">QLD Void vs NSW s 4<\/div><div class=\"col-stat-lbl\">Strict blue-pencil severance in QLD/VIC vs statutory read-down in NSW<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">In This Column<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#what-the-190100-threshold-covers-and-how-s-361-o\" class=\"col-toc-link lvl-2\">What the $190,100 threshold covers and how s 361 operates in court<\/a><a href=\"#from-52-million-to-zero-the-technologyone-v-rooh\" class=\"col-toc-link lvl-2\">From $5.2 million to zero: the TechnologyOne v Roohizadegan retrial lesson<\/a><a href=\"#post-employment-restraints-in-queensland-and-vic\" class=\"col-toc-link lvl-2\">Post-employment restraints in Queensland and Victoria versus New South Wales<\/a><a href=\"#the-september-2026-exposure-draft-banning-sub-19\" class=\"col-toc-link lvl-2\">The September 2026 exposure draft banning sub-$190,100 non-competes and cascading clauses<\/a><a href=\"#negotiating-complex-executive-exits-and-defendin\" class=\"col-toc-link lvl-2\">Negotiating complex executive exits and defending restraint injunctions<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">Open Employment Consultation Form<\/a>\n              <a href=\"../../?lang=en&amp;tab=employment\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 Back to Employment Self-Help Hub<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">From 1 July 2026, the Fair Work High Income Threshold (FWA ss 333, 382(b)(iii)) sits at $190,100 per annum, lifting the Unfair Dismissal compensation cap (s 392(5)) to $95,050. Award-free executives, general managers, and commercial directors earning at or above $190,100 in guaranteed annual pay cannot file a Part 3-2 Unfair Dismissal claim regardless of how abrupt their exit was. Shut out of that jurisdiction, departing executives often assume a Part 3-1 General Protections (s 340) adverse action claim is an uncapped substitute that forces any board to settle simply because s 361 reverses the onus of proof. Five years of Federal Court litigation ending in December 2025 prove how costly that myth is at trial.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 382\" width=\"100%\" role=\"img\" aria-label=\"General Protections Causation Reality vs Restraint Enforceability\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"381\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">EXECUTIVE LITIGATION \u00b7 $190,100 HIT &amp; RESTRAINTS<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">General Protections Causation Reality vs Restraint Enforceability<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">Authorities: FWA ss 340, 361, 382 \u00b7 Roohizadegan (No 6) [2025] FCA 1619 \u00b7 Just Group [2016] VSCA 334<\/text>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"38\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">1. GENERAL PROTECTIONS (s 340 / s 361) REALITY<\/text>\n  <circle cx=\"42\" cy=\"144\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">$190,100 HIT Bars Award-Free Unfair Dismissal<\/text>\n  <text x=\"54\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">Executives rely on s 340 General Protections or contract notice claims.<\/text>\n  <circle cx=\"42\" cy=\"196\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">The $5.2M Reversal in Roohizadegan (No 6)<\/text>\n  <text x=\"54\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">[2025] FCA 1619 dismissed all claims on retrial with adverse costs.<\/text>\n  <circle cx=\"42\" cy=\"248\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Decision-Maker&#x27;s Operative Reason (Barclay)<\/text>\n  <text x=\"54\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">Contemporaneous board/performance records defeat s 361 presumption.<\/text>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"466\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">2. POST-EMPLOYMENT RESTRAINTS BY STATE<\/text>\n  <circle cx=\"470\" cy=\"144\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">QLD &amp; VIC Common Law: Prima Facie Void<\/text>\n  <text x=\"482\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">Overbroad clauses fail unless strictly severable (Just Group; Convey).<\/text>\n  <circle cx=\"470\" cy=\"196\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">NSW Statutory Read-Down Exception (s 4(1))<\/text>\n  <text x=\"482\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">NSW Courts can read down excessive restraints to a reasonable scope.<\/text>\n  <circle cx=\"470\" cy=\"248\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Sep 2026 Treasury Non-Compete Bill Draft<\/text>\n  <text x=\"482\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">Proposes banning non-competes below $190,100 HIT &amp; cascading clauses.<\/text>\n  <rect x=\"22\" y=\"328\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"351\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1D6B48\">Takeaway: Board termination paper trails and urgent Supreme Court restraint injunctions are won or lost in the first 48 hours.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 1: Executive Adverse Action Causation vs State Restraint-of-Trade Enforceability<\/figcaption><\/figure>\n<h2 id=\"what-the-190100-threshold-covers-and-how-s-361-o\" class=\"doc-h2\">What the $190,100 threshold covers and how s 361 operates in court<\/h2>\n<p class=\"doc-p\">Check the threshold arithmetic before conceding Unfair Dismissal eligibility. The $190,100 cap counts base salary plus agreed non-monetary benefits of predetermined value (such as a fully maintained vehicle), while excluding compulsory 12% superannuation and uncertain commissions or discretionary bonuses. Modern award or enterprise agreement coverage overrides the income cap altogether.<\/p>\n<p class=\"doc-p\">Where an award-free executive sits at or above $190,100, disputes turn on contractual notice, incentive (STI/LTI) forfeiture, or FWA s 340 General Protections, where compensation under s 545 is uncapped. Under s 361, once an executive proves they exercised a s 341 workplace right (including a workplace complaint) and suffered dismissal, unlawful causation is presumed unless the employer proves otherwise. High Court authority narrows that advantage sharply. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2012/32.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Board of Bendigo Regional Institute of TAFE v Barclay<\/em> [2012] HCA 32<\/a>, the High Court held that causation turns on the decision-maker&#x27;s subjective operative reasons; credible testimony from the CEO or board chair corroborated by contemporaneous papers discharges the s 361 onus even if a complaint preceded termination. Conversely, <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2023/27.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Qantas Airways Limited v Transport Workers Union of Australia<\/em> [2023] HCA 27<\/a> confirmed that s 340(1)(b) catches adverse action taken to prevent the future exercise of workplace rights.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">Executive Legal Issue<\/th><th style=\"text-align:left\">Governing Statute &amp; Leading Case<\/th><th style=\"text-align:left\">Courtroom &amp; Commercial Reality<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>FY 2026-27 High Income Threshold<\/strong><\/td><td style=\"text-align:left\">FWA ss 333, 382(b)(iii), 392(5) (eff. 1 Jul 2026)<\/td><td style=\"text-align:left\">Award-free executives earning &gt;=$190,100 (ex-super &amp; uncertain bonuses) are barred from Unfair Dismissal ($95,050 cap)<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Subjective Reverse Onus (s 361)<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2012/32.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Barclay<\/em> [2012] HCA 32<\/a>; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2023/27.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Qantas v TWU<\/em> [2023] HCA 27<\/a><\/td><td style=\"text-align:left\">Credible decision-maker evidence plus board papers defeats s 340 claims, though blocking future rights breaches s 340(1)(b)<\/td><\/tr><tr><td style=\"text-align:left\"><strong>The <em>Roohizadegan<\/em> Retrial Collapse<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCAFC/2021/137.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>TechnologyOne v Roohizadegan<\/em> [2021] FCAFC 137<\/a>; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2025/1619.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Roohizadegan (No 6)<\/em> [2025] FCA 1619<\/a><\/td><td style=\"text-align:left\">Initial &gt;$5.2m judgment overturned on appeal and dismissed in full on retrial ([2026] FCA 187 adverse costs)<\/td><\/tr><tr><td style=\"text-align:left\"><strong>QLD &amp; VIC vs NSW Restraints<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/vic/VSCA/2016/334.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Just Group v Peck<\/em> [2016] VSCA 334<\/a>; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/qld/QSC/2020/207.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>AECI v Convey<\/em> [2020] QSC 207<\/a>; Restraints of Trade Act 1976 (NSW) s 4(1)<\/td><td style=\"text-align:left\">Prima facie void in QLD/VIC unless strictly reasonable and blue-pencil severable; NSW alone allows judicial read-down<\/td><\/tr><tr><td style=\"text-align:left\"><strong>2026 Non-Compete Reform Bill<\/strong><\/td><td style=\"text-align:left\">Sept 2026 Exposure Draft (<em>Banning Unfair Non-Competes Bill 2026<\/em>)<\/td><td style=\"text-align:left\">Proposes from 2027 to ban post-employment non-competes below $190,100 HIT and outlaw cascading ladder clauses<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"from-52-million-to-zero-the-technologyone-v-rooh\" class=\"doc-h2\">From $5.2 million to zero: the TechnologyOne v Roohizadegan retrial lesson<\/h2>\n<p class=\"doc-p\">Every executive weighing Federal Court litigation should study the full trajectory of <em>Roohizadegan<\/em>. At first instance in <em>Roohizadegan v TechnologyOne Limited (No 2)<\/em> [2020] FCA 1407, a senior manager who had lodged seven bullying complaints won headlines with an award exceeding $5.2 million in compensation, damages, and penalties.<\/p>\n<p class=\"doc-p\">That windfall collapsed on appeal. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCAFC/2021/137.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>TechnologyOne Limited v Roohizadegan<\/em> [2021] FCAFC 137<\/a>, the Full Federal Court set the judgment aside and ordered a retrial because the primary analysis failed to address the decision-maker&#x27;s actual state of mind. On 18 December 2025, Justice McElwaine delivered retrial judgment in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2025/1619.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Roohizadegan v Technology One Ltd (No 6)<\/em> [2025] FCA 1619<\/a>, dismissing all claims in full, with adverse costs ordered in [2026] FCA 187. Contemporaneous records proved genuine performance and conduct failures, not complaint retaliation, drove the exit. Lodging a tactical grievance when board support is gone will not manufacture a s 340 payout against clean corporate records.<\/p>\n<h2 id=\"post-employment-restraints-in-queensland-and-vic\" class=\"doc-h2\">Post-employment restraints in Queensland and Victoria versus New South Wales<\/h2>\n<p class=\"doc-p\">After an executive exit, urgent Supreme Court injunction applications over post-employment restraints turn on state governing law. In Queensland and Victoria, restraints are <em>prima facie<\/em> void unless the employer proves the restriction goes no further than reasonably necessary (judged when signed) to protect confidential information or customer connection. Courts outside Sydney cannot rewrite overbroad clauses; invalid limbs survive only via clean &quot;blue-pencil&quot; severance, as confirmed in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/vic/VSCA/2016/334.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Just Group Limited v Peck<\/em> [2016] VSCA 334<\/a> and <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/qld/QSC/2020/207.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>AECI Australia Pty Ltd v Convey<\/em> [2020] QSC 207<\/a>. New South Wales stands alone: under Restraints of Trade Act 1976 (NSW) s 4(1), a court can read down an excessive covenant to fit the actual breach.<\/p>\n<h2 id=\"the-september-2026-exposure-draft-banning-sub-19\" class=\"doc-h2\">The September 2026 exposure draft banning sub-$190,100 non-competes and cascading clauses<\/h2>\n<p class=\"doc-p\">In September 2026, Treasury released the Exposure Draft of the <em>Competition and Fair Work Legislation Amendment (Banning Unfair Non-Competes) Bill 2026<\/em>, proposing from 2027 to ban post-employment non-competes below the $190,100 High Income Threshold and outlaw cascading ladder clauses. Above $190,100, non-competes will remain lawful only as single, calibrated horizons alongside statutory confidentiality duties under Corporations Act 2001 (Cth) ss 182-183.<\/p>\n<h2 id=\"negotiating-complex-executive-exits-and-defendin\" class=\"doc-h2\">Negotiating complex executive exits and defending restraint injunctions<\/h2>\n<p class=\"doc-p\">Modest under-$50,000 award backpay queries belong in our free Self-Help Award Calculator and Form 5 Small Claims guide, whereas executive separations turn on strict 21-day s 366(1) bars, equity vesting rules, and urgent Supreme Court injunction undertakings. Park &amp; Co advises senior executives negotiating complex exit deeds and restraint clearances, and corporate boards structuring defensible terminations under <em>Barclay<\/em> or updating executive templates ahead of the 2027 non-compete reforms. Submit your contract, termination notice, and restraint schedule via the <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Employment Consultation Form<\/a> or visit the <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Official Links Hub<\/a>.<\/p>\n\n          <div class=\"col-sources-box\">\n            Primary Authorities: Fair Work Act 2009 (Cth) ss 340, 361, 382, 392 \u00b7 Barclay [2012] HCA 32 \u00b7 Qantas v TWU [2023] HCA 27 \u00b7 Roohizadegan (No 6) [2025] FCA 1619 \u00b7 Just Group v Peck [2016] VSCA 334 \u00b7 AECI v Convey [2020] QSC 207 \u00b7 Restraints of Trade Act 1976 (NSW) s 4(1) \u00b7 Treasury Non-Compete Exposure Draft (Sep 2026).\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">WHEN TO CONSULT PARK &amp; CO LAWYERS \u00b7 EMPLOYMENT<\/span>\n            <h3 class=\"col-cta-title\">Facing a 21-Day Dismissal Deadline, Corporate Audit, or &gt;$50,000 / s 550 Claim?<\/h3>\n            <p class=\"col-cta-desc\">For modest &lt;$50k wage shortfalls, self-calculating with our free Award Calculator and 208-formula Excel protects 100% of your payout. Once your matter involves a 21-day dismissal bar, sponsor defence, or &gt;$50k / s 550 director exposure, submit our online consultation form.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">Open Employment Consultation Form<\/a>\n              <a href=\"../../files/EN/PDF/02_Employment_Underpayment_Self_Calculation_and_Evidence_Manual_2026_EN.pdf\" download class=\"col-btn-ghost\">Download Manual 02 (Employment PDF)<\/a>\n              <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">Park &amp; Co Official Consultation Hub<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">Legal Disclaimer: This publication provides general legal information grounded in the Fair Work Act 2009 (Cth), superannuation/migration statutes and Australian court authorities current as at November 2026. It does not constitute legal advice or create a solicitor-client relationship. Strict 21-day FWC limits apply.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">More Curated Employment Law Columns<\/h3>\n        <a href=\"../../?lang=en&amp;tab=employment\" class=\"col-back-link num\">\u2190 Back to Employment Self-Help Hub<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../annualised-salary-setoff-audit-2026/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ANNUALISED SALARIES \u00b7 EMPLOYMENT 04<\/span><h4 class=\"col-sib-title\">Why Annualised Salary Set-Off Clauses Fail After Woolworths and Coles [2025] FCA 1092<\/h4><p class=\"col-sib-desc\">Why &#x27;all-in&#x27; salaries cannot average overtime across quiet weeks, how missing penalty records flip the onus onto employers, and when &gt;$50k recovery or B2B restructuring applies.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../director-accountant-liability-s550/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">DIRECTOR LIABILITY \u00b7 EMPLOYMENT 05<\/span><h4 class=\"col-sib-title\">Liquidating the Company Will Not Shield Directors or Accountants From s 550 Liability<\/h4><p class=\"col-sib-desc\">How FWA s 550 pierces insolvent corporate shells to reach directors, HR managers and external accountants who had actual knowledge of award breaches.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../sham-contracting-abn-s15aa/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ABN &amp; SHAM CONTRACTING \u00b7 EMPLOYMENT 06<\/span><h4 class=\"col-sib-title\">ABN Contractor or Employee? How Section 15AA Overturned High Court Contract Primacy<\/h4><p class=\"col-sib-desc\">Compares Dickerson [2025] FWC 2219, Crooks v Hyundai Rotem [2026] FWC 1104 and Barakat [2026] FWC 1941 across multi-year leave, penalty and super exposure.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../sponsored-worker-dismissal-482-186/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">VISA WORKER DISMISSALS \u00b7 EMPLOYMENT 07<\/span><h4 class=\"col-sib-title\">Dismissed on a Subclass 482 Visa: Managing the 21-Day FWC Bar, 180-Day Mobility Rule and Deed Traps<\/h4><p class=\"col-sib-desc\">How to structure FWC settlement deeds around new SID 482 nominations without breaking Subclass 186 TRT qualifying service or triggering visa cancellation.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}}</script>
  <script>
    (function () {
      const payload = JSON.parse(document.getElementById('col-payload').textContent);
      const root = document.getElementById('col-root');
      let cleanupScroll = null;

      function getLang() {
        const q = new URLSearchParams(window.location.search).get('lang');
        return q === 'en' ? 'en' : 'ko';
      }

      function bindTocSpy() {
        if (cleanupScroll) cleanupScroll();
        const links = Array.from(root.querySelectorAll('.col-toc-link'));
        if (!links.length) return;
        const targets = links
          .map((a) => document.getElementById(a.getAttribute('href').slice(1)))
          .filter(Boolean);
        function onScroll() {
          let activeIdx = 0;
          const offset = window.scrollY + 130;
          for (let i = 0; i < targets.length; i++) {
            if (targets[i].offsetTop <= offset) activeIdx = i;
          }
          links.forEach((a, idx) => a.classList.toggle('active', idx === activeIdx));
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        cleanupScroll = () => window.removeEventListener('scroll', onScroll);
        onScroll();
      }

      function render(lg) {
        const data = payload[lg] || payload.ko;
        document.documentElement.lang = lg;
        document.title = data.doc_title;

    var summaryLine = isEn
      ? (days.length + ' day(s) &middot; ' + fmt(sum[0]) + ' page views &middot; ' + fmt(sum[1]) + ' daily visitors (since ' + START + '; 1 daily visitor per browser).')
      : ('표시 구간 ' + days.length + '일 합계 &middot; 페이지 조회 ' + fmt(sum[0]) + '회 &middot; 일별 순방문자 ' + fmt(sum[1]) + '명 (' + START + ' 집계 시작 &middot; 하루 브라우저당 1회)');
    return svg + '<div class="vc-legend"><span><i class="vc-k-bar"></i>' + (isEn ? 'Page views' : '페이지 조회') + '</span>' +
      '<span><i class="vc-k-line"></i>' + (isEn ? 'Daily visitors' : '일별 순방문자') + '</span></div>' +
      '<p class="vc-sum">' + summaryLine + '</p>';
  }

  function loadTodayReferrers(dayKey) {
    if (liveTodayViews === 0 && liveTodayVis === 0) {
      return Promise.resolve({});
    }
    var out = {};
    var remaining = [];
    REF_BUCKETS.forEach(function (b) {
      if (typeof liveRefHints[b.id] === 'number') {
        out[b.id] = liveRefHints[b.id];
      } else {
        remaining.push(b);
      }
    });
    var firstSlice = remaining.slice(0, 6);
    var secondSlice = remaining.slice(6);
    return Promise.all(firstSlice.map(function (b) {
      return call('get', 'ref-' + b.id + '-' + dayKey).catch(function () { return 0; }).then(function (v) { out[b.id] = v || 0; });
    })).then(function () {
      return secondSlice.length ? delay(260) : Promise.resolve();
    }).then(function () {
      return Promise.all(secondSlice.map(function (b) {
        return call('get', 'ref-' + b.id + '-' + dayKey).catch(function () { return 0; }).then(function (v) { out[b.id] = v || 0; });
      }));
    }).then(function () {
      return out;
    });
  }

  function renderReferrerBox(countsMap) {
    var isEn = uiLang() === 'en';
    var items = REF_BUCKETS.map(function (b) {
      return { id: b.id, label: isEn ? b.en : b.ko, count: countsMap[b.id] || 0 };
    }).filter(function (x) { return x.count > 0; }).sort(function (a, b) { return b.count - a.count; });
    var totalRef = items.reduce(function (acc, x) { return acc + x.count; }, 0);
    var head = '<div class="vc-ref-title"><span>' +
      (isEn ? ('Today&rsquo;s Referral Channels (' + today + ')') : ('오늘 유입 채널 분포 (' + today + ')')) +
      '</span><small>' + (isEn ? ('Tracked visitors: ' + fmt(totalRef)) : ('채널 집계 방문자: ' + fmt(totalRef) + '명')) + '</small></div>';
    if (!items.length) {
      return head + '<p class="vc-ref-note">' +
        (isEn
          ? 'Anonymous referral channel buckets (Naver, Cafe, KakaoTalk, Threads, Hub, Direct) are recorded once per browser per day as new visits arrive (zero personal or URL path data stored).'
          : '익명 유입 경로(검색·카페·카카오톡·스레드·허브 이동 등) 집계는 신규 방문부터 하루 브라우저당 1회씩 기록돼요 (세부 URL·개인정보 미수집).') +
        '</p>';
    }
    var rowsHtml = items.map(function (item) {
      var pct = totalRef > 0 ? Math.round((item.count / totalRef) * 100) : 0;
      return '<div class="vc-ref-row">' +
        '<span class="vc-ref-name" title="' + item.label + '">' + item.label + '</span>' +
        '<div class="vc-ref-track"><div class="vc-ref-fill" style="width:' + Math.max(4, pct) + '%"></div></div>' +
        '<span class="vc-ref-val">' + fmt(item.count) + ' (' + pct + '%)</span>' +
        '</div>';
    }).join('');
    var note = isEn
      ? 'Privacy-safe coarse channel buckets only (1 per browser/day; zero IP, query string, or full referrer URL stored).'
      : '개인정보 보호형 채널 그룹 집계 (하루 브라우저당 1회 기준 &middot; 검색어·세부 URL·IP 미수집)';
    return head + '<div class="vc-ref-list">' + rowsHtml + '</div><p class="vc-ref-note">' + note + '</p>';
  }

  function loadHistoryRows(days) {
    var histCache = {};
    try { histCache = JSON.parse(localStorage.getItem(HIST_KEY) || '{}') || {}; } catch (e) {}
    var results = new Array(days.length);
    var pending = [];
    days.forEach(function (d, idx) {
      if (d < today && Array.isArray(histCache[d])) {
        results[idx] = histCache[d];
      } else if (d === today && typeof liveTodayViews === 'number' && typeof liveTodayVis === 'number') {
        results[idx] = [liveTodayViews, liveTodayVis];
      } else {
        pending.push({ d: d, idx: idx });
      }
    });

    var batchSize = pending.length > 7 ? 4 : 6;
    var pauseMs = pending.length > 7 ? 2900 : 180;
    var chain = Promise.resolve();
    for (var c = 0; c < pending.length; c += batchSize) {
      (function (slice, waitFirst) {
        chain = chain.then(function () {
          return (waitFirst ? delay(pauseMs) : Promise.resolve()).then(function () {
            return Promise.all(slice.map(function (item) {
              var k = item.d.replace(/-/g, '');
              var pViews = (item.d === today && typeof liveTodayViews === 'number')
                ? Promise.resolve(liveTodayViews)
                : call('get', 'day-' + k).catch(function () { return null; });
              var pVis = (item.d === today && typeof liveTodayVis === 'number')
                ? Promise.resolve(liveTodayVis)
                : call('get', 'vday-' + k).catch(function () { return null; });
              return Promise.all([pViews, pVis]).then(function (pair) {
                var v0 = pair[0] == null ? 0 : pair[0];
                var v1 = pair[1] == null ? 0 : pair[1];
                results[item.idx] = [v0, v1];
                if (item.d < today && pair[0] !== null && pair[1] !== null) {
                  histCache[item.d] = [v0, v1];
                }
              });
            }));
          });
        });
      })(pending.slice(c, c + batchSize), c > 0);
    }
    return chain.then(function () {
      try { localStorage.setItem(HIST_KEY, JSON.stringify(histCache)); } catch (e) {}
      return results.map(function (r) { return r || [0, 0]; });
    });
  }

  var cachedRefMap = null;

  function loadAndRenderModal(refreshRefs) {
    syncCounterLang();
    var isEn = uiLang() === 'en';
    var fullDays = lastDays(30);
    var days = activeRange === 7 ? lastDays(7) : fullDays;
    var body = modal.querySelector('.vc-body');
    var chartWaitMsg = isEn ? 'Loading daily statistics&hellip;' : '일별 통계를 불러오는 중이에요&hellip;';
    var refWaitMsg = isEn ? 'Loading today&rsquo;s referral channels&hellip;' : '오늘 유입 채널 집계를 불러오는 중이에요&hellip;';
    var existingRefHtml = (!refreshRefs && cachedRefMap) ? renderReferrerBox(cachedRefMap) : ('<div class="vc-ref-note">' + refWaitMsg + '</div>');

    /* Render toolbar, loading placeholder, referral box, and 1-click share bar IMMEDIATELY (0ms) */
    body.innerHTML = renderToolbar(isEn, fullDays.length) +
      '<div id="vc-chart-slot"><p class="vc-sum">' + chartWaitMsg + '</p></div>' +
      '<div id="vc-ref-box" class="vc-ref-box">' + existingRefHtml + '</div>' +
      renderShareBar(isEn);

    loadHistoryRows(days)
      .then(function (rows) {
        var slot = document.getElementById('vc-chart-slot');
        if (slot) slot.innerHTML = renderChartSvg(days, rows, uiLang() === 'en');
        if (!refreshRefs && cachedRefMap) return cachedRefMap;
        return delay(180).then(function () { return loadTodayReferrers(day); });
      })
      .then(function (refMap) {
        if (refMap) cachedRefMap = refMap;
        var refBox = document.getElementById('vc-ref-box');
        if (refBox && refMap) refBox.innerHTML = renderReferrerBox(refMap);
      })
      .catch(function () {
        var slot = document.getElementById('vc-chart-slot');
        if (slot && !slot.querySelector('svg')) {
          slot.textContent = uiLang() === 'en' ? 'Could not load the chart.' : '그래프를 불러오지 못했어요.';
        }
      });
  }

  function open() {
    activeRange = 7;
    modal.classList.add('open');
    loadAndRenderModal(true);
  }
  box.setAttribute('role', 'button');
  box.setAttribute('tabindex', '0');
  box.addEventListener('click', open);
  box.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
})();
  </script>
</body>
</html>
