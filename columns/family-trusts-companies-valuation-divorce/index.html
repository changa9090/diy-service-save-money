ol-stat-lbl\">\ube44\uacf5\uc2dd \ubc95\uc778 \ud604\uae08\u00b7\uc790\uc0b0 \uc774\uc804 \uc2dc \ubc1c\uc0dd\ud558\ub294 Division 7A \uc758\uc81c\ubc30\ub2f9 \uacfc\uc138 \ub9ac\uc2a4\ud06c<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">\uc774 \uce7c\ub7fc\uc758 \ubaa9\ucc28<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#\ub0b4-\uba85\uc758-\uc7ac\uc0b0\uc740-0\uc6d0\uc774\ub77c\ub294-\ucc29\uac01-\uac00\uc871\uc2e0\ud0c1\uc744-\ub04c\uc5b4\ub0b8-kennon-v-spry\" class=\"col-toc-link lvl-2\">\ub0b4 \uba85\uc758 \uc7ac\uc0b0\uc740 0\uc6d0\uc774\ub77c\ub294 \ucc29\uac01: \uac00\uc871\uc2e0\ud0c1\uc744 \ub04c\uc5b4\ub0b8 Kennon v Spry<\/a><a href=\"#\ub3d9\uc5c5\uc790\uac00-\uc788\ub294-pty-ltd-\ubc95\uc778\uc758-\uacbd\uacc4\uc120-ascot-\uc6d0\uce59\uacfc-s-90ae\" class=\"col-toc-link lvl-2\">\ub3d9\uc5c5\uc790\uac00 \uc788\ub294 Pty Ltd \ubc95\uc778\uc758 \uacbd\uacc4\uc120: Ascot \uc6d0\uce59\uacfc s 90AE<\/a><a href=\"#\ub0b4-\ub2f4\ub2f9-\ud68c\uacc4\uc0ac-\ud3c9\uac00\uc11c\uac00-0\uc810\uc744-\ubc1b\uc740-\uc774\uc720driesen-klerk-2026-\ud310\uacb0\" class=\"col-toc-link lvl-2\">\ub0b4 \ub2f4\ub2f9 \ud68c\uacc4\uc0ac \ud3c9\uac00\uc11c\uac00 0\uc810\uc744 \ubc1b\uc740 \uc774\uc720(Driesen &amp; Klerk 2026 \ud310\uacb0)<\/a><a href=\"#\ubc95\uc778-\uc790\uae08\uc744-\uadf8\ub0e5-\ube7c\uba74-\ud130\uc9c0\ub294-division-7a-\uac04\uc8fc\ubc30\ub2f9-\uc138\uae08-\ud3ed\ud0c4\" class=\"col-toc-link lvl-2\">\ubc95\uc778 \uc790\uae08\uc744 \uadf8\ub0e5 \ube7c\uba74 \ud130\uc9c0\ub294 Division 7A \uac04\uc8fc\ubc30\ub2f9 \uc138\uae08 \ud3ed\ud0c4<\/a><a href=\"#\ub0b4-\uc0ac\uac74\uc5d0-\ub9de\ub294-\ub2e4\uc74c-\ub2e8\uacc4-\uc810\uac80\ud558\uae30\" class=\"col-toc-link lvl-2\">\ub0b4 \uc0ac\uac74\uc5d0 \ub9de\ub294 \ub2e4\uc74c \ub2e8\uacc4 \uc810\uac80\ud558\uae30<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">\uac00\uc871\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../?lang=ko&amp;tab=family\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">\ud638\uc8fc\uc5d0\uc11c \ubcd1\uc758\uc6d0\uc774\ub098 \uac74\uc124\u00b7\uc694\uc2dd\uc5c5\u00b7\ubb3c\ub958\u00b7\ubd80\ub3d9\uc0b0 \uc0ac\uc5c5\uc744 \uc77c\uad70 \ud55c\uc778 \uc0ac\uc5c5\uac00 \ubd80\ubd80\uc758 \uc774\ud63c \uc0c1\ub2f4\uc740 \uccab \uc11c\ub958\ubd80\ud130 \ud48d\uacbd\uc774 \ub2ec\ub77c\uc694. \ub4f1\uae30\ubd80\uc640 \uac1c\uc778 \ud1b5\uc7a5\uc744 \uc5f4\uc5b4 \ubcf4\uba74 \uac1c\uc778 \uc774\ub984\uc73c\ub85c \uc7a1\ud788\ub294 \uc790\uc0b0\uc774 \ud145 \ube44\uc5b4 \uc788\uac70\ub4e0\uc694. \uac70\uc8fc \uc8fc\ud0dd\ubd80\ud130 \uc0c1\uac00\u00b7\uc124\ube44\u00b7\ucc28\ub7c9\uae4c\uc9c0 \uc804\ubd80 \uc7ac\ub7c9\ud615 \uac00\uc871\uc2e0\ud0c1(Discretionary Family Trust)\uc774\ub098 \ube44\uc0c1\uc7a5 \ubc95\uc778(Pty Ltd) \uba85\uc758\ub85c \ub4e4\uc5b4\uac00 \uc788\uae30 \ub54c\ubb38\uc774\uc5d0\uc694. \uc0ac\uc5c5\uc744 \uc8fc\ub3c4\ud55c \ucabd\uc740 \ub0b4 \uba85\uc758 \uc7ac\uc0b0\uc774 0\uc6d0\uc774\ub2c8 \ub098\ub20c \ubaab\ub3c4 \uc5c6\ub2e4\uace0 \ubbff\uc73c\uc138\uc694. \ubc18\ub300\ud3b8 \ubc30\uc6b0\uc790\ub294 \ud3c9\uc0dd \uc77c\uad6c\uace0\ub3c4 \ube48\uc190\uc73c\ub85c \ub098\uc549\uc744\uae4c \ubd10 \ub208\uc55e\uc774 \uce84\uce84\ud574\uc9c0\uc2dc\uc8e0. \uacb0\ub860\ubd80\ud130 \ubd84\uba85\ud788 \ub9d0\uc500\ub4dc\ub9b4\uac8c\uc694. \uc5f0\ubc29\uc21c\ud68c\u00b7\uac00\uc871\ubc95\uc6d0(FCFCOA) \uc55e\uc5d0\uc11c \ud615\uc2dd\uc801\uc778 \ubc95\uc778\u00b7\uc2e0\ud0c1 \uc678\ud53c\ub294 \ub9cc\ub2a5 \ubc29\ud328\uac00 \ub418\uc9c0 \ubabb\ud574\uc694.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 366\" width=\"100%\" role=\"img\" aria-label=\"\uc2e0\ud0c1\u00b7\ubc95\uc778 \uc790\uc0b0\uc758 \ubd84\ud560 \ud3b8\uc785 \uae30\uc900\uacfc \uc77c\ubc29 \uac10\uc815\uc11c \ubb34\ud6a8 \uc6d0\uce59\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"365\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">\uac00\uc871\uc2e0\ud0c1\u00b7\ube44\uc0c1\uc7a5 \ubc95\uc778 \uc7ac\uc0b0\ubd84\ud560 \u00b7 \uc9c0\ubc30\ub825 \uc2ec\uc0ac\uc640 \uac10\uc815\ud3c9\uac00\u00b7\uc138\uae08 \ud568\uc815<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">\uc2e0\ud0c1\u00b7\ubc95\uc778 \uc790\uc0b0\uc758 \ubd84\ud560 \ud3b8\uc785 \uae30\uc900\uacfc \uc77c\ubc29 \uac10\uc815\uc11c \ubb34\ud6a8 \uc6d0\uce59<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">\uadfc\uac70: Kennon v Spry [2008] HCA 56 \u00b7 Ascot Investments [1981] HCA 1 \u00b7 Driesen &amp; Klerk [2026] FedCFamC1A 74<\/text>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"36\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">RULE 01 \u00b7 \uc2e4\uc9c8 \uc9c0\ubc30\ub825 \uc2ec\uc0ac<\/text>\n  <text x=\"36\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">\uac00\uc871\uc2e0\ud0c1 \ubc29\ud328 \ub6ab\uae30 (Spry)<\/text>\n  <text x=\"36\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\">Kennon v Spry [2008] HCA 56 \u00b7 s 106B<\/text>\n  <line x1=\"36\" y1=\"182\" x2=\"272\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">\uc784\uba74\uad8c\uc790(Appointor)\u00b7\uc218\ud0c1\uc790 \uc9c0\ubc30\uad8c \ubcf4\uc720 \uc2dc<\/text>\n  <text x=\"36\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc7ac\ub7c9\uc2e0\ud0c1 \uc804\uccb4 \uc21c\uc790\uc0b0\uc774 s 79 \uc7ac\uc0b0 \ud480 \uc9c1\ud589!<\/text>\n  <text x=\"36\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ubcc4\uac70 \uc9c1\uc804 \uc2e0\ud0c1 \uc815\uad00 \ubcc0\uacbd\uc740 s 106B\ub85c \ucde8\uc18c<\/text>\n  <text x=\"36\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ub2e8, \uc9c4\uc815\ud55c \uc81c3\uc790 \ub3d9\uc5c5 \uc9c0\ubd84\uc740 \ubcf4\ud638(Ascot)<\/text>\n  <line x1=\"289\" y1=\"195\" x2=\"300\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"303,195 297,191 297,199\" fill=\"#1F242B\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"320\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">RULE 02 \u00b7 \uac10\uc815\uac00\uce58 0\uc810 \ud310\uacb0<\/text>\n  <text x=\"320\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">\uc77c\ubc29 \ud68c\uacc4\uc0ac \ud3c9\uac00\uc11c \uc99d\uac70 \ubc30\ucc99<\/text>\n  <text x=\"320\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E5F\">Driesen &amp; Klerk [2026] FedCFamC1A 74<\/text>\n  <line x1=\"320\" y1=\"182\" x2=\"556\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"320\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">\ub0a8\ud3b8 \uce21 \uc77c\ubc29 \uc9c0\uc2dc \ud68c\uacc4\uc0ac \uac10\uc815\uac00 0\uc810 \ud655\uc815!<\/text>\n  <text x=\"320\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ubc95\uc6d0 \uaddc\uce59 Pt 7.1 \ub2e8\uc77c \uacf5\ub3d9\uac10\uc815\uc778(SEW) \uc6d0\uce59<\/text>\n  <text x=\"320\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">s 71B \ubaa8\ubc95\uc0c1 \ubc95\uc778 \uc6d0\uc7a5\u00b7BAS \uc804\uba74 \uacf5\uac1c \uc758\ubb34<\/text>\n  <text x=\"320\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uac1c\uc778 \uacbd\ube44 \ucc98\ub9ac\u00b7\uac00\uc218\uae08 \uc815\uc0c1\ud654(Add-back) \uac80\uc99d<\/text>\n  <line x1=\"573\" y1=\"195\" x2=\"584\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"587,195 581,191 581,199\" fill=\"#1F242B\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FEF8EC\" stroke=\"#9A6700\" stroke-width=\"1.3\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#9A6700\"/>\n  <text x=\"604\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">RULE 03 \u00b7 \ubc95\uc778 \uc138\uae08 \ud3ed\ud0c4 \ubc29\uc9c0<\/text>\n  <text x=\"604\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">Division 7A \uc758\uc81c\ubc30\ub2f9 \uc138\uae08 \uc8fc\uc758<\/text>\n  <text x=\"604\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#9A6700\">ITAA 1936 Div 7A \u00b7 CGT Rollover<\/text>\n  <line x1=\"604\" y1=\"182\" x2=\"840\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"604\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">\ubc95\uc778 \ud604\uae08\u00b7\ubd80\ub3d9\uc0b0\uc744 \uc0ac\uc801 \ud569\uc758\ub85c \ube7c\ub0b4\uba74<\/text>\n  <text x=\"604\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ucd5c\uace0 \ud55c\uacc4\uc138\uc728(47%) \uc758\uc81c\ubc30\ub2f9 \uc18c\ub4dd\uc138 \ud3ed\ud0c4!<\/text>\n  <text x=\"604\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ubc18\ub4dc\uc2dc \uc815\uad50\ud55c s 79 \ubc95\uc6d0 \uba85\ub839 \uad6c\uc870\ub85c \uc124\uacc4<\/text>\n  <text x=\"604\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc591\ub3c4\uc18c\ub4dd\uc138(CGT) \ub864\uc624\ubc84\u00b7\uc778\uc9c0\uc138 \uba74\uc81c \ub3d9\uc2dc \ud655\ubcf4<\/text>\n  <rect x=\"22\" y=\"312\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#FEF8EC\" stroke=\"#ECD9B0\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"335\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">\ud575\uc2ec \ud3ec\uc778\ud2b8: \uc0ac\uc5c5\uccb4\u00b7\uac00\uc871\uc2e0\ud0c1\uc774 \uc5bd\ud78c \uc7ac\uc0b0\ubd84\ud560\uc740 \ud68c\uacc4 \uac10\uc815(Single Expert) \uc9c0\uc2dc\uc11c \uc791\uc131\uacfc Division 7A \uc138\ubb34 \ubc29\uc5b4\uac00 \uc2b9\ud328\ub97c \uacb0\uc815\ud569\ub2c8\ub2e4.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 1: \uac00\uc871\uc2e0\ud0c1\u00b7\ube44\uc0c1\uc7a5 \ubc95\uc778(Pty Ltd) \uc2e4\uc9c8 \uc9c0\ubc30\ub825 \uc2ec\uc0ac\uc640 \ub2e8\uc77c \uacf5\ub3d9\uac10\uc815\uc778 \ud3c9\uac00 \uc6d0\uce59<\/figcaption><\/figure>\n<h2 id=\"\ub0b4-\uba85\uc758-\uc7ac\uc0b0\uc740-0\uc6d0\uc774\ub77c\ub294-\ucc29\uac01-\uac00\uc871\uc2e0\ud0c1\uc744-\ub04c\uc5b4\ub0b8-kennon-v-spry\" class=\"doc-h2\">\ub0b4 \uba85\uc758 \uc7ac\uc0b0\uc740 0\uc6d0\uc774\ub77c\ub294 \ucc29\uac01: \uac00\uc871\uc2e0\ud0c1\uc744 \ub04c\uc5b4\ub0b8 Kennon v Spry<\/h2>\n<p class=\"doc-p\">\uc808\uc138\uc640 \ucc44\uad8c\uc790 \ubc29\uc5b4\uc6a9\uc73c\ub85c \uc124\uacc4\ub41c \uc7ac\ub7c9\ud615 \uac00\uc871\uc2e0\ud0c1 \uc57d\uad00(Trust Deed)\uc740 \uad6c\uc870\uac00 \uaf64 \uce58\ubc00\ud574\uc694. \uc218\uc775\uc790(Beneficiary) \ub204\uad6c\ub3c4 \ud655\uc815 \uc9c0\ubd84\uc744 \uac16\uc9c0 \ubabb\ud558\uace0 \ubd84\ubc30 \uc5ec\ubd80\ub294 \uc624\uc9c1 \uc218\ud0c1\uc790(Trustee) \uc7ac\ub7c9\uc5d0 \ub2ec\ub838\ub2e4\uace0 \uc801\ud600 \uc788\uc8e0. \uc77c\ubc18 \uc0c1\uac70\ub798 \ucc44\uad8c\uc790 \uc55e\uc5d0\uc11c\ub294 \uc774 \ubcbd\uc774 \ud070 \uc704\ub825\uc744 \ubc1c\ud718\ud574\uc694. \ud558\uc9c0\ub9cc \ud638\uc8fc \uac00\uc871\ubc95(Family Law Act 1975) s 79(\uc0ac\uc2e4\ud63c s 90SM)\uc758 \uc2dc\uc120\uc740 \uc804\ud600 \ub2ec\ub77c\uc694. \uc885\uc774 \uaecd\ub370\uae30\ub97c \ub118\uc5b4 \ub204\uac00 \uc2e4\uc9c8 \uc9c0\ubc30\ub825(effective control)\uc758 \uc5f4\uc1e0\ub97c \uc950\uc5c8\ub294\uac00\ub97c \uace7\uc7a5 \ud30c\uace0\ub4e4\uac70\ub4e0\uc694.<\/p>\n<p class=\"doc-p\">\uc774 \ubc95\ub9ac\ub97c \uc138\uc6b4 \uc0c1\uc9d5\uc801 \ud310\ub840\uac00 \uc5f0\ubc29\ub300\ubc95\uc6d0\uc758 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2008/56.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Kennon v Spry<\/em> [2008] HCA 56<\/a> \uc0ac\uac74\uc774\uc5d0\uc694. \ub0a8\ud3b8\uc774 \ud30c\ud0c4 \ubb34\ub835 \uc57d\uad00\uc744 \uace0\uccd0 \uc544\ub0b4\ub97c \uc218\uc775\uc790\uc5d0\uc11c \ube7c\uace0 \uc790\ub140 \ubaab\uc73c\ub85c \uc790\uc0b0\uc744 \ub118\uae30\ub824 \ud588\uc8e0. \ub300\ubc95\uc6d0\uc758 \ud310\ub2e8\uc740 \ub2e8\ud638\ud588\uc5b4\uc694. \ub0a8\ud3b8\uc774 \uc218\ud0c1\uc790 \uc9c0\uc704\uc640 \uc784\uba85\uad8c\uc790(Appointor) \uad8c\ud55c\uc744 \uc7a5\uc545\ud588\uace0 \uc544\ub0b4\ub3c4 \uc801\ubc95\ud55c \uc2e0\ud0c1 \uad00\ub9ac\ub97c \uc694\uad6c\ud560 \uad8c\ub9ac(right to due administration)\ub97c \uc9c0\ub154\ub2e4\ub294 \uacb0\ud569 \uad6c\uc870\ub97c \ub4e4\uc5b4 \uc2e0\ud0c1 \uc21c\uc790\uc0b0 \uc804\uccb4\ub97c s 79 \ubd84\ud560 \uc7ac\uc0b0\uc73c\ub85c \ub04c\uc5b4\ub4e4\uc600\uac70\ub4e0\uc694. \ubcc4\uac70 \uc804\ud6c4\uc5d0 \uc784\uba85\uad8c\uc790\ub97c \ubd80\ubaa8\u00b7\ud615\uc81c\ub85c \ubc14\uafb8\uac70\ub098 \uc218\uc775\uc790\ub97c \uc81c\uc678\ud558\ub294 \ud589\uc704\ub294 s 106B \uc0ac\ud574\ud589\uc704 \ucde8\uc18c \uc870\ud56d\uc73c\ub85c \uc9c1\uad8c \ubb34\ud6a8\ud654\ub3fc\uc694. \uc124\ub839 \ubd80\ubaa8 \uc138\ub300\uac00 \uc138\uc6b4 \uc678\ubd80 \uc2e0\ud0c1\uc774\ub77c \ubc30\uc6b0\uc790\uc5d0\uac8c \ud1b5\uc81c\uad8c\uc774 \uc5c6\ub354\ub77c\ub3c4 \uafb8\uc900\ud788 \ubd84\ubc30\uae08\uc744 \ubc1b\uc544 \uc0dd\ud65c\ube44\ub85c \uc368\uc654\ub2e4\uba74 s 79(5) \uc7ac\uc815\uc801 \uc790\uc6d0(financial resource)\uc73c\ub85c \uc7a1\ud600 \ubd84\ud560 \ube44\uc728\uc744 \ud06c\uac8c \uc6c0\uc9c1\uc5ec\uc694.<\/p>\n<h2 id=\"\ub3d9\uc5c5\uc790\uac00-\uc788\ub294-pty-ltd-\ubc95\uc778\uc758-\uacbd\uacc4\uc120-ascot-\uc6d0\uce59\uacfc-s-90ae\" class=\"doc-h2\">\ub3d9\uc5c5\uc790\uac00 \uc788\ub294 Pty Ltd \ubc95\uc778\uc758 \uacbd\uacc4\uc120: Ascot \uc6d0\uce59\uacfc s 90AE<\/h2>\n<p class=\"doc-p\">\uc2e4\uc81c \uc81c3\uc790 \ub3d9\uc5c5\uc790(Business Partner)\uac00 \uc9c0\ubd84\uc744 \ud568\uaed8 \uc950\uace0 \uc6b4\uc601\ud558\ub294 Pty Ltd \ubc95\uc778\uc774\ub77c\uba74 \uc5b4\ub5a8\uae4c\uc694? \uc774 \uc601\uc5ed\uc758 \ub300\uc6d0\uce59\uc744 \uc138\uc6b4 \ud310\ub840\uac00 \uc5f0\ubc29\ub300\ubc95\uc6d0 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/1981/1.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Ascot Investments Pty Ltd v Harper<\/em> [1981] HCA 1<\/a>\uc774\uc5d0\uc694. \uc544\ubb34\ub9ac \uac00\uc871\ubc95\uc6d0\uc774\ub77c\ub3c4 \ubd84\uc7c1\uacfc \ubb34\uad00\ud55c \uc120\uc758\uc758 \uc81c3\uc790 \uc8fc\uc8fc\ub098 \ub3c5\ub9bd \ub3d9\uc5c5\uc790\uc758 \uc815\ub2f9\ud55c \uad8c\ub9ac\uae4c\uc9c0 \uce68\ud574\ud560 \uc218\ub294 \uc5c6\ub2e4\uace0 \uc120\uc744 \uadf8\uc5c8\uc8e0.<\/p>\n<p class=\"doc-p\">\ubb3c\ub860 \uc5ec\uae30\uc5d0\ub3c4 \uc5c4\uaca9\ud55c \uc608\uc678\uac00 \ub530\ub77c\uc694. \uc81c3\uc790 \uba85\uc758\ub9cc \ube4c\ub9b0 \uac00\uc7a5 \ud589\uc704(sham)\uc774\uac70\ub098 \ud55c\ucabd \ubc30\uc6b0\uc790 \ub73b\ub300\ub85c \uc6c0\uc9c1\uc774\ub294 \uaf2d\ub450\uac01\uc2dc\u00b7\ubd84\uc2e0(puppet or alter ego)\uc73c\ub85c \ub4dc\ub7ec\ub098\uba74 \ubc95\uc6d0\uc740 \uc989\uc2dc \ubc95\uc778\uaca9\uc758 \uc7a5\ub9c9\uc744 \uac77\uc5b4\ub0b4\uac70\ub4e0\uc694. \uc544\uc6b8\ub7ec Part VIIIAA(s 90AE)\ub294 \uc808\ucc28\uc801 \uacf5\uc815\uc131\uacfc \ube44\ub840\uc131 \uc694\uac74 \uc544\ub798 \ubc95\uc778\u00b7\uc81c3\uc790\uc5d0\uac8c \uc81c\ud55c\uc801 \uba85\ub839\uc744 \ub0b4\ub9b4 \ud1b5\ub85c\ub3c4 \uc5f4\uc5b4 \ub450\uace0 \uc788\uc5b4\uc694. \uc9c4\uc815\ud55c \ub3c5\ub9bd \ub3d9\uc5c5 \ubc95\uc778\uc774\ub77c\uba74 \ud68c\uc0ac \uc790\uc0b0\uc744 \ucabc\uac1c\uc9c0 \uc54a\uc544\uc694. \ub300\uc2e0 \ubc30\uc6b0\uc790 \ubcf4\uc720 \ube44\uc0c1\uc7a5 \uc8fc\uc2dd\uc758 \uacf5\uc815 \uac00\uce58\ub97c \uc0b0\ucd9c\ud574 \ub300\ucc28\ub300\uc870\ud45c\uc5d0 \uc62c\ub9ac\ub294 \ud3c9\uac00 \uacf5\ubc29\uc73c\ub85c \uc2b9\ubd80\uac00 \ub118\uc5b4\uac00\uc8e0.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">\uc2e0\ud0c1\u00b7\ubc95\uc778 \uad6c\uc870 \ubc0f \uc7c1\uc810<\/th><th style=\"text-align:left\">\ud575\uc2ec \uac80\uc99d \ud310\ub840 \ubc0f \ubc95\ub839 \uc870\ud56d<\/th><th style=\"text-align:left\">\ud638\uc8fc \uac00\uc871\ubc95\uc6d0 \uc2ec\uc0ac \uae30\uc900 \ubc0f \uadc0\uacb0<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>\ubc30\uc6b0\uc790\uac00 \uc784\uba85\uad8c\uc790\u00b7\uc218\ud0c1\uc790 \uc9c0\ubc30\uad8c\uc744 \uc954 \uc2e0\ud0c1<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2008/56.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Kennon v Spry<\/em> [2008] HCA 56<\/a> \u00b7 s 79<\/td><td style=\"text-align:left\">\uc2e4\uc9c8 \uc9c0\ubc30\ub825 \uc778\uc815 \u2192 \uc2e0\ud0c1 \uc21c\uc790\uc0b0 \uc804\uc561\uc744 \ubd80\ubd80 \ubd84\ud560 \uc7ac\uc0b0\uc5d0 \uc9c1\uc811 \ud3b8\uc785<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ubcc4\uac70 \uc804\ud6c4 \uc218\uc775\uc790 \uc81c\uc678 \u00b7 \uc784\uba85\uad8c\uc790 \uad50\uccb4<\/strong><\/td><td style=\"text-align:left\">Family Law Act 1975 s 106B<\/td><td style=\"text-align:left\">\uccad\uad6c \ud68c\ud53c \uc758\ub3c4\u00b7\uacb0\uacfc \uc785\uc99d \uc2dc \uc57d\uad00 \ubcc0\uacbd\u00b7\ucc98\ubd84 \ud589\uc704 \uc9c1\uad8c \ucde8\uc18c \ubc0f \uc6d0\uc0c1\ud68c\ubcf5<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc2e4\uc9c8 \uc81c3\uc790 \ub3d9\uc5c5\uc790\uac00 \uc788\ub294 Pty Ltd \ubc95\uc778<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/1981/1.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Ascot Investments v Harper<\/em> [1981] HCA 1<\/a> \u00b7 s 90AE<\/td><td style=\"text-align:left\">\uaf2d\ub450\uac01\uc2dc \uc544\ub2c8\uba74 \uc81c3\uc790 \ubcf4\ud638 \u2192 \ubc30\uc6b0\uc790 \ubcf4\uc720 \uc9c0\ubd84 \uac00\uce58\ub9cc \ub300\ucc28\ub300\uc870\ud45c \ubc18\uc601<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc77c\ubc29 \ub2f9\uc0ac\uc790 \ud68c\uacc4\uc0ac\uc758 \ube44\uac80\uc99d \uae30\uc5c5 \ud3c9\uac00\uc11c<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2026/74.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Driesen &amp; Klerk<\/em> [2026] FedCFamC1A 74<\/a> \u00b7 Rules Pt 7.1 rr 7.03\u20137.08<\/td><td style=\"text-align:left\">\uc99d\uac70\uac00\uce58 0\uc810(no weight) \ubc30\ucc99 \u00b7 \uc591\uce21 \ud569\uc758 \ub2e8\uc77c \uacf5\ub3d9\uac10\uc815\uc778 \uc6d0\uce59 \uac15\uc81c<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ubc95\uc778 \ud604\uae08 \uc778\ucd9c \u00b7 \ubc95\uc778 \uc790\uc0b0\uc758 \ubb34\uacc4\ud68d \uc774\uc804<\/strong><\/td><td style=\"text-align:left\"><em>Income Tax Assessment Act 1936<\/em> Division 7A \u00b7 s 71B<\/td><td style=\"text-align:left\">\ube44\uacf5\uc2dd \uc774\uc804 \uc2dc \ucd5c\uace0\uc138\uc728 \uac04\uc8fc\ubc30\ub2f9 \uacfc\uc138 \u00b7 \uc815\uc2dd s 79 \ud569\uc758\uba85\ub839 \uc124\uacc4 \ud544\uc218<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"\ub0b4-\ub2f4\ub2f9-\ud68c\uacc4\uc0ac-\ud3c9\uac00\uc11c\uac00-0\uc810\uc744-\ubc1b\uc740-\uc774\uc720driesen-klerk-2026-\ud310\uacb0\" class=\"doc-h2\">\ub0b4 \ub2f4\ub2f9 \ud68c\uacc4\uc0ac \ud3c9\uac00\uc11c\uac00 0\uc810\uc744 \ubc1b\uc740 \uc774\uc720(Driesen &amp; Klerk 2026 \ud310\uacb0)<\/h2>\n<p class=\"doc-p\">\ube44\uc0c1\uc7a5 \uc8fc\uc2dd\uc774 \ubaa9\ub85d\uc5d0 \uc624\ub974\uba74 \uc5b4\ub5a8\uae4c\uc694? \uc0ac\uc5c5\uccb4 \uc6b4\uc601 \ubc30\uc6b0\uc790\uac00 \ub2e8\uace8\ub85c \uaebc\ub0b4\ub294 \uce74\ub4dc\uac00 \uc788\uc5b4\uc694. \ub2f4\ub2f9 \ud68c\uacc4\uc0ac\uc5d0\uac8c \ubd80\ud0c1\ud574 \ud68c\uc0ac \uac00\uce58\uac00 \uac70\uc758 \uc5c6\ub2e4\ub294 \uc790\uccb4 \ud3c9\uac00\uc11c\ub97c \ubc1b\uc544 \uc624\ub294 \uac70\uc608\uc694. \uacfc\uc5f0 \ubc95\uc815\uc5d0\uc11c \ud1b5\ud560\uae4c\uc694? \uc804\ud600 \ud1b5\ud558\uc9c0 \uc54a\uc544\uc694. \ud56d\uc18c\ubd80 \ucd5c\uc2e0 \ud310\uacb0 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2026/74.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Driesen &amp; Klerk<\/em> [2026] FedCFamC1A 74<\/a> (2026\ub144 5\uc6d4 1\uc77c \uc120\uace0)\uac00 \uc774\ub97c \uba85\ud655\ud788 \ubcf4\uc5ec\uc92c\uc8e0. \ub0a8\ud3b8\uc774 F Pty Ltd \ud68c\uacc4\uc0ac \ud3c9\uac00\uc11c\ub97c \ub0c8\uc9c0\ub9cc \uac80\uc99d \uc5c6\uc774 \ub0a8\ud3b8 \uc8fc\uc7a5\ub9cc \uc62e\uacbc\ub2e4\ub294 \uc774\uc720\ub85c \uc99d\uac70\uac00\uce58 0\uc810(no weight) \ud310\uc815\uc744 \ubc1b\uc558\uace0 \ud56d\uc18c\ubd80\ub3c4 \uadf8\ub300\ub85c \ud655\uc815\ud588\uac70\ub4e0\uc694.<\/p>\n<p class=\"doc-p\">\ubc95\uc6d0\uc774 \uc5c4\uaca9\ud55c \uc774\uc720\ub294 \ubd84\uba85\ud574\uc694. \uc18c\uc1a1 \uaddc\uce59(FCFCOA (Family Law) Rules 2021 Part 7.1 rr 7.03\u20137.08)\uc740 \uc22b\uc790 \uc2f8\uc6c0\uc744 \ub9c9\uae30 \uc704\ud574 \uc591\uce21\uc774 \ud568\uaed8 \uc120\uc784\ud55c \ub2e8\uc77c \uacf5\ub3d9\uac10\uc815\uc778(Single Expert Witness) \ud3c9\uac00\ub97c \uc6d0\uce59\uc73c\ub85c \uac15\uc81c\ud558\uc8e0. \uac8c\ub2e4\uac00 2025\ub144 6\uc6d4 \ubaa8\ubc95 \ubcf8\ubb38\uc5d0 \uaca9\uc0c1\ub41c s 71B(\uc0ac\uc2e4\ud63c s 90RI) \uc804\uba74 \uacf5\uac1c \uc758\ubb34\ub85c \uc2e0\ud0c1 \uc99d\uc11c\u00b7\ubc95\uc778\uc138 \uc2e0\uace0\uc11c\u00b7BAS\u00b7\ucd1d\uacc4\uc815\uc6d0\uc7a5\u00b7\ub300\ud45c\uc774\uc0ac \uacc4\uc815(Director Loan Account)\uc744 \ubaa8\ub450 \ub0b4\ub193\uc544\uc57c \ud574\uc694. \uacf5\uc778 \uac10\uc815\uc778\uc774 \uc6d0\uc7a5\uc744 \ub72f\uc5b4\ubcf4\uba74 \uacbd\ube44\ub85c \ud138\uc5b4 \ub123\uc740 \uac1c\uc778 \uc9c0\ucd9c\uacfc \ucd95\uc18c\ub41c \uc601\uc5c5\uad8c(Goodwill)\uc774 \ubcf5\uc6d0\ub3fc \uc2e4\uc81c \uae30\uc5c5 \uac00\uce58\uac00 \ub4dc\ub7ec\ub098\uc694.<\/p>\n<h2 id=\"\ubc95\uc778-\uc790\uae08\uc744-\uadf8\ub0e5-\ube7c\uba74-\ud130\uc9c0\ub294-division-7a-\uac04\uc8fc\ubc30\ub2f9-\uc138\uae08-\ud3ed\ud0c4\" class=\"doc-h2\">\ubc95\uc778 \uc790\uae08\uc744 \uadf8\ub0e5 \ube7c\uba74 \ud130\uc9c0\ub294 Division 7A \uac04\uc8fc\ubc30\ub2f9 \uc138\uae08 \ud3ed\ud0c4<\/h2>\n<p class=\"doc-p\">\uc2e0\ud0c1\uacfc \ubc95\uc778\uc774 \uc5bd\ud78c \uc774\ud63c\uc5d0\ub294 \uc138\uae08 \uc9c0\ub8b0\ubc2d\ub3c4 \uc228\uc5b4 \uc788\uc5b4\uc694. \uc6d0\ub9cc\ud788 \ud569\uc758\ud588\ub2e4\uba70 \ubc95\uc778 \ud604\uae08\uc744 \ubc30\uc6b0\uc790 \uacc4\uc88c\ub85c \ubc14\ub85c \uc3f4 \uc8fc\uace4 \ud558\uc8e0. \ubc95\uc778 \uba85\uc758 \ubd80\ub3d9\uc0b0\u00b7\ucc28\ub7c9\uc744 \uc138\ubb34 \uc124\uacc4 \uc5c6\uc774 \ub118\uae30\uae30\ub3c4 \ud574\uc694. \ub2f9\uc7a5\uc740 \uae54\ub054\ud574 \ubcf4\uc5ec\uc694. \ud558\uc9c0\ub9cc \ub2e4\uc74c \uc138\uae08 \uc2e0\uace0 \ucca0\uc5d0 \uad6d\uc138\uccad(ATO) \ucd94\uc9d5\uc11c\uac00 \ub0a0\uc544\ub4e4\uc8e0.<\/p>\n<p class=\"doc-p\">\ud638\uc8fc \uc18c\ub4dd\uc138\ubc95(<em>Income Tax Assessment Act 1936<\/em>) Division 7A\uac00 \ubc14\ub85c \uadf8 \uadfc\uac70\uc608\uc694. \ube44\uc0c1\uc7a5 \ubc95\uc778\uc774 \uc8fc\uc8fc\ub098 \ud2b9\uc218\uad00\uacc4\uc778(Associate \u00b7 \ubc30\uc6b0\uc790 \ubc0f \uc804 \ubc30\uc6b0\uc790 \ud3ec\ud568)\uc5d0\uac8c \uc801\uaca9 \ub300\uc5ec \uc57d\uc815 \uc5c6\uc774 \ud604\uae08\uc744 \uc8fc\uac70\ub098 \uc790\uc0b0\uc744 \ub118\uae30\uba74 \ubc30\ub2f9\uc138\uc561\uacf5\uc81c \uc5c6\ub294 \uac04\uc8fc\ubc30\ub2f9(deemed unfranked dividend)\uc73c\ub85c \ubcf4\uc544 \ucd5c\uace0 \ud55c\uacc4\uc138\uc728\ub85c \uacfc\uc138\ud558\uac70\ub4e0\uc694. \uc7ac\uc0b0\ubd84\ud560 \uba85\ub839(s 79) \uc774\ud589 \uc2dc\uc5d0\ub3c4 Division 7A\ub294 \uc790\ub3d9 \uba74\uc81c\ub418\uc9c0 \uc54a\uace0 \uc591\ub3c4\uc18c\ub4dd\uc138 \uc774\uc6d4\uacfc\uc138(CGT rollover) \uaddc\uc815\uacfc \uacb9\uccd0 \uc21c\uc790\uc0b0\uc774 \uc138\uae08\uc73c\ub85c \ub179\uc544\ub0b4\ub9b4 \uc218 \uc788\uc5b4\uc694. \ubc95\uc778 \uc720\ubcf4\uae08\uc774\ub098 \uc2e0\ud0c1 \uc790\uc0b0\uc774 \ub080 \uc0ac\uac74\uc740 \uc815\uc2dd \ud569\uc758\uba85\ub839(Consent Orders) \ucd08\uc548 \ub2e8\uacc4\ubd80\ud130 \ubcc0\ud638\uc0ac\uc640 \uc138\ubb34 \uc804\ubb38\uac00\uac00 \ubc30\ub2f9 \uc7ac\uc6d0\uacfc \uacb0\uc758 \uc21c\uc11c\ub97c \uc815\uad50\ud558\uac8c \ub9de\ubb3c\ub824 \uc9dc\uc57c \ud574\uc694.<\/p>\n<h2 id=\"\ub0b4-\uc0ac\uac74\uc5d0-\ub9de\ub294-\ub2e4\uc74c-\ub2e8\uacc4-\uc810\uac80\ud558\uae30\" class=\"doc-h2\">\ub0b4 \uc0ac\uac74\uc5d0 \ub9de\ub294 \ub2e4\uc74c \ub2e8\uacc4 \uc810\uac80\ud558\uae30<\/h2>\n<p class=\"doc-p\">\uac00\uc871\uc2e0\ud0c1\uacfc Pty Ltd \ubc95\uc778\u00b7\ub3d9\uc5c5 \uc9c0\ubd84\u00b7\ub300\ud45c\uc774\uc0ac \uacc4\uc815\uc774 \uc5bd\ud78c \uc7ac\uc0b0\ubd84\ud560\uc740 \uc77c\ubc18 \uac00\uacc4 \uc0ac\uac74\uacfc\ub294 \uacb0\uc774 \ub2e4\ub978 \ubcf5\uc7a1\ud55c \uc0ac\uac74\uc774\uc5d0\uc694. \uc0ac\uc5c5\uc744 \uc77c\uad70 \ucabd\uc740 \uc601\uc5c5 \ub9c8\ube44\uc640 Division 7A \uc138\uae08 \ud3ed\ud0c4\uc744 \ub9c9\ub294 \ubc29\uc5b4\uc120\uc774 \uc2dc\uae09\ud574\uc694. \ubc18\ub300\ud3b8 \ubc30\uc6b0\uc790\ub294 s 71B \uc7a5\ubd80 \uacf5\uac1c \uc694\uad6c\uc640 \ub2e8\uc77c \uacf5\ub3d9\uac10\uc815\uc778(Single Expert) \uc808\ucc28\ub85c \uc228\uaca8\uc9c4 \uc2e4\uc9c8 \uac00\uce58\ub97c \ucc3e\uc544\ub0b4\uc57c \ud558\uc8e0. \ubcf4\uc720 \ubc95\uc778\u00b7\uc2e0\ud0c1 \uc790\uc0b0\uc758 \ud3c9\uac00\uac00 \uad81\uae08\ud558\uc2dc\ub2e4\uba74 \uc628\ub77c\uc778 \uc9c8\ubb38\uc9c0(<a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\uac00\uc871\ubc95 \uc0ac\uc548 \uc811\uc218 \ubc14\ub85c\uac00\uae30<\/a>)\ub098 \uacf5\uc2dd \ud1b5\ud569 \ucc3d\uad6c(<a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ubc15\uc564\ucf54 \uacf5\uc2dd \ub9c1\ud06c \ud5c8\ube0c<\/a>)\ub85c \uc9c0\ubd84 \uad6c\uc870\uc640 \ubcc4\uac70 \uc2dc\uc810\uc744 \ub0a8\uaca8 \uc8fc\uc138\uc694. \uc774\ud574\ucda9\ub3cc \ud655\uc778 \ud6c4 \uac00\uce58\ud3c9\uac00 \ub300\uc751\ubd80\ud130 \uc808\uc138\ud615 \ud569\uc758\uba85\ub839 \uc124\uacc4\uae4c\uc9c0 \uc548\uc804\ud55c \uacbd\ub85c\ub97c \uc9da\uc5b4 \ub4dc\ub9b4\uac8c\uc694.<\/p>\n\n          <div class=\"col-sources-box\">\n            \uadfc\uac70 \ubc95\ub839 \ubc0f \ud310\ub840: Family Law Act 1975 ss 71B, 79, 90AE, 106B \u00b7 FCFCOA (Family Law) Rules 2021 Pt 7.1 rr 7.03\u20137.08 \u00b7 Income Tax Assessment Act 1936 Div 7A \u00b7 Kennon v Spry [2008] HCA 56 \u00b7 Ascot Investments v Harper [1981] HCA 1 \u00b7 Driesen &amp; Klerk [2026] FedCFamC1A 74.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">\ud63c\uc790 \uc9c4\ud589\uc744 \uba48\ucd94\uace0 \ubcc0\ud638\uc0ac\ub97c \ucc3e\uc544\uc57c \ud558\ub294 \uc21c\uac04 \u00b7 \uac00\uc871\ubc95<\/span>\n            <h3 class=\"col-cta-title\">\ud569\uc758\ub41c \uc870\uac74\uc744 \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950)\uc73c\ub85c \ud655\uc815\ud558\uace0 \uc2f6\uac70\ub098 \uc5f0\ub77d\uc744 \ud53c\ud558\ub294 \ubc30\uc6b0\uc790\uc640 \uc7ac\uc0b0\ubd84\ud560 \ud611\uc0c1\uc744 \uc2dc\uc791\ud574\uc57c \ud558\ub098\uc694?<\/h3>\n            <p class=\"col-cta-desc\">\ub2e8\uc21c \uc628\ub77c\uc778 \uc774\ud63c \uc2e0\uccad\uc740 \ud3ec\ud138 \uc124\uba85\uc11c\ub97c \ubcf4\uace0 \uc9c1\uc811 \uc9c4\ud589\ud558\uba74 \uc218\ucc9c \ub2ec\ub7ec\ub97c \uc544\ub07c\uc2e4 \uc218 \uc788\uc5b4\uc694. \ubc18\uba74 \ubc95\uc801 \ud6a8\ub825\uc774 \uc788\ub294 \uc7ac\uc0b0\u00b7\uc591\uc721 \ud569\uc758\uba85\ub839(Consent Orders) \uc791\uc131\uc774\ub098 \uc5f0\ub77d\uc744 \ud53c\ud558\ub294 \ubc30\uc6b0\uc790\uc758 \uc7ac\uc0b0 \uacf5\uac1c \uc694\uad6c\u00b7\ud55c\uad6d\uacfc \ud638\uc8fc\uc5d0 \uac78\uce5c \uc7ac\uc0b0\ubd84\ud560\uc774 \ud544\uc694\ud560 \ub54c\ub294 3\ubd84 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \ud575\uc2ec \ub0a0\uc9dc\uc640 \uc7ac\uc0b0 \ub0b4\uc5ed\uc744 \ub0a8\uaca8 \uc8fc\uc138\uc694.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">\uac00\uc871\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../files/KO/PDF/03_Family_Law_Divorce_Property_Parenting_and_Settlement_Manual_2026_KO.pdf\" download class=\"col-btn-ghost\">03 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc694\uc57d PDF \ubc1b\uae30<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">\ubc15\uc564\ucf54 \uacf5\uc2dd \uc0c1\ub2f4 \ub9c1\ud06c \ud5c8\ube0c<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">\ubc95\ub960 \uc548\ub0b4: \uc774 \uce7c\ub7fc\uc740 \ud638\uc8fc \uc5f0\ubc29 \uac00\uc871\ubc95(Family Law Act 1975)\uacfc \uacf5\uc2dd \ud1b5\uacc4\u00b7\ud310\ub840\ub97c \ubc14\ud0d5\uc73c\ub85c \uc54c\uae30 \uc27d\uac8c \uc815\ub9ac\ud55c \uc77c\ubc18 \ubc95\ub960 \uc815\ubcf4\uc608\uc694. \uac1c\ubcc4 \uc0ac\uac74\uc5d0 \ub300\ud55c \ubc95\ub960 \uc790\ubb38\uc774\ub098 \uc218\uc784 \uacc4\uc57d \uc131\ub9bd\uc744 \ub73b\ud558\uc9c0 \uc54a\uc73c\ub2c8 \uc774\ud63c \ud6c4 12\uac1c\uc6d4\u00b7\uc0ac\uc2e4\ud63c \uacb0\ubcc4 \ud6c4 2\ub144 \ub9c8\uac10 \uae30\ud55c\uc774\ub098 \ube44\uc790 \uae30\ud55c\uc774 \uc784\ubc15\ud588\ub2e4\uba74 \uc9c0\uccb4 \uc5c6\uc774 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uac80\ud1a0\ub97c \ubc1b\uc544 \ubcf4\uc138\uc694.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">\ud568\uaed8 \uc77d\uc73c\uba74 \uc88b\uc740 \uac00\uc871\ubc95 \ud310\ub840 \uce7c\ub7fc<\/h3>\n        <a href=\"../../?lang=ko&amp;tab=family\" class=\"col-back-link num\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../property-reforms-2026/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">2025\u20132026 \uac1c\uc815 \ud574\uc124 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 01<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \uac00\uc871\ubc95 \uc7ac\uc0b0\ubd84\ud560 \uac1c\ud3b8 \ud575\uc2ec: \uacbd\uc81c\uc801 \ud559\ub300 \ubc18\uc601, \ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ud574\uc678\uc790\uc0b0, \ubc18\ub824\ub3d9\ubb3c \ubc0f \uc81c\ucc99\uae30\uac04 \ucd1d\uc815\ub9ac<\/h4><p class=\"col-sib-desc\">\uc774\ubbf8 \uc368\ubc84\ub9b0 \ub3c8 \ud569\uc0b0(Add-backs) \ud3d0\uc9c0, \uacbd\uc81c\uc801 \ud559\ub300 \ubc18\uc601, \ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ud55c\uad6d \uc7ac\uc0b0 \uacf5\uac1c \uc758\ubb34, \ubc18\ub824\ub3d9\ubb3c \uadc0\uc18d \uae30\uc900, \uadf8\ub9ac\uace0 12\uac1c\uc6d4/2\ub144 \uc7ac\uc0b0\ubd84\ud560 \ub9c8\uac10 \uae30\ud55c\uae4c\uc9c0 \uc54c\uae30 \uc27d\uac8c \uc815\ub9ac\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../divorce-parenting-reality-guide/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc2e4\uc804 \uac00\uc774\ub4dc \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 02<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \uc774\ud63c \uc808\ucc28\uc640 \uc7ac\uc0b0\ubd84\ud560\u00b7\uc591\uc721\uad8c, \ubcc0\ud638\uc0ac \uc120\uc784 \uc804 \ubc18\ub4dc\uc2dc \uc54c\uc544\uc57c \ud560 \ud604\uc2e4 \uae30\uc900<\/h4><p class=\"col-sib-desc\">\uc678\ub3c4 \uc704\uc790\ub8cc\uc5d0 \ub300\ud55c \uc624\ud574\uc640 \ud55c\uacb0 \uc26c\uc6cc\uc9c4 \uc11c\uba74 \uc774\ud63c \uc808\ucc28, \ubc18\ubc18 \uacf5\ub3d9\uc591\uc721 \ucd94\uc815 \ud3d0\uc9c0, \uadf8\ub9ac\uace0 \uc18c\uc561 \uc7ac\uc0b0 \uc0ac\uac74(\u2264$550k)\uacfc \uc815\uc561 \ud569\uc758\uba85\ub839($4,950) \uc911 \ubb34\uc5c7\uc774 \uc774\ub4dd\uc778\uc9c0 \uc9da\uc5b4 \ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../partner-visa-breakdown-crossborder/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc774\ubbfc\u00b7\uac00\uc871\ubc95 \uad50\ucc28 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 03<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \ud30c\ud2b8\ub108\ube44\uc790 \uc9c4\ud589 \uc911 \uacb0\ubcc4\u00b7\uac00\uc815\ud3ed\ub825\uacfc \ud55c\u00b7\ud638 \uad6d\uc81c \uc7ac\uc0b0\ubd84\ud560 \uc2e4\uc804 \ub300\ucc98\ubc95<\/h4><p class=\"col-sib-desc\">\ubc30\uc6b0\uc790\uc758 \ube44\uc790 \ucde8\uc18c \ud611\ubc15\uc5d0 \ub300\ucc98\ud558\ub294 \ubc95\ubd80\ud130 \uac00\uc815\ud3ed\ub825 \uc601\uc8fc\uad8c \uad6c\uc81c \uc694\uac74, \ud55c\uad6d\u00b7\ud638\uc8fc \uc591\uad6d \uc7ac\uc0b0 \uc815\ub9ac, \uc544\uc774\ub97c \ub3d9\uc758 \uc5c6\uc774 \ub370\ub9ac\uace0 \ucd9c\uad6d\ud558\uba74 \uc548 \ub418\ub294 \uc774\uc720\uae4c\uc9c0 \uc27d\uac8c \ud480\uc5b4\uc37c\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../parental-advances-loans-gifts-divorce/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubd80\ubaa8 \uc9c0\uc6d0\uae08\u00b7\ucc28\uc6a9\uc99d \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 14<\/span><h4 class=\"col-sib-title\">\ud55c\uad6d \ubd80\ubaa8\ub2d8\uc774 \ubcf4\ud0dc\uc900 \uc9d1\uac12 3\uc5b5, \ud638\uc8fc \uc774\ud63c\ud560 \ub54c \ub3cc\ub824\uc904 \ub300\uc5ec\uae08\uc77c\uae4c \ub098\ub20c \uc99d\uc5ec\uc77c\uae4c<\/h4><p class=\"col-sib-desc\">\ud55c\uad6d\u00b7\ud638\uc8fc \ubd80\ubaa8\ub2d8\uc774 \uc9d1 \uc0b4 \ub54c \ubcf4\ud0dc\uc8fc\uc2e0 \ub3c8\uc774 \uac1a\uc544\uc57c \ud560 \ube5a\uc73c\ub85c \uba3c\uc800 \ube60\uc9c0\ub294 \uacbd\uc6b0\uc640 \ubd80\ubd80 \uc7ac\uc0b0\uc5d0 \uc11e\uc774\ub294 \ucc28\uc774\ub97c \uc2e4\uc81c \ud310\ub840\ub85c \uc54c\uae30 \uc27d\uac8c \ube44\uad50\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../post-separation-inheritances-windfalls-delay/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubcc4\uac70 \ud6c4 \uc0c1\uc18d\u00b7\uc9c0\uccb4\uc704\ud5d8 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 16<\/span><h4 class=\"col-sib-title\">\ubcc4\uac70\ud55c \uc9c0 4\ub144 \uc9c0\ub0ac\uc73c\ub2c8 \uc0c8\ub85c \ubc1b\uc740 \uc0c1\uc18d\uc774\ub098 \uc9d1\uac12 \uc0c1\uc2b9\ubd84\uc740 \ub0b4 \uac83\uc774\uaca0\uc9c0: \ud569\uc758\uba85\ub839(Consent Orders)\uc744 \ubbf8\ub8ec \ub300\uac00<\/h4><p class=\"col-sib-desc\">\ubcc4\uac70 \ub4a4 \uc11c\ub958 \uc815\ub9ac\ub97c \ud3c9\uade0 4\ub144\uc529 \ubbf8\ub8e8\ub2e4 \ub098\uc911\uc5d0 \ubc1b\uc740 \uc0c1\uc18d\uae08\uc774\ub098 \uc624\ub978 \uc9d1\uac12\uae4c\uc9c0 \ub098\ub204\uac8c \ub418\ub294 \uc774\uc720\uc640 $4,950 \ubc95\uc6d0 \ud569\uc758\uba85\ub839\uc73c\ub85c \uc548\uc804\ud558\uac8c \ub9c8\ubb34\ub9ac\ud558\ub294 \ubc95\uc744 \ub2f4\uc558\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../prenups-bfa-vs-consent-orders/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ud63c\uc804\uacc4\uc57d BFA \ub300 \ud569\uc758\uba85\ub839 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 17<\/span><h4 class=\"col-sib-title\">\ubcc0\ud638\uc0ac \uc99d\uba85\uc11c\uae4c\uc9c0 \ubd99\uc778 \ud63c\uc804\uacc4\uc57d\uc11c(BFA)\uac00 \ub300\ubc95\uc6d0\uc5d0\uc11c \uae68\uc9c4 \uc774\uc720: \uc7ac\uc0b0\ubd84\ud560 \ud569\uc758\uc11c(BFA) \ub300 \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950) \uc120\ud0dd \uae30\uc900<\/h4><p class=\"col-sib-desc\">\uacb0\ud63c\u00b7\ub3d9\uac70 \uc804\uc5d0 \uc7ac\uc0b0\uc744 \uc548\uc804\ud558\uac8c \uc9c0\ud0a4\ub294 BFA \uc791\uc131 \uc694\ub839\uacfc \uc774\ubbf8 \ud5e4\uc5b4\uc9c4 \ubd80\ubd80\uac00 \uc591\ucabd \ubcc0\ud638\uc0ac\ube44\uac00 \ub4dc\ub294 BFA \ub300\uc2e0 \uc815\uc561 \ud569\uc758\uba85\ub839\uc744 \uace8\ub77c\uc57c \ud558\ub294 \uc774\uc720\ub97c \ube44\uad50\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../de-facto-threshold-disputes-out-of-time-s44/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc0ac\uc2e4\ud63c \uacbd\uacc4\u00b7\uae30\ud55c\ub3c4\uacfc \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 18<\/span><h4 class=\"col-sib-title\">\ub3d9\uac70\ub294 \uc548 \ud558\uace0 \uc0dd\ud65c\ube44\ub9cc \uc92c\ub294\ub370 \uc0ac\uc2e4\ud63c(De Facto) \uc18c\uc1a1\uc774 \ub4e4\uc5b4\uc654\ub2e4\uba74: \uc0ac\uc2e4\ud63c \uc778\uc815 \uae30\uc900(s 4AA)\uacfc \ub9c8\uac10 \uae30\ud55c \uc608\uc678 \uc2e0\uccad(s 44)<\/h4><p class=\"col-sib-desc\">\ub2e8\uc21c \uc5f0\uc778 \uad00\uacc4\uc640 \ubc95\uc801 \uc0ac\uc2e4\ud63c\uc744 \uac00\ub974\ub294 &#x27;\ud558\ub098\uc758 \uc0b6(Coupledom)&#x27; \uae30\uc900\ubd80\ud130 \uae30\ud63c\uc790\uc640\uc758 \uc774\uc911 \uc0ac\uc2e4\ud63c, \ub9c8\uac10 \uae30\ud55c\uc774 \uc9c0\ub09c \uc0ac\uac74\uc758 \ub300\uc751\ubc95\uae4c\uc9c0 \uc27d\uac8c \uc815\ub9ac\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}, "en": {"doc_title": "Family Trusts, Private Pty Ltd Companies and Shadow Business Valuations in Property Settlements \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">All Guides Hub<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=en\">Visa Solution Guide<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=en\">Employment Navigator<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=en\">DIY & Cost-Smart Guide<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\">Consult Park & Co \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=en&amp;tab=family\" class=\"col-back-btn\">\u2190 Back to Family Law Self-Help Hub<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">Park &amp; Co Lawyers \u00b7 Family Law Deep-Dive Column<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn\">KO<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn active\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">Consult Park &amp; Co \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">TRUSTS &amp; VALUATIONS \u00b7 FAMILY 15<\/span>\n          <span class=\"col-verified-pill num\">Primary-Source Verified (Nov 2026)<\/span>\n          <span class=\"col-time-pill num\">9 min read<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">Family Trusts, Private Pty Ltd Companies and Shadow Business Valuations in Property Settlements<\/h1>\n        <p class=\"col-subtitle\">When discretionary trusts enter the pool under Kennon v Spry, why partisan valuations received zero weight in Driesen &amp; Klerk [2026], and Division 7A tax traps<\/p>\n\n        <div class=\"col-byline\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">Chang Min Park<\/div>\n            <div class=\"col-author-role\">Legal Practitioner Director, Park &amp; Co Lawyers \u00b7 Accredited Specialist in Immigration Law (QLS)<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col15_fam_trusts_hero.jpg\" alt=\"Family Trusts, Private Pty Ltd Companies and Shadow Business Valuations in Property Settlements\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">Discretionary family trusts controlled by one spouse fall squarely within s 79 under Kennon v Spry, while unilateral accountant valuations carry zero evidentiary weight.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">Zero Weight<\/div><div class=\"col-stat-lbl\">Partisan accountant valuation rejected in Driesen &amp; Klerk [2026] FedCFamC1A 74<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">Spry Control Test<\/div><div class=\"col-stat-lbl\">Appointor/trustee power brings discretionary trust assets into s 79<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">Up to 47% Tax<\/div><div class=\"col-stat-lbl\">Division 7A deemed-dividend exposure on informal corporate transfers<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">In This Column<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#discretionary-family-trusts-after-kennon-v-spry-\" class=\"col-toc-link lvl-2\">Discretionary family trusts after Kennon v Spry: control beats legal title<\/a><a href=\"#genuine-business-partners-and-the-ascot-investme\" class=\"col-toc-link lvl-2\">Genuine business partners and the Ascot Investments boundary<\/a><a href=\"#why-unilateral-accountant-letters-carry-zero-wei\" class=\"col-toc-link lvl-2\">Why unilateral accountant letters carry zero weight after Driesen &amp; Klerk<\/a><a href=\"#division-7a-deemed-dividends-when-pulling-cash-o\" class=\"col-toc-link lvl-2\">Division 7A deemed dividends when pulling cash or assets out of a company<\/a><a href=\"#auditing-corporate-structures-and-drafting-tax-s\" class=\"col-toc-link lvl-2\">Auditing corporate structures and drafting tax-safe property orders<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">Open Family Law Consultation Form<\/a>\n              <a href=\"../../?lang=en&amp;tab=family\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 Back to Family Law Self-Help Hub<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">Business owners regularly come into an initial separation conference convinced that real estate or retained profits held inside a discretionary family trust or a private Pty Ltd company sit outside their former partner&#x27;s reach. Tax accountants inadvertently feed that belief during intact years by explaining that no beneficiary owns a fixed slice of a discretionary trust until the trustee resolves to distribute. That statement works in trust textbooks, yet it fails inside the Federal Circuit and Family Court of Australia (FCFCOA). Family law judges look past corporate shells to ask one practical question: who holds the power to unlock the vault?<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 366\" width=\"100%\" role=\"img\" aria-label=\"Family Trusts, Shadow Valuations &amp; Division 7A Tax Traps\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"365\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">CORPORATE &amp; TRUST STRUCTURES \u00b7 s 79, s 106B &amp; DIV 7A<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">Family Trusts, Shadow Valuations &amp; Division 7A Tax Traps<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">Authorities: Kennon v Spry [2008] HCA 56 \u00b7 Ascot Investments [1981] HCA 1 \u00b7 Driesen &amp; Klerk [2026] FedCFamC1A 74<\/text>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"36\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">RULE 01 \u00b7 EFFECTIVE CONTROL<\/text>\n  <text x=\"36\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">Piercing Discretionary Trusts<\/text>\n  <text x=\"36\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\">Kennon v Spry [2008] HCA 56 \u00b7 s 106B<\/text>\n  <line x1=\"36\" y1=\"182\" x2=\"272\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">Appointor + trustee control = s 79 property<\/text>\n  <text x=\"36\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Pulls entire family trust pool onto sheet<\/text>\n  <text x=\"36\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">s 106B reverses defensive trust variations<\/text>\n  <text x=\"36\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Genuine 3rd-party partners respected (Ascot)<\/text>\n  <line x1=\"289\" y1=\"195\" x2=\"300\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"303,195 297,191 297,199\" fill=\"#1F242B\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"320\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">RULE 02 \u00b7 VALUATION GATE<\/text>\n  <text x=\"320\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">Unilateral Reports Get Zero Weight<\/text>\n  <text x=\"320\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E5F\">Driesen &amp; Klerk [2026] FedCFamC1A 74<\/text>\n  <line x1=\"320\" y1=\"182\" x2=\"556\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"320\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">Husband&#x27;s partisan valuation given &#x27;no weight&#x27;<\/text>\n  <text x=\"320\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">FCFCOA Rules Pt 7.1 mandate Single Expert<\/text>\n  <text x=\"320\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">s 71B compels full BAS, ledger &amp; loan disclosure<\/text>\n  <text x=\"320\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Forensic normalisation of personal expenses<\/text>\n  <line x1=\"573\" y1=\"195\" x2=\"584\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"587,195 581,191 581,199\" fill=\"#1F242B\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FEF8EC\" stroke=\"#9A6700\" stroke-width=\"1.3\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#9A6700\"/>\n  <text x=\"604\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">RULE 03 \u00b7 DIV 7A TAX SHIELD<\/text>\n  <text x=\"604\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">Avoiding Division 7A Deemed Tax<\/text>\n  <text x=\"604\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#9A6700\">ITAA 1936 Div 7A \u00b7 CGT Rollover<\/text>\n  <line x1=\"604\" y1=\"182\" x2=\"840\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"604\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">Informal company cash/asset extraction<\/text>\n  <text x=\"604\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Triggers up to 47% Div 7A deemed dividend!<\/text>\n  <text x=\"604\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Must structure via sealed s 79 Court Orders<\/text>\n  <text x=\"604\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Preserves CGT rollover &amp; stamp-duty relief<\/text>\n  <rect x=\"22\" y=\"312\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#FEF8EC\" stroke=\"#ECD9B0\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"335\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">Takeaway: Business &amp; trust settlements hinge on joint Single Expert instructions and tax-effective s 79 order drafting.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 1: When Discretionary Trusts Enter the s 79 Pool vs Genuine Third-Party Interests<\/figcaption><\/figure>\n<h2 id=\"discretionary-family-trusts-after-kennon-v-spry-\" class=\"doc-h2\">Discretionary family trusts after Kennon v Spry: control beats legal title<\/h2>\n<p class=\"doc-p\">The High Court settled how discretionary trusts behave on divorce in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2008/56.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Kennon v Spry<\/em> [2008] HCA 56<\/a>. Dr Spry controlled a discretionary family trust as trustee. As his marriage broke down, he varied the deed to exclude his wife and split capital across children&#x27;s trusts, contending the fund could never constitute &quot;property of the parties to the marriage&quot; under s 79 of the <em>Family Law Act 1975<\/em> (Cth).<\/p>\n<p class=\"doc-p\">The High Court disagreed and brought the entire trust value into the s 79 pool. Combined, the husband&#x27;s dispositive control as trustee and the wife&#x27;s equitable right as an eligible beneficiary to due administration satisfied the statutory definition of property, while s 106B empowered the Court to set aside deed variations designed to defeat an anticipated claim. In everyday FCFCOA practice, solicitors turn straight to the schedule of the trust deed to identify the Appointor (or Principal). Where one spouse holds power to hire and fire the corporate trustee and either spouse sits within the beneficiary class, the trust&#x27;s net equity ordinarily enters the s 79(3)(a) or s 90SM(3)(a) balance sheet in full.<\/p>\n<h2 id=\"genuine-business-partners-and-the-ascot-investme\" class=\"doc-h2\">Genuine business partners and the Ascot Investments boundary<\/h2>\n<p class=\"doc-p\">Arm&#x27;s-length commercial co-owners and genuine generational trusts sit on different footing. Under <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/1981/1.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Ascot Investments Pty Ltd v Harper<\/em> [1981] HCA 1<\/a>, a family court cannot override the substantive proprietary rights of independent third-party shareholders or co-trustees unless the entity is proved to be a sham or a mere puppet of one spouse.<\/p>\n<p class=\"doc-p\">Although Part VIIIAA (s 90AE) now permits procedural orders binding third parties where necessary to implement a settlement, s 90AE(3) preserves the core <em>Ascot Investments<\/em> rule: orders cannot expose innocent business partners to commercial prejudice or leave debts unpaid. Where elderly parents genuinely control an intergenerational trust and neither spouse is Appointor, the underlying capital stays off the Step 1 balance sheet, though regular historic distributions can still count as a financial resource under s 79(5) or s 90SM(5).<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">Corporate or Trust Scenario<\/th><th style=\"text-align:left\">Governing Legal Authority<\/th><th style=\"text-align:left\">FCFCOA Balance-Sheet &amp; Tax Consequence<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Spouse-Controlled Discretionary Trust<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2008/56.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Kennon v Spry<\/em> [2008] HCA 56<\/a>; s 79(3)(a) &amp; s 106B<\/td><td style=\"text-align:left\">Full net trust equity enters the divisible pool; defensive variations set aside under s 106B<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Arm&#x27;s-Length Multi-Partner Pty Ltd or Parental Trust<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/1981/1.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Ascot Investments Pty Ltd v Harper<\/em> [1981] HCA 1<\/a>; Part VIIIAA s 90AE<\/td><td style=\"text-align:left\">Third-party rights respected unless sham/puppet; minority shares valued or distributions weighed under s 79(5)<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Unilateral Company Accountant Valuation Letter<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2026/74.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Driesen &amp; Klerk<\/em> [2026] FedCFamC1A 74<\/a>; FCFCOA Rules Pt 7.1 rr 7.03\u20137.08<\/td><td style=\"text-align:left\">Given zero weight (no weight) if resting on unverified instructions; Joint Single Expert mandatory<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Informal Cash or Asset Extraction From Pty Ltd<\/strong><\/td><td style=\"text-align:left\"><em>Income Tax Assessment Act 1936<\/em> (Cth) Division 7A (ss 109C, 109D, 109RC)<\/td><td style=\"text-align:left\">Triggers unfranked deemed dividend taxed up to 47% unless structured inside sealed s 79 / Consent Orders<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"why-unilateral-accountant-letters-carry-zero-wei\" class=\"doc-h2\">Why unilateral accountant letters carry zero weight after Driesen &amp; Klerk<\/h2>\n<p class=\"doc-p\">Once a private company lands on the balance sheet, the dispute moves to valuation. Directors routinely ask their regular external tax accountant for a short letter asserting that Pty Ltd shares hold negligible value beyond plant and equipment.<\/p>\n<p class=\"doc-p\">The appeal court crushed that tactic in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2026/74.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Driesen &amp; Klerk<\/em> [2026] FedCFamC1A 74<\/a> (1 May 2026), upholding a trial judge who gave zero weight (no weight) to a husband&#x27;s unilateral valuation of F Pty Ltd because it relied on his unverified assertions rather than tested primary records. Under Part 7.1 (rr 7.03\u20137.08) of the <em>FCFCOA (Family Law) Rules 2021<\/em>, contested businesses must be valued by a jointly instructed Single Expert Witness rather than partisan valuers. Armed with general ledgers, BAS statements, and director loan accounts produced under mandatory s 71B and s 90RI financial disclosure, forensic valuers normalise maintainable earnings by adding back personal vehicles, non-working family wages, and private drawings expensed through the business. A registrar or judge will not rubber-stamp a director&#x27;s guess.<\/p>\n<h2 id=\"division-7a-deemed-dividends-when-pulling-cash-o\" class=\"doc-h2\">Division 7A deemed dividends when pulling cash or assets out of a company<\/h2>\n<p class=\"doc-p\">Agreeing on enterprise value solves only half the problem when settlement cash sits locked inside a trading company. Paying out an ex-spouse directly from a Pty Ltd bank account, transferring a company-owned apartment or car, or forgiving a shareholder loan under an informal deal triggers Division 7A of the <em>Income Tax Assessment Act 1936<\/em> (Cth) (ss 109C, 109D). The ATO treats that transfer as an unfranked deemed dividend taxed at up to 47% in the recipient&#x27;s hands.<\/p>\n<p class=\"doc-p\">Transferring corporate cash or property under sealed s 79 or s 90SM Consent Orders allows the deemed dividend to be franked under s 109RC using the company&#x27;s franking credits, alongside Subdivision 126-A CGT rollover relief under the <em>Income Tax Assessment Act 1997<\/em> (Cth) (noting latent CGT still follows company assets into individual hands). Skipping coordinated tax and family law drafting routinely leaves a six-figure ATO bill behind after settlement.<\/p>\n<h2 id=\"auditing-corporate-structures-and-drafting-tax-s\" class=\"doc-h2\">Auditing corporate structures and drafting tax-safe property orders<\/h2>\n<p class=\"doc-p\">Separating spouses who share a trading company or discretionary trust need orders that achieve clean finality without starving working capital or triggering Division 7A penalties. Where parties have reached commercial terms after reviewing financials, Park &amp; Co prepares FCFCOA Consent Orders for a $4,950 fixed fee (plus the $215 court filing fee), coordinating with your tax adviser on s 109RC franking, CGT rollovers, and trustee releases. Where a director spouse conceals ledgers, shifts trust control, or tenders a partisan valuation, our litigation team enforces s 71B and s 90RI disclosure, seeks s 106B injunctions, and runs Single Expert instructions. Submit your structure summary via the <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Family Law Consultation Form<\/a> or visit the <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Official Links Hub<\/a> to arrange a review.<\/p>\n\n          <div class=\"col-sources-box\">\n            Primary Authorities: Family Law Act 1975 (Cth) ss 71B, 79, 90AE, 106B \u00b7 FCFCOA (Family Law) Rules 2021 Pt 7.1 \u00b7 ITAA 1936 Div 7A \u00b7 Kennon v Spry [2008] HCA 56 \u00b7 Ascot Investments v Harper [1981] HCA 1 \u00b7 Driesen &amp; Klerk [2026] FedCFamC1A 74.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">WHEN TO CONSULT PARK &amp; CO LAWYERS \u00b7 FAMILY LAW<\/span>\n            <h3 class=\"col-cta-title\">Ready to Lock In $4,950 Consent Orders, Compel Disclosure, or Protect Family Assets?<\/h3>\n            <p class=\"col-cta-desc\">Save thousands on straightforward No-Fault Divorce using our DIY manual; when you need enforceable Consent Orders, formal financial disclosure demands, or cross-border property protection, submit your key dates via our 3-minute consultation form.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">Open Family Law Consultation Form<\/a>\n              <a href=\"../../files/EN/PDF/03_Family_Law_Divorce_Property_Parenting_and_Settlement_Manual_2026_EN.pdf\" download class=\"col-btn-ghost\">Download Manual 03 (Family Law PDF)<\/a>\n              <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">Park &amp; Co Official Consultation Hub<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">Legal Disclaimer: This publication provides general legal information grounded in Australian legislation, official statistics and superior court authorities current as at November 2026. It does not constitute legal advice for your specific circumstances or create a solicitor-client relationship. Seek formal advice promptly before statutory limitation or visa deadlines expire.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">More Curated Family Law Columns<\/h3>\n        <a href=\"../../?lang=en&amp;tab=family\" class=\"col-back-link num\">\u2190 Back to Family Law Self-Help Hub<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../property-reforms-2026/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">2025\u20132026 REFORM BRIEFING \u00b7 FAMILY 01<\/span><h4 class=\"col-sib-title\">Australia&#x27;s 2025\u20132026 Property Settlement Overhaul: Economic Abuse, Separate Accounts, Family Pets &amp; Limitation Bars<\/h4><p class=\"col-sib-desc\">Covers the abolition of balance-sheet add-backs, s 4AB(2A) economic abuse proof thresholds, separate accounts and overseas assets under s 71B, the ban on shared pet custody, and strict s 44 time bars.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../divorce-parenting-reality-guide/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PRACTICAL REALITY GUIDE \u00b7 FAMILY 02<\/span><h4 class=\"col-sib-title\">Divorce, Parenting &amp; Property in Australia: The Practical Reality Check Before You Hire a Lawyer<\/h4><p class=\"col-sib-desc\">Explains s 48 no-fault DIY divorce and June 2025 s 98A paper hearings, the repeal of equal-time parenting presumptions (Gallagher, Picard, Radecki), PPP &lt;=$550k vs $4,950 Consent Orders.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../partner-visa-breakdown-crossborder/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">FAMILY &amp; VISA INTERSECTION \u00b7 FAMILY 03<\/span><h4 class=\"col-sib-title\">Partner Visa Breakdown, Division 1.5 Family Violence PR &amp; Cross-Border Property Traps<\/h4><p class=\"col-sib-desc\">Why sponsors cannot cancel visas, clearing the Gupta genuine-relationship gate and July 2024 Subclass 309 entry rules, aligning FCFCOA and DHA affidavits, and avoiding s 65Y travel offences.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a><a href=\"../parental-advances-loans-gifts-divorce/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PARENTAL ADVANCES \u00b7 FAMILY 14<\/span><h4 class=\"col-sib-title\">The Bank of Mum and Dad in Australian Divorce: Repayable Loan, Resulting Trust or Gift?<\/h4><p class=\"col-sib-desc\">Distinguishes deductible balance-sheet debts from s 79(4) contributions, resulting trusts vs advancement presumptions, and third-party parent interventions.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../post-separation-inheritances-windfalls-delay/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">POST-SEPARATION WEALTH \u00b7 FAMILY 16<\/span><h4 class=\"col-sib-title\">Why Delaying Consent Orders Exposes Post-Separation Inheritances, Lotto Wins and New Equity<\/h4><p class=\"col-sib-desc\">How leaving informal separations unsealed exposes inheritances received 4 years later, $5M\u2013$6M lottery windfalls and rising home equity, and how $4,950 Consent Orders close the door.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../prenups-bfa-vs-consent-orders/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PRENUPS &amp; CONSENT ORDERS \u00b7 FAMILY 17<\/span><h4 class=\"col-sib-title\">Why Prenups Get Crushed Under Thorne v Kennedy and When $4,950 Consent Orders Beat a BFA<\/h4><p class=\"col-sib-desc\">Explains how pre-marital wealth-protection BFAs survive scrutiny and why separated couples who agree save thousands with fixed-fee $4,950 Court Consent Orders.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../de-facto-threshold-disputes-out-of-time-s44/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">DE FACTO &amp; TIME BARS \u00b7 FAMILY 18<\/span><h4 class=\"col-sib-title\">&quot;Were We Even De Facto?&quot; Litigating s 4AA Thresholds, Concurrent Marriages and Out-of-Time Leave<\/h4><p class=\"col-sib-desc\">Why a 17-year secret relationship with monthly allowances failed s 4AA, when concurrent marriages still allow de facto claims, and how courts weigh s 44 hardship and delay.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}}</script>

  function fetchRetry(url, isHit, attempt) {

    return fetch(url, opts)
      .then(function (r) {

          throw err429;

      .then(function (j) {
        if (typeof j.value !== 'number') throw new Error('bad payload');
