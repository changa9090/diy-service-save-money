Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">\ubc15\ucc3d\ubbfc \ub300\ud45c\ubcc0\ud638\uc0ac (Chang Min Park)<\/div>\n            <div class=\"col-author-role\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \ub300\ud45c\ubcc0\ud638\uc0ac \u00b7 \ud638\uc8fc \ud038\uc990\ub79c\ub4dc\uc8fc \ubcc0\ud638\uc0ac\ud68c \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac (QLS)<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col10_immi_direction123_hero.jpg\" alt=\"\uc720\uc8c4 \ud310\uacb0 \uc804 \uae30\uc18c\ub9cc\uc73c\ub85c \ube44\uc790 \ucde8\uc18c \uc608\uace0(NOICC)\uac00 \uc624\ub294 \uc774\uc720\uc640 2026\ub144 10\uc6d4 \uc7a5\uad00\ud6c8\ub839 \uc81c123\ud638 \uae34\uae09 \ubd84\uc11d\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">2026\ub144 10\uc6d4 31\uc77c \uc2dc\ud589\ub41c \uc7a5\uad00\ud6c8\ub839 \uc81c123\ud638\ub294 \ud638\uc8fc \uc815\ucc29 \uae30\uac04\uc758 \ube44\uc911\uc744 \ub0ae\ucd94\uace0 \uac00\uc815\ud3ed\ub825\u00b7\uc548\uc804 \uc2ec\uc0ac\ub97c \ud6e8\uc52c \uc5c4\uaca9\ud558\uac8c \ubc14\uafe8\uc5b4\uc694.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">2026.10.31 \ubc1c\ud6a8<\/div><div class=\"col-stat-lbl\">\uc7a5\uad00\ud6c8\ub839 \uc81c123\ud638(Direction 123) \uc804\uba74 \uc2dc\ud589 \u00b7 \uad6c 110\ud638 \uacf5\uc2dd \ud3d0\uc9c0<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">4\ub300 \ucd5c\uc6b0\uc120 \uc694\uc18c<\/div><div class=\"col-stat-lbl\">&#x27;\ud638\uc8fc \ub0b4 \uc720\ub300\uad00\uacc4&#x27; \uae30\ud0c0(Other)\ub85c \uac15\ub4f1 \u00b7 &#x27;\ud638\uc8fc \uc0ac\uc5c5\uccb4 \uc601\ud5a5&#x27; \uc644\uc804 \uc0ad\uc81c<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">\uc720\uc8c4 \ud310\uacb0 \ubd88\uc694<\/div><div class=\"col-stat-lbl\">\uacbd\ucc30 \uae30\uc18c\u00b7\ubcf4\uc11d \uc870\uac74\ub9cc\uc73c\ub85c s 116(1)(e) \uc704\ud5d8 \ucde8\uc18c \uc608\uace0 \uac00\ub2a5 (Gong \ud310\ub840)<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">\uc774 \uce7c\ub7fc\uc758 \ubaa9\ucc28<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#\uc720\uc8c4-\ud655\uc815-\uc804-\uacbd\ucc30-\uae30\uc18c\ub9cc\uc73c\ub85c-\ube44\uc790\uac00-\ud754\ub4e4\ub9ac\ub294-\ubc95\ub9ac-s-1161e\uc640-gong-\ud310\uacb0\" class=\"col-toc-link lvl-2\">\uc720\uc8c4 \ud655\uc815 \uc804 \uacbd\ucc30 \uae30\uc18c\ub9cc\uc73c\ub85c \ube44\uc790\uac00 \ud754\ub4e4\ub9ac\ub294 \ubc95\ub9ac: s 116(1)(e)\uc640 Gong \ud310\uacb0<\/a><a href=\"#2026\ub144-10\uc6d4-31\uc77c-\uc7a5\uad00\ud6c8\ub839-\uc81c123\ud638direction-123-\uc804\uba74-\uc2dc\ud589\uacfc-4\ub300-\" class=\"col-toc-link lvl-2\">2026\ub144 10\uc6d4 31\uc77c \uc7a5\uad00\ud6c8\ub839 \uc81c123\ud638(Direction 123) \uc804\uba74 \uc2dc\ud589\uacfc 4\ub300 \ucd5c\uc6b0\uc120 \uae30\uc900<\/a><a href=\"#\uac00\uc815\ud3ed\ub825-\uc911\ubcf5-\ud3c9\uac00-\ud569\ud5cc\uc131ismail\uacfc-\uc18c\uba85\uc11c-\uc2e4\uc9c8-\uac80\ud1a0-\uc758\ubb34plaintiff-m120\" class=\"col-toc-link lvl-2\">\uac00\uc815\ud3ed\ub825 \uc911\ubcf5 \ud3c9\uac00 \ud569\ud5cc\uc131(Ismail)\uacfc \uc18c\uba85\uc11c \uc2e4\uc9c8 \uac80\ud1a0 \uc758\ubb34(Plaintiff M1/2021)<\/a><a href=\"#\uc5b4\uc124\ud508-\uc790\ud544-\ubc18\uc131\ubb38\uc774-\ud615\uc0ac-\uc7ac\ud310\uacfc-\ube44\uc790\ub97c-\ub3d9\uc2dc\uc5d0-\ub9dd\uce58\ub294-\uc774\uc720\" class=\"col-toc-link lvl-2\">\uc5b4\uc124\ud508 \uc790\ud544 \ubc18\uc131\ubb38\uc774 \ud615\uc0ac \uc7ac\ud310\uacfc \ube44\uc790\ub97c \ub3d9\uc2dc\uc5d0 \ub9dd\uce58\ub294 \uc774\uc720<\/a><a href=\"#noicc-\uc218\ub839-\uc9c1\ud6c4-\uace8\ub4e0\ud0c0\uc784\uc744-\uc9c0\ud0a4\ub294-\uae34\uae09-\ub300\uc751-\uacbd\ub85c\" class=\"col-toc-link lvl-2\">NOICC \uc218\ub839 \uc9c1\ud6c4 \uace8\ub4e0\ud0c0\uc784\uc744 \uc9c0\ud0a4\ub294 \uae34\uae09 \ub300\uc751 \uacbd\ub85c<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/220391469091053\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">\uc774\ubbfc\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../?lang=ko&amp;tab=immigration\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 \ube44\uc790\u00b7\uc774\ubbfc \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">\uc8fc\ub9d0 \ubc24 \uc0ac\uc18c\ud55c \uc2dc\ube44\ub098 \ubd80\ubd80 \ub2e4\ud23c\uc73c\ub85c \uacbd\ucc30\uc774 \ucd9c\ub3d9\ud588\uc5b4\uc694. \uc870\uc0ac\ub97c \ubc1b\uace0 \ubcf4\uc11d \uc870\uac74(Bail) \uc544\ub798 \uadc0\uac00\ud588\uc8e0. \uc544\uc9c1 \uccab \uc7ac\ud310\uc870\ucc28 \uc5f4\ub9ac\uc9c0 \uc54a\uc558\uc73c\ub2c8 \ud615\uc0ac \ud310\uacb0\uc774 \ub0a0 \ub54c\uae4c\uc9c0 \ube44\uc790\ub294 \uc548\uc804\ud560 \uac70\ub77c\uace0 \ubbff\uae30 \uc26c\uc6cc\uc694. \ud558\uc9c0\ub9cc \uba70\uce60 \ub4a4 \ub0b4\ubb34\ubd80(Department of Home Affairs)\uac00 \ubcf4\ub0b8 \ube44\uc790 \ucde8\uc18c \uace0\ub824 \ud1b5\uc9c0\uc11c(NOICC)\ub97c \uc5f4\uace0 \ub208\uc55e\uc774 \uce84\uce84\ud574\uc838 \ucc3e\uc544\uc624\ub294 \ubd84\uc774 \ucc38 \ub9ce\uac70\ub4e0\uc694. \ud638\uc8fc \uc774\ubbfc\ubc95\uc758 \uc2dc\uacc4\ub294 \uc720\uc8c4 \ud655\uc815\uc744 \uae30\ub2e4\ub824 \uc8fc\uc9c0 \uc54a\uc544\uc694. \uac8c\ub2e4\uac00 2026\ub144 10\uc6d4 31\uc77c\ubd80\ud130 \uc7a5\uad00\ud6c8\ub839 \uc81c123\ud638(Ministerial Direction No. 123)\uac00 \uc804\uba74 \uc2dc\ud589\ub410\uc8e0. \ucde8\uc18c \ubc29\uc5b4 \uacf5\uc2dd\uc774 \ubfcc\ub9ac\ubd80\ud130 \ub4a4\uc9d1\ud78c \uc148\uc774\uc5d0\uc694. \uc608\uc804 \ud6c4\uae30\ub098 \uad6c\ud615 \ubc18\uc131\ubb38\uc5d0 \uae30\ub314\ub2e4\uac00\ub294 \ube44\uc790\uc640 \ud615\uc0ac \uc7ac\ud310\uc744 \ub3d9\uc2dc\uc5d0 \uadf8\ub974\uce60 \uc218 \uc788\uc5b4\uc694.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 382\" width=\"100%\" role=\"img\" aria-label=\"\uad6c \uc7a5\uad00\ud6c8\ub839 \uc81c110\ud638 \ud3d0\uc9c0\uc640 \uc2e0\uc124 \uc81c123\ud638\uc758 \ube44\uc790 \ucde8\uc18c \uc2ec\uc0ac \uad6c\uc870 \ube44\uad50\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"381\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">2026\ub144 10\uc6d4 31\uc77c \uc804\uaca9 \uc2dc\ud589 \u00b7 \uc7a5\uad00\ud6c8\ub839 \uc81c123\ud638(Direction 123) \ub300\uac1c\ud3b8<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">\uad6c \uc7a5\uad00\ud6c8\ub839 \uc81c110\ud638 \ud3d0\uc9c0\uc640 \uc2e0\uc124 \uc81c123\ud638\uc758 \ube44\uc790 \ucde8\uc18c \uc2ec\uc0ac \uad6c\uc870 \ube44\uad50<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">\uadfc\uac70: Migration Act s 499, s 116(1)(e), s 501 \u00b7 Gong [2016] FCCA 561 \u00b7 Ismail [2024] HCA 2 \u00b7 M1/2021 [2022] HCA 17<\/text>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"38\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">4\ub300 \ucd5c\uc6b0\uc120 \uace0\ub824\uc0ac\ud56d (4 PRIMARY CONSIDERATIONS)<\/text>\n  <circle cx=\"42\" cy=\"144\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">1. \ud638\uc8fc \uc9c0\uc5ed\uc0ac\ud68c \ubcf4\ud638 (\ucd5c\uc0c1\uc704 \uac00\uc911\uce58)<\/text>\n  <text x=\"54\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">\ubc94\ud589 \uc911\ub300\uc131 \ubc0f \uc7ac\ubc94 \uc704\ud5d8\ub3c4 \u00b7 \uae30\uc18c \ub2e8\uacc4(s 116(1)(e))\uc5d0\uc11c\ub3c4 \ubc1c\ub3d9.<\/text>\n  <circle cx=\"42\" cy=\"196\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">2. \uac00\uc815\ud3ed\ub825 \ubc94\uc704 \ub300\ud3ed \ud655\ub300 (\uac15\uc555\uc801 \ud1b5\uc81c \ud3ec\ud568)<\/text>\n  <text x=\"54\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">\ubd88\ubc95 \ucd2c\uc601\ubb3c\u00b7\uc2a4\ud1a0\ud0b9\u00b7\ub514\uc9c0\ud138 \ud559\ub300\u00b7\ubcf4\ud638\uba85\ub839 \uc704\ubc18 \ubaa8\ub450 \ucd5c\uc6b0\uc120 \uc2ec\uc0ac.<\/text>\n  <circle cx=\"42\" cy=\"248\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">3. \uc9c0\uc5ed\uc0ac\ud68c \uae30\ub300\uce58(\ud610\uc624\ubc1c\uc5b8 \uba85\uc2dc) &amp; 4. \ubbf8\uc131\ub144 \uc790\ub140 \uc774\uc775<\/text>\n  <text x=\"54\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">\uadf9\ub2e8\uc8fc\uc758\u00b7\uc0ac\ud68c \ubd84\uc5f4 \uc120\ub3d9 \uc5c4\ub2e8 \ubc0f \ud638\uc8fc \ub0b4 \ubbf8\uc131\ub144 \uc790\ub140 \ucd5c\uc120\uc758 \uc774\uc775.<\/text>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"466\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">\ub4f1\uae09 \uac15\ub4f1 \ubc0f \uc644\uc804 \uc0ad\uc81c \ud56d\ubaa9 (\uce58\uba85\uc801 \uc804\ub7b5 \ubcc0\ud654!)<\/text>\n  <circle cx=\"470\" cy=\"144\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ud638\uc8fc \ub0b4 \uc720\ub300\uad00\uacc4(Ties to Australia) \u2192 \uae30\ud0c0(Other)\ub85c \uac15\ub4f1!<\/text>\n  <text x=\"482\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">\uc7a5\uae30 \uac70\uc8fc\u00b7\uc8fc\ubcc0 \ud0c4\uc6d0\uc11c\ub9cc \ud638\uc18c\ud558\ub358 \uad6c\uc2dd \ubc29\uc5b4 \ub17c\ub9ac\ub294 \ub354 \uc774\uc0c1 \uc548 \ud1b5\ud569\ub2c8\ub2e4.<\/text>\n  <circle cx=\"470\" cy=\"196\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ud638\uc8fc \uc0ac\uc5c5\uccb4 \uc601\ud5a5(Business Interests) \u2192 \uc544\uc608 \uc0ad\uc81c!<\/text>\n  <text x=\"482\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">\uace0\uc6a9\uc8fc \ud53c\ud574 \ud638\uc18c \ud56d\ubaa9 \uc790\uccb4\uac00 \ud6c8\ub839 \ubcf8\ubb38\uc5d0\uc11c \uc644\uc804\ud788 \ud3d0\uc9c0\ub418\uc5c8\uc2b5\ub2c8\ub2e4.<\/text>\n  <circle cx=\"470\" cy=\"248\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ud615\uc0ac \uc7ac\ud310 \uc804 \uc123\ubd80\ub978 \ubc18\uc131\ubb38 = \uc720\uc8c4 \uc790\ubc31 \ub3c5\ubc30<\/text>\n  <text x=\"482\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">\ubb34\uc8c4 \ucd94\uc815 \ubc29\uc5b4\uad8c\uacfc \ube44\uc790 \uc18c\uba85(Gong \ubc95\ub9ac)\uc744 \ub3d9\uc2dc\uc5d0 \uc870\uc728\ud574\uc57c \uc0dd\uc874\ud569\ub2c8\ub2e4.<\/text>\n  <rect x=\"22\" y=\"328\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"351\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1D6B48\">\ud575\uc2ec \ub300\uc751: NOICC \ud1b5\uc9c0 \ud6c4 \uc218\uc77c~28\uc77c \uae30\ud55c \ub0b4\uc5d0 \uad6c\uc2dd Direction 99/110 \ud15c\ud50c\ub9bf\uc744 \uc4f0\uba74 \ud328\uc18c\ud569\ub2c8\ub2e4. \ud604\ud589 123\ud638 \uae30\uc900\uc5d0 \ub9de\ucd98 \ubc95\ub9ac \uc18c\uba85\uc774 \ud544\uc218\uc785\ub2c8\ub2e4.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 1: 2026\ub144 10\uc6d4 31\uc77c \uc2dc\ud589 \uc7a5\uad00\ud6c8\ub839 \uc81c123\ud638(Direction 123) 4\ub300 \ucd5c\uc6b0\uc120 \uc2ec\uc0ac \uc694\uc18c \uc7ac\ud3b8<\/figcaption><\/figure>\n<h2 id=\"\uc720\uc8c4-\ud655\uc815-\uc804-\uacbd\ucc30-\uae30\uc18c\ub9cc\uc73c\ub85c-\ube44\uc790\uac00-\ud754\ub4e4\ub9ac\ub294-\ubc95\ub9ac-s-1161e\uc640-gong-\ud310\uacb0\" class=\"doc-h2\">\uc720\uc8c4 \ud655\uc815 \uc804 \uacbd\ucc30 \uae30\uc18c\ub9cc\uc73c\ub85c \ube44\uc790\uac00 \ud754\ub4e4\ub9ac\ub294 \ubc95\ub9ac: s 116(1)(e)\uc640 Gong \ud310\uacb0<\/h2>\n<p class=\"doc-p\">\uc65c \uc7ac\ud310\ub3c4 \ubc1b\uae30 \uc804\uc5d0 \ub0b4\ubb34\ubd80\uac00 \uba3c\uc800 \uc6c0\uc9c1\uc77c\uae4c\uc694? \ube44\ubc00\uc740 \uc774\ubbfc\ubc95(Migration Act 1958) \ucde8\uc18c \uc870\ud56d\uc758 \ubb38\ud131 \ucc28\uc774\uc5d0 \uc788\uc5b4\uc694. \uc778\uc131 \uc2ec\uc0ac \uc870\ud56d(s 501)\uc740 \uc8fc\ub85c 12\uac1c\uc6d4 \uc774\uc0c1 \uc9d5\uc5ed\ud615 \uc120\uace0 \uac19\uc740 \ud655\uc815 \uc911\ubc94\uc8c4 \uae30\ub85d\uc5d0\uc11c \uc791\ub3d9\ud558\uc8e0. \ubc18\uba74 \uc784\uc2dc\ube44\uc790 \uc18c\uc9c0\uc790\uc5d0\uac8c \uc790\uc8fc \ub0a0\uc544\uc624\ub294 s 116(1)(e)\ub294 \uae30\uc900\uc774 \ud6e8\uc52c \ub0ae\uc544\uc694. \uccb4\ub958\uac00 \ud638\uc8fc \uc9c0\uc5ed\uc0ac\ud68c\ub098 \ud2b9\uc815 \uac1c\uc778\uc758 \uac74\uac15, \uc548\uc804, \uc120\ub7c9\ud55c \uc9c8\uc11c\uc5d0 \uc704\ud5d8\uc774 \ub418\uac70\ub098 \ub420 \uc218 \uc788\ub294 \uacbd\uc6b0(is or may be a risk)\ub9cc\uc73c\ub85c\ub3c4 \ucde8\uc18c \uc808\ucc28\uac00 \uc5f4\ub9ac\uac70\ub4e0\uc694. \uacbd\ucc30\uc774 \uae30\uc18c\uc7a5(Charge Sheet)\uc744 \uc804\uc0b0\uc5d0 \uc62c\ub9ac\ub294 \uc21c\uac04 \ub0b4\ubb34\ubd80\ub85c \uc815\ubcf4\uac00 \ub118\uc5b4\uc640 \uace7\uc7a5 NOICC\uac00 \ubc1c\uc1a1\ub3fc\uc694.<\/p>\n<p class=\"doc-p\">\uadf8\ub807\ub2e4\uba74 \uacbd\ucc30 \uae30\uc18c\uc7a5\ub9cc \uc788\uc73c\uba74 \ubb34\uc870\uac74 \ube44\uc790\uac00 \ucde8\uc18c\ub420\uae4c\uc694? \ubc95\uc6d0\uc758 \uc785\uc7a5\uc740 \ub2ec\ub77c\uc694. \uc5f0\ubc29\uc21c\ud68c\ubc95\uc6d0\uc758 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCCA/2016/561.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Gong v Minister for Immigration &amp; Anor<\/em> [2016] FCCA 561<\/a> ([41] \uc774\ud558) \ud310\uacb0\uc774 \ubd84\uba85\ud55c \uc81c\ub3d9\uc744 \uac78\uc5c8\uac70\ub4e0\uc694. \uc7ac\ud310\ubd80\ub294 s 116(1)(e) \ubc1c\ub3d9\uc5d0 \ud615\uc0ac \uc720\uc8c4 \ud310\uacb0\uc774 \ud544\uc218\ub294 \uc544\ub2c8\ub77c\uace0 \ubd24\uc5b4\uc694. \ud558\uc9c0\ub9cc \uac80\uc99d\ub418\uc9c0 \uc54a\uc740 \uacbd\ucc30 \ud610\uc758 \uc9c4\uc220\ub9cc \ubcf4\uace0 \uace7\ubc14\ub85c \uc720\uc8c4\uac00 \uc785\uc99d\ub41c \ub4ef \ucde8\uae09\ud574\uc11c\ub294 \uc548 \ub41c\ub2e4\uace0 \ubabb \ubc15\uc558\uc8e0. \uc2ec\uc0ac\uad00\uc740 \uac1d\uad00\uc801 \uc99d\uac70 \uac00\uce58\uc640 \ud604\uc7ac\uc758 \uc2e4\uc9c8 \uc704\ud5d8\ub3c4\ub97c \ub530\uc838 \ubd10\uc57c \ud574\uc694. \uc5c4\uaca9\ud55c \ubcf4\uc11d \uc870\uac74 \uc900\uc218 \uae30\ub85d, \uac70\uc8fc\uc9c0 \ubd84\ub9ac, \uc804\ubb38 \uc2ec\ub9ac\uc0c1\ub2f4 \ub0b4\uc5ed\uc774 \ud575\uc2ec \ubc29\ud328\uac00 \ub418\ub294 \uae4c\ub2ed\uc774\uc5d0\uc694. \ud604\uc7ac \uc704\ud5d8\uc774 \uc81c\ub3c4\uc801\uc73c\ub85c \ud1b5\uc81c\ub418\uace0 \uc788\uc74c\uc744 \uc99d\uba85\ud574 \ub0b4\ub294 \uc124\uacc4\uac00 \uc2b9\ud328\ub97c \uac08\ub77c\uc694.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">\ube44\uad50 \ud56d\ubaa9<\/th><th style=\"text-align:left\">\uad6c \uc7a5\uad00\ud6c8\ub839 \uc81c110\ud638 (Direction 110 \u00b7 \ud3d0\uc9c0)<\/th><th style=\"text-align:left\">\ud604\ud589 \uc7a5\uad00\ud6c8\ub839 \uc81c123\ud638 (Direction 123 \u00b7 2026.10.31 \uc2dc\ud589)<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>\uadfc\uac70 \ubc0f \ubc1c\ud6a8\uc77c<\/strong><\/td><td style=\"text-align:left\">\uc774\ubbfc\ubc95 s 499 \u00b7 2026\ub144 10\uc6d4 \ud3d0\uc9c0<\/td><td style=\"text-align:left\">\uc774\ubbfc\ubc95 s 499 \u00b7 2026\ub144 9\uc6d4 18\uc77c \uc11c\uba85, 2026\ub144 10\uc6d4 31\uc77c \uc2dc\ud589<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ucd5c\uc6b0\uc120 \uace0\ub824\uc0ac\ud56d<\/strong><\/td><td style=\"text-align:left\">\ucd1d 5\uac1c \ucd5c\uc6b0\uc120 \ud56d\ubaa9 \uc6b4\uc601<\/td><td style=\"text-align:left\">\ucd1d 4\uac1c\ub85c \ucd95\uc18c (\uc9c0\uc5ed\uc0ac\ud68c \ubcf4\ud638 \u00b7 \uac00\uc815\ud3ed\ub825 \u00b7 \uc9c0\uc5ed\uc0ac\ud68c \uae30\ub300\uce58 \u00b7 \ubbf8\uc131\ub144 \uc790\ub140 \uc774\uc775)<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ud638\uc8fc\uc640\uc758 \uc720\ub300 \uad00\uacc4<\/strong><\/td><td style=\"text-align:left\">\ucd5c\uc6b0\uc120 \uace0\ub824\uc0ac\ud56d(Primary) \uc9c0\uc704 \uc720\uc9c0<\/td><td style=\"text-align:left\">\uae30\ud0c0 \uace0\ub824\uc0ac\ud56d(Other)\uc73c\ub85c \uc804\uaca9 \uaca9\ud558 (\uc7a5\uae30 \uccb4\ub958 \ubc29\uc5b4\ub825 \ucd95\uc18c)<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ud638\uc8fc \uc0ac\uc5c5\uc0c1 \uc774\uc775<\/strong><\/td><td style=\"text-align:left\">\uae30\ud0c0 \uace0\ub824\uc0ac\ud56d \ud56d\ubaa9\uc73c\ub85c \uc874\uce58<\/td><td style=\"text-align:left\">\uc2ec\uc0ac \ud56d\ubaa9\uc5d0\uc11c \uc644\uc804 \uc0ad\uc81c (\uace0\uc6a9\uc8fc \uc778\ub825\ub09c\u00b7\uc0ac\uc5c5 \ud53c\ud574 \ub3c5\uc790 \ud56d\ubaa9 \uc18c\uba78)<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uac00\uc815\ud3ed\ub825\u00b7\uae30\ub300\uce58 \ubc94\uc704<\/strong><\/td><td style=\"text-align:left\">\uc2e0\uccb4\u00b7\uc704\ud611 \ud3ed\ub825 \ubc0f \uc77c\ubc18 \ubc94\uc8c4 \uc911\uc2ec<\/td><td style=\"text-align:left\">\uac15\uc555\uc801 \ud1b5\uc81c\u00b7\ub514\uc9c0\ud138 \uc774\ubbf8\uc9c0 \ud559\ub300\u00b7\uc2a4\ud1a0\ud0b9\u00b7\uba85\ub839 \uc704\ubc18 \ubc0f \ud610\uc624 \ubc1c\uc5b8\u00b7\uadf9\ub2e8\uc8fc\uc758\u00b7\ubd88\ud654 \uc870\uc7a5 \uba85\uc2dc<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"2026\ub144-10\uc6d4-31\uc77c-\uc7a5\uad00\ud6c8\ub839-\uc81c123\ud638direction-123-\uc804\uba74-\uc2dc\ud589\uacfc-4\ub300-\" class=\"doc-h2\">2026\ub144 10\uc6d4 31\uc77c \uc7a5\uad00\ud6c8\ub839 \uc81c123\ud638(Direction 123) \uc804\uba74 \uc2dc\ud589\uacfc 4\ub300 \ucd5c\uc6b0\uc120 \uae30\uc900<\/h2>\n<p class=\"doc-p\">\ucde8\uc18c \uc7ac\ub7c9\uad8c\uc744 \uaddc\uc728\ud558\ub294 \uc9c0\uce68\ub3c4 \uc644\uc804\ud788 \uc0c8\ub85c\uc6cc\uc84c\uc5b4\uc694. \uc774\ubbfc\ubc95 s 499\uc5d0 \ub530\ub77c 2026\ub144 9\uc6d4 18\uc77c \uc11c\uba85\ub418\uace0 2026\ub144 10\uc6d4 31\uc77c \ubc1c\ud6a8\ub41c \uc7a5\uad00\ud6c8\ub839 \uc81c123\ud638(Direction No. 123)\uac00 \uc885\uc804 \uc81c110\ud638(Direction No. 110)\ub97c \ud3d0\uc9c0\ud588\uac70\ub4e0\uc694. \ud575\uc2ec\uc740 \ube44\uc790 \uc18c\uc9c0\uc790\uc758 \ubc29\uc5b4\ub9c9\uc744 \ub35c\uc5b4\ub0b4\uace0 \uacf5\uacf5 \uc548\uc804 \uae30\uc900\uc744 \ub300\ud3ed \ub192\uc778 \uac70\uc608\uc694.<\/p>\n<p class=\"doc-p\">\uacb0\uc815\uad8c\uc790\uac00 \uac00\uc7a5 \ubb34\uac81\uac8c \uc0b4\ud53c\ub294 \ucd5c\uc6b0\uc120 \uace0\ub824\uc0ac\ud56d(Primary Considerations)\uc740 \uae30\uc874 5\uac1c\uc5d0\uc11c 4\uac1c\ub85c \uc904\uc5c8\uc5b4\uc694. \ud638\uc8fc \uc9c0\uc5ed\uc0ac\ud68c\uc758 \ubcf4\ud638, \uac00\uc815\ud3ed\ub825 \ud589\uc704 \uc5ec\ubd80, \ud638\uc8fc \uc9c0\uc5ed\uc0ac\ud68c\uc758 \uae30\ub300\uce58, \ud638\uc8fc \ub0b4 \ubbf8\uc131\ub144 \uc790\ub140\uc758 \ucd5c\uc120\uc758 \uc774\uc775\ub9cc \ub0a8\uc558\uc8e0. \uac00\uc815\ud3ed\ub825 \ud56d\ubaa9\uc740 \uac15\uc555\uc801 \ud1b5\uc81c(coercive control), \uc774\ubbf8\uc9c0\u00b7\ub514\uc9c0\ud138 \uae30\uc220\uc744 \uc774\uc6a9\ud55c \ud559\ub300(image-based/technology-facilitated abuse), \uc2a4\ud1a0\ud0b9(stalking), \ubc95\uc6d0 \uba85\ub839 \uc704\ubc18(court-order breaches)\uae4c\uc9c0 \uba85\uc2dc\uc801\uc73c\ub85c \ub113\ud614\uc5b4\uc694. \uc9c0\uc5ed\uc0ac\ud68c \uae30\ub300\uce58\uc5d0\ub3c4 \ud610\uc624 \ubc1c\uc5b8(hate speech), \uadf9\ub2e8\uc8fc\uc758(extremism), \uc0ac\ud68c\uc801 \ubd88\ud654 \uc870\uc7a5(incitement of discord)\uc774 \uc0c8\ub85c \ub4e4\uc5b4\uac14\uace0\uc694.<\/p>\n<p class=\"doc-p\">\uac00\uc7a5 \ubf08\uc544\ud508 \ubcc0\ud654\ub294 \ub4a4\ub85c \ubc00\ub9ac\uace0 \uc0ac\ub77c\uc9c4 \ud56d\ubaa9\uc774\uc5d0\uc694. \ub4e0\ub4e0\ud55c \ubc84\ud300\ubaa9\uc774\uc5c8\ub358 \ud638\uc8fc\uc640\uc758 \uc720\ub300 \uad00\uacc4(Strength, nature and duration of ties to Australia)\uac00 \ucd5c\uc6b0\uc120 \uc790\ub9ac\uc5d0\uc11c \ub0b4\ub824\uc640 \uae30\ud0c0 \uace0\ub824\uc0ac\ud56d(Other considerations)\uc73c\ub85c \uaca9\ud558\ub410\uc5b4\uc694. \uc2a4\ud3f0\uc11c \ube44\uc790 \uc18c\uc9c0\uc790\ub4e4\uc774 \uae30\ub314\ub358 \ud638\uc8fc \uc0ac\uc5c5\uc0c1 \uc774\uc775(Impact on Australian business interests) \ud56d\ubaa9\uc740 \ubb38\uc5b8\uc5d0\uc11c \uc644\uc804\ud788 \uc0ad\uc81c\ub410\uc8e0. \ud638\uc8fc\uc5d0\uc11c \uc624\ub798 \uc138\uae08\uc744 \ub0c8\uace0 \ud68c\uc0ac\uc5d0 \uaf2d \ud544\uc694\ud55c \uc778\ub825\uc774\ub77c\ub294 \ud0c4\uc6d0\uc11c\ub9cc\uc73c\ub85c\ub294 \uc774\uc81c \ucde8\uc18c\ub97c \ub9c9\uae30 \uc5b4\ub824\uc6cc\uc694.<\/p>\n<h2 id=\"\uac00\uc815\ud3ed\ub825-\uc911\ubcf5-\ud3c9\uac00-\ud569\ud5cc\uc131ismail\uacfc-\uc18c\uba85\uc11c-\uc2e4\uc9c8-\uac80\ud1a0-\uc758\ubb34plaintiff-m120\" class=\"doc-h2\">\uac00\uc815\ud3ed\ub825 \uc911\ubcf5 \ud3c9\uac00 \ud569\ud5cc\uc131(Ismail)\uacfc \uc18c\uba85\uc11c \uc2e4\uc9c8 \uac80\ud1a0 \uc758\ubb34(Plaintiff M1/2021)<\/h2>\n<p class=\"doc-p\">Direction 123 \uc544\ub798\uc5d0\uc11c \uac00\uc815\ud3ed\ub825 \uad00\ub828 \ud610\uc758\uac00 \uc5bc\ub9c8\ub098 \ub9e4\uc12d\uac8c \uc791\ub3d9\ud558\ub294\uc9c0\ub294 \uc5f0\ubc29\ub300\ubc95\uc6d0 \ud310\ub840\ub97c \ubcf4\uba74 \ub354 \ub69c\ub837\ud574\uc838\uc694. <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2024/2.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Ismail v Minister for Immigration, Citizenship and Multicultural Affairs<\/em> [2024] HCA 2<\/a> \uc0ac\uac74\uc5d0\uc11c \uc5f0\ubc29\ub300\ubc95\uc6d0\uc740 \ub3d9\uc77c\ud55c \uac00\uc815\ud3ed\ub825 \uc0ac\uc548\uc744 \uc9c0\uc5ed\uc0ac\ud68c \ubcf4\ud638, \uac00\uc815\ud3ed\ub825 \ud56d\ubaa9, \uc9c0\uc5ed\uc0ac\ud68c \uae30\ub300\uce58 \ub4f1 \uc5ec\ub7ec \ucd5c\uc6b0\uc120 \ud56d\ubaa9\uc5d0\uc11c \uac70\ub4ed \ucc38\uc791\ud574\ub3c4 \uc704\ubc95\ud55c \uc774\uc911 \ud3c9\uac00\uc5d0 \ud574\ub2f9\ud558\uc9c0 \uc54a\ub294\ub2e4\uace0 \ud310\uc2dc\ud588\uc5b4\uc694. \ud638\uc8fc \uc720\ub300 \uad00\uacc4\ub9c8\uc800 \ud6c4\uc21c\uc704\ub85c \ubc00\ub9b0 \uc9c0\uae08 \uac00\uc815\ud3ed\ub825\uc774\ub098 \ubcf4\ud638\uba85\ub839 \uc704\ubc18 \ud610\uc758\uac00 \uc5b9\ud788\uba74 4\ub300 \ucd5c\uc6b0\uc120 \uae30\uc900 \uc911 \uc138 \uacf3\uc5d0\uc11c \ub3d9\uc2dc\uc5d0 \uac10\uc810\uc744 \ub2f9\ud558\ub294 \uad6c\uc870\uc608\uc694.<\/p>\n<p class=\"doc-p\">\ubb3c\ub860 \ub3cc\ud30c\uad6c\ub294 \uc0b4\uc544 \uc788\uc5b4\uc694. \uc5f0\ubc29\ub300\ubc95\uc6d0\uc740 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2022/17.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Plaintiff M1/2021 v Minister for Home Affairs<\/em> [2022] HCA 17<\/a> ([22]\u2013[27]) \ud310\uacb0\uc5d0\uc11c s 501CA(4) \ucde8\uc18c \ucca0\ud68c \uc2ec\uc0ac \uc2dc \uacb0\uc815\uad8c\uc790\uac00 \uba85\ud655\ud558\uac8c \uac1c\uc9c4\ub41c \uc18c\uba85 \uc8fc\uc7a5(clearly articulated representations)\uc744 \uc9c1\uc811 \uc77d\uace0 \uc2dd\ubcc4\ud558\uba70 \uc774\ud574\ud574 \uc2e4\uc9c8 \ud3c9\uac00\ud560 \uc758\ubb34\ub97c \uc9c4\ub2e4\uace0 \uc120\uc5b8\ud588\uc5b4\uc694. \ud575\uc2ec \ubc95\ub9ac \uc8fc\uc7a5\uc744 \uc2ec\uc0ac\uad00\uc774 \ub204\ub77d\ud558\uba74 \uc5f0\ubc29\ubc95\uc6d0 \uc0ac\ubc95\uc2ec\uc0ac\uc5d0\uc11c \uacb0\uc815\uc744 \ub4a4\uc9d1\uc744 \uace0\ub9ac\uac00 \uc0dd\uaca8\uc694. \ubc18\ub300\ub85c \ub9c9\uc5f0\ud55c \uac10\uc815 \ud638\uc18c\ub9cc \ub0b4\uba74 \uc0c1\uae09\uc2ec\uc5d0\uc11c \ub2e4\ud234 \ubc1c\ud310\ub9c8\uc800 \uc0ac\ub77c\uc9c0\uc8e0.<\/p>\n<h2 id=\"\uc5b4\uc124\ud508-\uc790\ud544-\ubc18\uc131\ubb38\uc774-\ud615\uc0ac-\uc7ac\ud310\uacfc-\ube44\uc790\ub97c-\ub3d9\uc2dc\uc5d0-\ub9dd\uce58\ub294-\uc774\uc720\" class=\"doc-h2\">\uc5b4\uc124\ud508 \uc790\ud544 \ubc18\uc131\ubb38\uc774 \ud615\uc0ac \uc7ac\ud310\uacfc \ube44\uc790\ub97c \ub3d9\uc2dc\uc5d0 \ub9dd\uce58\ub294 \uc774\uc720<\/h2>\n<p class=\"doc-p\">\uac00\uc7a5 \uc548\ud0c0\uae4c\uc6b4 \uc21c\uac04\uc740 \uc758\ub8b0\uc778\uc774 \uc790\ud544 \ubc18\uc131\ubb38\uc744 \uc774\ubbf8 \ub0b4\ubb34\ubd80\uc5d0 \ubcf4\ub0b8 \ub4a4 \ucc3e\uc544\uc62c \ub54c\uc608\uc694. \ud638\uc8fc \ub0b4 s 116 \ucde8\uc18c \uc608\uace0 \ub2f5\ubcc0 \uae30\ud55c\uc740 \ud1b5\uc0c1 \uc601\uc5c5\uc77c 5\uc77c \uc548\ud30e\uc73c\ub85c \uc9e7\uace0 s 501CA \ucca0\ud68c \uccad\uad6c\ub3c4 28\uc77c \ubd88\ubcc0\uae30\ud55c\uc774 \uc801\uc6a9\ub3fc\uc694. \ub2e4\uae09\ud55c \ub9c8\uc74c\uc5d0 \uc77c\ub2e8 \uc798\ubabb\uc744 \ube4c\uc5b4\uc57c \uc120\ucc98\ubc1b\uc744 \uac83 \uac19\uc544 \uc0ac\uacfc\ubb38\ubd80\ud130 \ub0b4\uace4 \ud558\uc8e0.<\/p>\n<p class=\"doc-p\">\uc774 \uc120\ud0dd\uc740 \uce58\uba85\uc801\uc778 \ubd80\uba54\ub791\uc73c\ub85c \ub3cc\uc544\uc640\uc694. \uac80\ucc30 \uc99d\uac70\uae30\ub85d\uc870\ucc28 \ubcf4\uc9c0 \uc54a\uc740 \ucc44 \ub0b4\ubb34\ubd80 \uc11c\ub958\uc5d0 \ud610\uc758\ub97c \uc778\uc815\ud558\ub294 \uc790\ubc31\uc131 \uc9c4\uc220(admissions)\uc744 \ub0a8\uae30\uba74 \ubb34\uc8c4\ub098 \uacf5\uc18c \ucde8\ud558\ub97c \ub2e4\ud234 \ud615\uc0ac \ubcc0\ub860\uae4c\uc9c0 \ubb34\ub108\uc838\uc694. \uc608\uc804 Direction 99\u00b7110 \uc0d8\ud50c\ub9cc \ubcf4\uace0 \uac70\uc8fc \uae30\uac04\uacfc \uace0\uc6a9\uc8fc \ud53c\ud574\ub9cc \ud638\uc18c\ud558\ub290\ub77c \uc815\uc791 Direction 123\uc774 \ubb3b\ub294 \uc704\ud5d8 \ud1b5\uc81c\uc640 \ubbf8\uc131\ub144 \uc790\ub140 \uc591\uc721 \uc774\uc775 \uc785\uc99d\uc744 \ub193\uce58\uac8c \ub418\uc8e0. \ud615\uc0ac \ubc29\uc5b4\uad8c\uc744 \uc9c0\ud0a4\uba74\uc11c \uc774\ubbfc\ubc95\uc0c1 \uc704\ud5d8 \uc644\ud654 \uc99d\uac70\ub97c \ubd84\ub9ac\ud574 \ub0b4\ub294 \uc77c\uc740 \uc815\uad50\ud55c \ubc95\ub960 \uc124\uacc4 \uc601\uc5ed\uc774\uc5d0\uc694.<\/p>\n<h2 id=\"noicc-\uc218\ub839-\uc9c1\ud6c4-\uace8\ub4e0\ud0c0\uc784\uc744-\uc9c0\ud0a4\ub294-\uae34\uae09-\ub300\uc751-\uacbd\ub85c\" class=\"doc-h2\">NOICC \uc218\ub839 \uc9c1\ud6c4 \uace8\ub4e0\ud0c0\uc784\uc744 \uc9c0\ud0a4\ub294 \uae34\uae09 \ub300\uc751 \uacbd\ub85c<\/h2>\n<p class=\"doc-p\">NOICC\ub098 \ube44\uc790 \ucde8\uc18c \ud1b5\uc9c0\uc11c\ub97c \ubc1b\uc558\ub2e4\uba74 \ud558\ub8e8\ub3c4 \uc9c0\uccb4\ud560 \ud2c8\uc774 \uc5c6\uc5b4\uc694. \ud1b5\uc9c0\uc11c \ud558\ub2e8\uc758 \uc1a1\ub2ec \uac04\uc8fc\uc77c\uacfc \ub9c8\uac10 \uc77c\uc2dc\ubd80\ud130 \ud655\uc778\ud558\uc138\uc694. \uacbd\ucc30 \uae30\uc18c\uc7a5, \ubc95\uc6d0 \ubcf4\uc11d \uc11c\ub958, \ubcf4\ud638\uba85\ub839 \uc0ac\ubcf8, \ud638\uc8fc \uc2dc\ubbfc\uad8c\u00b7\uc601\uc8fc\uad8c \uc790\ub140 \uc790\ub8cc\ub3c4 \uc989\uc2dc \ubaa8\uc73c\uc154\uc57c \ud574\uc694. \ub0b4\ubb34\ubd80\uc5d0 \uc131\uae09\ud788 \uc0ac\uacfc \uc774\uba54\uc77c\uc744 \ubcf4\ub0b4\ub294 \uc77c\uc740 \uae08\ubb3c\uc774\uc5d0\uc694.<\/p>\n<p class=\"doc-p\">\uae30\uc18c \ub2e8\uacc4 \ud615\uc0ac \ubc29\uc5b4\uc640 Direction 123 \uc18c\uba85\uc774 \ub9de\ubb3c\ub9b0 \ubcf5\uc7a1\ud55c \uc704\uae30\uc77c\uc218\ub85d \uccab \ub2f5\ubcc0\uc11c\uac00 \uccb4\ub958 \uc0dd\uba85\uc744 \uc88c\uc6b0\ud574\uc694. \ud1b5\uc9c0\uc11c\ub97c \ubc1b\uc73c\uc168\ub2e4\uba74 \ube44\uc790 \uae34\uae09 \ub300\uc751 \uc13c\ud130(<a href=\"https://parklawyers.com.au/case-emergency/visa/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ube44\uc790 \ucde8\uc18c\u00b7NOICC \uae34\uae09 \uc811\uc218 \ud5c8\ube0c<\/a>)\ub97c \ud655\uc778\ud558\uc2dc\uace0 \uc774\ubbfc\ubc95 \uc804\uc6a9 \uc628\ub77c\uc778 \uc9c8\ubb38\uc9c0(<a href=\"https://form.jotform.com/220391469091053\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\uc774\ubbfc\u00b7\ube44\uc790 \uc0ac\uc548 \uc815\ubc00 \uc811\uc218\ud558\uae30<\/a>) \ub610\ub294 \uacf5\uc2dd \ucc3d\uad6c(<a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ubc15\uc564\ucf54 \uacf5\uc2dd \ub9c1\ud06c \ud5c8\ube0c<\/a>)\ub85c \ud1b5\uc9c0\uc11c\uc640 \ub9c8\uac10\uc77c\uc744 \ubc14\ub85c \ub0a8\uaca8 \uc8fc\uc138\uc694. \uc774\ubbfc\ubc95 \uacf5\uc778 \uc804\ubb38\ubcc0\ud638\uc0ac\uc758 \uc2dc\uac01\uc73c\ub85c \ud615\uc0ac \uc808\ucc28\uc640 \ucda9\ub3cc\ud558\uc9c0 \uc54a\ub294 \ucd5c\uc120\uc758 \ubc29\uc5b4\uc120\uc744 \uc138\uc6cc \ub4dc\ub9b4\uac8c\uc694.<\/p>\n\n          <div class=\"col-sources-box\">\n            \uadfc\uac70 \ubc95\ub839 \ubc0f \ud310\ub840: Migration Act 1958 ss 116(1)(e), 499, 501, 501CA(4) \u00b7 Ministerial Direction No. 123 (signed 18 Sep 2026, commenced 31 Oct 2026) \u00b7 Gong v MIBP [2016] FCCA 561 \u00b7 Ismail v MICMA [2024] HCA 2 \u00b7 Plaintiff M1/2021 v Minister for Home Affairs [2022] HCA 17.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">QLS \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac \ub3c4\uc6c0\uc774 \uaf2d \ud544\uc694\ud55c \uc21c\uac04<\/span>\n            <h3 class=\"col-cta-title\">\uc774\ubbfc\uc131 \uc18c\uba85 \uc694\uccad(s 57)\u00b7\ube44\uc790 \ucde8\uc18c \ud1b5\uc9c0(NOICC)\u00b7ART \uc7ac\uc2ec \ub9c8\uac10 \uae30\ud55c\uc774 \ud750\ub974\uace0 \uc788\uac70\ub098 \ud68c\uc0ac \uc2a4\ud3f0\uc11c\uc2ed\uc744 \uc900\ube44 \uc911\uc774\uc2e0\uac00\uc694?<\/h3>\n            <p class=\"col-cta-desc\">\uc774\ubbfc\uc131 \ub2f5\ubcc0 \uae30\ud55c\uacfc ART \uc7ac\uc2ec \uc811\uc218 \uae30\ud55c\uc740 \ub2e8 \ud558\ub8e8\ub3c4 \ub2a6\ucd9c \uc218 \uc5c6\uc5b4\uc694. \ubc1b\uc73c\uc2e0 \ud1b5\uc9c0\ubb38(Decision Record / s 57 / NOICC)\uc774\ub098 \ud68c\uc0ac \uc2a4\ud3f0\uc11c\uc2ed \ub0b4\uc6a9\uc744 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\uc5d0 \uc62c\ub824 \uc8fc\uc2dc\uba74 \ud574\uacb0 \ubc29\ud5a5\uc744 \ube60\ub974\uac8c \uc9da\uc5b4 \ub4dc\ub824\uc694.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/220391469091053\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">\uc774\ubbfc\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../files/KO/PDF/01_Immigration_Self_Diagnosis_and_Official_Forms_Manual_2026_KO.pdf\" download class=\"col-btn-ghost\">01 \ube44\uc790 \uc11c\ub958\u00b7\uc18c\uba85 \uc810\uac80 \uc694\uc57d PDF \ubc1b\uae30<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">\ubc15\uc564\ucf54 \uacf5\uc2dd \uc0c1\ub2f4 \ub9c1\ud06c \ud5c8\ube0c<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">\ubc95\ub960 \uc548\ub0b4: \uc774 \uce7c\ub7fc\uc740 \ud638\uc8fc \uc774\ubbfc\ubc95(Migration Act 1958), \uc774\ubbfc\uaddc\uc815, \uc7a5\uad00\ud6c8\ub839 \uc81c123\ud638\uc640 \ubc95\uc6d0 \ud310\ub840\ub97c \ubc14\ud0d5\uc73c\ub85c \uc54c\uae30 \uc27d\uac8c \uc815\ub9ac\ud55c \uc77c\ubc18 \ubc95\ub960 \uc815\ubcf4\uc608\uc694. \uac1c\ubcc4 \uc0ac\uac74\uc5d0 \ub300\ud55c \ubc95\ub960 \uc790\ubb38\uc774\ub098 \uc218\uc784 \uacc4\uc57d \uc131\ub9bd\uc744 \ub73b\ud558\uc9c0 \uc54a\uc73c\ub2c8 \ube44\uc790 \ub9cc\ub8cc\uc77c\uc774\ub098 \uc7ac\uc2ec \ub9c8\uac10\uc77c \uc804\uc5d0 \uaf2d \uc804\ubb38\ubcc0\ud638\uc0ac\uc758 \uc9c4\ub2e8\uc744 \ubc1b\uc544 \ubcf4\uc138\uc694.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">\ud568\uaed8 \uc77d\uc73c\uba74 \uc88b\uc740 \uc774\ubbfc\ubc95 \ud310\ub840 \uce7c\ub7fc<\/h3>\n        <a href=\"../../?lang=ko&amp;tab=immigration\" class=\"col-back-link num\">\u2190 \ube44\uc790\u00b7\uc774\ubbfc \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../pic-4020-s57-bogus-documents-withdrawal/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PIC 4020 \uc18c\uba85 \u00b7 \uc774\ubbfc\ubc95 \uce7c\ub7fc 09<\/span><h4 class=\"col-sib-title\">PIC 4020 \uc18c\uba85 \ub808\ud130(s 57)\ub97c \ubc1b\uc558\uc744 \ub54c \ube44\uc790\ub9cc \ucde8\ud558\ud558\uba74 3\ub144 \uc785\uad6d\uae08\uc9c0\ub97c \ud53c\ud560 \uc218 \uc788\uc744\uae4c<\/h4><p class=\"col-sib-desc\">\uc608\uc804 \ub300\ud589\uc0ac \uc2e4\uc218\ub098 \uacbd\ub825\uc11c\ub958 \ubb38\uc81c\ub85c \uc18c\uba85 \uc694\uad6c(s 57)\ub97c \ubc1b\uc558\uc744 \ub54c \ub35c\ucee5 \ube44\uc790\ubd80\ud130 \ucde8\uc18c(\ucde8\ud558)\ud558\uba74 \uc65c \ube0c\ub9ac\uc9d5\ube44\uc790\uac00 \ub04a\uae30\uace0 \uc758\uc2ec \uae30\ub85d\ub9cc \ub0a8\ub294\uc9c0 \uc54c\ub824\ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../corporate-nomination-genuine-position-csit/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uae30\uc5c5\uc2a4\ud3f0\uc11c \ub178\ubbf8\ub124\uc774\uc158 \u00b7 \uc774\ubbfc\ubc95 \uce7c\ub7fc 11<\/span><h4 class=\"col-sib-title\">\ucd5c\uc800\uc5f0\ubd09 $79,423(CSIT)\ub9cc \ub9de\ucd94\uba74 \ub05d\uc77c\uae4c: SID 482\u00b7186 \ub178\ubbf8\ub124\uc774\uc158 \uac70\uc808 1\uc704 &#x27;\uc9c4\uc815\ud55c \uc9c1\uc704&#x27;\uc640 ABN \ubcc0\uacbd\uc758 \ub36b<\/h4><p class=\"col-sib-desc\">\uc218\ucc9c \ub2ec\ub7ec \ud6c8\ub828\ubd80\ub2f4\uae08(SAF)\uc744 \ub0a0\ub9ac\uc9c0 \uc54a\uc73c\ub824\uba74 \uc811\uc218 \uc804 \ubb34\uc5c7\uc744 \ubd10\uc57c \ud560\uae4c\uc694? \ud68c\uc0ac \ub9e4\ucd9c \uaddc\ubaa8\uc640 \uc870\uc9c1\ub3c4 \uc810\uac80\ubd80\ud130 ABN \ubcc0\uacbd \ub54c \uc0dd\uae30\ub294 \ud568\uc815\uae4c\uc9c0 \uc27d\uac8c \ud480\uc5b4 \ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../schedule-3-waiver-section-48-partner-visa/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc624\ubc84\uc2a4\ud14c\uc774\u00b7Schedule 3 \u00b7 \uc774\ubbfc\ubc95 \uce7c\ub7fc 12<\/span><h4 class=\"col-sib-title\">\ube44\uc790 \uac70\uc808\u00b7\uc624\ubc84\uc2a4\ud14c\uc774 \ud6c4 \ud638\uc8fc \uc548\uc5d0\uc11c \ud30c\ud2b8\ub108\ube44\uc790(820) \uc2e0\uccad\ud558\uae30: Section 48 \uc7a5\ubcbd\uacfc Schedule 3 \uba74\uc81c \ubc95\ub9ac<\/h4><p class=\"col-sib-desc\">\ube0c\ub9ac\uc9d5\ube44\uc790\ub098 \ube44\uc790 \ub9cc\ub8cc \uc0c1\ud0dc\uc5d0\uc11c &#x27;\uc9c4\uc2e4\ud55c \uc0ac\ub791\uacfc \uacb0\ud63c&#x27;\ub9cc \ub0b4\uc138\uc6b0\uba74 \uc65c \uac70\uc808\ub420\uae4c\uc694? \ud638\uc8fc \uc548\uc5d0\uc11c \uba74\uc81c\ub97c \ubc1b\ub294 \uae38\uacfc \ud574\uc678 \uc2e0\uccad(309) \uc911 \uc5b4\ub290 \ucabd\uc774 \uc548\uc804\ud55c\uc9c0 \uc9da\uc5b4 \ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../art-merits-review-pic-4007-health-waiver/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ART \uc7ac\uc2ec\u00b7\uac74\uac15\uc694\uac74 \u00b7 \uc774\ubbfc\ubc95 \uce7c\ub7fc 13<\/span><h4 class=\"col-sib-title\">\ube44\uc790 \uac70\uc808 \ud6c4 \ud589\uc815\uc7ac\uc2ec\uc6d0(ART) \uc2b9\uc18c \uc804\ub7b5\uacfc $86,000 \uac74\uac15 \uc694\uac74(PIC 4007) \uba74\uc81c \ub3cc\ud30c\ubc95<\/h4><p class=\"col-sib-desc\">\ucc98\uc74c \ub0c8\ub358 \uc11c\ub958\ub9cc \ub2e4\uc2dc \ub0b4\ub2e4 \uc7ac\uc2ec\uc5d0\uc11c \uc9c0\ub294 \uc2e4\uc218\ub97c \ub9c9\uc544 \ub4dc\ub824\uc694. \uc790\ub140 \ubc1c\ub2ec\uc9c0\uc5f0\uc774\ub098 \ub9cc\uc131\uc9c8\ud658\uc73c\ub85c $86,000 \ucd08\uacfc \ud310\uc815\uc744 \ubc1b\uc558\uc744 \ub54c \ub3cc\ud30c\ud558\ub294 2\ub2e8\uacc4 \ud574\ubc95\uc744 \uc815\ub9ac\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}, "en": {"doc_title": "NOICC Cancellations on Pending Charges and the 31 October 2026 Shift to Ministerial Direction 123 \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">All Guides Hub<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=en\">Visa Solution Guide<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=en\">Employment Navigator<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=en\">DIY & Cost-Smart Guide<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\">Consult Park & Co \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=en&amp;tab=immigration\" class=\"col-back-btn\">\u2190 Back to Immigration Self-Help Hub<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">Park &amp; Co Lawyers \u00b7 Accredited Specialist Immigration Column<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn\">KO<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn active\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/220391121528851\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">Consult Park &amp; Co \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">NOICC &amp; DIRECTION 123 \u00b7 IMMIGRATION 10<\/span>\n          <span class=\"col-verified-pill num\">QLS Accredited Specialist Verified (Nov 2026)<\/span>\n          <span class=\"col-time-pill num\">9 min read<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">NOICC Cancellations on Pending Charges and the 31 October 2026 Shift to Ministerial Direction 123<\/h1>\n        <p class=\"col-subtitle\">How Direction 123 downgraded &#x27;Ties to Australia&#x27;, deleted business interests, expanded family violence, and reshaped s 116(1)(e) / s 501 defence strategy<\/p>\n\n        <div class=\"col-byline\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">Chang Min Park<\/div>\n            <div class=\"col-author-role\">Legal Practitioner Director, Park &amp; Co Lawyers \u00b7 Accredited Specialist in Immigration Law (QLS)<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col10_immi_direction123_hero.jpg\" alt=\"NOICC Cancellations on Pending Charges and the 31 October 2026 Shift to Ministerial Direction 123\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">Commencing 31 October 2026, Ministerial Direction No. 123 cut primary considerations from five to four, relegating Australian ties to &#x27;Other&#x27; weight and deleting business impact.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">31 Oct 2026<\/div><div class=\"col-stat-lbl\">Commencement of Ministerial Direction No. 123 (revoking Direction 110)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">4 Primary Heads<\/div><div class=\"col-stat-lbl\">&#x27;Ties to Australia&#x27; downgraded to Other; &#x27;Business Interests&#x27; deleted<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">Zero Conviction Req<\/div><div class=\"col-stat-lbl\">Pending criminal charges alone engage s 116(1)(e) risk threshold (Gong)<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">In This Column<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#arrested-without-a-conviction-how-s-1161e-noicc-\" class=\"col-toc-link lvl-2\">Arrested without a conviction: how s 116(1)(e) NOICC cancellations work under Gong<\/a><a href=\"#inside-ministerial-direction-123-what-changed-on\" class=\"col-toc-link lvl-2\">Inside Ministerial Direction 123: what changed on 31 October 2026<\/a><a href=\"#family-violence-hate-speech-and-high-court-autho\" class=\"col-toc-link lvl-2\">Family violence, hate speech and High Court authority in Ismail and Plaintiff M1/2021<\/a><a href=\"#the-criminal-self-incrimination-trap-in-diy-noic\" class=\"col-toc-link lvl-2\">The criminal self-incrimination trap in DIY NOICC apology letters<\/a><a href=\"#protecting-your-visa-and-your-criminal-defence-i\" class=\"col-toc-link lvl-2\">Protecting your visa and your criminal defence inside strict response windows<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/220391121528851\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">Open Immigration Consultation Form<\/a>\n              <a href=\"../../?lang=en&amp;tab=immigration\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 Back to Immigration Self-Help Hub<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">Walk out of a police watchhouse on bail after an assault, domestic violence, or driving arrest, and your criminal lawyer will rightly tell you that you are presumed innocent until proven guilty. Days later, an email arrives from the Department of Home Affairs attaching a Notice of Intention to Consider Cancellation (NOICC) under section 116(1)(e) of the <em>Migration Act 1958<\/em> (Cth), often giving an onshore holder just five working days to explain why their Student, Subclass 482, Partner, or Visitor visa should not be cancelled immediately. On 31 October 2026, the rules governing character refusals and cancellation reviews hardened again when Ministerial Direction No. 123 commenced, stripping long-term Australian ties of their primary status and reshaping how decision-makers assess risk.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 382\" width=\"100%\" role=\"img\" aria-label=\"From Revoked Direction 110 to Direction 123 (Effective 31 Oct 2026)\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"381\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">MINISTERIAL DIRECTION NO. 123 \u00b7 COMMENCED 31 OCT 2026<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">From Revoked Direction 110 to Direction 123 (Effective 31 Oct 2026)<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">Authorities: Migration Act s 499, s 116(1)(e), s 501 \u00b7 Gong [2016] FCCA 561 \u00b7 Ismail [2024] HCA 2 \u00b7 M1/2021 [2022] HCA 17<\/text>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"38\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">4 PRIMARY CONSIDERATIONS (DIRECTION 123)<\/text>\n  <circle cx=\"42\" cy=\"144\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">1. Protection of the Australian Community<\/text>\n  <text x=\"54\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">Overarching safety priority; untested charges can trigger s 116(1)(e).<\/text>\n  <circle cx=\"42\" cy=\"196\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">2. Expanded Domestic &amp; Family Violence<\/text>\n  <text x=\"54\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">Expressly covers coercive control, stalking, image abuse &amp; order breaches.<\/text>\n  <circle cx=\"42\" cy=\"248\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">3. Community Expectations &amp; 4. Minor Children<\/text>\n  <text x=\"54\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">Adds hate speech/extremism under Expectations + best interests of kids.<\/text>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"466\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">DOWNGRADED &amp; DELETED FACTORS (CRITICAL SHIFT)<\/text>\n  <circle cx=\"470\" cy=\"144\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Ties to Australia Downgraded to &#x27;Other&#x27;<\/text>\n  <text x=\"482\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">Long residence &amp; character references no longer carry primary weight.<\/text>\n  <circle cx=\"470\" cy=\"196\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Impact on Business Interests Deleted<\/text>\n  <text x=\"482\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">Removed entirely as a standalone consideration under Direction 123.<\/text>\n  <circle cx=\"470\" cy=\"248\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Premature Apology = Criminal Self-Incrimination<\/text>\n  <text x=\"482\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">NOICC replies on pending charges must protect criminal defence rights.<\/text>\n  <rect x=\"22\" y=\"328\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"351\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1D6B48\">Urgent Takeaway: Outdated Direction 99/110 templates fail under Direction 123. Structure representations strictly around the Oct 2026 rules.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 1: How Ministerial Direction 123 Reshaped Primary vs Other Considerations From 31 October 2026<\/figcaption><\/figure>\n<h2 id=\"arrested-without-a-conviction-how-s-1161e-noicc-\" class=\"doc-h2\">Arrested without a conviction: how s 116(1)(e) NOICC cancellations work under Gong<\/h2>\n<p class=\"doc-p\">Temporary visa holders are regularly shocked to discover that Home Affairs does not have to wait for a criminal verdict before cancelling a visa. Mandatory character cancellation under s 501(3A) requires a substantial criminal record (such as a sentence of 12 months&#x27; imprisonment or more) combined with serving full-time custody. By contrast, general cancellation power under s 116(1)(e) asks a low-threshold predictive question: whether the holder&#x27;s presence in Australia is or <em>may be<\/em>, or would or <em>might be<\/em>, a risk to the health, safety or good order of the Australian community or to the health or safety of an individual.<\/p>\n<p class=\"doc-p\">In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCCA/2016/561.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Gong v Minister for Immigration &amp; Anor<\/em> [2016] FCCA 561<\/a> ([41]ff), the Court established two principles that anchor every pending-charge NOICC defence. Untested police charges can lawfully trigger s 116(1)(e) action without a conviction. Even so, a delegate or Tribunal member cannot treat the laying of charges or an untested Police Facts Sheet as automatic proof of guilt. Decision-makers must weigh the probative strength of the allegations, note that the charges are defended, and assess whether strict court bail conditions or protection orders already contain any interim risk before trial.<\/p>\n<h2 id=\"inside-ministerial-direction-123-what-changed-on\" class=\"doc-h2\">Inside Ministerial Direction 123: what changed on 31 October 2026<\/h2>\n<p class=\"doc-p\">Signed on 18 September 2026 under s 499 of the Act and commencing on 31 October 2026, Ministerial Direction No. 123 revoked Direction No. 110 across s 501 refusals, cancellations, and s 501CA revocation requests. Even in s 116 discretionary cancellations where s 499 Directions operate as policy guidance rather than direct statutory command, Departmental delegates and Administrative Review Tribunal (ART) members apply these risk priorities closely.<\/p>\n<p class=\"doc-p\">Direction 123 cuts the Primary Considerations from five down to four: protection of the Australian community; domestic or family violence; expectations of the Australian community; and the best interests of minor children in Australia. In a sharp reversal for settled migrants, &quot;strength, nature and duration of ties to Australia&quot; has been downgraded from a Primary Consideration to the subordinate &quot;Other&quot; considerations list. &quot;Impact on Australian business interests&quot; has been removed from the prescribed list altogether. Recycling an older Direction 99 or Direction 110 template built around ten years of residence and employer inconvenience now misses the binding legal framework.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">Assessment Feature<\/th><th style=\"text-align:left\">Direction No. 110 (Pre-31 Oct 2026)<\/th><th style=\"text-align:left\">Ministerial Direction No. 123 (From 31 Oct 2026)<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Total Primary Considerations<\/strong><\/td><td style=\"text-align:left\">5 primary considerations<\/td><td style=\"text-align:left\">Cut to 4 primary considerations<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Strength, Nature &amp; Duration of Ties to Australia<\/strong><\/td><td style=\"text-align:left\">Elevated as a Primary Consideration<\/td><td style=\"text-align:left\">Downgraded to an &quot;Other&quot; consideration carrying lesser weight<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Impact on Australian Business Interests<\/strong><\/td><td style=\"text-align:left\">Listed under Other considerations<\/td><td style=\"text-align:left\">Removed altogether from prescribed considerations<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Domestic &amp; Family Violence Primary Head<\/strong><\/td><td style=\"text-align:left\">Physical and psychological family violence<\/td><td style=\"text-align:left\">Expressly captures coercive control, image-based / tech-facilitated abuse, stalking, and court-order breaches<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Expectations of the Australian Community<\/strong><\/td><td style=\"text-align:left\">Serious criminal conduct &amp; character breaches<\/td><td style=\"text-align:left\">Expressly adds hate speech, extremism, and incitement of community discord<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"family-violence-hate-speech-and-high-court-autho\" class=\"doc-h2\">Family violence, hate speech and High Court authority in Ismail and Plaintiff M1/2021<\/h2>\n<p class=\"doc-p\">Two targeted expansions inside Direction 123 catch applicants off guard. Under Primary Consideration 2, family violence expressly covers non-physical coercive control, technology-facilitated surveillance, image-based abuse, stalking, and breaches of domestic violence orders, even without a criminal conviction where independent police, court, or clinical material substantiates the conduct. Under Primary Consideration 3, community expectations now expressly address hate speech, extremism, and incitement of discord.<\/p>\n<p class=\"doc-p\">Respondents often complain that weighing one domestic incident across Community Protection, Family Violence, and Community Expectations penalises the same conduct three times. The High Court unanimously rejected that argument in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2024/2.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Ismail v Minister for Immigration, Citizenship and Multicultural Affairs<\/em> [2024] HCA 2<\/a>, confirming that evaluating family violence across multiple primary heads reflects the deliberate structure of s 499 Directions rather than impermissible double counting. Where a visa holder seeks revocation of a mandatory s 501(3A) cancellation inside the strict 28-day s 501CA(4) deadline, <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2022/17.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Plaintiff M1/2021 v Minister for Home Affairs<\/em> [2022] HCA 17<\/a> ([22]-[27]) imposes a mandatory duty on decision-makers to read, identify, understand and evaluate clearly articulated representations, putting forensic psychological risk assessments and minor-child welfare proof at the centre of the case.<\/p>\n<h2 id=\"the-criminal-self-incrimination-trap-in-diy-noic\" class=\"doc-h2\">The criminal self-incrimination trap in DIY NOICC apology letters<\/h2>\n<p class=\"doc-p\">Nothing damages both a visa and a pending criminal defence faster than a home-made NOICC apology letter. Frightened visa holders regularly email Home Affairs admitting they &quot;lost their temper, pushed the complainant, and deeply regret it&quot;, hoping remorse will spare their visa.<\/p>\n<p class=\"doc-p\">Written statements to Home Affairs carry no privilege against self-incrimination and can be obtained by police prosecutors. Admitting the elements of an assault or domestic violence offence hands the delegate undisputed proof under Direction 123 while wrecking your defence in the Magistrates or District Court. Proper representation addresses the s 116(1)(e) risk test under <em>Gong<\/em> through bail compliance, separate accommodation, clean toxicology screens, and structured parenting evidence without conceding contested criminal allegations.<\/p>\n<h2 id=\"protecting-your-visa-and-your-criminal-defence-i\" class=\"doc-h2\">Protecting your visa and your criminal defence inside strict response windows<\/h2>\n<p class=\"doc-p\">Onshore NOICC deadlines (frequently 5 working days), 7-working-day ART cancellation appeal bars, and 28-day s 501CA revocation clocks leave no room for guesswork. Upload your NOICC or cancellation notice, police charge sheet, and bail paperwork immediately through the <a href=\"https://form.jotform.com/220391121528851\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Immigration Consultation Form<\/a> or review urgent pathways on the <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Official Links Hub<\/a> for coordinated review by an Accredited Specialist in Immigration Law (QLS).<\/p>\n\n          <div class=\"col-sources-box\">\n            Primary Authorities: Migration Act 1958 (Cth) ss 116(1)(e), 499, 501, 501CA(4) \u00b7 Ministerial Direction No. 123 (commenced 31 Oct 2026) \u00b7 Gong v MIBP [2016] FCCA 561 \u00b7 Ismail v MICMA [2024] HCA 2 \u00b7 Plaintiff M1/2021 v Minister for Home Affairs [2022] HCA 17.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">WHEN TO CONSULT A QLS ACCREDITED SPECIALIST<\/span>\n            <h3 class=\"col-cta-title\">Facing an Urgent s 57 / NOICC / ART Deadline or Planning Corporate Sponsorship?<\/h3>\n            <p class=\"col-cta-desc\">Departmental response windows and ART review deadlines carry zero extension discretion. Attach your notice or corporate sponsorship details via our online consultation form for prompt specialist assessment.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/220391121528851\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">Open Immigration Consultation Form<\/a>\n              <a href=\"../../files/EN/PDF/01_Immigration_Self_Diagnosis_and_Official_Forms_Manual_2026_EN.pdf\" download class=\"col-btn-ghost\">Download Manual 01 (Immigration PDF)<\/a>\n              <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">Park &amp; Co Official Consultation Hub<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">Legal Disclaimer: This publication provides general legal information grounded in the Migration Act 1958 (Cth), Migration Regulations 1994, Ministerial Direction No. 123 and Federal Court authorities current as at November 2026. It does not constitute legal advice or create a solicitor-client relationship.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">More Curated Immigration Law Columns<\/h3>\n        <a href=\"../../?lang=en&amp;tab=immigration\" class=\"col-back-link num\">\u2190 Back to Immigration Self-Help Hub<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../pic-4020-s57-bogus-documents-withdrawal/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PIC 4020 &amp; INTEGRITY \u00b7 IMMIGRATION 09<\/span><h4 class=\"col-sib-title\">Received an s 57 Natural Justice Letter Over PIC 4020? Why Withdrawing Will Not Erase the Risk<\/h4><p class=\"col-sib-desc\">Examines purposeful falsity vs innocent mistake, skills assessment traps (Arora), why blind s 49 withdrawal backfires onshore, and Kaur waiver proof.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../corporate-nomination-genuine-position-csit/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">CORPORATE SPONSORSHIP \u00b7 IMMIGRATION 11<\/span><h4 class=\"col-sib-title\">Why Employer Nominations Fail Despite Paying the $79,423 CSIT: Genuine Position Audits and ABN Restructures<\/h4><p class=\"col-sib-desc\">Protects Australian sponsors from non-refundable SAF levy losses across SID Subclass 482 and Subclass 186 ENS nominations, restructures and FWO/ATO audits.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../schedule-3-waiver-section-48-partner-visa/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">SECTION 48 &amp; SCHEDULE 3 \u00b7 IMMIGRATION 12<\/span><h4 class=\"col-sib-title\">Lodging an Onshore Partner Visa After Refusal or Overstay: Section 48 Bars and Schedule 3 Waivers<\/h4><p class=\"col-sib-desc\">Why genuine marriage alone never waives Criterion 3001, how post-application births or clinical dependencies count up to decision, and when offshore 309 is safer.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../art-merits-review-pic-4007-health-waiver/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ART APPEALS &amp; HEALTH WAIVERS \u00b7 IMMIGRATION 13<\/span><h4 class=\"col-sib-title\">Winning at the Administrative Review Tribunal (ART) and Challenging $86,000 Health Refusals<\/h4><p class=\"col-sib-desc\">How to cure refusals on de novo review, dismantle inflated MOC special-education or pharmaceutical costings, and win PIC 4007 undue-cost health waivers.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}}</script>

    (function () {
      const payload = JSON.parse(document.getElementById('col-payload').textContent);
      const root = document.getElementById('col-root');
      let cleanupScroll = null;

      function getLang() {
        const q = new URLSearchParams(window.location.search).get('lang');
        return q === 'en' ? 'en' : 'ko';
      }

      function bindTocSpy() {
        if (cleanupScroll) cleanupScroll();
        const links = Array.from(root.querySelectorAll('.col-toc-link'));
        if (!links.length) return;
        const targets = links
          .map((a) => document.getElementById(a.getAttribute('href').slice(1)))
          .filter(Boolean);
        function onScroll() {
          let activeIdx = 0;
          const offset = window.scrollY + 130;
          for (let i = 0; i < targets.length; i++) {
            if (targets[i].offsetTop <= offset) activeIdx = i;
          }
          links.forEach((a, idx) => a.classList.toggle('active', idx === activeIdx));
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        cleanupScroll = () => window.removeEventListener('scroll', onScroll);
        onScroll();
      }

      function render(lg) {
        const data = payload[lg] || payload.ko;
        document.documentElement.lang = lg;
        document.title = data.doc_title;
        root.innerHTML = data.html;
        root.querySelectorAll('[data-set-lang]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const next = btn.getAttribute('data-set-lang');
            const url = new URL(window.location.href);
            url.searchParams.set('lang', next);
            window.history.replaceState({}, '', url.toString());
            render(next);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });
        bindTocSpy();
      }

      render(getLang());
    })();
  </script>

  function fetchRetry(url, isHit, attempt) {

        return j.value;
      })
      .catch(function (err) {
        if (timer) clearTimeout(timer);
        var maxTries = (err && err.isRateLimit) ? 3 : 2;
        if (tries < maxTries) {
          var waitMs = (err && err.isRateLimit) ? (3800 + tries * 3600) : (1100 * (tries + 1));
          return new Promise(function (res) { setTimeout(res, waitMs); })
            .then(function () { return fetchRetry(url, isHit, tries + 1); });
        }
        throw err;
      });
  }

    var rowsHtml = items.map(function (item) {
      var pct = totalRef > 0 ? Math.round((item.count / totalRef) * 100) : 0;
      return '<div class="vc-ref-row">' +
        '<span class="vc-ref-name" title="' + item.label + '">' + item.label + '</span>' +
        '<div class="vc-ref-track"><div class="vc-ref-fill" style="width:' + Math.max(4, pct) + '%"></div></div>' +
        '<span class="vc-ref-val">' + fmt(item.count) + ' (' + pct + '%)</span>' +
        '</div>';
    }).join('');
    var note = isEn
      ? 'Privacy-safe coarse channel buckets only (1 per browser/day; zero IP, query string, or full referrer URL stored).'
      : '개인정보 보호형 채널 그룹 집계 (하루 브라우저당 1회 기준 &middot; 검색어·세부 URL·IP 미수집)';
    return head + '<div class="vc-ref-list">' + rowsHtml + '</div><p class="vc-ref-note">' + note + '</p>';
  }

  function loadHistoryRows(days) {
    var histCache = {};
    try { histCache = JSON.parse(localStorage.getItem(HIST_KEY) || '{}') || {}; } catch (e) {}
    var results = new Array(days.length);
    var pending = [];
    days.forEach(function (d, idx) {
      if (d < today && Array.isArray(histCache[d])) {
        results[idx] = histCache[d];
      } else if (d === today && typeof liveTodayViews === 'number' && typeof liveTodayVis === 'number') {
        results[idx] = [liveTodayViews, liveTodayVis];
      } else {
        pending.push({ d: d, idx: idx });
      }
    });

    var batchSize = pending.length > 7 ? 4 : 6;
    var pauseMs = pending.length > 7 ? 2900 : 180;
    var chain = Promise.resolve();
    for (var c = 0; c < pending.length; c += batchSize) {
      (function (slice, waitFirst) {
        chain = chain.then(function () {
          return (waitFirst ? delay(pauseMs) : Promise.resolve()).then(function () {
            return Promise.all(slice.map(function (item) {
              var k = item.d.replace(/-/g, '');
              var pViews = (item.d === today && typeof liveTodayViews === 'number')
                ? Promise.resolve(liveTodayViews)
                : call('get', 'day-' + k).catch(function () { return null; });
              var pVis = (item.d === today && typeof liveTodayVis === 'number')
                ? Promise.resolve(liveTodayVis)
                : call('get', 'vday-' + k).catch(function () { return null; });
              return Promise.all([pViews, pVis]).then(function (pair) {
                var v0 = pair[0] == null ? 0 : pair[0];
                var v1 = pair[1] == null ? 0 : pair[1];
                results[item.idx] = [v0, v1];
                if (item.d < today && pair[0] !== null && pair[1] !== null) {
                  histCache[item.d] = [v0, v1];
                }
              });
            }));
          });
        });
      })(pending.slice(c, c + batchSize), c > 0);
    }
    return chain.then(function () {
      try { localStorage.setItem(HIST_KEY, JSON.stringify(histCache)); } catch (e) {}
      return results.map(function (r) { return r || [0, 0]; });
    });
  }

  var cachedRefMap = null;

  function loadAndRenderModal(refreshRefs) {
    syncCounterLang();
    var isEn = uiLang() === 'en';
    var fullDays = lastDays(30);
    var days = activeRange === 7 ? lastDays(7) : fullDays;
    var body = modal.querySelector('.vc-body');
    var chartWaitMsg = isEn ? 'Loading daily statistics&hellip;' : '일별 통계를 불러오는 중이에요&hellip;';
    var refWaitMsg = isEn ? 'Loading today&rsquo;s referral channels&hellip;' : '오늘 유입 채널 집계를 불러오는 중이에요&hellip;';
    var existingRefHtml = (!refreshRefs && cachedRefMap) ? renderReferrerBox(cachedRefMap) : ('<div class="vc-ref-note">' + refWaitMsg + '</div>');

    /* Render toolbar, loading placeholder, referral box, and 1-click share bar IMMEDIATELY (0ms) */
    body.innerHTML = renderToolbar(isEn, fullDays.length) +
      '<div id="vc-chart-slot"><p class="vc-sum">' + chartWaitMsg + '</p></div>' +
      '<div id="vc-ref-box" class="vc-ref-box">' + existingRefHtml + '</div>' +
      renderShareBar(isEn);

    loadHistoryRows(days)
      .then(function (rows) {
        var slot = document.getElementById('vc-chart-slot');
        if (slot) slot.innerHTML = renderChartSvg(days, rows, uiLang() === 'en');
        if (!refreshRefs && cachedRefMap) return cachedRefMap;
        return delay(180).then(function () { return loadTodayReferrers(day); });
      })
      .then(function (refMap) {
        if (refMap) cachedRefMap = refMap;
        var refBox = document.getElementById('vc-ref-box');
        if (refBox && refMap) refBox.innerHTML = renderReferrerBox(refMap);
      })
      .catch(function () {
        var slot = document.getElementById('vc-chart-slot');
        if (slot && !slot.querySelector('svg')) {
          slot.textContent = uiLang() === 'en' ? 'Could not load the chart.' : '그래프를 불러오지 못했어요.';
        }
      });
  }

  function open() {
    activeRange = 7;
    modal.classList.add('open');
    loadAndRenderModal(true);
  }
  box.setAttribute('role', 'button');
  box.setAttribute('tabindex', '0');
  box.addEventListener('click', open);
  box.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
})();
  </script>
</body>
</html>
