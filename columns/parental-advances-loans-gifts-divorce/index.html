=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">\ubc15\ucc3d\ubbfc \ub300\ud45c\ubcc0\ud638\uc0ac (Chang Min Park)<\/div>\n            <div class=\"col-author-role\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \ub300\ud45c\ubcc0\ud638\uc0ac \u00b7 \ud638\uc8fc \ud038\uc990\ub79c\ub4dc\uc8fc \ubcc0\ud638\uc0ac\ud68c \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col14_fam_parentloan_hero.jpg\" alt=\"\ud55c\uad6d \ubd80\ubaa8\ub2d8\uc774 \ubcf4\ud0dc\uc900 \uc9d1\uac12 3\uc5b5, \ud638\uc8fc \uc774\ud63c\ud560 \ub54c \ub3cc\ub824\uc904 \ub300\uc5ec\uae08\uc77c\uae4c \ub098\ub20c \uc99d\uc5ec\uc77c\uae4c\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">\ud638\uc8fc \uac00\uc871\ubc95\uc6d0\uc740 \ubcc4\uac70 \ub4a4 \ub4a4\ub2a6\uac8c \ub9cc\ub4e0 \ucc28\uc6a9\uc99d\uc744 \uc778\uc815\ud558\uc9c0 \uc54a\uc544\uc694. \uac1a\uc744 \ub0a0\uc9dc\ub97c \uc548 \uc815\ud55c \uad6c\ub450 \ub300\uc5ec\uae08\uc740 \uc1a1\uae08\uc77c\ub85c\ubd80\ud130 6\ub144\uc774 \uc9c0\ub098\uba74 \uc2dc\ud6a8\uac00 \ub05d\ub098 \uccad\uad6c\uad8c\uc774 \uc0ac\ub77c\uc9c8 \uc218 \uc788\uc5b4\uc694.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">6\ub144 \uc18c\uba78\uc2dc\ud6a8<\/div><div class=\"col-stat-lbl\">&#x27;\uc694\uad6c \uc2dc \uc0c1\ud658&#x27; \uad6c\ub450 \ub300\uc5ec\uae08\uc740 \uc1a1\uae08 \uc9c1\ud6c4 \uae30\uc0b0\ub3fc 6\ub144 \uacbd\uacfc \uc2dc \uc18c\uba78 (Vadisanis)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">\uc18c\uae09 \ucc28\uc6a9\uc99d \uae30\uac01<\/div><div class=\"col-stat-lbl\">\ubcc4\uac70 \ud6c4 \uc791\uc131\ud55c \ubd80\ubaa8 \ucc28\uc6a9\uc11c\ub958\u00b73% \uc2e0\ud0c1 \uc8fc\uc7a5 \ubc30\ucc99 (Barda &amp; Zerri [2026])<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">$320k \uc778\uc815 / $126k \ubc30\uc81c<\/div><div class=\"col-stat-lbl\">\ub3d9\uc2dc\ub300 \uacc4\uc57d \uc6d0\uae08\uc740 \uc778\uc815\ud558\ub418 \ubbf8\uccad\uad6c \uc774\uc790\ub294 \uc81c\uc678\ud55c Pelly &amp; Nolan \uae30\uc900<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">\uc774 \uce7c\ub7fc\uc758 \ubaa9\ucc28<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#\ubd80\ucc44-\uacf5\uc81c\ub0d0-\uae30\uc5ec\ub3c4-\ucc38\uc791\uc774\ub0d0-\uacc4\uc0b0\uae30-\uc22b\uc790\uac00-\uc218\uc5b5-\uc6d0\uc529-\uac08\ub9ac\ub294-\uc774\uc720\" class=\"col-toc-link lvl-2\">\ubd80\ucc44 \uacf5\uc81c\ub0d0 \uae30\uc5ec\ub3c4 \ucc38\uc791\uc774\ub0d0: \uacc4\uc0b0\uae30 \uc22b\uc790\uac00 \uc218\uc5b5 \uc6d0\uc529 \uac08\ub9ac\ub294 \uc774\uc720<\/a><a href=\"#\ubcc4\uac70-\ub4a4\uc5d0-\uae09\uc870\ud55c-\ucc28\uc6a9\uc99d\uacfc-\uc740\ud589-\uc99d\uc5ec-\ud655\uc778\uc11c\uc758-\ubd80\uba54\ub791\" class=\"col-toc-link lvl-2\">\ubcc4\uac70 \ub4a4\uc5d0 \uae09\uc870\ud55c \ucc28\uc6a9\uc99d\uacfc \uc740\ud589 \uc99d\uc5ec \ud655\uc778\uc11c\uc758 \ubd80\uba54\ub791<\/a><a href=\"#\uc6d0\uae08-320000\uc740-\uc0b4\ub9ac\uace0-\uc774\uc790-126171\uc740-\uc798\ub77c\ub0b8-pelly-nolan-\uae30\uc900\uc120\" class=\"col-toc-link lvl-2\">\uc6d0\uae08 $320,000\uc740 \uc0b4\ub9ac\uace0 \uc774\uc790 $126,171\uc740 \uc798\ub77c\ub0b8 Pelly &amp; Nolan \uae30\uc900\uc120<\/a><a href=\"#\uc694\uad6c-\uc2dc-\ubcc0\uc81c-\ub300\uc5ec\uae08\uc744-\uc99d\ubc1c\uc2dc\ud0a4\ub294-6\ub144-\uc18c\uba78\uc2dc\ud6a8vadisanis-\ubc95\ub9ac\" class=\"col-toc-link lvl-2\">&#x27;\uc694\uad6c \uc2dc \ubcc0\uc81c&#x27; \ub300\uc5ec\uae08\uc744 \uc99d\ubc1c\uc2dc\ud0a4\ub294 6\ub144 \uc18c\uba78\uc2dc\ud6a8(Vadisanis \ubc95\ub9ac)<\/a><a href=\"#\ub0b4-\uc0ac\uac74\uc5d0-\ub9de\ub294-\ub2e4\uc74c-\ub2e8\uacc4-\uc810\uac80\ud558\uae30\" class=\"col-toc-link lvl-2\">\ub0b4 \uc0ac\uac74\uc5d0 \ub9de\ub294 \ub2e4\uc74c \ub2e8\uacc4 \uc810\uac80\ud558\uae30<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">\uac00\uc871\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../?lang=ko&amp;tab=family\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">\uc2dc\ub4dc\ub2c8\u00b7\ube0c\ub9ac\uc988\ubc88\u00b7\uba5c\ubc84\ub978\uc758 \ub192\uc740 \uc9d1\uac12 \uc55e\uc5d0\uc11c \uc80a\uc740 \ubd80\ubd80\uac00 \uc6d4\uae09\ub9cc\uc73c\ub85c \uccab \uc9d1 \uacc4\uc57d\uae08\uc744 \ubaa8\uc73c\uae30\ub780 \uc27d\uc9c0 \uc54a\uc544\uc694. \uadf8\ub798\uc11c \ud55c\uad6d \ubd80\ubaa8\ub2d8\uc774 \ub178\ud6c4 \uc790\uae08 2\uc5b5~3\uc5b5 \uc6d0\uc744 \ud5d0\uc5b4 \ud638\uc8fc \uacc4\uc88c\ub85c \ubcf4\ud0dc\uc8fc\uc2dc\ub294 \ud48d\uacbd\uc744 \ud754\ud788 \ubcf4\uc8e0. \ud654\ubaa9\ud560 \ub54c\ub294 \ub354\uc5c6\uc774 \ub4e0\ub4e0\ud55c \uc885\uc7a3\ub3c8\uc774\uc5d0\uc694. \ud558\uc9c0\ub9cc \ubd80\ubd80\uac00 \uac08\ub77c\uc838 \uc7ac\uc0b0\ubd84\ud560 \ud14c\uc774\ube14\uc5d0 \uc549\ub294 \uc21c\uac04 \uc774 \ub3c8\uc740 \ub0a0\uce74\ub85c\uc6b4 \ub1cc\uad00\uc73c\ub85c \ub3cc\ubcc0\ud574\uc694. \ub3c8\uc744 \ubc1b\uc740 \ucabd\uacfc \ubd80\ubaa8\ub2d8\uc740 \ube4c\ub824\uc900 \ub300\uc5ec\uae08(Loan)\uc774\ub2c8 \uc6d0\uae08\ubd80\ud130 \uba3c\uc800 \ube7c\uc790\uace0 \uc8fc\uc7a5\ud558\uc138\uc694. \ubc18\uba74 \uc0c1\ub300 \ubc30\uc6b0\uc790\ub294 \uc870\uac74 \uc5c6\uc774 \uc8fc\uc2e0 \uc99d\uc5ec(Gift)\uc600\ub294\ub370 \uc65c \uc774\uc81c \uc640\uc11c \ube5a\uc774\ub0d0\uba70 \ub9de\uc11c\uc8e0. \uc5f0\ubc29\uc21c\ud68c\u00b7\uac00\uc871\ubc95\uc6d0(FCFCOA)\uc740 \ub204\uad6c \uc190\uc744 \ub4e4\uc5b4\uc904\uae4c\uc694?<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 366\" width=\"100%\" role=\"img\" aria-label=\"\uc774\ud63c \uc7ac\uc0b0\ubd84\ud560\uc5d0\uc11c \ubd80\ubaa8\ub2d8 \uc9c0\uc6d0 \uc790\uae08\uc774 \ubd84\ub958\ub418\ub294 3\uac00\uc9c0 \ubc95\uc801 \uacb0\uacfc\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"365\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">\ubd80\ubaa8 \uc790\uae08 \uc9c0\uc6d0 3\uac08\ub798 \uc6b4\uba85 \u00b7 \ub300\uc5ec\uae08 \uacf5\uc81c vs \uae30\uc5ec\ub3c4 \ud761\uc218 vs \uc2dc\ud6a8 \uc18c\uba78<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">\uc774\ud63c \uc7ac\uc0b0\ubd84\ud560\uc5d0\uc11c \ubd80\ubaa8\ub2d8 \uc9c0\uc6d0 \uc790\uae08\uc774 \ubd84\ub958\ub418\ub294 3\uac00\uc9c0 \ubc95\uc801 \uacb0\uacfc<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">\uadfc\uac70: Pelly &amp; Nolan [2011] \u00b7 Barda &amp; Zerri [2026] FedCFamC2F 122 \u00b7 Maddock [2011] \u00b7 Vadisanis [2014] FamCAFC 97<\/text>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#1D6B48\"/>\n  <text x=\"36\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">OUTCOME 01 \u00b7 \uc9c4\uc815\ud55c \ubd80\ucc44 \uacf5\uc81c<\/text>\n  <text x=\"36\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">\uc6d0\uae08 100% \uba3c\uc800 \ubd80\ubaa8\ub2d8\uaed8 \uc0c1\ud658<\/text>\n  <text x=\"36\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#1D6B48\">Pelly &amp; Nolan [2011] ($320k \uc6d0\uae08 \uc778\uc815)<\/text>\n  <line x1=\"36\" y1=\"182\" x2=\"272\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">\uc1a1\uae08 \ub2f9\uc2dc \uc791\uc131\ub41c \uc815\uc2dd \ucc28\uc6a9\uacc4\uc57d\uc11c\u00b7\ubaa8\uae30\uc9c0<\/text>\n  <text x=\"36\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uba85\ud655\ud55c \ubcc0\uc81c\uae30\u00b7\uc0c1\ud658 \uc77c\uc815 \ubc0f \uc2e4\uc81c \uc774\uc790 \uc774\uccb4<\/text>\n  <text x=\"36\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ub2e8, 4\ub144\uac04 \uccad\uad6c \uc548 \ud55c \uc774\uc790 $126k\ub294 \ubc30\uc81c!<\/text>\n  <text x=\"36\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ubd80\ubaa8\uc758 \uc81c3\uc790 \uc18c\uc1a1\ucc38\uac00(Intervention)\ub85c \ubc29\uc5b4<\/text>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"320\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">OUTCOME 02 \u00b7 \uc99d\uc5ec\u00b7\uae30\uc5ec\ub3c4 \ud3b8\uc785<\/text>\n  <text x=\"320\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">\ubd80\ubd80 \uacf5\ub3d9 \ud480 \ud3b8\uc785 \ud6c4 \ube44\uc728\ub9cc \ucc38\uc791<\/text>\n  <text x=\"320\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E5F\">Barda &amp; Zerri [2026] \u00b7 Maddock [2011]<\/text>\n  <line x1=\"320\" y1=\"182\" x2=\"556\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"320\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">\ubcc4\uac70 \ud6c4 \ub4a4\ub2a6\uac8c \uae09\uc870\ud55c \ucc28\uc6a9\uc99d\uc740 \uae30\uac01(Barda)<\/text>\n  <text x=\"320\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">&#x27;\uc5ec\uc720 \ub420 \ub54c \uac1a\uc544\ub77c&#x27; \uad6c\ub450 \uc57d\uc18d\uc740 \ubd80\ucc44 \ubd88\uc778\uc815<\/text>\n  <text x=\"320\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc9c0\uc6d0 \uc790\ub140 \uce21 s 79(4) \uc7ac\uc815 \uae30\uc5ec\ub85c\ub9cc \ubc18\uc601<\/text>\n  <text x=\"320\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ud63c\uc778 \uae30\uac04 \uae38\uc218\ub85d \uae30\uc5ec\ub3c4 \uac00\uc911\uce58 \ud76c\uc11d \uc704\ud5d8<\/text>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"604\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">OUTCOME 03 \u00b7 6\ub144 \uc2dc\ud6a8 \uc18c\uba78 \ud568\uc815<\/text>\n  <text x=\"604\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">&#x27;\uc694\uad6c \uc2dc \uc0c1\ud658&#x27; \ub300\uc5ec\uae08\uc758 \ubc95\uc801 \uc99d\ubc1c<\/text>\n  <text x=\"604\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\">Vadisanis [2014] FamCAFC 97 \u00b7 Limitation Acts<\/text>\n  <line x1=\"604\" y1=\"182\" x2=\"840\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"604\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">\ub9cc\uae30 \uc5c6\ub294 \ub300\uc5ec\uae08\uc740 \uc1a1\uae08 \ub2f9\uc77c \uc2dc\ud6a8 \uc989\uc2dc \uae30\uc0b0!<\/text>\n  <text x=\"604\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">6\ub144\uac04 \uc77c\ubd80 \ubcc0\uc81c\u00b7\uc11c\uba74 \ucc44\ubb34\uc2b9\uc778 \uc5c6\uc73c\uba74 \uc18c\uba78<\/text>\n  <text x=\"604\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">NSW \ub4f1 \uc8fc\ubc95\uc0c1 \ucc44\uad8c \uc790\uccb4 \uc18c\uba78\ub85c \uacf5\uc81c \ubd88\uac00<\/text>\n  <text x=\"604\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc99d\uc5ec \ucd94\uc815(Presumption of Advancement) \uc791\ub3d9<\/text>\n  <rect x=\"22\" y=\"312\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#FEF8EC\" stroke=\"#ECD9B0\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"335\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">\uc2e4\ubb34 \ucca0\uce59: \ubcc4\uac70 \ud6c4 \ubd80\ubaa8\ub2d8\uacfc \ud5c8\uc704\u00b7\uc18c\uae09 \ucc28\uc6a9\uc99d\uc744 \ub9cc\ub4e4\uba74 \ubc95\uc815 \uc2e0\ube59\uc131\ub9cc \ubb34\ub108\uc9d1\ub2c8\ub2e4. \uc1a1\uae08 \uacbd\uc704\uc640 \uc2dc\ud6a8 \uc911\ub2e8\uc744 \uba3c\uc800 \ubc95\ub9ac \uac80\ud1a0\ud558\uc138\uc694.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 1: \ubd80\ubaa8 \uc9c0\uc6d0 \uc790\uae08\uc758 \ub300\uc5ec\uae08(\ubd80\ucc44) \uc778\uc815 \ub300 \uae30\uc5ec\ub3c4(\uc99d\uc5ec) \ud3b8\uc785 \ubc0f 6\ub144 \uc18c\uba78\uc2dc\ud6a8 \uad6c\uc870<\/figcaption><\/figure>\n<h2 id=\"\ubd80\ucc44-\uacf5\uc81c\ub0d0-\uae30\uc5ec\ub3c4-\ucc38\uc791\uc774\ub0d0-\uacc4\uc0b0\uae30-\uc22b\uc790\uac00-\uc218\uc5b5-\uc6d0\uc529-\uac08\ub9ac\ub294-\uc774\uc720\" class=\"doc-h2\">\ubd80\ucc44 \uacf5\uc81c\ub0d0 \uae30\uc5ec\ub3c4 \ucc38\uc791\uc774\ub0d0: \uacc4\uc0b0\uae30 \uc22b\uc790\uac00 \uc218\uc5b5 \uc6d0\uc529 \uac08\ub9ac\ub294 \uc774\uc720<\/h2>\n<p class=\"doc-p\">\uc65c \uc591\uce21\uc774 \uc774\ub984\ud45c \ud558\ub098\uc5d0 \uc0ac\ud65c\uc744 \uac70\ub294\uc9c0 \uacc4\uc0b0\uae30\ubd80\ud130 \ub450\ub4dc\ub824 \ubcfc\uac8c\uc694. \ud638\uc8fc \uac00\uc871\ubc95(Family Law Act 1975) s 79(3)(a)(\uc0ac\uc2e4\ud63c s 90SM(3)(a)) \ub300\ucc28\ub300\uc870\ud45c \ud655\uc815 \ub2e8\uacc4\uc5d0\uc11c \ubd80\ubaa8\ub2d8 \ub3c8\uc774 \uc9c4\uc815\ud55c \ubd80\ucc44(Liability)\ub85c \uc778\uc815\ub418\uba74 \uacb0\uacfc\ub294 \uc544\uc8fc \uac04\ub2e8\ud574\uc694. \uc9d1 \ub9e4\uac01\ub300\uae08\uc5d0\uc11c \uc740\ud589 \ub300\ucd9c\uc744 \uac1a\ub4ef \ubd80\ubaa8\ub2d8 \uc6d0\uae08 3\uc5b5 \uc6d0\uc774 100% \uba3c\uc800 \ube60\uc838\ub098\uac00\uac70\ub4e0\uc694. \ubd80\ubd80\ub294 \ub0a8\uc740 \uc21c\uc790\uc0b0\ub9cc \ub098\ub204\uba74 \ub3fc\uc694.<\/p>\n<p class=\"doc-p\">\ubc18\ub300\ub85c \ubd80\ucc44 \uce78\uc5d0\uc11c \uc9c0\uc6cc\uc9c0\uba74 \uc5b4\ub5a8\uae4c\uc694? \uc148\ubc95\uc774 \ubfcc\ub9ac\ubd80\ud130 \ub4a4\uc9d1\ud600\uc694. 3\uc5b5 \uc6d0 \uc804\uc561\uc774 \ubd80\ubd80 \uacf5\ub3d9 \ubd84\ud560 \uc7ac\uc0b0(Property Pool)\uc5d0 \uadf8\ub300\ub85c \ubb36\uc774\uace0 \uc624\uc9c1 \ub3c8\uc744 \uac00\uc838\uc628 \ubc30\uc6b0\uc790 \uce21\uc758 s 79(4) \uc7ac\uc815\uc801 \uae30\uc5ec\ub3c4(financial contribution) \uc694\uc18c\ub85c\ub9cc \ucc38\uc791\ub3fc\uc694. \ud63c\uc778 \uae30\uac04\uc774 \uc9e7\ub2e4\uba74 \ucd08\uae30 \uae30\uc5ec \ube44\uc911\uc774 \ub192\uac8c \ub0a8\uc544\uc694. \uadf8\ub7ec\ub098 10\ub144\u00b715\ub144 \uc138\uc6d4\uc774 \ud750\ub974\uba74 \uc774\uc57c\uae30\uac00 \ub2ec\ub77c\uc838\uc694. \uc0c1\ub300\ubc29\uc758 \uac00\uc0ac\u00b7\uc721\uc544 \uae30\uc5ec\uac00 \uc313\uc774\uace0 s 79(5) \uc7a5\ub798 \uc591\uc721\u00b7\uc0dd\uacc4 \uc0ac\uc815 \uc870\uc815\uae4c\uc9c0 \ub354\ud574\uc9c0\uba74 \ubd80\ubaa8\ub2d8 \uc6d0\uae08\uc758 \uc2e4\uc9c8 \ud68c\uc218\uc728\uc740 \ubc18 \ud1a0\ub9c9 \uc544\ub798\ub85c \uae4e\uc774\uae30 \uc77c\uc464\uc8e0.<\/p>\n<h2 id=\"\ubcc4\uac70-\ub4a4\uc5d0-\uae09\uc870\ud55c-\ucc28\uc6a9\uc99d\uacfc-\uc740\ud589-\uc99d\uc5ec-\ud655\uc778\uc11c\uc758-\ubd80\uba54\ub791\" class=\"doc-h2\">\ubcc4\uac70 \ub4a4\uc5d0 \uae09\uc870\ud55c \ucc28\uc6a9\uc99d\uacfc \uc740\ud589 \uc99d\uc5ec \ud655\uc778\uc11c\uc758 \ubd80\uba54\ub791<\/h2>\n<p class=\"doc-p\">\ud55c\uad6d \uc815\uc11c\uc0c1 \ubd80\ubaa8\ub2d8\uaed8 \uc9d1\uac12\uc744 \ubc1b\uc73c\uba70 \uc815\uc2dd \ucc28\uc6a9\uc99d\uc744 \uc4f0\uace0 \uc774\uc790 \ub0a0\uc9dc\ub97c \ubc15\uc544 \ub450\ub294 \uc9d1\uc740 \ub4dc\ubb3c\uc5b4\uc694. \ubcc4\uac70\uac00 \ud130\uc9c4 \ub4a4\uc5d0\uc57c \uc0ac\ud6c4 \ucc28\uc6a9\uc99d\uc744 \ub9cc\ub4e4\uac70\ub098 \uad6c\ub450 \ub300\uc5ec \uc9c4\uc220\uc11c\ub97c \ub4e4\uace0 \uc624\uc2dc\ub294 \uc774\uc720\uc8e0. \ud558\uc9c0\ub9cc \ucd5c\uc2e0 \ud310\uacb0\uc778 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC2F/2026/122.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Barda &amp; Zerri<\/em> [2026] FedCFamC2F 122<\/a> (2026\ub144 2\uc6d4 4\uc77c \uc120\uace0)\ub294 \uc774\ub7f0 \uc0ac\ud6c4 \uc218\uc2b5\uc5d0 \ucc2c\ubb3c\uc744 \ub07c\uc5b9\uc5c8\uc5b4\uc694. \ud574\uc678 \uc2dc\ubd80\ubaa8\uac00 \uc2dc\ub4dc\ub2c8 \uc544\ud30c\ud2b8 \ub9e4\uc785 \ub54c \uc57d A$170,000\ub97c \ubcf4\ub0c8\ub294\ub370 \ubcc4\uac70 \ud6c4 \uafb8\ubbfc \ucc28\uc6a9 \uc11c\ub958\uc640 3% \uc2e0\ud0c1 \uc9c0\ubd84 \uc8fc\uc7a5\uc774 \ubaa8\ub450 \uae30\uac01\ub410\uac70\ub4e0\uc694. \ubc95\uc6d0\uc740 \uc624\uc9c1 \ub0a8\ud3b8 \uce21 s 79(4) \uae30\uc5ec \uc694\uc18c\ub85c\ub9cc \ub2e4\ub918\uc5b4\uc694.<\/p>\n<p class=\"doc-p\">\ubd80\ubaa8\ub2d8\uc774 \uc81c3\uc790 \ucc38\uac00\uc778(Intervenor)\uc73c\ub85c \uc18c\uc1a1\uc5d0 \ub4e4\uc5b4\uc624\uc154\ub3c4 \uae30\uc900\uc740 \ub0c9\uc815\ud574\uc694. <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FMCAfam/2011/1340.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Maddock &amp; Maddock &amp; Anor (No.2)<\/em> [2011] FMCAfam 1340<\/a> \uc0ac\uac74\uc5d0\uc11c \uce5c\uc815\uc544\ubc84\uc9c0\uac00 \ud1a0\uc9c0 \uc790\uae08 \uc57d $240,000 \uc0c1\ud658\uc744 \uad6c\ud558\uba70 \uc9c1\uc811 \ucc38\uac00\ud588\uc5b4\uc694. \uadf8\ub7ec\ub098 \uc790\uae08 \uc804\ub2ec \ub2f9\uc2dc \uc11c\uba74 \uacc4\uc57d\uc11c\ub098 \uc0c1\ud658 \uc77c\uc815\u00b7\ub2f4\ubcf4\uac00 \uc804\ubb34\ud574 \ubd80\ucc44 \ud3b8\uc785\uc774 \uac70\ubd80\ub410\uc8e0. \ub354 \uce58\uba85\uc801\uc778 \uc790\ucda9\uc218\ub3c4 \uc788\uc5b4\uc694. \uc740\ud589 \ub300\ucd9c \uc2ec\uc0ac(serviceability)\ub97c \ud1b5\uacfc\ud558\ub824\uace0 \ubd80\ubaa8\ub2d8\uc774 \uc21c\uc218 \uc99d\uc5ec \ud655\uc778\uc11c(Gift Statutory Declaration)\uc5d0 \uc11c\uba85\ud574 \ud638\uc8fc \uc740\ud589\uc5d0 \ub0c8\ub358 \uae30\ub85d\uc774 \ub4dc\ub7ec\ub098\ub294 \uacbd\uc6b0\uc608\uc694. \ubc95\uc815\uc5d0\uc11c \ub4a4\ub2a6\uac8c \ube5a\uc774\ub77c\uace0 \ub9d0\uc744 \ubc14\uafb8\uba74 \uc2e0\ube59\uc131\uae4c\uc9c0 \ubb34\ub108\uc838\uc694.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">\uc790\uae08 \uc9c0\uc6d0 \uc720\ud615 \ubc0f \uc7c1\uc810<\/th><th style=\"text-align:left\">\ud575\uc2ec \uac80\uc99d \ud310\ub840 \ubc0f \uc900\uac70 \ubc95\ub839<\/th><th style=\"text-align:left\">\ud638\uc8fc \uac00\uc871\ubc95\uc6d0 \ucc98\ub9ac \uacb0\uacfc<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>\uc801\uc2dc \uc11c\uba74 \ucc28\uc6a9\uc99d + \uc0c1\ud658 \uc2e4\uc9c8<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FMCAfam/2011/530.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Pelly &amp; Nolan<\/em> [2011] FMCAfam 530<\/a> (\uc6d0\uae08 $320,000)<\/td><td style=\"text-align:left\">\ubd80\ucc44 \uc778\uc815 \u2192 s 79(3)(a) \ubd80\ucc44 \uc804\uc561 \uc6b0\uc120 \uacf5\uc81c<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc774\uc790 \uc870\ud56d \uc874\uc7ac + \uc7a5\uae30\uac04 \ubbf8\uccad\uad6c<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FMCAfam/2011/530.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Pelly &amp; Nolan<\/em> [2011] FMCAfam 530<\/a> (\ubbf8\uccad\uad6c \uc774\uc790 $126,171)<\/td><td style=\"text-align:left\">\ucd94\uc2ec \uac00\ub2a5\uc131 \ud76c\ubc15 \u2192 \ubbf8\uccad\uad6c \uc774\uc790 \uacf5\uc81c \ubc30\uc81c<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ubcc4\uac70 \ud6c4 \ucc28\uc6a9\uc99d \u00b7 \ubb34\uacc4\uc57d \uc9c0\uc6d0<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC2F/2026/122.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Barda &amp; Zerri<\/em> [2026] FedCFamC2F 122<\/a> \u00b7 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FMCAfam/2011/1340.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Maddock<\/em> [2011] FMCAfam 1340<\/a><\/td><td style=\"text-align:left\">\ubd80\ucc44 \ubd80\uc815 \u2192 s 79(4) \uc7ac\uc815 \uae30\uc5ec\ub3c4\ub85c\ub9cc \ucc38\uc791<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ub2e8\uc21c &#x27;\uc694\uad6c \uc2dc \ubcc0\uc81c&#x27; 6\ub144 \uacbd\uacfc<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2014/97.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Vadisanis<\/em> [2014] FamCAFC 97<\/a> \u00b7 NSW ss 14\u00b763 / QLD \uc2dc\ud6a8\ubc95<\/td><td style=\"text-align:left\">\uc1a1\uae08\uc77c \uc989\uc2dc \uae30\uc0b0 \u2192 6\ub144 \ub3c4\uacfc \uc2dc \ucc44\uad8c \uc601\uad6c \uc18c\uba78<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc81c3\uc790 \ucc44\uad8c\u00b7\ucc44\ubb34 \ubcc0\uacbd \uba85\ub839<\/strong><\/td><td style=\"text-align:left\">Part VIIIAA s 90AE \u00b7 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2018/62.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Tomaras<\/em> [2018] HCA 62<\/a><\/td><td style=\"text-align:left\">\uc808\ucc28\uc801 \uacf5\uc815\uc131\u00b7\ubcc0\uc81c \ubd88\uc774\uc775 \ubd80\uc7ac \uc2dc \uc81c\ud55c \ud5c8\uc6a9<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"\uc6d0\uae08-320000\uc740-\uc0b4\ub9ac\uace0-\uc774\uc790-126171\uc740-\uc798\ub77c\ub0b8-pelly-nolan-\uae30\uc900\uc120\" class=\"doc-h2\">\uc6d0\uae08 $320,000\uc740 \uc0b4\ub9ac\uace0 \uc774\uc790 $126,171\uc740 \uc798\ub77c\ub0b8 Pelly &amp; Nolan \uae30\uc900\uc120<\/h2>\n<p class=\"doc-p\">\ud638\uc8fc \uac00\uc871\ubc95\uc6d0\uc774 \ubd80\ubaa8\ub2d8 \uc790\uae08\uc744 \ubb34\uc870\uac74 \uc99d\uc5ec\ub85c\ub9cc \ubab0\uc544\uac08\uae4c\uc694? \uc804\ud600 \uadf8\ub807\uc9c0 \uc54a\uc544\uc694. \ub3c8\uc774 \uc624\uac04 \ubc14\ub85c \uadf8 \uc2dc\uc810(contemporaneously)\uc5d0 \uc0c1\uc5c5\uc801 \uc2e4\uc9c8\uc744 \uac16\ucd98 \uc11c\uba74 \uc57d\uc815\uc774 \uc788\uc73c\uba74 \uc815\ub2f9\ud55c \ubd80\ucc44\ub85c \ubcf4\ud638\ud574 \uc918\uc694. \uc774 \uacbd\uacc4\uc120\uc744 \uc120\uba85\ud558\uac8c \uadf8\uc740 \ud310\ub840\uac00 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FMCAfam/2011/530.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Pelly &amp; Nolan<\/em> [2011] FMCAfam 530<\/a>\uc774\uc5d0\uc694. \uc544\ubc84\uc9c0\uac00 \uc544\ub4e4\uc758 \ubd80\ub3d9\uc0b0 \uad6c\uc785\uc5d0 $320,000\ub97c \ube4c\ub824\uc8fc\uba70 \uc801\uc2dc\uc5d0 \uc11c\uba74 \ub300\uc5ec \uacc4\uc57d\uc11c\ub97c \ub0a8\uaca8 \ub450\uc5c8\ub294\ub370\uc694. \uc7ac\ud310\ubd80\ub294 \uc6d0\uae08 $320,000\ub97c \uc9c4\uc815\ud55c \ubd80\ucc44\ub85c \uc778\uc815\ud574 \ubd84\ud560 \uc804 \uc790\uc0b0\uc5d0\uc11c \uacf5\uc81c\ud558\ub3c4\ub85d \ud310\uc2dc\ud588\uc5b4\uc694.<\/p>\n<p class=\"doc-p\">\uadf8\ub7f0\ub370 \uac19\uc740 \ud310\uacb0\uc5d0\uc11c \ub180\ub77c\uc6b4 \ubc18\uc804\uc774 \ub098\uc640\uc694. \uc544\ubc84\uc9c0 \uce21\uc740 \uacc4\uc57d\uc11c\ub97c \uadfc\uac70\ub85c 4\ub144\uac04 \uc313\uc778 \ubbf8\uc9c0\uae09 \uc774\uc790 $126,171\uae4c\uc9c0 \ube7c\ub2ec\ub77c\uace0 \uc694\uad6c\ud588\uac70\ub4e0\uc694. \ubc95\uc6d0\uc758 \ub300\ub2f5\uc740 \ub2e8\ud638\ud588\uc5b4\uc694. \uc6d0\uae08\uc740 \uc0b4\ub9ac\ub418 $126,171 \uc774\uc790 \uccad\uad6c\ub294 \ud1b5\uc9f8\ub85c \uc798\ub77c\ub0c8\uc8e0. 4\ub144 \ub0b4\ub0b4 \uc774\uc790\ub97c \ud55c \ubc88\ub3c4 \ub3c5\ucd09\ud558\uc9c0 \uc54a\uc558\uc73c\ub2c8 \uc2e4\uc81c\ub85c \ubc1b\uc544\ub0c8\uc744 \ubd80\ucc44\ub85c \ubcf4\uae30 \uc5b4\ub835\ub2e4\ub294 \uc774\uc720\uc600\uc5b4\uc694. \uc885\uc774 \ucc28\uc6a9\uc99d \ud55c \uc7a5\ub9cc\uc73c\ub85c\ub294 \ubd80\uc871\ud574\uc694. \ub4f1\uae30\ubd80\uc0c1 \uadfc\uc800\ub2f9(Registered Mortgage) \uc124\uc815\uc774\ub098 \uaddc\uce59\uc801\uc778 \uc0c1\ud658 \uc774\uccb4 \ub0b4\uc5ed\uc774 \ud568\uaed8 \uc0b4\uc544 \uc788\uc5b4\uc57c 100% \ubd80\ucc44 \uacf5\uc81c \uad00\ubb38\uc744 \ub118\uc744 \uc218 \uc788\uc5b4\uc694.<\/p>\n<h2 id=\"\uc694\uad6c-\uc2dc-\ubcc0\uc81c-\ub300\uc5ec\uae08\uc744-\uc99d\ubc1c\uc2dc\ud0a4\ub294-6\ub144-\uc18c\uba78\uc2dc\ud6a8vadisanis-\ubc95\ub9ac\" class=\"doc-h2\">&#x27;\uc694\uad6c \uc2dc \ubcc0\uc81c&#x27; \ub300\uc5ec\uae08\uc744 \uc99d\ubc1c\uc2dc\ud0a4\ub294 6\ub144 \uc18c\uba78\uc2dc\ud6a8(Vadisanis \ubc95\ub9ac)<\/h2>\n<p class=\"doc-p\">\uc81c\ub54c \ucc28\uc6a9\uc99d\uc744 \uc37c\ub2e4\uace0 \uc548\uc2ec\ud558\ub358 \ubd84\ub4e4\uc758 \ubc1c\ub4f1\uc744 \ucc0d\ub294 \uc2dc\ud55c\ud3ed\ud0c4\ub3c4 \uc788\uc5b4\uc694. \uac01 \uc8fc \uc18c\uba78\uc2dc\ud6a8\ubc95(Limitation Act)\uc758 6\ub144 \uc2dc\ud6a8 \ubc95\ub9ac\uc608\uc694. \uac00\uc871 \uac04 \ucc28\uc6a9\uc99d\uc5d0\ub294 \ub9cc\uae30\uc77c \ub300\uc2e0 \uc694\uad6c\ud560 \ub54c \uac1a\ub294\ub2e4(payable on demand)\uace0 \uc801\ub294 \uacbd\uc6b0\uac00 \ud754\ud558\uc8e0. \ud754\ud788 \ub3c5\ucd09\uc7a5\uc744 \ucc98\uc74c \ubcf4\ub0b8 \ub0a0\ubd80\ud130 6\ub144\uc774 \ud750\ub97c \uac70\ub77c\uace0 \uc624\ud574\ud558\uc138\uc694.<\/p>\n<p class=\"doc-p\">\ud638\uc8fc \ud310\ub840\uc758 \uacc4\uc0b0\ubc95\uc740 \uc815\ubc18\ub300\uc608\uc694. \ud638\uc8fc \uac00\uc871\ubc95\uc6d0 \ud56d\uc18c\ubd80\uc758 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2014/97.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Vadisanis &amp; Vadisanis and Anor<\/em> [2014] FamCAFC 97<\/a> \ud310\uacb0\uc740 \ubaa8\uce5c\uc758 \uacb0\uacfc\uc801 \uc2e0\ud0c1 \uc8fc\uc7a5\uc744 \uc99d\uc5ec \ucd94\uc815 \uc6d0\uce59(presumption of advancement)\uc73c\ub85c \ubb3c\ub9ac\uce58\uba70 \ubb34\uc11c\uc6b4 \ubc95\ub9ac\ub97c \uc7ac\ud655\uc778\ud588\uc5b4\uc694. \ub2e8\uc21c \uc694\uad6c \uc2dc \ubcc0\uc81c \ub300\uc5ec\uae08\uc740 \uc5b8\uc81c\ubd80\ud130 \uc2dc\ud6a8\uac00 \ud750\ub97c\uae4c\uc694? \ub3c5\ucd09\ud55c \ub0a0\uacfc\ub294 \uc544\ubb34 \uc0c1\uad00\uc774 \uc5c6\uc5b4\uc694. \ub3c8\uc744 \uac74\ub128 \ubc14\ub85c \uadf8\ub0a0 \uc989\uc2dc \uccad\uad6c\uad8c\uacfc \uc18c\uba78\uc2dc\ud6a8\uac00 \ucd9c\ubc1c\ud558\uac70\ub4e0\uc694. \ub274\uc0ac\uc6b0\uc2a4\uc6e8\uc77c\uc2a4\uc8fc(Limitation Act 1969 (NSW) ss 14\u00b763)\ub098 \ud038\uc990\ub79c\ub4dc\uc8fc(Limitation of Actions Act 1974 (Qld)) \uc2dc\ud6a8\ubc95 \uc544\ub798 \uc1a1\uae08\uc77c\ub85c\ubd80\ud130 6\ub144 \ub3d9\uc548 \uc11c\uba85\ub41c \ucc44\ubb34 \uc2b9\uc778\uc774\ub098 \uc77c\ubd80 \ubcc0\uc81c\uac00 \uc5c6\uc5c8\ub2e4\uba74 \uadf8 \ucc44\uad8c\uc740 \uc601\uad6c \uc18c\uba78\ud574\uc694. \uc5f0\ubc29\ub300\ubc95\uc6d0\uc774 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2018/62.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Commissioner of Taxation v Tomaras<\/em> [2018] HCA 62<\/a>\uc5d0\uc11c \uc9da\uc5c8\ub4ef Part VIIIAA s 90AE\ub294 \uc5c4\uaca9\ud55c \ucc44\uad8c\uc790 \ubcf4\ud638 \uc694\uac74\uc744 \ub530\ub974\ubbc0\ub85c \uc2dc\ud6a8\ub85c \uc8fd\uc740 \uac00\uc871 \ucc44\ubb34\ub97c \ub418\uc0b4\ub824 \ubc30\uc6b0\uc790\uc5d0\uac8c \ub5a0\ub118\uae38 \uae38\uc740 \uc5c6\uc5b4\uc694.<\/p>\n<h2 id=\"\ub0b4-\uc0ac\uac74\uc5d0-\ub9de\ub294-\ub2e4\uc74c-\ub2e8\uacc4-\uc810\uac80\ud558\uae30\" class=\"doc-h2\">\ub0b4 \uc0ac\uac74\uc5d0 \ub9de\ub294 \ub2e4\uc74c \ub2e8\uacc4 \uc810\uac80\ud558\uae30<\/h2>\n<p class=\"doc-p\">\uc678\ud658 \uc1a1\uae08\uc99d\uacfc \uc740\ud589 \uc99d\uc5ec \ud655\uc778\uc11c\uac00 \uc5bd\ud78c \ubd80\ubaa8\ub2d8 \uc790\uae08 \ubd84\uc7c1\uc740 \uccab \ub2e8\ucd94\uc5d0 \ub530\ub77c \uc218\uc2ed\ub9cc \ub2ec\ub7ec\uac00 \uac08\ub9ac\ub294 \ubcf5\uc7a1\ud55c \uc0ac\uac74\uc774\uc5d0\uc694. \uae30\uac01\ub420 \uc0ac\ud6c4 \ucc28\uc6a9\uc99d\uc73c\ub85c \uc18c\uc1a1\ube44\uc6a9 \uc704\ud5d8\uc744 \ud0a4\uc6b0\uae30\ubcf4\ub2e4 \uc790\uae08 \uc720\uc785 \uacbd\ub85c\uc640 \uc99d\uc2dd \uae30\uc5ec\ubd84\uc744 \uc5ee\uc5b4 s 79(4) \uae30\uc5ec\ub3c4 \ube44\uc728\uc744 \ub04c\uc5b4\uc62c\ub9ac\ub294 \ud3b8\uc774 \ud6e8\uc52c \uc720\ub9ac\ud560 \ub54c\uac00 \ub9ce\uac70\ub4e0\uc694. \uc55e\uc73c\ub85c \uc790\ub140 \uc9d1\uac12\uc744 \uc9c0\uc6d0\ud558\uc2e4 \ubd80\ubaa8\ub2d8\uc774\ub77c\uba74 \uc1a1\uae08 \uc804\uc5d0 \uc2dc\ud6a8 \uc911\ub2e8 \uc7a5\uce58\uc640 \ub4f1\uae30 \ub2f4\ubcf4\ub97c \uac16\ucd98 \ub300\uc5ec \uacc4\uc57d\ubd80\ud130 \uc138\uc6b0\uc154\uc57c \ud574\uc694. \ub0b4 \uc0ac\uac74\uc758 \ubc95\uc801 \ud3c9\uac00\uac00 \uad81\uae08\ud558\uc2dc\ub2e4\uba74 \uc628\ub77c\uc778 \uc9c8\ubb38\uc9c0(<a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\uac00\uc871\ubc95 \uc0ac\uc548 \uc811\uc218 \ubc14\ub85c\uac00\uae30<\/a>)\ub098 \uacf5\uc2dd \ud1b5\ud569 \ucc3d\uad6c(<a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ubc15\uc564\ucf54 \uacf5\uc2dd \ub9c1\ud06c \ud5c8\ube0c<\/a>)\ub85c \uc1a1\uae08 \uc5f0\ub3c4\uc640 \uc11c\ub958 \ud604\ud669\uc744 \ub0a8\uaca8 \uc8fc\uc138\uc694. \uc774\ud574\ucda9\ub3cc \ud655\uc778 \ud6c4 \ub300\ucc28\ub300\uc870\ud45c \ubc29\uc5b4\ubd80\ud130 \ud569\uc758\uba85\ub839(Consent Orders) \ud655\uc815\uae4c\uc9c0 \uac00\uc7a5 \uc720\ub9ac\ud55c \ud574\ubc95\uc744 \uc9da\uc5b4 \ub4dc\ub9b4\uac8c\uc694.<\/p>\n\n          <div class=\"col-sources-box\">\n            \uadfc\uac70 \ubc95\ub839 \ubc0f \ud310\ub840: Family Law Act 1975 ss 79(3)\u2013(4), 90AE \u00b7 Limitation Act 1969 (NSW) ss 14, 63 \u00b7 Limitation of Actions Act 1974 (Qld) \u00b7 Barda &amp; Zerri [2026] FedCFamC2F 122 \u00b7 Maddock (No.2) [2011] FMCAfam 1340 \u00b7 Pelly &amp; Nolan [2011] FMCAfam 530 \u00b7 Vadisanis [2014] FamCAFC 97 \u00b7 Tomaras [2018] HCA 62.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">\ud63c\uc790 \uc9c4\ud589\uc744 \uba48\ucd94\uace0 \ubcc0\ud638\uc0ac\ub97c \ucc3e\uc544\uc57c \ud558\ub294 \uc21c\uac04 \u00b7 \uac00\uc871\ubc95<\/span>\n            <h3 class=\"col-cta-title\">\ud569\uc758\ub41c \uc870\uac74\uc744 \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950)\uc73c\ub85c \ud655\uc815\ud558\uace0 \uc2f6\uac70\ub098 \uc5f0\ub77d\uc744 \ud53c\ud558\ub294 \ubc30\uc6b0\uc790\uc640 \uc7ac\uc0b0\ubd84\ud560 \ud611\uc0c1\uc744 \uc2dc\uc791\ud574\uc57c \ud558\ub098\uc694?<\/h3>\n            <p class=\"col-cta-desc\">\ub2e8\uc21c \uc628\ub77c\uc778 \uc774\ud63c \uc2e0\uccad\uc740 \ud3ec\ud138 \uc124\uba85\uc11c\ub97c \ubcf4\uace0 \uc9c1\uc811 \uc9c4\ud589\ud558\uba74 \uc218\ucc9c \ub2ec\ub7ec\ub97c \uc544\ub07c\uc2e4 \uc218 \uc788\uc5b4\uc694. \ubc18\uba74 \ubc95\uc801 \ud6a8\ub825\uc774 \uc788\ub294 \uc7ac\uc0b0\u00b7\uc591\uc721 \ud569\uc758\uba85\ub839(Consent Orders) \uc791\uc131\uc774\ub098 \uc5f0\ub77d\uc744 \ud53c\ud558\ub294 \ubc30\uc6b0\uc790\uc758 \uc7ac\uc0b0 \uacf5\uac1c \uc694\uad6c\u00b7\ud55c\uad6d\uacfc \ud638\uc8fc\uc5d0 \uac78\uce5c \uc7ac\uc0b0\ubd84\ud560\uc774 \ud544\uc694\ud560 \ub54c\ub294 3\ubd84 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \ud575\uc2ec \ub0a0\uc9dc\uc640 \uc7ac\uc0b0 \ub0b4\uc5ed\uc744 \ub0a8\uaca8 \uc8fc\uc138\uc694.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">\uac00\uc871\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../files/KO/PDF/03_Family_Law_Divorce_Property_Parenting_and_Settlement_Manual_2026_KO.pdf\" download class=\"col-btn-ghost\">03 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc694\uc57d PDF \ubc1b\uae30<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">\ubc15\uc564\ucf54 \uacf5\uc2dd \uc0c1\ub2f4 \ub9c1\ud06c \ud5c8\ube0c<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">\ubc95\ub960 \uc548\ub0b4: \uc774 \uce7c\ub7fc\uc740 \ud638\uc8fc \uc5f0\ubc29 \uac00\uc871\ubc95(Family Law Act 1975)\uacfc \uacf5\uc2dd \ud1b5\uacc4\u00b7\ud310\ub840\ub97c \ubc14\ud0d5\uc73c\ub85c \uc54c\uae30 \uc27d\uac8c \uc815\ub9ac\ud55c \uc77c\ubc18 \ubc95\ub960 \uc815\ubcf4\uc608\uc694. \uac1c\ubcc4 \uc0ac\uac74\uc5d0 \ub300\ud55c \ubc95\ub960 \uc790\ubb38\uc774\ub098 \uc218\uc784 \uacc4\uc57d \uc131\ub9bd\uc744 \ub73b\ud558\uc9c0 \uc54a\uc73c\ub2c8 \uc774\ud63c \ud6c4 12\uac1c\uc6d4\u00b7\uc0ac\uc2e4\ud63c \uacb0\ubcc4 \ud6c4 2\ub144 \ub9c8\uac10 \uae30\ud55c\uc774\ub098 \ube44\uc790 \uae30\ud55c\uc774 \uc784\ubc15\ud588\ub2e4\uba74 \uc9c0\uccb4 \uc5c6\uc774 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uac80\ud1a0\ub97c \ubc1b\uc544 \ubcf4\uc138\uc694.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">\ud568\uaed8 \uc77d\uc73c\uba74 \uc88b\uc740 \uac00\uc871\ubc95 \ud310\ub840 \uce7c\ub7fc<\/h3>\n        <a href=\"../../?lang=ko&amp;tab=family\" class=\"col-back-link num\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../property-reforms-2026/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">2025\u20132026 \uac1c\uc815 \ud574\uc124 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 01<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \uac00\uc871\ubc95 \uc7ac\uc0b0\ubd84\ud560 \uac1c\ud3b8 \ud575\uc2ec: \uacbd\uc81c\uc801 \ud559\ub300 \ubc18\uc601, \ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ud574\uc678\uc790\uc0b0, \ubc18\ub824\ub3d9\ubb3c \ubc0f \uc81c\ucc99\uae30\uac04 \ucd1d\uc815\ub9ac<\/h4><p class=\"col-sib-desc\">\uc774\ubbf8 \uc368\ubc84\ub9b0 \ub3c8 \ud569\uc0b0(Add-backs) \ud3d0\uc9c0, \uacbd\uc81c\uc801 \ud559\ub300 \ubc18\uc601, \ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ud55c\uad6d \uc7ac\uc0b0 \uacf5\uac1c \uc758\ubb34, \ubc18\ub824\ub3d9\ubb3c \uadc0\uc18d \uae30\uc900, \uadf8\ub9ac\uace0 12\uac1c\uc6d4/2\ub144 \uc7ac\uc0b0\ubd84\ud560 \ub9c8\uac10 \uae30\ud55c\uae4c\uc9c0 \uc54c\uae30 \uc27d\uac8c \uc815\ub9ac\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../divorce-parenting-reality-guide/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc2e4\uc804 \uac00\uc774\ub4dc \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 02<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \uc774\ud63c \uc808\ucc28\uc640 \uc7ac\uc0b0\ubd84\ud560\u00b7\uc591\uc721\uad8c, \ubcc0\ud638\uc0ac \uc120\uc784 \uc804 \ubc18\ub4dc\uc2dc \uc54c\uc544\uc57c \ud560 \ud604\uc2e4 \uae30\uc900<\/h4><p class=\"col-sib-desc\">\uc678\ub3c4 \uc704\uc790\ub8cc\uc5d0 \ub300\ud55c \uc624\ud574\uc640 \ud55c\uacb0 \uc26c\uc6cc\uc9c4 \uc11c\uba74 \uc774\ud63c \uc808\ucc28, \ubc18\ubc18 \uacf5\ub3d9\uc591\uc721 \ucd94\uc815 \ud3d0\uc9c0, \uadf8\ub9ac\uace0 \uc18c\uc561 \uc7ac\uc0b0 \uc0ac\uac74(\u2264$550k)\uacfc \uc815\uc561 \ud569\uc758\uba85\ub839($4,950) \uc911 \ubb34\uc5c7\uc774 \uc774\ub4dd\uc778\uc9c0 \uc9da\uc5b4 \ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../partner-visa-breakdown-crossborder/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc774\ubbfc\u00b7\uac00\uc871\ubc95 \uad50\ucc28 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 03<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \ud30c\ud2b8\ub108\ube44\uc790 \uc9c4\ud589 \uc911 \uacb0\ubcc4\u00b7\uac00\uc815\ud3ed\ub825\uacfc \ud55c\u00b7\ud638 \uad6d\uc81c \uc7ac\uc0b0\ubd84\ud560 \uc2e4\uc804 \ub300\ucc98\ubc95<\/h4><p class=\"col-sib-desc\">\ubc30\uc6b0\uc790\uc758 \ube44\uc790 \ucde8\uc18c \ud611\ubc15\uc5d0 \ub300\ucc98\ud558\ub294 \ubc95\ubd80\ud130 \uac00\uc815\ud3ed\ub825 \uc601\uc8fc\uad8c \uad6c\uc81c \uc694\uac74, \ud55c\uad6d\u00b7\ud638\uc8fc \uc591\uad6d \uc7ac\uc0b0 \uc815\ub9ac, \uc544\uc774\ub97c \ub3d9\uc758 \uc5c6\uc774 \ub370\ub9ac\uace0 \ucd9c\uad6d\ud558\uba74 \uc548 \ub418\ub294 \uc774\uc720\uae4c\uc9c0 \uc27d\uac8c \ud480\uc5b4\uc37c\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../family-trusts-companies-valuation-divorce/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uac00\uc871\uc2e0\ud0c1\u00b7\ubc95\uc778\uac10\uc815 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 15<\/span><h4 class=\"col-sib-title\">\uc7ac\uc0b0\uc744 \uac00\uc871\uc2e0\ud0c1(Family Trust)\uc774\ub098 Pty Ltd \ubc95\uc778\uc5d0 \ub123\uc5b4\ub450\uba74 \uc774\ud63c \uc7ac\uc0b0\ubd84\ud560\uc5d0\uc11c \uc548\uc804\ud560\uae4c<\/h4><p class=\"col-sib-desc\">\ub204\uac00 \uc2e0\ud0c1\uc758 \uc2e4\uc81c \uacb0\uc815\uad8c(Appointor)\uc744 \uc950\uace0 \uc788\ub294\uc9c0 \ub530\uc9c0\ub294 \uae30\uc900\ubd80\ud130 \uacf5\ub3d9 \uac10\uc815\uc778 \uc808\ucc28\uc640 \ubc95\uc778 \ub3c8\uc744 \uc62e\uae38 \ub54c \uc138\uae08\uc744 \uc544\ub07c\ub294 \ubc29\ubc95\uae4c\uc9c0 \uc9da\uc5b4 \ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../post-separation-inheritances-windfalls-delay/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubcc4\uac70 \ud6c4 \uc0c1\uc18d\u00b7\uc9c0\uccb4\uc704\ud5d8 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 16<\/span><h4 class=\"col-sib-title\">\ubcc4\uac70\ud55c \uc9c0 4\ub144 \uc9c0\ub0ac\uc73c\ub2c8 \uc0c8\ub85c \ubc1b\uc740 \uc0c1\uc18d\uc774\ub098 \uc9d1\uac12 \uc0c1\uc2b9\ubd84\uc740 \ub0b4 \uac83\uc774\uaca0\uc9c0: \ud569\uc758\uba85\ub839(Consent Orders)\uc744 \ubbf8\ub8ec \ub300\uac00<\/h4><p class=\"col-sib-desc\">\ubcc4\uac70 \ub4a4 \uc11c\ub958 \uc815\ub9ac\ub97c \ud3c9\uade0 4\ub144\uc529 \ubbf8\ub8e8\ub2e4 \ub098\uc911\uc5d0 \ubc1b\uc740 \uc0c1\uc18d\uae08\uc774\ub098 \uc624\ub978 \uc9d1\uac12\uae4c\uc9c0 \ub098\ub204\uac8c \ub418\ub294 \uc774\uc720\uc640 $4,950 \ubc95\uc6d0 \ud569\uc758\uba85\ub839\uc73c\ub85c \uc548\uc804\ud558\uac8c \ub9c8\ubb34\ub9ac\ud558\ub294 \ubc95\uc744 \ub2f4\uc558\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../prenups-bfa-vs-consent-orders/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ud63c\uc804\uacc4\uc57d BFA \ub300 \ud569\uc758\uba85\ub839 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 17<\/span><h4 class=\"col-sib-title\">\ubcc0\ud638\uc0ac \uc99d\uba85\uc11c\uae4c\uc9c0 \ubd99\uc778 \ud63c\uc804\uacc4\uc57d\uc11c(BFA)\uac00 \ub300\ubc95\uc6d0\uc5d0\uc11c \uae68\uc9c4 \uc774\uc720: \uc7ac\uc0b0\ubd84\ud560 \ud569\uc758\uc11c(BFA) \ub300 \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950) \uc120\ud0dd \uae30\uc900<\/h4><p class=\"col-sib-desc\">\uacb0\ud63c\u00b7\ub3d9\uac70 \uc804\uc5d0 \uc7ac\uc0b0\uc744 \uc548\uc804\ud558\uac8c \uc9c0\ud0a4\ub294 BFA \uc791\uc131 \uc694\ub839\uacfc \uc774\ubbf8 \ud5e4\uc5b4\uc9c4 \ubd80\ubd80\uac00 \uc591\ucabd \ubcc0\ud638\uc0ac\ube44\uac00 \ub4dc\ub294 BFA \ub300\uc2e0 \uc815\uc561 \ud569\uc758\uba85\ub839\uc744 \uace8\ub77c\uc57c \ud558\ub294 \uc774\uc720\ub97c \ube44\uad50\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../de-facto-threshold-disputes-out-of-time-s44/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc0ac\uc2e4\ud63c \uacbd\uacc4\u00b7\uae30\ud55c\ub3c4\uacfc \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 18<\/span><h4 class=\"col-sib-title\">\ub3d9\uac70\ub294 \uc548 \ud558\uace0 \uc0dd\ud65c\ube44\ub9cc \uc92c\ub294\ub370 \uc0ac\uc2e4\ud63c(De Facto) \uc18c\uc1a1\uc774 \ub4e4\uc5b4\uc654\ub2e4\uba74: \uc0ac\uc2e4\ud63c \uc778\uc815 \uae30\uc900(s 4AA)\uacfc \ub9c8\uac10 \uae30\ud55c \uc608\uc678 \uc2e0\uccad(s 44)<\/h4><p class=\"col-sib-desc\">\ub2e8\uc21c \uc5f0\uc778 \uad00\uacc4\uc640 \ubc95\uc801 \uc0ac\uc2e4\ud63c\uc744 \uac00\ub974\ub294 &#x27;\ud558\ub098\uc758 \uc0b6(Coupledom)&#x27; \uae30\uc900\ubd80\ud130 \uae30\ud63c\uc790\uc640\uc758 \uc774\uc911 \uc0ac\uc2e4\ud63c, \ub9c8\uac10 \uae30\ud55c\uc774 \uc9c0\ub09c \uc0ac\uac74\uc758 \ub300\uc751\ubc95\uae4c\uc9c0 \uc27d\uac8c \uc815\ub9ac\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}, "en": {"doc_title": "The Bank of Mum and Dad in Australian Divorce: Repayable Loan, Resulting Trust or Gift? \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">All Guides Hub<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=en\">Visa Solution Guide<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=en\">Employment Navigator<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=en\">DIY & Cost-Smart Guide<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\">Consult Park & Co \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=en&amp;tab=family\" class=\"col-back-btn\">\u2190 Back to Family Law Self-Help Hub<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">Park &amp; Co Lawyers \u00b7 Family Law Deep-Dive Column<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn\">KO<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn active\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">Consult Park &amp; Co \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">PARENTAL ADVANCES \u00b7 FAMILY 14<\/span>\n          <span class=\"col-verified-pill num\">Primary-Source Verified (Nov 2026)<\/span>\n          <span class=\"col-time-pill num\">8 min read<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">The Bank of Mum and Dad in Australian Divorce: Repayable Loan, Resulting Trust or Gift?<\/h1>\n        <p class=\"col-subtitle\">Why post-separation loan notes fail (Barda &amp; Zerri [2026]), when formal deeds hold up (Pelly &amp; Nolan), and how 6-year limitation statutes wipe out &#x27;on demand&#x27; loans (Vadisanis)<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">Chang Min Park<\/div>\n            <div class=\"col-author-role\">Legal Practitioner Director, Park &amp; Co Lawyers \u00b7 Accredited Specialist in Immigration Law (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col14_fam_parentloan_hero.jpg\" alt=\"The Bank of Mum and Dad in Australian Divorce: Repayable Loan, Resulting Trust or Gift?\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">Without contemporaneous loan documentation and active enforcement, parental property advances are routinely absorbed into the divisible pool, or extinguished after six years.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">6-Year Time Bar<\/div><div class=\"col-stat-lbl\">&#x27;Payable on demand&#x27; family loans accrue on advance &amp; expire in 6 yrs (Vadisanis)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">Zero Backdating<\/div><div class=\"col-stat-lbl\">Post-separation loan notes rejected in Barda &amp; Zerri [2026] FedCFamC2F 122<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">$320k Debt Upheld<\/div><div class=\"col-stat-lbl\">Contemporaneous principal deducted while dormant interest failed (Pelly &amp; Nolan)<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">In This Column<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#why-post-separation-loan-paperwork-fails-on-the-\" class=\"col-toc-link lvl-2\">Why post-separation loan paperwork fails on the s 79(3)(a) balance sheet<\/a><a href=\"#contemporaneous-loan-terms-versus-uncollected-in\" class=\"col-toc-link lvl-2\">Contemporaneous loan terms versus uncollected interest in practice<\/a><a href=\"#resulting-trusts-the-presumption-of-advancement-\" class=\"col-toc-link lvl-2\">Resulting trusts, the presumption of advancement and the six-year limitation bar<\/a><a href=\"#third-party-creditor-rules-under-part-viiiaa-and\" class=\"col-toc-link lvl-2\">Third-party creditor rules under Part VIIIAA and mortgage gift declarations<\/a><a href=\"#protecting-parental-advances-or-locking-in-a-cle\" class=\"col-toc-link lvl-2\">Protecting parental advances or locking in a clean settlement<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">Open Family Law Consultation Form<\/a>\n              <a href=\"../../?lang=en&amp;tab=family\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 Back to Family Law Self-Help Hub<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">Few disputes sour a property settlement faster than six figures wired by one spouse&#x27;s parents to get a couple into the housing market. While the marriage holds together, nobody worries about labels. Once the couple separates, the two sides remember different transactions. One spouse calls the transfer a strict family loan that must be repaid off the top of the sale proceeds before anything is divided; the other remembers an unconditional house-warming gift. Family loyalty carries no weight in the Federal Circuit and Family Court of Australia (FCFCOA). Judges settle that fight by reading the documents created during the week the money actually moved.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 366\" width=\"100%\" role=\"img\" aria-label=\"How Family Courts Classify &#x27;Bank of Mum and Dad&#x27; Property Advances\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"365\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">PARENTAL PROPERTY ADVANCES \u00b7 LOAN VS CONTRIBUTION<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">How Family Courts Classify &#x27;Bank of Mum and Dad&#x27; Property Advances<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">Authorities: Pelly &amp; Nolan [2011] \u00b7 Barda &amp; Zerri [2026] FedCFamC2F 122 \u00b7 Maddock [2011] \u00b7 Vadisanis [2014] FamCAFC 97<\/text>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#1D6B48\"/>\n  <text x=\"36\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">OUTCOME 01 \u00b7 BALANCE-SHEET DEBT<\/text>\n  <text x=\"36\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">Deducted Dollar-for-Dollar<\/text>\n  <text x=\"36\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#1D6B48\">Pelly &amp; Nolan [2011] ($320k principal)<\/text>\n  <line x1=\"36\" y1=\"182\" x2=\"272\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">Contemporaneous formal loan deed / caveat<\/text>\n  <text x=\"36\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Clear repayment schedule &amp; real repayments<\/text>\n  <text x=\"36\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Unclaimed $126k interest still excluded!<\/text>\n  <text x=\"36\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Protected via third-party intervention<\/text>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"320\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">OUTCOME 02 \u00b7 s 79(4) CONTRIBUTION<\/text>\n  <text x=\"320\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">Absorbed Into Divisible Pool<\/text>\n  <text x=\"320\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E5F\">Barda &amp; Zerri [2026] \u00b7 Maddock [2011]<\/text>\n  <line x1=\"320\" y1=\"182\" x2=\"556\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"320\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">Post-separation loan notes rejected (Barda)<\/text>\n  <text x=\"320\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Vague &#x27;repay when able&#x27; terms fail as debt<\/text>\n  <text x=\"320\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Credited only as s 79(4) contribution<\/text>\n  <text x=\"320\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Eroded by long marriage &amp; future needs<\/text>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"604\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">OUTCOME 03 \u00b7 6-YEAR STATUTE BAR<\/text>\n  <text x=\"604\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">&#x27;On Demand&#x27; Loan Extinguished<\/text>\n  <text x=\"604\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\">Vadisanis [2014] FamCAFC 97 \u00b7 Limitation Acts<\/text>\n  <line x1=\"604\" y1=\"182\" x2=\"840\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"604\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">&#x27;Payable on demand&#x27; runs from day of advance!<\/text>\n  <text x=\"604\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Barred after 6 yrs absent repayment/ack<\/text>\n  <text x=\"604\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Extinguished at law: zero debt deduction<\/text>\n  <text x=\"604\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Presumption of advancement defeats trust<\/text>\n  <rect x=\"22\" y=\"312\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#FEF8EC\" stroke=\"#ECD9B0\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"335\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">Warning: Backdating family loan notes after separation destroys credibility. Audit limitation clocks &amp; contribution weight early.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 1: Evidentiary Matrix for Parental Property Advances, Contributions and 6-Year Limitation Bars<\/figcaption><\/figure>\n<h2 id=\"why-post-separation-loan-paperwork-fails-on-the-\" class=\"doc-h2\">Why post-separation loan paperwork fails on the s 79(3)(a) balance sheet<\/h2>\n<p class=\"doc-p\">The dollar gap between an enforceable liability and a contribution is wide. Under s 79(3)(a) and s 90SM(3)(a) of the <em>Family Law Act 1975<\/em> (Cth), a genuine debt comes straight off the gross pool before net equity is split. If an advance fails proof as an enforceable liability, the funds stay in the divisible pool and count under s 79(4) or s 90SM(4) as a financial contribution made on one spouse&#x27;s behalf. Across a ten- or fifteen-year marriage with children, the percentage credit for an early deposit erodes substantially, leaving the other spouse with a large slice of the parents&#x27; capital.<\/p>\n<p class=\"doc-p\">Signing a retrospective loan deed or informal IOU after separation almost always backfires in court. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC2F/2026/122.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Barda &amp; Zerri<\/em> [2026] FedCFamC2F 122<\/a> (4 February 2026), overseas parents had remitted roughly A$170,000 towards a Sydney apartment. After separation, the husband produced post-separation loan documents and pleaded in the alternative a 3% trust interest for his parents. The Court rejected both claims and assessed the A$170,000 strictly as an s 79(4) contribution on the husband&#x27;s side. Even when parents retain separate counsel and intervene directly, undocumented advances suffer the same fate. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FMCAfam/2011/1340.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Maddock &amp; Maddock &amp; Anor (No.2)<\/em> [2011] FMCAfam 1340<\/a>, a father intervened to recover roughly $240,000 advanced for land purchase and construction. Without a contemporaneous written loan contract, repayment terms, or pre-separation demand, the Court excluded the $240,000 from balance-sheet liabilities and folded it into s 79(4) contributions.<\/p>\n<h2 id=\"contemporaneous-loan-terms-versus-uncollected-in\" class=\"doc-h2\">Contemporaneous loan terms versus uncollected interest in practice<\/h2>\n<p class=\"doc-p\">Where parents execute commercial loan documents at settlement, judges honour the obligation only to the extent the family treated those terms as real before separation. <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FMCAfam/2011/530.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Pelly &amp; Nolan<\/em> [2011] FMCAfam 530<\/a> shows how cleanly benches separate genuine principal from paper padding. A father advanced $320,000 for real estate under a contemporaneously signed loan agreement. Satisfied that the principal debt was genuine, the Court deducted $320,000 as a balance-sheet liability. Yet the father also claimed $126,171 in accrued interest. Because four years had passed without a single demand or interest payment, the Court excluded the $126,171 interest component as unlikely ever to be enforced.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">Evidentiary Scenario<\/th><th style=\"text-align:left\">Contemporaneous Proof &amp; Conduct<\/th><th style=\"text-align:left\">FCFCOA Balance-Sheet Outcome<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Registered Mortgage + Loan Deed<\/strong><\/td><td style=\"text-align:left\">Signed at purchase, registered on title, repayments or formal variations tracked<\/td><td style=\"text-align:left\">Deducted 100% off the top as an existing s 79(3)(a) / s 90SM(3)(a) liability<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Documented Principal, Dormant Interest<\/strong><\/td><td style=\"text-align:left\">Contemporaneous loan deed, zero interest demanded over 4 years (<a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FMCAfam/2011/530.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Pelly &amp; Nolan<\/em> [2011] FMCAfam 530<\/a>)<\/td><td style=\"text-align:left\">$320,000 principal deducted as a liability; $126,171 uncollected interest excluded<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Undocumented or Post-Separation IOU<\/strong><\/td><td style=\"text-align:left\">Bank transfers only, or loan paperwork created after separation (<a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC2F/2026/122.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Barda &amp; Zerri<\/em> [2026] FedCFamC2F 122<\/a>; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FMCAfam/2011/1340.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Maddock<\/em> [2011] FMCAfam 1340<\/a>)<\/td><td style=\"text-align:left\">Excluded from liabilities and trusts; weighed solely as an s 79(4) contribution<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Informal &quot;On Demand&quot; Loan (&gt;6 Years)<\/strong><\/td><td style=\"text-align:left\">Bare promise &quot;payable on demand&quot; without payments or signed acknowledgment (<a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2014/97.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Vadisanis<\/em> [2014] FamCAFC 97<\/a>)<\/td><td style=\"text-align:left\">Statute-barred and extinguished after 6 years under state <em>Limitation Acts<\/em><\/td><\/tr><tr><td style=\"text-align:left\"><strong>Bank &quot;Non-Refundable Gift&quot; Letter<\/strong><\/td><td style=\"text-align:left\">Parents signed a mortgage lender&#x27;s statutory gift declaration for loan approval<\/td><td style=\"text-align:left\">Fatal to later loan claims under cross-examination; assessed under s 79(4)<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"resulting-trusts-the-presumption-of-advancement-\" class=\"doc-h2\">Resulting trusts, the presumption of advancement and the six-year limitation bar<\/h2>\n<p class=\"doc-p\">When a contract claim falters, litigants often plead a resulting trust over the share of the purchase price funded by Mum and Dad. Between parents and adult children, equity starts from the opposite rule: the presumption of advancement treats a parental transfer as a gift unless rebutted by clear proof of trust intention at the time of settlement.<\/p>\n<p class=\"doc-p\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2014/97.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Vadisanis &amp; Vadisanis and Anor<\/em> [2014] FamCAFC 97<\/a> exposes both that hurdle and a six-year limitation trap. Defeating a mother&#x27;s trust claim under the presumption of advancement, the Full Court also confirmed that an informal loan expressed simply as &quot;payable on demand&quot; accrues immediately on advance. Under state limitation statutes such as the <em>Limitation Act 1969<\/em> (NSW) ss 14, 63 and the <em>Limitation of Actions Act 1974<\/em> (Qld) s 10, an unacknowledged, payment-free &quot;on demand&quot; loan is statute-barred and extinguished after six years. Parents who wait seven years until a divorce erupts often learn their legal debt has already expired.<\/p>\n<h2 id=\"third-party-creditor-rules-under-part-viiiaa-and\" class=\"doc-h2\">Third-party creditor rules under Part VIIIAA and mortgage gift declarations<\/h2>\n<p class=\"doc-p\">Genuine third-party creditors hold real protection under Part VIIIAA. As the High Court confirmed in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2018/62.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Commissioner of Taxation v Tomaras<\/em> [2018] HCA 62<\/a>, s 90AE orders cannot shift a third-party debt unless the creditor receives procedural fairness and full payment remains foreseeable (s 90AE(3)). Vague family advances that fail threshold proof as a legal debt never reach that shelter.<\/p>\n<p class=\"doc-p\">Once s 71B or s 90RI disclosure starts, one record sinks parental loan claims fastest: the bank &quot;non-refundable gift&quot; statutory declaration signed for mortgage serviceability. Subpoenaing the bank&#x27;s origination file is routine first-month work, and calling that declaration a fiction rarely survives cross-examination.<\/p>\n<h2 id=\"protecting-parental-advances-or-locking-in-a-cle\" class=\"doc-h2\">Protecting parental advances or locking in a clean settlement<\/h2>\n<p class=\"doc-p\">Early forensic review of remittance trails and conveyancing files avoids wasting $40,000 on doomed interventions. Where separated couples agree on how parental advances sit inside their split, Park &amp; Co prepares Court-sealed Consent Orders for a $4,950 fixed fee (plus the $215 court fee), securing permanent s 79 or s 90SM finality and duty relief without a hearing. Where an ex-partner hides records, produces backdated loan deeds, or goes silent, we enforce s 71B and s 90RI disclosure and subpoena bank files. Send your timeline and asset summary via the <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Family Law Consultation Form<\/a> or visit the <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Official Links Hub<\/a> for conflict screening.<\/p>\n\n          <div class=\"col-sources-box\">\n            Primary Authorities: Family Law Act 1975 (Cth) ss 79(3)\u2013(4), 90AE \u00b7 Limitation Act 1969 (NSW) ss 14, 63 \u00b7 Limitation of Actions Act 1974 (Qld) \u00b7 Barda &amp; Zerri [2026] FedCFamC2F 122 \u00b7 Maddock [2011] FMCAfam 1340 \u00b7 Pelly &amp; Nolan [2011] FMCAfam 530 \u00b7 Vadisanis [2014] FamCAFC 97 \u00b7 Tomaras [2018] HCA 62.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">WHEN TO CONSULT PARK &amp; CO LAWYERS \u00b7 FAMILY LAW<\/span>\n            <h3 class=\"col-cta-title\">Ready to Lock In $4,950 Consent Orders, Compel Disclosure, or Protect Family Assets?<\/h3>\n            <p class=\"col-cta-desc\">Save thousands on straightforward No-Fault Divorce using our DIY manual; when you need enforceable Consent Orders, formal financial disclosure demands, or cross-border property protection, submit your key dates via our 3-minute consultation form.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">Open Family Law Consultation Form<\/a>\n              <a href=\"../../files/EN/PDF/03_Family_Law_Divorce_Property_Parenting_and_Settlement_Manual_2026_EN.pdf\" download class=\"col-btn-ghost\">Download Manual 03 (Family Law PDF)<\/a>\n              <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">Park &amp; Co Official Consultation Hub<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">Legal Disclaimer: This publication provides general legal information grounded in Australian legislation, official statistics and superior court authorities current as at November 2026. It does not constitute legal advice for your specific circumstances or create a solicitor-client relationship. Seek formal advice promptly before statutory limitation or visa deadlines expire.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">More Curated Family Law Columns<\/h3>\n        <a href=\"../../?lang=en&amp;tab=family\" class=\"col-back-link num\">\u2190 Back to Family Law Self-Help Hub<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../property-reforms-2026/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">2025\u20132026 REFORM BRIEFING \u00b7 FAMILY 01<\/span><h4 class=\"col-sib-title\">Australia&#x27;s 2025\u20132026 Property Settlement Overhaul: Economic Abuse, Separate Accounts, Family Pets &amp; Limitation Bars<\/h4><p class=\"col-sib-desc\">Covers the abolition of balance-sheet add-backs, s 4AB(2A) economic abuse proof thresholds, separate accounts and overseas assets under s 71B, the ban on shared pet custody, and strict s 44 time bars.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../divorce-parenting-reality-guide/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PRACTICAL REALITY GUIDE \u00b7 FAMILY 02<\/span><h4 class=\"col-sib-title\">Divorce, Parenting &amp; Property in Australia: The Practical Reality Check Before You Hire a Lawyer<\/h4><p class=\"col-sib-desc\">Explains s 48 no-fault DIY divorce and June 2025 s 98A paper hearings, the repeal of equal-time parenting presumptions (Gallagher, Picard, Radecki), PPP &lt;=$550k vs $4,950 Consent Orders.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../partner-visa-breakdown-crossborder/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">FAMILY &amp; VISA INTERSECTION \u00b7 FAMILY 03<\/span><h4 class=\"col-sib-title\">Partner Visa Breakdown, Division 1.5 Family Violence PR &amp; Cross-Border Property Traps<\/h4><p class=\"col-sib-desc\">Why sponsors cannot cancel visas, clearing the Gupta genuine-relationship gate and July 2024 Subclass 309 entry rules, aligning FCFCOA and DHA affidavits, and avoiding s 65Y travel offences.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a><a href=\"../family-trusts-companies-valuation-divorce/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">TRUSTS &amp; VALUATIONS \u00b7 FAMILY 15<\/span><h4 class=\"col-sib-title\">Family Trusts, Private Pty Ltd Companies and Shadow Business Valuations in Property Settlements<\/h4><p class=\"col-sib-desc\">Covers appointor/trustee control vs genuine third-party partners (Ascot), mandatory Single Expert Witness rules, s 106B clawbacks, and tax-effective s 79 orders.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a><a href=\"../post-separation-inheritances-windfalls-delay/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">POST-SEPARATION WEALTH \u00b7 FAMILY 16<\/span><h4 class=\"col-sib-title\">Why Delaying Consent Orders Exposes Post-Separation Inheritances, Lotto Wins and New Equity<\/h4><p class=\"col-sib-desc\">How leaving informal separations unsealed exposes inheritances received 4 years later, $5M\u2013$6M lottery windfalls and rising home equity, and how $4,950 Consent Orders close the door.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../prenups-bfa-vs-consent-orders/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PRENUPS &amp; CONSENT ORDERS \u00b7 FAMILY 17<\/span><h4 class=\"col-sib-title\">Why Prenups Get Crushed Under Thorne v Kennedy and When $4,950 Consent Orders Beat a BFA<\/h4><p class=\"col-sib-desc\">Explains how pre-marital wealth-protection BFAs survive scrutiny and why separated couples who agree save thousands with fixed-fee $4,950 Court Consent Orders.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../de-facto-threshold-disputes-out-of-time-s44/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">DE FACTO &amp; TIME BARS \u00b7 FAMILY 18<\/span><h4 class=\"col-sib-title\">&quot;Were We Even De Facto?&quot; Litigating s 4AA Thresholds, Concurrent Marriages and Out-of-Time Leave<\/h4><p class=\"col-sib-desc\">Why a 17-year secret relationship with monthly allowances failed s 4AA, when concurrent marriages still allow de facto claims, and how courts weigh s 44 hardship and delay.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}}</script>
