\"226\" width=\"410\" height=\"72\" rx=\"10\" fill=\"#FEF8EC\" stroke=\"#9A6700\" stroke-width=\"1.2\"/>\n  <text x=\"36\" y=\"249\" font-size=\"12.3\" font-weight=\"800\" fill=\"#9A6700\">Foreign Divorce vs AU Property \u00b7 Clayton v Bant [2020] HCA 44<\/text>\n  <text x=\"36\" y=\"271\" font-size=\"11.1\" fill=\"#1F242B\">Foreign divorce decree does NOT extinguish AU s 79 property<\/text>\n  <text x=\"36\" y=\"288\" font-size=\"11.1\" fill=\"#525B67\">rights; align FCFCOA &amp; DHA affidavit timelines<\/text>\n  <rect x=\"448\" y=\"226\" width=\"410\" height=\"72\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.4\"/>\n  <text x=\"462\" y=\"249\" font-size=\"12.3\" font-weight=\"800\" fill=\"#7A1F2B\">CRIMINAL RED LINE \u00b7 Unilateral Child Removal (ss 65Y / 65Z)<\/text>\n  <text x=\"462\" y=\"271\" font-size=\"11.1\" fill=\"#1F242B\">Max 3 years prison + AFP Airport Watchlist + Hague return;<\/text>\n  <text x=\"462\" y=\"288\" font-size=\"11.1\" fill=\"#525B67\">seek formal relocation order (McDevitt [2026])<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 2: Partner Visa Cessation and Cross-Border Family Law Guardrails<\/figcaption><\/figure>\n<p class=\"doc-p\">Relationship breakdown never converts a temporary visa into permanent residence automatically. Every cessation file has to clear three separate legal gates, and missing any one of them sinks the application.<\/p>\n<p class=\"doc-p\">First, you must prove that a genuine relationship existed <em>before<\/em> the breakdown. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCAFC/2022/51.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Minister for Immigration, Citizenship, Migrant Services and Multicultural Affairs v Gupta<\/em> [2022] FCAFC 51<\/a> ([48], [50]), the Full Federal Court held unanimously that a relationship cannot have &quot;ceased&quot; under cl 100.221(4) (or onshore cl 820.221(3)) unless a genuine married (s 5F / reg 1.15A) or de facto (s 5CB / reg 1.09A) relationship actually existed to begin with. Holding a provisional Subclass 309 or 820 visa does not bind the permanent-stage decision-maker on that threshold. Submitting thorough domestic-violence reports while neglecting pre-separation joint bank accounts, leases, household bills and social evidence remains the single most common cause of preventable refusal.<\/p>\n<p class=\"doc-p\">Second, onshore 820/801 files and offshore 309/100 files follow different Australian-entry rules. Onshore applicants (cl 820.221(3) / cl 801.221(6)) who establish relevant family violence or shared parental obligations (custody, joint custody, access, residence or formal child-support orders) can proceed straight to a permanent Subclass 801 grant even inside the normal two-year waiting window (cl 801.221(7)(d)). Offshore Subclass 309/100 rules changed on 1 July 2024 under the <em>Migration Amendment (Family Violence Provisions for Partner Visa Applicants) Regulations 2024<\/em> (F2024L00751). Although a 309 visa can now be granted onshore or offshore (cl 309.412), the family violence exception (cl 309.221(3)(b)(i) and cl 100.221(4)) strictly requires that the applicant has entered Australia after making the application. Applicants who lodged offshore and never set foot in Australia post-lodgement cannot access the 309/100 family violence pathway, although the shared-child exception in cl 309.221(3)(b)(ii) and cl 100.221(4AA) carries no onshore-entry requirement.<\/p>\n<p class=\"doc-p\">Third, non-physical abuse counts, provided the record proves reasonable fear. Twenty years ago in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCAFC/2005/56.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Sok v Minister for Immigration &amp; Multicultural &amp; Indigenous Affairs<\/em> [2005] FCAFC 56<\/a> ([24], [27], [37]), the Full Federal Court confirmed that &quot;relevant family violence&quot; (reg 1.21) is not restricted to physical blows; psychological abuse, coercion, and economic deprivation qualify where they cause the victim to fear for their personal wellbeing or safety. In June 2026, however, <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2026/741.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Mijalkov v Minister for Immigration, Citizenship and Multicultural Affairs<\/em> [2026] FCA 741<\/a> ([41]\u2013[42], [49], [67]) exposed a common evidentiary gap. Proving abusive text messages or threats to cancel a visa is not enough on its own unless the reg 1.24 evidentiary record affirmatively shows that the conduct caused the applicant to reasonably fear for, or be reasonably apprehensive about, their own wellbeing or safety ([67]).<\/p>\n<h2 id=\"judicial-versus-non-judicial-evidence-lin-23026-\" class=\"doc-h2\">Judicial versus non-judicial evidence (LIN 23/026) and consistent affidavits<\/h2>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">Evidentiary Pathway<\/th><th style=\"text-align:left\">Governing Rule &amp; Instrument<\/th><th style=\"text-align:left\">Mandatory Legal Requirements &amp; Practical Traps<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Judicial Evidence<\/strong><\/td><td style=\"text-align:left\">Migration Regulations reg 1.23(2)\u2013(7)<\/td><td style=\"text-align:left\">Final state/territory family violence protection order (e.g. QLD Protection Order), FCFCOA injunction (s 114 / s 68B), or criminal conviction. Trap: an <em>ex parte<\/em> temporary police or interim order made without the sponsor having an opportunity to be heard does not satisfy reg 1.23(4).<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Non-Judicial Evidence<\/strong><\/td><td style=\"text-align:left\">regs 1.24\u20131.25 + Ministerial Instrument LIN 23/026<\/td><td style=\"text-align:left\">Applicant&#x27;s reg 1.25 statutory declaration plus at least 2 documents from different Schedule 1 categories across 8 specified professions (medical practitioner/RN, police, child welfare agency, FV support service/refuge, social worker, psychologist, family consultant, school principal/counsellor).<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Independent Expert &amp; Tribunal Review<\/strong><\/td><td style=\"text-align:left\">reg 1.23(10) &amp; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2008/50.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Sok v MIAC<\/em> [2008] HCA 50<\/a> ([5], [40])<\/td><td style=\"text-align:left\">If the delegate is not satisfied on LIN 23/026 papers, referral to an Independent Expert is mandatory and their opinion binds the Minister. Under <em>Sok<\/em> [2008] HCA 50, FV can be raised for the first time at the Administrative Review Tribunal (ART), which must grant an oral hearing <em>before<\/em> any IE referral.<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"doc-p\">Running uncoordinated files across two separate firms creates another hazard: affidavit inconsistency. If a family lawyer drafts an FCFCOA property or parenting affidavit downplaying cohabitation dates or financial intermingling while a migration agent tells Home Affairs the couple shared everything from day one, that contradiction invites either a <em>Gupta<\/em> genuine-relationship refusal or a Public Interest Criterion 4020 fraud allegation. Both files have to be built off a single verified chronology.<\/p>\n<h2 id=\"overseas-divorce-decrees-clayton-v-bant-and-the-\" class=\"doc-h2\">Overseas divorce decrees (Clayton v Bant) and the 3-year prison trap on taking children abroad (ss 65Y/65Z)<\/h2>\n<p class=\"doc-p\">Cross-border separations between Australia and jurisdictions such as South Korea regularly trigger two high-risk family law mistakes. The first is assuming that a foreign divorce wipes out Australian property claims. Clients often worry that if an ex-partner rushes a divorce through in Seoul or another overseas court first, they lose any right to the Australian family home or superannuation. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2020/44.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Clayton v Bant<\/em> [2020] HCA 44<\/a> ([26], [32]), the High Court of Australia held unanimously that a foreign divorce ruling (there, from Dubai) cannot merge or extinguish statutory property (s 79) or spousal maintenance (s 74) rights under the Australian <em>Family Law Act<\/em>. Cause-of-action or <em>Anshun<\/em> estoppel arises only if the foreign court actually possessed and determined substantially equivalent property-alteration rights ([32], [37]). Because Australian <em>in personam<\/em> orders do not automatically alter land titles in overseas registries, cross-border settlements work best when Australian real estate transfers and superannuation splits are structured to offset overseas holdings cleanly.<\/p>\n<p class=\"doc-p\">The second mistake is flying children overseas unilaterally. When a relationship collapses far from extended family, an isolated parent is often tempted to book a one-way flight home with the children. Where parenting orders are in force (ss 65Y / 65Z) or parenting proceedings are pending (ss 65YA / 65ZAA), taking or sending a child outside Australia without every party&#x27;s authenticated written consent or a Court order is a federal crime punishable by up to 3 years&#x27; imprisonment. Doing so also triggers an immediate Australian Federal Police Family Law Watchlist block at the airport and exposes the taking parent to summary return proceedings under the Hague Child Abduction Convention, which is in force between Australia and South Korea, Japan, the UK, the USA, and over 90 other states. Lawful international relocation is achievable through the Court, provided you obtain the relocation order <em>before<\/em> buying a ticket: in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2026/11.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>McDevitt &amp; Duchamps<\/em> [2026] FedCFamC1A 11<\/a> ([73], [76]), the Full Court upheld orders permitting a mother to relocate internationally and removing the child from the Watchlist where the father&#x27;s coercive violence posed an unacceptable safety risk under s 60CC(2)(a).<\/p>\n<h2 id=\"coordinating-your-visa-protection-and-family-law\" class=\"doc-h2\">Coordinating your visa protection and family law strategy<\/h2>\n<p class=\"doc-p\">When sponsorship threats, family violence, children&#x27;s passports and overseas property collide, splitting your matter between two practitioners who do not speak the other&#x27;s statutory language creates avoidable risk. Secure your personal safety, identity documents and banking records first. From there, submit your current visa subclass (820/801 or 309/100), entry and separation dates, and a brief asset and parenting overview through the <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Family Law &amp; Partner Visa Consultation Form<\/a> or visit the <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Official Links Hub<\/a> so an Accredited Specialist in Immigration Law (QLS) and our family law practice can build one coordinated strategy.<\/p>\n\n          <div class=\"col-sources-box\">\n            Primary Authorities: Migration Regulations 1994 (Cth) Compilation No. 289 (Div 1.5 regs 1.21\u20131.27, cl 820.221, cl 801.221, cl 309.221, cl 100.221) \u00b7 Instrument LIN 23/026 \u00b7 Home Affairs 2025\u201326 Migration Program Report \u00b7 DHA FOI FA 25/08/01932 &amp; FA 21/08/01425 \u00b7 Family Law Act 1975 ss 65Y\u201365ZAA, s 79.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#E6C98C;\">WHEN TO CONSULT PARK &amp; CO LAWYERS \u00b7 FAMILY LAW<\/span>\n            <h3 class=\"col-cta-title\">Ready to Lock In $4,950 Consent Orders, Compel Disclosure, or Protect Family Assets?<\/h3>\n            <p class=\"col-cta-desc\">Save thousands on straightforward No-Fault Divorce using our DIY manual; when you need enforceable Consent Orders, formal financial disclosure demands, or cross-border property protection, submit your key dates via our 3-minute consultation form.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">Open Family Law Consultation Form<\/a>\n              <a href=\"../../files/EN/PDF/03_Family_Law_Divorce_Property_Parenting_and_Settlement_Manual_2026_EN.pdf\" download class=\"col-btn-ghost\">Download Manual 03 (Family Law PDF)<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=en\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">Park &amp; Co Official Consultation Hub<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">Legal Disclaimer: This publication provides general legal information grounded in Australian legislation, official statistics and superior court authorities current as at November 2026. It does not constitute legal advice for your specific circumstances or create a solicitor-client relationship. Seek formal advice promptly before statutory limitation or visa deadlines expire.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">More Curated Family Law Columns<\/h3>\n        <a href=\"../../?lang=en&amp;tab=family\" class=\"col-back-link num\">\u2190 Back to Family Law Self-Help Hub<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../property-reforms-2026/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">2025\u20132026 REFORM BRIEFING \u00b7 FAMILY 01<\/span><h4 class=\"col-sib-title\">Australia&#x27;s 2025\u20132026 Property Settlement Overhaul: Economic Abuse, Separate Accounts, Family Pets &amp; Limitation Bars<\/h4><p class=\"col-sib-desc\">Covers the abolition of balance-sheet add-backs, s 4AB(2A) economic abuse proof thresholds, separate accounts and overseas assets under s 71B, the ban on shared pet custody, and strict s 44 time bars.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../divorce-parenting-reality-guide/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PRACTICAL REALITY GUIDE \u00b7 FAMILY 02<\/span><h4 class=\"col-sib-title\">Divorce, Parenting &amp; Property in Australia: The Practical Reality Check Before You Hire a Lawyer<\/h4><p class=\"col-sib-desc\">Explains s 48 no-fault DIY divorce and June 2025 s 98A paper hearings, the repeal of equal-time parenting presumptions (Gallagher, Picard, Radecki), PPP &lt;=$550k vs $4,950 Consent Orders.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../parental-advances-loans-gifts-divorce/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PARENTAL ADVANCES \u00b7 FAMILY 14<\/span><h4 class=\"col-sib-title\">The Bank of Mum and Dad in Australian Divorce: Repayable Loan, Resulting Trust or Gift?<\/h4><p class=\"col-sib-desc\">Distinguishes deductible balance-sheet debts from s 79(4) contributions, resulting trusts vs advancement presumptions, and third-party parent interventions.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../family-trusts-companies-valuation-divorce/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">TRUSTS &amp; VALUATIONS \u00b7 FAMILY 15<\/span><h4 class=\"col-sib-title\">Family Trusts, Private Pty Ltd Companies and Shadow Business Valuations in Property Settlements<\/h4><p class=\"col-sib-desc\">Covers appointor/trustee control vs genuine third-party partners (Ascot), mandatory Single Expert Witness rules, s 106B clawbacks, and tax-effective s 79 orders.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a><a href=\"../post-separation-inheritances-windfalls-delay/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">POST-SEPARATION WEALTH \u00b7 FAMILY 16<\/span><h4 class=\"col-sib-title\">Why Delaying Consent Orders Exposes Post-Separation Inheritances, Lotto Wins and New Equity<\/h4><p class=\"col-sib-desc\">How leaving informal separations unsealed exposes inheritances received 4 years later, $5M\u2013$6M lottery windfalls and rising home equity, and how $4,950 Consent Orders close the door.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../prenups-bfa-vs-consent-orders/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PRENUPS &amp; CONSENT ORDERS \u00b7 FAMILY 17<\/span><h4 class=\"col-sib-title\">Why Prenups Get Crushed Under Thorne v Kennedy and When $4,950 Consent Orders Beat a BFA<\/h4><p class=\"col-sib-desc\">Explains how pre-marital wealth-protection BFAs survive scrutiny and why separated couples who agree save thousands with fixed-fee $4,950 Court Consent Orders.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../de-facto-threshold-disputes-out-of-time-s44/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">DE FACTO &amp; TIME BARS \u00b7 FAMILY 18<\/span><h4 class=\"col-sib-title\">&quot;Were We Even De Facto?&quot; Litigating s 4AA Thresholds, Concurrent Marriages and Out-of-Time Leave<\/h4><p class=\"col-sib-desc\">Why a 17-year secret relationship with monthly allowances failed s 4AA, when concurrent marriages still allow de facto claims, and how courts weigh s 44 hardship and delay.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}}</script>

  var liveTodayViews = (cached.day === day && typeof cached.today === 'number') ? cached.today : null;
  var liveTodayVis = (cached.day === day && typeof cached.todayVis === 'number') ? cached.todayVis : null;
  var liveRefHints = {};

  function classifyReferralBucket() {
    try {
      var qs = new URLSearchParams(location.search || '');
      var utm = (qs.get('utm_source') || qs.get('ref') || qs.get('channel') || '').toLowerCase().trim();
      if (utm) {
        if (utm.indexOf('cafe') >= 0) return 'naver-cafe';
        if (utm.indexOf('naver') >= 0) return 'naver-search';
        if (utm.indexOf('kakao') >= 0) return 'kakaotalk';
        if (utm.indexOf('google') >= 0) return 'google';
        if (utm.indexOf('thread') >= 0 || utm.indexOf('insta') >= 0 || utm === 'ig') return 'threads-ig';
        if (utm.indexOf('youtube') >= 0 || utm === 'yt') return 'youtube';
        if (utm.indexOf('faq') >= 0) return 'faq-portal';
        if (utm.indexOf('diy') >= 0) return 'diy-guide';
        if (utm.indexOf('blog') >= 0 || utm.indexOf('aussielife') >= 0 || utm.indexOf('parklawyers') >= 0 || utm === 'website') return 'parkco-sites';
        if (
          utm.indexOf('hub') >= 0 || utm.indexOf('guide') >= 0 || utm.indexOf('parkco') >= 0 ||
          utm.indexOf('vgpt') >= 0 || utm.indexOf('aumlt') >= 0 || utm.indexOf('dama') >= 0 ||
          utm.indexOf('whm') >= 0 || utm.indexOf('parent') >= 0 || utm.indexOf('gsm') >= 0 ||
          utm.indexOf('sid') >= 0 || utm.indexOf('crisis') >= 0 || utm.indexOf('partner') >= 0 ||
          utm.indexOf('employment') >= 0 || utm.indexOf('family') >= 0 || utm.indexOf('settlement') >= 0 ||
          utm.indexOf('intel') >= 0
        ) return 'parkco-hub';
        return 'other-web';
      }
      var ref = String(document.referrer || '').trim();
      var ua = String((navigator && navigator.userAgent) || '');
      if (ref) {
        if (ref.indexOf('android-app://com.google') === 0) return 'google';
        var u = new URL(ref);
        var h = (u.hostname || '').toLowerCase();
        var p = (u.pathname || '/').toLowerCase();
        if (h === location.hostname && (IS_PROD ? isSelfPath(p) : true)) {
          /* Same-app internal navigation; fall through to mobile UA / direct */
        } else if (h.indexOf('cafe.naver.') >= 0) {
          return 'naver-cafe';
        } else if (h.indexOf('naver.') >= 0) {
          return 'naver-search';
        } else if (h.indexOf('kakao.') >= 0 || h.indexOf('daum.') >= 0) {
          return 'kakaotalk';
        } else if (h.indexOf('google.') >= 0) {
          return 'google';
        } else if (h.indexOf('threads.') >= 0 || h.indexOf('instagram.') >= 0) {
          return 'threads-ig';
        } else if (h.indexOf('youtube.') >= 0 || h === 'youtu.be') {
          return 'youtube';
        } else if (h.indexOf('immispecialist.com') >= 0) {
          return 'faq-portal';
        } else if (h === 'changa9090.github.io' && p.indexOf('/diy-service-save-money') === 0) {
          return 'diy-guide';
        } else if (h === 'changa9090.github.io') {
          return 'parkco-hub';
        } else if (h.indexOf('aussielife.org') >= 0 || h.indexOf('parklawyers.com.au') >= 0 || h.indexOf('parkcolawyers.com') >= 0 || h.indexOf('hojuro.net') >= 0) {
          return 'parkco-sites';
        } else {
          return 'other-web';
        }
      }
      if (/KAKAOTALK/i.test(ua)) return 'kakaotalk';
      if (/NAVER\(inapp/i.test(ua)) return 'naver-search';
      if (/Barcelona|Threads|Instagram/i.test(ua)) return 'threads-ig';
    } catch (e) {}
    return 'direct';
  }

  function fmt(n) { return typeof n === 'number' && !isNaN(n) ? Number(n).toLocaleString('en-AU') : '-'; }

  function renderBadge(tot, tod, vis) {
    var elTot = document.getElementById('vc-total');
    var elTod = document.getElementById('vc-today');
    var elVis = document.getElementById('vc-visitors');
    if (tot != null && elTot) elTot.textContent = fmt(tot);
    if (tod != null && elTod) elTod.textContent = fmt(tod);
    if (vis != null && elVis) elVis.textContent = fmt(vis);
    if (tot != null || tod != null || vis != null) box.hidden = false;
  }

  var seedTot = Number(box.getAttribute('data-seed-total')) || LEGACY_TOTAL || 0;
  var seedVis = Number(box.getAttribute('data-seed-visitors')) || LEGACY_VIS || 0;
  var initTot = Math.max(cached.total || 0, seedTot) || null;
  var initVis = Math.max(cached.visitors || 0, seedVis) || null;
  if (initTot != null || initVis != null) {
    renderBadge(initTot, liveTodayViews, initVis);
  }

  /* 429-aware retry spanning >15s across retries to cleanly outlast Abacus 30;w=10 windows */
  function fetchRetry(url, isHit, attempt) {
    var tries = attempt || 0;
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 15000) : null;
    var opts = { mode: 'cors' };
    if (ctrl) opts.signal = ctrl.signal;
    if (isHit) opts.keepalive = true;
    return fetch(url, opts)
      .then(function (r) {
        if (timer) clearTimeout(timer);
        if (!isHit && r.status === 404) return { value: 0 };
        if (r.status === 429) {
          var err429 = new Error('HTTP 429');
          err429.isRateLimit = true;
          throw err429;
        }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (j) {
        if (typeof j.value !== 'number') throw new Error('bad payload');
        return j.value;
      })
      .catch(function (err) {
        if (timer) clearTimeout(timer);
        var maxTries = (err && err.isRateLimit) ? 3 : 2;
        if (tries < maxTries) {
          var waitMs = (err && err.isRateLimit) ? (3800 + tries * 3600) : (1100 * (tries + 1));
          return new Promise(function (res) { setTimeout(res, waitMs); })
            .then(function () { return fetchRetry(url, isHit, tries + 1); });
        }
        throw err;
      });
  }

  function call(kind, key) {
    return fetchRetry(API + kind + '/' + NS + '/' + P + '-' + key, kind === 'hit', 0);
  }
  function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  if (lastDay !== day) {
    call('hit', 'vday-' + day).then(function (v) {
      liveTodayVis = v;
      try {
        localStorage.setItem(P + '-day', day);
        var cur = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}') || {};
        cur.todayVis = v;
        cur.day = day;
        localStorage.setItem(CACHE_KEY, JSON.stringify(cur));
      } catch (e) {}
    }).catch(function () {});
  }

  if (lastRefDay !== day) {
    var refBucket = classifyReferralBucket();
    delay(220).then(function () {
      return call('hit', 'ref-' + refBucket + '-' + day);
    }).then(function (rv) {
      liveRefHints[refBucket] = rv;
      try {
        localStorage.setItem(P + '-ref-day', day);
        localStorage.setItem(P + '-ref-bucket', refBucket);
      } catch (e) {}
    }).catch(function () {});
  }

  Promise.allSettled([
    call('hit', 'total'),
    delay(80).then(function () { return call('hit', 'day-' + day); }),
    delay(160).then(function () {
      return call(seen ? 'get' : 'hit', 'visitors').then(function (val) {
        if (!seen) {
          try { localStorage.setItem(P + '-seen', '1'); } catch (e) {}
        }
        return val;
      });
    })
  ]).then(function (res) {
    var tot = res[0].status === 'fulfilled' ? (res[0].value + LEGACY_TOTAL) : initTot;
    var tod = res[1].status === 'fulfilled' ? res[1].value : liveTodayViews;
    var vis = res[2].status === 'fulfilled' ? (res[2].value + LEGACY_VIS) : initVis;
    if (typeof tod === 'number') liveTodayViews = tod;
    renderBadge(tot, tod, vis);
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        total: tot != null ? tot : initTot,
        today: tod != null ? tod : liveTodayViews,
        todayVis: liveTodayVis,
        visitors: vis != null ? vis : initVis,
        day: day
      }));
    } catch (e) {}
  });

  function lastDays(n) {
    var p = today.split('-').map(Number), base = Date.UTC(p[0], p[1] - 1, p[2]), out = [];
    for (var i = n - 1; i >= 0; i--) {
      var s = new Date(base - i * 864e5).toISOString().slice(0, 10);
      if (s >= START) out.push(s);
    }
    return out.length ? out : [today];
  }

  var activeRange = 7;
  var modal = document.createElement('div');
  modal.id = 'vc-modal';
  modal.innerHTML = '<div class="vc-dialog" role="dialog" aria-modal="true" aria-labelledby="vc-modal-title">' +
    '<button type="button" class="vc-close" aria-label="Close">&times;</button>' +
    '<h3 id="vc-modal-title"></h3>' +
    '<div class="vc-body">Loading&hellip;</div></div>';
  document.body.appendChild(modal);
  syncCounterLang();

  function close() { modal.classList.remove('open'); }
  modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
  modal.querySelector('.vc-close').addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

  function copyShareLink(refCode, btnEl) {
    try {
      var u = new URL(location.href);
      u.searchParams.delete('utm_source');
      u.searchParams.set('ref', refCode);
      var text = u.toString();
      var done = function () {
        if (!btnEl) return;
        var prev = btnEl.getAttribute('data-orig') || btnEl.textContent;
        btnEl.setAttribute('data-orig', prev);
        btnEl.textContent = uiLang() === 'en' ? 'Copied ✓' : '복사됨 ✓';
        setTimeout(function () { btnEl.textContent = prev; }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () {});
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      }
    } catch (e) {}
  }

  modal.addEventListener('click', function (e) {
    var chip = e.target && e.target.closest ? e.target.closest('.vc-share-chip') : null;
    if (chip) {
      var rc = chip.getAttribute('data-ref-code');
      if (rc) copyShareLink(rc, chip);
      return;
    }
    var rbtn = e.target && e.target.closest ? e.target.closest('.vc-range-btn') : null;
    if (rbtn) {
      var nr = Number(rbtn.getAttribute('data-range')) || 7;
      if (nr !== activeRange) {
        activeRange = nr;
        loadAndRenderModal(false);
      }
    }
  });

  function renderShareBar(isEn) {
    var lbl = isEn
      ? 'Copy Tracked Referral Share Link (?ref=)'
      : '채널별 유입 측정 공유 링크 복사 (?ref=)';
    var chips = SHARE_CHANNELS.map(function (c) {
      var name = isEn ? c.en : c.ko;
      return '<button type="button" class="vc-share-chip" data-ref-code="' + c.ref + '">' +
        name + ' (?ref=' + c.ref + ')</button>';
    }).join('');
    return '<div id="vc-share-box" class="vc-share-box"><div class="vc-share-lbl">' + lbl +
      '</div><div class="vc-share-chips">' + chips + '</div></div>';
  }

  function renderToolbar(isEn, fullDaysLen) {
    if (fullDaysLen <= 7) return '';
    var b7 = '<button type="button" class="vc-range-btn' + (activeRange === 7 ? ' active' : '') + '" data-range="7">' +
      (isEn ? 'Last 7 days' : '최근 7일') + '</button>';
    var b30 = '<button type="button" class="vc-range-btn' + (activeRange === 30 ? ' active' : '') + '" data-range="30">' +
      (isEn ? 'Last 30 days' : '최근 30일') + '</button>';
    return '<div class="vc-toolbar"><div class="vc-range-tabs">' + b7 + b30 + '</div></div>';
  }

  function renderChartSvg(days, rows, isEn) {
    var W = 640, H = 240, L = 40, R = 12, T = 14, B = 38;
    var max = Math.max(1, Math.max.apply(null, rows.map(function (r) { return Math.max(r[0], r[1]); })));
    var step = (W - L - R) / days.length, bw = Math.min(36, Math.max(4, step * 0.6));
    var y = function (v) { return T + (H - T - B) * (1 - v / max); };
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="vc-svg" role="img" aria-label="Daily visits chart">';
    [0, 0.5, 1].forEach(function (f) {
      var v = Math.round(max * f), yy = y(v);
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" class="vc-grid"/>' +
        '<text x="' + (L - 6) + '" y="' + (yy + 4) + '" class="vc-ylab">' + fmt(v) + '</text>';
    });
    var pts = [];
    days.forEach(function (d, i) {
      var cx = L + step * i + step / 2, views = rows[i][0], vis = rows[i][1];
      svg += '<rect x="' + (cx - bw / 2) + '" y="' + y(views) + '" width="' + bw + '" height="' +
        (H - B - y(views)) + '" class="vc-bar"><title>' + d + ': ' + fmt(views) + (isEn ? ' page views' : '회 조회') + '</title></rect>';
      pts.push(cx + ',' + y(vis));
      if (days.length <= 10 || i % Math.ceil(days.length / 8) === 0 || i === days.length - 1)
        svg += '<text x="' + cx + '" y="' + (H - B + 16) + '" class="vc-xlab">' + d.slice(5) + '</text>';
    });
    svg += '<polyline points="' + pts.join(' ') + '" class="vc-line"/>';
    pts.forEach(function (p, i) {
      var xy = p.split(',');
      svg += '<circle cx="' + xy[0] + '" cy="' + xy[1] + '" r="3.5" class="vc-dot"><title>' + days[i] + ': ' +
        fmt(rows[i][1]) + (isEn ? ' visitors' : '명 방문자') + '</title></circle>';
    });
    svg += '</svg>';
    var sum = rows.reduce(function (a, r) { return [a[0] + r[0], a[1] + r[1]]; }, [0, 0]);
    var summaryLine = isEn
      ? (days.length + ' day(s) &middot; ' + fmt(sum[0]) + ' page views &middot; ' + fmt(sum[1]) + ' daily visitors (since ' + START + '; 1 daily visitor per browser).')
      : ('표시 구간 ' + days.length + '일 합계 &middot; 페이지 조회 ' + fmt(sum[0]) + '회 &middot; 일별 순방문자 ' + fmt(sum[1]) + '명 (' + START + ' 집계 시작 &middot; 하루 브라우저당 1회)');
    return svg + '<div class="vc-legend"><span><i class="vc-k-bar"></i>' + (isEn ? 'Page views' : '페이지 조회') + '</span>' +
      '<span><i class="vc-k-line"></i>' + (isEn ? 'Daily visitors' : '일별 순방문자') + '</span></div>' +
      '<p class="vc-sum">' + summaryLine + '</p>';
  }

  function loadTodayReferrers(dayKey) {
    if (liveTodayViews === 0 && liveTodayVis === 0) {
      return Promise.resolve({});
    }
    var out = {};
    var remaining = [];
    REF_BUCKETS.forEach(function (b) {
      if (typeof liveRefHints[b.id] === 'number') {
        out[b.id] = liveRefHints[b.id];
      } else {
        remaining.push(b);
      }
    });
    var firstSlice = remaining.slice(0, 6);
    var secondSlice = remaining.slice(6);
    return Promise.all(firstSlice.map(function (b) {
      return call('get', 'ref-' + b.id + '-' + dayKey).catch(function () { return 0; }).then(function (v) { out[b.id] = v || 0; });
    })).then(function () {
      return secondSlice.length ? delay(260) : Promise.resolve();
    }).then(function () {
      return Promise.all(secondSlice.map(function (b) {
        return call('get', 'ref-' + b.id + '-' + dayKey).catch(function () { return 0; }).then(function (v) { out[b.id] = v || 0; });
      }));
    }).then(function () {
      return out;
    });
  }

  function renderReferrerBox(countsMap) {
    var isEn = uiLang() === 'en';
    var items = REF_BUCKETS.map(function (b) {
      return { id: b.id, label: isEn ? b.en : b.ko, count: countsMap[b.id] || 0 };
    }).filter(function (x) { return x.count > 0; }).sort(function (a, b) { return b.count - a.count; });
    var totalRef = items.reduce(function (acc, x) { return acc + x.count; }, 0);
    var head = '<div class="vc-ref-title"><span>' +
      (isEn ? ('Today&rsquo;s Referral Channels (' + today + ')') : ('오늘 유입 채널 분포 (' + today + ')')) +
      '</span><small>' + (isEn ? ('Tracked visitors: ' + fmt(totalRef)) : ('채널 집계 방문자: ' + fmt(totalRef) + '명')) + '</small></div>';
    if (!items.length) {
      return head + '<p class="vc-ref-note">' +
        (isEn
          ? 'Anonymous referral channel buckets (Naver, Cafe, KakaoTalk, Threads, Hub, Direct) are recorded once per browser per day as new visits arrive (zero personal or URL path data stored).'
          : '익명 유입 경로(검색·카페·카카오톡·스레드·허브 이동 등) 집계는 신규 방문부터 하루 브라우저당 1회씩 기록됩니다 (세부 URL·개인정보 미수집).') +
        '</p>';
    }
    var rowsHtml = items.map(function (item) {
      var pct = totalRef > 0 ? Math.round((item.count / totalRef) * 100) : 0;
      return '<div class="vc-ref-row">' +
        '<span class="vc-ref-name" title="' + item.label + '">' + item.label + '</span>' +
        '<div class="vc-ref-track"><div class="vc-ref-fill" style="width:' + Math.max(4, pct) + '%"></div></div>' +
        '<span class="vc-ref-val">' + fmt(item.count) + ' (' + pct + '%)</span>' +
        '</div>';
    }).join('');
    var note = isEn
      ? 'Privacy-safe coarse channel buckets only (1 per browser/day; zero IP, query string, or full referrer URL stored).'
      : '개인정보 보호형 채널 그룹 집계 (하루 브라우저당 1회 기준 &middot; 검색어·세부 URL·IP 미수집)';
    return head + '<div class="vc-ref-list">' + rowsHtml + '</div><p class="vc-ref-note">' + note + '</p>';
  }

  function loadHistoryRows(days) {
    var histCache = {};
    try { histCache = JSON.parse(localStorage.getItem(HIST_KEY) || '{}') || {}; } catch (e) {}
    var results = new Array(days.length);
    var pending = [];
    days.forEach(function (d, idx) {
      if (d < today && Array.isArray(histCache[d])) {
        results[idx] = histCache[d];
      } else if (d === today && typeof liveTodayViews === 'number' && typeof liveTodayVis === 'number') {
        results[idx] = [liveTodayViews, liveTodayVis];
      } else {
        pending.push({ d: d, idx: idx });
      }
    });

    var batchSize = pending.length > 7 ? 4 : 6;
    var pauseMs = pending.length > 7 ? 2900 : 180;
    var chain = Promise.resolve();
    for (var c = 0; c < pending.length; c += batchSize) {
      (function (slice, waitFirst) {
        chain = chain.then(function () {
          return (waitFirst ? delay(pauseMs) : Promise.resolve()).then(function () {
            return Promise.all(slice.map(function (item) {
              var k = item.d.replace(/-/g, '');
              var pViews = (item.d === today && typeof liveTodayViews === 'number')
                ? Promise.resolve(liveTodayViews)
                : call('get', 'day-' + k).catch(function () { return null; });
              var pVis = (item.d === today && typeof liveTodayVis === 'number')
                ? Promise.resolve(liveTodayVis)
                : call('get', 'vday-' + k).catch(function () { return null; });
              return Promise.all([pViews, pVis]).then(function (pair) {
                var v0 = pair[0] == null ? 0 : pair[0];
                var v1 = pair[1] == null ? 0 : pair[1];
                results[item.idx] = [v0, v1];
                if (item.d < today && pair[0] !== null && pair[1] !== null) {
                  histCache[item.d] = [v0, v1];
                }
              });
            }));
          });
        });
      })(pending.slice(c, c + batchSize), c > 0);
    }
    return chain.then(function () {
      try { localStorage.setItem(HIST_KEY, JSON.stringify(histCache)); } catch (e) {}
      return results.map(function (r) { return r || [0, 0]; });
    });
  }

  var cachedRefMap = null;

  function loadAndRenderModal(refreshRefs) {
    syncCounterLang();
    var isEn = uiLang() === 'en';
    var fullDays = lastDays(30);
    var days = activeRange === 7 ? lastDays(7) : fullDays;
    var body = modal.querySelector('.vc-body');
    var chartWaitMsg = isEn ? 'Loading daily statistics&hellip;' : '일별 통계를 불러오는 중입니다&hellip;';
    var refWaitMsg = isEn ? 'Loading today&rsquo;s referral channels&hellip;' : '오늘 유입 채널 집계를 불러오는 중입니다&hellip;';
    var existingRefHtml = (!refreshRefs && cachedRefMap) ? renderReferrerBox(cachedRefMap) : ('<div class="vc-ref-note">' + refWaitMsg + '</div>');

    /* Render toolbar, loading placeholder, referral box, and 1-click share bar IMMEDIATELY (0ms) */
    body.innerHTML = renderToolbar(isEn, fullDays.length) +
      '<div id="vc-chart-slot"><p class="vc-sum">' + chartWaitMsg + '</p></div>' +
      '<div id="vc-ref-box" class="vc-ref-box">' + existingRefHtml + '</div>' +
      renderShareBar(isEn);

    loadHistoryRows(days)
      .then(function (rows) {
        var slot = document.getElementById('vc-chart-slot');
        if (slot) slot.innerHTML = renderChartSvg(days, rows, uiLang() === 'en');
        if (!refreshRefs && cachedRefMap) return cachedRefMap;
        return delay(180).then(function () { return loadTodayReferrers(day); });
      })
      .then(function (refMap) {
        if (refMap) cachedRefMap = refMap;
        var refBox = document.getElementById('vc-ref-box');
        if (refBox && refMap) refBox.innerHTML = renderReferrerBox(refMap);
      })
      .catch(function () {
        var slot = document.getElementById('vc-chart-slot');
        if (slot && !slot.querySelector('svg')) {
          slot.textContent = uiLang() === 'en' ? 'Could not load the chart.' : '그래프를 불러오지 못했습니다.';
        }
      });
  }

  function open() {
    activeRange = 7;
    modal.classList.add('open');
    loadAndRenderModal(true);
  }
  box.setAttribute('role', 'button');
  box.setAttribute('tabindex', '0');
  box.addEventListener('click', open);
  box.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
})();
  </script>
