  <script id="col-payload" type="application/json">{"ko": {"doc_title": "\ud638\uc8fc \ud30c\ud2b8\ub108\ube44\uc790 \uc9c4\ud589 \uc911 \uacb0\ubcc4\u00b7\uac00\uc815\ud3ed\ub825\uacfc \ud55c\u00b7\ud638 \uad6d\uc81c \uc7ac\uc0b0\ubd84\ud560 \uc2e4\uc804 \ub300\ucc98\ubc95 \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">\uc804\uccb4 \uac00\uc774\ub4dc \ud648<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=ko\">\ube44\uc790 \uc194\ub8e8\uc158 \uac00\uc774\ub4dc<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=ko\">\uace0\uc6a9\ubc95 \ub0b4\ube44\uac8c\uc774\ud130<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=ko\">\uc140\ud504 \ubc95\ub960 \ud574\uacb0 \u00b7 \ubcc0\ud638\uc0ac \uc0c1\ub2f4 \uc2dc\uc810 \uac00\uc774\ub4dc<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\">\ubc15\uc564\ucf54 \uc0c1\ub2f4 \uc2e0\uccad \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=ko&amp;tab=family\" class=\"col-back-btn\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \u00b7 \ud638\uc8fc \uac00\uc871\ubc95 \uc26c\uc6b4 \ud310\ub840 \uce7c\ub7fc<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn active\">\ud55c\uad6d\uc5b4<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">\uc628\ub77c\uc778 \uc0c1\ub2f4 \uc2e0\uccad \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">\uc774\ubbfc\u00b7\uac00\uc871\ubc95 \uad50\ucc28 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 03<\/span>\n          <span class=\"col-verified-pill num\">\uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac(QLS) 1\ucc28 \uac80\uc99d (2026.11)<\/span>\n          <span class=\"col-time-pill num\">\uc57d 9\ubd84 \uc18c\uc694<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">\ud638\uc8fc \ud30c\ud2b8\ub108\ube44\uc790 \uc9c4\ud589 \uc911 \uacb0\ubcc4\u00b7\uac00\uc815\ud3ed\ub825\uacfc \ud55c\u00b7\ud638 \uad6d\uc81c \uc7ac\uc0b0\ubd84\ud560 \uc2e4\uc804 \ub300\ucc98\ubc95<\/h1>\n        <p class=\"col-subtitle\">\ub300\uae30 116,917\uac74 \uc2dc\ub300\uc758 820/801\u00b7309/100 \uc601\uc8fc\uad8c \uad6c\uc81c \ud2b9\ub840(LIN 23/026), \uc678\uad6d \uc774\ud63c \ud310\uacb0\uacfc \ud638\uc8fc \uc7ac\uc0b0\ubd84\ud560(Clayton v Bant), \ud574\uc678 \uc544\ub3d9 \uc774\ub3d9 \ud615\uc0ac\ucc98\ubc8c(s 65Y) \uc8fc\uc758\ubcf4<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">\ubc15\ucc3d\ubbfc \ub300\ud45c\ubcc0\ud638\uc0ac (Chang Min Park)<\/div>\n            <div class=\"col-author-role\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \ub300\ud45c\ubcc0\ud638\uc0ac \u00b7 \ud638\uc8fc \ud038\uc990\ub79c\ub4dc\uc8fc \ubcc0\ud638\uc0ac\ud68c \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col03_partner_visa_crossborder_hero.jpg\" alt=\"\ud638\uc8fc \ud30c\ud2b8\ub108\ube44\uc790 \uc9c4\ud589 \uc911 \uacb0\ubcc4\u00b7\uac00\uc815\ud3ed\ub825\uacfc \ud55c\u00b7\ud638 \uad6d\uc81c \uc7ac\uc0b0\ubd84\ud560 \uc2e4\uc804 \ub300\ucc98\ubc95\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">\ud30c\ud2b8\ub108\ube44\uc790 \uc9c4\ud589 \uc911 \uacb0\ubcc4\uc774 \ubc1c\uc0dd\ud55c \uacbd\uc6b0 \uc774\ubbfc\uc131 \uc81c\ucd9c \uc9c4\uc220\uc11c\uc640 \ud638\uc8fc\u00b7\ud55c\uad6d \uac00\uc871\ubc95 \uc7ac\uc0b0\u00b7\uc591\uc721 \uc11c\ub958\uc758 \uc77c\uc790 \ubc0f \uc0ac\uc2e4\uad00\uacc4\ub97c \ucd08\uae30\ubd80\ud130 \uc77c\uad00\ub418\uac8c \uc815\ud569\uc2dc\ucf1c\uc57c \ud569\ub2c8\ub2e4.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">116,917\uac74 \ub300\uae30<\/div><div class=\"col-stat-lbl\">\ud638\uc8fc \ud30c\ud2b8\ub108\ube44\uc790 \ubbf8\ucc98\ub9ac \uc801\uccb4 \ubb3c\ub7c9 (3\ub144 \uc0c8 2\ubc30 \uae09\uc99d \u00b7 2025\u201326 \ub0b4\ubb34\ubd80 \ubcf4\uace0\uc11c)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">7,392\uba85 \uc2b9\uc778<\/div><div class=\"col-stat-lbl\">\uac00\uc815\ud3ed\ub825 \ud2b9\ub840 \ub204\uc801 \ud30c\ud2b8\ub108 \uc601\uc8fc\uad8c \ubc1c\uae09 (\ud55c\uad6d \uad6d\uc801 \uc2b9\uc778 \uc138\uacc4 9\uc704 \u00b7 DHA FOI)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">\ucd5c\uace0 \uc9d5\uc5ed 3\ub144<\/div><div class=\"col-stat-lbl\">\ub3d9\uc758\u00b7\ubc95\uc6d0 \ud5c8\uac00 \uc5c6\ub294 \uc790\ub140 \ud574\uc678 \uc774\ub3d9 \uc2dc \uc5f0\ubc29 \ud615\uc0ac\ucc98\ubc8c (\uac00\uc871\ubc95 ss 65Y\u00b765Z)<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">\uc774 \uce7c\ub7fc\uc758 \ubaa9\ucc28<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#\ub300\uae30-\ubb3c\ub7c9-11\ub9cc-\uac74-\uc2dc\ub300-\ud1b5\uacc4\uac00-\ubcf4\uc5ec\uc8fc\ub294-\ud30c\ud2b8\ub108\ube44\uc790-\uac00\uc815\ud3ed\ub825-\uad6c\uc81c\uc758-\ud604\uc2e4\" class=\"col-toc-link lvl-2\">\ub300\uae30 \ubb3c\ub7c9 11\ub9cc \uac74 \uc2dc\ub300, \ud1b5\uacc4\uac00 \ubcf4\uc5ec\uc8fc\ub294 \ud30c\ud2b8\ub108\ube44\uc790 \uac00\uc815\ud3ed\ub825 \uad6c\uc81c\uc758 \ud604\uc2e4<\/a><a href=\"#\uc601\uc8fc\uad8c-\uc608\uc678division-15\uc758-3\ub300-\ubc95\uc801-\uad00\ubb38\uacfc-2024\ub144-7\uc6d4-309-\ube44\uc790-\uac1c\uc815\uc758\" class=\"col-toc-link lvl-2\">\uc601\uc8fc\uad8c \uc608\uc678(Division 1.5)\uc758 3\ub300 \ubc95\uc801 \uad00\ubb38\uacfc 2024\ub144 7\uc6d4 309 \ube44\uc790 \uac1c\uc815\uc758 \ud568\uc815<\/a><a href=\"#\uc0ac\ubc95\uc801-\uc99d\uac70-\ub300-\ube44\uc0ac\ubc95\uc801-\uc99d\uac70lin-23026-\uc124\uacc4\uc640-\uc9c4\uc220\uc11c-\uc815\ud569\uc131\" class=\"col-toc-link lvl-2\">\uc0ac\ubc95\uc801 \uc99d\uac70 \ub300 \ube44\uc0ac\ubc95\uc801 \uc99d\uac70(LIN 23/026) \uc124\uacc4\uc640 \uc9c4\uc220\uc11c \uc815\ud569\uc131<\/a><a href=\"#\ud55c\uad6d-\uc774\ud63c-\ud310\uacb0\uc758-\ud6a8\ub825clayton-v-bant\uacfc-\uc544\uc774-\ub370\ub9ac\uace0-\uadc0\uad6d-\uc2dc-3\ub144-\uc9d5\uc5ed-\ub9ac\uc2a4\" class=\"col-toc-link lvl-2\">\ud55c\uad6d \uc774\ud63c \ud310\uacb0\uc758 \ud6a8\ub825(Clayton v Bant)\uacfc \uc544\uc774 \ub370\ub9ac\uace0 \uadc0\uad6d \uc2dc 3\ub144 \uc9d5\uc5ed \ub9ac\uc2a4\ud06c<\/a><a href=\"#\ube44\uc790-\uc548\uc804\ub9dd\uacfc-\uac00\uc871\ubc95-\uad8c\ub9ac\ub97c-\ud55c-\ud638\ud761\uc73c\ub85c-\uc9c0\ud0a4\ub294-\ubc29\ubc95\" class=\"col-toc-link lvl-2\">\ube44\uc790 \uc548\uc804\ub9dd\uacfc \uac00\uc871\ubc95 \uad8c\ub9ac\ub97c \ud55c \ud638\ud761\uc73c\ub85c \uc9c0\ud0a4\ub294 \ubc29\ubc95<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">\uac00\uc871\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../?lang=ko&amp;tab=family\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">\ub2e4\ud23c\uc774 \uc0dd\uae38 \ub54c\ub9c8\ub2e4 \uc601\uc8fc\uad8c\uc790\uc778 \ubc30\uc6b0\uc790\uac00 \ub0b4\ubb34\ubd80\uc5d0 \uc5f0\ub77d\ud574 \uc2a4\ud3f0\uc11c\uc2ed\uc744 \ucde8\uc18c\ud558\uace0 \ud55c\uad6d\uc73c\ub85c \ucad3\uc544\ub0b4\uaca0\ub2e4\uace0 \uc18c\ub9ac\uccd0\uc694. \uc9c0\uae08 \uc9d1\uc744 \ub098\uc624\uba74 \uc81c \ube44\uc790\ub3c4 \ubc14\ub85c \ub05d\ub098\ub294 \uac74\uac00\uc694? \ud038\uc990\ub79c\ub4dc\uc8fc \ubcc0\ud638\uc0ac\ud68c \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac(Accredited Specialist in Immigration Law)\ub85c\uc11c \uac00\uc871\ubc95 \uc0ac\uac74\uc744 \ud568\uaed8 \ub2e4\ub8e8\ub2e4 \ubcf4\uba74 \uac00\uc7a5 \ubb34\uac81\uace0 \uc808\ubc15\ud55c \ubaa9\uc18c\ub9ac\ub85c \ub4e3\uac8c \ub418\ub294 \uc9c8\ubb38\uc774\uc5d0\uc694. \uacb0\ub860\ubd80\ud130 \ubd84\uba85\ud558\uac8c \ub9d0\uc500\ub4dc\ub9b4\uac8c\uc694. \ud638\uc8fc \uc774\ubbfc\ubc95\uc0c1 \uc2a4\ud3f0\uc11c \uac1c\uc778\uc5d0\uac8c\ub294 \uc0c1\ub300\ubc29\uc758 \ube44\uc790\ub97c \ucde8\uc18c\ud560 \uad8c\ud55c\uc774 \uc544\uc608 \uc5c6\uc5b4\uc694. \uc2a4\ud3f0\uc11c\uac00 \ud6c4\uc6d0\uc744 \ucca0\ud68c\ud558\ub354\ub77c\ub3c4 \ud30c\ud0c4 \uc804 \ub450 \uc0ac\ub78c\uc758 \ud63c\uc778\uc774\ub098 \uc0ac\uc2e4\ud63c \uad00\uacc4\uac00 \uc9c4\uc815\ud588\ub2e4\uba74 \ud569\ubc95\uc801 \ud1b5\ub85c\ub294 \uc5f4\ub824 \uc788\uac70\ub4e0\uc694. \ub2e4\ub9cc \uadf8 \ubb38\ud131\uc744 \ub118\uc73c\ub824\uba74 \uc774\ubbfc\ubc95 \uc99d\uac70 \uaddc\uce59\uacfc \ud638\uc8fc\u00b7\ud55c\uad6d \uc591\uad6d \uac00\uc871\ubc95 \uc808\ucc28\ub97c \ud55c \uce58\uc758 \uc5b4\uae0b\ub0a8\ub3c4 \uc5c6\uc774 \ub9de\ubb3c\ub824 \uc124\uacc4\ud574\uc57c \ud574\uc694. \uadf8\ub807\uac8c \uc900\ube44\ud558\uba74 \uac00\uc815\ud3ed\ub825 \uad6c\uc81c \uc870\ud56d\uc774\ub098 \uc790\ub140 \uc591\uc721 \uc608\uc678\ub97c \ud1b5\ud574 \ubcf8\uc778 \uc2a4\uc2a4\ub85c \uc601\uc8fc\uad8c(Subclass 801 \ub610\ub294 100)\uae4c\uc9c0 \ub098\uc544\uac08 \uc218 \uc788\uc5b4\uc694.<\/p>\n<h2 id=\"\ub300\uae30-\ubb3c\ub7c9-11\ub9cc-\uac74-\uc2dc\ub300-\ud1b5\uacc4\uac00-\ubcf4\uc5ec\uc8fc\ub294-\ud30c\ud2b8\ub108\ube44\uc790-\uac00\uc815\ud3ed\ub825-\uad6c\uc81c\uc758-\ud604\uc2e4\" class=\"doc-h2\">\ub300\uae30 \ubb3c\ub7c9 11\ub9cc \uac74 \uc2dc\ub300, \ud1b5\uacc4\uac00 \ubcf4\uc5ec\uc8fc\ub294 \ud30c\ud2b8\ub108\ube44\uc790 \uac00\uc815\ud3ed\ub825 \uad6c\uc81c\uc758 \ud604\uc2e4<\/h2>\n<p class=\"doc-p\">\uc65c \ucd5c\uadfc \ub4e4\uc5b4 \ud30c\ud2b8\ub108\ube44\uc790 \uacb0\ubcc4\uacfc \uac00\uc815\ud3ed\ub825 \uc0c1\ub2f4\uc774 \uc774\ud1a0\ub85d \uae09\uc99d\ud588\uc744\uae4c\uc694? \ud638\uc8fc \ub0b4\ubb34\ubd80(Department of Home Affairs)\uac00 \ubc1c\uac04\ud55c 2025\u201326 \uc774\ubbfc \ud504\ub85c\uadf8\ub7a8 \ubcf4\uace0\uc11c\uc5d0 \uadf8 \uad6c\uc870\uc801 \uc6d0\uc778\uc774 \uace0\uc2a4\ub780\ud788 \ucc0d\ud600 \uc788\uc5b4\uc694. \ud55c \ud574 \ub3d9\uc548 \uc0c8\ub85c \uc811\uc218\ub41c \ud30c\ud2b8\ub108\ube44\uc790 \uc2e0\uccad\uc740 66,916\uac74\uc5d0 \ub2ec\ud55c \ubc18\uba74 \uc5f0\uac04 \ubc1c\uae09 \uc0c1\ud55c\uc740 40,500\uac74\uc5d0 \ubb36\uc5ec \uc788\uac70\ub4e0\uc694. \uadf8\ub7ec\ub2e4 \ubcf4\ub2c8 \uc2ec\uc0ac\ub97c \uae30\ub2e4\ub9ac\ub294 \ubbf8\ucc98\ub9ac \ub300\uae30 \ubb3c\ub7c9\uc774 \ubd88\uacfc 3\ub144 \ub9cc\uc5d0 \ub450 \ubc30\ub85c \ubd88\uc5b4\ub098 2026\ub144 6\uc6d4 30\uc77c \uae30\uc900 \ubb34\ub824 116,917\uac74\uc744 \uae30\ub85d\ud588\uc5b4\uc694. \uc601\uc8fc\uad8c\uc774 \ub098\uc62c \ub54c\uae4c\uc9c0 \uc784\uc2dc\ube44\uc790 \uc0c1\ud0dc\ub85c \uae30\ub2e4\ub9ac\ub294 \ucde8\uc57d \uae30\uac04\ub3c4 \uadf8\ub9cc\ud07c \uae38\uc5b4\uc84c\uc8e0. \uc2a4\ud3f0\uc11c\uc758 \ub208\uce58\ub97c \ubcf4\uba70 \ubc84\ud168\uc57c \ud558\ub294 \uae30\uac04\uc774 \uae38\uc5b4\uc9c8\uc218\ub85d \ube44\uc790 \uc2e0\ubd84\uc744 \ubb34\uae30\ub85c \uc0dd\ud65c\ube44\ub97c \ub04a\uac70\ub098 \uace0\ub9bd\uc2dc\ud0a4\ub294 \uac15\uc555\uc801 \ud1b5\uc81c \uc5ed\uc2dc \ub298\uc5b4\ub0a0 \uc218\ubc16\uc5d0 \uc5c6\ub294 \uad6c\uc870\uc608\uc694.<\/p>\n<p class=\"doc-p\">\ub9ce\uc740 \ubd84\uc774 \uac00\uc815\ud3ed\ub825 \uc601\uc8fc\uad8c \ud2b9\ub840\ub294 \ubc14\ub298\uad6c\uba4d \uc544\ub2c8\ub0d0\uace0 \uac71\uc815\ud558\uc138\uc694. \uc2e0\uccb4 \uace8\uc808 \uac19\uc740 \uc911\uc0c1\ud574\ub97c \uc785\uc740 \uadf9\uc18c\uc218\ub9cc \ud1b5\uacfc\ud55c\ub2e4\uace0 \uc0dd\uac01\ud558\uc2dc\uc8e0. \ud558\uc9c0\ub9cc \ub0b4\ubb34\ubd80 \uc815\ubcf4\uacf5\uac1c\uccad\uad6c(FOI FA 25/08/01932 \ubc0f FA 21/08/01425) \ud1b5\uacc4\ub294 \uc804\ud600 \ub2e4\ub978 \uc0ac\uc2e4\uc744 \ubcf4\uc5ec\uc918\uc694. 2011\ub144 7\uc6d4\ubd80\ud130 2025\ub144 7\uc6d4\uae4c\uc9c0 \ud30c\ud2b8\ub108\ube44\uc790 \uac00\uc815\ud3ed\ub825 \uc870\ud56d\uc744 \ud1b5\ud574 \uc2e4\uc81c\ub85c \uc601\uc8fc\uad8c \uc2b9\uc778\uae4c\uc9c0 \ubc1b\uc740 \uc778\uc6d0\ub9cc \ub204\uc801 7,392\uba85\uc5d0 \uc774\ub974\uac70\ub4e0\uc694. \ucd5c\uadfc \uc5f0\uac04 \uc57d 1,080\uac74 \uc774\uc0c1 \uccad\uad6c\ub418\uace0 2023\u201324 \ud68c\uacc4\uc5f0\ub3c4 \ub2e8\uc77c \uc5f0\ub3c4\uc5d0\ub9cc 820\uac74\uc774 \uc2b9\uc778\ub410\uc8e0. \ub300\ud55c\ubbfc\uad6d \uad6d\uc801 \uc2e0\uccad\uc790\ub294 \uc804 \uc138\uacc4 \uc2b9\uc778 \uac74\uc218 \uc0c1\uc704 9\uc704\ub97c \ucc28\uc9c0\ud558\uace0 \uc788\uc5b4\uc694. \ub098\uc544\uac00 2024\u201325 \ud68c\uacc4\uc5f0\ub3c4\ubd80\ud130\ub294 \ud30c\ud2b8\ub108\ube44\uc790\ubfd0 \uc544\ub2c8\ub77c \uae30\uc220\u00b7\uace0\uc6a9\uc8fc \ud6c4\uc6d0 \uc601\uc8fc\ube44\uc790\uc758 \ub3d9\ubc18 \ubc30\uc6b0\uc790\uac00 \uac00\uc815\ud3ed\ub825\uc744 \uacaa\uc740 \uacbd\uc6b0\uae4c\uc9c0 \uad6c\uc81c \ubb38\ud638\uac00 \ub113\uc5b4\uc84c\uc5b4\uc694. \uadf8 \uacb0\uacfc \ud55c\uad6d \uad6d\uc801\uc790\uac00 \uccab\ud574 \uc2b9\uc778 \uc0c1\uc704 5\uac1c\uad6d \uc548\uc5d0 \ud3ec\ud568\ub418\uae30\ub3c4 \ud588\uac70\ub4e0\uc694.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 366\" width=\"100%\" role=\"img\" aria-label=\"\ud638\uc8fc \ud30c\ud2b8\ub108\ube44\uc790 \uc801\uccb4 \uae09\uc99d(116,917\uac74)\uacfc \uac00\uc815\ud3ed\ub825 \uc601\uc8fc\uad8c \ud2b9\ub840(Div 1.5) \uc2b9\uc778 \ud1b5\uacc4\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"365\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"78\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"79\" x2=\"879\" y2=\"79\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"28\" y=\"29\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.06em\">\ub0b4\ubb34\ubd80 \uacf5\uc2dd \ud1b5\uacc4 &amp; FOI \uacf5\uac1c\uc790\ub8cc \u00b7 \ub300\uae30 \uae30\uac04 2\ubc30 \uc99d\uac00\uc640 \uad6c\uc81c \uc2b9\uc778 \ud604\uc2e4<\/text>\n  <text x=\"28\" y=\"52\" font-size=\"16.8\" font-weight=\"800\" fill=\"#1F242B\">\ud638\uc8fc \ud30c\ud2b8\ub108\ube44\uc790 \uc801\uccb4 \uae09\uc99d(116,917\uac74)\uacfc \uac00\uc815\ud3ed\ub825 \uc601\uc8fc\uad8c \ud2b9\ub840(Div 1.5) \uc2b9\uc778 \ud1b5\uacc4<\/text>\n  <text x=\"28\" y=\"70\" font-size=\"11.3\" fill=\"#525B67\">\ucd9c\ucc98: \ub0b4\ubb34\ubd80(DHA) 2025\u201326 \uc774\ubbfc \ud504\ub85c\uadf8\ub7a8 \ubcf4\uace0\uc11c \u00b7 \ub0b4\ubb34\ubd80 \uc815\ubcf4\uacf5\uac1c\uccad\uad6c(FOI FA 25/08/01932 \ubc0f FA 21/08/01425)<\/text>\n  <rect x=\"22\" y=\"96\" width=\"412\" height=\"252\" rx=\"10\" fill=\"#FAF9F6\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"38\" y=\"122\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">\u2460 \ud30c\ud2b8\ub108\ube44\uc790 \ubbf8\ucc98\ub9ac \ub300\uae30 \ubb3c\ub7c9 \ucd94\uc774 (6\uc6d4 30\uc77c \uae30\uc900)<\/text>\n  <rect x=\"56\" y=\"231\" width=\"62\" height=\"59\" rx=\"6\" fill=\"#6E8594\"/>\n  <text x=\"87\" y=\"223\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#6E8594\">58,515<\/text>\n  <text x=\"87\" y=\"308\" text-anchor=\"middle\" font-size=\"11.2\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F242B\">2022\u201323<\/text>\n  <rect x=\"146\" y=\"213\" width=\"62\" height=\"77\" rx=\"6\" fill=\"#1F4E5F\"/>\n  <text x=\"177\" y=\"205\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F4E5F\">75,672<\/text>\n  <text x=\"177\" y=\"308\" text-anchor=\"middle\" font-size=\"11.2\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F242B\">2023\u201324<\/text>\n  <rect x=\"236\" y=\"192\" width=\"62\" height=\"98\" rx=\"6\" fill=\"#A63A48\"/>\n  <text x=\"267\" y=\"184\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#A63A48\">96,581<\/text>\n  <text x=\"267\" y=\"308\" text-anchor=\"middle\" font-size=\"11.2\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F242B\">2024\u201325<\/text>\n  <rect x=\"326\" y=\"171\" width=\"62\" height=\"119\" rx=\"6\" fill=\"#7A1F2B\"/>\n  <text x=\"357\" y=\"163\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#7A1F2B\">116,917<\/text>\n  <text x=\"357\" y=\"308\" text-anchor=\"middle\" font-size=\"11.2\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F242B\">2025\u201326<\/text>\n  <text x=\"38\" y=\"332\" font-size=\"11.2\" font-weight=\"700\" fill=\"#7A1F2B\">2025\u201326 \uc2e0\uaddc \uc811\uc218 66,916\uac74 vs \uc5f0\uac04 \ucffc\ud130 40,500\uac74 \u2192 \ub300\uae30 2\ubc30 \uc99d\uac00(+100%)<\/text>\n  <rect x=\"450\" y=\"96\" width=\"408\" height=\"252\" rx=\"10\" fill=\"#FAF9F6\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"466\" y=\"122\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">\u2461 \uac00\uc815\ud3ed\ub825 \ud2b9\ub840(Div 1.5) \uc601\uc8fc\uad8c \uc2e4\uc81c \uc2b9\uc778 \uc9c0\ud45c<\/text>\n  <rect x=\"466\" y=\"136\" width=\"376\" height=\"62\" rx=\"8\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1\"/>\n  <text x=\"478\" y=\"162\" font-size=\"15\" font-weight=\"800\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#7A1F2B\">7,392\uac74<\/text>\n  <text x=\"608\" y=\"160\" font-size=\"11.3\" font-weight=\"700\" fill=\"#1F242B\">\ub204\uc801 \ud30c\ud2b8\ub108 \uc601\uc8fc\uad8c \uc2b9\uc778 (2011.07\u20132025.07)<\/text>\n  <text x=\"478\" y=\"183\" font-size=\"10.7\" fill=\"#525B67\">\uc2e0\uccb4 \ud3ed\ud589 \uc678 \uc815\uc11c\u00b7\uacbd\uc81c\uc801 \ud559\ub300 \ud3ec\ud568 (FOI FA 25/08/01932)<\/text>\n  <rect x=\"466\" y=\"206\" width=\"376\" height=\"62\" rx=\"8\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1\"/>\n  <text x=\"478\" y=\"232\" font-size=\"15\" font-weight=\"800\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F4E5F\">\uc5f0 820\uac74 \uc2b9\uc778<\/text>\n  <text x=\"608\" y=\"230\" font-size=\"11.3\" font-weight=\"700\" fill=\"#1F242B\">\ucd5c\uadfc \uc5f0\uac04 \uc57d 1,080\uac74+ \ud2b9\ub840 \uccad\uad6c \uc811\uc218<\/text>\n  <text x=\"478\" y=\"253\" font-size=\"10.7\" fill=\"#525B67\">2023\u201324 \ud68c\uacc4\uc5f0\ub3c4 \uae30\uc900 \uc2e4\uc81c \ube44\uc790 \ubc1c\uae09 \uc644\ub8cc \uac74\uc218<\/text>\n  <rect x=\"466\" y=\"276\" width=\"376\" height=\"62\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"478\" y=\"302\" font-size=\"15\" font-weight=\"800\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1D6B48\">\uc138\uacc4 9\uc704<\/text>\n  <text x=\"608\" y=\"300\" font-size=\"11.3\" font-weight=\"700\" fill=\"#1F242B\">\ud55c\uad6d \uad6d\uc801\uc790 \ub204\uc801 \uc2b9\uc778 \uc0c1\uc704 9\uc704<\/text>\n  <text x=\"478\" y=\"323\" font-size=\"10.7\" fill=\"#525B67\">2024\u201325 \ud655\ub300\ub41c \uae30\uc220\uc774\ubbfc \ub3d9\ubc18\ubc30\uc6b0\uc790 DV \uc2b9\uc778\ub3c4 \uc0c1\uc704 5\uac1c\uad6d \ud3ec\ud568<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 1: \ud638\uc8fc \ud30c\ud2b8\ub108\ube44\uc790 \uc801\uccb4 \uae09\uc99d(116,917\uac74)\uacfc \uac00\uc815\ud3ed\ub825 \uc601\uc8fc\uad8c \ud2b9\ub840(Div 1.5) \uc2b9\uc778 \ud1b5\uacc4<\/figcaption><\/figure>\n<h2 id=\"\uc601\uc8fc\uad8c-\uc608\uc678division-15\uc758-3\ub300-\ubc95\uc801-\uad00\ubb38\uacfc-2024\ub144-7\uc6d4-309-\ube44\uc790-\uac1c\uc815\uc758\" class=\"doc-h2\">\uc601\uc8fc\uad8c \uc608\uc678(Division 1.5)\uc758 3\ub300 \ubc95\uc801 \uad00\ubb38\uacfc 2024\ub144 7\uc6d4 309 \ube44\uc790 \uac1c\uc815\uc758 \ud568\uc815<\/h2>\n<p class=\"doc-p\">\uc774\ubbfc\ubc95 \uc2dc\ud589\uaddc\uce59(Migration Regulations 1994) Division 1.5(regs 1.21\u20131.27)\uc640 \ube44\uc790\ubcc4 \uc2b9\uc778 \uc694\uac74\uc774 \uc815\ud55c \uc138 \uac00\uc9c0 \ubc95\uc801 \uad00\ubb38\uc744 \uc21c\uc11c\ub300\ub85c \ud1b5\uacfc\ud574\uc57c \ud574\uc694. \uc2a4\ud3f0\uc11c\uc640 \ud5e4\uc5b4\uc84c\ub2e4\uace0 \ud574\uc11c \uc790\ub3d9\uc73c\ub85c \uc601\uc8fc\uad8c\uc774 \ub098\uc624\ub294 \uac83\uc740 \uacb0\ucf54 \uc544\ub2c8\uac70\ub4e0\uc694.<\/p>\n<p class=\"doc-p\">\uccab \ubc88\uc9f8\uc774\uc790 \uc2e4\ubb34\uc5d0\uc11c \uac00\uc7a5 \ub9ce\uc740 \ud0c8\ub77d\uc790\ub97c \ub0b4\ub294 \uad00\ubb38\uc740 \ud30c\ud0c4 \uc774\uc804 \uad00\uacc4\uc758 \uc9c4\uc815\uc131(genuine relationship) \uc785\uc99d\uc774\uc5d0\uc694. \uc5f0\ubc29\ud56d\uc18c\ubc95\uc6d0 \uc804\uc6d0\uc7ac\ud310\ubd80\ub294 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCAFC/2022/51.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Minister for Immigration, Citizenship, Migrant Services and Multicultural Affairs v Gupta [2022] FCAFC 51<\/em><\/a> ([48], [50]) \ud310\uacb0\uc5d0\uc11c \uc774\ubbfc\ubc95 s 5F(\ubc95\ub960\ud63c) \ub610\ub294 s 5CB(\uc0ac\uc2e4\ud63c)\uac00 \uc694\uad6c\ud558\ub294 \uc9c4\uc815\ud55c \ubd80\ubd80 \uad00\uacc4\uac00 \uba3c\uc800 \uc778\uc815\ub418\uc5b4\uc57c \ud55c\ub2e4\uace0 \ubd24\uc5b4\uc694. \uad00\uacc4\uac00 \uc885\ub8cc(ceased)\ub418\uc5c8\ub2e4\uace0 \ub9d0\ud558\ub824\uba74 \ub17c\ub9ac\uc801\uc73c\ub85c \uadf8 \uc804\uc5d0 \ubd80\ubd80 \uad00\uacc4\uac00 \uc2e4\uc81c\ub85c \uc874\uc7ac\ud588\uc5b4\uc57c \ud558\uae30 \ub54c\ubb38\uc774\uc8e0. \uacfc\uac70\uc5d0 1\ub2e8\uacc4 \uc784\uc2dc\ube44\uc790(820 \ub610\ub294 309)\ub97c \uc2b9\uc778\ubc1b\uc558\ub2e4\ub294 \uc0ac\uc2e4\ub9cc\uc73c\ub85c\ub294 2\ub2e8\uacc4 \uc601\uc8fc\uad8c \uc2ec\uc0ac\uad00\uc744 \uae30\uc18d\ud558\uc9c0 \ubabb\ud55c\ub2e4\uace0\ub3c4 \ubabb \ubc15\uc558\uc5b4\uc694. \uc989 \uac00\uc815\ud3ed\ub825 \ud53c\ud574 \uc790\ub8cc\ub9cc \uc794\ub729 \ub0b4\uace0 \uc815\uc791 \ub3d9\uac70 \ub2f9\uc2dc\uc758 \uacf5\ub3d9 \uc7ac\uc815\u00b7\uc8fc\uac70\u00b7\uc0ac\ud68c\uc801 \uc720\ub300\u00b7\uc0c1\ud638 \ud5cc\uc2e0(reg 1.15A \ubc0f reg 1.09A 4\ub300 \uc9c0\ud45c) \uc99d\uac70\ub97c \uc18c\ud640\ud788 \ud558\uba74 \uc5b4\ub5bb\uac8c \ub420\uae4c\uc694? \uac00\uc815\ud3ed\ub825 \uc2ec\uc0ac\uc5d0 \ub4e4\uc5b4\uac00 \ubcf4\uc9c0\ub3c4 \ubabb\ud55c \ucc44 \uad00\uacc4 \uc9c4\uc815\uc131 \ubbf8\ub2ec\ub85c \uac70\uc808\ub420 \uc218 \uc788\uc5b4\uc694.<\/p>\n<p class=\"doc-p\">\ub450 \ubc88\uc9f8 \uad00\ubb38\uc740 \ud638\uc8fc \ub0b4 \uc2e0\uccad(820/801)\uacfc \uad6d\uc678 \uc2e0\uccad(309/100) \uc0ac\uc774\uc758 \uacb0\uc815\uc801\uc778 \uc785\uad6d \uc694\uac74 \ucc28\uc774\uc608\uc694. \ud638\uc8fc \uc548\uc5d0\uc11c \uc811\uc218\ud55c 820/801 \uc2e0\uccad\uc790(cl 820.221(3), cl 801.221(6))\ub294 \uad00\uacc4 \ud30c\ud0c4 \ud6c4 \uac00\uc815\ud3ed\ub825 \ud2b9\ub840\ub098 \uacf5\ub3d9 \uc790\ub140 \uc591\uc721\u00b7\uba74\uc811\uad50\uc12d \ud2b9\ub840\ub97c \uc801\uc6a9\ubc1b\uc744 \uc218 \uc788\uc5b4\uc694. \uc774\uc5d0 \ud574\ub2f9\ud558\uba74 2\ub144 \ub300\uae30 \uae30\uac04\uc744 \ub2e4 \ucc44\uc6b0\uc9c0 \uc54a\uc558\ub354\ub77c\ub3c4 \uace7\ubc14\ub85c \uc601\uc8fc\uad8c \uc870\uae30 \uc2b9\uc778(cl 801.221(7)(d))\uc744 \ubc1b\uc744 \uc218 \uc788\uc8e0. \ubc18\uba74 \uad6d\uc678 \uc2e0\uccad \ube44\uc790\uc778 309/100\uc740 2024\ub144 7\uc6d4 1\uc77c \uc2dc\ud589\ub41c \uac1c\uc815 \uaddc\uce59(F2024L00751)\uc744 \uc815\ud655\ud788 \uc77d\uc5b4\uc57c \ud574\uc694. \uac1c\uc815 \uc774\ud6c4 309 \ube44\uc790\ub97c \ud638\uc8fc \uc548\ud30e \uc5b4\ub514\uc11c\ub4e0 \uc2b9\uc778\ubc1b\uc744 \uc218 \uc788\uac8c(cl 309.412) \ubc14\ub00c\uc5c8\uc8e0. \ud558\uc9c0\ub9cc \uac00\uc815\ud3ed\ub825 \uc608\uc678 \uc870\ud56d(cl 309.221(3)(b)(i) \ubc0f cl 100.221(4))\ub9cc\ud07c\uc740 \ubc18\ub4dc\uc2dc \ube44\uc790 \uc2e0\uccad\uc11c\ub97c \uc811\uc218\ud55c \uc774\ud6c4 \uc2e0\uccad\uc790\uac00 \ud55c \ubc88\uc774\ub77c\ub3c4 \ud638\uc8fc\uc5d0 \uc785\uad6d\ud55c \uc774\ub825(entered Australia after making the application)\uc774 \uc788\uc5b4\uc57c\ub9cc \uc791\ub3d9\ud574\uc694. \uc2e0\uccad \ud6c4 \uc544\uc9c1 \ud638\uc8fc \ub545\uc744 \ubc1f\uae30 \uc804\uc5d0 \ud574\uc678\uc5d0\uc11c\ub9cc \uacaa\uc740 \uacb0\ubcc4\uc5d0\ub294 \uac00\uc815\ud3ed\ub825 \ud2b9\ub840\uac00 \uc5f4\ub9ac\uc9c0 \uc54a\uc544\uc694. \uacf5\ub3d9 \uc790\ub140 \ud2b9\ub840(cl 309.221(3)(b)(ii))\ub9cc \uc608\uc678\uc801\uc73c\ub85c \uc785\uad6d \uc694\uac74 \uc5c6\uc774 \uc801\uc6a9\ub418\uc8e0.<\/p>\n<p class=\"doc-p\">\uc138 \ubc88\uc9f8 \uad00\ubb38\uc740 \uc774\ubbfc\ubc95\uc0c1 \uc778\uc815\ub418\ub294 \uac00\uc815\ud3ed\ub825(reg 1.21)\uc758 \uc815\uc758\uc640 \ud569\ub9ac\uc801 \ub450\ub824\uc6c0\uc758 \uc5f0\uacb0\uace0\ub9ac\uc608\uc694. \uc774\ubbfc\ubc95\uc0c1 \ud3ed\ub825\uc740 \uba4d\uc774\ub098 \uc0c1\ucc98\uac00 \ub0a8\ub294 \ubb3c\ub9ac\uc801 \ud3ed\ub825\uc5d0 \ud55c\uc815\ub418\uc9c0 \uc54a\uc544\uc694. \uc5f0\ubc29\ud56d\uc18c\ubc95\uc6d0\uc774 \uc77c\ucc0d\uc774 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCAFC/2005/56.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Sok v Minister for Immigration &amp; Multicultural &amp; Indigenous Affairs [2005] FCAFC 56<\/em><\/a> ([24], [27], [37]) \ub2e4\uc218\uc758\uacac\uc744 \ud1b5\ud574 \uc815\uc11c\uc801 \ud559\ub300, \uad8c\ub825 \ub0a8\uc6a9, \uacbd\uc81c\uc801 \ubc15\ud0c8\uae4c\uc9c0 \ud3ed\ub113\uac8c \ud3ec\uad04\ud55c\ub2e4\uace0 \ud655\ub9bd\ud588\uac70\ub4e0\uc694. \uadf8\ub7ec\ub098 \uac00\uc7a5 \ucd5c\uadfc\uc778 2026\ub144 6\uc6d4 \uc120\uace0\ub41c \uc5f0\ubc29\ubc95\uc6d0 \ud310\uacb0 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2026/741.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Mijalkov v Minister for Immigration, Citizenship and Multicultural Affairs [2026] FCA 741<\/em><\/a> ([41]\u2013[42], [49], [67])\uc774 \uc544\uc8fc \ub0a0\uce74\ub85c\uc6b4 \uacbd\uace0\ub97c \ub358\uc84c\uc5b4\uc694. \uc124\ub839 \uc2a4\ud3f0\uc11c\uac00 \ubaa8\uc695\uc801\uc778 \ubb38\uc790\uba54\uc2dc\uc9c0\ub97c \ubcf4\ub0b4\uac70\ub098 \ube44\uc790\ub97c \ucde8\uc18c\ud558\uaca0\ub2e4\uace0 \uc704\ud611\ud55c \ud589\uc704 \uc790\uccb4\uac00 \uc778\uc815\ub3fc\ub3c4 \uadf8\uac83\ub9cc\uc73c\ub85c\ub294 \ubd80\uc871\ud574\uc694. \uadf8 \ud589\uc704 \ub54c\ubb38\uc5d0 \ud53c\ud574\uc790\uac00 \uc790\uc2e0\uc758 \uc548\uc804\uc774\ub098 \uc548\ub155\uc5d0 \ub300\ud574 \ud569\ub9ac\uc801\uc778 \ub450\ub824\uc6c0\uc774\ub098 \ubd88\uc548(reasonably fear for, or be reasonably apprehensive about, wellbeing or safety)\uc744 \ub290\uaf08\ub2e4\ub294 \uad6c\uccb4\uc801 \uc99d\uac70\uac00 \ube60\uc838 \uc788\uc73c\uba74 \ubc95\uc0c1 \uac00\uc815\ud3ed\ub825 \uccad\uad6c\ub85c \uc131\ub9bd\ud558\uc9c0 \uc54a\ub294\ub2e4\uace0 \ud310\uc2dc\ud588\uc8e0.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 314\" width=\"100%\" role=\"img\" aria-label=\"\ud30c\ud2b8\ub108\ube44\uc790 \uacb0\ubcc4 \uc2dc \uc601\uc8fc\uad8c \uad6c\uc81c(Div 1.5 \u00b7 LIN 23/026) \ubc0f \ud55c\u00b7\ud638 \uac00\uc871\ubc95 \ud1b5\ud569 \uc548\uc804\ub9dd\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"313\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"66\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"67\" x2=\"879\" y2=\"67\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"28\" y=\"27\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.06em\">\uc774\ubbfc\ubc95 \u00d7 \uac00\uc871\ubc95 \uad50\ucc28 \uc124\uacc4\ub3c4 \u00b7 \ube44\uc790 \ubc29\uc5b4\uc640 \uc7ac\uc0b0\u00b7\uc591\uc721 \uc808\ucc28\uc758 \uc815\ud569\uc131<\/text>\n  <text x=\"28\" y=\"50\" font-size=\"16.2\" font-weight=\"800\" fill=\"#1F242B\">\ud30c\ud2b8\ub108\ube44\uc790 \uacb0\ubcc4 \uc2dc \uc601\uc8fc\uad8c \uad6c\uc81c(Div 1.5 \u00b7 LIN 23/026) \ubc0f \ud55c\u00b7\ud638 \uac00\uc871\ubc95 \ud1b5\ud569 \uc548\uc804\ub9dd<\/text>\n  <rect x=\"22\" y=\"84\" width=\"266\" height=\"126\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"84\" width=\"266\" height=\"28\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"34\" y=\"102\" font-size=\"12\" font-weight=\"700\" fill=\"#FFFFFF\">\uad00\ubb38 1 \u00b7 \uc9c4\uc815\uc131 &amp; \uc785\uad6d \uc694\uac74<\/text>\n  <text x=\"34\" y=\"134\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">Gupta [2022] FCAFC 51:<\/text>\n  <text x=\"34\" y=\"155\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">\ud30c\ud0c4 \uc804 \uc9c4\uc815\ud55c \ud63c\uc778\u00b7\uc0ac\uc2e4\ud63c \ud544\uc218<\/text>\n  <text x=\"34\" y=\"176\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">309/100 DV\ub294 \uc2e0\uccad \ud6c4 \ud638\uc8fc \uc785\uad6d \ud544\uc218<\/text>\n  <line x1=\"291\" y1=\"147\" x2=\"301\" y2=\"147\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"305,147 299,143 299,151\" fill=\"#1F242B\"/>\n  <rect x=\"307\" y=\"84\" width=\"266\" height=\"126\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"307\" y=\"84\" width=\"266\" height=\"28\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"319\" y=\"102\" font-size=\"12\" font-weight=\"700\" fill=\"#FFFFFF\">\uad00\ubb38 2 \u00b7 \ud3ed\ub825 \uc815\uc758 &amp; \ub450\ub824\uc6c0<\/text>\n  <text x=\"319\" y=\"134\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">Sok [2005] \uc815\uc11c\u00b7\uacbd\uc81c \ud559\ub300 \ud3ec\ud568<\/text>\n  <text x=\"319\" y=\"155\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">Mijalkov [2026] FCA 741:<\/text>\n  <text x=\"319\" y=\"176\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">\uc548\uc804\u00b7\uc548\ub155\uc5d0 \ub300\ud55c \ud569\ub9ac\uc801 \ub450\ub824\uc6c0 \uc785\uc99d<\/text>\n  <line x1=\"576\" y1=\"147\" x2=\"586\" y2=\"147\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"590,147 584,143 584,151\" fill=\"#1F242B\"/>\n  <rect x=\"592\" y=\"84\" width=\"266\" height=\"126\" rx=\"10\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1.3\"/>\n  <rect x=\"592\" y=\"84\" width=\"266\" height=\"28\" rx=\"9\" fill=\"#1D6B48\"/>\n  <text x=\"604\" y=\"102\" font-size=\"12\" font-weight=\"700\" fill=\"#FFFFFF\">\uad00\ubb38 3 \u00b7 \uc0ac\ubc95 vs \ube44\uc0ac\ubc95 \uc99d\uac70<\/text>\n  <text x=\"604\" y=\"134\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">\ud655\uc815 \ubcf4\ud638\uba85\ub839(reg 1.23) \ub610\ub294<\/text>\n  <text x=\"604\" y=\"155\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">LIN 23/026 8\uac1c \uc9c1\uad70 \uc911 \u22652\uac1c \ubb38\uc11c<\/text>\n  <text x=\"604\" y=\"176\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">\ubbf8\ucda9\uc871 \uc2dc \ub3c5\ub9bd\uc804\ubb38\uac00(IE) \uc758\ubb34 \ud68c\ubd80<\/text>\n  <rect x=\"22\" y=\"226\" width=\"410\" height=\"72\" rx=\"10\" fill=\"#FEF8EC\" stroke=\"#9A6700\" stroke-width=\"1.2\"/>\n  <text x=\"36\" y=\"249\" font-size=\"12.3\" font-weight=\"800\" fill=\"#9A6700\">\ud55c\u00b7\ud638 \uad6d\uc81c \uc7ac\uc0b0\ubd84\ud560 \uad00\ud560 \u00b7 Clayton v Bant [2020] HCA 44<\/text>\n  <text x=\"36\" y=\"271\" font-size=\"11.1\" fill=\"#1F242B\">\ud55c\uad6d \uc774\ud63c \ud310\uacb0\ub9cc\uc73c\ub85c \ud638\uc8fc s 79 \uc7ac\uc0b0\u00b7\uc5f0\uae08 \ubd84\ud560\uad8c \ubd88\uc18c\uba78 \u00b7 \uac00\uc871\ubc95 \uc9c4\uc220\uc11c\uc640 \ub0b4\ubb34\ubd80<\/text>\n  <text x=\"36\" y=\"288\" font-size=\"11.1\" fill=\"#525B67\">\uc9c4\uc220\uc11c \ub0a0\uc9dc \uc77c\uce58 \ud544\uc218<\/text>\n  <rect x=\"448\" y=\"226\" width=\"410\" height=\"72\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.4\"/>\n  <text x=\"462\" y=\"249\" font-size=\"12.3\" font-weight=\"800\" fill=\"#7A1F2B\">\uc808\ub300 \uae08\uc9c0 \ub808\ub4dc\ub77c\uc778 \u00b7 \uc77c\ubc29\uc801 \uc790\ub140 \ud55c\uad6d \ucd9c\uad6d (ss 65Y / 65Z)<\/text>\n  <text x=\"462\" y=\"271\" font-size=\"11.1\" fill=\"#1F242B\">\ub3d9\uc758\u00b7\ubc95\uc6d0 \ud5c8\uac00 \uc5c6\ub294 \ucd9c\uad6d\uc740 \ucd5c\uace0 \uc9d5\uc5ed 3\ub144 + \uacf5\ud56d Watchlist + \ud5e4\uc774\uadf8<\/text>\n  <text x=\"462\" y=\"288\" font-size=\"11.1\" fill=\"#525B67\">\uac15\uc81c\ubc18\ud658 \ub300\uc0c1 (McDevitt [2026] \uc808\ucc28 \uc900\uc218)<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 2: \ud30c\ud2b8\ub108\ube44\uc790 \uacb0\ubcc4 \uc2dc \uc601\uc8fc\uad8c \uad6c\uc81c(Div 1.5 \u00b7 LIN 23/026) \ubc0f \ud55c\u00b7\ud638 \uac00\uc871\ubc95 \ud1b5\ud569 \uc548\uc804\ub9dd<\/figcaption><\/figure>\n<h2 id=\"\uc0ac\ubc95\uc801-\uc99d\uac70-\ub300-\ube44\uc0ac\ubc95\uc801-\uc99d\uac70lin-23026-\uc124\uacc4\uc640-\uc9c4\uc220\uc11c-\uc815\ud569\uc131\" class=\"doc-h2\">\uc0ac\ubc95\uc801 \uc99d\uac70 \ub300 \ube44\uc0ac\ubc95\uc801 \uc99d\uac70(LIN 23/026) \uc124\uacc4\uc640 \uc9c4\uc220\uc11c \uc815\ud569\uc131<\/h2>\n<p class=\"doc-p\">\uc2e4\uc81c \ub0b4\ubb34\ubd80\uc5d0 \uac00\uc815\ud3ed\ub825 \ud2b9\ub840\ub97c \uc785\uc99d\ud558\ub294 \uc0ac\ubc95\uc801 \uc99d\uac70(reg 1.23(2)\u2013(7)) \uacbd\ub85c\uc5d0\uc11c\ub294 \uc8fc \ubc95\uc6d0\uc774 \ubc1c\ubd80\ud55c \ud655\uc815 \uac00\uc815\ud3ed\ub825 \ubcf4\ud638\uba85\ub839(\ud038\uc990\ub79c\ub4dc\uc8fc Protection Order \ub4f1)\uc774\ub098 \uac00\uc871\ubc95\uc6d0 \uae08\uc9c0\uba85\ub839\uc744 \uc81c\ucd9c\ud574\uc694. \uc5ec\uae30\uc11c \ub193\uce58\uae30 \uc26c\uc6b4 \uc2e4\ubb34 \ud568\uc815\uc774 \ud558\ub098 \uc788\ub294\ub370 \uacbd\ucc30\uc774\ub098 \ubc95\uc6d0\uc774 \uc0c1\ub300\ubc29 \ucd9c\uc11d \uc5c6\uc774 \uae09\ud788 \ub0b4\uc5b4\uc900 \uc77c\ubc29\uc801 \uc784\uc2dc \ubcf4\ud638\uba85\ub839(ex parte interim order)\ub9cc\uc73c\ub85c\ub294 \ubd80\uc871\ud558\uace0 \ubc18\ub4dc\uc2dc \uc0c1\ub300\ubc29\uc5d0\uac8c \uc18c\uba85 \uae30\ud68c\uac00 \uc8fc\uc5b4\uc9c4 \ub4a4 \ub0b4\ub824\uc9c4 \ucd5c\uc885 \uba85\ub839\uc774\uc5b4\uc57c \ud574\uc694.<\/p>\n<p class=\"doc-p\">\ud655\uc815 \ubcf4\ud638\uba85\ub839\uc774 \uc5c6\ub2e4\uba74 \ube44\uc0ac\ubc95\uc801 \uc99d\uac70(reg 1.24, reg 1.25 \ubc95\uc815\uc9c4\uc220\uc11c \ubc0f \uc7a5\uad00 \uace0\uc2dc LIN 23/026) \ud328\ud0a4\uc9c0\ub97c \uafb8\ub824\uc57c \ud574\uc694. \uc2e0\uccad\uc790 \ubcf8\uc778\uc758 \uc0c1\uc138 \ubc95\uc815\uc9c4\uc220\uc11c\uc5d0 \ub354\ud574 \uc77c\ubc18\uc758(GP) \ub4f1 \uc758\uc0ac\u00b7\uacbd\ucc30\u00b7\uc544\ub3d9\ubcf5\uc9c0 \ub2f9\uad6d\u00b7\uac00\uc815\ud3ed\ub825 \uc804\ubb38 \uc9c0\uc6d0\uae30\uad00\u00b7\uc0ac\ud68c\ubcf5\uc9c0\uc0ac\u00b7\ub4f1\ub85d \uc2ec\ub9ac\ud559\uc790\u00b7\uac00\uc871\ubc95\uc6d0 \uc0c1\ub2f4\uad00\u00b7\ud559\uad50 \uad50\uc721\uc804\ubb38\uac00 \ub4f1 \ubc95\uc815 8\uac1c \uc804\ubb38 \uc9c1\uad70 \uac00\uc6b4\ub370 \uc11c\ub85c \ub2e4\ub978 \ucd5c\uc18c 2\uac1c \uce74\ud14c\uace0\ub9ac \uc774\uc0c1\uc758 \ubb38\uc11c\ub97c \ud615\uc2dd \uc694\uac74\uc5d0 \ub9de\ucdb0 \ucca8\ubd80\ud574\uc57c \ud574\uc694. \ub0b4\ubb34\ubd80 \uc2ec\uc0ac\uad00\uc774 \uc11c\ub958\ub9cc\uc73c\ub85c \ud655\uc2e0\ud558\uc9c0 \ubabb\ud558\uba74 \uc790\uc758\uc801\uc73c\ub85c \uac70\uc808\ud560 \uc218 \uc5c6\uace0 \ubc18\ub4dc\uc2dc \ub3c5\ub9bd\uc804\ubb38\uac00(Independent Expert) \uba74\ub2f4\uc73c\ub85c \uc0ac\uac74\uc744 \ub118\uaca8\uc57c \ud558\uba70 \uc5f0\ubc29\ub300\ubc95\uc6d0 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2008/50.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Sok v Minister for Immigration and Citizenship [2008] HCA 50<\/em><\/a> ([5], [40]) \ud310\uacb0\uc5d0 \ub530\ub77c 1\ucc28 \uac70\uc808 \ud6c4 \ud589\uc815\uc7ac\uc2ec\uae30\uad6c(ART) \ub2e8\uacc4\uc5d0\uc11c \uac00\uc815\ud3ed\ub825 \uc8fc\uc7a5\uc744 \ucc98\uc74c \uaebc\ub0b4\ub294 \uac83\ub3c4 \ud5c8\uc6a9\ub418\uace0 \uc7ac\uc2ec\uae30\uad00\uc740 \ub3c5\ub9bd\uc804\ubb38\uac00 \ud68c\ubd80 \uc804\uc5d0 \ubc18\ub4dc\uc2dc \uc2e0\uccad\uc778\uc758 \uad6c\uc220 \ubcc0\ub860 \uae30\ud68c\ub97c \ubcf4\uc7a5\ud574\uc57c \ud574\uc694. \ub2e4\ub9cc \uac00\uc871\ubc95\uc6d0\uc5d0 \ub0b4\ub294 \uc7ac\uc0b0\u00b7\uc591\uc721 \uc120\uc11c\uc9c4\uc220\uc11c(Affidavit)\uc640 \ub0b4\ubb34\ubd80 \uc9c4\uc220\uc11c\uc758 \ub3d9\uac70 \uc2dc\uc791\uc77c, \ubcc4\uac70\uc77c, \uc0dd\ud65c\ube44 \ubd84\ub2f4 \ub0b4\uc5ed\uc740 \uccab \ub2e8\ucd94\ubd80\ud130 \ud0c0\uc784\ub77c\uc778\uc744 \ud1b5\ud569 \uad00\ub9ac\ud558\ub294 \uac83\uc774 \uc0dd\uba85\uc774\uc5d0\uc694. \ub450 \uc11c\ub958\uac00 \uc11c\ub85c \uc5b4\uae0b\ub098\uba74 \uad00\uacc4 \uc9c4\uc815\uc131\uc774 \ubb34\ub108\uc9c0\uac70\ub098 \ud5c8\uc704 \uc9c4\uc220(PIC 4020) \uc2dc\ube44\uc5d0 \ud718\ub9d0\ub9b4 \uc218 \uc788\uc5b4\uc694.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">\uc785\uc99d \ubc0f \ubc29\uc5b4 \uacbd\ub85c<\/th><th style=\"text-align:left\">\uadfc\uac70 \ubc95\ub839 \u00b7 \uace0\uc2dc<\/th><th style=\"text-align:left\">\ud575\uc2ec \ubc95\uc801 \uc694\uac74 \ubc0f \uc2e4\ubb34\uc0c1 \ud568\uc815<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>\uc0ac\ubc95\uc801 \uc99d\uac70 \uacbd\ub85c (Judicial)<\/strong><\/td><td style=\"text-align:left\">Migration Regulations reg 1.23(2)\u2013(7)<\/td><td style=\"text-align:left\">\uc8fc \ubc95\uc6d0 \ud655\uc815 \uac00\uc815\ud3ed\ub825 \ubcf4\ud638\uba85\ub839(QLD Protection Order \ub4f1), \uac00\uc871\ubc95\uc6d0 \uae08\uc9c0\uba85\ub839, \ud615\uc0ac \uc720\uc8c4\ud310\uacb0 \u00b7 <strong>\uc8fc\uc758:<\/strong> \uc0c1\ub300\ubc29 \uc18c\uba85 \uae30\ud68c \uc5c6\uc774 \ubc1c\ubd80\ub41c \uc77c\ubc29\uc801 \uc784\uc2dc\uba85\ub839(ex parte interim order)\ub9cc\uc73c\ub85c\ub294 \ubd88\ucda9\ubd84<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ube44\uc0ac\ubc95\uc801 \uc99d\uac70 \uacbd\ub85c (Non-Judicial)<\/strong><\/td><td style=\"text-align:left\">regs 1.24\u20131.25 + \uc7a5\uad00 \uace0\uc2dc LIN 23/026<\/td><td style=\"text-align:left\">\uc2e0\uccad\uc778 \ubc95\uc815\uc9c4\uc220\uc11c(reg 1.25) + 8\uac1c \uc9c0\uc815 \uc804\ubb38 \uc9c1\uad70(\uc758\uc0ac\u00b7\uacbd\ucc30\u00b7\uc544\ub3d9\ubcf5\uc9c0\u00b7DV\uc9c0\uc6d0\uae30\uad00\u00b7\uc0ac\ud68c\ubcf5\uc9c0\uc0ac\u00b7\uc2ec\ub9ac\ud559\uc790\u00b7\uac00\uc871\uc0c1\ub2f4\uad00\u00b7\uad50\uc721\uc804\ubb38\uac00) \uc911 \uc11c\ub85c \ub2e4\ub978 \ucd5c\uc18c 2\uac1c \uce74\ud14c\uace0\ub9ac \ubb38\uc11c<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ub3c5\ub9bd\uc804\ubb38\uac00 \ud68c\ubd80 \ubc0f \uc7ac\uc2ec (IE &amp; ART)<\/strong><\/td><td style=\"text-align:left\">reg 1.23(10) \u00b7 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2008/50.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Sok v MIAC<\/em> [2008] HCA 50<\/a> ([5], [40])<\/td><td style=\"text-align:left\">\uc11c\ub958 \uc2ec\uc0ac \ubbf8\ud655\uc2e0 \uc2dc \ub3c5\ub9bd\uc804\ubb38\uac00(IE) \uc758\ubb34 \ud68c\ubd80(\uc758\uacac \uae30\uc18d\ub825 \ubcf4\uc720) \u00b7 1\ucc28 \uac70\uc808 \ud6c4 \uc7ac\uc2ec(ART)\uc5d0\uc11c \ucd5c\ucd08 \uc8fc\uc7a5 \uac00\ub2a5\ud558\uba70 IE \ud68c\ubd80 \uc804 \uad6c\uc220 \uc2ec\ub9ac \ubcf4\uc7a5 \ud544\uc218<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ud55c\u00b7\ud638 \uac00\uc871\ubc95 \uad50\ucc28 \ub808\ub4dc\ub77c\uc778<\/strong><\/td><td style=\"text-align:left\">\uac00\uc871\ubc95 s 79, ss 65Y\u201365ZAA \u00b7 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2020/44.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Clayton v Bant<\/em> [2020] HCA 44<\/a><\/td><td style=\"text-align:left\">\ud55c\uad6d \uc774\ud63c \ud310\uacb0\ub9cc\uc73c\ub85c \ud638\uc8fc s 79 \uc7ac\uc0b0\u00b7\uc5f0\uae08 \uccad\uad6c\uad8c \ubd88\uc18c\uba78 \u00b7 \ub3d9\uc758\u00b7\ubc95\uc6d0 \ud5c8\uac00 \uc5c6\ub294 \uc790\ub140 \ud55c\uad6d \ucd9c\uad6d\uc740 \ucd5c\uace0 \uc9d5\uc5ed 3\ub144 \ud615\uc0ac\ubc94\uc8c4 \ubc0f \ud5e4\uc774\uadf8 \uac15\uc81c\ubc18\ud658 \ub300\uc0c1<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"\ud55c\uad6d-\uc774\ud63c-\ud310\uacb0\uc758-\ud6a8\ub825clayton-v-bant\uacfc-\uc544\uc774-\ub370\ub9ac\uace0-\uadc0\uad6d-\uc2dc-3\ub144-\uc9d5\uc5ed-\ub9ac\uc2a4\" class=\"doc-h2\">\ud55c\uad6d \uc774\ud63c \ud310\uacb0\uc758 \ud6a8\ub825(Clayton v Bant)\uacfc \uc544\uc774 \ub370\ub9ac\uace0 \uadc0\uad6d \uc2dc 3\ub144 \uc9d5\uc5ed \ub9ac\uc2a4\ud06c<\/h2>\n<p class=\"doc-p\">\uacb0\ubcc4 \ud6c4 \ud55c\uad6d\uacfc \ud638\uc8fc \uc591\ucabd\uc5d0 \uc7ac\uc0b0\uacfc \uac00\uc871\uc774 \uc5bd\ud600 \uc788\ub2e4\uba74 \uaf2d \uc544\uc154\uc57c \ud560 \uce58\uba85\uc801\uc778 \uacbd\uacc4\uc120\uc774 \uc788\uc5b4\uc694. \ubc14\ub85c \ud55c\uad6d \ubc95\uc6d0\uc5d0\uc11c \uba3c\uc800 \ud611\uc758\uc774\ud63c\uc774\ub098 \uc7ac\ud310\uc0c1 \uc774\ud63c\uc744 \ub05d\ub0b4\uba74 \ud638\uc8fc\uc5d0 \uc788\ub294 \uc8fc\ud0dd\uc774\ub098 \ud1f4\uc9c1\uc5f0\uae08\uc758 \ubd84\ud560 \uccad\uad6c\uad8c\ub3c4 \uc0ac\ub77c\uc9c0\ub290\ub0d0\ub294 \ubb38\uc81c\uc608\uc694. \ud638\uc8fc \uc5f0\ubc29\ub300\ubc95\uc6d0\uc740 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2020/44.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Clayton v Bant [2020] HCA 44<\/em><\/a> ([26], [32]) \ud310\uacb0\uc5d0\uc11c \uc804\uc6d0\uc77c\uce58\ub85c \uacb0\ub860\uc744 \ub0b4\ub838\uc8e0. \uc678\uad6d \ubc95\uc6d0\uc758 \uc774\ud63c \ud310\uacb0\ub9cc\uc73c\ub85c\ub294 \ud638\uc8fc \uac00\uc871\ubc95 s 79(\uc7ac\uc0b0\ubd84\ud560) \ubc0f s 74(\ubc30\uc6b0\uc790 \ubd80\uc591\ub8cc)\uc5d0 \uae30\ud55c \ub3c5\uc790\uc801\uc778 \ubc95\uc815 \uccad\uad6c\uad8c\uc774 \ud761\uc218\ub418\uac70\ub098 \uc18c\uba78(res judicata)\ud558\uc9c0 \uc54a\ub294\ub2e4\uace0 \uc120\uc5b8\ud588\uc5b4\uc694. \uc678\uad6d \uc808\ucc28\uc5d0\uc11c \ud638\uc8fc s 79\uc5d0 \uc0c1\uc751\ud558\ub294 \uc2e4\uc9c8\uc801\uc73c\ub85c \ub3d9\uc77c\ud55c \uc7ac\uc0b0\uad8c \ubcc0\uacbd \uccad\uad6c\uac00 \ub2e4\ub904\uc84c\ub294\uc9c0\uac00 \uad00\uac74\uc774\uc5d0\uc694. \uadf8 \uccad\uad6c\uac00 \ub2e4\ub904\uc84c\uac70\ub098 \uc774\ub97c \ud589\uc0ac\ud558\uc9c0 \uc54a\uc740 \uac83\uc774 \uadf9\ud788 \ubd88\ud569\ub9ac\ud588\ub2e4\ub294 \uc810\uae4c\uc9c0 \uc0c1\ub300\ubc29\uc774 \uc785\uc99d\ud558\uc9c0 \ubabb\ud558\ub294 \ud55c \ud638\uc8fc \ubc95\uc6d0\uc758 \uc7ac\uc0b0\ubd84\ud560 \uad00\ud560\uc740 \uc0b4\uc544 \uc788\uc8e0. \ub2e4\ub9cc \uc591\uad6d \ubd80\ub3d9\uc0b0\uacfc \ud638\uc8fc \uc5f0\uae08\uc744 \uc5b4\ub5bb\uac8c \ub9de\uad50\ud658\u00b7\uc815\uc0b0\ud560\uc9c0\ub294 \uc9d1\ud589 \uac00\ub2a5\ud55c \uad6c\uc870\ub85c \uc9dc\ub294 \uc804\ubb38\uc131\uc774 \ud544\uc694\ud574\uc694. \ubc18\ub300\ub85c \ud638\uc8fc \ubc95\uc6d0\uc758 \uba85\ub839\ub9cc \ub4e4\uace0 \ud55c\uad6d \ub4f1\uae30\uc18c\ub098 \uc740\ud589\uc73c\ub85c \uac04\ub2e4\uace0 \ud574\uc11c \uace7\ubc14\ub85c \uc9d1\ud589\uc774 \ub418\uc9c0\ub294 \uc54a\uac70\ub4e0\uc694.<\/p>\n<p class=\"doc-p\">\uc544\uc774 \ubb38\uc81c\uc5d0\uc11c\ub3c4 \uc808\ub300\ub85c \ud574\uc11c\ub294 \uc548 \ub418\ub294 \ud589\ub3d9\uc774 \ubcc4\uac70 \uc9c1\ud6c4 \uac10\uc815\uc801\uc73c\ub85c \uc544\uc774\ub97c \ub370\ub9ac\uace0 \ud55c\uad6d\ud589 \ube44\ud589\uae30\uc5d0 \uc624\ub974\ub294 \uc77c\uc774\uc5d0\uc694. \ud638\uc8fc\uc5d0\uc11c \uc591\uc721 \uc0ac\uac74\uc774\ub098 \uc591\uc721 \uba85\ub839\uc774 \uac78\ub824 \uc788\uc744 \ub54c \ub2e4\ub978 \ubd80\ubaa8\uc758 \uc11c\uba74 \ub3d9\uc758\ub098 \ubc95\uc6d0 \uba85\ub839 \uc5c6\uc774 \uc544\ub3d9\uc744 \ud638\uc8fc \ubc16\uc73c\ub85c \ub370\ub9ac\uace0 \ub098\uac00\uac70\ub098 \uc5b5\ub958\ud558\ub294 \uacbd\uc6b0\uc8e0. \uc774\ub54c\ub294 \ud638\uc8fc \uac00\uc871\ubc95 ss 65Y \ubc0f 65Z(\uc808\ucc28 \uacc4\uc18d \uc911\uc5d0\ub294 ss 65YA\u00b765ZAA) \uc704\ubc18\uc73c\ub85c \ucd5c\uace0 \uc9d5\uc5ed 3\ub144\uc758 \uc5f0\ubc29 \ud615\uc0ac\ubc94\uc8c4\uac00 \uc131\ub9bd\ud574\uc694. \uc989\uc2dc \ud638\uc8fc\uc5f0\ubc29\uacbd\ucc30(AFP) \uacf5\ud56d \ucd9c\uad6d\uae08\uc9c0 \uba85\ub2e8(Family Law Watchlist)\uc5d0 \uc790\ub140 \uc774\ub984\uc774 \uc624\ub974\uac70\ub4e0\uc694. \uc124\ub839 \ucd9c\uad6d\ud588\ub354\ub77c\ub3c4 \ud55c\uad6d\uacfc \ud638\uc8fc\uac00 \ubaa8\ub450 \uac00\uc785\ud55c \ud5e4\uc774\uadf8 \uad6d\uc81c\uc544\ub3d9\ud0c8\ucde8\ud611\uc57d\uc5d0 \ub530\ub77c \uac15\uc81c \ubc18\ud658 \uc18c\uc1a1\uc5d0 \uc9c1\uba74\ud574 \ud5a5\ud6c4 \ubcf8\uc548 \uc591\uc721\uad8c \ud310\ub2e8\uc5d0\uc11c \uce58\uba85\uc801\uc778 \ubd88\uc774\uc775\uc744 \uc785\uac8c \ub3fc\uc694. \uc544\uc774\uc640 \ud568\uaed8 \uc801\ubc95\ud558\uac8c \ubaa8\uad6d\uc774\ub098 \ud574\uc678\ub85c \uc774\uc8fc\ud558\ub824\uba74 \ud638\uc8fc \ubc95\uc6d0\uc758 \uc815\uc2dd \uad6d\uc81c \uc774\uc8fc \ud5c8\uac00 \ubc0f \ucd9c\uad6d\uae08\uc9c0 \ud574\uc81c \uba85\ub839\ubd80\ud130 \ubc1b\uc544\uc57c \uc548\uc804\ud558\uc8e0. <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2026/11.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>McDevitt &amp; Duchamps [2026] FedCFamC1A 11<\/em><\/a> ([73], [76]) \ud56d\uc18c\ubd80 \ud310\uacb0\ub3c4 \uac19\uc740 \uc6d0\uce59\uc744 \ud655\uc778\ud588\uc5b4\uc694. \uc0c1\ub300 \ubd80\ubaa8\uc758 \uac15\uc555\uc801 \ud3ed\ub825\uc73c\ub85c\ubd80\ud130 \uc544\ub3d9\uc758 \uc7a5\ub798 \uc548\uc804(s 60CC(2)(a))\uc744 \uc9c0\ud0a4\ub294 \ud604\uc2e4\uc801 \ub300\uc548\uacfc \ud654\uc0c1\u00b7\ubc29\ud559 \uba74\uc811\uad50\uc12d \uacc4\ud68d\uc774 \uc815\uad50\ud558\uac8c \uac16\ucdb0\uc84c\ub294\uc9c0\ub97c \ub530\uc838 \ubcf4\uac70\ub4e0\uc694.<\/p>\n<h2 id=\"\ube44\uc790-\uc548\uc804\ub9dd\uacfc-\uac00\uc871\ubc95-\uad8c\ub9ac\ub97c-\ud55c-\ud638\ud761\uc73c\ub85c-\uc9c0\ud0a4\ub294-\ubc29\ubc95\" class=\"doc-h2\">\ube44\uc790 \uc548\uc804\ub9dd\uacfc \uac00\uc871\ubc95 \uad8c\ub9ac\ub97c \ud55c \ud638\ud761\uc73c\ub85c \uc9c0\ud0a4\ub294 \ubc29\ubc95<\/h2>\n<p class=\"doc-p\">\ud30c\ud2b8\ub108\ube44\uc790 \ud30c\ud0c4 \uc0ac\uac74\uc740 \ub300\ud45c\uc801\uc778 \ubc95\ub960 \uad50\ucc28 \uc601\uc5ed\uc774\uc5d0\uc694. \uc774\ubbfc\ubc95\ub9cc \uc544\ub294 \ub300\ub9ac\uc778\uc774 \ub2e4\ub8e8\uba74 \uac00\uc871\ubc95 \uc7ac\uc0b0\u00b7\uc591\uc721 \uc2dc\ud55c\uc744 \ub193\uce58\uace4 \ud558\uc8e0. \ubc18\ub300\ub85c \uac00\uc871\ubc95\ub9cc \ub2e4\ub8e8\ub294 \ubcc0\ud638\uc0ac\uac00 \uc811\uadfc\ud558\uba74 \ubb34\uc2ec\ucf54 \uc4f4 \uc9c4\uc220\uc11c \ud55c \uc904 \ub54c\ubb38\uc5d0 \uc601\uc8fc\uad8c \uc9c4\uc815\uc131 \uc694\uac74(Gupta)\uc774 \ud754\ub4e4\ub824\uc694. \uc9c0\uae08 \uc2a4\ud3f0\uc11c\uc758 \ube44\uc790 \ud611\ubc15\uc774\ub098 \ubcc4\uac70 \ubb38\uc81c\ub85c \ub9c9\ub9c9\ud558\uc2dc\ub2e4\uba74 \ud63c\uc790 \ub059\ub059 \uc553\uac70\ub098 \uc123\ubd88\ub9ac \uc9d0\uc744 \uc2f8\uc11c \ucd9c\uad6d\ud558\uc9c0 \ub9c8\uc2dc\uace0 \uba3c\uc800 \uc548\uc804\ud55c \uac70\ucc98\uc640 \uae08\uc735\u00b7\uad00\uacc4 \uc99d\uac70\ubd80\ud130 \ud655\ubcf4\ud558\uc138\uc694. \uadf8\ub7f0 \ub2e4\uc74c \ubc15\uc564\ucf54 \uac00\uc871\ubc95\u00b7\ube44\uc790 \ud1b5\ud569 \uc628\ub77c\uc778 \uc9c8\ubb38\uc9c0(<a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\uac00\uc871\ubc95 \ubc0f \ud30c\ud2b8\ub108\ube44\uc790 \uc0ac\uc548 \uc811\uc218\ud558\uae30<\/a>) \ub610\ub294 \uacf5\uc2dd \uc548\ub0b4 \ud398\uc774\uc9c0(<a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ubc15\uc564\ucf54 \uacf5\uc2dd \ub9c1\ud06c \ud5c8\ube0c<\/a>)\ub97c \uc774\uc6a9\ud574 \ubcf4\uc138\uc694. \ud604\uc7ac \ube44\uc790 \ub2e8\uacc4(820/801 \ub610\ub294 309/100)\uc640 \uc785\uad6d\u00b7\ubcc4\uac70 \uc77c\uc790 \ubc0f \uc790\ub140\u00b7\uc591\uad6d \uc790\uc0b0 \uc720\ubb34\ub97c \ub0a8\uaca8 \uc8fc\uc138\uc694. \uc774\ubbfc\ubc95 \uacf5\uc778 \uc804\ubb38\ubcc0\ud638\uc0ac\uc758 \uc2dc\uac01\uacfc \uac00\uc871\ubc95 \uc804\ub7b5\uc744 \uacb0\ud569\ud574 \uac00\uc7a5 \uc548\uc804\ud55c \ucd9c\uad6c\ub97c \uc124\uacc4\ud574 \ub4dc\ub9b4\uac8c\uc694.<\/p>\n\n          <div class=\"col-sources-box\">\n            \uadfc\uac70 \ubc95\ub839 \ubc0f \ud1b5\uacc4: Migration Regulations 1994 (Cth) Compilation No. 289 (Div 1.5 regs 1.21\u20131.27, cl 820.221, cl 801.221, cl 309.221, cl 100.221) \u00b7 Instrument LIN 23/026 \u00b7 Home Affairs 2025\u201326 Migration Program Report \u00b7 DHA FOI FA 25/08/01932 &amp; FA 21/08/01425 \u00b7 Family Law Act 1975 ss 65Y\u201365ZAA, s 79.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#E6C98C;\">\ud63c\uc790 \uc9c4\ud589\uc744 \uba48\ucd94\uace0 \ubcc0\ud638\uc0ac\ub97c \ucc3e\uc544\uc57c \ud558\ub294 \uc21c\uac04 \u00b7 \uac00\uc871\ubc95<\/span>\n            <h3 class=\"col-cta-title\">\ud569\uc758\ub41c \uc870\uac74\uc744 \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950)\uc73c\ub85c \ud655\uc815\ud558\uace0 \uc2f6\uac70\ub098 \uc5f0\ub77d\uc744 \ud53c\ud558\ub294 \ubc30\uc6b0\uc790\uc640 \uc7ac\uc0b0\ubd84\ud560 \ud611\uc0c1\uc744 \uc2dc\uc791\ud574\uc57c \ud569\ub2c8\uae4c?<\/h3>\n            <p class=\"col-cta-desc\">\ub2e8\uc21c \uc628\ub77c\uc778 \uc774\ud63c \uc2e0\uccad\uc740 \ud3ec\ud138 \uc124\uba85\uc11c\ub97c \ubcf4\uace0 \uc9c1\uc811 \uc9c4\ud589\ud558\uba74 \uc218\ucc9c \ub2ec\ub7ec\ub97c \uc544\ub07c\uc2e4 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \ubc18\uba74 \ubc95\uc801 \ud6a8\ub825\uc774 \uc788\ub294 \uc7ac\uc0b0\u00b7\uc591\uc721 \ud569\uc758\uba85\ub839(Consent Orders) \uc791\uc131\uc774\ub098 \uc5f0\ub77d\uc744 \ud53c\ud558\ub294 \ubc30\uc6b0\uc790\uc758 \uc7ac\uc0b0 \uacf5\uac1c \uc694\uad6c\u00b7\ud55c\uad6d\uacfc \ud638\uc8fc\uc5d0 \uac78\uce5c \uc7ac\uc0b0\ubd84\ud560\uc774 \ud544\uc694\ud560 \ub54c\ub294 3\ubd84 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \ud575\uc2ec \ub0a0\uc9dc\uc640 \uc7ac\uc0b0 \ub0b4\uc5ed\uc744 \ub0a8\uaca8 \uc8fc\uc2ed\uc2dc\uc624.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">\uac00\uc871\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../files/KO/PDF/03_Family_Law_Divorce_Property_Parenting_and_Settlement_Manual_2026_KO.pdf\" download class=\"col-btn-ghost\">03 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc694\uc57d PDF \ubc1b\uae30<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">\ubc15\uc564\ucf54 \uacf5\uc2dd \uc0c1\ub2f4 \ub9c1\ud06c \ud5c8\ube0c<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">\ubc95\ub960 \uc548\ub0b4: \uc774 \uce7c\ub7fc\uc740 \ud638\uc8fc \uc5f0\ubc29 \uac00\uc871\ubc95(Family Law Act 1975)\uacfc \uacf5\uc2dd \ud1b5\uacc4\u00b7\ud310\ub840\ub97c \ubc14\ud0d5\uc73c\ub85c \uc54c\uae30 \uc27d\uac8c \uc815\ub9ac\ud55c \uc77c\ubc18 \ubc95\ub960 \uc815\ubcf4\uc785\ub2c8\ub2e4. \uac1c\ubcc4 \uc0ac\uac74\uc5d0 \ub300\ud55c \ubc95\ub960 \uc790\ubb38\uc774\ub098 \uc218\uc784 \uacc4\uc57d \uc131\ub9bd\uc744 \ub73b\ud558\uc9c0 \uc54a\uc73c\ubbc0\ub85c \uc774\ud63c \ud6c4 12\uac1c\uc6d4\u00b7\uc0ac\uc2e4\ud63c \uacb0\ubcc4 \ud6c4 2\ub144 \ub9c8\uac10 \uae30\ud55c\uc774\ub098 \ube44\uc790 \uae30\ud55c\uc774 \uc784\ubc15\ud588\ub2e4\uba74 \uc9c0\uccb4 \uc5c6\uc774 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uac80\ud1a0\ub97c \ubc1b\uc544 \ubcf4\uc2dc\uae30 \ubc14\ub78d\ub2c8\ub2e4.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">\ud568\uaed8 \uc77d\uc73c\uba74 \uc88b\uc740 \uac00\uc871\ubc95 \ud310\ub840 \uce7c\ub7fc<\/h3>\n        <a href=\"../../?lang=ko&amp;tab=family\" class=\"col-back-link num\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../property-reforms-2026/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">2025\u20132026 \uac1c\uc815 \ud574\uc124 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 01<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \uac00\uc871\ubc95 \uc7ac\uc0b0\ubd84\ud560 \uac1c\ud3b8 \ud575\uc2ec: \uacbd\uc81c\uc801 \ud559\ub300 \ubc18\uc601, \ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ud574\uc678\uc790\uc0b0, \ubc18\ub824\ub3d9\ubb3c \ubc0f \uc81c\ucc99\uae30\uac04 \ucd1d\uc815\ub9ac<\/h4><p class=\"col-sib-desc\">\uc774\ubbf8 \uc18c\ube44\ub41c \uc7ac\uc0b0 \ud569\uc0b0(Add-backs) \ud3d0\uc9c0, \uacbd\uc81c\uc801 \ud559\ub300 \ubc18\uc601, \ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ud55c\uad6d \uc790\uc0b0 \uacf5\uac1c \uc758\ubb34, \ubc18\ub824\ub3d9\ubb3c \uadc0\uc18d \uae30\uc900, 12\uac1c\uc6d4\u00b72\ub144 \uc7ac\uc0b0\ubd84\ud560 \uc81c\ucc99\uae30\uac04\uc744 \uccb4\uacc4\uc801\uc73c\ub85c \uc815\ub9ac\ud588\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../divorce-parenting-reality-guide/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc2e4\uc804 \uac00\uc774\ub4dc \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 02<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \uc774\ud63c \uc808\ucc28\uc640 \uc7ac\uc0b0\ubd84\ud560\u00b7\uc591\uc721\uad8c, \ubcc0\ud638\uc0ac \uc120\uc784 \uc804 \ubc18\ub4dc\uc2dc \uc54c\uc544\uc57c \ud560 \ud604\uc2e4 \uae30\uc900<\/h4><p class=\"col-sib-desc\">\uc678\ub3c4 \uc704\uc790\ub8cc\uc5d0 \ub300\ud55c \uc624\ud574\uc640 \uac04\uc18c\ud654\ub41c \uc11c\uba74 \uc774\ud63c \uc808\ucc28 \ubc0f \ubc18\ubc18 \uacf5\ub3d9\uc591\uc721 \ucd94\uc815 \ud3d0\uc9c0 \ubc95\ub9ac\ub97c \uc9da\uace0 \uc18c\uc561 \uc7ac\uc0b0 \uc0ac\uac74(\u2264$550k)\uacfc \uc815\uc561 \ud569\uc758\uba85\ub839($4,950)\uc758 \uc190\uc775 \uae30\uc900\uc744 \ube44\uad50\ud569\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../parental-advances-loans-gifts-divorce/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubd80\ubaa8 \uc9c0\uc6d0\uae08\u00b7\ucc28\uc6a9\uc99d \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 14<\/span><h4 class=\"col-sib-title\">\ud55c\uad6d \ubd80\ubaa8\ub2d8\uc774 \ubcf4\ud0dc\uc900 \uc9d1\uac12 3\uc5b5, \ud638\uc8fc \uc774\ud63c\ud560 \ub54c \ub3cc\ub824\uc904 \ub300\uc5ec\uae08\uc77c\uae4c \ub098\ub20c \uc99d\uc5ec\uc77c\uae4c<\/h4><p class=\"col-sib-desc\">\ud55c\uad6d\u00b7\ud638\uc8fc \ubd80\ubaa8\ub2d8\uc774 \uc9d1 \uc0b4 \ub54c \ubcf4\ud0dc\uc8fc\uc2e0 \ub3c8\uc774 \uac1a\uc544\uc57c \ud560 \ube5a\uc73c\ub85c \uba3c\uc800 \ube60\uc9c0\ub294 \uacbd\uc6b0\uc640 \ubd80\ubd80 \uc7ac\uc0b0\uc5d0 \uc11e\uc774\ub294 \ucc28\uc774\ub97c \uc2e4\uc81c \ud310\ub840\ub85c \uc54c\uae30 \uc27d\uac8c \ube44\uad50\ud588\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../family-trusts-companies-valuation-divorce/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uac00\uc871\uc2e0\ud0c1\u00b7\ubc95\uc778\uac10\uc815 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 15<\/span><h4 class=\"col-sib-title\">\uc7ac\uc0b0\uc744 \uac00\uc871\uc2e0\ud0c1(Family Trust)\uc774\ub098 Pty Ltd \ubc95\uc778\uc5d0 \ub123\uc5b4\ub450\uba74 \uc774\ud63c \uc7ac\uc0b0\ubd84\ud560\uc5d0\uc11c \uc548\uc804\ud560\uae4c<\/h4><p class=\"col-sib-desc\">\ub204\uac00 \uc2e0\ud0c1\uc758 \uc2e4\uc81c \uacb0\uc815\uad8c(Appointor)\uc744 \uc950\uace0 \uc788\ub294\uc9c0 \ub530\uc9c0\ub294 \uae30\uc900\ubd80\ud130 \uacf5\ub3d9 \uac10\uc815\uc778 \uc808\ucc28\uc640 \ubc95\uc778 \ub3c8\uc744 \uc62e\uae38 \ub54c \uc138\uae08\uc744 \uc544\ub07c\ub294 \ubc29\ubc95\uae4c\uc9c0 \uc9da\uc5b4 \ub4dc\ub9bd\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../post-separation-inheritances-windfalls-delay/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubcc4\uac70 \ud6c4 \uc0c1\uc18d\u00b7\uc9c0\uccb4\uc704\ud5d8 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 16<\/span><h4 class=\"col-sib-title\">\ubcc4\uac70\ud55c \uc9c0 4\ub144 \uc9c0\ub0ac\uc73c\ub2c8 \uc0c8\ub85c \ubc1b\uc740 \uc0c1\uc18d\uc774\ub098 \uc9d1\uac12 \uc0c1\uc2b9\ubd84\uc740 \ub0b4 \uac83\uc774\uaca0\uc9c0: \ud569\uc758\uba85\ub839(Consent Orders)\uc744 \ubbf8\ub8ec \ub300\uac00<\/h4><p class=\"col-sib-desc\">\ubcc4\uac70 \ub4a4 \uc11c\ub958 \uc815\ub9ac\ub97c \ud3c9\uade0 4\ub144\uc529 \ubbf8\ub8e8\ub2e4 \ub098\uc911\uc5d0 \ubc1b\uc740 \uc0c1\uc18d\uae08\uc774\ub098 \uc624\ub978 \uc9d1\uac12\uae4c\uc9c0 \ub098\ub204\uac8c \ub418\ub294 \uc774\uc720\uc640 $4,950 \ubc95\uc6d0 \ud569\uc758\uba85\ub839\uc73c\ub85c \uc548\uc804\ud558\uac8c \ub9c8\ubb34\ub9ac\ud558\ub294 \ubc95\uc744 \ub2f4\uc558\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../prenups-bfa-vs-consent-orders/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ud63c\uc804\uacc4\uc57d BFA \ub300 \ud569\uc758\uba85\ub839 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 17<\/span><h4 class=\"col-sib-title\">\ubcc0\ud638\uc0ac \uc99d\uba85\uc11c\uae4c\uc9c0 \ubd99\uc778 \ud63c\uc804\uacc4\uc57d\uc11c(BFA)\uac00 \ub300\ubc95\uc6d0\uc5d0\uc11c \uae68\uc9c4 \uc774\uc720: \uc7ac\uc0b0\ubd84\ud560 \ud569\uc758\uc11c(BFA) \ub300 \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950) \uc120\ud0dd \uae30\uc900<\/h4><p class=\"col-sib-desc\">\uacb0\ud63c\u00b7\ub3d9\uac70 \uc804\uc5d0 \uc7ac\uc0b0\uc744 \uc548\uc804\ud558\uac8c \uc9c0\ud0a4\ub294 BFA \uc791\uc131 \uc694\ub839\uacfc \uc774\ubbf8 \ud5e4\uc5b4\uc9c4 \ubd80\ubd80\uac00 \uc591\ucabd \ubcc0\ud638\uc0ac\ube44\uac00 \ub4dc\ub294 BFA \ub300\uc2e0 \uc815\uc561 \ud569\uc758\uba85\ub839\uc744 \uace8\ub77c\uc57c \ud558\ub294 \uc774\uc720\ub97c \ube44\uad50\ud588\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../de-facto-threshold-disputes-out-of-time-s44/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc0ac\uc2e4\ud63c \uacbd\uacc4\u00b7\uae30\ud55c\ub3c4\uacfc \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 18<\/span><h4 class=\"col-sib-title\">\ub3d9\uac70\ub294 \uc548 \ud558\uace0 \uc0dd\ud65c\ube44\ub9cc \uc92c\ub294\ub370 \uc0ac\uc2e4\ud63c(De Facto) \uc18c\uc1a1\uc774 \ub4e4\uc5b4\uc654\ub2e4\uba74: \uc0ac\uc2e4\ud63c \uc778\uc815 \uae30\uc900(s 4AA)\uacfc \ub9c8\uac10 \uae30\ud55c \uc608\uc678 \uc2e0\uccad(s 44)<\/h4><p class=\"col-sib-desc\">\ub2e8\uc21c \uc5f0\uc778 \uad00\uacc4\uc640 \ubc95\uc801 \uc0ac\uc2e4\ud63c\uc744 \uac00\ub974\ub294 &#x27;\ud558\ub098\uc758 \uc0b6(Coupledom)&#x27; \uae30\uc900\ubd80\ud130 \uae30\ud63c\uc790\uc640\uc758 \uc774\uc911 \uc0ac\uc2e4\ud63c, \ub9c8\uac10 \uae30\ud55c\uc774 \uc9c0\ub09c \uc0ac\uac74\uc758 \ub300\uc751\ubc95\uae4c\uc9c0 \uc27d\uac8c \uc815\ub9ac\ud588\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}, "en": {"doc_title": "Partner Visa Breakdown, Division 1.5 Family Violence PR & Cross-Border Property Traps \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">All Guides Hub<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=en\">Visa Solution Guide<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=en\">Employment Navigator<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=en\">DIY & Cost-Smart Guide<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/?lang=en\" target=\"_blank\" rel=\"noopener\">Consult Park & Co \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=en&amp;tab=family\" class=\"col-back-btn\">\u2190 Back to Family Law Self-Help Hub<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">Park &amp; Co Lawyers \u00b7 Family Law Deep-Dive Column<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn\">KO<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn active\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">Consult Park &amp; Co \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">FAMILY &amp; VISA INTERSECTION \u00b7 FAMILY 03<\/span>\n          <span class=\"col-verified-pill num\">QLS Accredited Specialist Verified (Nov 2026)<\/span>\n          <span class=\"col-time-pill num\">9 min read<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">Partner Visa Breakdown, Division 1.5 Family Violence PR &amp; Cross-Border Property Traps<\/h1>\n        <p class=\"col-subtitle\">Navigating Subclass 820/801 &amp; 309/100 cessation rules, LIN 23/026 evidence, Gupta &amp; Mijalkov, Clayton v Bant overseas divorces, and ss 65Y/65Z child removal offences<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">Chang Min Park<\/div>\n            <div class=\"col-author-role\">Legal Practitioner Director, Park &amp; Co Lawyers \u00b7 Accredited Specialist in Immigration Law (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col03_partner_visa_crossborder_hero.jpg\" alt=\"Partner Visa Breakdown, Division 1.5 Family Violence PR &amp; Cross-Border Property Traps\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">When temporary Partner Visa breakdown intersects with Australian and overseas property or parenting disputes, migration submissions and Family Court affidavits must follow one verified chronology.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">116,917 Backlog<\/div><div class=\"col-stat-lbl\">Partner Visa pipeline on hand at 30 June 2026 (+100% in 3 years \u00b7 DHA Report)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">7,392 PR Grants<\/div><div class=\"col-stat-lbl\">Cumulative Partner Visa grants under FV rules (South Korea ranked #9 \u00b7 DHA FOI)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">3 Years Prison<\/div><div class=\"col-stat-lbl\">Maximum federal penalty for unilateral child removal abroad (ss 65Y / 65Z)<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">In This Column<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#a-116917-case-partner-visa-backlog-and-what-home\" class=\"col-toc-link lvl-2\">A 116,917-case Partner Visa backlog and what Home Affairs FOI statistics show<\/a><a href=\"#three-statutory-gates-under-division-15-and-the-\" class=\"col-toc-link lvl-2\">Three statutory gates under Division 1.5 and the July 2024 Subclass 309 trap<\/a><a href=\"#judicial-versus-non-judicial-evidence-lin-23026-\" class=\"col-toc-link lvl-2\">Judicial versus non-judicial evidence (LIN 23/026) and consistent affidavits<\/a><a href=\"#overseas-divorce-decrees-clayton-v-bant-and-the-\" class=\"col-toc-link lvl-2\">Overseas divorce decrees (Clayton v Bant) and the 3-year prison trap on taking children abroad (ss 65Y/65Z)<\/a><a href=\"#coordinating-your-visa-protection-and-family-law\" class=\"col-toc-link lvl-2\">Coordinating your visa protection and family law strategy<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">Open Family Law Consultation Form<\/a>\n              <a href=\"../../?lang=en&amp;tab=family\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 Back to Family Law Self-Help Hub<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">&quot;Every time we argue, my sponsor threatens to email Home Affairs, cancel my Partner Visa, and put me on a plane home.&quot; Across combined migration and family law practice, where a Queensland Law Society Accredited Specialist in Immigration Law works directly alongside family law matters, we hear that sentence almost weekly. An Australian citizen or permanent resident sponsor has zero legal power to cancel your visa. All a sponsor can do is notify the Department of Home Affairs that the relationship has ended, which triggers a procedural fairness letter rather than instant cancellation or removal. Where a genuine married or de facto relationship existed before separation, the <em>Migration Regulations 1994<\/em> (Cth) provide direct routes to permanent residence (Subclass 801 or Subclass 100) under the Division 1.5 family violence provisions or shared-parenting exceptions, provided your migration evidence and family court filings tell the same factual story.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 366\" width=\"100%\" role=\"img\" aria-label=\"Partner Visa Backlog Surge (116,917) &amp; Division 1.5 Family Violence PR Grants\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"365\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"78\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"79\" x2=\"879\" y2=\"79\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"28\" y=\"29\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.06em\">HOME AFFAIRS &amp; FOI DATA \u00b7 PARTNER VISA VULNERABILITY WINDOW<\/text>\n  <text x=\"28\" y=\"52\" font-size=\"16.8\" font-weight=\"800\" fill=\"#1F242B\">Partner Visa Backlog Surge (116,917) &amp; Division 1.5 Family Violence PR Grants<\/text>\n  <text x=\"28\" y=\"70\" font-size=\"11.3\" fill=\"#525B67\">Sources: Home Affairs 2025\u201326 Migration Program Report &amp; DHA FOI Releases FA 25/08/01932 &amp; FA 21/08/01425<\/text>\n  <rect x=\"22\" y=\"96\" width=\"412\" height=\"252\" rx=\"10\" fill=\"#FAF9F6\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"38\" y=\"122\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">1. Partner Visa On-Hand Pipeline Backlog (30 June)<\/text>\n  <rect x=\"56\" y=\"231\" width=\"62\" height=\"59\" rx=\"6\" fill=\"#6E8594\"/>\n  <text x=\"87\" y=\"223\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#6E8594\">58,515<\/text>\n  <text x=\"87\" y=\"308\" text-anchor=\"middle\" font-size=\"11.2\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F242B\">2022\u201323<\/text>\n  <rect x=\"146\" y=\"213\" width=\"62\" height=\"77\" rx=\"6\" fill=\"#1F4E5F\"/>\n  <text x=\"177\" y=\"205\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F4E5F\">75,672<\/text>\n  <text x=\"177\" y=\"308\" text-anchor=\"middle\" font-size=\"11.2\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F242B\">2023\u201324<\/text>\n  <rect x=\"236\" y=\"192\" width=\"62\" height=\"98\" rx=\"6\" fill=\"#A63A48\"/>\n  <text x=\"267\" y=\"184\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#A63A48\">96,581<\/text>\n  <text x=\"267\" y=\"308\" text-anchor=\"middle\" font-size=\"11.2\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F242B\">2024\u201325<\/text>\n  <rect x=\"326\" y=\"171\" width=\"62\" height=\"119\" rx=\"6\" fill=\"#7A1F2B\"/>\n  <text x=\"357\" y=\"163\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#7A1F2B\">116,917<\/text>\n  <text x=\"357\" y=\"308\" text-anchor=\"middle\" font-size=\"11.2\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F242B\">2025\u201326<\/text>\n  <text x=\"38\" y=\"332\" font-size=\"11.2\" font-weight=\"700\" fill=\"#7A1F2B\">66,916 new lodgements vs 40,500 annual cap -&gt; +100% backlog in 3 years<\/text>\n  <rect x=\"450\" y=\"96\" width=\"408\" height=\"252\" rx=\"10\" fill=\"#FAF9F6\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"466\" y=\"122\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">2. Verified Division 1.5 Family Violence PR Grants (FOI)<\/text>\n  <rect x=\"466\" y=\"136\" width=\"376\" height=\"62\" rx=\"8\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1\"/>\n  <text x=\"478\" y=\"162\" font-size=\"15\" font-weight=\"800\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#7A1F2B\">7,392 Grants<\/text>\n  <text x=\"606\" y=\"160\" font-size=\"11.3\" font-weight=\"700\" fill=\"#1F242B\">Partner PR Grants (Jul 2011\u2013Jul 2025)<\/text>\n  <text x=\"478\" y=\"183\" font-size=\"10.7\" fill=\"#525B67\">Covers physical, psychological &amp; economic abuse (FOI FA 25/08/01932)<\/text>\n  <rect x=\"466\" y=\"206\" width=\"376\" height=\"62\" rx=\"8\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1\"/>\n  <text x=\"478\" y=\"232\" font-size=\"15\" font-weight=\"800\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F4E5F\">820 / Year<\/text>\n  <text x=\"606\" y=\"230\" font-size=\"11.3\" font-weight=\"700\" fill=\"#1F242B\">FY 2023\u201324 Grants (~1,080+ claims/yr)<\/text>\n  <text x=\"478\" y=\"253\" font-size=\"10.7\" fill=\"#525B67\">Substantial established statutory pathway, not a rare exception<\/text>\n  <rect x=\"466\" y=\"276\" width=\"376\" height=\"62\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"478\" y=\"302\" font-size=\"15\" font-weight=\"800\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1D6B48\">Rank #9<\/text>\n  <text x=\"606\" y=\"300\" font-size=\"11.3\" font-weight=\"700\" fill=\"#1F242B\">South Korea in Global Top 10 FV Grants<\/text>\n  <text x=\"478\" y=\"323\" font-size=\"10.7\" fill=\"#525B67\">Also among first 5 nations granted Skilled Secondary FV PR (2024\u201325)<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 1: Partner Visa Pipeline Backlog Surge and Division 1.5 Family Violence Grants<\/figcaption><\/figure>\n<h2 id=\"a-116917-case-partner-visa-backlog-and-what-home\" class=\"doc-h2\">A 116,917-case Partner Visa backlog and what Home Affairs FOI statistics show<\/h2>\n<p class=\"doc-p\">Much of the pressure on temporary Partner Visa holders (Subclass 820 or Subclass 309) comes down to processing delays. According to the Department of Home Affairs <em>2025\u201326 Migration Program Report<\/em>, new Partner Visa lodgements hit 66,916 in 2025\u201326 while annual planning places stayed capped at 40,500. Over three years, the on-hand Partner Visa backlog rose 100% to 116,917 applications as at 30 June 2026, even with a 94.0% grant rate among finalised files. Spending years on a provisional or bridging visa leaves migrant spouses exposed when a relationship sours, and controlling sponsors often use that long wait to withhold household funds, cut off support networks, or hold residency over a partner&#x27;s head.<\/p>\n<p class=\"doc-p\">Many temporary visa holders assume the family violence pathway applies only to hospitalised victims of severe physical assault, or that claims rarely succeed. Official Home Affairs Freedom of Information disclosures (FOI FA 25/08/01932, released October 2025, and FA 21/08/01425) prove otherwise. Between 1 July 2011 and 31 July 2025, 7,392 Partner Visas were granted under the family violence provisions across roughly 10,830+ accessed claims, including 820 permanent grants in FY 2023\u201324 alone (~1,080+ claims lodged annually). South Korea ranks #9 globally among nationalities granted Partner Visa permanent residence under the family violence rules. After the 2024\u201325 reforms extended family violence protections to secondary applicants across permanent Skilled visas, South Korean nationals also featured among the first five nationalities granted permanent residence under the expanded framework.<\/p>\n<h2 id=\"three-statutory-gates-under-division-15-and-the-\" class=\"doc-h2\">Three statutory gates under Division 1.5 and the July 2024 Subclass 309 trap<\/h2>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 314\" width=\"100%\" role=\"img\" aria-label=\"Partner Visa Cessation (Div 1.5 / LIN 23/026) &amp; Cross-Border Family Law Guardrails\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"313\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"66\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"67\" x2=\"879\" y2=\"67\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"28\" y=\"27\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.06em\">INTEGRATED MIGRATION + FAMILY LAW DECISION MATRIX<\/text>\n  <text x=\"28\" y=\"50\" font-size=\"16.2\" font-weight=\"800\" fill=\"#1F242B\">Partner Visa Cessation (Div 1.5 / LIN 23/026) &amp; Cross-Border Family Law Guardrails<\/text>\n  <rect x=\"22\" y=\"84\" width=\"266\" height=\"126\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"84\" width=\"266\" height=\"28\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"34\" y=\"102\" font-size=\"12\" font-weight=\"700\" fill=\"#FFFFFF\">Gate 1 \u00b7 Genuine &amp; Entry Test<\/text>\n  <text x=\"34\" y=\"134\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">Gupta [2022] FCAFC 51:<\/text>\n  <text x=\"34\" y=\"155\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">Pre-cessation genuine relationship<\/text>\n  <text x=\"34\" y=\"176\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">309/100 FV requires post-app AU entry<\/text>\n  <line x1=\"291\" y1=\"147\" x2=\"301\" y2=\"147\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"305,147 299,143 299,151\" fill=\"#1F242B\"/>\n  <rect x=\"307\" y=\"84\" width=\"266\" height=\"126\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"307\" y=\"84\" width=\"266\" height=\"28\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"319\" y=\"102\" font-size=\"12\" font-weight=\"700\" fill=\"#FFFFFF\">Gate 2 \u00b7 Abuse &amp; Fear Nexus<\/text>\n  <text x=\"319\" y=\"134\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">Sok [2005]: emotional/economic abuse<\/text>\n  <text x=\"319\" y=\"155\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">Mijalkov [2026] FCA 741:<\/text>\n  <text x=\"319\" y=\"176\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">Must prove reasonable fear for safety<\/text>\n  <line x1=\"576\" y1=\"147\" x2=\"586\" y2=\"147\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"590,147 584,143 584,151\" fill=\"#1F242B\"/>\n  <rect x=\"592\" y=\"84\" width=\"266\" height=\"126\" rx=\"10\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1.3\"/>\n  <rect x=\"592\" y=\"84\" width=\"266\" height=\"28\" rx=\"9\" fill=\"#1D6B48\"/>\n  <text x=\"604\" y=\"102\" font-size=\"12\" font-weight=\"700\" fill=\"#FFFFFF\">Gate 3 \u00b7 Evidentiary Track<\/text>\n  <text x=\"604\" y=\"134\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">Final court DVO (reg 1.23) OR<\/text>\n  <text x=\"604\" y=\"155\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">LIN 23/026 &gt;=2 of 8 pro categories<\/text>\n  <text x=\"604\" y=\"176\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1F242B\">Mandatory binding IE referral if unsure<\/text>\n  <rect x=\"22\" y=
