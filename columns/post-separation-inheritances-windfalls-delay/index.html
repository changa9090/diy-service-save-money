  <script id="col-payload" type="application/json">{"ko": {"doc_title": "\ubcc4\uac70\ud55c \uc9c0 4\ub144 \uc9c0\ub0ac\uc73c\ub2c8 \uc0c8\ub85c \ubc1b\uc740 \uc0c1\uc18d\uc774\ub098 \uc9d1\uac12 \uc0c1\uc2b9\ubd84\uc740 \ub0b4 \uac83\uc774\uaca0\uc9c0: \ud569\uc758\uba85\ub839(Consent Orders)\uc744 \ubbf8\ub8ec \ub300\uac00 \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">\uc804\uccb4 \uac00\uc774\ub4dc \ud648<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=ko\">\ube44\uc790 \uc194\ub8e8\uc158 \uac00\uc774\ub4dc<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=ko\">\uace0\uc6a9\ubc95 \ub0b4\ube44\uac8c\uc774\ud130<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=ko\">\uc140\ud504 \ubc95\ub960 \ud574\uacb0 \u00b7 \ubcc0\ud638\uc0ac \uc0c1\ub2f4 \uc2dc\uc810 \uac00\uc774\ub4dc<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\">\ubc15\uc564\ucf54 \uc0c1\ub2f4 \uc2e0\uccad \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=ko&amp;tab=family\" class=\"col-back-btn\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \u00b7 \ud638\uc8fc \uac00\uc871\ubc95 \uc26c\uc6b4 \ud310\ub840 \uce7c\ub7fc<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn active\">\ud55c\uad6d\uc5b4<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">\uc628\ub77c\uc778 \uc0c1\ub2f4 \uc2e0\uccad \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">\ubcc4\uac70 \ud6c4 \uc0c1\uc18d\u00b7\uc9c0\uccb4\uc704\ud5d8 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 16<\/span>\n          <span class=\"col-verified-pill num\">1\ucc28 \ubc95\ub839\u00b7\ud310\ub840 \uac80\uc99d \uc644\ub8cc (2026.11)<\/span>\n          <span class=\"col-time-pill num\">\uc57d 8\ubd84 \uc18c\uc694<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">\ubcc4\uac70\ud55c \uc9c0 4\ub144 \uc9c0\ub0ac\uc73c\ub2c8 \uc0c8\ub85c \ubc1b\uc740 \uc0c1\uc18d\uc774\ub098 \uc9d1\uac12 \uc0c1\uc2b9\ubd84\uc740 \ub0b4 \uac83\uc774\uaca0\uc9c0: \ud569\uc758\uba85\ub839(Consent Orders)\uc744 \ubbf8\ub8ec \ub300\uac00<\/h1>\n        <p class=\"col-subtitle\">\uc7ac\uc0b0 \uac00\uce58\ub294 \ubcc4\uac70\ud55c \ub0a0\uc774 \uc544\ub2c8\ub77c \ud569\uc758\u00b7\uc7ac\ud310\ud558\ub294 \ub0a0 \uae30\uc900\uc73c\ub85c \uacc4\uc0b0\ud569\ub2c8\ub2e4. \ubcc4\uac70 4\ub144 \ub4a4 \uc0c1\uc18d\uae08\uc744 \ub098\ub208 Calvin &amp; McTier \ud310\uacb0\uacfc \ubcf5\uad8c \ub2f9\ucca8\uae08 \ud310\uacb0 \ubd84\uc11d<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">\ubc15\ucc3d\ubbfc \ub300\ud45c\ubcc0\ud638\uc0ac (Chang Min Park)<\/div>\n            <div class=\"col-author-role\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \ub300\ud45c\ubcc0\ud638\uc0ac \u00b7 \ud638\uc8fc \ud038\uc990\ub79c\ub4dc\uc8fc \ubcc0\ud638\uc0ac\ud68c \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col16_fam_windfall_hero.jpg\" alt=\"\ubcc4\uac70\ud55c \uc9c0 4\ub144 \uc9c0\ub0ac\uc73c\ub2c8 \uc0c8\ub85c \ubc1b\uc740 \uc0c1\uc18d\uc774\ub098 \uc9d1\uac12 \uc0c1\uc2b9\ubd84\uc740 \ub0b4 \uac83\uc774\uaca0\uc9c0: \ud569\uc758\uba85\ub839(Consent Orders)\uc744 \ubbf8\ub8ec \ub300\uac00\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">\ubc95\uc6d0 \ub3c4\uc7a5\uc774 \ucc0d\ud78c \ud569\uc758\uba85\ub839(Consent Orders) \uc5c6\uc774 \ubcc4\uac70 \uc0c1\ud0dc\ub9cc \uc720\uc9c0\ud558\uba74 \uba87 \ub144 \ub4a4 \ubc1b\uc740 \ubd80\ubaa8\ub2d8 \uc720\uc0b0\uc774\ub098 \uc624\ub978 \uc9d1\uac12\uae4c\uc9c0 \ubaa8\ub450 \ubd84\ud560 \ub300\uc0c1\uc5d0 \uc62c\ub77c\uac11\ub2c8\ub2e4.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">\uc7ac\ud310\u00b7\ud569\uc758\uc77c \uae30\uc900<\/div><div class=\"col-stat-lbl\">\uc7ac\uc0b0 \ud3c9\uac00\ub294 \ubcc4\uac70\uc77c\uc774 \uc544\ub2cc \uc2ec\ub9ac\u00b7\ud569\uc758 \uc2dc\uc810 \uc21c\uc790\uc0b0 \uae30\uc900 (s 79(3)(a))<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">\ubcc4\uac70 4\ub144 \ub4a4 \uc720\uc0b0<\/div><div class=\"col-stat-lbl\">$430k \ubd80\uce5c \uc0c1\uc18d\uae08 \ubd84\ud560 \ud480 \ud3b8\uc785 \ud6c4 65:35 \ubc30\ubd84 (Calvin &amp; McTier [2017])<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">$50\ub9cc\u2013$75\ub9cc \uc9c0\uae09<\/div><div class=\"col-stat-lbl\">\ubcc4\uac70 \ud6c4 $5M\u2013$6M \ubcf5\uad8c \ub2f9\ucca8 \uc0ac\uac74\uc5d0\uc11c \uc804 \ubc30\uc6b0\uc790\uc5d0\uac8c \uc778\uc815\ub41c \uc7a5\ub798 \ud544\uc694 \ubaab<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">\uc774 \uce7c\ub7fc\uc758 \ubaa9\ucc28<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#\uc7ac\uc0b0\ubd84\ud560\uc758-\uae30\uc900\uc120\uc740-\ubcc4\uac70\uc77c\uc774-\uc544\ub2cc-\uc2ec\ub9ac\ud569\uc758-\uc2dc\uc810\uc774\uc5d0\uc694\" class=\"col-toc-link lvl-2\">\uc7ac\uc0b0\ubd84\ud560\uc758 \uae30\uc900\uc120\uc740 \ubcc4\uac70\uc77c\uc774 \uc544\ub2cc \uc2ec\ub9ac\u00b7\ud569\uc758 \uc2dc\uc810\uc774\uc5d0\uc694<\/a><a href=\"#\ubcc4\uac70-4\ub144-\ub4a4-\ubc1b\uc740-\ubd80\uce5c-\uc720\uc0b0\uae4c\uc9c0-\ubd84\ud560-\ub300\uc0c1\uc5d0-\ub123\uc740-\ubc95\uc6d0\uc758-\ud310\ub2e8\" class=\"col-toc-link lvl-2\">\ubcc4\uac70 4\ub144 \ub4a4 \ubc1b\uc740 \ubd80\uce5c \uc720\uc0b0\uae4c\uc9c0 \ubd84\ud560 \ub300\uc0c1\uc5d0 \ub123\uc740 \ubc95\uc6d0\uc758 \ud310\ub2e8<\/a><a href=\"#\ubcc4\uac70-\ud6c4-\ub2f9\ucca8\ub41c-\ub85c\ub610-600\ub9cc500\ub9cc\ub3c4-\uc608\uc678\uac00-\uc544\ub2c8\uc5c8\uc5b4\uc694\" class=\"col-toc-link lvl-2\">\ubcc4\uac70 \ud6c4 \ub2f9\ucca8\ub41c \ub85c\ub610 $600\ub9cc\u00b7$500\ub9cc\ub3c4 \uc608\uc678\uac00 \uc544\ub2c8\uc5c8\uc5b4\uc694<\/a><a href=\"#\uc0ac\uc801-\uac01\uc11c\uc758-\ud55c\uacc4\uc640-4950-\uc815\uc561-\ud569\uc758\uba85\ub839\uc73c\ub85c-\ubb38\uc744-\ub2eb\ub294-\ubc95\" class=\"col-toc-link lvl-2\">\uc0ac\uc801 \uac01\uc11c\uc758 \ud55c\uacc4\uc640 $4,950 \uc815\uc561 \ud569\uc758\uba85\ub839\uc73c\ub85c \ubb38\uc744 \ub2eb\ub294 \ubc95<\/a><a href=\"#\ubbf8\ub904-\ub454-\uc7ac\uc0b0-\uc815\ub9ac-\ub0b4-\uc790\uc0b0\uc774-\ub354-\ucee4\uc9c0\uae30-\uc804\uc5d0-\ub9c8\ubb34\ub9ac\ud558\uc138\uc694\" class=\"col-toc-link lvl-2\">\ubbf8\ub904 \ub454 \uc7ac\uc0b0 \uc815\ub9ac, \ub0b4 \uc790\uc0b0\uc774 \ub354 \ucee4\uc9c0\uae30 \uc804\uc5d0 \ub9c8\ubb34\ub9ac\ud558\uc138\uc694<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">\uac00\uc871\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../?lang=ko&amp;tab=family\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">\uc9d0\uc744 \uc2f8\uc11c \ub2e4\ub978 \uc9d1\uc73c\ub85c \uc774\uc0ac \ub098\uc624\uc168\ub098\uc694? \uacf5\ub3d9 \uacc4\uc88c \ud604\uae08\uae4c\uc9c0 \ubc18\ubc18\uc529 \ub098\ub234\ub2e4\uba74 \uc7ac\uc0b0 \uc815\ub9ac\ub3c4 \ub05d\ub0ac\ub2e4\uace0 \ubbff\uae30 \uc26c\uc6cc\uc694. \uc2dd\ud0c1\uc5d0\uc11c \uad6c\ub450\ub85c \uc57d\uc18d\ud588\uac70\ub098 \uac01\uc11c\ub97c \uc368 \ub450\uc5c8\uc73c\ub2c8 \uc774\uc81c \ub0a8\ub0a8\uc774\ub77c\uace0 \uc548\uc2ec\ud558\uc2dc\ub294 \ubd84\ub4e4\ub3c4 \ub9ce\uac70\ub4e0\uc694. \uacfc\uc5f0 \ubc95\uc6d0\ub3c4 \uadf8\ub807\uac8c \ubd10 \uc904\uae4c\uc694? \ud638\uc8fc \uac00\uc871\ubc95(Family Law Act 1975)\uc758 \uc2dc\uacc4\ub294 \uc774\uc0ac \ud2b8\ub7ed\uc774 \ub5a0\ub09c \ub0a0 \uba48\ucd94\uc9c0 \uc54a\uc544\uc694. \ud638\uc8fc \ud1b5\uacc4\uccad(ABS)\uc774 \ubc1c\ud45c\ud55c 2025\ub144 \ud63c\uc778\u00b7\uc774\ud63c \ud1b5\uacc4\uac00 \uc774 \ud604\uc2e4\uc744 \uc798 \ubcf4\uc5ec \uc918\uc694. \ud63c\uc778\ubd80\ud130 \ubcc4\uac70\uae4c\uc9c0 \uc911\uc704 \uae30\uac04\uc740 9.4\ub144\uc778\ub370 \uc774\ud63c \ud655\uc815\uae4c\uc9c0\ub294 13.4\ub144\uc774 \uac78\ub824\uc694. \ubcc4\uac70 \ub4a4\uc5d0\ub3c4 \ud3c9\uade0 4\ub144 \uac00\uae4c\uc774 \ubc95\uc801 \uc815\ub9ac\ub97c \ubbf8\ub904 \ub454\ub2e4\ub294 \ub73b\uc774\uc8e0. \ubc14\ub85c \uadf8 \uacf5\ubc31\uae30 \ub3d9\uc548 \uc9d1\uac12\uc774 \uc218\uc2ed\ub9cc \ub2ec\ub7ec \uce58\uc19f\uae30\ub3c4 \ud574\uc694. \ubd80\ubaa8\ub2d8\uaed8 \uc720\uc0b0\uc744 \ubb3c\ub824\ubc1b\ub294 \uc77c\ub3c4 \uc0dd\uae30\uace0\uc694. \uadf8\ub7ec\ub2e4 \uc5b4\ub290 \ub0a0 \uc804 \ubc30\uc6b0\uc790 \ubcc0\ud638\uc0ac\ub85c\ubd80\ud130 \uc9c0\uae08 \ubd88\uc5b4\ub09c \uc790\uc0b0 \uc804\uccb4\ub97c \ub2e4\uc2dc \ub098\ub204\uc790\ub294 \uc11c\ud55c\uc744 \ubc1b\uc73c\uba74 \ub208\uc55e\uc774 \uce84\uce84\ud574\uc9c8 \uc218\ubc16\uc5d0 \uc5c6\uc5b4\uc694.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 382\" width=\"100%\" role=\"img\" aria-label=\"\ubcc4\uac70 \ud6c4 \ud569\uc758\uba85\ub839(Consent Orders)\uc744 \ubbf8\ub8e8\ub2e4 \ub9de\ub2e5\ub728\ub9ac\ub294 \uc2e4\uc81c \ud310\ub840 \uacb0\uacfc\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"381\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">\uae30\uc900 \uc2dc\uc810\uc758 \uce58\uba85\uc801 \uc624\ud574 \u00b7 \ubcc4\uac70\uc77c(X)\uc774 \uc544\ub2c8\ub77c \ud569\uc758\u00b7\uc7ac\ud310 \uc2dc\uc810(O) \uae30\uc900!<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">\ubcc4\uac70 \ud6c4 \ud569\uc758\uba85\ub839(Consent Orders)\uc744 \ubbf8\ub8e8\ub2e4 \ub9de\ub2e5\ub728\ub9ac\ub294 \uc2e4\uc81c \ud310\ub840 \uacb0\uacfc<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">\uadfc\uac70: ABS 2025 (\ubcc4\uac70~\uc774\ud63c \uc911\uc704 4\ub144 \uc9c0\uccb4) \u00b7 Calvin &amp; McTier [2017] \u00b7 Holland [2017] \u00b7 Eufrosin [2014] \u00b7 Farmer [2000]<\/text>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"38\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">\uc704\ud5d8 \ud604\uc2e4 \u00b7 \uc11c\ub958 \uc815\ub9ac \ubbf8\ub8ec \ucc44 \uc218\ub144 \uacbd\uacfc \uc2dc<\/text>\n  <circle cx=\"42\" cy=\"144\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ubcc4\uac70 4\ub144 \ub4a4 \ubc1b\uc740 \ubd80\uce5c \uc0c1\uc18d\uae08\ub3c4 \ubd84\ud560 \ud480 \ud3b8\uc785!<\/text>\n  <text x=\"54\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">Calvin &amp; McTier [2017]: $430k \uc0c1\uc18d\uae08 \ud569\uc0b0 \ud6c4 \uc804\ucc98\uc5d0\uac8c 35% \ubd84\ud560 \ud655\uc815.<\/text>\n  <circle cx=\"42\" cy=\"196\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ubcc4\uac70 3.5\ub144 \ub4a4 \uc0c1\uc18d \ubd80\ub3d9\uc0b0 $715k \uaca9\ub9ac \uae30\uac01<\/text>\n  <text x=\"54\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">Holland [2017]: \ubcc4\ub3c4 \uc7ac\uc6d0\uc73c\ub85c \ube7c\ub2ec\ub77c\ub294 \uc8fc\uc7a5\uc744 \ud56d\uc18c\ubd80\uac00 \uc804\uba74 \ud30c\uae30.<\/text>\n  <circle cx=\"42\" cy=\"248\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ubcc4\uac70 \ud6c4 \ubcf5\uad8c \ub2f9\ucca8\uae08($5M\u2013$6M)\ub3c4 \uccad\uad6c \ub178\ucd9c<\/text>\n  <text x=\"54\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">Eufrosin ($50\ub9cc \uc9c0\uae09) \u00b7 Farmer &amp; Bramley ($75\ub9cc \uc9c0\uae09) \uc7a5\ub798 \ud544\uc694 \ubc18\uc601!<\/text>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1.3\"/>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#1D6B48\"/>\n  <text x=\"466\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">\uc548\uc804 \ud574\ubc95 \u00b7 \ubcc4\uac70 \uc9c1\ud6c4 Consent Orders \ud655\uc815<\/text>\n  <circle cx=\"470\" cy=\"144\" r=\"4\" fill=\"#1D6B48\"/>\n  <text x=\"482\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\uc7ac\uc0b0 \uad00\uacc4 \uc601\uad6c \uc808\uc5f0 (Clean Break \ud655\uc815)<\/text>\n  <text x=\"482\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">\ubc95\uc6d0 \uc778\uc7a5\uc774 \ucc0d\ud788\ub294 \uc989\uc2dc \uc774\ud6c4 \ucde8\ub4dd \uc0c1\uc18d\u00b7\uc0ac\uc5c5 \uc131\uc7a5\u00b7\uc9d1\uac12 \uc0c1\uc2b9\ubd84 100% \ubcf4\ud638.<\/text>\n  <circle cx=\"470\" cy=\"196\" r=\"4\" fill=\"#1D6B48\"/>\n  <text x=\"482\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ubc15\uc564\ucf54 \uc815\uc561 \ud328\ud0a4\uc9c0 ($4,950 + \ubc95\uc6d0 \uc778\uc9c0\ub300 $215)<\/text>\n  <text x=\"482\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">\ubc95\uc815 \ucd9c\uc11d \uc5c6\uc774 \uc11c\uba74 \uc2ec\uc0ac\ub85c \uc57d 4\uc8fc \ub0b4 \uc885\uacb0 \u00b7 \uc218\ub9cc \ub2ec\ub7ec \uc778\uc9c0\uc138 \uba74\uc81c.<\/text>\n  <circle cx=\"470\" cy=\"248\" r=\"4\" fill=\"#1D6B48\"/>\n  <text x=\"482\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\uc0c1\ub300\ubc29\uc774 \uc5f0\ub77d \ud68c\ud53c \uc2dc \uc989\uc2dc \ubcc0\ud638\uc0ac \uacf5\uc2dd \ud1b5\uc9c0<\/text>\n  <text x=\"482\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">s 71B \uc7ac\uc0b0\uacf5\uac1c \uc694\uad6c \uc11c\ud55c\uc73c\ub85c \uc2dc\uc138 \uc0c1\uc2b9\u00b7\uc0c1\uc18d \ubc1c\uc0dd \uc804 \ud14c\uc774\ube14\uc5d0 \uc18c\ud658.<\/text>\n  <rect x=\"22\" y=\"328\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"351\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1D6B48\">\uace8\ub4e0\ud0c0\uc784: \uad6c\ub450 \ud569\uc758\ub098 \uc1a1\uae08 \ub0b4\uc5ed\ub9cc\uc73c\ub85c\ub294 \ubc95\uc801 \uc808\uc5f0\uc774 \ub418\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \uc0c1\uc18d\u00b7\ubd80\ub3d9\uc0b0 \uc0c1\uc2b9 \uc804\uc5d0 Consent Orders\ub85c \ubb38\uc744 \ub2eb\uc73c\uc138\uc694.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 1: \ubcc4\uac70\uc77c \uae30\uc900 \uc624\ud574 \ub300 \uc2ec\ub9ac\u00b7\ud569\uc758 \uc2dc\uc810(Date of Hearing) \uc790\uc0b0 \ud3b8\uc785 \ub9ac\uc2a4\ud06c \ube44\uad50<\/figcaption><\/figure>\n<h2 id=\"\uc7ac\uc0b0\ubd84\ud560\uc758-\uae30\uc900\uc120\uc740-\ubcc4\uac70\uc77c\uc774-\uc544\ub2cc-\uc2ec\ub9ac\ud569\uc758-\uc2dc\uc810\uc774\uc5d0\uc694\" class=\"doc-h2\">\uc7ac\uc0b0\ubd84\ud560\uc758 \uae30\uc900\uc120\uc740 \ubcc4\uac70\uc77c\uc774 \uc544\ub2cc \uc2ec\ub9ac\u00b7\ud569\uc758 \uc2dc\uc810\uc774\uc5d0\uc694<\/h2>\n<p class=\"doc-p\">\ud55c\uad6d \uc2e4\ubb34\uc5d0 \uc775\uc219\ud55c \ubd84\ub4e4\uc740 \ubcc4\uac70\uc77c\uc5d0 \uc7ac\uc0b0 \ubaa9\ub85d\uc774 \uace0\uc815\ub41c\ub2e4\uace0 \uc0dd\uac01\ud558\uace4 \ud558\uc138\uc694. \ud638\uc8fc \uc5f0\ubc29\uc21c\ud68c\u00b7\uac00\uc871\ubc95\uc6d0(FCFCOA)\uc758 \uacc4\uc0b0\ubc95\uc740 \uc804\ud600 \ub2ec\ub77c\uc694. 2025\ub144 6\uc6d4 10\uc77c \uc2dc\ud589\ub41c \uac1c\uc815 \uac00\uc871\ubc95 s 79(3)(a)(\ubc95\ub960\ud63c)\uc640 s 90SM(3)(a)(\uc0ac\uc2e4\ud63c)\ub294 \ubc95\uc6d0\uc774 \uba85\ub839\uc744 \ub0b4\ub9b4 \ub54c \uc591\uce21\uc774 \ud604\uc7ac \ubcf4\uc720\ud55c \ubc95\ub960\uc0c1\u00b7\ud615\ud3c9\ubc95\uc0c1 \uc7ac\uc0b0\uacfc \ubd80\ucc44(existing property)\ub97c \ud2b9\uc815\ud558\ub3c4\ub85d \ubabb \ubc15\uace0 \uc788\uac70\ub4e0\uc694. \uc5ec\uae30\uc11c \ud604\uc7ac\ub780 \ubcf8\uc548 \uc2ec\ub9ac\uc77c \ub610\ub294 \uacf5\uc2dd \ud569\uc758 \uba85\ub839 \ud655\uc815 \uc2dc\uc810(Date of Hearing or Settlement)\uc744 \ub73b\ud574\uc694.<\/p>\n<p class=\"doc-p\">\uc2dc\uac04\uc774 \ud750\ub97c\uc218\ub85d \uc131\uc2e4\ud558\uac8c \uc790\uc0b0\uc744 \uc77c\uad70 \ucabd\uc774 \ubd88\ub9ac\ud574\uc838\uc694. \ubcc4\uac70 \ud6c4 4\ub144 \ub3d9\uc548 \ud63c\uc790 \ubaa8\uae30\uc9c0\ub97c \uac1a\ub294 \uc0ac\uc774 \uc9d1\uac12\uc774 $350,000 \uc62c\ub790\ub2e4\uace0 \ud574 \ubcfc\uae4c\uc694? \uc0c1\ub300\ubc29\uc774 \uadf8 \uae30\uac04\uc5d0 \ub300\ucd9c\uae08\uc744 \ub2e8 1\ub2ec\ub7ec\ub3c4 \ubcf4\ud0dc\uc9c0 \uc54a\uc558\ub354\ub77c\ub3c4 \uc624\ub978 \ud604\uc7ac \uc2dc\uc138 \uc804\uccb4\uac00 \uc77c\ub2e8 \ubd84\ud560 \ub300\uc0c1 \uc790\uc0b0 \ud480(asset pool)\uc5d0 \uc62c\ub77c\uac00\uc694. \ubcc4\uac70 \ub4a4 \uc5f0\ubd09\uc744 \ub192\uc5ec \uc0c8\ub85c \ubaa8\uc740 \uc608\uae08\uc774\ub098 \ub2e8\ub3c5 \uba85\uc758\ub85c \uc0b0 \ud22c\uc790\uc6a9 \ubd80\ub3d9\uc0b0\ub3c4 \ub9c8\ucc2c\uac00\uc9c0\uc608\uc694. \ud1f4\uc9c1\uc5f0\uae08(Superannuation) \uc99d\uac00\ubd84\uae4c\uc9c0 s 71B \ubc0f s 90RI \uc804\uba74 \uc7ac\uc0b0\uacf5\uac1c \uc758\ubb34\uc5d0 \ub530\ub77c \ubaa8\ub450 \uacf5\uac1c\ud574\uc57c \ud558\uc8e0. \ubb3c\ub860 \ubcc4\uac70 \ud6c4 \ub2e8\ub3c5 \uae30\uc5ec\ubd84\uc744 \uae30\uc5ec\ub3c4 \uc2ec\uc0ac(s 79(4))\uc5d0\uc11c \ucc38\uc791\ud574 \uc8fc\uae30\ub294 \ud574\uc694. \uadf8\ub798\ub3c4 \uc790\uc0b0 \ucd1d\uc561\uc774 \ucee4\uc9c4 \ub4a4 \ub098\ub204\ub294 \uac83\uacfc \ubcc4\uac70 \uc9c1\ud6c4 \ubb38\uc744 \ub2eb\ub294 \uac83\uc740 \ucd5c\uc885 \uae08\uc561\uc5d0\uc11c \ud070 \ucc28\uc774\ub97c \ub0b3\uc544\uc694.<\/p>\n<h2 id=\"\ubcc4\uac70-4\ub144-\ub4a4-\ubc1b\uc740-\ubd80\uce5c-\uc720\uc0b0\uae4c\uc9c0-\ubd84\ud560-\ub300\uc0c1\uc5d0-\ub123\uc740-\ubc95\uc6d0\uc758-\ud310\ub2e8\" class=\"doc-h2\">\ubcc4\uac70 4\ub144 \ub4a4 \ubc1b\uc740 \ubd80\uce5c \uc720\uc0b0\uae4c\uc9c0 \ubd84\ud560 \ub300\uc0c1\uc5d0 \ub123\uc740 \ubc95\uc6d0\uc758 \ud310\ub2e8<\/h2>\n<p class=\"doc-p\">\ud5e4\uc5b4\uc9c4 \uc9c0 \uba87 \ub144 \ub4a4\uc5d0 \ubc1b\uc740 \ubd80\ubaa8\ub2d8 \uc720\uc0b0\uae4c\uc9c0 \ub098\ub220\uc57c \ud558\ub290\ub0d0\uace0 \ubb3b\ub294 \ubd84\ub4e4\uc774 \ub9ce\uc544\uc694. \ub611\uac19\uc740 \uc7c1\uc810\uc73c\ub85c \ub9de\uc120 \ub300\ud45c \uc0ac\uac74\uc774 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2017/125.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Calvin &amp; McTier<\/em> [2017] FamCAFC 125<\/a> \ud310\uacb0\uc774\uc5d0\uc694. \ub0a8\ud3b8\uc740 \ubcc4\uac70\ud55c \uc9c0 4\ub144\uc774 \uc9c0\ub09c \uc2dc\uc810\uc5d0 \ubd80\uce5c \uc720\uc0b0\uc744 \uc0c1\uc18d\ubc1b\uc558\uc5b4\uc694. \uc7ac\ud310 \ub2f9\uc2dc \ub0a8\uc740 \uc720\uc0b0\ub9cc $430,686\ub85c \uc804\uccb4 \uc21c\uc790\uc0b0\uc758 \uc57d 32%\uc5d0 \ub2ec\ud588\uc8e0. \ub0a8\ud3b8\uc740 \ud63c\uc778\uacfc \ubb34\uad00\ud55c \ubcc4\uac70 4\ub144 \ud6c4 \uc720\uc0b0\uc774\ub2c8 \ubd84\ud560 \ub300\uc0c1\uc5d0\uc11c \ube7c \ub2ec\ub77c\uace0 \ub2e4\ud25c\uc5b4\uc694. \ud638\uc8fc \uac00\uc871\ubc95\uc6d0 \ud56d\uc18c\ubd80\uc758 \uacb0\ub860\uc740 \ub2e8\ud638\ud588\uc5b4\uc694. \ubcc4\uac70 \ud6c4 \uc0c1\uc18d \uc7ac\uc0b0\ub3c4 \uc804\uccb4 s 79 \ud480\uc5d0 \ud3ec\ud568\ud560 \uc7ac\ub7c9\uc774 \ubc95\uc6d0\uc5d0 \uc788\ub2e4\uace0 \ud655\uc778\ud588\uac70\ub4e0\uc694. \uacb0\uad6d \uc720\uc0b0\uc744 \ud569\uc0b0\ud55c \uc804\uccb4 \uc790\uc0b0\uc5d0\uc11c \uc7a5\ub798 \ud544\uc694 \uc694\uc18c\ub97c \ubc18\uc601\ud574 65% \ub300 35% \ubd84\ud560\uc744 \uadf8\ub300\ub85c \uc720\uc9c0\ud588\uc5b4\uc694.<\/p>\n<p class=\"doc-p\">\uac19\uc740 \ud574 \ub098\uc628 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2017/166.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Holland &amp; Holland<\/em> [2017] FamCAFC 166<\/a> \ud310\uacb0\ub3c4 \uacbd\uc885\uc744 \uc6b8\ub824\uc694. \ub0a8\ud3b8\uc774 \ubcc4\uac70 3\ub144 \ubc18 \ub4a4 \ubb34\ub2f4\ubcf4 $715,000 \ubd80\ub3d9\uc0b0\uc744 \uc0c1\uc18d\ubc1b\uc558\ub294\ub370\uc694. 1\uc2ec\uc740 \uc804 \uc544\ub0b4\uac00 \uae30\uc5ec\ud55c \ubc14 \uc5c6\ub2e4\ub294 \uc774\uc720\ub85c \uadf8 \ubd80\ub3d9\uc0b0\uc744 \ubd84\ud560 \ud480\uc5d0\uc11c \ube7c\uace0 \ub2e8\uc21c \uc7ac\uc815 \uc790\uc6d0(financial resource)\uc73c\ub85c\ub9cc \ubd24\uc5b4\uc694. \ud56d\uc18c\ubd80\ub294 \uc774 \ud310\uacb0\uc744 \uace7\ubc14\ub85c \ud30c\uae30\ud588\uc5b4\uc694. \ud604\uc874 \ubd80\ub3d9\uc0b0\uc744 \uc9c1\uc811 \uae30\uc5ec \uc720\ubb34\ub9cc\uc73c\ub85c \ub300\ucc28\ub300\uc870\ud45c \ubc16\uc73c\ub85c \ube7c\ub0b4\ub294 \uac74 \ubc95\ub9ac \uc624\ub958\ub77c\uace0 \ubcf8 \uac70\uc608\uc694. \ud63c\uc778 \ub9d0\uae30 \uc0c1\uc18d\uc744 \ub530\ub85c \uc0b4\ud540 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCA/1991/86.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Bonnici<\/em> [1991] FamCA 86<\/a> \ubc95\ub9ac\uc5d0 \ube44\ucd94\uc5b4 \ubd10\ub3c4 \uae30\uc874 \uacf5\ub3d9 \uc790\uc0b0\uc774 \uc801\uac70\ub098 \uc7a5\ub798 \uc0ac\uc815(s 79(5) \u00b7 s 90SM(5)) \uaca9\ucc28\uac00 \ud06c\uba74 \uc0c1\uc18d \uc7ac\uc0b0 \uc77c\ubd80\uac00 \ub118\uc5b4\uac08 \uc704\ud5d8\uc740 \ub298 \uc5f4\ub824 \uc788\uc5b4\uc694.<\/p>\n<h2 id=\"\ubcc4\uac70-\ud6c4-\ub2f9\ucca8\ub41c-\ub85c\ub610-600\ub9cc500\ub9cc\ub3c4-\uc608\uc678\uac00-\uc544\ub2c8\uc5c8\uc5b4\uc694\" class=\"doc-h2\">\ubcc4\uac70 \ud6c4 \ub2f9\ucca8\ub41c \ub85c\ub610 $600\ub9cc\u00b7$500\ub9cc\ub3c4 \uc608\uc678\uac00 \uc544\ub2c8\uc5c8\uc5b4\uc694<\/h2>\n<p class=\"doc-p\">\ubcc4\uac70 \ub4a4 \ub0b4 \ub3c8\uc73c\ub85c \uc0b0 \ubcf5\uad8c \ub2f9\ucca8\uae08\uae4c\uc9c0 \ub2e4\ud23c\uc774 \ub41c\ub2e4\uba74 \ubbff\uc5b4\uc9c0\uc2dc\ub098\uc694? \uc6b0\uc5f0\ud55c \ud6a1\uc7ac\uc218(windfall) \uc55e\uc5d0\uc11c\ub3c4 \uc885\uacb0\uc744 \ubbf8\ub8ec \ub300\uac00\ub294 \ubb34\uac70\uc6cc\uc694. <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2014/191.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Eufrosin &amp; Eufrosin<\/em> [2014] FamCAFC 191<\/a> \uc0ac\uac74\uc5d0\uc11c\ub294 \uc544\ub0b4\uac00 \ubcc4\uac70 6\uac1c\uc6d4 \ub4a4 $600\ub9cc($6 million) \ub85c\ub610\uc5d0 \ub2f9\ucca8\ub410\uc5b4\uc694. \ud56d\uc18c\ubd80\ub294 \ub0a8\ud3b8\uc758 \ubcf5\uad8c \uad6c\ub9e4 \uae30\uc5ec\ub3c4\ub97c \uc601(0%)\uc73c\ub85c \ubd24\uc5b4\uc694. \uadf8\ub7fc \ub0a8\ud3b8\uc740 \ube48\uc190\uc774\uc5c8\uc744\uae4c\uc694? \uc804\ud600 \uc544\ub2c8\uc5d0\uc694. \ub178\ud6c4 \uc790\uc0b0\uc774 \uc5c6\ub358 \ub0a8\ud3b8\uacfc\uc758 \uc7a5\ub798 \uacbd\uc81c\ub825 \uaca9\ucc28\ub97c \uc774\uc720\ub85c \ub2f9\ucca8\uae08 \uc911 $500,000\ub97c \uc9c0\uae09\ud558\ub77c\uace0 \uba85\ub839\ud588\uc8e0.<\/p>\n<p class=\"doc-p\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCA/2000/1615.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Farmer &amp; Bramley<\/em> [2000] FamCA 1615<\/a> \uc0ac\uac74\uc740 \ub354 \uadf9\uc801\uc774\uc5d0\uc694. \ud5e4\uc5b4\uc9c8 \ub54c\ub294 \ub098\ub20c \uc7ac\uc0b0\uc774 \uac70\uc758 \uc5c6\uc5c8\uc5b4\uc694. \uadf8\ub7f0\ub370 \ubcc4\uac70 \uc57d 18\uac1c\uc6d4 \ub4a4 \ub0a8\ud3b8\uc774 $500\ub9cc($5 million) \ub85c\ub610\uc5d0 \ub2f9\ucca8\ub410\uc8e0. \ubc95\uc6d0\uc740 \ud63c\uc778 \uc911 \uc544\ub0b4\uac00 \ub0a8\ud3b8\uc758 \uc911\ub3c5 \uc7ac\ud65c\uc744 \ub3d5\uace0 \uc790\ub140\ub97c \ub3cc\ubcf8 \uae30\uc5ec\uc640 \uc0dd\uacc4 \ud544\uc694\ub97c \uc778\uc815\ud574 \ub2f9\ucca8\uae08\uc758 15%\uc778 $750,000\ub97c \uc804 \uc544\ub0b4\uc5d0\uac8c \uc8fc\ub77c\uace0 \ud310\uacb0\ud588\uc5b4\uc694. \ub098\ub20c \ub3c8\uc774 \uc5c6\ub2e4\uace0 \uc885\uacb0 \uc11c\ub958\ub97c \ubbf8\ub8ec \ube48\ud2c8\uc774 \uac70\uc561 \uccad\uad6c\uc11c\ub85c \ub3cc\uc544\uc628 \uc148\uc774\uc5d0\uc694.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">\uc8fc\uc694 \uc7c1\uc810 \ubc0f \uc2e4\uc81c \ud310\ub840<\/th><th style=\"text-align:left\">\ubcc4\uac70 \ud6c4 \uacbd\uacfc \ubc0f \uaddc\ubaa8<\/th><th style=\"text-align:left\">\uc7ac\ud310\ubd80 \ud575\uc2ec \ubc95\ub9ac \ubc0f \ucd5c\uc885 \uacb0\ub860<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>\ud3c9\uac00 \uc2dc\uc810 \uc6d0\uce59<\/strong> (s 79(3)(a) \u00b7 s 90SM(3)(a))<\/td><td style=\"text-align:left\">\ubcc4\uac70 \ud6c4 \uc911\uc704 4\ub144 \uacf5\ubc31 (ABS 2025)<\/td><td style=\"text-align:left\">\ubcc4\uac70\uc77c \uace0\uc815 \ubd80\uc815 \u00b7 \uc2ec\ub9ac\uc77c\u00b7\ud569\uc758 \ud655\uc815 \uc2dc\uc810\uc758 \ud604\uc874 \uc790\uc0b0\u00b7\ubd80\ucc44 \uc804\uccb4 \ud3b8\uc785<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ubcc4\uac70 \ud6c4 \ubd80\uce5c \uc720\uc0b0<\/strong> (<em>Calvin &amp; McTier<\/em> [2017] FamCAFC 125)<\/td><td style=\"text-align:left\">\ubcc4\uac70 4\ub144 \ud6c4 $430,686 (\uc804\uccb4\uc758 32%)<\/td><td style=\"text-align:left\">\ub2e8\uc77c s 79 \ud480 \ud3b8\uc785 \uc801\ubc95 \ud655\uc778 \u00b7 \uc7a5\ub798 \ud544\uc694 \ubc18\uc601\ud574 65% \ub300 35% \ubd84\ud560 \uc720\uc9c0<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ubcc4\uac70 \ud6c4 \ubd80\ub3d9\uc0b0 \uc0c1\uc18d<\/strong> (<em>Holland &amp; Holland<\/em> [2017] FamCAFC 166)<\/td><td style=\"text-align:left\">\ubcc4\uac70 3.5\ub144 \ud6c4 \ubb34\ub2f4\ubcf4 $715,000<\/td><td style=\"text-align:left\">\ub2e8\uc21c \uc7ac\uc815 \uc790\uc6d0\uc73c\ub85c \uc81c\uc678\ud55c 1\uc2ec \ud30c\uae30 \u00b7 \ubc95\ub960\uc0c1 \ud604\uc874 \uc7ac\uc0b0\uc73c\ub85c \uc804\uc561 \uc0b0\uc785<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ubcc4\uac70 \ud6c4 $600\ub9cc \ub85c\ub610<\/strong> (<em>Eufrosin<\/em> [2014] FamCAFC 191)<\/td><td style=\"text-align:left\">\ubcc4\uac70 6\uac1c\uc6d4 \ud6c4 \uc544\ub0b4 $6,000,000<\/td><td style=\"text-align:left\">\uad6c\ub9e4 \uae30\uc5ec\ub3c4\ub294 0%\uc774\ub098 \uc591\uce21 \uc7a5\ub798 \uacbd\uc81c\ub825 \uaca9\ucc28 \uadfc\uac70 $500,000 \uc9c0\uae09 \uba85\ub839<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ubb34\uc790\uc0b0 \ubcc4\uac70 \ud6c4 $500\ub9cc \ub85c\ub610<\/strong> (<em>Farmer &amp; Bramley<\/em> [2000] FamCA 1615)<\/td><td style=\"text-align:left\">\ubcc4\uac70 \uc57d 18\uac1c\uc6d4 \ud6c4 \ub0a8\ud3b8 $5,000,000<\/td><td style=\"text-align:left\">\ud63c\uc778 \uc911 \ub0b4\uc870\u00b7\uc591\uc721 \uae30\uc5ec\uc640 \uc0dd\uacc4 \ud544\uc694 \ubc18\uc601\ud574 15%($750,000) \ubc30\ubd84 \ud655\uc815<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"\uc0ac\uc801-\uac01\uc11c\uc758-\ud55c\uacc4\uc640-4950-\uc815\uc561-\ud569\uc758\uba85\ub839\uc73c\ub85c-\ubb38\uc744-\ub2eb\ub294-\ubc95\" class=\"doc-h2\">\uc0ac\uc801 \uac01\uc11c\uc758 \ud55c\uacc4\uc640 $4,950 \uc815\uc561 \ud569\uc758\uba85\ub839\uc73c\ub85c \ubb38\uc744 \ub2eb\ub294 \ubc95<\/h2>\n<p class=\"doc-p\">\ubd80\ubd80\ub07c\ub9ac \uc4f4 \uac01\uc11c\ub294 \ud638\uc8fc \uac00\uc871\ubc95\uc0c1 \uc885\uacb0 \ud6a8\ub825(clean break)\uc774 \uc5c6\uc5b4\uc694. \uc815\uc2dd \ubc95\uc6d0 \uba85\ub839 \uc5c6\uc774 \uc9d1 \uba85\uc758\ub97c \ub118\uae30\uba74 \uc218\ub9cc \ub2ec\ub7ec\uc758 \uc778\uc9c0\uc138(Stamp Duty) \uba74\uc81c\ub3c4 \ubabb \ubc1b\uc8e0. \ubc95\ub960\ud63c \ubd80\ubd80\uac00 \uc774\ud63c\ud558\uc9c0 \uc54a\uc740 \ucc44 \ubcc4\uac70\ub9cc \uc720\uc9c0\ud558\uba74 s 44(3) 12\uac1c\uc6d4 \uc81c\ucc99\uae30\uac04 \uc2dc\uacc4\uc870\ucc28 \uba48\ucdb0 \uc788\uc5b4\uc694. 10\ub144\uc774 \ud758\ub7ec\ub3c4 \uc0c1\ub300\ubc29\uc774 \uc18c\uc7a5\uc744 \ub0bc \uc218 \uc788\ub2e4\ub294 \uc598\uae30\uc608\uc694.<\/p>\n<p class=\"doc-p\">\ud574\ubc95\uc740 \ub450 \uac08\ub798\uc608\uc694. \uc774\ubbf8 \ud070 \ud2c0\uc5d0\uc11c \ud569\uc758\uac00 \ub410\ub2e4\uba74 \ubc15\uc564\ucf54 \uc815\uc561 \ud569\uc758\uba85\ub839(Consent Orders) \ud328\ud0a4\uc9c0($4,950 \uc815\uc561 \uc218\uc784\ub8cc + \ubc95\uc6d0 \uc218\uc218\ub8cc $215)\ub85c \uc989\uc2dc \uc7a0\uac00 \ub450\ub294 \ud3b8\uc774 \uac00\uc7a5 \uacbd\uc81c\uc801\uc774\uc5d0\uc694. \ucd9c\uc11d \uc5c6\uc774 \uc57d 4\uc8fc \uc11c\uba74 \uc2ec\uc0ac\ub85c \uc601\uad6c \uc9d1\ud589\ub825\uacfc \uc778\uc9c0\uc138 \uba74\uc81c \ubc0f \ud1f4\uc9c1\uc5f0\uae08 \uc218\ud0c1\uc790 28\uc77c \uc0ac\uc804 \ud1b5\uc9c0\uae4c\uc9c0 \ud55c \ubc88\uc5d0 \ub05d\ub098\uc694. \ubc18\ub300\ub85c \uc0c1\uc18d\uc774\ub098 \uc790\uc0b0 \uc0c1\uc2b9\uc774 \uc608\uc0c1\ub418\ub294\ub370 \uc804 \ubc30\uc6b0\uc790\uac00 \uc5f0\ub77d\uc744 \ud53c\ud558\uba70 \ubc84\ud2f4\ub2e4\uba74 \uae30\ub2e4\ub9ac\uc9c0 \ub9c8\uc138\uc694. \uace7\ubc14\ub85c \ubcc0\ud638\uc0ac \uba85\uc758\uc758 s 71B \u00b7 s 90RI \uc7ac\uc0b0\uacf5\uac1c \uc694\uad6c \ubc0f \ud569\uc758 \ucd5c\uace0\uc7a5\uc744 \ubcf4\ub0b4 \ud604\uc7ac \uc790\uc0b0 \uaddc\ubaa8\uc5d0\uc11c \ubb38\uc744 \ub2eb\ub294 \uae38\uc774 \ub0b4 \ubaab\uc744 \uc9c0\ucf1c \uc918\uc694.<\/p>\n<h2 id=\"\ubbf8\ub904-\ub454-\uc7ac\uc0b0-\uc815\ub9ac-\ub0b4-\uc790\uc0b0\uc774-\ub354-\ucee4\uc9c0\uae30-\uc804\uc5d0-\ub9c8\ubb34\ub9ac\ud558\uc138\uc694\" class=\"doc-h2\">\ubbf8\ub904 \ub454 \uc7ac\uc0b0 \uc815\ub9ac, \ub0b4 \uc790\uc0b0\uc774 \ub354 \ucee4\uc9c0\uae30 \uc804\uc5d0 \ub9c8\ubb34\ub9ac\ud558\uc138\uc694<\/h2>\n<p class=\"doc-p\">\ubcc4\uac70 \ud6c4 \ud750\ub974\ub294 \uc2dc\uac04\uc740 \uacb0\ucf54 \ub0b4 \ud3b8\uc774 \uc544\ub2c8\uc5d0\uc694. \uc5f4\ub824 \uc788\ub294 \uc7ac\uc0b0\ubd84\ud560\uc758 \ubb38\uc740 \uc131\uc2e4\ud788 \uc790\uc0b0\uc744 \ubd88\ub9ac\ub294 \uc0ac\ub78c\uc5d0\uac8c \ub9e4\uc77c \ucee4\uc9c0\ub294 \uc7a0\uc7ac \ubd80\ucc44\uc640 \uac19\uac70\ub4e0\uc694. \uc774\uba54\uc77c \ubb38\ub2f5\uc73c\ub85c \uc18c\uc911\ud55c \uc2dc\uac04\uc744 \ud5c8\ube44\ud558\uc9c0 \ub9c8\uc138\uc694. \ubc15\uc564\ucf54 \uac00\uc871\ubc95 \uc804\uc6a9 \uc628\ub77c\uc778 \uc9c8\ubb38\uc9c0(<a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\uac00\uc871\ubc95 \uc0ac\uc548 \uc811\uc218 \ubc14\ub85c\uac00\uae30<\/a>)\ub098 \uacf5\uc2dd \ud1b5\ud569 \uc548\ub0b4 \ucc3d\uad6c(<a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ubc15\uc564\ucf54 \uacf5\uc2dd \ub9c1\ud06c \ud5c8\ube0c<\/a>)\uc5d0 \ubcc4\uac70 \uc2dc\uc810\uacfc \uc790\uc0b0 \uc724\uacfd\uc744 \ub0a8\uaca8 \uc8fc\uc138\uc694. \uc774\ud574\ucda9\ub3cc \ud655\uc778 \ud6c4 \uc815\uc561 \ud569\uc758\uba85\ub839\uc73c\ub85c \uc7a0\uae00 \uc0ac\uc548\uc778\uc9c0 \ucd5c\uace0\uc7a5\uc73c\ub85c \ud14c\uc774\ube14\uc744 \uc5f4 \uc0ac\uc548\uc778\uc9c0 \uc2e4\uc775 \uae30\uc900\uc73c\ub85c \uc9da\uc5b4 \ub4dc\ub9b4\uac8c\uc694.<\/p>\n\n          <div class=\"col-sources-box\">\n            \uadfc\uac70 \ubc95\ub839 \ubc0f \ud310\ub840: Family Law Act 1975 ss 79(3)\u2013(5), 81, 90SM \u00b7 ABS Marriages and Divorces 2025 \u00b7 Calvin &amp; McTier [2017] FamCAFC 125 \u00b7 Holland &amp; Holland [2017] FamCAFC 166 \u00b7 Bonnici [1991] FamCA 86 \u00b7 Eufrosin [2014] FamCAFC 191 \u00b7 Farmer &amp; Bramley [2000] FamCA 1615.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#E6C98C;\">\ud63c\uc790 \uc9c4\ud589\uc744 \uba48\ucd94\uace0 \ubcc0\ud638\uc0ac\ub97c \ucc3e\uc544\uc57c \ud558\ub294 \uc21c\uac04 \u00b7 \uac00\uc871\ubc95<\/span>\n            <h3 class=\"col-cta-title\">\ud569\uc758\ub41c \uc870\uac74\uc744 \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950)\uc73c\ub85c \ud655\uc815\ud558\uace0 \uc2f6\uac70\ub098 \uc5f0\ub77d\uc744 \ud53c\ud558\ub294 \ubc30\uc6b0\uc790\uc640 \uc7ac\uc0b0\ubd84\ud560 \ud611\uc0c1\uc744 \uc2dc\uc791\ud574\uc57c \ud569\ub2c8\uae4c?<\/h3>\n            <p class=\"col-cta-desc\">\ub2e8\uc21c \uc628\ub77c\uc778 \uc774\ud63c \uc2e0\uccad\uc740 \ud3ec\ud138 \uc124\uba85\uc11c\ub97c \ubcf4\uace0 \uc9c1\uc811 \uc9c4\ud589\ud558\uba74 \uc218\ucc9c \ub2ec\ub7ec\ub97c \uc544\ub07c\uc2e4 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \ubc18\uba74 \ubc95\uc801 \ud6a8\ub825\uc774 \uc788\ub294 \uc7ac\uc0b0\u00b7\uc591\uc721 \ud569\uc758\uba85\ub839(Consent Orders) \uc791\uc131\uc774\ub098 \uc5f0\ub77d\uc744 \ud53c\ud558\ub294 \ubc30\uc6b0\uc790\uc758 \uc7ac\uc0b0 \uacf5\uac1c \uc694\uad6c\u00b7\ud55c\uad6d\uacfc \ud638\uc8fc\uc5d0 \uac78\uce5c \uc7ac\uc0b0\ubd84\ud560\uc774 \ud544\uc694\ud560 \ub54c\ub294 3\ubd84 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \ud575\uc2ec \ub0a0\uc9dc\uc640 \uc7ac\uc0b0 \ub0b4\uc5ed\uc744 \ub0a8\uaca8 \uc8fc\uc2ed\uc2dc\uc624.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">\uac00\uc871\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../files/KO/PDF/03_Family_Law_Divorce_Property_Parenting_and_Settlement_Manual_2026_KO.pdf\" download class=\"col-btn-ghost\">03 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc694\uc57d PDF \ubc1b\uae30<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">\ubc15\uc564\ucf54 \uacf5\uc2dd \uc0c1\ub2f4 \ub9c1\ud06c \ud5c8\ube0c<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">\ubc95\ub960 \uc548\ub0b4: \uc774 \uce7c\ub7fc\uc740 \ud638\uc8fc \uc5f0\ubc29 \uac00\uc871\ubc95(Family Law Act 1975)\uacfc \uacf5\uc2dd \ud1b5\uacc4\u00b7\ud310\ub840\ub97c \ubc14\ud0d5\uc73c\ub85c \uc54c\uae30 \uc27d\uac8c \uc815\ub9ac\ud55c \uc77c\ubc18 \ubc95\ub960 \uc815\ubcf4\uc785\ub2c8\ub2e4. \uac1c\ubcc4 \uc0ac\uac74\uc5d0 \ub300\ud55c \ubc95\ub960 \uc790\ubb38\uc774\ub098 \uc218\uc784 \uacc4\uc57d \uc131\ub9bd\uc744 \ub73b\ud558\uc9c0 \uc54a\uc73c\ubbc0\ub85c \uc774\ud63c \ud6c4 12\uac1c\uc6d4\u00b7\uc0ac\uc2e4\ud63c \uacb0\ubcc4 \ud6c4 2\ub144 \ub9c8\uac10 \uae30\ud55c\uc774\ub098 \ube44\uc790 \uae30\ud55c\uc774 \uc784\ubc15\ud588\ub2e4\uba74 \uc9c0\uccb4 \uc5c6\uc774 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uac80\ud1a0\ub97c \ubc1b\uc544 \ubcf4\uc2dc\uae30 \ubc14\ub78d\ub2c8\ub2e4.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">\ud568\uaed8 \uc77d\uc73c\uba74 \uc88b\uc740 \uac00\uc871\ubc95 \ud310\ub840 \uce7c\ub7fc<\/h3>\n        <a href=\"../../?lang=ko&amp;tab=family\" class=\"col-back-link num\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../property-reforms-2026/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">2025\u20132026 \uac1c\uc815 \ud574\uc124 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 01<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \uac00\uc871\ubc95 \uc7ac\uc0b0\ubd84\ud560 \uac1c\ud3b8 \ud575\uc2ec: \uacbd\uc81c\uc801 \ud559\ub300 \ubc18\uc601, \ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ud574\uc678\uc790\uc0b0, \ubc18\ub824\ub3d9\ubb3c \ubc0f \uc81c\ucc99\uae30\uac04 \ucd1d\uc815\ub9ac<\/h4><p class=\"col-sib-desc\">\uc774\ubbf8 \uc18c\ube44\ub41c \uc7ac\uc0b0 \ud569\uc0b0(Add-backs) \ud3d0\uc9c0, \uacbd\uc81c\uc801 \ud559\ub300 \ubc18\uc601, \ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ud55c\uad6d \uc790\uc0b0 \uacf5\uac1c \uc758\ubb34, \ubc18\ub824\ub3d9\ubb3c \uadc0\uc18d \uae30\uc900, 12\uac1c\uc6d4\u00b72\ub144 \uc7ac\uc0b0\ubd84\ud560 \uc81c\ucc99\uae30\uac04\uc744 \uccb4\uacc4\uc801\uc73c\ub85c \uc815\ub9ac\ud588\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../divorce-parenting-reality-guide/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc2e4\uc804 \uac00\uc774\ub4dc \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 02<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \uc774\ud63c \uc808\ucc28\uc640 \uc7ac\uc0b0\ubd84\ud560\u00b7\uc591\uc721\uad8c, \ubcc0\ud638\uc0ac \uc120\uc784 \uc804 \ubc18\ub4dc\uc2dc \uc54c\uc544\uc57c \ud560 \ud604\uc2e4 \uae30\uc900<\/h4><p class=\"col-sib-desc\">\uc678\ub3c4 \uc704\uc790\ub8cc\uc5d0 \ub300\ud55c \uc624\ud574\uc640 \uac04\uc18c\ud654\ub41c \uc11c\uba74 \uc774\ud63c \uc808\ucc28 \ubc0f \ubc18\ubc18 \uacf5\ub3d9\uc591\uc721 \ucd94\uc815 \ud3d0\uc9c0 \ubc95\ub9ac\ub97c \uc9da\uace0 \uc18c\uc561 \uc7ac\uc0b0 \uc0ac\uac74(\u2264$550k)\uacfc \uc815\uc561 \ud569\uc758\uba85\ub839($4,950)\uc758 \uc190\uc775 \uae30\uc900\uc744 \ube44\uad50\ud569\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../partner-visa-breakdown-crossborder/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc774\ubbfc\u00b7\uac00\uc871\ubc95 \uad50\ucc28 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 03<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \ud30c\ud2b8\ub108\ube44\uc790 \uc9c4\ud589 \uc911 \uacb0\ubcc4\u00b7\uac00\uc815\ud3ed\ub825\uacfc \ud55c\u00b7\ud638 \uad6d\uc81c \uc7ac\uc0b0\ubd84\ud560 \uc2e4\uc804 \ub300\ucc98\ubc95<\/h4><p class=\"col-sib-desc\">\ubc30\uc6b0\uc790\uc758 \ube44\uc790 \ucde8\uc18c \uc704\ud611 \ub300\uc751 \uc6d0\uce59\ubd80\ud130 \uac00\uc815\ud3ed\ub825 \uc601\uc8fc\uad8c \ud2b9\ub840 \uc694\uac74\uacfc \ud55c\u00b7\ud638 \uc591\uad6d \uc790\uc0b0 \uc815\ub9ac \ubc0f \ub3d9\uc758 \uc5c6\ub294 \uc544\ub3d9 \ud574\uc678 \uc774\ub3d9 \uae08\uc9c0 \ubc95\ub9ac\uae4c\uc9c0 \uc885\ud569 \ud574\uc124\ud569\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../parental-advances-loans-gifts-divorce/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubd80\ubaa8 \uc9c0\uc6d0\uae08\u00b7\ucc28\uc6a9\uc99d \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 14<\/span><h4 class=\"col-sib-title\">\ud55c\uad6d \ubd80\ubaa8\ub2d8\uc774 \ubcf4\ud0dc\uc900 \uc9d1\uac12 3\uc5b5, \ud638\uc8fc \uc774\ud63c\ud560 \ub54c \ub3cc\ub824\uc904 \ub300\uc5ec\uae08\uc77c\uae4c \ub098\ub20c \uc99d\uc5ec\uc77c\uae4c<\/h4><p class=\"col-sib-desc\">\ud55c\uad6d\u00b7\ud638\uc8fc \ubd80\ubaa8\ub2d8\uc774 \uc9d1 \uc0b4 \ub54c \ubcf4\ud0dc\uc8fc\uc2e0 \ub3c8\uc774 \uac1a\uc544\uc57c \ud560 \ube5a\uc73c\ub85c \uba3c\uc800 \ube60\uc9c0\ub294 \uacbd\uc6b0\uc640 \ubd80\ubd80 \uc7ac\uc0b0\uc5d0 \uc11e\uc774\ub294 \ucc28\uc774\ub97c \uc2e4\uc81c \ud310\ub840\ub85c \uc54c\uae30 \uc27d\uac8c \ube44\uad50\ud588\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../family-trusts-companies-valuation-divorce/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uac00\uc871\uc2e0\ud0c1\u00b7\ubc95\uc778\uac10\uc815 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 15<\/span><h4 class=\"col-sib-title\">\uc7ac\uc0b0\uc744 \uac00\uc871\uc2e0\ud0c1(Family Trust)\uc774\ub098 Pty Ltd \ubc95\uc778\uc5d0 \ub123\uc5b4\ub450\uba74 \uc774\ud63c \uc7ac\uc0b0\ubd84\ud560\uc5d0\uc11c \uc548\uc804\ud560\uae4c<\/h4><p class=\"col-sib-desc\">\ub204\uac00 \uc2e0\ud0c1\uc758 \uc2e4\uc81c \uacb0\uc815\uad8c(Appointor)\uc744 \uc950\uace0 \uc788\ub294\uc9c0 \ub530\uc9c0\ub294 \uae30\uc900\ubd80\ud130 \uacf5\ub3d9 \uac10\uc815\uc778 \uc808\ucc28\uc640 \ubc95\uc778 \ub3c8\uc744 \uc62e\uae38 \ub54c \uc138\uae08\uc744 \uc544\ub07c\ub294 \ubc29\ubc95\uae4c\uc9c0 \uc9da\uc5b4 \ub4dc\ub9bd\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../prenups-bfa-vs-consent-orders/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ud63c\uc804\uacc4\uc57d BFA \ub300 \ud569\uc758\uba85\ub839 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 17<\/span><h4 class=\"col-sib-title\">\ubcc0\ud638\uc0ac \uc99d\uba85\uc11c\uae4c\uc9c0 \ubd99\uc778 \ud63c\uc804\uacc4\uc57d\uc11c(BFA)\uac00 \ub300\ubc95\uc6d0\uc5d0\uc11c \uae68\uc9c4 \uc774\uc720: \uc7ac\uc0b0\ubd84\ud560 \ud569\uc758\uc11c(BFA) \ub300 \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950) \uc120\ud0dd \uae30\uc900<\/h4><p class=\"col-sib-desc\">\uacb0\ud63c\u00b7\ub3d9\uac70 \uc804\uc5d0 \uc7ac\uc0b0\uc744 \uc548\uc804\ud558\uac8c \uc9c0\ud0a4\ub294 BFA \uc791\uc131 \uc694\ub839\uacfc \uc774\ubbf8 \ud5e4\uc5b4\uc9c4 \ubd80\ubd80\uac00 \uc591\ucabd \ubcc0\ud638\uc0ac\ube44\uac00 \ub4dc\ub294 BFA \ub300\uc2e0 \uc815\uc561 \ud569\uc758\uba85\ub839\uc744 \uace8\ub77c\uc57c \ud558\ub294 \uc774\uc720\ub97c \ube44\uad50\ud588\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../de-facto-threshold-disputes-out-of-time-s44/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc0ac\uc2e4\ud63c \uacbd\uacc4\u00b7\uae30\ud55c\ub3c4\uacfc \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 18<\/span><h4 class=\"col-sib-title\">\ub3d9\uac70\ub294 \uc548 \ud558\uace0 \uc0dd\ud65c\ube44\ub9cc \uc92c\ub294\ub370 \uc0ac\uc2e4\ud63c(De Facto) \uc18c\uc1a1\uc774 \ub4e4\uc5b4\uc654\ub2e4\uba74: \uc0ac\uc2e4\ud63c \uc778\uc815 \uae30\uc900(s 4AA)\uacfc \ub9c8\uac10 \uae30\ud55c \uc608\uc678 \uc2e0\uccad(s 44)<\/h4><p class=\"col-sib-desc\">\ub2e8\uc21c \uc5f0\uc778 \uad00\uacc4\uc640 \ubc95\uc801 \uc0ac\uc2e4\ud63c\uc744 \uac00\ub974\ub294 &#x27;\ud558\ub098\uc758 \uc0b6(Coupledom)&#x27; \uae30\uc900\ubd80\ud130 \uae30\ud63c\uc790\uc640\uc758 \uc774\uc911 \uc0ac\uc2e4\ud63c, \ub9c8\uac10 \uae30\ud55c\uc774 \uc9c0\ub09c \uc0ac\uac74\uc758 \ub300\uc751\ubc95\uae4c\uc9c0 \uc27d\uac8c \uc815\ub9ac\ud588\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}, "en": {"doc_title": "Why Delaying Consent Orders Exposes Post-Separation Inheritances, Lotto Wins and New Equity \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">All Guides Hub<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=en\">Visa Solution Guide<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=en\">Employment Navigator<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=en\">DIY & Cost-Smart Guide<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/?lang=en\" target=\"_blank\" rel=\"noopener\">Consult Park & Co \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=en&amp;tab=family\" class=\"col-back-btn\">\u2190 Back to Family Law Self-Help Hub<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">Park &amp; Co Lawyers \u00b7 Family Law Deep-Dive Column<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn\">KO<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn active\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">Consult Park &amp; Co \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">POST-SEPARATION WEALTH \u00b7 FAMILY 16<\/span>\n          <span class=\"col-verified-pill num\">Primary-Source Verified (Nov 2026)<\/span>\n          <span class=\"col-time-pill num\">8 min read<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">Why Delaying Consent Orders Exposes Post-Separation Inheritances, Lotto Wins and New Equity<\/h1>\n        <p class=\"col-subtitle\">Why courts value property at trial rather than separation, and lessons from Calvin &amp; McTier, Holland, Eufrosin and Farmer &amp; Bramley<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">Chang Min Park<\/div>\n            <div class=\"col-author-role\">Legal Practitioner Director, Park &amp; Co Lawyers \u00b7 Accredited Specialist in Immigration Law (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col16_fam_windfall_hero.jpg\" alt=\"Why Delaying Consent Orders Exposes Post-Separation Inheritances, Lotto Wins and New Equity\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">Because Australian courts value existing property at the date of hearing or formal settlement rather than separation, unfinalised breakups leave future inheritances and windfalls exposed.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">Date of Hearing<\/div><div class=\"col-stat-lbl\">Assets valued at trial or formal orders, NOT separation date (s 79(3)(a))<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">4 Yrs Post-Sep<\/div><div class=\"col-stat-lbl\">$430k paternal inheritance pulled into pool in Calvin &amp; McTier [2017]<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">$500k\u2013$750k Payouts<\/div><div class=\"col-stat-lbl\">Awarded to ex-spouses from post-separation Lotto wins (Eufrosin; Farmer)<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">In This Column<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#the-date-of-separation-myth-and-the-s-793a-valua\" class=\"col-toc-link lvl-2\">The date-of-separation myth and the s 79(3)(a) valuation rule<\/a><a href=\"#inheritances-years-after-separation-in-calvin-mc\" class=\"col-toc-link lvl-2\">Inheritances years after separation in Calvin &amp; McTier and Holland<\/a><a href=\"#post-separation-lotto-jackpots-in-eufrosin-and-f\" class=\"col-toc-link lvl-2\">Post-separation Lotto jackpots in Eufrosin and Farmer &amp; Bramley<\/a><a href=\"#rising-home-equity-compulsory-superannuation-and\" class=\"col-toc-link lvl-2\">Rising home equity, compulsory superannuation and asymmetrical risk<\/a><a href=\"#closing-the-asset-pool-early-with-consent-orders\" class=\"col-toc-link lvl-2\">Closing the asset pool early with consent orders or an s 71B demand<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">Open Family Law Consultation Form<\/a>\n              <a href=\"../../?lang=en&amp;tab=family\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 Back to Family Law Self-Help Hub<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">One of the costliest myths in Australian family law is the belief that moving out freezes the asset pool on the day you pack your bags. Separated couples regularly split bank cash at the kitchen table, swap car registrations, and walk away assuming whatever each person earns, buys, or inherits afterward is theirs alone. Australian Bureau of Statistics figures (<em>Marriages and Divorces, Australia, 2025<\/em>, July 2026) show how long people leave that risk open: couples separate at a median 9.4 years of marriage yet divorce at 13.4 years, a four-year gap. Without sealed Consent Orders or a compliant Financial Agreement, everything acquired across those years stays exposed.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 382\" width=\"100%\" role=\"img\" aria-label=\"What Happens When Separated Couples Delay Binding Consent Orders\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"381\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">VALUATION DATE RULE \u00b7 DATE OF HEARING NOT SEPARATION<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">What Happens When Separated Couples Delay Binding Consent Orders<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">Authorities: ABS 2025 (4-yr median gap) \u00b7 Calvin &amp; McTier [2017] \u00b7 Holland [2017] \u00b7 Eufrosin [2014] \u00b7 Farmer [2000]<\/text>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"38\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">UNFINALISED SEPARATION \u00b7 FULL POOL EXPOSURE<\/text>\n  <circle cx=\"42\" cy=\"144\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Inheritance 4 Yrs Post-Separation Pulled In<\/text>\n  <text x=\"54\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">Calvin &amp; McTier [2017]: $430k inheritance included; 65/35 split.<\/text>\n  <circle cx=\"42\" cy=\"196\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">$715k Inherited Property Not Quarantined<\/text>\n  <text x=\"54\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">Holland [2017]: Full Court overturned exclusion of post-sep estate.<\/text>\n  <circle cx=\"42\" cy=\"248\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Post-Separation Lotto Wins Exposed ($5M\u2013$6M)<\/text>\n  <text x=\"54\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">Eufrosin ($500k) &amp; Farmer ($750k) awarded ex-spouses future-needs payouts.<\/text>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1.3\"/>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#1D6B48\"/>\n  <text x=\"466\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">CLEAN BREAK \u00b7 COURT-SEALED CONSENT ORDERS<\/text>\n  <circle cx=\"470\" cy=\"144\" r=\"4\" fill=\"#1D6B48\"/>\n  <text x=\"482\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Permanent Clean-Break Finality (s 81)<\/text>\n  <text x=\"482\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">Insulates future inheritances, business growth &amp; property equity forever.<\/text>\n  <circle cx=\"470\" cy=\"196\" r=\"4\" fill=\"#1D6B48\"/>\n  <text x=\"482\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Fixed-Fee Package ($4,950 + $215 Court Fee)<\/text>\n  <text x=\"482\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">Sealed on the papers in ~4 weeks with zero courtroom appearances + duty relief.<\/text>\n  <circle cx=\"470\" cy=\"248\" r=\"4\" fill=\"#1D6B48\"/>\n  <text x=\"482\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Silent Ex-Partner? Issue s 71B Demand Now<\/text>\n  <text x=\"482\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">Bring stonewalling ex-spouses to the table before asset values climb.<\/text>\n  <rect x=\"22\" y=\"328\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"351\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1D6B48\">Golden Rule: Informal transfers never close the s 79 pool. Seal Consent Orders early before post-separation wealth accumulates.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 1: Date-of-Separation Myth vs Date-of-Hearing Asset Pool Valuation Exposure<\/figcaption><\/figure>\n<h2 id=\"the-date-of-separation-myth-and-the-s-793a-valua\" class=\"doc-h2\">The date-of-separation myth and the s 79(3)(a) valuation rule<\/h2>\n<p class=\"doc-p\">Under s 79(3)(a) (for marriages) and s 90SM(3)(a) (for de facto couples) of the <em>Family Law Act 1975<\/em> (Cth), the Federal Circuit and Family Court of Australia (FCFCOA) values existing property and liabilities at the date of final hearing or formal settlement, never back at separation. Separation changes how post-breakup contributions are weighed. It does not close the books.<\/p>\n<p class=\"doc-p\">Leaving property unfinalised punishes whichever former partner works harder, invests well, or receives family wealth. Pay down a mortgage over four years, build 12% compulsory employer superannuation, or ride a capital gain on a post-separation Brisbane or Sydney townhouse, and that new equity goes onto the Step 1 schedule. Worse still, after <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2025/126.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Shinohara &amp; Shinohara<\/em> [2025] FedCFamC1A 126<\/a>, cash your ex-partner took in an informal split and already spent is no longer added back onto the balance sheet as notional property. You end up defending the surviving pool you built while arguing over percentage adjustments for money spent years earlier.<\/p>\n<h2 id=\"inheritances-years-after-separation-in-calvin-mc\" class=\"doc-h2\">Inheritances years after separation in Calvin &amp; McTier and Holland<\/h2>\n<p class=\"doc-p\">Beneficiaries are frequently shocked to learn that an estate distribution from a deceased parent or sibling years after separation enters the divisible pool. Appellate courts have consistently refused to treat post-separation inheritances as an automatically immune category.<\/p>\n<p class=\"doc-p\">In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2017/125.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Calvin &amp; McTier<\/em> [2017] FamCAFC 125<\/a>, a husband received a paternal inheritance four years after separating from an eight-year relationship, with $430,686 remaining at trial (roughly 32% of the total net pool). Dismissing his appeal, the Full Court held that judges retain broad discretion to include all existing property in a global s 79 pool regardless of when it arrived, upholding a 65% / 35% overall division after future-needs adjustments.<\/p>\n<p class=\"doc-p\">Three months later, <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2017/166.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Holland &amp; Holland<\/em> [2017] FamCAFC 166<\/a> shut down a popular fallback argument. Roughly 3.5 years post-separation, the husband inherited an unencumbered $715,000 house. The trial judge tried to quarantine it off the balance sheet as a mere &quot;financial resource&quot;. The Full Court overturned that ruling as an error of principle: vested title to real estate is existing property, never just a resource. Although a court may assess a late inheritance in a separate second pool on an asset-by-asset basis, as in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCA/1991/86.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Bonnici<\/em> [1991] FamCA 86<\/a>, that shelter only holds where the main marital pool already satisfies the other party&#x27;s contributions and s 79(5) or s 90SM(5) future needs.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">Post-Separation Event<\/th><th style=\"text-align:left\">Leading Appellate Authority<\/th><th style=\"text-align:left\">Pool Treatment &amp; Final Outcome<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Paternal Inheritance 4 Years Post-Separation<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2017/125.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Calvin &amp; McTier<\/em> [2017] FamCAFC 125<\/a><\/td><td style=\"text-align:left\">Remaining $430,686 (~32% of pool) included in global s 79 pool; 65% / 35% division upheld<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Inherited $715,000 House 3.5 Years Post-Separation<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2017/166.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Holland &amp; Holland<\/em> [2017] FamCAFC 166<\/a><\/td><td style=\"text-align:left\">Error of law to quarantine as a &quot;financial resource&quot;; vested real estate enters property pool<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Late-Marriage Inheritance With Ample Main Pool<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCA/1991/86.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Bonnici<\/em> [1991] FamCA 86<\/a><\/td><td style=\"text-align:left\">Separate pool shields inheritance only where main marital assets satisfy the other claim<\/td><\/tr><tr><td style=\"text-align:left\"><strong>$6 Million Lotto Win 6 Months Post-Separation<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2014/191.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Eufrosin &amp; Eufrosin<\/em> [2014] FamCAFC 191<\/a><\/td><td style=\"text-align:left\">Zero contribution by husband to ticket, yet awarded $500,000 from wife&#x27;s win for future needs<\/td><\/tr><tr><td style=\"text-align:left\"><strong>$5 Million Lotto Win ~18 Months Post-Separation<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCA/2000/1615.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Farmer &amp; Bramley<\/em> [2000] FamCA 1615<\/a><\/td><td style=\"text-align:left\">Wife awarded 15% ($750,000) reflecting unrewarded marital support and ongoing parenting needs<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"post-separation-lotto-jackpots-in-eufrosin-and-f\" class=\"doc-h2\">Post-separation Lotto jackpots in Eufrosin and Farmer &amp; Bramley<\/h2>\n<p class=\"doc-p\">Post-separation lottery cases illustrate how far s 79(5) and s 90SM(5) future-needs factors reach while financial ties remain open. Even where the non-winning ex-partner paid nothing toward the ticket, sharp capital disparities justify substantial payouts.<\/p>\n<p class=\"doc-p\">In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2014/191.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Eufrosin &amp; Eufrosin<\/em> [2014] FamCAFC 191<\/a>, a wife won $6 million in Lotto six months after a 20-year marriage ended. Placing the jackpot in a separate pool, the Full Court accepted the husband made zero contribution to the ticket yet still awarded him $500,000 for future needs, given his age of 62 and modest earning capacity beside her millions. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCA/2000/1615.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Farmer &amp; Bramley<\/em> [2000] FamCA 1615<\/a>, the husband won $5 million in Lotto roughly 18 months after an assetless 12-year marriage ended. Because the wife had supported him through addiction during the marriage and was raising their child in tight circumstances, the Full Court upheld awarding her 15% ($750,000) of his win.<\/p>\n<h2 id=\"rising-home-equity-compulsory-superannuation-and\" class=\"doc-h2\">Rising home equity, compulsory superannuation and asymmetrical risk<\/h2>\n<p class=\"doc-p\">Ordinary post-separation effort faces the exact same exposure without a lottery ticket. Suppose a couple splits $100,000 informally in 2022 without filing Consent Orders. One partner buys an apartment that gains $260,000 over three years while adding $60,000 in super; the other rents and spends their cash. Because the s 44(3) 12-month time bar for married couples never starts until a divorce order takes effect, an application filed years later sweeps today&#x27;s apartment equity and combined super onto the Step 1 table. Post-separation mortgage payments earn strong s 79(4) credit, yet passive market gains rarely stay untouched.<\/p>\n<h2 id=\"closing-the-asset-pool-early-with-consent-orders\" class=\"doc-h2\">Closing the asset pool early with consent orders or an s 71B demand<\/h2>\n<p class=\"doc-p\">Delaying formal orders hands your ex-partner a free call option over your future savings, property growth, and inheritances. Where separated couples agree on terms, Park &amp; Co converts handshake deals into Court-sealed Consent Orders for a $4,950 fixed fee (plus the $215 court fee), ending financial exposure on the papers in around four weeks without a hearing. Where an ex-partner stalls or ignores messages while your equity grows, we serve formal s 71B and s 90RI disclosure demands and move to finalise the pool. Lodge your dates and asset summary via the <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Family Law Consultation Form<\/a> or visit the <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Official Links Hub<\/a> to lock in finality.<\/p>\n\n          <div class=\"col-sources-box\">\n            Primary Authorities: Family Law Act 1975 (Cth) ss 79(3)\u2013(5), 81, 90SM \u00b7 ABS Marriages and Divorces 2025 \u00b7 Calvin &amp; McTier [2017] FamCAFC 125 \u00b7 Holland &amp; Holland [2017] FamCAFC 166 \u00b7 Bonnici [1991] FamCA 86 \u00b7 Eufrosin [2014] FamCAFC 191 \u00b7 Farmer &amp; Bramley [2000] FamCA 1615.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#E6C98C;\">WHEN TO CONSULT PARK &amp; CO LAWYERS \u00b7 FAMILY LAW<\/span>\n            <h3 class=\"col-cta-title\">Ready to Lock In $4,950 Consent Orders, Compel Disclosure, or Protect Family Assets?<\/h3>\n            <p class=\"col-cta-desc\">Save thousands on straightforward No-Fault Divorce using our DIY manual; when you need enforceable Consent Orders, formal financial disclosure demands, or cross-border property protection, submit your key dates via our 3-minute consultation form.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">Open Family Law Consultation Form<\/a>\n              <a href=\"../../files/EN/PDF/03_Family_Law_Divorce_Property_Parenting_and_Settlement_Manual_2026_EN.pdf\" download class=\"col-btn-ghost\">Download Manual 03 (Family Law PDF)<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=en\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">Park &amp; Co Official Consultation Hub<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">Legal Disclaimer: This publication provides general legal information grounded in Australian legislation, official statistics and superior court authorities current as at November 2026. It does not constitute legal advice for your specific circumstances or create a solicitor-client relationship. Seek formal advice promptly before statutory limitation or visa deadlines expire.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">More Curated Family Law Columns<\/h3>\n        <a href=\"../../?lang=en&amp;tab=family\" class=\"col-back-link num\">\u2190 Back to Family Law Self-Help Hub<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../property-reforms-2026/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">2025\u20132026 REFORM BRIEFING \u00b7 FAMILY 01<\/span><h4 class=\"col-sib-title\">Australia&#x27;s 2025\u20132026 Property Settlement Overhaul: Economic Abuse, Separate Accounts, Family Pets &amp; Limitation Bars<\/h4><p class=\"col-sib-desc\">Covers the abolition of balance-sheet add-backs, s 4AB(2A) economic abuse proof thresholds, separate accounts and overseas assets under s 71B, the ban on shared pet custody, and strict s 44 time bars.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../divorce-parenting-reality-guide/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PRACTICAL REALITY GUIDE \u00b7 FAMILY 02<\/span><h4 class=\"col-sib-title\">Divorce, Parenting &amp; Property in Australia: The Practical Reality Check Before You Hire a Lawyer<\/h4><p class=\"col-sib-desc\">Explains s 48 no-fault DIY divorce and June 2025 s 98A paper hearings, the repeal of equal-time parenting presumptions (Gallagher, Picard, Radecki), PPP &lt;=$550k vs $4,950 Consent Orders.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../partner-visa-breakdown-crossborder/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">FAMILY &amp; VISA INTERSECTION \u00b7 FAMILY 03<\/span><h4 class=\"col-sib-title\">Partner Visa Breakdown, Division 1.5 Family Violence PR &amp; Cross-Border Property Traps<\/h4><p class=\"col-sib-desc\">Why sponsors cannot cancel visas, clearing the Gupta genuine-relationship gate and July 2024 Subclass 309 entry rules, aligning FCFCOA and DHA affidavits, and avoiding s 65Y travel offences.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a><a href=\"../parental-advances-loans-gifts-divorce/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PARENTAL ADVANCES \u00b7 FAMILY 14<\/span><h4 class=\"col-sib-title\">The Bank of Mum and Dad in Australian Divorce: Repayable Loan, Resulting Trust or Gift?<\/h4><p class=\"col-sib-desc\">Distinguishes deductible balance-sheet debts from s 79(4) contributions, resulting trusts vs advancement presumptions, and third-party parent interventions.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../family-trusts-companies-valuation-divorce/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">TRUSTS &amp; VALUATIONS \u00b7 FAMILY 15<\/span><h4 class=\"col-sib-title\">Family Trusts, Private Pty Ltd Companies and Shadow Business Valuations in Property Settlements<\/h4><p class=\"col-sib-desc\">Covers appointor/trustee control vs genuine third-party partners (Ascot), mandatory Single Expert Witness rules, s 106B clawbacks, and tax-effective s 79 orders.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a><a href=\"../prenups-bfa-vs-consent-orders/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PRENUPS &amp; CONSENT ORDERS \u00b7 FAMILY 17<\/span><h4 class=\"col-sib-title\">Why Prenups Get Crushed Under Thorne v Kennedy and When $4,950 Consent Orders Beat a BFA<\/h4><p class=\"col-sib-desc\">Explains how pre-marital wealth-protection BFAs survive scrutiny and why separated couples who agree save thousands with fixed-fee $4,950 Court Consent Orders.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../de-facto-threshold-disputes-out-of-time-s44/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">DE FACTO &amp; TIME BARS \u00b7 FAMILY 18<\/span><h4 class=\"col-sib-title\">&quot;Were We Even De Facto?&quot; Litigating s 4AA Thresholds, Concurrent Marriages and Out-of-Time Leave<\/h4><p class=\"col-sib-desc\">Why a 17-year secret relationship with monthly allowances failed s 4AA, when concurrent marriages still allow de facto claims, and how courts weigh s 44 hardship and delay.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}}</script>

  /* 429-aware retry spanning >15s across retries to cleanly outlast Abacus 30;w=10 windows */
  function fetchRetry(url, isHit, attempt) {

        if (r.status === 429) {

        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();

      .catch(function (err) {

        if (tries < maxTries) {

            .then(function () { return fetchRetry(url, isHit, tries + 1); });
        }
        throw err;
      });
  }

        var slot = document.getElementById('vc-chart-slot');
        if (slot && !slot.querySelector('svg')) {
          slot.textContent = uiLang() === 'en' ? 'Could not load the chart.' : '그래프를 불러오지 못했습니다.';
        }
      });
  }

  function open() {
    activeRange = 7;
    modal.classList.add('open');
    loadAndRenderModal(true);
  }
  box.setAttribute('role', 'button');
  box.setAttribute('tabindex', '0');
  box.addEventListener('click', open);
  box.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
})();
  </script>
</body>
</html>
