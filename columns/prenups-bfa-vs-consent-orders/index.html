 <span class=\"col-topbar-brand\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \u00b7 \ud638\uc8fc \uac00\uc871\ubc95 \uc26c\uc6b4 \ud310\ub840 \uce7c\ub7fc<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn active\">\ud55c\uad6d\uc5b4<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">\uc628\ub77c\uc778 \uc0c1\ub2f4 \uc2e0\uccad \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">\ud63c\uc804\uacc4\uc57d BFA \ub300 \ud569\uc758\uba85\ub839 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 17<\/span>\n          <span class=\"col-verified-pill num\">1\ucc28 \ubc95\ub839\u00b7\ud310\ub840 \uac80\uc99d \uc644\ub8cc (2026.11)<\/span>\n          <span class=\"col-time-pill num\">\uc57d 8\ubd84 \uc18c\uc694<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">\ubcc0\ud638\uc0ac \uc99d\uba85\uc11c\uae4c\uc9c0 \ubd99\uc778 \ud63c\uc804\uacc4\uc57d\uc11c(BFA)\uac00 \ub300\ubc95\uc6d0\uc5d0\uc11c \uae68\uc9c4 \uc774\uc720: \uc7ac\uc0b0\ubd84\ud560 \ud569\uc758\uc11c(BFA) \ub300 \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950) \uc120\ud0dd \uae30\uc900<\/h1>\n        <p class=\"col-subtitle\">\uacb0\ud63c\uc2dd \uc9c1\uc804 \uc11c\uba85 \uac15\uc694\ub97c \ubb34\ud6a8\ub85c \ubcf8 Thorne v Kennedy \ub300\ubc95\uc6d0 \ud310\uacb0\uacfc \ubcc4\uac70 \ud6c4\uc5d0\ub294 $4,950 \ubc95\uc6d0 \ud569\uc758\uba85\ub839\uc774 \ud6e8\uc52c \uc720\ub9ac\ud55c \uc774\uc720<\/p>\n\n        <div class=\"col-byline\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">\ubc15\ucc3d\ubbfc \ub300\ud45c\ubcc0\ud638\uc0ac (Chang Min Park)<\/div>\n            <div class=\"col-author-role\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \ub300\ud45c\ubcc0\ud638\uc0ac \u00b7 \ud638\uc8fc \ud038\uc990\ub79c\ub4dc\uc8fc \ubcc0\ud638\uc0ac\ud68c \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac (QLS)<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col17_fam_bfa_hero.jpg\" alt=\"\ubcc0\ud638\uc0ac \uc99d\uba85\uc11c\uae4c\uc9c0 \ubd99\uc778 \ud63c\uc804\uacc4\uc57d\uc11c(BFA)\uac00 \ub300\ubc95\uc6d0\uc5d0\uc11c \uae68\uc9c4 \uc774\uc720: \uc7ac\uc0b0\ubd84\ud560 \ud569\uc758\uc11c(BFA) \ub300 \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950) \uc120\ud0dd \uae30\uc900\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">\uacb0\ud63c\u00b7\ub3d9\uac70 \uc804 \uc7ac\uc0b0 \ubcf4\ud638\uc5d0\ub294 \ucda9\ubd84\ud55c \uac80\ud1a0 \uae30\uac04\uc744 \ub454 BFA\uac00 \uaf2d \ud544\uc694\ud574\uc694. \ubc18\uba74 \uc774\ubbf8 \ubcc4\uac70\ud55c \ub4a4 \ud569\uc758\ub97c \uad73\ud790 \ub54c\ub294 \ubc95\uc6d0\uc774 \ubbf8\ub9ac \uc2ec\uc0ac\ud574 \uc8fc\ub294 $4,950 \ud569\uc758\uba85\ub839\uc774 \ud6e8\uc52c \uacbd\uc81c\uc801\uc774\uace0 \ub4e0\ub4e0\ud574\uc694.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">\ub300\ubc95\uc6d0 \ub9cc\uc7a5\uc77c\uce58 \ud30c\uae30<\/div><div class=\"col-stat-lbl\">\ub3c5\ub9bd \uc790\ubb38 \uc99d\uba85\uc11c\uc5d0\ub3c4 \uc608\uc2dd \uc9c1\uc804 \uac15\uc694 BFA \ubb34\ud6a8\ud654 (Thorne v Kennedy [2017])<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">$4,950 vs $10,000+<\/div><div class=\"col-stat-lbl\">\ubcc4\uac70 \ud6c4 \uc815\uc561 \ubc95\uc6d0 \ud569\uc758\uba85\ub839 \ub300 \uc591\uce21 \ubcc4\ub3c4 \ub85c\ud38c \uc120\uc784 \ud544\uc218 BFA \ube44\uc6a9 \uaca9\ucc28<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">\uc0ac\uc804 \uc2ec\uc0ac \ud655\uc815\ub825<\/div><div class=\"col-stat-lbl\">\ubc95\uc6d0 \ub4f1\ub85d\uad00\uc774 \uacf5\uc815\u00b7\ud615\ud3c9\uc131(Just &amp; Equitable)\uc744 \uc120\uacb0 \uac80\uc99d\ud558\ub294 Consent Orders<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">\uc774 \uce7c\ub7fc\uc758 \ubaa9\ucc28<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#\ubcc0\ud638\uc0ac\uac00-\uc11c\uba85-\ub9d0\ub838\ub294\ub370\ub3c4-\ud30c\uae30\ub41c-\ud63c\uc804\uacc4\uc57d\uc11c-thorne-v-kennedy-\ub300\ubc95\uc6d0-\ud310\uacb0\" class=\"col-toc-link lvl-2\">\ubcc0\ud638\uc0ac\uac00 \uc11c\uba85 \ub9d0\ub838\ub294\ub370\ub3c4 \ud30c\uae30\ub41c \ud63c\uc804\uacc4\uc57d\uc11c: Thorne v Kennedy \ub300\ubc95\uc6d0 \ud310\uacb0<\/a><a href=\"#\uc808\ucc28-\ud760\uacb0-\ud558\ub098\uc5d0-\ubb34\ub108\uc9c0\ub294-bfa\uc640-\uc0b4\uc544\ub0a8\ub294-bfa\uc758-\uacb0\uc815\uc801-\ucc28\uc774\" class=\"col-toc-link lvl-2\">\uc808\ucc28 \ud760\uacb0 \ud558\ub098\uc5d0 \ubb34\ub108\uc9c0\ub294 BFA\uc640 \uc0b4\uc544\ub0a8\ub294 BFA\uc758 \uacb0\uc815\uc801 \ucc28\uc774<\/a><a href=\"#\uc774\ubbf8-\ubcc4\uac70\ud55c-\ubd80\ubd80\ub77c\uba74-\uc65c-bfa-\ub300\uc2e0-4950-\ud569\uc758\uba85\ub839consent-orders\uc774-\uc815\ub2f5\" class=\"col-toc-link lvl-2\">\uc774\ubbf8 \ubcc4\uac70\ud55c \ubd80\ubd80\ub77c\uba74 \uc65c BFA \ub300\uc2e0 $4,950 \ud569\uc758\uba85\ub839(Consent Orders)\uc774 \uc815\ub2f5\uc77c\uae4c<\/a><a href=\"#\uadf8\ub7fc\uc5d0\ub3c4-\ud63c\uc804\ub3d9\uac70-\uc804-bfas-90bs-90ub\uac00-\uaf2d-\ud544\uc694\ud55c-\uc21c\uac04\uacfc-\uc124\uacc4-\uc6d0\uce59\" class=\"col-toc-link lvl-2\">\uadf8\ub7fc\uc5d0\ub3c4 \ud63c\uc804\u00b7\ub3d9\uac70 \uc804 BFA(s 90B\u00b7s 90UB)\uac00 \uaf2d \ud544\uc694\ud55c \uc21c\uac04\uacfc \uc124\uacc4 \uc6d0\uce59<\/a><a href=\"#\ub0b4-\uc0c1\ud669\uc5d0\ub294-bfa\uac00-\ub9de\uc744\uae4c-\ud569\uc758\uba85\ub839\uc774-\ub9de\uc744\uae4c\" class=\"col-toc-link lvl-2\">\ub0b4 \uc0c1\ud669\uc5d0\ub294 BFA\uac00 \ub9de\uc744\uae4c, \ud569\uc758\uba85\ub839\uc774 \ub9de\uc744\uae4c<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">\uac00\uc871\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../?lang=ko&amp;tab=family\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">\uc7ac\uc0b0 \uc57d\uc815 \uc0c1\ub2f4\uc5d0\uc11c\ub294 \ud754\ud788 \ub450 \uac00\uc9c0 \uc815\ubc18\ub300 \uc624\ud574\ub97c \ub9c8\uc8fc\ud574\uc694. \uacb0\ud63c\uc774\ub098 \ub3d9\uac70\ub97c \uc55e\ub454 \ubd84\ub4e4\uc740 \ubcc0\ud638\uc0ac \uc99d\uba85\uc11c\ub9cc \ubd99\uc774\uba74 \ud63c\uc804\uacc4\uc57d\uc11c(Prenup)\ub294 \uc808\ub300 \uc548 \uae68\uc9c0\ub294 \ucca0\uc639\uc131\uc774\ub77c\uace0 \ubbff\uc73c\uc2dc\uc8e0. \ubc18\ub300\ub85c \uc774\ubbf8 \ubcc4\uac70 \ud6c4 \ud569\uc758\ub97c \ub9c8\uce5c \ubd80\ubd80\ub4e4\uc740 \ubc95\uc6d0 \uc808\ucc28 \ub300\uc2e0 \uc7ac\uc0b0\ud569\uc758\uc11c(Binding Financial Agreement \u00b7 BFA) \ud55c \uc7a5\ub9cc \uc4f0\uba74 \ub354 \uc2f8\uace0 \uac04\ud3b8\ud558\uc9c0 \uc54a\ub290\ub0d0\uace0 \ubb3c\uc73c\uc138\uc694. \uc815\ub9d0 \uadf8\ub7f4\uae4c\uc694? \ub450 \uc0dd\uac01 \ubaa8\ub450 \ud638\uc8fc \uac00\uc871\ubc95(Family Law Act 1975) \uc2e4\ubb34\uc640\ub294 \uac70\ub9ac\uac00 \uba40\uc5b4\uc694. \uc2dc\uc810\uc5d0 \ub9de\uc9c0 \uc54a\ub294 \ub3c4\uad6c\ub97c \uace0\ub974\uba74 \uc218\ub9cc \ub2ec\ub7ec \ube44\uc6a9\ub9cc \ub0a0\ub9b0 \ucc44 \ud569\uc758\uc11c\uac00 \ud734\uc9c0 \uc870\uac01\uc774 \ub418\uae30\ub3c4 \ud558\uac70\ub4e0\uc694. \uc65c \ub300\ubc95\uc6d0\uc774 \ubcc0\ud638\uc0ac \uc99d\uba85\uc11c\uae4c\uc9c0 \uac16\ucd98 \uacc4\uc57d\uc11c\ub97c \ud30c\uae30\ud588\ub294\uc9c0 \uadf8\ub9ac\uace0 \ub0b4 \uc0c1\ud669\uc5d0\ub294 BFA\uc640 \ubc95\uc6d0 \ud569\uc758\uba85\ub839(Consent Orders) \uc911 \ubb34\uc5c7\uc774 \uc815\ub2f5\uc778\uc9c0 \uc9da\uc5b4 \ubcfc\uac8c\uc694.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 382\" width=\"100%\" role=\"img\" aria-label=\"\ub0b4 \uc0c1\ud669\uc5d0 \ub9de\ub294 \uc120\ud0dd\uc740? \ud63c\uc804\u00b7\ud63c\uc911 BFA \ub300 \ubcc4\uac70 \ud6c4 \ubc95\uc6d0 \ud569\uc758\uba85\ub839 \ube44\uad50\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"381\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">\uc7ac\uc0b0 \uc57d\uc815 \uc218\ub2e8 \uc120\ud0dd \u00b7 \uc7ac\uc0b0\ud569\uc758\uc11c(BFA) vs \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950)<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">\ub0b4 \uc0c1\ud669\uc5d0 \ub9de\ub294 \uc120\ud0dd\uc740? \ud63c\uc804\u00b7\ud63c\uc911 BFA \ub300 \ubcc4\uac70 \ud6c4 \ubc95\uc6d0 \ud569\uc758\uba85\ub839 \ube44\uad50<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">\uadfc\uac70: Thorne v Kennedy [2017] HCA 49 \u00b7 Black &amp; Black [2008] FamCAFC 7 \u00b7 Saintclaire [2015] FamCAFC 245<\/text>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"38\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">\uc218\ub2e8 A \u00b7 \uc7ac\uc0b0\ud569\uc758\uc11c (BFA \u00b7 ss 90B\u201390D / 90UB\u2013UD)<\/text>\n  <circle cx=\"42\" cy=\"144\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"54\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\uc720\uc77c\ud55c \ud65c\uc6a9\ucc98: \uacb0\ud63c\u00b7\ub3d9\uac70 \uc804(\ud63c\uc804) \ubc0f \ud63c\uc778 \uc720\uc9c0 \uc911<\/text>\n  <text x=\"54\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">\ubc95\uc6d0 \ud569\uc758\uba85\ub839\uc740 \ud30c\ud0c4 \uc804\uc5d0 \uc2e0\uccad \ubd88\uac00\ud558\ubbc0\ub85c \uc0ac\uc804 \uc790\uc0b0\ubcf4\ud638\ub294 BFA\ub9cc \uac00\ub2a5!<\/text>\n  <circle cx=\"42\" cy=\"196\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"54\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\uc591\uce21 \uac01\uac01 \ub3c5\ub9bd \ubcc0\ud638\uc0ac \uc120\uc784 \ud544\uc218 (\ube44\uc6a9 2\ubc30)<\/text>\n  <text x=\"54\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">\uac01 \ubcc0\ud638\uc0ac\uac00 s 90G \ub3c5\ub9bd \ubc95\ub960\uc790\ubb38 \uc99d\uba85\uc11c\ub97c \ubc1c\uae09\ud574\uc57c\ub9cc \ud6a8\ub825 \ubc1c\uc0dd (Black).<\/text>\n  <circle cx=\"42\" cy=\"248\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"54\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Thorne v Kennedy [2017] HCA 49 \ud30c\uae30 \uc8fc\uc758\ubcf4<\/text>\n  <text x=\"54\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">\uacb0\ud63c\uc2dd \uc9c1\uc804 \uc11c\uba85 \uac15\uc694\u00b7\ud604\uc800\ud55c \ubd88\uade0\ud615\u00b7\uc740\ub2c9 \uc2dc \uc99d\uba85\uc11c\uac00 \uc788\uc5b4\ub3c4 \ubb34\ud6a8 \ud30c\uae30!<\/text>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1.3\"/>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#1D6B48\"/>\n  <text x=\"466\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">\uc218\ub2e8 B \u00b7 \ubc95\uc6d0 \ud569\uc758\uba85\ub839 (Consent Orders \u00b7 \ubcc4\uac70 \ud6c4 1\uc21c\uc704)<\/text>\n  <circle cx=\"470\" cy=\"144\" r=\"4\" fill=\"#1D6B48\"/>\n  <text x=\"482\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ubcc4\uac70\u00b7\uc774\ud63c \ud6c4 \uc6d0\ub9cc\ud788 \ud569\uc758\ub41c \ucee4\ud50c\uc758 \uc555\ub3c4\uc801 \ud45c\uc900<\/text>\n  <text x=\"482\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">\uc591\uce21\uc774 \uac01\uac01 \ub85c\ud38c\uc744 \uc120\uc784\ud560 \uc758\ubb34 \uc5c6\uc774 \uc815\uc561($4,950 + $215)\uc73c\ub85c \uae54\ub054\ud788 \uc644\uacb0.<\/text>\n  <circle cx=\"470\" cy=\"196\" r=\"4\" fill=\"#1D6B48\"/>\n  <text x=\"482\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\ubc95\uad00\uc774 \uacf5\uc815\u00b7\ud615\ud3c9\uc131(Just &amp; Equitable) \uc0ac\uc804 \uc2ec\uc0ac<\/text>\n  <text x=\"482\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">\ubc95\uc6d0 \uc778\uc7a5\uc774 \ucc0d\ud788\uba74 \uc0ac\ud6c4 \ubb34\ud6a8 \uc18c\uc1a1(s 79A) \uac00\ub2a5\uc131\uc774 \uadf9\ud788 \ub0ae\uc544 \uc548\uc815\uc131 \ucd5c\uace0!<\/text>\n  <circle cx=\"470\" cy=\"248\" r=\"4\" fill=\"#1D6B48\"/>\n  <text x=\"482\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\uc778\uc9c0\uc138 \uba74\uc81c + \ud1f4\uc9c1\uc5f0\uae08 \ubd84\ud560(28\uc77c \ud1b5\uc9c0) \uc77c\uad04 \ucc98\ub9ac<\/text>\n  <text x=\"482\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">\ubd80\ub3d9\uc0b0 \uba85\uc758\uc774\uc804 \uc138\uae08 \uba74\uc81c\uc640 Super Splitting\uae4c\uc9c0 \ud55c \ubc88\uc5d0 \uc9d1\ud589\ub429\ub2c8\ub2e4.<\/text>\n  <rect x=\"22\" y=\"328\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"351\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1D6B48\">\uba85\ucf8c\ud55c \uacb0\ub860: \uacb0\ud63c\u00b7\ub3d9\uac70 \uc804 \uc7ac\uc0b0 \ubcf4\ud638\ub294 \ucda9\ubd84\ud55c \uc2dc\uac04\uacfc \uacf5\uc2dc\ub97c \uac16\ucd98 BFA\ub85c, \ubcc4\uac70 \ud6c4 \ud569\uc758 \ud655\uc815\uc740 $4,950 \ubc95\uc6d0 \ud569\uc758\uba85\ub839\uc73c\ub85c \uc9c4\ud589\ud558\uc138\uc694.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 1: \uc7ac\uc0b0\ud569\uc758\uc11c(BFA)\uc640 \ubc95\uc6d0 \ud569\uc758\uba85\ub839(Consent Orders $4,950) \uc2dc\uc810\u00b7\ube44\uc6a9\u00b7\uc548\uc815\uc131 \ube44\uad50<\/figcaption><\/figure>\n<h2 id=\"\ubcc0\ud638\uc0ac\uac00-\uc11c\uba85-\ub9d0\ub838\ub294\ub370\ub3c4-\ud30c\uae30\ub41c-\ud63c\uc804\uacc4\uc57d\uc11c-thorne-v-kennedy-\ub300\ubc95\uc6d0-\ud310\uacb0\" class=\"doc-h2\">\ubcc0\ud638\uc0ac\uac00 \uc11c\uba85 \ub9d0\ub838\ub294\ub370\ub3c4 \ud30c\uae30\ub41c \ud63c\uc804\uacc4\uc57d\uc11c: Thorne v Kennedy \ub300\ubc95\uc6d0 \ud310\uacb0<\/h2>\n<p class=\"doc-p\">\ud63c\uc804\uacc4\uc57d\uc11c \uc2e4\ubb34\ub97c \ubfcc\ub9ac\uc9f8 \ubc14\uafbc \uc0ac\uac74\uc740 \uc5f0\ubc29\ub300\ubc95\uc6d0\uc758 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2017/49.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Thorne v Kennedy<\/em> [2017] HCA 49<\/a> \uc804\uc6d0\uc77c\uce58 \ud310\uacb0\uc774\uc5d0\uc694. \uc790\uc0b0\uc774 $1,800\ub9cc\uc5d0\uc11c $2,400\ub9cc \ub2ec\ub7ec\uc5d0 \ub2ec\ud558\ub358 \ud638\uc8fc \uac1c\ubc1c\uc5c5\uc790\uac00 \uc601\uc5b4\uac00 \uc11c\ud234\uace0 \ubb34\uc790\uc0b0\uc774\ub358 36\uc138 \ud574\uc678 \uc5ec\uc131\uacfc \uc57d\ud63c\ud588\uc5b4\uc694. \uc5ec\uc131\uc740 \uacb0\ud63c\ub9cc \ubc14\ub77c\ubcf4\uace0 \uace0\uad6d \uc0dd\ud65c\uc744 \uc811\uc740 \ub4a4 \ud638\uc8fc\ub85c \uac74\ub108\uc654\uc8e0. \ubb38\uc81c\ub294 \uc608\uc2dd \ucf54\uc55e\uc5d0 \ud130\uc84c\uc5b4\uc694. \ud574\uc678 \uce5c\uc815 \uc2dd\uad6c\ub4e4\uc774 \uc774\ubbf8 \ub3c4\ucc29\ud588\uace0 \uc2dd\uc7a5 \uc900\ube44\ub3c4 \ub05d\ub09c \uacb0\ud63c \uc5f4\ud758 \uc804\uc5d0 \ub0a8\uc131\uc774 \uc77c\ubc29\uc801\uc778 \ud63c\uc804 BFA\ub97c \ub0b4\ubc00\uc5c8\uac70\ub4e0\uc694. \uc11c\uba85\ud558\uc9c0 \uc54a\uc73c\uba74 \uacb0\ud63c\uc2dd\uc740 \ucde8\uc18c\ub41c\ub2e4(&quot;sign or the wedding is off&quot;)\ub294 \ucd5c\ud6c4\ud1b5\ucca9\ub3c4 \ub367\ubd99\uc600\uc5b4\uc694.<\/p>\n<p class=\"doc-p\">\uac00\uc7a5 \ub180\ub77c\uc6b4 \ub300\ubaa9\uc740 \uadf8\ub2e4\uc74c\uc774\uc5d0\uc694. \uc57d\ud63c\ub140\ub294 \ub3c5\ub9bd\ub41c \ubcc0\ud638\uc0ac\uc5d0\uac8c \uc815\uc2dd \ubc95\ub960\uc790\ubb38(ILA)\uc744 \ubc1b\uc558\uc5b4\uc694. \ub2f4\ub2f9 \ubcc0\ud638\uc0ac\ub294 \uc5ed\ub300 \ucd5c\uc545\uc758 \uacc4\uc57d\uc11c\ub77c\uba70 \uc808\ub300 \uc11c\uba85\ud558\uc9c0 \ub9d0\ub77c\uace0 \uc11c\uba74\uc73c\ub85c \ub9d0\ub838\uc8e0. \uadf8\ub798\ub3c4 \ube44\uc790\uc640 \uacb0\ud63c\uc774 \ubb34\ub108\uc9c8 \ucc98\uc9c0\uc600\ub358 \uc5ec\uc131\uc740 \uacb0\uad6d \uc11c\uba85\ud558\uace0 \ub9d0\uc558\uc5b4\uc694. \uacb0\ud63c \uc9c1\ud6c4\uc5d0\ub3c4 \ube44\uc2b7\ud55c \ud63c\ud6c4 \uacc4\uc57d\uc11c\uc5d0 \ub2e4\uc2dc \uc11c\uba85\ud588\uace0 \ub450 \ubb38\uc11c \ubaa8\ub450 s 90G \uc99d\uba85\uc11c\ub97c \uac16\ucdc4\uc5b4\uc694. \uacb0\uacfc\ub294 \uc5b4\ub560\uc744\uae4c\uc694? \uc5f0\ubc29\ub300\ubc95\uc6d0\uc740 \uac00\uc871\ubc95 Part VIIIA ss 90K \ubc0f 90KA\uc5d0 \ub530\ub77c \ub450 BFA\ub97c \ubaa8\ub450 \ud30c\uae30(set aside)\ud588\uc5b4\uc694. \ubd80\ub2f9\uc704\uc555(undue influence)\uacfc \ubd88\uacf5\uc815 \ud589\uc704(unconscionable conduct)\ub97c \uc778\uc815\ud55c \uac70\uc608\uc694. \uc120\ud0dd\uc758 \uc790\uc720\uac00 \ub9c9\ud78c \uc11c\uba85\uc740 s 90G \uc99d\uba85\uc11c\uac00 \uc788\uc5b4\ub3c4 \ubcf4\ud638\ubc1b\uc9c0 \ubabb\ud55c\ub2e4\ub294 \ubd84\uba85\ud55c \uacbd\uace0\uc600\uc8e0.<\/p>\n<h2 id=\"\uc808\ucc28-\ud760\uacb0-\ud558\ub098\uc5d0-\ubb34\ub108\uc9c0\ub294-bfa\uc640-\uc0b4\uc544\ub0a8\ub294-bfa\uc758-\uacb0\uc815\uc801-\ucc28\uc774\" class=\"doc-h2\">\uc808\ucc28 \ud760\uacb0 \ud558\ub098\uc5d0 \ubb34\ub108\uc9c0\ub294 BFA\uc640 \uc0b4\uc544\ub0a8\ub294 BFA\uc758 \uacb0\uc815\uc801 \ucc28\uc774<\/h2>\n<p class=\"doc-p\">\ubc95\uc6d0\uc740 \uc65c \uc720\ub3c5 BFA\ub97c \uc774\ub807\uac8c \uc5c4\uaca9\ud788 \ub2e4\ub8f0\uae4c\uc694? \ubc95\uc6d0\uc758 \uc0ac\uc804 \uacf5\uc815\uc131 \uc2ec\uc0ac \uc5c6\uc774 \uac1c\uc778 \uac04 \uacc4\uc57d\ub9cc\uc73c\ub85c \uc5f0\ubc29\uc21c\ud68c\u00b7\uac00\uc871\ubc95\uc6d0(FCFCOA)\uc758 \uc7ac\uc0b0\ubd84\ud560 \uad00\ud560\uad8c(s 79 \u00b7 s 90SM)\uc744 \uac00\ub85c\ub9c9\uae30 \ub54c\ubb38\uc774\uc5d0\uc694. \ud56d\uc18c\ubd80\ub294 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2008/7.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Black &amp; Black<\/em> [2008] FamCAFC 7<\/a> \ud310\uacb0\uc5d0\uc11c \ubc95\uc815 \uccad\uad6c\uad8c\uc744 \ubc30\uc81c\ud558\ub824\uba74 \ubc95\ub960\ud63c s 90G(\uc0ac\uc2e4\ud63c s 90UJ)\uc758 \ud615\uc2dd \uc694\uac74\uc744 \uc5c4\uaca9\ud788 \uc9c0\ucf1c\uc57c \ud55c\ub2e4\uace0 \ubabb \ubc15\uc558\uc5b4\uc694. \ud6d7\ub0a0 \uacbd\ubbf8\ud55c \uc808\ucc28 \ud760\uacb0\uc744 \uad6c\uc81c\ud558\ub294 \uc881\uc740 \uc7ac\ub7c9 \uc870\ud56d(s 90G(1A))\uc774 \uc0dd\uacbc\uc9c0\ub9cc \uc591\uce21\uc774 \uc11c\ub85c \ub2e4\ub978 \ubcc4\uac1c \ub85c\ud38c\uc744 \uac01\uac01 \uc120\uc784\ud574 \uc790\ubb38 \uc99d\uba85\uc11c\ub97c \uc8fc\uace0\ubc1b\uc544\uc57c \ud55c\ub2e4\ub294 \uc6d0\uce59\uc740 \uc9c0\uae08\ub3c4 \ud655\uace0\ud574\uc694.<\/p>\n<p class=\"doc-p\">\uadf8\ub7fc BFA\ub294 \ubb34\uc870\uac74 \uae68\uc9c0\ub294 \ubb38\uc11c\uc77c\uae4c\uc694? \uc804\ud600 \uadf8\ub807\uc9c0 \uc54a\uc544\uc694. <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2015/245.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Saintclaire &amp; Saintclaire<\/em> [2015] FamCAFC 245<\/a> \ud310\uacb0\uc774 \uc0b4\uc544\ub0a8\ub294 BFA\uc758 \uc815\uc11d\uc744 \ubcf4\uc5ec \uc918\uc694. \ud56d\uc18c\ubd80\ub294 \uc774 \uc0ac\uac74\uc758 \ud63c\uc778 \uc911 s 90C \ud569\uc758\uc11c\ub97c \ub05d\uae4c\uc9c0 \uc720\ud6a8\ub85c \uc778\uc815\ud588\uc5b4\uc694. \uc2dc\uac04 \uc555\ubc15\uc774 \uc5c6\uc5c8\uace0 \uc218\uac1c\uc6d4\uac04 \uc591\uce21 \ubcc0\ud638\uc0ac\uac00 \ubb38\uad6c\ub97c \uc870\uc728\ud558\uba70 \uc544\ub0b4 \uce21 \uc218\uc815 \uc694\uad6c\ub97c \uc2e4\uc81c\ub85c \ubc18\uc601\ud588\uac70\ub4e0\uc694. \uc7ac\uc0b0 \uacf5\uac1c\ub3c4 \ud22c\uba85\ud588\uace0 \ub300\ub4f1\ud55c \uad50\uc12d\uc774 \uc774\ub8e8\uc5b4\uc84c\uc8e0. \ubc18\ub300\ub85c \ud55c\uad6d \uc790\uc0b0\uc774\ub098 \uc2e0\ud0c1\uc744 \uc228\uae30\uba74 \uc7ac\uc0b0 \ubd88\uacf5\uac1c(s 90K(1)(a))\ub85c \ud30c\uae30\ub418\uace0 \uc790\ub140 \ucd9c\uc0b0 \ub4f1 \uc911\ub300\ud55c \uc591\uc721 \uc0ac\uc815 \ubcc0\uacbd\uc73c\ub85c \uace4\uad81(s 90K(1)(d))\uc774 \uc0dd\uaca8\ub3c4 \ubb34\ud6a8\uac00 \ub420 \uc218 \uc788\uc5b4\uc694.<\/p>\n<h2 id=\"\uc774\ubbf8-\ubcc4\uac70\ud55c-\ubd80\ubd80\ub77c\uba74-\uc65c-bfa-\ub300\uc2e0-4950-\ud569\uc758\uba85\ub839consent-orders\uc774-\uc815\ub2f5\" class=\"doc-h2\">\uc774\ubbf8 \ubcc4\uac70\ud55c \ubd80\ubd80\ub77c\uba74 \uc65c BFA \ub300\uc2e0 $4,950 \ud569\uc758\uba85\ub839(Consent Orders)\uc774 \uc815\ub2f5\uc77c\uae4c<\/h2>\n<p class=\"doc-p\">\uc2e4\ubb34\uc5d0\uc11c \uc790\uc8fc \ubc14\ub85c\uc7a1\uc544 \ub4dc\ub9ac\ub294 \ucc29\uc624\uac00 \ubcc4\uac70 \ud6c4 \ub2e8\uacc4\uc5d0\uc11c \ub9c8\uc8fc\ud558\ub294 \uc120\ud0dd\uc774\uc5d0\uc694. \uc774\ubbf8 \ud5e4\uc5b4\uc9c4 \ubd80\ubd80\ub098 \uc0ac\uc2e4\ud63c \ucee4\ud50c\uc774 \ubd84\ud560 \ubc29\ud5a5\uc5d0 \ub73b\uc744 \ubaa8\uc558\ub2e4\uba74 \uad73\uc774 \ubcc4\uac70 \ud6c4 \uc7ac\uc0b0\ud569\uc758\uc11c(s 90D \u00b7 s 90UD BFA)\ub97c \uc4f8 \uc774\uc720\uac00 \uc5c6\uc5b4\uc694. \ube44\uc6a9\uacfc \uc548\uc815\uc131 \ubaa8\ub450 \ubc95\uc6d0 \ud569\uc758\uba85\ub839(Consent Orders)\uc774 \ud6e8\uc52c \ub6f0\uc5b4\ub098\uac70\ub4e0\uc694.<\/p>\n<p class=\"doc-p\">\ube44\uc6a9\ubd80\ud130 \ucc28\uc774\uac00 \ucee4\uc694. BFA\ub294 \uc591\ucabd\uc774 \uc758\ubb34\uc801\uc73c\ub85c \ub3c5\ub9bd\ub41c \ub85c\ud38c \ub450 \uacf3\uc744 \uac01\uac01 \uc120\uc784\ud574\uc57c \ud574\uc694. \ub450 \ub85c\ud38c\uc774 \ubc30\uc0c1 \ucc45\uc784\uc744 \uc548\uace0 \uc790\uc0b0\uc744 \uac80\ud1a0\ud574 \uc99d\uba85\uc11c\ub97c \ubc1c\uae09\ud558\ubbc0\ub85c \ud569\uc0b0 \ube44\uc6a9\uc774 \ud1b5\uc0c1 $8,000\uc5d0\uc11c $15,000 \uc774\uc0c1 \ub4e4\uc5b4\uc694. \ubc18\uba74 \ud569\uc758\uba85\ub839\uc740 \ud55c \uacf3\uc758 \ub85c\ud38c\uc5d0\uc11c \uc2e0\uccad\uc11c\uc640 \uba85\ub839\uc548\uc744 \uc791\uc131\ud574 \uc811\uc218\ud560 \uc218 \uc788\uc5b4\uc694. \ubc15\uc564\ucf54\uc758 \uc815\uc561 \ud569\uc758\uba85\ub839 \ud328\ud0a4\uc9c0\ub294 \uc218\uc784\ub8cc $4,950\uc640 \ubc95\uc6d0 \uc218\uc218\ub8cc $215\ub85c \uc9c4\ud589\ub3fc\uc694. \ucd9c\uc11d \uc5c6\uc774 \uc57d 4\uc8fc \uc11c\uba74 \uc2ec\uc0ac\ub85c \ubc95\uc6d0\uc774 \uacf5\uc815\uc131(s 79(2))\uc744 \ud655\uc778\ud55c \ub4a4 \ubc95\uc6d0 \uc778\uc7a5\uc744 \ucc0d\uc5b4 \uc8fc\uc8e0. \ud655\uc815 \ud6c4\uc5d0\ub294 \ud30c\uae30\uac00 \uadf9\ud788 \uc5b4\ub835\uace0(s 79A) \uc778\uc9c0\uc138(Stamp Duty) \uba74\uc81c\uc640 \ud1f4\uc9c1\uc5f0\uae08 \uc218\ud0c1\uc790 28\uc77c \uc0ac\uc804 \ud1b5\uc9c0\uae4c\uc9c0 \uae54\ub054\ud558\uac8c \ud574\uacb0\ub3fc\uc694.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table doc-table-wide\" data-cols=\"5\"><thead><tr><th style=\"text-align:left\">\ube44\uad50 \ud56d\ubaa9<\/th><th style=\"text-align:left\">\ud63c\uc804\u00b7\ud63c\uc778 \uc911 BFA (s 90B/90C \u00b7 s 90UB/90UC)<\/th><th style=\"text-align:left\">\ubcc4\uac70 \ud6c4 BFA (s 90D \u00b7 s 90UD)<\/th><th style=\"text-align:left\">\ubc95\uc6d0 \ud569\uc758\uba85\ub839 (Consent Orders)<\/th><th style=\"text-align:left\">\uc0ac\uc801 \uac01\uc11c \u00b7 \uacf5\uc99d \ubb38\uc11c<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>\uccb4\uacb0 \uac00\ub2a5 \uc2dc\uc810<\/strong><\/td><td style=\"text-align:left\">\uacb0\ud63c\u00b7\ub3d9\uac70 \uc804 \ub610\ub294 \uad00\uacc4 \uc720\uc9c0 \uc911<\/td><td style=\"text-align:left\">\ubc95\ub960\ud63c\u00b7\uc0ac\uc2e4\ud63c \ubcc4\uac70\u00b7\uc774\ud63c \ud6c4<\/td><td style=\"text-align:left\">\ubcc4\uac70\u00b7\uc774\ud63c \ud6c4\uc5d0\ub9cc \uac00\ub2a5 (\ud63c\uc804 \ubd88\uac00)<\/td><td style=\"text-align:left\">\uc2dc\uc810 \ubb34\uad00\ud558\ub098 \ud6a8\ub825 \uc5c6\uc74c<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ubcc0\ud638\uc0ac \uc120\uc784 \uc694\uac74<\/strong><\/td><td style=\"text-align:left\">\uc591\uce21 \ubcc4\ub3c4 \ub85c\ud38c 2\uacf3 \ud544\uc218 (s 90G / s 90UJ)<\/td><td style=\"text-align:left\">\uc591\uce21 \ubcc4\ub3c4 \ub85c\ud38c 2\uacf3 \ud544\uc218 (s 90G / s 90UJ)<\/td><td style=\"text-align:left\"><strong>\ub2e8\uc77c \ub85c\ud38c \uc791\uc131 \uac00\ub2a5<\/strong> (\uc0c1\ub300\ubc29 \uc790\ubb38 \uc120\ud0dd)<\/td><td style=\"text-align:left\">\uc694\uac74 \uc5c6\uc74c<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc608\uc0c1 \ube44\uc6a9 \uc218\uc900<\/strong><\/td><td style=\"text-align:left\">\uc591\uce21 \ud569\uc0b0 \ud1b5\uc0c1 $8,000\u2013$15,000+<\/td><td style=\"text-align:left\">\uc591\uce21 \ud569\uc0b0 \ud1b5\uc0c1 $8,000\u2013$15,000+<\/td><td style=\"text-align:left\">\ubc15\uc564\ucf54 \uc815\uc561 $4,950 + \ubc95\uc6d0\ube44 $215<\/td><td style=\"text-align:left\">\ubb34\ub8cc\uc774\ub098 \ubcf4\ud638 \ud6a8\uacfc 0%<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc0ac\uc804 \uc2ec\uc0ac\u00b7\uc548\uc815\uc131<\/strong><\/td><td style=\"text-align:left\">\ubc95\uc6d0 \uc2ec\uc0ac \uc5c6\uc74c \u00b7 \uac15\ubc15\u00b7\ubd88\uacf5\uc815 \ud30c\uae30 \uc704\ud5d8<\/td><td style=\"text-align:left\">\ubc95\uc6d0 \uc2ec\uc0ac \uc5c6\uc74c \u00b7 \uc808\ucc28\u00b7\ub204\ub77d \ud30c\uae30 \ub178\ucd9c<\/td><td style=\"text-align:left\"><strong>\ubc95\uc6d0 \uacf5\uc815\uc131 \uc2ec\uc0ac \ud1b5\uacfc<\/strong> \u00b7 \ud655\uc815 \ud6c4 \ud30c\uae30 \uc81c\ud55c<\/td><td style=\"text-align:left\"><strong>\uad6c\uc18d\ub825 \uc5c6\uc74c<\/strong> \u00b7 \uc5b8\uc81c\ub4e0 \uc81c\uc18c \uac00\ub2a5<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc778\uc9c0\uc138\u00b7\ucd5c\uc801 \uc6a9\ub3c4<\/strong><\/td><td style=\"text-align:left\">\uc778\uc9c0\uc138 \uba74\uc81c \u00b7 \uc7ac\ud63c\u00b7\uac00\uc5c5\u00b7\ubd80\ubaa8 \uc99d\uc5ec \ubcf4\ud638<\/td><td style=\"text-align:left\">\ubd80\uc591\ub8cc \uc601\uad6c \ucc28\ub2e8 \ub4f1 \ud2b9\uc218 \uc0ac\uc548 \ud55c\uc815<\/td><td style=\"text-align:left\"><strong>\uc778\uc9c0\uc138 \uba74\uc81c + \uc5f0\uae08 \ubd84\ud560<\/strong> \u00b7 \ubcc4\uac70 \ud6c4 \ud45c\uc900 \uc885\uacb0<\/td><td style=\"text-align:left\">\uc778\uc9c0\uc138 \uba74\uc81c \ubd88\uac00<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"\uadf8\ub7fc\uc5d0\ub3c4-\ud63c\uc804\ub3d9\uac70-\uc804-bfas-90bs-90ub\uac00-\uaf2d-\ud544\uc694\ud55c-\uc21c\uac04\uacfc-\uc124\uacc4-\uc6d0\uce59\" class=\"doc-h2\">\uadf8\ub7fc\uc5d0\ub3c4 \ud63c\uc804\u00b7\ub3d9\uac70 \uc804 BFA(s 90B\u00b7s 90UB)\uac00 \uaf2d \ud544\uc694\ud55c \uc21c\uac04\uacfc \uc124\uacc4 \uc6d0\uce59<\/h2>\n<p class=\"doc-p\">\uadf8\ub807\ub2e4\uace0 BFA\uac00 \uc4f8\ubaa8\uc5c6\ub294 \uc81c\ub3c4\ub294 \uc544\ub2c8\uc5d0\uc694. \ubd84\uba85\ud55c \uc774\uc720\uac00 \uc788\uac70\ub4e0\uc694. \uacb0\ud63c \uc804\uc774\ub098 \ub3d9\uac70 \uc2dc\uc791 \uc804 \ub610\ub294 \uc6d0\ub9cc\ud55c \ud63c\uc778 \uc720\uc9c0 \uc911\uc5d0\ub294 \ubc95\uc6d0\uc5d0 \ud569\uc758\uba85\ub839(Consent Orders)\uc744 \uc2e0\uccad\ud560 \uc790\uaca9 \uc790\uccb4\uac00 \uc5c6\uc5b4\uc694. \ud569\uc758\uba85\ub839\uc740 \ubcc4\uac70 \ud6c4\uc5d0\ub9cc \uc5f4\ub824 \uc788\uae30 \ub54c\ubb38\uc774\uc8e0. \ud30c\ud0c4 \uc804\uc5d0 \ubbf8\ub9ac \uc7ac\uc0b0 \uacbd\uacc4\uc120\uc744 \uadf8\uc73c\ub824\uba74 \ud63c\uc804 s 90B\ub098 \ub3d9\uac70 \uc804 s 90UB BFA\uac00 \uc720\uc77c\ud55c \ud569\ubc95\uc801 \ubcf4\ud638\ub9c9\uc774\uc5d0\uc694.<\/p>\n<p class=\"doc-p\">\uc7ac\ud63c \uac00\uc815(blended families)\uc5d0\uc11c \uc804\ud63c \uc790\ub140 \ubaab \uc8fc\ud0dd\uc744 \ubd84\ub9ac\ud574 \ub450\uac70\ub098 \ubd80\ubaa8\ub2d8\uaed8 \ud070 \uc790\uae08\uacfc \uac00\uc5c5 \uc9c0\ubd84\uc744 \uc99d\uc5ec\ubc1b\uc544 \uacb0\ud63c\u00b7\ud30c\ud2b8\ub108\ube44\uc790 \ub3d9\uac70\ub97c \uc2dc\uc791\ud560 \ub54c\ub294 \uc0ac\uc804 BFA\uac00 \uaf2d \ud544\uc694\ud574\uc694. <em>Saintclaire<\/em> \ud310\uacb0\ucc98\ub7fc \ubc95\uc815\uc5d0\uc11c\ub3c4 \ubc84\ud168 \ub0b4\ub294 \ubb38\uc11c\ub97c \ub9cc\ub4e4\ub824\uba74 \uc138 \uac00\uc9c0 \uc6d0\uce59\uc744 \uc9c0\ucf1c\uc57c \ud574\uc694. \uc608\uc2dd\uc774\ub098 \ube44\uc790 \uc811\uc218 \ucd5c\uc18c 3~6\uac1c\uc6d4 \uc804\uc5d0 \uc5ec\uc720 \uc788\uac8c \ub17c\uc758\ub97c \uc2dc\uc791\ud574\uc57c \ud574\uc694. \ud55c\u00b7\ud638 \uc804 \uc138\uacc4 \uc790\uc0b0\uacfc \ubd80\ucc44\ub97c \ubcc4\uc9c0(Schedule)\uc5d0 \ube60\uc9d0\uc5c6\uc774 \uc801\uc5b4\uc57c \ud558\uc8e0. \uc544\uc6b8\ub7ec \uc0c1\ub300\ubc29 \ubcc0\ud638\uc0ac\uc758 \uc218\uc815 \uc758\uacac\uc744 \uc2e4\uc81c\ub85c \ud611\uc758\ud574 \ubc18\uc601\ud55c \ud754\uc801\uae4c\uc9c0 \ub0a8\uaca8 \ub450\uc5b4\uc57c \uc548\uc804\ud574\uc694.<\/p>\n<h2 id=\"\ub0b4-\uc0c1\ud669\uc5d0\ub294-bfa\uac00-\ub9de\uc744\uae4c-\ud569\uc758\uba85\ub839\uc774-\ub9de\uc744\uae4c\" class=\"doc-h2\">\ub0b4 \uc0c1\ud669\uc5d0\ub294 BFA\uac00 \ub9de\uc744\uae4c, \ud569\uc758\uba85\ub839\uc774 \ub9de\uc744\uae4c<\/h2>\n<p class=\"doc-p\">\ubcc4\uac70 \uc804\uc778\uc9c0 \ud6c4\uc778\uc9c0\uc5d0 \ub530\ub77c \uc815\ub2f5\uc740 \uc815\ubc18\ub300\ub85c \uac08\ub824\uc694. \uc774\ubbf8 \ubcc4\uac70 \ud6c4 \ud070 \ud2c0\uc758 \ud569\uc758\uac00 \ub05d\ub0ac\ub2e4\uba74 \ub450 \ubc30 \ube44\uc6a9\uc774 \ub4dc\ub294 BFA \ub300\uc2e0 $4,950 \uc815\uc561 \ud569\uc758\uba85\ub839\uc73c\ub85c \ub9e4\ub4ed\uc9d3\ub294 \ud3b8\uc774 \ud604\uba85\ud574\uc694. \ubc18\ub300\ub85c \uacb0\ud63c\u00b7\ub3d9\uac70\u00b7\uc7ac\ud63c\uc744 \uc55e\ub450\uace0 \uace0\uc720 \uc790\uc0b0\uc774\ub098 \ubd80\ubaa8\ub2d8 \uc99d\uc5ec\ubd84\uc744 \uc9c0\ucf1c\uc57c \ud55c\ub2e4\uba74 \uc2dd\uc7a5 \uc608\uc57d \uc804\uc5d0 \ucda9\ubd84\ud55c \uc2dc\uac04\uc744 \ub450\uace0 \uc0ac\uc804 BFA\ub97c \uc124\uacc4\ud558\uc154\uc57c \ud558\uc8e0. \uc774\uba54\uc77c \ubb38\ub2f5 \ub300\uc2e0 \ubc15\uc564\ucf54 \uac00\uc871\ubc95 \uc804\uc6a9 \uc628\ub77c\uc778 \uc9c8\ubb38\uc9c0(<a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\uac00\uc871\ubc95 \uc0ac\uc548 \uc811\uc218 \ubc14\ub85c\uac00\uae30<\/a>)\ub098 \uacf5\uc2dd \ud1b5\ud569 \uc548\ub0b4 \ucc3d\uad6c(<a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ubc15\uc564\ucf54 \uacf5\uc2dd \ub9c1\ud06c \ud5c8\ube0c<\/a>)\uc5d0 \ud604\uc7ac \uad00\uacc4 \ub2e8\uacc4\uc640 \uc790\uc0b0 \uad6c\uc131\uc744 \ub0a8\uaca8 \uc8fc\uc138\uc694. \uc774\ud574\ucda9\ub3cc \uc870\ud68c \ud6c4 \uac00\uc7a5 \uacac\uace0\ud558\uace0 \uacbd\uc81c\uc801\uc778 \uc808\ucc28\ub97c \uc9da\uc5b4 \ub4dc\ub9b4\uac8c\uc694.<\/p>\n\n          <div class=\"col-sources-box\">\n            \uadfc\uac70 \ubc95\ub839 \ubc0f \ud310\ub840: Family Law Act 1975 Part VIIIA (ss 90B\u201390KA), Part VIIIAB (ss 90UB\u201390UN), ss 79, 79A \u00b7 Thorne v Kennedy [2017] HCA 49 \u00b7 Black &amp; Black [2008] FamCAFC 7 \u00b7 Saintclaire &amp; Saintclaire [2015] FamCAFC 245.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">\ud63c\uc790 \uc9c4\ud589\uc744 \uba48\ucd94\uace0 \ubcc0\ud638\uc0ac\ub97c \ucc3e\uc544\uc57c \ud558\ub294 \uc21c\uac04 \u00b7 \uac00\uc871\ubc95<\/span>\n            <h3 class=\"col-cta-title\">\ud569\uc758\ub41c \uc870\uac74\uc744 \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950)\uc73c\ub85c \ud655\uc815\ud558\uace0 \uc2f6\uac70\ub098 \uc5f0\ub77d\uc744 \ud53c\ud558\ub294 \ubc30\uc6b0\uc790\uc640 \uc7ac\uc0b0\ubd84\ud560 \ud611\uc0c1\uc744 \uc2dc\uc791\ud574\uc57c \ud558\ub098\uc694?<\/h3>\n            <p class=\"col-cta-desc\">\ub2e8\uc21c \uc628\ub77c\uc778 \uc774\ud63c \uc2e0\uccad\uc740 \ud3ec\ud138 \uc124\uba85\uc11c\ub97c \ubcf4\uace0 \uc9c1\uc811 \uc9c4\ud589\ud558\uba74 \uc218\ucc9c \ub2ec\ub7ec\ub97c \uc544\ub07c\uc2e4 \uc218 \uc788\uc5b4\uc694. \ubc18\uba74 \ubc95\uc801 \ud6a8\ub825\uc774 \uc788\ub294 \uc7ac\uc0b0\u00b7\uc591\uc721 \ud569\uc758\uba85\ub839(Consent Orders) \uc791\uc131\uc774\ub098 \uc5f0\ub77d\uc744 \ud53c\ud558\ub294 \ubc30\uc6b0\uc790\uc758 \uc7ac\uc0b0 \uacf5\uac1c \uc694\uad6c\u00b7\ud55c\uad6d\uacfc \ud638\uc8fc\uc5d0 \uac78\uce5c \uc7ac\uc0b0\ubd84\ud560\uc774 \ud544\uc694\ud560 \ub54c\ub294 3\ubd84 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \ud575\uc2ec \ub0a0\uc9dc\uc640 \uc7ac\uc0b0 \ub0b4\uc5ed\uc744 \ub0a8\uaca8 \uc8fc\uc138\uc694.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">\uac00\uc871\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../files/KO/PDF/03_Family_Law_Divorce_Property_Parenting_and_Settlement_Manual_2026_KO.pdf\" download class=\"col-btn-ghost\">03 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc694\uc57d PDF \ubc1b\uae30<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">\ubc15\uc564\ucf54 \uacf5\uc2dd \uc0c1\ub2f4 \ub9c1\ud06c \ud5c8\ube0c<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">\ubc95\ub960 \uc548\ub0b4: \uc774 \uce7c\ub7fc\uc740 \ud638\uc8fc \uc5f0\ubc29 \uac00\uc871\ubc95(Family Law Act 1975)\uacfc \uacf5\uc2dd \ud1b5\uacc4\u00b7\ud310\ub840\ub97c \ubc14\ud0d5\uc73c\ub85c \uc54c\uae30 \uc27d\uac8c \uc815\ub9ac\ud55c \uc77c\ubc18 \ubc95\ub960 \uc815\ubcf4\uc608\uc694. \uac1c\ubcc4 \uc0ac\uac74\uc5d0 \ub300\ud55c \ubc95\ub960 \uc790\ubb38\uc774\ub098 \uc218\uc784 \uacc4\uc57d \uc131\ub9bd\uc744 \ub73b\ud558\uc9c0 \uc54a\uc73c\ub2c8 \uc774\ud63c \ud6c4 12\uac1c\uc6d4\u00b7\uc0ac\uc2e4\ud63c \uacb0\ubcc4 \ud6c4 2\ub144 \ub9c8\uac10 \uae30\ud55c\uc774\ub098 \ube44\uc790 \uae30\ud55c\uc774 \uc784\ubc15\ud588\ub2e4\uba74 \uc9c0\uccb4 \uc5c6\uc774 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uac80\ud1a0\ub97c \ubc1b\uc544 \ubcf4\uc138\uc694.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">\ud568\uaed8 \uc77d\uc73c\uba74 \uc88b\uc740 \uac00\uc871\ubc95 \ud310\ub840 \uce7c\ub7fc<\/h3>\n        <a href=\"../../?lang=ko&amp;tab=family\" class=\"col-back-link num\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../property-reforms-2026/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">2025\u20132026 \uac1c\uc815 \ud574\uc124 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 01<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \uac00\uc871\ubc95 \uc7ac\uc0b0\ubd84\ud560 \uac1c\ud3b8 \ud575\uc2ec: \uacbd\uc81c\uc801 \ud559\ub300 \ubc18\uc601, \ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ud574\uc678\uc790\uc0b0, \ubc18\ub824\ub3d9\ubb3c \ubc0f \uc81c\ucc99\uae30\uac04 \ucd1d\uc815\ub9ac<\/h4><p class=\"col-sib-desc\">\uc774\ubbf8 \uc368\ubc84\ub9b0 \ub3c8 \ud569\uc0b0(Add-backs) \ud3d0\uc9c0, \uacbd\uc81c\uc801 \ud559\ub300 \ubc18\uc601, \ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ud55c\uad6d \uc7ac\uc0b0 \uacf5\uac1c \uc758\ubb34, \ubc18\ub824\ub3d9\ubb3c \uadc0\uc18d \uae30\uc900, \uadf8\ub9ac\uace0 12\uac1c\uc6d4/2\ub144 \uc7ac\uc0b0\ubd84\ud560 \ub9c8\uac10 \uae30\ud55c\uae4c\uc9c0 \uc54c\uae30 \uc27d\uac8c \uc815\ub9ac\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../divorce-parenting-reality-guide/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc2e4\uc804 \uac00\uc774\ub4dc \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 02<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \uc774\ud63c \uc808\ucc28\uc640 \uc7ac\uc0b0\ubd84\ud560\u00b7\uc591\uc721\uad8c, \ubcc0\ud638\uc0ac \uc120\uc784 \uc804 \ubc18\ub4dc\uc2dc \uc54c\uc544\uc57c \ud560 \ud604\uc2e4 \uae30\uc900<\/h4><p class=\"col-sib-desc\">\uc678\ub3c4 \uc704\uc790\ub8cc\uc5d0 \ub300\ud55c \uc624\ud574\uc640 \ud55c\uacb0 \uc26c\uc6cc\uc9c4 \uc11c\uba74 \uc774\ud63c \uc808\ucc28, \ubc18\ubc18 \uacf5\ub3d9\uc591\uc721 \ucd94\uc815 \ud3d0\uc9c0, \uadf8\ub9ac\uace0 \uc18c\uc561 \uc7ac\uc0b0 \uc0ac\uac74(\u2264$550k)\uacfc \uc815\uc561 \ud569\uc758\uba85\ub839($4,950) \uc911 \ubb34\uc5c7\uc774 \uc774\ub4dd\uc778\uc9c0 \uc9da\uc5b4 \ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../partner-visa-breakdown-crossborder/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc774\ubbfc\u00b7\uac00\uc871\ubc95 \uad50\ucc28 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 03<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \ud30c\ud2b8\ub108\ube44\uc790 \uc9c4\ud589 \uc911 \uacb0\ubcc4\u00b7\uac00\uc815\ud3ed\ub825\uacfc \ud55c\u00b7\ud638 \uad6d\uc81c \uc7ac\uc0b0\ubd84\ud560 \uc2e4\uc804 \ub300\ucc98\ubc95<\/h4><p class=\"col-sib-desc\">\ubc30\uc6b0\uc790\uc758 \ube44\uc790 \ucde8\uc18c \ud611\ubc15\uc5d0 \ub300\ucc98\ud558\ub294 \ubc95\ubd80\ud130 \uac00\uc815\ud3ed\ub825 \uc601\uc8fc\uad8c \uad6c\uc81c \uc694\uac74, \ud55c\uad6d\u00b7\ud638\uc8fc \uc591\uad6d \uc7ac\uc0b0 \uc815\ub9ac, \uc544\uc774\ub97c \ub3d9\uc758 \uc5c6\uc774 \ub370\ub9ac\uace0 \ucd9c\uad6d\ud558\uba74 \uc548 \ub418\ub294 \uc774\uc720\uae4c\uc9c0 \uc27d\uac8c \ud480\uc5b4\uc37c\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../parental-advances-loans-gifts-divorce/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubd80\ubaa8 \uc9c0\uc6d0\uae08\u00b7\ucc28\uc6a9\uc99d \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 14<\/span><h4 class=\"col-sib-title\">\ud55c\uad6d \ubd80\ubaa8\ub2d8\uc774 \ubcf4\ud0dc\uc900 \uc9d1\uac12 3\uc5b5, \ud638\uc8fc \uc774\ud63c\ud560 \ub54c \ub3cc\ub824\uc904 \ub300\uc5ec\uae08\uc77c\uae4c \ub098\ub20c \uc99d\uc5ec\uc77c\uae4c<\/h4><p class=\"col-sib-desc\">\ud55c\uad6d\u00b7\ud638\uc8fc \ubd80\ubaa8\ub2d8\uc774 \uc9d1 \uc0b4 \ub54c \ubcf4\ud0dc\uc8fc\uc2e0 \ub3c8\uc774 \uac1a\uc544\uc57c \ud560 \ube5a\uc73c\ub85c \uba3c\uc800 \ube60\uc9c0\ub294 \uacbd\uc6b0\uc640 \ubd80\ubd80 \uc7ac\uc0b0\uc5d0 \uc11e\uc774\ub294 \ucc28\uc774\ub97c \uc2e4\uc81c \ud310\ub840\ub85c \uc54c\uae30 \uc27d\uac8c \ube44\uad50\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../family-trusts-companies-valuation-divorce/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uac00\uc871\uc2e0\ud0c1\u00b7\ubc95\uc778\uac10\uc815 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 15<\/span><h4 class=\"col-sib-title\">\uc7ac\uc0b0\uc744 \uac00\uc871\uc2e0\ud0c1(Family Trust)\uc774\ub098 Pty Ltd \ubc95\uc778\uc5d0 \ub123\uc5b4\ub450\uba74 \uc774\ud63c \uc7ac\uc0b0\ubd84\ud560\uc5d0\uc11c \uc548\uc804\ud560\uae4c<\/h4><p class=\"col-sib-desc\">\ub204\uac00 \uc2e0\ud0c1\uc758 \uc2e4\uc81c \uacb0\uc815\uad8c(Appointor)\uc744 \uc950\uace0 \uc788\ub294\uc9c0 \ub530\uc9c0\ub294 \uae30\uc900\ubd80\ud130 \uacf5\ub3d9 \uac10\uc815\uc778 \uc808\ucc28\uc640 \ubc95\uc778 \ub3c8\uc744 \uc62e\uae38 \ub54c \uc138\uae08\uc744 \uc544\ub07c\ub294 \ubc29\ubc95\uae4c\uc9c0 \uc9da\uc5b4 \ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../post-separation-inheritances-windfalls-delay/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubcc4\uac70 \ud6c4 \uc0c1\uc18d\u00b7\uc9c0\uccb4\uc704\ud5d8 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 16<\/span><h4 class=\"col-sib-title\">\ubcc4\uac70\ud55c \uc9c0 4\ub144 \uc9c0\ub0ac\uc73c\ub2c8 \uc0c8\ub85c \ubc1b\uc740 \uc0c1\uc18d\uc774\ub098 \uc9d1\uac12 \uc0c1\uc2b9\ubd84\uc740 \ub0b4 \uac83\uc774\uaca0\uc9c0: \ud569\uc758\uba85\ub839(Consent Orders)\uc744 \ubbf8\ub8ec \ub300\uac00<\/h4><p class=\"col-sib-desc\">\ubcc4\uac70 \ub4a4 \uc11c\ub958 \uc815\ub9ac\ub97c \ud3c9\uade0 4\ub144\uc529 \ubbf8\ub8e8\ub2e4 \ub098\uc911\uc5d0 \ubc1b\uc740 \uc0c1\uc18d\uae08\uc774\ub098 \uc624\ub978 \uc9d1\uac12\uae4c\uc9c0 \ub098\ub204\uac8c \ub418\ub294 \uc774\uc720\uc640 $4,950 \ubc95\uc6d0 \ud569\uc758\uba85\ub839\uc73c\ub85c \uc548\uc804\ud558\uac8c \ub9c8\ubb34\ub9ac\ud558\ub294 \ubc95\uc744 \ub2f4\uc558\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../de-facto-threshold-disputes-out-of-time-s44/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc0ac\uc2e4\ud63c \uacbd\uacc4\u00b7\uae30\ud55c\ub3c4\uacfc \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 18<\/span><h4 class=\"col-sib-title\">\ub3d9\uac70\ub294 \uc548 \ud558\uace0 \uc0dd\ud65c\ube44\ub9cc \uc92c\ub294\ub370 \uc0ac\uc2e4\ud63c(De Facto) \uc18c\uc1a1\uc774 \ub4e4\uc5b4\uc654\ub2e4\uba74: \uc0ac\uc2e4\ud63c \uc778\uc815 \uae30\uc900(s 4AA)\uacfc \ub9c8\uac10 \uae30\ud55c \uc608\uc678 \uc2e0\uccad(s 44)<\/h4><p class=\"col-sib-desc\">\ub2e8\uc21c \uc5f0\uc778 \uad00\uacc4\uc640 \ubc95\uc801 \uc0ac\uc2e4\ud63c\uc744 \uac00\ub974\ub294 &#x27;\ud558\ub098\uc758 \uc0b6(Coupledom)&#x27; \uae30\uc900\ubd80\ud130 \uae30\ud63c\uc790\uc640\uc758 \uc774\uc911 \uc0ac\uc2e4\ud63c, \ub9c8\uac10 \uae30\ud55c\uc774 \uc9c0\ub09c \uc0ac\uac74\uc758 \ub300\uc751\ubc95\uae4c\uc9c0 \uc27d\uac8c \uc815\ub9ac\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}, "en": {"doc_title": "Why Prenups Get Crushed Under Thorne v Kennedy and When $4,950 Consent Orders Beat a BFA \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">All Guides Hub<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=en\">Visa Solution Guide<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=en\">Employment Navigator<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=en\">DIY & Cost-Smart Guide<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\">Consult Park & Co \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=en&amp;tab=family\" class=\"col-back-btn\">\u2190 Back to Family Law Self-Help Hub<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">Park &amp; Co Lawyers \u00b7 Family Law Deep-Dive Column<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn\">KO<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn active\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">Consult Park &amp; Co \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">PRENUPS &amp; CONSENT ORDERS \u00b7 FAMILY 17<\/span>\n          <span class=\"col-verified-pill num\">Primary-Source Verified (Nov 2026)<\/span>\n          <span class=\"col-time-pill num\">8 min read<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">Why Prenups Get Crushed Under Thorne v Kennedy and When $4,950 Consent Orders Beat a BFA<\/h1>\n        <p class=\"col-subtitle\">Unconscionable conduct and undue influence in Thorne v Kennedy, strict s 90G compliance (Black; Saintclaire), and choosing the right binding instrument<\/p>\n\n        <div class=\"col-byline\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">Chang Min Park<\/div>\n            <div class=\"col-author-role\">Legal Practitioner Director, Park &amp; Co Lawyers \u00b7 Accredited Specialist in Immigration Law (QLS)<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col17_fam_bfa_hero.jpg\" alt=\"Why Prenups Get Crushed Under Thorne v Kennedy and When $4,950 Consent Orders Beat a BFA\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">Solicitor s 90G certificates will not rescue a last-minute prenup signed under &#x27;wedding-is-off&#x27; pressure, whereas post-separation Consent Orders carry upfront judicial scrutiny at a fraction of the cost.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">Unanimous HCA<\/div><div class=\"col-stat-lbl\">Both pre-nup &amp; post-nup crushed despite ILA in Thorne v Kennedy [2017]<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">$4,950 + $215<\/div><div class=\"col-stat-lbl\">Fixed-fee post-separation Consent Orders vs dual-law-firm s 90D BFA fees<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">s 90B / s 90UB<\/div><div class=\"col-stat-lbl\">Essential pre-relationship BFA track where Consent Orders cannot be used<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">In This Column<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#how-thorne-v-kennedy-dismantled-wedding-eve-pren\" class=\"col-toc-link lvl-2\">How Thorne v Kennedy dismantled wedding-eve prenups<\/a><a href=\"#technical-s-90g-defects-in-black-versus-durable-\" class=\"col-toc-link lvl-2\">Technical s 90G defects in Black versus durable bargaining in Saintclaire<\/a><a href=\"#already-separated-why-4950-consent-orders-beat-a\" class=\"col-toc-link lvl-2\">Already separated: why $4,950 consent orders beat a post-separation BFA<\/a><a href=\"#intact-couples-and-second-marriages-when-a-bfa-i\" class=\"col-toc-link lvl-2\">Intact couples and second marriages: when a BFA is the only lawful shield<\/a><a href=\"#choosing-the-right-instrument-for-permanent-asse\" class=\"col-toc-link lvl-2\">Choosing the right instrument for permanent asset finality<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">Open Family Law Consultation Form<\/a>\n              <a href=\"../../?lang=en&amp;tab=family\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 Back to Family Law Self-Help Hub<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">Clients walk into family law offices asking for a &quot;bulletproof prenup&quot; or a quick Binding Financial Agreement as if both work like a commercial lease. Under Part VIIIA (marriages) and Part VIIIAB (de facto couples) of the <em>Family Law Act 1975<\/em> (Cth), contracting out of the court&#x27;s property power is technically unforgiving. Rushing timing or disclosure before a wedding leaves the agreement ready to collapse. Just as costly, many separated couples are steered into paying two law firms $15,000 or more for a post-separation BFA when fixed-fee Consent Orders deliver stronger finality for far less.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 382\" width=\"100%\" role=\"img\" aria-label=\"Binding Financial Agreement (BFA) vs $4,950 Court Consent Orders\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"381\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">INSTRUMENT CHOICE \u00b7 BINDING FINANCIAL AGREEMENT VS CONSENT ORDERS<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">Binding Financial Agreement (BFA) vs $4,950 Court Consent Orders<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">Authorities: Thorne v Kennedy [2017] HCA 49 \u00b7 Black &amp; Black [2008] FamCAFC 7 \u00b7 Saintclaire [2015] FamCAFC 245<\/text>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"38\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">INSTRUMENT A \u00b7 BINDING FINANCIAL AGREEMENT (BFA)<\/text>\n  <circle cx=\"42\" cy=\"144\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"54\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Essential For: Pre-Marital &amp; Intact Couples<\/text>\n  <text x=\"54\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">Consent Orders are unavailable before breakdown; wealth protection needs a BFA.<\/text>\n  <circle cx=\"42\" cy=\"196\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"54\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Two Separate Law Firms Mandatory (s 90G)<\/text>\n  <text x=\"54\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">Each party requires independent legal advice certificates ($8k\u2013$15k+ combined).<\/text>\n  <circle cx=\"42\" cy=\"248\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"54\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Thorne v Kennedy [2017] HCA 49 Vulnerability<\/text>\n  <text x=\"54\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">&#x27;Sign or wedding is off&#x27; pressure &amp; non-disclosure crush BFAs despite ILA.<\/text>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1.3\"/>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#1D6B48\"/>\n  <text x=\"466\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">INSTRUMENT B \u00b7 COURT CONSENT ORDERS (POST-SEPARATION)<\/text>\n  <circle cx=\"470\" cy=\"144\" r=\"4\" fill=\"#1D6B48\"/>\n  <text x=\"482\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Gold Standard Once Separated &amp; Agreed<\/text>\n  <text x=\"482\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">No mandatory dual-firm s 90G certificates; fixed $4,950 + $215 filing fee.<\/text>\n  <circle cx=\"470\" cy=\"196\" r=\"4\" fill=\"#1D6B48\"/>\n  <text x=\"482\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Registrar Vets &#x27;Just &amp; Equitable&#x27; Fairness Upfront<\/text>\n  <text x=\"482\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">Court seal gives rock-solid finality, far harder to overturn than a BFA.<\/text>\n  <circle cx=\"470\" cy=\"248\" r=\"4\" fill=\"#1D6B48\"/>\n  <text x=\"482\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Stamp-Duty Exemption &amp; Super Split Included<\/text>\n  <text x=\"482\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">Handles property transfer duty relief &amp; 28-day Super Trustee notice.<\/text>\n  <rect x=\"22\" y=\"328\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"351\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1D6B48\">Decision Rule: Use an early, disclosure-backed BFA BEFORE marriage/cohabitation; use $4,950 Consent Orders AFTER separation.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 1: Choosing Between Binding Financial Agreements (BFAs) and Fixed-Fee Consent Orders<\/figcaption><\/figure>\n<h2 id=\"how-thorne-v-kennedy-dismantled-wedding-eve-pren\" class=\"doc-h2\">How Thorne v Kennedy dismantled wedding-eve prenups<\/h2>\n<p class=\"doc-p\">For years, wealthier spouses assumed that so long as their partner sat with a separate solicitor and obtained an s 90G Certificate of Independent Legal Advice, the resulting Binding Financial Agreement could never be overturned on fairness grounds. The High Court demolished that belief unanimously in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2017/49.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Thorne v Kennedy<\/em> [2017] HCA 49<\/a>.<\/p>\n<p class=\"doc-p\">Mr Kennedy, a property developer worth between $18 million and $24 million, brought Ms Thorne to Australia to marry, knowing she spoke limited English, held almost no personal assets, and depended on the marriage for her visa pathway. Eleven days before the ceremony, after her overseas family had already flown in and reception arrangements were booked, he handed her an s 90B prenuptial agreement offering a token payout upon separation and told her that if she refused to sign, the wedding was off. Her independent solicitor wrote blunt advice calling it the worst agreement the lawyer had ever seen and urging her not to sign. She signed four days before the ceremony anyway, then signed a mirror s 90C postnuptial agreement thirty days later.<\/p>\n<p class=\"doc-p\">Setting aside both agreements under ss 90K and 90KA for undue influence and unconscionable conduct, the High Court ruled that legal advice certificates never cure an illegitimate ultimatum. That Ms Thorne signed despite fierce legal warnings proved how absent free choice really was. Six factors listed in <em>Thorne v Kennedy<\/em> still govern prenuptial risk nationwide: whether terms were offered as non-negotiable, emotional pressure surrounding a public wedding, time allowed for reflection, financial and visa dependency, and the substantive harshness of the outcome.<\/p>\n<h2 id=\"technical-s-90g-defects-in-black-versus-durable-\" class=\"doc-h2\">Technical s 90G defects in Black versus durable bargaining in Saintclaire<\/h2>\n<p class=\"doc-p\">Even without wedding-eve threats, BFAs face strict statutory scrutiny because they bar citizens from approaching the court. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2008/7.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Black &amp; Black<\/em> [2008] FamCAFC 7<\/a>, the Full Court held that strict compliance with the formal advice and certificate mandates in s 90G(1) (mirrored in s 90UJ(1) for de facto couples) is required to oust jurisdiction. Although Parliament later inserted a narrow saving discretion in s 90G(1A) and s 90UJ(1A) where refusing enforcement over a technical slip would be unjust and inequitable, cut-price template certificates, material asset non-disclosure (s 90K(1)(a)), or unprovided-for hardship involving a child born later (s 90K(1)(d)) regularly trigger six-figure set-aside trials.<\/p>\n<p class=\"doc-p\">Financial Agreements remain enforceable when negotiated properly. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2015/245.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Saintclaire &amp; Saintclaire<\/em> [2015] FamCAFC 245<\/a>, the Full Court overturned a trial judge and upheld an s 90C agreement executed during marriage. Both spouses understood business affairs, exchanged transparent asset schedules, negotiated genuine amendments through independent solicitors over months free of coercion, and reached real give-and-take terms.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table doc-table-wide\" data-cols=\"5\"><thead><tr><th style=\"text-align:left\">Instrument<\/th><th style=\"text-align:left\">Relationship Stage<\/th><th style=\"text-align:left\">Legal Representation &amp; Cost<\/th><th style=\"text-align:left\">Court Fairness Review<\/th><th style=\"text-align:left\">Set-Aside Risk &amp; Duty Relief<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>FCFCOA Consent Orders<\/strong> (s 79 / s 90SM)<\/td><td style=\"text-align:left\">Post-separation only<\/td><td style=\"text-align:left\">Park &amp; Co $4,950 fixed fee + $215 court fee (1 firm drafts; second lawyer optional)<\/td><td style=\"text-align:left\">Yes: Registrar checks deal is &quot;just and equitable&quot; (s 79(2)) on the papers (~4 wks)<\/td><td style=\"text-align:left\">Very hard to overturn (s 79A / s 90SN); triggers state duty exemptions &amp; Pt VIIIB super splits<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Post-Separation BFA<\/strong> (s 90C, s 90D or s 90UD)<\/td><td style=\"text-align:left\">Post-separation or post-divorce<\/td><td style=\"text-align:left\">2 separate law firms mandatory (s 90G / s 90UJ); often $12,000\u2013$24,000 combined<\/td><td style=\"text-align:left\">None: never filed in court<\/td><td style=\"text-align:left\">Exposed to s 90K / s 90UM non-disclosure &amp; unconscionability suits; duty exemption applies<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Prenuptial or Cohabitation BFA<\/strong> (s 90B / s 90UB)<\/td><td style=\"text-align:left\">Before marriage or moving in together<\/td><td style=\"text-align:left\">2 separate law firms mandatory; drafted 4\u20136+ months early with full disclosure<\/td><td style=\"text-align:left\">None: zero Consent Order power before separation<\/td><td style=\"text-align:left\">Durable if bargained early per <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FamCAFC/2015/245.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Saintclaire<\/em> [2015] FamCAFC 245<\/a>; crushed if rushed per <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2017/49.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Thorne v Kennedy<\/em> [2017] HCA 49<\/a><\/td><\/tr><tr><td style=\"text-align:left\"><strong>Intact-Relationship BFA<\/strong> (s 90C / s 90UC)<\/td><td style=\"text-align:left\">During intact marriage or de facto relationship<\/td><td style=\"text-align:left\">2 separate law firms mandatory; full asset &amp; trust schedules exchanged<\/td><td style=\"text-align:left\">None<\/td><td style=\"text-align:left\">Quarantines inheritances, trading businesses, or blended-family estates while relationship is healthy<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"already-separated-why-4950-consent-orders-beat-a\" class=\"doc-h2\">Already separated: why $4,950 consent orders beat a post-separation BFA<\/h2>\n<p class=\"doc-p\">Once a relationship breaks down and both parties agree on splitting home equity, cash, and superannuation, Consent Orders beat a post-separation BFA (s 90C, s 90D, or s 90UD) in nine out of ten cases. A BFA forces ex-partners to pay two separate law firms for opposing s 90G or s 90UJ certificates while leaving a private contract unvetted by a court.<\/p>\n<p class=\"doc-p\">Park &amp; Co prepares the Application for Consent Orders and Minute of Order for a $4,950 fixed fee plus the $215 court fee. A Judicial Registrar reviews the papers in chambers in roughly four weeks without a hearing. Because the Court certifies under s 79(2) or s 90SM(2) that the split is just and equitable before sealing, Consent Orders deliver judicial finality, stamp-duty relief, and binding Part VIIIB super splits. A post-separation BFA suits only unusual deals outside the s 79 range that a registrar would refuse, or outright spousal maintenance releases.<\/p>\n<h2 id=\"intact-couples-and-second-marriages-when-a-bfa-i\" class=\"doc-h2\">Intact couples and second marriages: when a BFA is the only lawful shield<\/h2>\n<p class=\"doc-p\">Before separation, the FCFCOA has zero power to make property Consent Orders. If you are entering a second marriage with children&#x27;s inheritance expectations, bringing real estate or company shares into cohabitation, or receiving a family advance conditioned on asset protection, an s 90B, s 90UB, s 90C, or s 90UC BFA is the only statutory tool available. Drafting should start four to six months before any wedding, backed by full asset schedules, independent legal bargaining, and child-related review clauses.<\/p>\n<h2 id=\"choosing-the-right-instrument-for-permanent-asse\" class=\"doc-h2\">Choosing the right instrument for permanent asset finality<\/h2>\n<p class=\"doc-p\">Separated couples who agree on terms can finalise their split through Park &amp; Co&#x27;s $4,950 fixed-fee Consent Orders package (+ $215 court fee), while intact couples can instruct us early to build a disclosure-backed s 90B or s 90UB BFA that withstands <em>Thorne v Kennedy<\/em> scrutiny. Where an ex-partner hides balances, refuses settlement, or relies on a pressured prenup, we enforce s 71B and s 90RI disclosure and litigate Part VIIIA / VIIIAB claims. Complete the <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Family Law Consultation Form<\/a> or visit the <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Official Links Hub<\/a> to begin.<\/p>\n\n          <div class=\"col-sources-box\">\n            Primary Authorities: Family Law Act 1975 (Cth) Part VIIIA (ss 90B\u201390KA), Part VIIIAB (ss 90UB\u201390UN), ss 79, 79A \u00b7 Thorne v Kennedy [2017] HCA 49 \u00b7 Black &amp; Black [2008] FamCAFC 7 \u00b7 Saintclaire &amp; Saintclaire [2015] FamCAFC 245.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">WHEN TO CONSULT PARK &amp; CO LAWYERS \u00b7 FAMILY LAW<\/span>\n            <h3 class=\"col-cta-title\">Ready to Lock In $4,950 Consent Orders, Compel Disclosure, or Protect Family Assets?<\/h3>\n            <p class=\"col-cta-desc\">Save thousands on straightforward No-Fault Divorce using our DIY manual; when you need enforceable Consent Orders, formal financial disclosure demands, or cross-border property protection, submit your key dates via our 3-minute consultation form.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">Open Family Law Consultation Form<\/a>\n              <a href=\"../../files/EN/PDF/03_Family_Law_Divorce_Property_Parenting_and_Settlement_Manual_2026_EN.pdf\" download class=\"col-btn-ghost\">Download Manual 03 (Family Law PDF)<\/a>\n              <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">Park &amp; Co Official Consultation Hub<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">Legal Disclaimer: This publication provides general legal information grounded in Australian legislation, official statistics and superior court authorities current as at November 2026. It does not constitute legal advice for your specific circumstances or create a solicitor-client relationship. Seek formal advice promptly before statutory limitation or visa deadlines expire.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">More Curated Family Law Columns<\/h3>\n        <a href=\"../../?lang=en&amp;tab=family\" class=\"col-back-link num\">\u2190 Back to Family Law Self-Help Hub<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../property-reforms-2026/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">2025\u20132026 REFORM BRIEFING \u00b7 FAMILY 01<\/span><h4 class=\"col-sib-title\">Australia&#x27;s 2025\u20132026 Property Settlement Overhaul: Economic Abuse, Separate Accounts, Family Pets &amp; Limitation Bars<\/h4><p class=\"col-sib-desc\">Covers the abolition of balance-sheet add-backs, s 4AB(2A) economic abuse proof thresholds, separate accounts and overseas assets under s 71B, the ban on shared pet custody, and strict s 44 time bars.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../divorce-parenting-reality-guide/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PRACTICAL REALITY GUIDE \u00b7 FAMILY 02<\/span><h4 class=\"col-sib-title\">Divorce, Parenting &amp; Property in Australia: The Practical Reality Check Before You Hire a Lawyer<\/h4><p class=\"col-sib-desc\">Explains s 48 no-fault DIY divorce and June 2025 s 98A paper hearings, the repeal of equal-time parenting presumptions (Gallagher, Picard, Radecki), PPP &lt;=$550k vs $4,950 Consent Orders.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../partner-visa-breakdown-crossborder/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">FAMILY &amp; VISA INTERSECTION \u00b7 FAMILY 03<\/span><h4 class=\"col-sib-title\">Partner Visa Breakdown, Division 1.5 Family Violence PR &amp; Cross-Border Property Traps<\/h4><p class=\"col-sib-desc\">Why sponsors cannot cancel visas, clearing the Gupta genuine-relationship gate and July 2024 Subclass 309 entry rules, aligning FCFCOA and DHA affidavits, and avoiding s 65Y travel offences.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a><a href=\"../parental-advances-loans-gifts-divorce/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PARENTAL ADVANCES \u00b7 FAMILY 14<\/span><h4 class=\"col-sib-title\">The Bank of Mum and Dad in Australian Divorce: Repayable Loan, Resulting Trust or Gift?<\/h4><p class=\"col-sib-desc\">Distinguishes deductible balance-sheet debts from s 79(4) contributions, resulting trusts vs advancement presumptions, and third-party parent interventions.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../family-trusts-companies-valuation-divorce/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">TRUSTS &amp; VALUATIONS \u00b7 FAMILY 15<\/span><h4 class=\"col-sib-title\">Family Trusts, Private Pty Ltd Companies and Shadow Business Valuations in Property Settlements<\/h4><p class=\"col-sib-desc\">Covers appointor/trustee control vs genuine third-party partners (Ascot), mandatory Single Expert Witness rules, s 106B clawbacks, and tax-effective s 79 orders.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a><a href=\"../post-separation-inheritances-windfalls-delay/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">POST-SEPARATION WEALTH \u00b7 FAMILY 16<\/span><h4 class=\"col-sib-title\">Why Delaying Consent Orders Exposes Post-Separation Inheritances, Lotto Wins and New Equity<\/h4><p class=\"col-sib-desc\">How leaving informal separations unsealed exposes inheritances received 4 years later, $5M\u2013$6M lottery windfalls and rising home equity, and how $4,950 Consent Orders close the door.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../de-facto-threshold-disputes-out-of-time-s44/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">DE FACTO &amp; TIME BARS \u00b7 FAMILY 18<\/span><h4 class=\"col-sib-title\">&quot;Were We Even De Facto?&quot; Litigating s 4AA Thresholds, Concurrent Marriages and Out-of-Time Leave<\/h4><p class=\"col-sib-desc\">Why a 17-year secret relationship with monthly allowances failed s 4AA, when concurrent marriages still allow de facto claims, and how courts weigh s 44 hardship and delay.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}}</script>
