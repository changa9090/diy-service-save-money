  <script id="col-payload" type="application/json">{"ko": {"doc_title": "\ud638\uc8fc \uac00\uc871\ubc95 \uc7ac\uc0b0\ubd84\ud560 \uac1c\ud3b8 \ud575\uc2ec: \uacbd\uc81c\uc801 \ud559\ub300 \ubc18\uc601, \ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ud574\uc678\uc790\uc0b0, \ubc18\ub824\ub3d9\ubb3c \ubc0f \uc81c\ucc99\uae30\uac04 \ucd1d\uc815\ub9ac \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">\uc804\uccb4 \uac00\uc774\ub4dc \ud648<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=ko\">\ube44\uc790 \uc194\ub8e8\uc158 \uac00\uc774\ub4dc<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=ko\">\uace0\uc6a9\ubc95 \ub0b4\ube44\uac8c\uc774\ud130<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=ko\">\uc140\ud504 \ubc95\ub960 \ud574\uacb0 \u00b7 \ubcc0\ud638\uc0ac \uc0c1\ub2f4 \uc2dc\uc810 \uac00\uc774\ub4dc<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\">\ubc15\uc564\ucf54 \uc0c1\ub2f4 \uc2e0\uccad \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=ko&amp;tab=family\" class=\"col-back-btn\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \u00b7 \ud638\uc8fc \uac00\uc871\ubc95 \uc26c\uc6b4 \ud310\ub840 \uce7c\ub7fc<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn active\">\ud55c\uad6d\uc5b4<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">\uc628\ub77c\uc778 \uc0c1\ub2f4 \uc2e0\uccad \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">2025\u20132026 \uac1c\uc815 \ud574\uc124 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 01<\/span>\n          <span class=\"col-verified-pill num\">1\ucc28 \ubc95\ub839\u00b7\ud310\ub840 \uac80\uc99d \uc644\ub8cc (2026.11)<\/span>\n          <span class=\"col-time-pill num\">\uc57d 9\ubd84 \uc18c\uc694<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">\ud638\uc8fc \uac00\uc871\ubc95 \uc7ac\uc0b0\ubd84\ud560 \uac1c\ud3b8 \ud575\uc2ec: \uacbd\uc81c\uc801 \ud559\ub300 \ubc18\uc601, \ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ud574\uc678\uc790\uc0b0, \ubc18\ub824\ub3d9\ubb3c \ubc0f \uc81c\ucc99\uae30\uac04 \ucd1d\uc815\ub9ac<\/h1>\n        <p class=\"col-subtitle\">2025\ub144 6\uc6d4 10\uc77c \uc2dc\ud589 \uac1c\uc815 \uac00\uc871\ubc95(s 79\u00b7s 90SM)\uacfc Shinohara\u00b7Franc\u00b7Wright \ub4f1 2025\u20132026\ub144 \ucd5c\uc2e0 \ud310\ub840 \ubc0f \uad6d\uc138\uccad(ATO) \uc5f0\uae08 \uaca9\ucc28 \ud1b5\uacc4 \ubd84\uc11d<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">\ubc15\ucc3d\ubbfc \ub300\ud45c\ubcc0\ud638\uc0ac (Chang Min Park)<\/div>\n            <div class=\"col-author-role\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \ub300\ud45c\ubcc0\ud638\uc0ac \u00b7 \ud638\uc8fc \ud038\uc990\ub79c\ub4dc\uc8fc \ubcc0\ud638\uc0ac\ud68c \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col01_property_hero.jpg\" alt=\"\ud638\uc8fc \uac00\uc871\ubc95 \uc7ac\uc0b0\ubd84\ud560 \uac1c\ud3b8 \ud575\uc2ec: \uacbd\uc81c\uc801 \ud559\ub300 \ubc18\uc601, \ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ud574\uc678\uc790\uc0b0, \ubc18\ub824\ub3d9\ubb3c \ubc0f \uc81c\ucc99\uae30\uac04 \ucd1d\uc815\ub9ac\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">\uac1c\uc815 \ud638\uc8fc \uac00\uc871\ubc95(s 79\u00b7s 90SM)\uc5d0\uc11c\ub294 \ub2e8\ub3c5 \uba85\uc758 \uacc4\uc88c\uc640 \ubd80\ub3d9\uc0b0 \ubc0f \ud1f4\uc9c1\uc5f0\uae08\uacfc \ubc18\ub824\ub3d9\ubb3c \uadc0\uc18d \uadf8\ub9ac\uace0 \uc7ac\uc0b0\ubd84\ud560 \uc81c\ucc99\uae30\uac04\uc774 \ub2e8\uc77c \ubc95\uc815 \uccb4\uacc4\ub85c \uaddc\uc728\ub429\ub2c8\ub2e4.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">26.1%\u201350%<\/div><div class=\"col-stat-lbl\">40\u201354\uc138 \ub0a8\ub140 \ubc0f \ube44\uc601\uc5b4\uad8c \uc774\ubbfc\uc790(NESB) \ud1f4\uc9c1\uc5f0\uae08 \uaca9\ucc28 (ATO\u00b7ASFA)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">0\uac74 \ud5c8\uc6a9<\/div><div class=\"col-stat-lbl\">\ubc18\ub824\ub3d9\ubb3c \uacf5\ub3d9 \uc18c\uc720\u00b7\ubc88\uac08\uc544 \ub3cc\ubcf4\uae30 \uba85\ub839 (s 79(6)\u2013(7) \uc804\uba74 \uae08\uc9c0)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">12\uac1c\uc6d4 / 2\ub144<\/div><div class=\"col-stat-lbl\">\uc774\ud63c \ubc1c\ud6a8 \ud6c4(\ubc95\ub960\ud63c) / \ubcc4\uac70 \ud6c4(\uc0ac\uc2e4\ud63c) \uc7ac\uc0b0\ubd84\ud560 \uc808\ub300 \uc81c\ucc99\uae30\uac04<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">\uc774 \uce7c\ub7fc\uc758 \ubaa9\ucc28<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#\ud310\ub840\uc5d0\ub9cc-\uc788\ub358-4\ub2e8\uacc4-\uc7ac\uc0b0\ubd84\ud560-\uacf5\uc2dd\uc758-\uba85\ubb38\ud654\uc640-\uac00\uc0c1-\ud569\uc0b0add-backs\uc758-\uc885\ub9d0\" class=\"col-toc-link lvl-2\">\ud310\ub840\uc5d0\ub9cc \uc788\ub358 4\ub2e8\uacc4 \uc7ac\uc0b0\ubd84\ud560 \uacf5\uc2dd\uc758 \uba85\ubb38\ud654\uc640 \uac00\uc0c1 \ud569\uc0b0(Add-backs)\uc758 \uc885\ub9d0<\/a><a href=\"#\uacbd\uc81c\uc801\uc7ac\uc815\uc801-\ud559\ub300s-4ab2a\uc758-\uba85\ubb38\ud654\uc640-\uc785\uc99d\uc758-\ubb38\ud131\" class=\"col-toc-link lvl-2\">\uacbd\uc81c\uc801\u00b7\uc7ac\uc815\uc801 \ud559\ub300(s 4AB(2A))\uc758 \uba85\ubb38\ud654\uc640 \uc785\uc99d\uc758 \ubb38\ud131<\/a><a href=\"#\ud1b5\uacc4\uac00-\uacbd\uace0\ud558\ub294-\ud1f4\uc9c1\uc5f0\uae08super-\uaca9\ucc28-\uc9d1\uac12\ub9cc-\ubcf4\uace0-\ub3c4\uc7a5-\ucc0d\uc73c\uba74-\uc548-\ub418\ub294-\uc774\uc720\" class=\"col-toc-link lvl-2\">\ud1b5\uacc4\uac00 \uacbd\uace0\ud558\ub294 \ud1f4\uc9c1\uc5f0\uae08(Super) \uaca9\ucc28: \uc9d1\uac12\ub9cc \ubcf4\uace0 \ub3c4\uc7a5 \ucc0d\uc73c\uba74 \uc548 \ub418\ub294 \uc774\uc720<\/a><a href=\"#\ubcc4\ub3c4-\ud1b5\uc7a5\ub2e8\ub3c5-\uba85\uc758\ud55c\uad6d-\uc790\uc0b0\uacfc-\uc804\uba74-\uc7ac\uc0b0\uacf5\uac1c-\uc758\ubb34s-71b\" class=\"col-toc-link lvl-2\">\ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ub2e8\ub3c5 \uba85\uc758\u00b7\ud55c\uad6d \uc790\uc0b0\uacfc \uc804\uba74 \uc7ac\uc0b0\uacf5\uac1c \uc758\ubb34(s 71B)<\/a><a href=\"#\ubc18\ub824\ub3d9\ubb3c-\uacf5\ub3d9-\uc591\uc721\uad8c-\uc804\uba74-\uae08\uc9c0s-7967\uc640-\ub193\uce58\uba74-\ub05d\ub098\ub294-\uc81c\ucc99\uae30\uac04\" class=\"col-toc-link lvl-2\">\ubc18\ub824\ub3d9\ubb3c \uacf5\ub3d9 \uc591\uc721\uad8c \uc804\uba74 \uae08\uc9c0(s 79(6)\u2013(7))\uc640 \ub193\uce58\uba74 \ub05d\ub098\ub294 \uc81c\ucc99\uae30\uac04<\/a><a href=\"#\ub0b4-\uc0ac\uac74\uc5d0-\ub9de\ub294-\ub2e4\uc74c-\ub2e8\uacc4-\uc810\uac80\ud558\uae30\" class=\"col-toc-link lvl-2\">\ub0b4 \uc0ac\uac74\uc5d0 \ub9de\ub294 \ub2e4\uc74c \ub2e8\uacc4 \uc810\uac80\ud558\uae30<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">\uac00\uc871\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../?lang=ko&amp;tab=family\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">\uacb0\ud63c \uae30\uac04 \ub0b4\ub0b4 \uac01\uc790 \ubc88 \ub3c8\uc740 \uac01\uc790 \ud1b5\uc7a5\uc5d0 \ub530\ub85c \ub123\uace4 \ud558\uc8e0. \uc9d1\ub3c4 \ud55c \uc0ac\ub78c \ub2e8\ub3c5 \uba85\uc758\ub85c \uc0ac \ub450\ub294 \uacbd\uc6b0\uac00 \uc788\uc5b4\uc694. \uadf8\ub7ec\ub2c8 \ud5e4\uc5b4\uc9c8 \ub54c\ub3c4 \ub0b4 \uc7ac\uc0b0\uc740 \uc548\uc804\ud560 \uac70\ub77c\uace0 \ubbff\ub294 \ubd84\ub4e4\uc774 \ucc38 \ub9ce\uc544\uc694. \uc0c1\ub2f4\uc2e4\uc5d0\uc11c \ub9c8\uc8fc \uc549\uc544 \ud1b5\uc7a5 \uac70\ub798\ub0b4\uc5ed\uacfc \ub4f1\uae30\ubd80\ubd80\ud130 \uaebc\ub0b4 \ubcf4\uc2dc\ub294 \ubd84\ub4e4\ub3c4 \ud754\ud558\uac70\ub4e0\uc694. \uadf8\ub54c\ub9c8\ub2e4 \uc81c\uac00 \uac00\uc7a5 \uba3c\uc800 \ub4dc\ub9ac\ub294 \ub300\ub2f5\uc740 \ub2e8\ud638\ud574\uc694. \ud638\uc8fc \uac00\uc871\ubc95(Family Law Act 1975)\uc758 \uc6d0\uce59\uc740 \ubd84\uba85\ud558\uac70\ub4e0\uc694. \ubd80\ubd80\uac00 \uc0dd\ud65c\ube44 \ud1b5\uc7a5\uc744 \ub530\ub85c \uc37c\uc5b4\ub3c4 \ub9c8\ucc2c\uac00\uc9c0\uc608\uc694. \ubd80\ub3d9\uc0b0 \uba85\uc758\uac00 \ud55c\ucabd\uc73c\ub85c\ub9cc \ub418\uc5b4 \uc788\ub354\ub77c\ub3c4 \ubd84\ud560 \ub300\uc0c1\uc5d0\uc11c \ube60\uc838\ub098\uac08 \uc218 \uc5c6\uc5b4\uc694. \uac8c\ub2e4\uac00 2025\ub144 6\uc6d4 10\uc77c \uac1c\uc815\ubc95(Family Law Amendment Act 2024)\uc774 \uc804\uba74 \uc2dc\ud589\ub410\uc8e0. \uadf8 \ub4a4\ub97c \uc774\uc5b4 2025~2026\ub144 \uc0c1\uae09\uc2ec \ud310\uacb0\ub4e4\ub3c4 \uc787\ub530\ub77c \ub098\uc654\uc5b4\uc694. \uc774 \ud310\uacb0\ub4e4\uc774 \uc2e4\ubb34 \uacc4\uc0b0\ubc95\uc744 \ubfcc\ub9ac\ubd80\ud130 \ubc14\uafd4 \ub193\uc558\uac70\ub4e0\uc694. \uc608\uc804 \uc778\ud130\ub137 \uac8c\uc2dc\uae00\uc774\ub098 \uc8fc\ubcc0 \uc9c0\uc778\uc758 \uc774\ud63c \uacbd\ud5d8\ub2f4\ub9cc \ubbff\ub294 \ubd84\ub4e4\uc774 \uacc4\uc138\uc694. \uadf8 \ub9d0\ub9cc \ubbff\uace0 \ud569\uc758\uc11c\uc5d0 \ub3c4\uc7a5\uc744 \ucc0d\uace4 \ud558\uc2dc\uc8e0. \uadf8\ub7ec\ub2e4 \uc218\uc2ed\ub9cc \ub2ec\ub7ec\uc5b4\uce58 \ub178\ud6c4 \uc5f0\uae08\uc774\ub098 \uccad\uad6c \uc2dc\ud55c\uc744 \ud1b5\uc9f8\ub85c \ub0a0\ub9ac\uae30\ub3c4 \ud574\uc694. \uc2e4\uc81c\ub85c \ud604\uc7a5\uc5d0\uc11c \uc790\uc8fc \ubc8c\uc5b4\uc9c0\uace0 \uc788\ub294 \uc77c\uc774\uc5d0\uc694.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 344\" width=\"100%\" role=\"img\" aria-label=\"2025\ub144 6\uc6d4 10\uc77c \uac1c\uc815 \ud638\uc8fc \uac00\uc871\ubc95 \uc7ac\uc0b0\ubd84\ud560 4\ub2e8\uacc4 \uad6c\uc870 \ubc0f \ud575\uc2ec \ud310\ub840 \ubcc0\ud654\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"343\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"66\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"67\" x2=\"879\" y2=\"67\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"28\" y=\"27\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.06em\">\ubc95\ub960 \uad6c\uc870\ub3c4 \u00b7 \uac1c\uc815 \uac00\uc871\ubc95(s 79 \u00b7 s 90SM) 4\ub2e8\uacc4 \ubc0f \uc2e0\uc124 \ud2b9\ub840<\/text>\n  <text x=\"28\" y=\"50\" font-size=\"16.5\" font-weight=\"800\" fill=\"#1F242B\">2025\ub144 6\uc6d4 10\uc77c \uac1c\uc815 \ud638\uc8fc \uac00\uc871\ubc95 \uc7ac\uc0b0\ubd84\ud560 4\ub2e8\uacc4 \uad6c\uc870 \ubc0f \ud575\uc2ec \ud310\ub840 \ubcc0\ud654<\/text>\n  <rect x=\"22\" y=\"86\" width=\"196\" height=\"154\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"86\" width=\"196\" height=\"28\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"34\" y=\"104\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">\uad00\ubb38 \u00b7 s 79(2)<\/text>\n  <text x=\"34\" y=\"138\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1F242B\">\uad8c\ub9ac \ubcc0\uacbd\uc758 \uacf5\uc815\u00b7\ud615\ud3c9\uc131<\/text>\n  <text x=\"34\" y=\"158\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E5F\">Stanford [2012] HCA 52<\/text>\n  <text x=\"34\" y=\"184\" font-size=\"11.5\" fill=\"#525B67\">\ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ub2e8\ub3c5 \uba85\uc758\ub3c4 \ud3ec\ud568<\/text>\n  <text x=\"34\" y=\"203\" font-size=\"11.5\" fill=\"#525B67\">(Barda &amp; Zerri [2026])<\/text>\n  <line x1=\"221\" y1=\"163\" x2=\"231\" y2=\"163\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"234,163 228,159 228,167\" fill=\"#1F242B\"/>\n  <rect x=\"234\" y=\"86\" width=\"196\" height=\"154\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"234\" y=\"86\" width=\"196\" height=\"28\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"246\" y=\"104\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">1\ub2e8\uacc4 \u00b7 s 79(3)(a)<\/text>\n  <text x=\"246\" y=\"138\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1F242B\">\ud604\uc874 \uc804 \uc138\uacc4 \uc790\uc0b0\u00b7\ubd80\ucc44 \ud2b9\uc815<\/text>\n  <text x=\"246\" y=\"158\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\">Shinohara [2025] FedCFamC1A 126<\/text>\n  <text x=\"246\" y=\"184\" font-size=\"11.5\" fill=\"#525B67\">\uac00\uc0c1 \ud569\uc0b0(Add-backs) \uc804\uba74 \ud3d0\uc9c0<\/text>\n  <text x=\"246\" y=\"203\" font-size=\"11.5\" fill=\"#525B67\">s 71B \ud55c\u00b7\ud638 \uc804 \uc138\uacc4 \uc7ac\uc0b0\uacf5\uac1c \uc758\ubb34<\/text>\n  <line x1=\"433\" y1=\"163\" x2=\"443\" y2=\"163\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"446,163 440,159 440,167\" fill=\"#1F242B\"/>\n  <rect x=\"446\" y=\"86\" width=\"196\" height=\"154\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"446\" y=\"86\" width=\"196\" height=\"28\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"458\" y=\"104\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">2\ub2e8\uacc4 \u00b7 s 79(4)<\/text>\n  <text x=\"458\" y=\"138\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1F242B\">\uae30\uc5ec\ub3c4 \ud3c9\uac00 + \uacbd\uc81c\uc801 \ud559\ub300(ca)<\/text>\n  <text x=\"458\" y=\"158\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E5F\">Franc &amp; Franc [2026] FedCFamC1A 159<\/text>\n  <text x=\"458\" y=\"184\" font-size=\"11.5\" fill=\"#525B67\">s 4AB(2A) \uc5f0\uae08\u00b7\uc0dd\ud65c\ube44 \ud1b5\uc81c \ubc18\uc601<\/text>\n  <text x=\"458\" y=\"203\" font-size=\"11.5\" fill=\"#525B67\">\ub9e5\ub77d \uc911\uc2ec 3\ub2e8\uacc4 \uc2ec\ub9ac + \uad6c\uccb4 \uc99d\uac70<\/text>\n  <line x1=\"645\" y1=\"163\" x2=\"655\" y2=\"163\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"658,163 652,159 652,167\" fill=\"#1F242B\"/>\n  <rect x=\"658\" y=\"86\" width=\"196\" height=\"154\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"658\" y=\"86\" width=\"196\" height=\"28\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"670\" y=\"104\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">3\ub2e8\uacc4 \u00b7 s 79(5)<\/text>\n  <text x=\"670\" y=\"138\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1F242B\">\ub3c5\ub9bd \uc2e0\uc124 \ud604\uc7ac\u00b7\uc7a5\ub798 \uc0ac\uc815 \uc870\uc815<\/text>\n  <text x=\"670\" y=\"158\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\">\uad6c s 75(2) \uc900\uc6a9 \ud3d0\uc9c0 \u2192 s 79(5)(a)\u2013(v)<\/text>\n  <text x=\"670\" y=\"184\" font-size=\"11.5\" fill=\"#525B67\">\ud3ed\ub825 \ud6c4\uc720\uc99d(a) \u00b7 \uace0\uc758 \ud0d5\uc9c4(d)<\/text>\n  <text x=\"670\" y=\"203\" font-size=\"11.5\" fill=\"#525B67\">\ubbf8\uc131\ub144 \uc790\ub140 \uc8fc\uac70(f) \u00b7 \uae30\uc9c0\uae09 \uc218\uc784\ub8cc(n)<\/text>\n  <rect x=\"22\" y=\"256\" width=\"410\" height=\"72\" rx=\"10\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1.2\"/>\n  <text x=\"36\" y=\"279\" font-size=\"12.5\" font-weight=\"800\" fill=\"#1D6B48\">\ubc18\ub824\ub3d9\ubb3c \ud2b9\ubcc4 \uc870\ud56d \u00b7 s 79(6)\u2013(7) / s 90SM(6)\u2013(7)<\/text>\n  <text x=\"36\" y=\"301\" font-size=\"11.1\" fill=\"#1F242B\">\ub2e8\ub3c5 \uc18c\uc720\uad8c \u00b7 \uc81c3\uc790 \uc591\ub3c4 \u00b7 \ub9e4\uac01\ub9cc \uac00\ub2a5 \u00b7 &#x27;\uacf5\ub3d9 \uc591\uc721\u00b7\ubc88\uac08\uc544 \ub3cc\ubcf4\uae30&#x27; \uba85\ub839 \ubc95\uc801<\/text>\n  <text x=\"36\" y=\"318\" font-size=\"11.1\" fill=\"#525B67\">\uae08\uc9c0 (Wright &amp; Berger [2025] FedCFamC2F 1315)<\/text>\n  <rect x=\"448\" y=\"256\" width=\"410\" height=\"72\" rx=\"10\" fill=\"#FEF8EC\" stroke=\"#9A6700\" stroke-width=\"1.2\"/>\n  <text x=\"462\" y=\"279\" font-size=\"12.5\" font-weight=\"800\" fill=\"#9A6700\">\uc808\ub300 \uc81c\ucc99\uae30\uac04 \uc2dc\uacc4 \u00b7 s 44(3) \ubc95\ub960\ud63c / s 44(5) \uc0ac\uc2e4\ud63c<\/text>\n  <text x=\"462\" y=\"301\" font-size=\"11.1\" fill=\"#1F242B\">\uc774\ud63c \ud6a8\ub825 \ubc1c\uc0dd\uc77c\ub85c\ubd80\ud130 12\uac1c\uc6d4(\ubc95\ub960\ud63c) \u00b7 \ubcc4\uac70\uc77c\ub85c\ubd80\ud130 2\ub144(\uc0ac\uc2e4\ud63c) \ub3c4\uacfc \uc2dc \ud2b9\ubcc4<\/text>\n  <text x=\"462\" y=\"318\" font-size=\"11.1\" fill=\"#525B67\">\ud5c8\uac00(Hardship) \uc5c6\uc774\ub294 \uccad\uad6c \ucc28\ub2e8<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 1: 2025\ub144 6\uc6d4 10\uc77c \uac1c\uc815 \ud638\uc8fc \uac00\uc871\ubc95 \uc7ac\uc0b0\ubd84\ud560 4\ub2e8\uacc4 \uad6c\uc870 \ubc0f \ud575\uc2ec \ud310\ub840 \ubcc0\ud654<\/figcaption><\/figure>\n<h2 id=\"\ud310\ub840\uc5d0\ub9cc-\uc788\ub358-4\ub2e8\uacc4-\uc7ac\uc0b0\ubd84\ud560-\uacf5\uc2dd\uc758-\uba85\ubb38\ud654\uc640-\uac00\uc0c1-\ud569\uc0b0add-backs\uc758-\uc885\ub9d0\" class=\"doc-h2\">\ud310\ub840\uc5d0\ub9cc \uc788\ub358 4\ub2e8\uacc4 \uc7ac\uc0b0\ubd84\ud560 \uacf5\uc2dd\uc758 \uba85\ubb38\ud654\uc640 \uac00\uc0c1 \ud569\uc0b0(Add-backs)\uc758 \uc885\ub9d0<\/h2>\n<p class=\"doc-p\">\uc624\ub7ab\ub3d9\uc548 \ud638\uc8fc \uc7ac\uc0b0\ubd84\ud560 \uc2e4\ubb34\ub294 \ubc95\uc870\ubb38\ubcf4\ub2e4 \ud310\ub840\ub97c \ub530\ub77c \uc6c0\uc9c1\uc600\uc5b4\uc694. \uc5f0\ubc29\ub300\ubc95\uc6d0\uc740 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2012/52.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Stanford v Stanford [2012] HCA 52<\/em><\/a> ([37], [40], [42]) \ud310\uacb0\uc5d0\uc11c \uc7ac\uc0b0\ubd84\ud560 \uba85\ub839\uc744 \ub0b4\ub9ac\uae30 \uc804\uc5d0 \uba3c\uc800 \ub2f9\uc0ac\uc790\ub4e4\uc758 \ud604\uc874\ud558\ub294 \ubc95\ub960\uc0c1\u00b7\ud615\ud3c9\ubc95\uc0c1 \uad8c\ub9ac\ub97c \ud655\uc815\ud558\uace0 \uadf8 \uad8c\ub9ac\ub97c \ubc14\uafb8\ub294 \uac83\uc774 \uacf5\uc815\ud558\uace0 \ud615\ud3c9\uc5d0 \ub9de\ub294\uc9c0(s 79(2)) \ubcc4\ub3c4\ub85c \ub530\uc838\uc57c \ud55c\ub2e4\uace0 \ubabb \ubc15\uc558\uc5b4\uc694. \uadf8 \ub4a4\ub85c \uc2e4\ubb34\uac00\ub4e4\uc740 \ud754\ud788 4\ub2e8\uacc4 \uc2ec\uc0ac\ub97c \uac70\uccd0 \uc654\uc8e0. 2025\ub144 6\uc6d4 10\uc77c \ubc1c\ud6a8\ub41c \uac1c\uc815\ubc95\uc740 \uc774 \ud750\ub984\uc744 \uadf8\ub300\ub85c \uc774\uc5b4\ubc1b\uc558\uc5b4\uc694. \ubc95\ub960\ud63c s 79(3)\uacfc \uc0ac\uc2e4\ud63c s 90SM(3) \ubcf8\ubb38\uc5d0 \uc9c1\uc811 \uc0c8\uaca8 \ub123\uc5c8\uac70\ub4e0\uc694. \uba3c\uc800 \uc591\uce21\uc758 \ud604\uc874 \uc790\uc0b0\uacfc \ubd80\ucc44\ub97c \ud2b9\uc815\ud574\uc694(s 79(3)(a)). \uc774\uc5b4\uc11c \uc7ac\uc815\uc801\u00b7\ube44\uc7ac\uc815\uc801\u00b7\uac00\uc0ac \ubc0f \uc591\uc721 \uae30\uc5ec\ub3c4\ub97c \uc800\uc6b8\uc9c8\ud558\uc8e0(s 79(4)). \uacfc\uac70 \ubd80\uc591\ub8cc \uc870\ud56d(s 75(2))\uc744 \ube4c\ub824 \uc4f0\ub358 \ubc29\uc2dd\uc5d0\uc11c\ub3c4 \ubc97\uc5b4\ub0ac\uc5b4\uc694. \uc7ac\uc0b0\ubd84\ud560 \uc804\uc6a9\uc73c\ub85c \ud604\uc7ac \ubc0f \uc7a5\ub798 \uc0ac\uc815 \uc870\ud56d(s 79(5)(a)\u2013(v), \uc0ac\uc2e4\ud63c\uc740 s 90SM(5)(a)\u2013(w))\uc774 \uc0c8\ub85c \ub3c5\ub9bd\ud588\uac70\ub4e0\uc694. \uc774 \uc870\ud56d\uc744 \uc801\uc6a9\ud574 \ucd5c\uc885 \ube44\uc728\uc744 \uc870\uc728\ud574\uc694.<\/p>\n<p class=\"doc-p\">\uc5ec\uae30\uc11c \uc2e4\ubb34\uac00\ub4e4\uae4c\uc9c0 \uae5c\uc9dd \ub180\ub77c\uac8c \ud55c \uacb0\uc815\uc801\uc778 \ud310\ub840\uac00 \ub098\uc654\uc5b4\uc694. \ubc14\ub85c \uc5f0\ubc29\uc21c\ud68c\u00b7\uac00\uc871\ubc95\uc6d0(FCFCOA) \ud56d\uc18c\ubd80 \uc804\uc6d0\uc7ac\ud310\ubd80\uc758 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2025/126.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Shinohara &amp; Shinohara [2025] FedCFamC1A 126<\/em><\/a> ([121], [127]) \ud310\uacb0\uc774\uc5d0\uc694. \uac1c\uc815 \uc804\uc5d0\ub294 \ubcc4\uac70 \uc9c1\ud6c4 \ud55c\ucabd\uc774 \ubd80\ub3d9\uc0b0 \ub9e4\uac01\ub300\uae08\uc744 \ubab0\ub798 \ube7c\ub3cc\ub824 \uc368\ubc84\ub9ac\ub294 \uc77c\uc774 \uc788\uc5c8\uc8e0. \ubd80\ubd80 \uacf5\ub3d9\uc790\uae08\uc73c\ub85c \ubcc0\ud638\uc0ac \uc218\uc784\ub8cc\ub97c \ubbf8\ub9ac \ub0b4\ub294 \uc77c\ub3c4 \uc788\uc5c8\uace0\uc694. \uadf8\ub7f4 \ub54c \uc7ac\uc0b0\ubaa9\ub85d\ud45c(Balance Sheet)\uc5d0 \uac00\uc0c1\uc758 \uc22b\uc790\ub85c \ub2e4\uc2dc \uc5b9\uc5b4 \ub193\uace4 \ud588\uc5b4\uc694. \uc774\ub978\ubc14 \uac00\uc0c1 \ud569\uc0b0(notional add-backs) \uad00\ud589\uc774 \ub110\ub9ac \uc4f0\uc600\uac70\ub4e0\uc694. \uadf8\ub7f0\ub370 \ud56d\uc18c\ubd80\ub294 \uac1c\uc815 s 79(3)(a)(i)\uc758 \ubb38\uc5b8\uc5d0 \uc8fc\ubaa9\ud588\uc5b4\uc694. \uc624\uc9c1 \ud604\uc874\ud558\ub294 \uc7ac\uc0b0(existing property)\ub9cc \ud2b9\uc815\ud558\ub3c4\ub85d \uaddc\uc815\ud558\uace0 \uc788\ub2e4\ub294 \uc810\uc744 \ub4e4\uc5c8\uc8e0. \uadf8\ub798\uc11c \uc774\ubbf8 \uc0ac\ub77c\uc9c0\uace0 \uc5c6\ub294 \ub3c8\uc740 \uc81c\uc678\ud558\uae30\ub85c \ud588\uc5b4\uc694. \ub300\ucc28\ub300\uc870\ud45c\uc5d0 \uac00\uc0c1 \ud56d\ubaa9\uc73c\ub85c \uc62c\ub9ac\ub294 \uad00\ud589\uc744 \uc804\uba74 \ud3d0\uc9c0\ud55c \uac70\uc608\uc694. \ubb3c\ub860 \ub3c8\uc744 \uba3c\uc800 \uc368\ubc84\ub9b0 \uc0ac\ub78c\uc774 \uc774\ub4dd\uc744 \ubcf8\ub2e4\ub294 \ub73b\uc740 \uc544\ub2c8\uc5d0\uc694. \uc774\uc81c\ub294 \ub300\ucc28\ub300\uc870\ud45c \uc22b\uc790\ub85c \ub354\ud558\uc9c0 \uc54a\uc544\uc694. \ub300\uc2e0 \uacfc\uac70 \uae30\uc5ec\ub3c4 \ud3c9\uac00(s 79(4))\ub098 \uace0\uc758\u00b7\ubb34\ubaa8\ud55c \uc7ac\uc0b0 \ud0d5\uc9c4(s 79(5)(d)), \uc18c\uc1a1\uc790\uae08 \uc870\ub2ec \ubd88\uade0\ud615(s 79(5)(n)), \uae30\ud0c0 \uc815\uc758\uc640 \ud615\ud3c9 \uc0ac\uc720(s 79(5)(v)) \ub2e8\uacc4\uc5d0\uc11c \ubc18\uc601\ud574\uc694. \ubd84\ud560 \ube44\uc728 \uc790\uccb4\ub97c \uc62e\uae30\ub294 \ubc29\uc2dd\uc73c\ub85c \uc148\ubc95\uc774 \uc644\uc804\ud788 \ub2ec\ub77c\uc9c4 \uac70\uc8e0.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">\ud575\uc2ec \uc7c1\uc810<\/th><th style=\"text-align:left\">2025\ub144 6\uc6d4 10\uc77c \uac1c\uc815 \uc804<\/th><th style=\"text-align:left\">2025\ub144 6\uc6d4 10\uc77c \uac1c\uc815 \ud6c4 \ud604\ud589 \uaddc\uc815 \ubc0f \ud575\uc2ec \ud310\ub840<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>4\ub2e8\uacc4 \uc2ec\uc0ac \ubc0f \uc7a5\ub798 \uc0ac\uc815 \uc870\ud56d<\/strong><\/td><td style=\"text-align:left\">\ud310\ub840\uc0c1 \uad00\ud589\uc73c\ub85c \uc6b4\uc601 \u00b7 \ubd80\uc591\ub8cc \uc870\ud56d(s 75(2)) \uc900\uc6a9<\/td><td style=\"text-align:left\">s 79(3) / s 90SM(3) \ubcf8\ubb38 \uba85\ubb38\ud654 \u00b7 \uc7ac\uc0b0\ubd84\ud560 \uc804\uc6a9 \ub3c5\ub9bd \uc870\ud56d s 79(5)(a)\u2013(v) \uc2e0\uc124 (\uad6c s 79(4)(e) \ud3d0\uc9c0)<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uae30\uc18c\ube44 \uc790\uc0b0\u00b7\uc120\uc9c0\uae09 \uc218\uc784\ub8cc(Add-backs)<\/strong><\/td><td style=\"text-align:left\">\ub300\ucc28\ub300\uc870\ud45c\uc5d0 \uac00\uc0c1 \uc7ac\uc0b0(notional property)\uc73c\ub85c \ud569\uc0b0<\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2025/126.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Shinohara &amp; Shinohara<\/em> [2025] FedCFamC1A 126<\/a> ([121], [127])\uc5d0 \ub530\ub77c \ub300\ucc28\ub300\uc870\ud45c \uac00\uc0c1 \ud569\uc0b0 \uc804\uba74 \ud3d0\uc9c0 \u2192 s 79(4) \ub610\ub294 s 79(5)(d),(n),(v) \ube44\uc728 \uc870\uc815<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uacbd\uc81c\uc801 \ud559\ub300 \ubc0f \uac00\uc815\ud3ed\ub825 \ubc18\uc601<\/strong><\/td><td style=\"text-align:left\">\ud611\uc18c\ud55c <em>Kennon<\/em> \ud310\ub840 \uc608\uc678\ub9cc \uc778\uc815(\uc785\uc99d \uc7a5\ubcbd \uadf9\ud788 \ub192\uc74c)<\/td><td style=\"text-align:left\">s 4AB(2A)(\uc5f0\uae08 \ud1b5\uc81c\u00b7\uc0dd\ud65c\ube44 \ucc28\ub2e8\u00b7\uc9c0\ucc38\uae08 \ud559\ub300) \ubc0f s 79(4)(ca)\u00b7s 79(5)(a) \uba85\uc2dc \u00b7 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2026/159.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Franc &amp; Franc<\/em> [2026] FedCFamC1A 159<\/a> ([148]) \ub9e5\ub77d \uc911\uc2ec 3\ub2e8\uacc4 \uc2ec\ub9ac<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc7ac\uc0b0 \uc804\uba74 \uacf5\uac1c \uc758\ubb34(\ud55c\u00b7\ud638 \uc804 \uc138\uacc4)<\/strong><\/td><td style=\"text-align:left\">\ud558\uc704 \ubc95\uc6d0 \uaddc\uce59(Rules)\uc5d0\ub9cc \uaddc\uc815<\/td><td style=\"text-align:left\">\uac00\uc871\ubc95 \ubaa8\ubc95 s 71B(\ubc95\ub960\ud63c) / s 90RI(\uc0ac\uc2e4\ud63c)\ub85c \uaca9\uc0c1 \u00b7 \ubcc4\uac70 \ud6c4 \uc18c\uc1a1 \uc900\ube44 \ub2e8\uacc4(s 71B(5)\u2013(6))\ubd80\ud130 \uc758\ubb34 \uc801\uc6a9<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ubc18\ub824\ub3d9\ubb3c(Companion Animals)<\/strong><\/td><td style=\"text-align:left\">\uac00\uad6c\u00b7\ucc28\ub7c9\uacfc \ub3d9\uc77c\ud55c \uc77c\ubc18 \ub3d9\uc0b0 \ucde8\uae09<\/td><td style=\"text-align:left\">s 79(6)\u2013(7) / s 90SM(6)\u2013(7) \uc644\uacb0 \uaddc\uc815 \u00b7 \ub2e8\ub3c5 \uc18c\uc720\uad8c\u00b7\uc81c3\uc790 \uc591\ub3c4\u00b7\ub9e4\uac01\ub9cc \uac00\ub2a5, \uacf5\ub3d9 \uc591\uc721 \uba85\ub839 \uc804\uba74 \uae08\uc9c0 (<a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC2F/2025/1315.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Wright &amp; Berger<\/em> [2025] FedCFamC2F 1315<\/a>)<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"\uacbd\uc81c\uc801\uc7ac\uc815\uc801-\ud559\ub300s-4ab2a\uc758-\uba85\ubb38\ud654\uc640-\uc785\uc99d\uc758-\ubb38\ud131\" class=\"doc-h2\">\uacbd\uc81c\uc801\u00b7\uc7ac\uc815\uc801 \ud559\ub300(s 4AB(2A))\uc758 \uba85\ubb38\ud654\uc640 \uc785\uc99d\uc758 \ubb38\ud131<\/h2>\n<p class=\"doc-p\">\uc774\ubc88 \uac1c\ud3b8\uc5d0\uc11c \uac00\uc7a5 \ub208\uc5d0 \ub744\ub294 \ub300\ubaa9\ub3c4 \uc9da\uc5b4 \ubcfc\uae4c\uc694? \ub2e8\uc5f0 \uac00\uc815\ud3ed\ub825\uacfc \uacbd\uc81c\uc801 \ud559\ub300\uac00 \uc7ac\uc0b0\ubd84\ud560 \uacc4\uc0b0\uc2dd\uc758 \uc815\uc2dd \ubcc0\uc218\ub85c \ub4e4\uc5b4\uc654\ub2e4\ub294 \uc810\uc774\uc5d0\uc694. \uac1c\uc815\ubc95 s 4AB(2)(g)\uc640 \uc2e0\uc124\ub41c s 4AB(2A)\uac00 \uadf8 \uadfc\uac70\uc608\uc694. \ubc30\uc6b0\uc790\uc758 \uc608\uae08\uc774\ub098 \ud1f4\uc9c1\uc5f0\uae08(Superannuation)\uc744 \uac15\uc81c\ub85c \ud1b5\uc81c\ud558\ub294 \ud589\uc704\uac00 \uc5ec\uae30\uc5d0 \ub4e4\uc5b4\uac00\uc694. \ucde8\uc5c5\uc774\ub098 \ud559\uc5c5\uc744 \ubc29\ud574\ud574 \uc18c\ub4dd \ud65c\ub3d9\uc744 \ub9c9\ub294 \ud589\uc704\ub3c4 \ubc95\uc815 \uac00\uc815\ud3ed\ub825\uc73c\ub85c \uba85\uc2dc\ud588\uc8e0. \ubc30\uc6b0\uc790 \ubaa8\ub974\uac8c \uadf8 \uba85\uc758\ub85c \ub300\ucd9c\uc774\ub098 \ubd80\ucc44\ub97c \ub5a0\uc548\uae30\ub294 \ud589\uc704\ub3c4 \ub9c8\ucc2c\uac00\uc9c0\uc608\uc694. \ud544\uc218 \uc0dd\ud65c\ube44\ub97c \ub04a\uc5b4 \uacbd\uc81c\uc801\uc73c\ub85c \uc608\uc18d\uc2dc\ud0a4\ub294 \ud589\uc704 \uc5ed\uc2dc \ud3ec\ud568\ub3fc\uc694. \ub098\uc544\uac00 \uc9c0\ucc38\uae08\uc744 \uac15\uc694\ud558\uac70\ub098 \uc740\ub2c9\ud558\ub294 \ud589\uc704(dowry abuse)\uae4c\uc9c0 \ubaa8\ub450 \ubc95\uc815 \uac00\uc815\ud3ed\ub825\uc774\uc5d0\uc694. \uadf8\ub9ac\uace0 \uc774 \ud3ed\ub825\uc774 \ud63c\uc778 \uc911 \uae30\uc5ec\ub97c \uc5bc\ub9c8\ub098 \uc5b4\ub835\uac8c \ub9cc\ub4e4\uc5c8\ub294\uc9c0(s 79(4)(ca)) \uc0b4\ud3b4\uc694. \ub610 \ud53c\ud574 \ubc30\uc6b0\uc790\uc758 \ud604\uc7ac\uc640 \uc7a5\ub798 \uc0dd\uacc4\uc5d0 \uc5b4\ub5a4 \ud6c4\uc720\uc99d\uc744 \ub0a8\uacbc\ub294\uc9c0(s 79(5)(a))\ub3c4 \ubcf4\uc8e0. \uc8fc\uac70 \uc548\uc815\uc5d0 \ubbf8\uce5c \uc601\ud5a5\uae4c\uc9c0 \uc591\ubc29\ud5a5\uc5d0\uc11c \ubc18\uc601\ud558\ub3c4\ub85d \uae38\uc744 \uc5f4\uc5c8\uc5b4\uc694.<\/p>\n<p class=\"doc-p\">\uadf8\ub807\ub2e4\uba74 \ubc95\uc815\uc5d0\uc11c \uc5b5\uc6b8\ud568\uc744 \ud638\uc18c\ud558\uae30\ub9cc \ud558\uba74 \ube44\uc728\uc774 \ud06c\uac8c \uc62c\ub77c\uac08\uae4c\uc694? 2026\ub144 9\uc6d4 \uc120\uace0\ub41c \ud56d\uc18c\ubd80 \uc804\uc6d0\uc7ac\ud310\ubd80 \ud310\uacb0 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2026/159.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Franc &amp; Franc [2026] FedCFamC1A 159<\/em><\/a> ([134], [148], [150]\u2013[151])\uac00 \uc544\uc8fc \ub0c9\uc815\ud55c \ud574\ub2f5\uc744 \ub0b4\ub193\uc558\uc5b4\uc694. \uc7ac\ud310\ubd80\ub294 \uacfc\uac70 Kennon \ud310\ub840 \uc2dc\uc808\uc744 \ub3cc\uc544\ubcf4\uc558\uc5b4\uc694. \ud53c\ud574\uc790\uc5d0\uac8c \uc9c0\ub098\uce58\uac8c \uae4c\ub2e4\ub85c\uc6b4 \uc608\uc678 \uc7a5\ubcbd\uc744 \uc138\uc6cc\uc11c\ub294 \uc548 \ub41c\ub2e4\uace0 \ubcf4\uc558\uac70\ub4e0\uc694. \ud30c\ud3b8\ud654\ub41c \uac1c\ubcc4 \uc0ac\uac74\ub9cc \ub5bc\uc5b4 \ubcf4\uc9c0 \ub9d0\ub77c\ub294 \ub73b\uc774\uc5d0\uc694. \uad00\uacc4 \uc804\ubc18\uc758 \ud1b5\uc81c \uc591\uc0c1\uc744 \ub9e5\ub77d \uc18d\uc5d0\uc11c \uc0b4\ud53c\ub77c\ub294 \ucde8\uc9c0\uc8e0. \uc774\uc5d0 \ub530\ub77c \u2460 \uac00\uc815\ud3ed\ub825\uc758 \uc874\uc7ac \uc5ec\ubd80 \ud655\uc815, \u2461 \ud3ed\ub825\uc758 \uc131\uaca9\u00b7\uc815\ub3c4\u00b7\ub9e5\ub77d \ud3c9\uac00, \u2462 \uadf8 \ud3ed\ub825\uc774 s 79(4)(ca)\uc0c1 \uae30\uc5ec \ub2a5\ub825\uc744 \uc2e4\uc9c8\uc801\uc73c\ub85c \uc5b4\ub835\uac8c \ub9cc\ub4e4\uc5c8\ub294\uc9c0 \ud310\ub2e8\ud558\ub294 3\ub2e8\uacc4 \uc2ec\ub9ac\ub97c \uac70\uccd0\uc57c \ud55c\ub2e4\uace0 \ud310\uc2dc\ud588\uc5b4\uc694. \ud558\uc9c0\ub9cc \ub3d9\uc2dc\uc5d0 \uc99d\uac70\ubc95(Evidence Act 1995 s 140(2))\uc740 \uad6c\uccb4\uc801\uc778 \uc77c\uc2dc, \uc815\ud669, \uac1d\uad00\uc801 \ub4b7\ubc1b\uce68 \uc790\ub8cc\ub97c \uc694\uad6c\ud574\uc694. \uc774\ub7f0 \uc790\ub8cc \uc5c6\uc774 \ub9c9\uc5f0\ud55c \uc9c4\uc220\ub9cc \ub298\uc5b4\ub193\uc544\uc11c\ub294 \uace4\ub780\ud574\uc694. \uadf8\ub7f4 \uacbd\uc6b0 \ube44\uc728 \uc870\uc815\uc744 \ubc1b\uc744 \uc218 \uc5c6\ub2e4\uace0 \uc120\uc744 \uadf8\uc5c8\uc8e0. \uacb0\uad6d \uac10\uc815\uc5d0 \uae30\ub300\uc5b4 \ud638\uc18c\ud558\ub294 \uac83\ub9cc\uc73c\ub85c\ub294 \ubd80\uc871\ud574\uc694. \uacc4\uc88c \ucc28\ub2e8 \ub0b4\uc5ed, \ubb38\uc790 \uae30\ub85d, \uc9c4\ub8cc \uae30\ub85d, \uacbd\ub825 \ub2e8\uc808 \ud0c0\uc784\ub77c\uc778\uc744 \uc815\uad50\ud558\uac8c \uc5ee\uc5b4\ub0b4\ub294 \uc99d\uac70 \uc124\uacc4\uac00 \uc2b9\ud328\ub97c \uac08\ub77c\uc694.<\/p>\n<h2 id=\"\ud1b5\uacc4\uac00-\uacbd\uace0\ud558\ub294-\ud1f4\uc9c1\uc5f0\uae08super-\uaca9\ucc28-\uc9d1\uac12\ub9cc-\ubcf4\uace0-\ub3c4\uc7a5-\ucc0d\uc73c\uba74-\uc548-\ub418\ub294-\uc774\uc720\" class=\"doc-h2\">\ud1b5\uacc4\uac00 \uacbd\uace0\ud558\ub294 \ud1f4\uc9c1\uc5f0\uae08(Super) \uaca9\ucc28: \uc9d1\uac12\ub9cc \ubcf4\uace0 \ub3c4\uc7a5 \ucc0d\uc73c\uba74 \uc548 \ub418\ub294 \uc774\uc720<\/h2>\n<p class=\"doc-p\">\uc7ac\uc0b0\ubd84\ud560 \ud611\uc0c1 \ud14c\uc774\ube14\uc5d0\uc11c \ud55c\uc778 \uc758\ub8b0\uc778\ub4e4\uc774 \uac00\uc7a5 \ud754\ud788 \uc800\uc9c0\ub974\ub294 \uc2e4\uc218\uac00 \uc788\uc5b4\uc694. \ub2f9\uc7a5 \ub208\uc55e\uc5d0 \ubcf4\uc774\ub294 \ubd80\ub3d9\uc0b0 \uc9c0\ubd84\uc774\ub098 \ud604\uae08 \uba87\ub9cc \ub2ec\ub7ec\ub9cc \ucc59\uae30\ub294 \uac74\ub370\uc694. \uac01\uc790\uc758 \ud638\uc8fc \ud1f4\uc9c1\uc5f0\uae08(Superannuation)\uc740 \uac74\ub4dc\ub9ac\uc9c0 \uc54a\uae30\ub85c \ud569\uc758\ud558\ub294 \uac70\uc608\uc694. \ud1b5\uacc4 \uc22b\uc790\ub97c \uc9c1\uc811 \ud655\uc778\ud574 \ubcfc\uae4c\uc694? \uc65c \uc774\ub7f0 \ud569\uc758\uac00 \uc704\ud5d8\ud55c\uc9c0 \ub2e8\ubc88\uc5d0 \ub4dc\ub7ec\ub098\uc694. \ud638\uc8fc \uad6d\uc138\uccad(ATO)\uc774 2026\ub144 6\uc6d4 \uacf5\ud45c\ud55c 2023\u201324 \uacfc\uc138\uc5f0\ub3c4 \ud1b5\uacc4\uac00 \uc788\uc5b4\uc694. \uc774\ud63c\uacfc \ubcc4\uac70\uac00 \uc9d1\uc911\ub418\ub294 40\u201344\uc138 \uad6c\uac04\uc758 \uc911\uc704 \ud1f4\uc9c1\uc5f0\uae08 \uc794\uc561\ubd80\ud130 \ucc28\uc774\uac00 \ucee4\uc694. \ub0a8\uc131 $116,076, \uc5ec\uc131 $85,804\ub85c 26.1% \uaca9\ucc28\uac00 \ub098\uc8e0. 45\u201349\uc138\uc5d0\uc11c\ub294 \ub0a8\uc131 $154,751 \ub300 \uc5ec\uc131 $110,864(28.4% \uaca9\ucc28) \uc218\uc900\uc774\uc5d0\uc694. 50\u201354\uc138\uc5d0 \uc774\ub974\uba74 \ub0a8\uc131 $192,196 \ub300 \uc5ec\uc131 $134,309\uac00 \ub3fc\uc694. \uaca9\ucc28\uac00 30.1%\uae4c\uc9c0 \ubc8c\uc5b4\uc9c0\uc8e0.<\/p>\n<p class=\"doc-p\">\uc774\ubbfc\uc790 \uac00\uc815\uc758 \ud604\uc2e4\uc740 \uc774\ubcf4\ub2e4 \ud6e8\uc52c \ub354 \uac00\ud639\ud574\uc694. \ud638\uc8fc\uc5f0\uae08\uae30\uae08\ud611\ud68c(ASFA)\uac00 \ubd84\uc11d\ud55c \ube44\uc601\uc5b4\uad8c \uc774\ubbfc \ubc30\uacbd(NESB) \uac00\uad6c \ud1b5\uacc4\ub97c \uc0b4\ud3b4\ubcf4\uc8e0. 35\u201344\uc138 \uc911\uc704 \uc5f0\uae08\uc740 $60,000(\ube44\uc774\ubbfc\uc790 $100,000 \ub300\ube44 40% \uaca9\ucc28)\uc774\uc5d0\uc694. 45\u201354\uc138 \uc911\uc704 \uc5f0\uae08\ub3c4 $75,000\uc5d0 \uba38\ubb3c\ub7ec\uc694. \ud638\uc8fc \ucd9c\uc0dd\u00b7\uc601\uc5b4\uad8c \uc9d1\ub2e8($150,000)\uc758 \uc808\ubc18 \uc218\uc900\uc778 50% \uaca9\ucc28\ub97c \ubcf4\uc774\uc8e0. \ud638\uc8fc \uc774\uc8fc \ucd08\uae30 \ubc30\uc6b0\uc790\uc758 \ud559\uc5c5\uc774\ub098 \uc0ac\uc5c5\uc744 \ub4b7\ubc14\ub77c\uc9c0\ud55c \ubd84\ub4e4\uc774 \ub9ce\uc796\uc544\uc694. \uadf8\ub7ec\ub290\ub77c \uce90\uc8fc\uc5bc \uc77c\uc790\ub9ac\ub97c \uc804\uc804\ud588\uac70\ub098 \ucd9c\uc0b0\u00b7\uc721\uc544\ub85c \uacbd\ub825\uc774 \ub04a\uae34 \uacbd\uc6b0\ub3c4 \ud754\ud574\uc694. \uc774\ub7f0 \ubc30\uc6b0\uc790\uc77c\uc218\ub85d \ubcf8\uc778 \uba85\uc758 \uc5f0\uae08 \uacc4\uc88c\ub294 \ube44\uc5b4 \uc788\uae30 \ub9c8\ub828\uc774\uc5d0\uc694. \ud638\uc8fc \uac00\uc871\ubc95\uc740 \ud1f4\uc9c1\uc5f0\uae08\uc744 \uc5c4\uc5f0\ud55c \ubd84\ud560 \ub300\uc0c1 \uc7ac\uc0b0\uc73c\ub85c \ucde8\uae09\ud574\uc694. \uc5f0\uae08 \ubd84\ud560 \uba85\ub839(Superannuation Splitting Order)\uc744 \ud65c\uc6a9\ud558\uba74 \ub3fc\uc694. \ud55c\ucabd \uc5f0\uae08 \uae30\uae08\uc5d0\uc11c \ub2e4\ub978 \ucabd \uacc4\uc88c\ub85c \uc9c0\ubd84\uc744 \ub5bc\uc5b4 \uc62e\uae38 \uc218 \uc788\uac8c \ud574 \uc8fc\uc8e0. \ub2e4\ub9cc \uc5f0\uae08 \uae30\uae08 \uc218\ud0c1\uc790(Trustee)\uc5d0\uac8c \ucd5c\uc18c 28\uc77c \uc804\uc5d0 \uc0ac\uc804 \uc808\ucc28\uc801 \uacf5\uc815\uc131 \ud1b5\uc9c0(procedural fairness notice)\ub97c \ubcf4\ub0b4 \uc2b9\uc778\uc744 \ubc1b\uc544\uc57c \ud558\ubbc0\ub85c \ucc98\uc74c\ubd80\ud130 \uc815\ud655\ud55c \uc808\ucc28\ub97c \ubc1f\uc544\uc57c \ud574\uc694.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 472\" width=\"100%\" role=\"img\" aria-label=\"\ubcc4\uac70\u00b7\uc774\ud63c \uc9d1\uc911 \uc5f0\ub839\ub300 \ud638\uc8fc \ud1f4\uc9c1\uc5f0\uae08(Super) \uc911\uc704 \uc794\uc561 \uaca9\ucc28\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"471\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"78\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"79\" x2=\"879\" y2=\"79\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"28\" y=\"29\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.06em\">\uacf5\uc2dd \ud1b5\uacc4 \ubd84\uc11d \u00b7 \uc65c \uc5f0\uae08 \ubd84\ud560(Super Split)\uc744 \ube60\ub728\ub9ac\uba74 \uc548 \ub418\ub294\uac00<\/text>\n  <text x=\"28\" y=\"52\" f =\"146\" font-size=\"11\" fill=\"#525B67\">\ub0a8\uc131 vs \uc5ec\uc131<\/text>\n  <rect x=\"205\" y=\"108\" width=\"262\" height=\"20\" rx=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"475\" y=\"122\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F4E5F\">$116,076<\/text>\n  <rect x=\"205\" y=\"133\" width=\"194\" height=\"20\" rx=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"407\" y=\"147\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#7A1F2B\">$85,804<\/text>\n  <rect x=\"726\" y=\"117\" width=\"128\" height=\"26\" rx=\"13\" fill=\"#FDF3F4\" stroke=\"#E6B8BF\" stroke-width=\"1\"/>\n  <text x=\"790\" y=\"134\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#7A1F2B\">-26.1% \uaca9\ucc28<\/text>\n  <text x=\"28\" y=\"200\" font-size=\"13\" font-weight=\"700\" fill=\"#1F242B\">45\u201349\uc138 (ATO)<\/text>\n  <text x=\"28\" y=\"220\" font-size=\"11\" fill=\"#525B67\">\ub0a8\uc131 vs \uc5ec\uc131<\/text>\n  <rect x=\"205\" y=\"182\" width=\"350\" height=\"20\" rx=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"563\" y=\"196\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F4E5F\">$154,751<\/text>\n  <rect x=\"205\" y=\"207\" width=\"250\" height=\"20\" rx=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"463\" y=\"221\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#7A1F2B\">$110,864<\/text>\n  <rect x=\"726\" y=\"191\" width=\"128\" height=\"26\" rx=\"13\" fill=\"#FDF3F4\" stroke=\"#E6B8BF\" stroke-width=\"1\"/>\n  <text x=\"790\" y=\"208\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#7A1F2B\">-28.4% \uaca9\ucc28<\/text>\n  <text x=\"28\" y=\"274\" font-size=\"13\" font-weight=\"700\" fill=\"#1F242B\">50\u201354\uc138 (ATO)<\/text>\n  <text x=\"28\" y=\"294\" font-size=\"11\" fill=\"#525B67\">\ub0a8\uc131 vs \uc5ec\uc131<\/text>\n  <rect x=\"205\" y=\"256\" width=\"434\" height=\"20\" rx=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"647\" y=\"270\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F4E5F\">$192,196<\/text>\n  <rect x=\"205\" y=\"281\" width=\"303\" height=\"20\" rx=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"516\" y=\"295\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#7A1F2B\">$134,309<\/text>\n  <rect x=\"726\" y=\"265\" width=\"128\" height=\"26\" rx=\"13\" fill=\"#FDF3F4\" stroke=\"#E6B8BF\" stroke-width=\"1\"/>\n  <text x=\"790\" y=\"282\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#7A1F2B\">-30.1% \uaca9\ucc28<\/text>\n  <rect x=\"18\" y=\"322\" width=\"844\" height=\"68\" rx=\"8\" fill=\"#FDF3F4\" opacity=\"0.55\"/>\n  <text x=\"28\" y=\"348\" font-size=\"13\" font-weight=\"700\" fill=\"#1F242B\">45\u201354\uc138 \uc774\ubbfc\ubc30\uacbd (ASFA)<\/text>\n  <text x=\"28\" y=\"368\" font-size=\"11\" fill=\"#525B67\">\ube44\uc774\ubbfc\u00b7\uc601\uc5b4\uad8c vs \ube44\uc601\uc5b4\uad8c \uc774\ubbfc\uc790<\/text>\n  <rect x=\"205\" y=\"330\" width=\"339\" height=\"20\" rx=\"4\" fill=\"#3B5968\"/>\n  <text x=\"552\" y=\"344\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#3B5968\">$150,000<\/text>\n  <rect x=\"205\" y=\"355\" width=\"169\" height=\"20\" rx=\"4\" fill=\"#B83244\"/>\n  <text x=\"382\" y=\"369\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#B83244\">$75,000<\/text>\n  <rect x=\"726\" y=\"339\" width=\"128\" height=\"26\" rx=\"13\" fill=\"#FDF3F4\" stroke=\"#E6B8BF\" stroke-width=\"1\"/>\n  <text x=\"790\" y=\"356\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#7A1F2B\">-50.0% \uc774\ubbfc\uc790 \uaca9\ucc28<\/text>\n  <rect x=\"20\" y=\"424\" width=\"840\" height=\"34\" rx=\"8\" fill=\"#FEF8EC\" stroke=\"#ECD9B0\" stroke-width=\"1\"/>\n  <text x=\"34\" y=\"445\" font-size=\"11.2\" font-weight=\"600\" fill=\"#1F242B\">\uc2e4\ubb34 \ud3ec\uc778\ud2b8: \uc8fc\ud0dd \uc9c0\ubd84\ub9cc \ub098\ub204\uace0 \ud1f4\uc9c1\uc5f0\uae08 \ubd84\ud560(Super Splitting Order \u00b7 \uc218\ud0c1\uc790 28\uc77c \uc0ac\uc804 \ud1b5\uc9c0 \ud544\uc218)\uc744 \uc0dd\ub7b5\ud558\uba74 \ub178\ud6c4 \uc790\uc0b0\uc5d0\uc11c \ud3c9\uade0 26~50% \ubd88\uade0\ud615\uc774 \uace0\ucc29\ub429\ub2c8\ub2e4.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 2: \ubcc4\uac70\u00b7\uc774\ud63c \uc9d1\uc911 \uc5f0\ub839\ub300 \ud638\uc8fc \ud1f4\uc9c1\uc5f0\uae08(Super) \uc911\uc704 \uc794\uc561 \ubc0f \uc774\ubbfc\uc790 \uaca9\ucc28 \ud1b5\uacc4<\/figcaption><\/figure>\n<h2 id=\"\ubcc4\ub3c4-\ud1b5\uc7a5\ub2e8\ub3c5-\uba85\uc758\ud55c\uad6d-\uc790\uc0b0\uacfc-\uc804\uba74-\uc7ac\uc0b0\uacf5\uac1c-\uc758\ubb34s-71b\" class=\"doc-h2\">\ubcc4\ub3c4 \ud1b5\uc7a5\u00b7\ub2e8\ub3c5 \uba85\uc758\u00b7\ud55c\uad6d \uc790\uc0b0\uacfc \uc804\uba74 \uc7ac\uc0b0\uacf5\uac1c \uc758\ubb34(s 71B)<\/h2>\n<p class=\"doc-p\">\ubd80\ubd80\uac00 \ub3c8 \uad00\ub9ac\ub97c \ucca0\uc800\ud788 \ub530\ub85c \ud588\ub2e4\ub294 \ud56d\ubcc0\ub3c4 \ubc95\uc6d0\uc5d0\uc11c\ub294 \ud1b5\ud558\uc9c0 \uc54a\uc544\uc694. \ucd5c\uadfc \uc120\uace0\ub41c <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC2F/2026/122.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Barda &amp; Zerri [2026] FedCFamC2F 122<\/em><\/a> ([19]\u2013[20]) \uc0ac\uac74\uc744 \ubcfc\uae4c\uc694? \ub0a8\ud3b8\uacfc \uc544\ub0b4\ub294 14\ub144\uac04 \ub3d9\uac70\ud558\uba70 11\ub144\uac04 \ubc95\ub960\ud63c\uc744 \uc720\uc9c0\ud588\uc5b4\uc694. \uadf8\ub3d9\uc548 \uc904\uace7 \ubcc4\ub3c4 \uc740\ud589 \uacc4\uc88c\ub97c \uc37c\uc8e0. \uc790\uc0b0\ub3c4 \ub300\ubd80\ubd84 \uac01\uc790 \ub2e8\ub3c5 \uba85\uc758\ub85c \ucde8\ub4dd\ud588\uace0\uc694. \uadf8\ub7ec\ub098 \ubc95\uc6d0\uc758 \ud310\ub2e8\uc740 \ub2ec\ub790\uc5b4\uc694. \ub450 \uc0ac\ub78c\uc774 \ubcc4\ub3c4 \uacc4\uc88c\ub97c \uc6b4\uc601\ud558\uace0 \uac1c\ubcc4 \uba85\uc758\ub85c \uc790\uc0b0\uc744 \uc18c\uc720\ud588\ub2e4\ub294 \uc0ac\uc815\ub9cc\uc73c\ub85c\ub294 \ubd80\uc871\ud558\ub2e4\uace0 \ubcf4\uc558\uac70\ub4e0\uc694. s 79(2) \uc7ac\uc0b0\ubd84\ud560 \uba85\ub839\uc744 \uac70\ubd80\ud560 \uc774\uc720\uac00 \ub418\uc9c0 \uc54a\ub294\ub2e4\uace0 \ud310\uc2dc\ud588\uc8e0. \ud568\uaed8 \uc0dd\ud65c\ube44\ub97c \ubd84\ub2f4\ud558\uace0 \uac00\uc0ac\uc640 \uc9c1\u00b7\uac04\uc811 \uae30\uc5ec\ub97c \ub098\ub234\uae30 \ub54c\ubb38\uc774\uc5d0\uc694. \uc0c1\ub300\ubc29 \ub2e8\ub3c5 \uba85\uc758 \uc790\uc0b0\uc758 \ud615\uc131\uacfc \uc720\uc9c0\uc5d0 \uae30\uc5ec\ud55c \ubaab\uc744 \ub2f9\uc5f0\ud788 \uc778\uc815\ubc1b\ub294 \uac70\uc8e0. \ub367\ubd99\uc5ec \uac19\uc740 \uc0ac\uac74\uc5d0\uc11c \uc2dc\ubd80\ubaa8\uac00 \uc544\ud30c\ud2b8 \ub9e4\uc785 \ub54c \ubcf4\ud0dc\uc900 \ub3c8\ub3c4 \uc7c1\uc810\uc774 \ub410\uc5b4\uc694. \ubcc4\uac70 \ud6c4 \ub4a4\ub2a6\uac8c \ub9cc\ub4e0 \uc11c\ub958\ub85c \ub300\uc5ec\uae08\uc774\ub098 \uc2e0\ud0c1 \uc9c0\ubd84\uc774\ub77c\uace0 \uc8fc\uc7a5\ud588\uac70\ub4e0\uc694. \uc774 \uc8fc\uc7a5\ub3c4 \ubc95\uc6d0\uc5d0\uc11c\ub294 \ubc1b\uc544\ub4e4\uc5ec\uc9c0\uc9c0 \uc54a\uc558\uc5b4\uc694. \uc624\uc9c1 \ub0a8\ud3b8 \uce21 \uae30\uc5ec\ub3c4 \uc694\uc18c\ub85c\ub9cc \ucc38\uc791\ub410\uc8e0.<\/p>\n<p class=\"doc-p\">\uc7ac\uc0b0\uc744 \uc228\uae30\uba74 \ubb34\uc0ac\ud560 \uac70\ub77c\uace0 \uc5ec\uae30\ub294 \ubd84\ub4e4\ub3c4 \uacc4\uc2e0\ub370\uc694. \ud55c\uad6d\uc5d0 \uc788\ub294 \uc544\ud30c\ud2b8, \uc608\uae08, \ube44\uc0c1\uc7a5\uc8fc\uc2dd\uc740 \ud638\uc8fc \ubc95\uc6d0\uc774 \ubaa8\ub97c \uac70\ub77c\uace0 \uc0dd\uac01\ud558\ub294 \uac74 \ud070 \uc624\uc0b0\uc774\uc5d0\uc694. 2025\ub144 6\uc6d4 10\uc77c\ubd80\ud130 \uc7ac\uc0b0 \uc804\uba74 \uacf5\uac1c \uc758\ubb34(Duty of Financial Disclosure)\uc758 \uc704\uc0c1\uc774 \ub2ec\ub77c\uc84c\uc5b4\uc694. \ud558\uc704 \ubc95\uc6d0 \uaddc\uce59\uc5d0\uc11c \ubaa8\ubc95\uc778 \uac00\uc871\ubc95 \ubcf8\ubb38 s 71B(\uc0ac\uc2e4\ud63c\uc740 s 90RI)\ub85c \uaca9\uc0c1\ub418\uc5c8\uac70\ub4e0\uc694. \uc18c\uc1a1\uc774 \uc2dc\uc791\ub41c \ub4a4\ubfd0\ub9cc \uc544\ub2c8\ub77c \ubcc4\uac70 \ud6c4 \uc18c\uc1a1\uc744 \uc900\ube44\ud558\uac70\ub098 \ud611\uc0c1\ud558\ub294 \ub2e8\uacc4(s 71B(5)\u2013(6))\ubd80\ud130 \uc804 \uc138\uacc4 \ubaa8\ub4e0 \uc9c1\u00b7\uac04\uc811 \uc790\uc0b0\uacfc \ucc98\ubd84 \ub0b4\uc5ed\uc744 \uc228\uae40\uc5c6\uc774 \uacf5\uac1c\ud574\uc57c \ud574\uc694. \uc774 \uc758\ubb34\ub97c \uc5b4\uae30\uba74 \uc18c\uc1a1\ube44\uc6a9 \ud3ed\ud0c4\uc744 \ub9de\uac70\ub098 \ubd88\ub9ac\ud55c \ucd94\uc815\uc744 \ubc1b\uac8c \ub3fc\uc694. \uc2ec\ud558\uba74 \ubc95\uc815\ubaa8\ub3c5 \uc81c\uc7ac\uae4c\uc9c0 \ubc1b\uc744 \uc218 \uc788\uc8e0. \ub610\ud55c \uc0ac\uc5c5\uccb4\ub098 \ubd80\ub3d9\uc0b0 \uac00\uce58\ub97c \uc904\uc774\ub824\ub294 \uc2dc\ub3c4\ub3c4 \ud1b5\ud558\uc9c0 \uc54a\uc544\uc694. \ubcf8\uc778 \uc785\ub9db\uc5d0 \ub9de\ub294 \uc790\ub8cc\ub9cc \ud68c\uacc4\uc0ac\uc5d0\uac8c \ub118\uaca8 \uc77c\ubc29\uc801\uc778 \uac10\uc815\uc11c\ub97c \ubc1b\uc544 \uc624\ub354\ub77c\ub3c4 \uc18c\uc6a9\uc5c6\uac70\ub4e0\uc694. <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2026/74.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Driesen &amp; Klerk [2026] FedCFamC1A 74<\/em><\/a> ([41], [58]) \ud310\uacb0\uc774 \uc774 \uc810\uc744 \uc798 \ubcf4\uc5ec \uc918\uc694. 1\uc2ec\uc740 \ud55c\ucabd \ubc30\uc6b0\uc790\uac00 \uc77c\ubc29\uc801\uc73c\ub85c \uc81c\uacf5\ud55c \uc815\ubcf4\uc5d0\ub9cc \uae30\ucd08\ud55c \ud68c\uacc4\uc0ac \ud3c9\uac00 \uc758\uacac\uc744 \uc778\uc815\ud558\uc9c0 \uc54a\uc558\uc5b4\uc694. \uc99d\uac70\uac00\uce58 \uc601(0)\uc810\uc744 \ub9e4\uae34 \uac70\uc608\uc694. \ud56d\uc18c\ubd80\ub3c4 \uc774 1\uc2ec \ud310\ub2e8\uc774 \uc804\uc801\uc73c\ub85c \uc633\ub2e4\uace0 \ud655\uc778\ud588\uc8e0. \uc138\uae08 \ubd80\ucc44\ub098 \ubcf4\ud5d8\uae08 \uc5ed\uc2dc \uc815\uad50\ud55c \ubc95\ub9ac\uac00 \uc791\ub3d9\ud574\uc694. \uc5f0\ubc29\ub300\ubc95\uc6d0\uc758 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2018/62.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Commissioner of Taxation v Tomaras [2018] HCA 62<\/em><\/a> ([1], [9]) \ud310\uacb0\uc744 \ubcfc\uae4c\uc694? \uad6d\uc138\uccad \uc18c\ub4dd\uc138 \uccb4\ub0a9 \ucc44\ubb34\uc790\ub97c \ub2e4\ub978 \ubc30\uc6b0\uc790\ub85c \ubc14\uafb8\ub294 \uba85\ub839(s 90AE) \uc790\uccb4\ub294 \uac00\ub2a5\ud558\ub2e4\uace0 \ubcf4\uc558\uc5b4\uc694. \ub2e4\ub9cc \uc138\uae08 \uc644\ub0a9\uc774 \uc704\ud0dc\ub85c\uc6cc\uc9c8 \uc6b0\ub824\uac00 \uc788\uc73c\uba74 \ud5c8\uc6a9\ub418\uc9c0 \uc54a\ub294\ub2e4\uace0 \ud310\ub2e8\ud588\uc8e0. \uc774\uc5b4\uc9c4 \ud56d\uc18c\uc2ec <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2021/82.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Tomaras &amp; Tomaras [2021] FedCFamC1A 82<\/em><\/a> (\ub2e4\uc218\uc758\uacac [95], [127])\uc5d0\uc11c\ub294 \uc7a5\ud574\ubcf4\ud5d8(TPD) \uc6d4 \uc9c0\uae09\uae08\ub3c4 \ub2e4\ub918\uc5b4\uc694. \uc77c\uc2dc\uae08 \uc804\ud658\uc774\ub098 \uc591\ub3c4\uac00 \ubd88\uac00\ub2a5\ud55c \uc6d4 \uc9c0\uae09\uae08\uc774 \ubb38\uc81c\uc600\ub294\ub370\uc694. \uadf8 \uc9c0\uae09\uae08\uc740 \ubd84\ud560 \uac00\ub2a5\ud55c \uc7ac\uc0b0\uc774 \uc544\ub2c8\ub77c \uc18c\ub4dd\uc5d0 \ud574\ub2f9\ud55c\ub2e4\uace0 \uc815\ub9ac\ud588\uc8e0.<\/p>\n<h2 id=\"\ubc18\ub824\ub3d9\ubb3c-\uacf5\ub3d9-\uc591\uc721\uad8c-\uc804\uba74-\uae08\uc9c0s-7967\uc640-\ub193\uce58\uba74-\ub05d\ub098\ub294-\uc81c\ucc99\uae30\uac04\" class=\"doc-h2\">\ubc18\ub824\ub3d9\ubb3c \uacf5\ub3d9 \uc591\uc721\uad8c \uc804\uba74 \uae08\uc9c0(s 79(6)\u2013(7))\uc640 \ub193\uce58\uba74 \ub05d\ub098\ub294 \uc81c\ucc99\uae30\uac04<\/h2>\n<p class=\"doc-p\">\uac00\uc871\ucc98\ub7fc \ud0a4\uc6b0\ub358 \uac15\uc544\uc9c0\ub098 \uace0\uc591\uc774\ub97c \ub450\uace0 \ubc8c\uc5b4\uc9c0\ub294 \ub2e4\ud23c\ub3c4 \ub9c8\ucc2c\uac00\uc9c0\uc608\uc694. 2025\ub144 6\uc6d4 10\uc77c\ubd80\ud130 \uc644\uc804\ud788 \uc0c8\ub85c\uc6b4 \ubc95\uc870\ubb38\uc758 \uaddc\uc728\uc744 \ubc1b\uac70\ub4e0\uc694. \uac1c\uc815\ubc95\uc740 \ubc18\ub824\ub3d9\ubb3c(companion animals, s 4(1))\uc744 \uc77c\ubc18 \uac00\uc7ac\ub3c4\uad6c\uc640 \ubd84\ub9ac\ud588\uc5b4\uc694. s 79(6)\u2013(7)(\uc0ac\uc2e4\ud63c\uc740 s 90SM(6)\u2013(7))\uc5d0 \ubcc4\ub3c4 \uae30\uc900\uc744 \uc138\uc6e0\uc8e0. \ud575\uc2ec\uc740 \uc544\uc8fc \uba85\ud655\ud574\uc694. \ubc95\uc6d0\uc774 \ub0b4\ub9b4 \uc218 \uc788\ub294 \uba85\ub839\uc740 \ud55c\ucabd \ub2f9\uc0ac\uc790\uc758 \ub2e8\ub3c5 \uc18c\uc720\uad8c \uc778\uc815, \ub3d9\uc758\ud55c \uc81c3\uc790\uc5d0\uac8c \uc591\ub3c4, \ub610\ub294 \ub9e4\uac01 \ub531 \uc138 \uac00\uc9c0\ubfd0\uc774\uc5d0\uc694. \ubc18\ub824\ub3d9\ubb3c \uacf5\ub3d9 \uc18c\uc720\ub098 \ubc88\uac08\uc544 \ub370\ub9ac\uace0 \uc0ac\ub294 \uacf5\ub3d9 \ub3cc\ubd04 \uba85\ub839\uc740 \ubc95\uc801\uc73c\ub85c \uae08\uc9c0\ub3fc\uc694. \uc774 \uc870\ud56d\uc744 \ucc98\uc74c\uc73c\ub85c \ud574\uc11d\ud55c <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC2F/2025/1315.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Wright &amp; Berger [2025] FedCFamC2F 1315<\/em><\/a> ([70]\u2013[75]) \ud310\uacb0\uc5d0\uc11c\ub3c4 \ubc95\uc6d0\uc740 \ub2e8\ud638\ud588\uc5b4\uc694. \ud574\ub2f9 \uc870\ud56d\uc774 \uc644\uacb0\ub41c \ubc95\uc804(code)\ucc98\ub7fc \uc791\ub3d9\ud55c\ub2e4\ub294 \uc774\uc720\uc600\uc8e0. \uc544\ubc84\uc9c0\uac00 \ubc18\ub824\uacac \uacf5\ub3d9 \uc2dc\uac04 \ubc30\ubd84\uc774\ub098 \ubd80\uc218\uc801 \uacf5\ub3d9 \uc774\uc6a9 \uba85\ub839\uc744 \uc694\uccad\ud588\ub294\ub370\uc694. \ubc95\uc6d0\uc740 \uadf8\ub7f0 \uba85\ub839\uc744 \uc544\uc608 \ub0b4\ub9b4 \uc7ac\ub7c9\uc774 \uc5c6\ub2e4\uace0 \ubabb \ubc15\uc558\uc5b4\uc694. \ub300\uc2e0 \ub204\uac00 \uc785\uc591\ud558\uace0 \uc0ac\ub8cc\u00b7\ubcd1\uc6d0\ube44\ub97c \uac10\ub2f9\ud588\ub294\uc9c0\ubcf4\ub2e4 \ub354 \ubb34\uac81\uac8c \uc0b4\ud53c\ub294 \uae30\uc900\uc774 \uc788\uc5b4\uc694. \uac00\uc815\ud3ed\ub825 \uc218\ub2e8\uc73c\ub85c \ub3d9\ubb3c\uc744 \uc704\ud611\ud558\uac70\ub098 \ud559\ub300\ud55c \uc774\ub825\uc774 \uc788\ub294\uc9c0((7)(d)\u2013(e)), \ub2f9\uc0ac\uc790\ub098 \uc790\ub140\uc640\uc758 \uc815\uc11c\uc801 \uc720\ub300\uac00 \uc5b4\ub5a0\ud55c\uc9c0((7)(f)), \uc55e\uc73c\ub85c \uc0c1\ub300\ubc29 \ub3c4\uc6c0 \uc5c6\uc774 \ub2e8\ub3c5\uc73c\ub85c \ub3cc\ubcfc \ub2a5\ub825\uc774 \uc788\ub294\uc9c0((7)(g))\ub97c \uc911\uc2ec\uc73c\ub85c \ud55c \uba85\uc758 \uc8fc\uc778\uc744 \uc815\ud574\uc694.<\/p>\n<p class=\"doc-p\">\ub9c8\uc9c0\ub9c9\uc73c\ub85c \uc544\ubb34\ub9ac \uc720\ub9ac\ud55c \ubc95\ub9ac\uac00 \uc788\uc5b4\ub3c4 \uc2dc\uacc4\ub97c \ub193\uce58\uba74 \ubc95\uc6d0 \ubb38\ud131\uc870\ucc28 \ub118\uae30 \ud798\ub4e4\uc5b4\uc694. \ud638\uc8fc \ud1b5\uacc4\uccad(ABS)\uc758 2025\ub144 \uc774\ud63c \ud1b5\uacc4(2026\ub144 7\uc6d4 \ubc1c\ud45c)\ub97c \ubcfc\uae4c\uc694? \ud638\uc8fc \ubd80\ubd80\ub4e4\uc758 \ud63c\uc778\ubd80\ud130 \ubcc4\uac70\uae4c\uc9c0 \uc911\uc704 \uae30\uac04\uc740 9.4\ub144\uc774\uc5d0\uc694. \uadf8\ub7f0\ub370 \uc2e4\uc81c \uc774\ud63c \ud655\uc815\uae4c\uc9c0\ub294 13.4\ub144\uc774 \uac78\ub824\uc694. \ubcc4\uac70 \ud6c4 \ud3c9\uade0 4\ub144 \uac00\uae4c\uc774 \uc11c\ub958 \uc815\ub9ac\ub97c \ubbf8\ub8e8\ub294 \uacbd\ud5a5\uc774 \ub69c\ub837\ud558\uc8e0. \ubcc4\uac70 \uc911\uc5d0\ub294 \uc7ac\uc0b0\ubd84\ud560 \uae30\ud55c\uc774 \ud750\ub974\uc9c0 \uc54a\uc544\uc694. \ud558\uc9c0\ub9cc \uc77c\ub2e8 \uc774\ud63c \uba85\ub839\uc774 \ub0b4\ub824\uc838 \uc120\uace0 \ud6c4 1\uac1c\uc6d4 1\uc77c \ub4a4 \ud6a8\ub825\uc774 \ubc1c\uc0dd\ud558\uba74(s 55(1)) \uadf8\ub0a0\ub85c\ubd80\ud130 \uc815\ud655\ud788 12\uac1c\uc6d4 \uc774\ub0b4(s 44(3))\uc5d0 \uc7ac\uc0b0\ubd84\ud560\uc774\ub098 \ubc30\uc6b0\uc790 \ubd80\uc591\ub8cc \uc2e0\uccad\uc744 \uc811\uc218\ud574\uc57c \ud574\uc694. \uc0ac\uc2e4\ud63c(de facto) \ucee4\ud50c\uc740 \uc774\ud63c \uc808\ucc28\uac00 \uc5c6\uc5b4\uc694. \uadf8\ub798\uc11c \ubcc4\uac70\uc77c\ub85c\ubd80\ud130 2\ub144 \uc774\ub0b4(s 44(5))\uac00 \uc808\ub300 \uae30\ud55c\uc774\uc5d0\uc694. \uc774 \uae30\ud55c\uc744 \ud558\ub8e8\ub77c\ub3c4 \ub118\uae30\uba74 \uadf9\uc2ec\ud55c \uacbd\uc81c\uc801 \uace4\uad81(hardship, s 44(4) \ubc0f s 44(6))\uc744 \ubcc4\ub3c4\ub85c \uc785\uc99d\ud574 \ubc95\uc6d0\uc758 \ud2b9\ubcc4 \ud5c8\uac00\ub97c \ubc1b\uc544\uc57c\ub9cc \ubcf8\uc548 \uccad\uad6c\uac00 \uac00\ub2a5\ud574\uc838\uc694. \uacb0\uad6d \ud611\uc0c1\ub825\uc774 \uae09\uaca9\ud788 \ubb34\ub108\uc9c0\uace0 \ub9d0\uc8e0.<\/p>\n<h2 id=\"\ub0b4-\uc0ac\uac74\uc5d0-\ub9de\ub294-\ub2e4\uc74c-\ub2e8\uacc4-\uc810\uac80\ud558\uae30\" class=\"doc-h2\">\ub0b4 \uc0ac\uac74\uc5d0 \ub9de\ub294 \ub2e4\uc74c \ub2e8\uacc4 \uc810\uac80\ud558\uae30<\/h2>\n<p class=\"doc-p\">\uad6c\ub450\ub85c \ub098\ub208 \uc7ac\uc0b0 \uc57d\uc18d\uc774\ub098 \uacf5\uc99d\ubc1b\uc9c0 \uc54a\uc740 \uac1c\uc778 \uac01\uc11c\ub294 \ud638\uc8fc \uac00\uc871\ubc95\uc0c1 \uc885\uacb0 \ud6a8\ub825\uc774 \uc5c6\uc5b4\uc694. \ubd80\ub3d9\uc0b0 \uba85\uc758 \uc774\uc804 \uc2dc \uc218\ub9cc \ub2ec\ub7ec\uc758 \uc8fc\uc815\ubd80 \uc778\uc9c0\uc138(Stamp Duty) \uba74\uc81c \ud61c\ud0dd\ub3c4 \ubc1b\uc9c0 \ubabb\ud558\uc8e0. \uc774\ubbf8 \ud070 \ud2c0\uc5d0\uc11c \ud569\uc758\uac00 \uc624\uac14\ub2e4\uba74 \ubc95\uc6d0 \uc778\uc7a5\uc774 \ucc0d\ud788\ub294 \ud569\uc758\uba85\ub839(Consent Orders)\uc73c\ub85c \ud655\uc815\ud574 \ub450\uc5b4\uc57c \uc548\uc804\ud574\uc694. \ubc18\ub300\ub85c \uc0c1\ub300\ubc29\uc774 \uc5f0\ub77d\uc744 \ud53c\ud558\uac70\ub098 \ud55c\uad6d\u00b7\ud638\uc8fc \uacc4\uc88c \uacf5\uac1c\ub97c \uac70\ubd80\ud558\uba70 \uc2dc\uac04\uc744 \ub04c\uace0 \uc788\ub2e4\uba74 \uc81c\ucc99\uae30\uac04\uc774 \ub2eb\ud788\uae30 \uc804\uc5d0 s 71B \uc804\uba74 \uc7ac\uc0b0\uacf5\uac1c \uc694\uad6c\ub97c \ud3ec\ud568\ud55c \ubcc0\ud638\uc0ac \uacf5\uc2dd \ud611\uc0c1 \uac1c\uc2dc \uc11c\ud55c\uc73c\ub85c \ud14c\uc774\ube14\uc5d0 \uc549\ud600\uc57c \ud574\uc694. \ubc18\ubcf5\ub418\ub294 \uc774\uba54\uc77c \ubb38\ub2f5\uc73c\ub85c \uc18c\uc911\ud55c \uc2dc\uac04\uc744 \ud5c8\ube44\ud558\uc9c0 \ub9c8\uc138\uc694. \ubc15\uc564\ucf54 \uac00\uc871\ubc95 \uc804\uc6a9 \uc628\ub77c\uc778 \uc9c8\ubb38\uc9c0(<a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\uac00\uc871\ubc95 \uc0ac\uc548 \uc811\uc218 \ubc14\ub85c\uac00\uae30<\/a>)\ub098 \uacf5\uc2dd \ud1b5\ud569 \uc548\ub0b4 \ucc3d\uad6c(<a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ubc15\uc564\ucf54 \uacf5\uc2dd \ub9c1\ud06c \ud5c8\ube0c<\/a>)\ub97c \uc774\uc6a9\ud574 \ubcf4\uc138\uc694. \ud63c\uc778\u00b7\ubcc4\uac70\uc77c\uacfc \uc790\uc0b0 \uc724\uacfd\uc744 \ud55c \ubc88\uc5d0 \ub0a8\uaca8 \uc8fc\uc138\uc694. \uc774\ud574\ucda9\ub3cc \uc870\ud68c \ud6c4 \uac00\uc7a5 \uc2e4\uc775\uc774 \ud070 \ud574\uacb0 \uacbd\ub85c\ub97c \uc9da\uc5b4 \ub4dc\ub9b4\uac8c\uc694.<\/p>\n\n          <div class=\"col-sources-box\">\n            \uadfc\uac70 \ubc95\ub839 \ubc0f \ud1b5\uacc4: Family Law Act 1975 (Cth) Compilation No. 101 (s 4AB(2A), s 44(3)\u2013(6), s 71B, s 79(2)\u2013(7), s 90RI, s 90SM(2)\u2013(7)) \u00b7 ATO Taxation Statistics 2023\u201324 (2026.06) \u00b7 ASFA NESB Superannuation Analysis \u00b7 ABS Marriages and Divorces 2025 (2026.07).\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#E6C98C;\">\ud63c\uc790 \uc9c4\ud589\uc744 \uba48\ucd94\uace0 \ubcc0\ud638\uc0ac\ub97c \ucc3e\uc544\uc57c \ud558\ub294 \uc21c\uac04 \u00b7 \uac00\uc871\ubc95<\/span>\n            <h3 class=\"col-cta-title\">\ud569\uc758\ub41c \uc870\uac74\uc744 \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950)\uc73c\ub85c \ud655\uc815\ud558\uace0 \uc2f6\uac70\ub098 \uc5f0\ub77d\uc744 \ud53c\ud558\ub294 \ubc30\uc6b0\uc790\uc640 \uc7ac\uc0b0\ubd84\ud560 \ud611\uc0c1\uc744 \uc2dc\uc791\ud574\uc57c \ud569\ub2c8\uae4c?<\/h3>\n            <p class=\"col-cta-desc\">\ub2e8\uc21c \uc628\ub77c\uc778 \uc774\ud63c \uc2e0\uccad\uc740 \ud3ec\ud138 \uc124\uba85\uc11c\ub97c \ubcf4\uace0 \uc9c1\uc811 \uc9c4\ud589\ud558\uba74 \uc218\ucc9c \ub2ec\ub7ec\ub97c \uc544\ub07c\uc2e4 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \ubc18\uba74 \ubc95\uc801 \ud6a8\ub825\uc774 \uc788\ub294 \uc7ac\uc0b0\u00b7\uc591\uc721 \ud569\uc758\uba85\ub839(Consent Orders) \uc791\uc131\uc774\ub098 \uc5f0\ub77d\uc744 \ud53c\ud558\ub294 \ubc30\uc6b0\uc790\uc758 \uc7ac\uc0b0 \uacf5\uac1c \uc694\uad6c\u00b7\ud55c\uad6d\uacfc \ud638\uc8fc\uc5d0 \uac78\uce5c \uc7ac\uc0b0\ubd84\ud560\uc774 \ud544\uc694\ud560 \ub54c\ub294 3\ubd84 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \ud575\uc2ec \ub0a0\uc9dc\uc640 \uc7ac\uc0b0 \ub0b4\uc5ed\uc744 \ub0a8\uaca8 \uc8fc\uc2ed\uc2dc\uc624.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">\uac00\uc871\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../files/KO/PDF/03_Family_Law_Divorce_Property_Parenting_and_Settlement_Manual_2026_KO.pdf\" download class=\"col-btn-ghost\">03 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc694\uc57d PDF \ubc1b\uae30<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">\ubc15\uc564\ucf54 \uacf5\uc2dd \uc0c1\ub2f4 \ub9c1\ud06c \ud5c8\ube0c<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">\ubc95\ub960 \uc548\ub0b4: \uc774 \uce7c\ub7fc\uc740 \ud638\uc8fc \uc5f0\ubc29 \uac00\uc871\ubc95(Family Law Act 1975)\uacfc \uacf5\uc2dd \ud1b5\uacc4\u00b7\ud310\ub840\ub97c \ubc14\ud0d5\uc73c\ub85c \uc54c\uae30 \uc27d\uac8c \uc815\ub9ac\ud55c \uc77c\ubc18 \ubc95\ub960 \uc815\ubcf4\uc785\ub2c8\ub2e4. \uac1c\ubcc4 \uc0ac\uac74\uc5d0 \ub300\ud55c \ubc95\ub960 \uc790\ubb38\uc774\ub098 \uc218\uc784 \uacc4\uc57d \uc131\ub9bd\uc744 \ub73b\ud558\uc9c0 \uc54a\uc73c\ubbc0\ub85c \uc774\ud63c \ud6c4 12\uac1c\uc6d4\u00b7\uc0ac\uc2e4\ud63c \uacb0\ubcc4 \ud6c4 2\ub144 \ub9c8\uac10 \uae30\ud55c\uc774\ub098 \ube44\uc790 \uae30\ud55c\uc774 \uc784\ubc15\ud588\ub2e4\uba74 \uc9c0\uccb4 \uc5c6\uc774 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uac80\ud1a0\ub97c \ubc1b\uc544 \ubcf4\uc2dc\uae30 \ubc14\ub78d\ub2c8\ub2e4.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">\ud568\uaed8 \uc77d\uc73c\uba74 \uc88b\uc740 \uac00\uc871\ubc95 \ud310\ub840 \uce7c\ub7fc<\/h3>\n        <a href=\"../../?lang=ko&amp;tab=family\" class=\"col-back-link num\">\u2190 \uc774\ud63c\u00b7\uc7ac\uc0b0\ubd84\ud560 \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../divorce-parenting-reality-guide/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc2e4\uc804 \uac00\uc774\ub4dc \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 02<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \uc774\ud63c \uc808\ucc28\uc640 \uc7ac\uc0b0\ubd84\ud560\u00b7\uc591\uc721\uad8c, \ubcc0\ud638\uc0ac \uc120\uc784 \uc804 \ubc18\ub4dc\uc2dc \uc54c\uc544\uc57c \ud560 \ud604\uc2e4 \uae30\uc900<\/h4><p class=\"col-sib-desc\">\uc678\ub3c4 \uc704\uc790\ub8cc\uc5d0 \ub300\ud55c \uc624\ud574\uc640 \uac04\uc18c\ud654\ub41c \uc11c\uba74 \uc774\ud63c \uc808\ucc28 \ubc0f \ubc18\ubc18 \uacf5\ub3d9\uc591\uc721 \ucd94\uc815 \ud3d0\uc9c0 \ubc95\ub9ac\ub97c \uc9da\uace0 \uc18c\uc561 \uc7ac\uc0b0 \uc0ac\uac74(\u2264$550k)\uacfc \uc815\uc561 \ud569\uc758\uba85\ub839($4,950)\uc758 \uc190\uc775 \uae30\uc900\uc744 \ube44\uad50\ud569\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../partner-visa-breakdown-crossborder/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc774\ubbfc\u00b7\uac00\uc871\ubc95 \uad50\ucc28 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 03<\/span><h4 class=\"col-sib-title\">\ud638\uc8fc \ud30c\ud2b8\ub108\ube44\uc790 \uc9c4\ud589 \uc911 \uacb0\ubcc4\u00b7\uac00\uc815\ud3ed\ub825\uacfc \ud55c\u00b7\ud638 \uad6d\uc81c \uc7ac\uc0b0\ubd84\ud560 \uc2e4\uc804 \ub300\ucc98\ubc95<\/h4><p class=\"col-sib-desc\">\ubc30\uc6b0\uc790\uc758 \ube44\uc790 \ucde8\uc18c \uc704\ud611 \ub300\uc751 \uc6d0\uce59\ubd80\ud130 \uac00\uc815\ud3ed\ub825 \uc601\uc8fc\uad8c \ud2b9\ub840 \uc694\uac74\uacfc \ud55c\u00b7\ud638 \uc591\uad6d \uc790\uc0b0 \uc815\ub9ac \ubc0f \ub3d9\uc758 \uc5c6\ub294 \uc544\ub3d9 \ud574\uc678 \uc774\ub3d9 \uae08\uc9c0 \ubc95\ub9ac\uae4c\uc9c0 \uc885\ud569 \ud574\uc124\ud569\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../parental-advances-loans-gifts-divorce/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubd80\ubaa8 \uc9c0\uc6d0\uae08\u00b7\ucc28\uc6a9\uc99d \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 14<\/span><h4 class=\"col-sib-title\">\ud55c\uad6d \ubd80\ubaa8\ub2d8\uc774 \ubcf4\ud0dc\uc900 \uc9d1\uac12 3\uc5b5, \ud638\uc8fc \uc774\ud63c\ud560 \ub54c \ub3cc\ub824\uc904 \ub300\uc5ec\uae08\uc77c\uae4c \ub098\ub20c \uc99d\uc5ec\uc77c\uae4c<\/h4><p class=\"col-sib-desc\">\ud55c\uad6d\u00b7\ud638\uc8fc \ubd80\ubaa8\ub2d8\uc774 \uc9d1 \uc0b4 \ub54c \ubcf4\ud0dc\uc8fc\uc2e0 \ub3c8\uc774 \uac1a\uc544\uc57c \ud560 \ube5a\uc73c\ub85c \uba3c\uc800 \ube60\uc9c0\ub294 \uacbd\uc6b0\uc640 \ubd80\ubd80 \uc7ac\uc0b0\uc5d0 \uc11e\uc774\ub294 \ucc28\uc774\ub97c \uc2e4\uc81c \ud310\ub840\ub85c \uc54c\uae30 \uc27d\uac8c \ube44\uad50\ud588\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../family-trusts-companies-valuation-divorce/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uac00\uc871\uc2e0\ud0c1\u00b7\ubc95\uc778\uac10\uc815 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 15<\/span><h4 class=\"col-sib-title\">\uc7ac\uc0b0\uc744 \uac00\uc871\uc2e0\ud0c1(Family Trust)\uc774\ub098 Pty Ltd \ubc95\uc778\uc5d0 \ub123\uc5b4\ub450\uba74 \uc774\ud63c \uc7ac\uc0b0\ubd84\ud560\uc5d0\uc11c \uc548\uc804\ud560\uae4c<\/h4><p class=\"col-sib-desc\">\ub204\uac00 \uc2e0\ud0c1\uc758 \uc2e4\uc81c \uacb0\uc815\uad8c(Appointor)\uc744 \uc950\uace0 \uc788\ub294\uc9c0 \ub530\uc9c0\ub294 \uae30\uc900\ubd80\ud130 \uacf5\ub3d9 \uac10\uc815\uc778 \uc808\ucc28\uc640 \ubc95\uc778 \ub3c8\uc744 \uc62e\uae38 \ub54c \uc138\uae08\uc744 \uc544\ub07c\ub294 \ubc29\ubc95\uae4c\uc9c0 \uc9da\uc5b4 \ub4dc\ub9bd\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../post-separation-inheritances-windfalls-delay/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubcc4\uac70 \ud6c4 \uc0c1\uc18d\u00b7\uc9c0\uccb4\uc704\ud5d8 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 16<\/span><h4 class=\"col-sib-title\">\ubcc4\uac70\ud55c \uc9c0 4\ub144 \uc9c0\ub0ac\uc73c\ub2c8 \uc0c8\ub85c \ubc1b\uc740 \uc0c1\uc18d\uc774\ub098 \uc9d1\uac12 \uc0c1\uc2b9\ubd84\uc740 \ub0b4 \uac83\uc774\uaca0\uc9c0: \ud569\uc758\uba85\ub839(Consent Orders)\uc744 \ubbf8\ub8ec \ub300\uac00<\/h4><p class=\"col-sib-desc\">\ubcc4\uac70 \ub4a4 \uc11c\ub958 \uc815\ub9ac\ub97c \ud3c9\uade0 4\ub144\uc529 \ubbf8\ub8e8\ub2e4 \ub098\uc911\uc5d0 \ubc1b\uc740 \uc0c1\uc18d\uae08\uc774\ub098 \uc624\ub978 \uc9d1\uac12\uae4c\uc9c0 \ub098\ub204\uac8c \ub418\ub294 \uc774\uc720\uc640 $4,950 \ubc95\uc6d0 \ud569\uc758\uba85\ub839\uc73c\ub85c \uc548\uc804\ud558\uac8c \ub9c8\ubb34\ub9ac\ud558\ub294 \ubc95\uc744 \ub2f4\uc558\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../prenups-bfa-vs-consent-orders/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ud63c\uc804\uacc4\uc57d BFA \ub300 \ud569\uc758\uba85\ub839 \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 17<\/span><h4 class=\"col-sib-title\">\ubcc0\ud638\uc0ac \uc99d\uba85\uc11c\uae4c\uc9c0 \ubd99\uc778 \ud63c\uc804\uacc4\uc57d\uc11c(BFA)\uac00 \ub300\ubc95\uc6d0\uc5d0\uc11c \uae68\uc9c4 \uc774\uc720: \uc7ac\uc0b0\ubd84\ud560 \ud569\uc758\uc11c(BFA) \ub300 \ubc95\uc6d0 \ud569\uc758\uba85\ub839($4,950) \uc120\ud0dd \uae30\uc900<\/h4><p class=\"col-sib-desc\">\uacb0\ud63c\u00b7\ub3d9\uac70 \uc804\uc5d0 \uc7ac\uc0b0\uc744 \uc548\uc804\ud558\uac8c \uc9c0\ud0a4\ub294 BFA \uc791\uc131 \uc694\ub839\uacfc \uc774\ubbf8 \ud5e4\uc5b4\uc9c4 \ubd80\ubd80\uac00 \uc591\ucabd \ubcc0\ud638\uc0ac\ube44\uac00 \ub4dc\ub294 BFA \ub300\uc2e0 \uc815\uc561 \ud569\uc758\uba85\ub839\uc744 \uace8\ub77c\uc57c \ud558\ub294 \uc774\uc720\ub97c \ube44\uad50\ud588\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../de-facto-threshold-disputes-out-of-time-s44/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc0ac\uc2e4\ud63c \uacbd\uacc4\u00b7\uae30\ud55c\ub3c4\uacfc \u00b7 \uac00\uc871\ubc95 \uce7c\ub7fc 18<\/span><h4 class=\"col-sib-title\">\ub3d9\uac70\ub294 \uc548 \ud558\uace0 \uc0dd\ud65c\ube44\ub9cc \uc92c\ub294\ub370 \uc0ac\uc2e4\ud63c(De Facto) \uc18c\uc1a1\uc774 \ub4e4\uc5b4\uc654\ub2e4\uba74: \uc0ac\uc2e4\ud63c \uc778\uc815 \uae30\uc900(s 4AA)\uacfc \ub9c8\uac10 \uae30\ud55c \uc608\uc678 \uc2e0\uccad(s 44)<\/h4><p class=\"col-sib-desc\">\ub2e8\uc21c \uc5f0\uc778 \uad00\uacc4\uc640 \ubc95\uc801 \uc0ac\uc2e4\ud63c\uc744 \uac00\ub974\ub294 &#x27;\ud558\ub098\uc758 \uc0b6(Coupledom)&#x27; \uae30\uc900\ubd80\ud130 \uae30\ud63c\uc790\uc640\uc758 \uc774\uc911 \uc0ac\uc2e4\ud63c, \ub9c8\uac10 \uae30\ud55c\uc774 \uc9c0\ub09c \uc0ac\uac74\uc758 \ub300\uc751\ubc95\uae4c\uc9c0 \uc27d\uac8c \uc815\ub9ac\ud588\uc2b5\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span
