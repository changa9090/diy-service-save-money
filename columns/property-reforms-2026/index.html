        <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">Consult Park &amp; Co \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">2025\u20132026 REFORM BRIEFING \u00b7 FAMILY 01<\/span>\n          <span class=\"col-verified-pill num\">Primary-Source Verified (Nov 2026)<\/span>\n          <span class=\"col-time-pill num\">8 min read<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">Australia&#x27;s 2025\u20132026 Property Settlement Overhaul: Economic Abuse, Separate Accounts, Family Pets &amp; Limitation Bars<\/h1>\n        <p class=\"col-subtitle\">How post-10 June 2025 s 79 / s 90SM codification, Shinohara, Franc &amp; Franc, Wright &amp; Berger, and ATO superannuation data reshape property settlements<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">Chang Min Park<\/div>\n            <div class=\"col-author-role\">Legal Practitioner Director, Park &amp; Co Lawyers \u00b7 Accredited Specialist in Immigration Law (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col01_property_hero.jpg\" alt=\"Australia&#x27;s 2025\u20132026 Property Settlement Overhaul: Economic Abuse, Separate Accounts, Family Pets &amp; Limitation Bars\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">Under amended s 79 and s 90SM, sole-name real estate, separate ledgers, superannuation splits, companion animals and statutory limitation clocks are governed by a codified statutory framework.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">26.1%\u201350%<\/div><div class=\"col-stat-lbl\">Gender &amp; NESB migrant median superannuation gap at ages 40\u201344 to 50\u201354 (ATO / ASFA)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">Zero Shared Care<\/div><div class=\"col-stat-lbl\">Exhaustive pet ownership code under s 79(6)\u2013(7) (Wright &amp; Berger [2025])<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">12m / 24m<\/div><div class=\"col-stat-lbl\">Strict post-divorce (s 44(3)) &amp; de facto separation (s 44(5)) limitation bars<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">In This Column<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#the-codified-four-step-pathway-and-the-abolition\" class=\"col-toc-link lvl-2\">The codified four-step pathway and the abolition of balance-sheet add-backs<\/a><a href=\"#economic-and-financial-abuse-under-s-4ab2a-statu\" class=\"col-toc-link lvl-2\">Economic and financial abuse under s 4AB(2A): statutory teeth, strict proof<\/a><a href=\"#what-ato-and-asfa-data-reveal-about-ignoring-sup\" class=\"col-toc-link lvl-2\">What ATO and ASFA data reveal about ignoring superannuation<\/a><a href=\"#separate-bank-accounts-overseas-assets-and-the-e\" class=\"col-toc-link lvl-2\">Separate bank accounts, overseas assets and the elevated s 71B disclosure duty<\/a><a href=\"#companion-animals-no-shared-pet-custody-and-stri\" class=\"col-toc-link lvl-2\">Companion animals (no shared pet custody) and strict statutory time bars<\/a><a href=\"#locking-in-a-binding-outcome-before-time-runs-ou\" class=\"col-toc-link lvl-2\">Locking in a binding outcome before time runs out<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">Open Family Law Consultation Form<\/a>\n              <a href=\"../../?lang=en&amp;tab=family\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 Back to Family Law Self-Help Hub<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">Separated spouses regularly walk into an initial conference convinced that keeping separate bank accounts and holding real estate in one name insulates their assets. Under the <em>Family Law Act 1975<\/em> (Cth), that belief rarely survives the first twenty minutes. Since 10 June 2025, when the property schedules of the <em>Family Law Amendment Act 2024<\/em> commenced, a run of 2025 and 2026 appellate decisions in the Federal Circuit and Family Court of Australia (FCFCOA) has changed how financial settlements are pleaded and valued. Relying on pre-2025 rules of thumb can easily cost six figures in retirement equity, particularly where couples sign an informal kitchen-table split without checking superannuation or statutory time bars.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 344\" width=\"100%\" role=\"img\" aria-label=\"Post-10 June 2025 Statutory Property Settlement Architecture (s 79 / s 90SM)\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"343\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"66\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"67\" x2=\"879\" y2=\"67\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"28\" y=\"27\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.06em\">STATUTORY ARCHITECTURE \u00b7 FAMILY LAW AMENDMENT ACT 2024<\/text>\n  <text x=\"28\" y=\"50\" font-size=\"16.5\" font-weight=\"800\" fill=\"#1F242B\">Post-10 June 2025 Statutory Property Settlement Architecture (s 79 / s 90SM)<\/text>\n  <rect x=\"22\" y=\"86\" width=\"196\" height=\"154\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"86\" width=\"196\" height=\"28\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"34\" y=\"104\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">Threshold \u00b7 s 79(2)<\/text>\n  <text x=\"34\" y=\"138\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1F242B\">Just &amp; Equitable Gate<\/text>\n  <text x=\"34\" y=\"158\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E5F\">Stanford [2012] HCA 52<\/text>\n  <text x=\"34\" y=\"184\" font-size=\"11.5\" fill=\"#525B67\">Separate accounts &amp; sole titles<\/text>\n  <text x=\"34\" y=\"203\" font-size=\"11.5\" fill=\"#525B67\">included (Barda &amp; Zerri [2026])<\/text>\n  <line x1=\"221\" y1=\"163\" x2=\"231\" y2=\"163\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"234,163 228,159 228,167\" fill=\"#1F242B\"/>\n  <rect x=\"234\" y=\"86\" width=\"196\" height=\"154\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"234\" y=\"86\" width=\"196\" height=\"28\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"246\" y=\"104\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">Step 1 \u00b7 s 79(3)(a)<\/text>\n  <text x=\"246\" y=\"138\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1F242B\">Existing Global Pool<\/text>\n  <text x=\"246\" y=\"158\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\">Shinohara [2025] FedCFamC1A<\/text>\n  <text x=\"246\" y=\"184\" font-size=\"11.5\" fill=\"#525B67\">Notional add-backs abolished<\/text>\n  <text x=\"246\" y=\"203\" font-size=\"11.5\" fill=\"#525B67\">s 71B statutory disclosure duty<\/text>\n  <line x1=\"433\" y1=\"163\" x2=\"443\" y2=\"163\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"446,163 440,159 440,167\" fill=\"#1F242B\"/>\n  <rect x=\"446\" y=\"86\" width=\"196\" height=\"154\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"446\" y=\"86\" width=\"196\" height=\"28\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"458\" y=\"104\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">Step 2 \u00b7 s 79(4)<\/text>\n  <text x=\"458\" y=\"138\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1F242B\">Contributions + FV (ca)<\/text>\n  <text x=\"458\" y=\"158\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E5F\">Franc &amp; Franc [2026] FedCFamC1A<\/text>\n  <text x=\"458\" y=\"184\" font-size=\"11.5\" fill=\"#525B67\">s 4AB(2A) economic/super control<\/text>\n  <text x=\"458\" y=\"203\" font-size=\"11.5\" fill=\"#525B67\">3-stage contextual proof inquiry<\/text>\n  <line x1=\"645\" y1=\"163\" x2=\"655\" y2=\"163\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"658,163 652,159 652,167\" fill=\"#1F242B\"/>\n  <rect x=\"658\" y=\"86\" width=\"196\" height=\"154\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"658\" y=\"86\" width=\"196\" height=\"28\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"670\" y=\"104\" font-size=\"11.5\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">Step 3 \u00b7 s 79(5)<\/text>\n  <text x=\"670\" y=\"138\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1F242B\">Current &amp; Future Factors<\/text>\n  <text x=\"670\" y=\"158\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\">Replaces old s 75(2) cross-ref<\/text>\n  <text x=\"670\" y=\"184\" font-size=\"11.5\" fill=\"#525B67\">FV impact (a) \u00b7 Wastage (d)<\/text>\n  <text x=\"670\" y=\"203\" font-size=\"11.5\" fill=\"#525B67\">Child housing (f) \u00b7 Legal fees (n)<\/text>\n  <rect x=\"22\" y=\"256\" width=\"410\" height=\"72\" rx=\"10\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1.2\"/>\n  <text x=\"36\" y=\"279\" font-size=\"12.5\" font-weight=\"800\" fill=\"#1D6B48\">Companion Animals Code \u00b7 s 79(6)\u2013(7) / s 90SM(6)\u2013(7)<\/text>\n  <text x=\"36\" y=\"301\" font-size=\"11.1\" fill=\"#1F242B\">Exhaustive code: sole ownership, consented transfer, or sale<\/text>\n  <text x=\"36\" y=\"318\" font-size=\"11.1\" fill=\"#525B67\">ONLY \u00b7 zero shared pet custody orders (Wright &amp; Berger [2025])<\/text>\n  <rect x=\"448\" y=\"256\" width=\"410\" height=\"72\" rx=\"10\" fill=\"#FEF8EC\" stroke=\"#9A6700\" stroke-width=\"1.2\"/>\n  <text x=\"462\" y=\"279\" font-size=\"12.5\" font-weight=\"800\" fill=\"#9A6700\">Strict Statutory Limitation Bars \u00b7 s 44(3) &amp; s 44(5)<\/text>\n  <text x=\"462\" y=\"301\" font-size=\"11.1\" fill=\"#1F242B\">12 months after divorce takes effect (married) \u00b7 2 years after<\/text>\n  <text x=\"462\" y=\"318\" font-size=\"11.1\" fill=\"#525B67\">separation (de facto); late filing barred absent s 44(4)/(6)<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 1: Post-10 June 2025 Statutory Property Settlement Architecture<\/figcaption><\/figure>\n<h2 id=\"the-codified-four-step-pathway-and-the-abolition\" class=\"doc-h2\">The codified four-step pathway and the abolition of balance-sheet add-backs<\/h2>\n<p class=\"doc-p\">For decades, Australian property division ran on judge-made rules layered over sparse legislation. After the High Court held in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2012/52.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Stanford v Stanford<\/em> [2012] HCA 52<\/a> ([37], [40], [42]) that a court must first identify existing legal and equitable interests and then ask under s 79(2) whether altering them is &quot;just and equitable&quot;, practitioners worked from a settled four-step method. On 10 June 2025, Parliament wrote that sequence straight into s 79(3) for marriages and s 90SM(3) for de facto relationships. Courts now identify existing worldwide property and liabilities (s 79(3)(a)), assess financial, non-financial and homemaker or parenting contributions (s 79(4)), and weigh current and future circumstances under a dedicated property list in s 79(5)(a)\u2013(v) (s 90SM(5)(a)\u2013(w) for de facto couples). At the same time, Parliament repealed the old s 79(4)(e) cross-reference and confined s 75(2) strictly to spousal maintenance.<\/p>\n<p class=\"doc-p\">Weeks after those amendments took effect, <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2025/126.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Shinohara &amp; Shinohara<\/em> [2025] FedCFamC1A 126<\/a> ([121], [127]) upended how family lawyers draft balance sheets. Before June 2025, practitioners routinely put dissipated sale proceeds, early cash withdrawals, and paid legal fees back onto the Step 1 asset schedule as notional &quot;add-backs&quot;. Reading amended s 79(3)(a)(i) literally, the Full Court ruled that only <em>existing<\/em> property belongs on the balance sheet. Money that has already been spent no longer exists as property and comes off the table. That does not reward a spouse who drains an offset account before mediation. Rather than padding the pool with spent funds, the Court shifts the percentage division through contribution history under s 79(4) or under specific s 79(5) heads, including intentional or reckless material wastage (s 79(5)(d)), interim litigation funding disparities (s 79(5)(n)), and the justice-of-the-case catch-all (s 79(5)(v)).<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">Reform Area<\/th><th style=\"text-align:left\">Pre-10 June 2025 Position<\/th><th style=\"text-align:left\">Post-10 June 2025 Statutory Rule &amp; Leading Case<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>4-Step Pathway &amp; Future Factors<\/strong><\/td><td style=\"text-align:left\">Uncodified case-law sequence; property borrowed maintenance list in s 75(2) / s 90SF(3)<\/td><td style=\"text-align:left\">Codified in s 79(3) / s 90SM(3); standalone property list in s 79(5)(a)\u2013(v) / s 90SM(5)(a)\u2013(w) (s 79(4)(e) repealed)<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Spent Funds &amp; Paid Legal Fees (&quot;Add-backs&quot;)<\/strong><\/td><td style=\"text-align:left\">Added back onto the Step 1 balance sheet as &quot;notional property&quot; (<em>Omacini<\/em>)<\/td><td style=\"text-align:left\">Abolished on the balance sheet per <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2025/126.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Shinohara<\/em> [2025] FedCFamC1A 126<\/a> ([121], [127]); adjusted via s 79(4) or s 79(5)(d), (n), (v)<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Economic Abuse &amp; Family Violence<\/strong><\/td><td style=\"text-align:left\">Narrow common-law <em>Kennon<\/em> exception; high threshold, rarely pleaded successfully<\/td><td style=\"text-align:left\">Express statutory factors in s 4AB(2A) (including super control &amp; dowry abuse), s 79(4)(ca) &amp; s 79(5)(a); 3-stage inquiry in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2026/159.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Franc &amp; Franc<\/em> [2026] FedCFamC1A 159<\/a> ([148])<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Financial Disclosure Duty<\/strong><\/td><td style=\"text-align:left\">Contained in subordinate Court Rules<\/td><td style=\"text-align:left\">Elevated into the primary Act (s 71B married / s 90RI de facto), binding separated couples even while <em>preparing<\/em> for proceedings (s 71B(5)\u2013(6))<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Companion Animals (Family Pets)<\/strong><\/td><td style=\"text-align:left\">Treated as ordinary chattels like furniture<\/td><td style=\"text-align:left\">Exhaustive code in s 79(6)\u2013(7) / s 90SM(6)\u2013(7); sole ownership, consented transfer, or sale only, with no shared pet custody (<a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC2F/2025/1315.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Wright &amp; Berger<\/em> [2025] FedCFamC2F 1315<\/a> [70]\u2013[75])<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"economic-and-financial-abuse-under-s-4ab2a-statu\" class=\"doc-h2\">Economic and financial abuse under s 4AB(2A): statutory teeth, strict proof<\/h2>\n<p class=\"doc-p\">The 2024\u20132025 amendments also brought economic and financial abuse directly into the property provisions. Expanded s 4AB(2)(g) and new s 4AB(2A) define family violence to cover unreasonably denying financial autonomy: controlling a partner&#x27;s wages or superannuation ((2A)(a)(i)), sabotaging employment or study ((2A)(a)(ii)), running up undisclosed debt in a spouse&#x27;s name ((2A)(a)(iv)), withholding reasonable living expenses ((2A)(b)), and dowry abuse ((2A)(c)\u2013(d)). Judges must weigh both how family violence restricted a party&#x27;s ability to contribute during the relationship (s 79(4)(ca)) and how its effects shape current and future financial needs (s 79(5)(a)), alongside the need to house children under 18 (s 79(5)(f)).<\/p>\n<p class=\"doc-p\">Pleading those sections is much easier than proving them at trial. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2026/159.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Franc &amp; Franc<\/em> [2026] FedCFamC1A 159<\/a> ([134], [148], [150]\u2013[151]), the Full Court told trial judges not to revive old <em>Kennon<\/em>-style &quot;floodgates&quot; barriers and to examine patterns of coercive control in context rather than hunting for isolated flashpoints. At [148], the Court set out a three-stage inquiry: decide whether family violence occurred, assess its nature, extent and context, and determine whether it had a discernible impact on contributions under s 79(4)(ca). Even so, the appellant in <em>Franc<\/em> lost on the evidence because broad, unparticularised assertions fail s 140(2) of the <em>Evidence Act 1995<\/em> (Cth). Securing an adjustment under s 79(4)(ca) or s 79(5)(a) still depends on hard corroboration such as bank freeze records, employment gaps, GP clinical notes, and contemporaneous messages rather than sweeping claims in an affidavit.<\/p>\n<h2 id=\"what-ato-and-asfa-data-reveal-about-ignoring-sup\" class=\"doc-h2\">What ATO and ASFA data reveal about ignoring superannuation<\/h2>\n<p class=\"doc-p\">In private negotiations, especially in migrant households, one spouse often suggests keeping things simple: split the house equity or bank cash and let each person keep their own superannuation. Tax office figures show who pays for that shortcut. In the Australian Taxation Office&#x27;s <em>Taxation Statistics 2023\u201324<\/em> (released June 2026), median superannuation balances across peak separation ages show a stubborn gap. At ages 40\u201344, men hold a median $116,076 compared with $85,804 for women, a 26.1% gap. At ages 45\u201349, median balances sit at $154,751 for men against $110,864 for women (28.4%), and by ages 50\u201354 the gap reaches 30.1% ($192,196 versus $134,309).<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 472\" width=\"100%\" role=\"img\" aria-label=\"Median Australian Superannuation Balances &amp; Gender / Migrant Gaps at Separation Ages\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"471\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"78\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"79\" x2=\"879\" y2=\"79\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"28\" y=\"29\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.06em\">STATISTICAL EVIDENCE \u00b7 SUPERANNUATION SPLITTING<\/text>\n  <text x=\"28\" y=\"52\" font-size=\"17\" font-weight=\"800\" fill=\"#1F242B\">Median Australian Superannuation Balances &amp; Gender / Migrant Gaps at Separation Ages<\/text>\n  <text x=\"28\" y=\"70\" font-size=\"11.5\" fill=\"#525B67\">Sources: ATO Taxation Statistics 2023\u201324 (released June 2026) &amp; ASFA NESB Migrant Superannuation Analysis<\/text>\n  <line x1=\"205\" y1=\"96\" x2=\"205\" y2=\"392\" stroke=\"#EFECE6\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/>\n  <text x=\"205\" y=\"410\" text-anchor=\"middle\" font-size=\"11\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#76808F\">$0<\/text>\n  <line x1=\"318\" y1=\"96\" x2=\"318\" y2=\"392\" stroke=\"#EFECE6\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/>\n  <text x=\"318\" y=\"410\" text-anchor=\"middle\" font-size=\"11\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#76808F\">$50k<\/text>\n  <line x1=\"431\" y1=\"96\" x2=\"431\" y2=\"392\" stroke=\"#EFECE6\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/>\n  <text x=\"431\" y=\"410\" text-anchor=\"middle\" font-size=\"11\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#76808F\">$100k<\/text>\n  <line x1=\"544\" y1=\"96\" x2=\"544\" y2=\"392\" stroke=\"#EFECE6\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/>\n  <text x=\"544\" y=\"410\" text-anchor=\"middle\" font-size=\"11\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#76808F\">$150k<\/text>\n  <line x1=\"657\" y1=\"96\" x2=\"657\" y2=\"392\" stroke=\"#EFECE6\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/>\n  <text x=\"657\" y=\"410\" text-anchor=\"middle\" font-size=\"11\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#76808F\">$200k<\/text>\n  <text x=\"28\" y=\"126\" font-size=\"13\" font-weight=\"700\" fill=\"#1F242B\">Ages 40\u201344 (ATO)<\/text>\n  <text x=\"28\" y=\"146\" font-size=\"11\" fill=\"#525B67\">Men vs Women<\/text>\n  <rect x=\"205\" y=\"108\" width=\"262\" height=\"20\" rx=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"475\" y=\"122\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F4E5F\">$116,076<\/text>\n  <rect x=\"205\" y=\"133\" width=\"194\" height=\"20\" rx=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"407\" y=\"147\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#7A1F2B\">$85,804<\/text>\n  <rect x=\"726\" y=\"117\" width=\"128\" height=\"26\" rx=\"13\" fill=\"#FDF3F4\" stroke=\"#E6B8BF\" stroke-width=\"1\"/>\n  <text x=\"790\" y=\"134\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#7A1F2B\">-26.1% Gap<\/text>\n  <text x=\"28\" y=\"200\" font-size=\"13\" font-weight=\"700\" fill=\"#1F242B\">Ages 45\u201349 (ATO)<\/text>\n  <text x=\"28\" y=\"220\" font-size=\"11\" fill=\"#525B67\">Men vs Women<\/text>\n  <rect x=\"205\" y=\"182\" width=\"350\" height=\"20\" rx=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"563\" y=\"196\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F4E5F\">$154,751<\/text>\n  <rect x=\"205\" y=\"207\" width=\"250\" height=\"20\" rx=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"463\" y=\"221\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#7A1F2B\">$110,864<\/text>\n  <rect x=\"726\" y=\"191\" width=\"128\" height=\"26\" rx=\"13\" fill=\"#FDF3F4\" stroke=\"#E6B8BF\" stroke-width=\"1\"/>\n  <text x=\"790\" y=\"208\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#7A1F2B\">-28.4% Gap<\/text>\n  <text x=\"28\" y=\"274\" font-size=\"13\" font-weight=\"700\" fill=\"#1F242B\">Ages 50\u201354 (ATO)<\/text>\n  <text x=\"28\" y=\"294\" font-size=\"11\" fill=\"#525B67\">Men vs Women<\/text>\n  <rect x=\"205\" y=\"256\" width=\"434\" height=\"20\" rx=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"647\" y=\"270\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#1F4E5F\">$192,196<\/text>\n  <rect x=\"205\" y=\"281\" width=\"303\" height=\"20\" rx=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"516\" y=\"295\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#7A1F2B\">$134,309<\/text>\n  <rect x=\"726\" y=\"265\" width=\"128\" height=\"26\" rx=\"13\" fill=\"#FDF3F4\" stroke=\"#E6B8BF\" stroke-width=\"1\"/>\n  <text x=\"790\" y=\"282\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#7A1F2B\">-30.1% Gap<\/text>\n  <rect x=\"18\" y=\"322\" width=\"844\" height=\"68\" rx=\"8\" fill=\"#FDF3F4\" opacity=\"0.55\"/>\n  <text x=\"28\" y=\"348\" font-size=\"13\" font-weight=\"700\" fill=\"#1F242B\">Ages 45\u201354 NESB (ASFA)<\/text>\n  <text x=\"28\" y=\"368\" font-size=\"11\" fill=\"#525B67\">Non-NESB vs NESB Migrant<\/text>\n  <rect x=\"205\" y=\"330\" width=\"339\" height=\"20\" rx=\"4\" fill=\"#3B5968\"/>\n  <text x=\"552\" y=\"344\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#3B5968\">$150,000<\/text>\n  <rect x=\"205\" y=\"355\" width=\"169\" height=\"20\" rx=\"4\" fill=\"#B83244\"/>\n  <text x=\"382\" y=\"369\" font-size=\"12\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#B83244\">$75,000<\/text>\n  <rect x=\"726\" y=\"339\" width=\"128\" height=\"26\" rx=\"13\" fill=\"#FDF3F4\" stroke=\"#E6B8BF\" stroke-width=\"1\"/>\n  <text x=\"790\" y=\"356\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#7A1F2B\">-50.0% NESB Gap<\/text>\n  <rect x=\"20\" y=\"424\" width=\"840\" height=\"34\" rx=\"8\" fill=\"#FEF8EC\" stroke=\"#ECD9B0\" stroke-width=\"1\"/>\n  <text x=\"34\" y=\"445\" font-size=\"11.2\" font-weight=\"600\" fill=\"#1F242B\">Takeaway: Splitting home equity while waiving a Super Splitting Order (28-day trustee notice) locks in a 26%\u201350% retirement gap.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 2: Median Australian Superannuation Balances and Migrant Gaps<\/figcaption><\/figure>\n<p class=\"doc-p\">For migrants from non-English-speaking backgrounds (NESB), figures compiled by the Association of Superannuation Funds of Australia (ASFA) look worse still: median balances sit at $60,000 against $100,000 at ages 35\u201344 (a 40% gap) and $75,000 against $150,000 at ages 45\u201354 (a 50% gap). When one partner steps back from paid work after arriving in Australia to raise children or run the back office of a family business while the primary earner builds compulsory employer super, waiving a Superannuation Splitting Order leaves the primary carer short in retirement. Part VIIIB of the Act treats superannuation as divisible property that rolls cleanly between funds once the drafting lawyer gives the fund trustee mandatory 28-day procedural fairness notice before orders are sealed.<\/p>\n<h2 id=\"separate-bank-accounts-overseas-assets-and-the-e\" class=\"doc-h2\">Separate bank accounts, overseas assets and the elevated s 71B disclosure duty<\/h2>\n<p class=\"doc-p\">Keeping finances separate during the marriage does not block a property adjustment either. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC2F/2026/122.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Barda &amp; Zerri<\/em> [2026] FedCFamC2F 122<\/a> ([19]\u2013[20]), a couple lived together for 14 years (married for 11), ran separate bank accounts the entire time, and held real estate largely in sole names. Judge Dunkley held at [20] that separate accounts and individual titles did not stop an adjustment from being just and equitable under s 79(2) where household expenses were shared and indirect contributions supported asset ownership. In the same decision ([24]\u2013[27], [49]\u2013[52]), money advanced by parents toward the husband&#x27;s apartment could not be recast after separation as a repayable loan or trust; it counted instead as a contribution credit on the husband&#x27;s side.<\/p>\n<p class=\"doc-p\">Holding assets offshore offers no shelter. Since 10 June 2025, the duty of full and frank financial disclosure sits directly in s 71B (married) and s 90RI (de facto) of the Act rather than in subordinate Court Rules. It binds separated couples both during litigation (s 71B(1)) and while <em>preparing<\/em> for a proceeding (s 71B(5)\u2013(6)). Real estate in South Korea or elsewhere overseas, foreign bank deposits, private company shares, and cryptocurrency all go into the global pool.<\/p>\n<p class=\"doc-p\">Courts are just as strict with one-sided valuations and statutory liabilities. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2026/74.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Driesen &amp; Klerk<\/em> [2026] FedCFamC1A 74<\/a> ([41], [58]), the appeal court backed a trial judge who gave zero weight to an expert valuation built entirely on one spouse&#x27;s unverified instructions. Under <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2018/62.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Commissioner of Taxation v Tomaras<\/em> [2018] HCA 62<\/a> ([1], [9]), a court can substitute one spouse on an ATO income tax debt under s 90AE, though never if substitution risks leaving the tax unpaid. By contrast, in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC1A/2021/82.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Tomaras &amp; Tomaras<\/em> [2021] FedCFamC1A 82<\/a> ([95], [127]), the majority held that non-assignable monthly TPD disability payments are an income stream rather than divisible s 79 property.<\/p>\n<h2 id=\"companion-animals-no-shared-pet-custody-and-stri\" class=\"doc-h2\">Companion animals (no shared pet custody) and strict statutory time bars<\/h2>\n<p class=\"doc-p\">Disputes over the family dog or cat now fall under a dedicated code in s 79(6)\u2013(7) and s 90SM(6)\u2013(7). Companion animals (s 4(1)) are no longer treated like dining chairs, yet Parliament limited the Court to three orders: sole ownership by one party, transfer to a consenting third person, or sale. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FedCFamC2F/2025/1315.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Wright &amp; Berger<\/em> [2025] FedCFamC2F 1315<\/a> ([70]\u2013[75]), the first published judgment applying the pet provisions, Judge Forbes held that s 90SM(6)\u2013(7) is exhaustive. Judges have no jurisdiction to order shared care, week-about pet handovers, or ancillary shared use. Instead, the Court awards the animal to one person against eight statutory criteria (s 79(7)(a)\u2013(h)), including any history of family violence or animal cruelty ((d)\u2013(e)), emotional attachment ((f)), and demonstrated capacity to care for the pet independently without involving the ex-partner ((g)).<\/p>\n<p class=\"doc-p\">The trap that catches separated couples most often, however, is the statutory limitation clock. Australian Bureau of Statistics figures (<em>Marriages and Divorces, Australia, 2025<\/em>, released July 2026) show that couples separate at a median 9.4 years of marriage and finalise their divorce at 13.4 years, a four-year gap. Separation does not start the property time limit for married couples; divorce does. Once a divorce order takes effect one month and one day after grant (s 55(1)), married spouses have strictly 12 months (s 44(3)) to file for property settlement or spousal maintenance. De facto partners have strictly 2 years from the date of separation (s 44(5)). Miss either deadline and your claim is statute-barred unless you persuade the Court to grant out-of-time leave by proving hardship under s 44(4) or s 44(6).<\/p>\n<h2 id=\"locking-in-a-binding-outcome-before-time-runs-ou\" class=\"doc-h2\">Locking in a binding outcome before time runs out<\/h2>\n<p class=\"doc-p\">Private written agreements and unsigned spreadsheets carry no finality under the <em>Family Law Act<\/em>, and state revenue offices will not exempt a house transfer from transfer duty without a formal instrument. If you and your former partner have broadly agreed on numbers, Court-sealed Consent Orders make that division permanent on the papers without a courtroom appearance. If your ex-partner is stonewalling messages or hiding Australian or overseas balances, a formal solicitor&#x27;s demand under s 71B forces disclosure while you are still inside your limitation window. Send through your key dates and asset summary via the <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Family Law Consultation Form<\/a> or visit the <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Official Links Hub<\/a> for conflict screening and next steps.<\/p>\n\n          <div class=\"col-sources-box\">\n            Primary Authorities: Family Law Act 1975 (Cth) Compilation No. 101 (s 4AB(2A), s 44(3)\u2013(6), s 71B, s 79(2)\u2013(7), s 90RI, s 90SM(2)\u2013(7)) \u00b7 ATO Taxation Statistics 2023\u201324 (June 2026) \u00b7 ASFA NESB Superannuation Analysis \u00b7 ABS Marriages and Divorces 2025 (July 2026).\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#E6C98C;\">WHEN TO CONSULT PARK &amp; CO LAWYERS \u00b7 FAMILY LAW<\/span>\n            <h3 class=\"col-cta-title\">Ready to Lock In $4,950 Consent Orders, Compel Disclosure, or Protect Family Assets?<\/h3>\n            <p class=\"col-cta-desc\">Save thousands on straightforward No-Fault Divorce using our DIY manual; when you need enforceable Consent Orders, formal financial disclosure demands, or cross-border property protection, submit your key dates via our 3-minute consultation form.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/262472844554060\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">Open Family Law Consultation Form<\/a>\n              <a href=\"../../files/EN/PDF/03_Family_Law_Divorce_Property_Parenting_and_Settlement_Manual_2026_EN.pdf\" download class=\"col-btn-ghost\">Download Manual 03 (Family Law PDF)<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=en\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">Park &amp; Co Official Consultation Hub<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">Legal Disclaimer: This publication provides general legal information grounded in Australian legislation, official statistics and superior court authorities current as at November 2026. It does not constitute legal advice for your specific circumstances or create a solicitor-client relationship. Seek formal advice promptly before statutory limitation or visa deadlines expire.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">More Curated Family Law Columns<\/h3>\n        <a href=\"../../?lang=en&amp;tab=family\" class=\"col-back-link num\">\u2190 Back to Family Law Self-Help Hub<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../divorce-parenting-reality-guide/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PRACTICAL REALITY GUIDE \u00b7 FAMILY 02<\/span><h4 class=\"col-sib-title\">Divorce, Parenting &amp; Property in Australia: The Practical Reality Check Before You Hire a Lawyer<\/h4><p class=\"col-sib-desc\">Explains s 48 no-fault DIY divorce and June 2025 s 98A paper hearings, the repeal of equal-time parenting presumptions (Gallagher, Picard, Radecki), PPP &lt;=$550k vs $4,950 Consent Orders.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../partner-visa-breakdown-crossborder/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">FAMILY &amp; VISA INTERSECTION \u00b7 FAMILY 03<\/span><h4 class=\"col-sib-title\">Partner Visa Breakdown, Division 1.5 Family Violence PR &amp; Cross-Border Property Traps<\/h4><p class=\"col-sib-desc\">Why sponsors cannot cancel visas, clearing the Gupta genuine-relationship gate and July 2024 Subclass 309 entry rules, aligning FCFCOA and DHA affidavits, and avoiding s 65Y travel offences.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a><a href=\"../parental-advances-loans-gifts-divorce/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PARENTAL ADVANCES \u00b7 FAMILY 14<\/span><h4 class=\"col-sib-title\">The Bank of Mum and Dad in Australian Divorce: Repayable Loan, Resulting Trust or Gift?<\/h4><p class=\"col-sib-desc\">Distinguishes deductible balance-sheet debts from s 79(4) contributions, resulting trusts vs advancement presumptions, and third-party parent interventions.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../family-trusts-companies-valuation-divorce/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">TRUSTS &amp; VALUATIONS \u00b7 FAMILY 15<\/span><h4 class=\"col-sib-title\">Family Trusts, Private Pty Ltd Companies and Shadow Business Valuations in Property Settlements<\/h4><p class=\"col-sib-desc\">Covers appointor/trustee control vs genuine third-party partners (Ascot), mandatory Single Expert Witness rules, s 106B clawbacks, and tax-effective s 79 orders.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a><a href=\"../post-separation-inheritances-windfalls-delay/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">POST-SEPARATION WEALTH \u00b7 FAMILY 16<\/span><h4 class=\"col-sib-title\">Why Delaying Consent Orders Exposes Post-Separation Inheritances, Lotto Wins and New Equity<\/h4><p class=\"col-sib-desc\">How leaving informal separations unsealed exposes inheritances received 4 years later, $5M\u2013$6M lottery windfalls and rising home equity, and how $4,950 Consent Orders close the door.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../prenups-bfa-vs-consent-orders/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PRENUPS &amp; CONSENT ORDERS \u00b7 FAMILY 17<\/span><h4 class=\"col-sib-title\">Why Prenups Get Crushed Under Thorne v Kennedy and When $4,950 Consent Orders Beat a BFA<\/h4><p class=\"col-sib-desc\">Explains how pre-marital wealth-protection BFAs survive scrutiny and why separated couples who agree save thousands with fixed-fee $4,950 Court Consent Orders.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../de-facto-threshold-disputes-out-of-time-s44/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">DE FACTO &amp; TIME BARS \u00b7 FAMILY 18<\/span><h4 class=\"col-sib-title\">&quot;Were We Even De Facto?&quot; Litigating s 4AA Thresholds, Concurrent Marriages and Out-of-Time Leave<\/h4><p class=\"col-sib-desc\">Why a 17-year secret relationship with monthly allowances failed s 4AA, when concurrent marriages still allow de facto claims, and how courts weigh s 44 hardship and delay.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}}</script>
  <script>
    (function () {
      const payload = JSON.parse(document.getElementById('col-payload').textContent);
      const root = document.getElementById('col-root');
      let cleanupScroll = null;

      function getLang() {
        const q = new URLSearchParams(window.location.search).get('lang');
        return q === 'en' ? 'en' : 'ko';
      }

      function bindTocSpy() {
        if (cleanupScroll) cleanupScroll();
        const links = Array.from(root.querySelectorAll('.col-toc-link'));
        if (!links.length) return;
        const targets = links
          .map((a) => document.getElementById(a.getAttribute('href').slice(1)))
          .filter(Boolean);
        function onScroll() {
          let activeIdx = 0;
          const offset = window.scrollY + 130;
          for (let i = 0; i < targets.length; i++) {
            if (targets[i].offsetTop <= offset) activeIdx = i;
          }
          links.forEach((a, idx) => a.classList.toggle('active', idx === activeIdx));
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        cleanupScroll = () => window.removeEventListener('scroll', onScroll);
        onScroll();
      }

      function render(lg) {
        const data = payload[lg] || payload.ko;
        document.documentElement.lang = lg;
        document.title = data.doc_title;
        root.innerHTML = data.html;
        root.querySelectorAll('[data-set-lang]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const next = btn.getAttribute('data-set-lang');
            const url = new URL(window.location.href);
            url.searchParams.set('lang', next);
            window.history.replaceState({}, '', url.toString());
            render(next);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });
        bindTocSpy();
      }

      render(getLang());
    })();
  </script>

    var firstSlice = remaining.slice(0, 6);
    var secondSlice = remaining.slice(6);
    return Promise.all(firstSlice.map(function (b) {
      return call('get', 'ref-' + b.id + '-' + dayKey).catch(function () { return 0; }).then(function (v) { out[b.id] = v || 0; });
    })).then(function () {
      return secondSlice.length ? delay(260) : Promise.resolve();
    }).then(function () {
      return Promise.all(secondSlice.map(function (b) {
        return call('get', 'ref-' + b.id + '-' + dayKey).catch(function () { return 0; }).then(function (v) { out[b.id] = v || 0; });
      }));
    }).then(function () {
      return out;
    });
  }

  function renderReferrerBox(countsMap) {
    var isEn = uiLang() === 'en';
    var items = REF_BUCKETS.map(function (b) {
      return { id: b.id, label: isEn ? b.en : b.ko, count: countsMap[b.id] || 0 };
    }).filter(function (x) { return x.count > 0; }).sort(function (a, b) { return b.count - a.count; });
    var totalRef = items.reduce(function (acc, x) { return acc + x.count; }, 0);
    var head = '<div class="vc-ref-title"><span>' +
      (isEn ? ('Today&rsquo;s Referral Channels (' + today + ')') : ('오늘 유입 채널 분포 (' + today + ')')) +
      '</span><small>' + (isEn ? ('Tracked visitors: ' + fmt(totalRef)) : ('채널 집계 방문자: ' + fmt(totalRef) + '명')) + '</small></div>';
    if (!items.length) {
      return head + '<p class="vc-ref-note">' +
        (isEn
          ? 'Anonymous referral channel buckets (Naver, Cafe, KakaoTalk, Threads, Hub, Direct) are recorded once per browser per day as new visits arrive (zero personal or URL path data stored).'
          : '익명 유입 경로(검색·카페·카카오톡·스레드·허브 이동 등) 집계는 신규 방문부터 하루 브라우저당 1회씩 기록됩니다 (세부 URL·개인정보 미수집).') +
        '</p>';
    }
    var rowsHtml = items.map(function (item) {
      var pct = totalRef > 0 ? Math.round((item.count / totalRef) * 100) : 0;
      return '<div class="vc-ref-row">' +
        '<span class="vc-ref-name" title="' + item.label + '">' + item.label + '</span>' +
        '<div class="vc-ref-track"><div class="vc-ref-fill" style="width:' + Math.max(4, pct) + '%"></div></div>' +
        '<span class="vc-ref-val">' + fmt(item.count) + ' (' + pct + '%)</span>' +
        '</div>';
    }).join('');
    var note = isEn
      ? 'Privacy-safe coarse channel buckets only (1 per browser/day; zero IP, query string, or full referrer URL stored).'
      : '개인정보 보호형 채널 그룹 집계 (하루 브라우저당 1회 기준 &middot; 검색어·세부 URL·IP 미수집)';
    return head + '<div class="vc-ref-list">' + rowsHtml + '</div><p class="vc-ref-note">' + note + '</p>';
  }

  function loadHistoryRows(days) {
    var histCache = {};
    try { histCache = JSON.parse(localStorage.getItem(HIST_KEY) || '{}') || {}; } catch (e) {}
    var results = new Array(days.length);
    var pending = [];
    days.forEach(function (d, idx) {
      if (d < today && Array.isArray(histCache[d])) {
        results[idx] = histCache[d];
      } else if (d === today && typeof liveTodayViews === 'number' && typeof liveTodayVis === 'number') {
        results[idx] = [liveTodayViews, liveTodayVis];
      } else {
        pending.push({ d: d, idx: idx });
      }
    });

    var batchSize = pending.length > 7 ? 4 : 6;
    var pauseMs = pending.length > 7 ? 2900 : 180;
    var chain = Promise.resolve();
    for (var c = 0; c < pending.length; c += batchSize) {
      (function (slice, waitFirst) {
        chain = chain.then(function () {
          return (waitFirst ? delay(pauseMs) : Promise.resolve()).then(function () {
            return Promise.all(slice.map(function (item) {
              var k = item.d.replace(/-/g, '');
              var pViews = (item.d === today && typeof liveTodayViews === 'number')
                ? Promise.resolve(liveTodayViews)
                : call('get', 'day-' + k).catch(function () { return null; });
              var pVis = (item.d === today && typeof liveTodayVis === 'number')
                ? Promise.resolve(liveTodayVis)
                : call('get', 'vday-' + k).catch(function () { return null; });
              return Promise.all([pViews, pVis]).then(function (pair) {
                var v0 = pair[0] == null ? 0 : pair[0];
                var v1 = pair[1] == null ? 0 : pair[1];
                results[item.idx] = [v0, v1];
                if (item.d < today && pair[0] !== null && pair[1] !== null) {
                  histCache[item.d] = [v0, v1];
                }
              });
            }));
          });
        });
      })(pending.slice(c, c + batchSize), c > 0);
    }
    return chain.then(function () {
      try { localStorage.setItem(HIST_KEY, JSON.stringify(histCache)); } catch (e) {}
      return results.map(function (r) { return r || [0, 0]; });
    });
  }

  var cachedRefMap = null;

  function loadAndRenderModal(refreshRefs) {
    syncCounterLang();
    var isEn = uiLang() === 'en';
    var fullDays = lastDays(30);
    var days = activeRange === 7 ? lastDays(7) : fullDays;
    var body = modal.querySelector('.vc-body');
    var chartWaitMsg = isEn ? 'Loading daily statistics&hellip;' : '일별 통계를 불러오는 중입니다&hellip;';
    var refWaitMsg = isEn ? 'Loading today&rsquo;s referral channels&hellip;' : '오늘 유입 채널 집계를 불러오는 중입니다&hellip;';
    var existingRefHtml = (!refreshRefs && cachedRefMap) ? renderReferrerBox(cachedRefMap) : ('<div class="vc-ref-note">' + refWaitMsg + '</div>');

    /* Render toolbar, loading placeholder, referral box, and 1-click share bar IMMEDIATELY (0ms) */
    body.innerHTML = renderToolbar(isEn, fullDays.length) +
      '<div id="vc-chart-slot"><p class="vc-sum">' + chartWaitMsg + '</p></div>' +
      '<div id="vc-ref-box" class="vc-ref-box">' + existingRefHtml + '</div>' +
      renderShareBar(isEn);

    loadHistoryRows(days)
      .then(function (rows) {
        var slot = document.getElementById('vc-chart-slot');
        if (slot) slot.innerHTML = renderChartSvg(days, rows, uiLang() === 'en');
        if (!refreshRefs && cachedRefMap) return cachedRefMap;
        return delay(180).then(function () { return loadTodayReferrers(day); });
      })
      .then(function (refMap) {
        if (refMap) cachedRefMap = refMap;
        var refBox = document.getElementById('vc-ref-box');
        if (refBox && refMap) refBox.innerHTML = renderReferrerBox(refMap);
      })
      .catch(function () {
        var slot = document.getElementById('vc-chart-slot');
        if (slot && !slot.querySelector('svg')) {
          slot.textContent = uiLang() === 'en' ? 'Could not load the chart.' : '그래프를 불러오지 못했습니다.';
        }
      });
  }

  function open() {
    activeRange = 7;
    modal.classList.add('open');
    loadAndRenderModal(true);
  }
  box.setAttribute('role', 'button');
  box.setAttribute('tabindex', '0');
  box.addEventListener('click', open);
  box.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
})();
  </script>
</body>
