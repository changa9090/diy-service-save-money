 <div>\n            <div class=\"col-author-name\">\ubc15\ucc3d\ubbfc \ub300\ud45c\ubcc0\ud638\uc0ac (Chang Min Park)<\/div>\n            <div class=\"col-author-role\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \ub300\ud45c\ubcc0\ud638\uc0ac \u00b7 \ud638\uc8fc \ud038\uc990\ub79c\ub4dc\uc8fc \ubcc0\ud638\uc0ac\ud68c \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac (QLS)<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col12_immi_sch3_hero.jpg\" alt=\"\ube44\uc790 \uac70\uc808\u00b7\uc624\ubc84\uc2a4\ud14c\uc774 \ud6c4 \ud638\uc8fc \uc548\uc5d0\uc11c \ud30c\ud2b8\ub108\ube44\uc790(820) \uc2e0\uccad\ud558\uae30: Section 48 \uc7a5\ubcbd\uacfc Schedule 3 \uba74\uc81c \ubc95\ub9ac\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">Waensila [2016] FCAFC 32 \ud310\uacb0\uc5d0 \ub530\ub77c Schedule 3 \uba74\uc81c \uc5ec\ubd80\ub294 \ube44\uc790 \uc2e0\uccad\uc77c\ub9cc\uc774 \uc544\ub2c8\ub77c \ucd5c\uc885 \uc2ec\uc0ac \uc2dc\uc810\uae4c\uc9c0 \uc313\uc778 \uc808\ubc15\ud55c \uc0ac\uc815\uc744 \ubaa8\ub450 \ubaa8\uc544 \ud310\ub2e8\ud574\uc694.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">28\uc77c \ub370\ub4dc\ub77c\uc778<\/div><div class=\"col-stat-lbl\">\ub9c8\uc9c0\ub9c9 \uc2e4\uc9c8\ube44\uc790 \ub9cc\ub8cc \ud6c4 Criterion 3001 \ucda9\uc871 \ub9c8\uac10\uc77c<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">\uacb0\uc815 \uc2dc\uc810\uae4c\uc9c0 \uc2ec\uc0ac<\/div><div class=\"col-stat-lbl\">\uc811\uc218 \ud6c4 \ucd9c\uc0b0\u00b7\uc9c8\ubcd1 \ub4f1 \uc0ac\uc815 \ubcc0\uacbd \uc804\uba74 \ubc18\uc601 (Waensila [2016] FCAFC 32)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">\ub2e8\uc21c \ud63c\uc778 \ubd88\ucda9\ubd84<\/div><div class=\"col-stat-lbl\">\uc9c4\uc2e4\ud55c \uad00\uacc4\u00b7\uc77c\uc2dc \ubcc4\uac70 \ubd88\ud3b8\ub9cc\uc73c\ub85c\ub294 \uba74\uc81c \uae30\uac01 (Babicci [2005] FCAFC 77)<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">\uc774 \uce7c\ub7fc\uc758 \ubaa9\ucc28<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#\uccab-\ubc88\uc9f8-\uad00\ubb38-section-48-\uc7ac\uc2e0\uccad-\uae08\uc9c0-\uc7a5\ubcbd\uacfc-reg-212-\ud30c\ud2b8\ub108\ube44\uc790-\uc608\uc678\" class=\"col-toc-link lvl-2\">\uccab \ubc88\uc9f8 \uad00\ubb38: Section 48 \uc7ac\uc2e0\uccad \uae08\uc9c0 \uc7a5\ubcbd\uacfc reg 2.12 \ud30c\ud2b8\ub108\ube44\uc790 \uc608\uc678<\/a><a href=\"#\ub450-\ubc88\uc9f8-\uad00\ubb38-\uc2e4\uc9c8\ube44\uc790-\ub9cc\ub8cc-28\uc77c-\ub3c4\uacfc\uc640-schedule-3300130033004\uc758-\" class=\"col-toc-link lvl-2\">\ub450 \ubc88\uc9f8 \uad00\ubb38: \uc2e4\uc9c8\ube44\uc790 \ub9cc\ub8cc 28\uc77c \ub3c4\uacfc\uc640 Schedule 3(3001\u00b73003\u00b73004)\uc758 \ubcbd<\/a><a href=\"#\uc9c4\uc2e4\ud55c-\uc0ac\ub791\ub9cc\uc73c\ub85c\ub294-\uba74\uc81c\ub418\uc9c0-\uc54a\ub294-\uc774\uc720-babicci-\ud310\uacb0\uc758-\ub0c9\uc815\ud55c-\uae30\uc900\" class=\"col-toc-link lvl-2\">\uc9c4\uc2e4\ud55c \uc0ac\ub791\ub9cc\uc73c\ub85c\ub294 \uba74\uc81c\ub418\uc9c0 \uc54a\ub294 \uc774\uc720: Babicci \ud310\uacb0\uc758 \ub0c9\uc815\ud55c \uae30\uc900<\/a><a href=\"#\uc811\uc218-\uc774\ud6c4-\ud0dc\uc5b4\ub09c-\uc790\ub140\uc640-\ud6c4\ubc1c\uc801-\uc0ac\uc815\uc758-\ud798-waensila-\uc804\uc6d0\uc7ac\ud310\ubd80-\ud310\uacb0\" class=\"col-toc-link lvl-2\">\uc811\uc218 \uc774\ud6c4 \ud0dc\uc5b4\ub09c \uc790\ub140\uc640 \ud6c4\ubc1c\uc801 \uc0ac\uc815\uc758 \ud798: Waensila \uc804\uc6d0\uc7ac\ud310\ubd80 \ud310\uacb0<\/a><a href=\"#\ube0c\ub9ac\uc9d5\ube44\uc790-ce\uc758-\ucd9c\uad6d\ucde8\uc5c5-\uc81c\ud55c-\ud568\uc815\uacfc-\uc548\uc804\ud55c-\uc811\uc218-\uc124\uacc4\" class=\"col-toc-link lvl-2\">\ube0c\ub9ac\uc9d5\ube44\uc790 C\u00b7E\uc758 \ucd9c\uad6d\u00b7\ucde8\uc5c5 \uc81c\ud55c \ud568\uc815\uacfc \uc548\uc804\ud55c \uc811\uc218 \uc124\uacc4<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/220391469091053\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">\uc774\ubbfc\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../?lang=ko&amp;tab=immigration\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 \ube44\uc790\u00b7\uc774\ubbfc \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">\ud559\uc0dd\ube44\uc790\ub098 \uc878\uc5c5\uc0dd\ube44\uc790\u00b7\uae30\uc220\ube44\uc790\uac00 \ub73b\ubc16\uc5d0 \uac70\uc808\ub418\uc5b4 \ube0c\ub9ac\uc9d5\ube44\uc790(Bridging Visa)\ub85c \uc9c0\ub0b4\uace0 \uacc4\uc2e0\uac00\uc694? \ud639\uc740 \ud53c\uce58 \ubabb\ud560 \uc0ac\uc815\uc73c\ub85c \ube44\uc790 \ub9cc\ub8cc\uc77c\uc744 \ub118\uaca8 \uc624\ubc84\uc2a4\ud14c\uc774(Overstay) \uc2e0\ubd84\uc774 \ub41c \ub4a4 \ud638\uc8fc \uc2dc\ubbfc\uad8c\uc790\u00b7\uc601\uc8fc\uad8c\uc790 \ubc30\uc6b0\uc790\uc640 \uacb0\ud63c\uc744 \uc57d\uc18d\ud558\uc168\ub098\uc694? \uc628\ub77c\uc778\uc5d0\ub294 \ube44\uc790\uac00 \uac70\uc808\ub410\uac70\ub098 \ubd88\ubc95\uccb4\ub958 \uc0c1\ud0dc\uc5ec\ub3c4 \uc9c4\uc2ec\uc73c\ub85c \uacb0\ud63c\ud588\ub2e4\uba74 \ud638\uc8fc \uc548\uc5d0\uc11c \ud30c\ud2b8\ub108\ube44\uc790(Subclass 820/801)\ub97c \ub123\uc744 \uc218 \uc788\ub2e4\ub294 \uae00\uc774 \uc790\uc8fc \uc62c\ub77c\uc640\uc694. \ubc18\ub9cc \ub9de\uace0 \ubc18\uc740 \uc704\ud5d8\ud55c \uc774\uc57c\uae30\uc608\uc694. \uc2e0\uccad\uc11c \uc811\uc218\uac00 \ud5c8\uc6a9\ub418\ub294 \ubb38\uc81c(Section 48 \uc608\uc678)\uc640 \uc2ec\uc0ac\uc5d0\uc11c \uc2b9\uc778\uc744 \ubc1b\uc544\ub0b4\ub294 \ubb38\uc81c(Schedule 3 \uba74\uc81c)\ub97c \uad6c\ubd84\ud558\uc9c0 \ubabb\ud55c \ucc44 \ube44\uc790 \uc218\uc218\ub8cc\ub9cc \uacb0\uc81c\ud588\ub2e4\uac00 \uac70\uc808\ub2f9\ud558\ub294 \ucee4\ud50c\uc774 \ud574\ub9c8\ub2e4 \ub04a\uc774\uc9c0 \uc54a\uac70\ub4e0\uc694.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 366\" width=\"100%\" role=\"img\" aria-label=\"\ube44\uc790 \uac70\uc808\u00b7\uc624\ubc84\uc2a4\ud14c\uc774 \ud6c4 \uc628\uc1fc\uc5b4 820 \uc2e0\uccad \uc2dc \ud1b5\uacfc\ud574\uc57c \ud560 3\ub2e8\uacc4 \ubc95\ub9ac\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"365\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">\ud638\uc8fc \ub0b4 \ud30c\ud2b8\ub108\ube44\uc790(820) \uad6c\uc81c \u00b7 Section 48 \uc608\uc678\uc640 Schedule 3 \uba74\uc81c \uad00\ubb38<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">\ube44\uc790 \uac70\uc808\u00b7\uc624\ubc84\uc2a4\ud14c\uc774 \ud6c4 \uc628\uc1fc\uc5b4 820 \uc2e0\uccad \uc2dc \ud1b5\uacfc\ud574\uc57c \ud560 3\ub2e8\uacc4 \ubc95\ub9ac<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">\uadfc\uac70: Migration Act s 48 \u00b7 Reg 2.12 \u00b7 cl 820.211(2)(d)(ii) \u00b7 Waensila [2016] FCAFC 32 \u00b7 Babicci [2005] FCAFC 77<\/text>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"36\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">STEP 01 \u00b7 \uc811\uc218 \uc720\ud6a8\uc131 \uad00\ubb38<\/text>\n  <text x=\"36\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">Section 48 \uc608\uc678 \uc694\uac74 \ucda9\uc871<\/text>\n  <text x=\"36\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E5F\">Migration Act s 48 \u00b7 Reg 2.12<\/text>\n  <line x1=\"36\" y1=\"182\" x2=\"272\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">\uc785\uad6d \ud6c4 \ube44\uc790 \uac70\uc808\u00b7\ucde8\uc18c \uc2dc \uc6d0\uce59\uc801 \uc628\uc1fc\uc5b4 \uae08\uc9c0<\/text>\n  <text x=\"36\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ud30c\ud2b8\ub108\ube44\uc790(820/801)\ub294 \uc608\uc678 \ud5c8\uc6a9 \ube44\uc790\uad70 \ud3ec\ud568<\/text>\n  <text x=\"36\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ub2e8, \uc774\uc804 \ud30c\ud2b8\ub108 \uac70\uc808 \uc774\ub825\u00b7\uc2a4\ud3f0\uc11c \uacb0\uaca9 \uc810\uac80<\/text>\n  <text x=\"36\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc811\uc218 \ubb34\ud6a8 \uc2dc \uccb4\ub958 \uc2e0\ubd84 \uc989\uc2dc \ucd94\ub77d \uc704\ud5d8<\/text>\n  <line x1=\"289\" y1=\"195\" x2=\"300\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"303,195 297,191 297,199\" fill=\"#1F242B\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"320\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">STEP 02 \u00b7 28\uc77c \ub370\ub4dc\ub77c\uc778<\/text>\n  <text x=\"320\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">\uc2e4\uc9c8\ube44\uc790 \ub9cc\ub8cc \ud6c4 28\uc77c \uacbd\uacfc(3001)<\/text>\n  <text x=\"320\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\">Schedule 3 Criteria 3001, 3003, 3004<\/text>\n  <line x1=\"320\" y1=\"182\" x2=\"556\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"320\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">\ube0c\ub9ac\uc9d5\ube44\uc790\u00b7\ubd88\ubc95\uccb4\ub958 \uc0c1\ud0dc \uc811\uc218 \uc2dc Sch 3 \ubc1c\ub3d9<\/text>\n  <text x=\"320\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ub2e8\uc21c\ud788 &#x27;\uc9c4\uc2e4\ud55c \ubd80\ubd80\u00b7\ub3d9\uac70&#x27;\ub9cc\uc73c\ub85c\ub294 \uba74\uc81c \ubd88\uac00!<\/text>\n  <text x=\"320\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ucd9c\uad6d \ud6c4 309 \uc2e0\uccad \ubd88\ud3b8\ud568 \uc815\ub3c4\ub85c\ub294 \uae30\uac01(Babicci)<\/text>\n  <text x=\"320\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc2ec\uc0ac\uad00\uc744 \uc6c0\uc9c1\uc77c \uac15\ub825\ud55c \uc0ac\uc720(Compelling) \ud544\uc218<\/text>\n  <line x1=\"573\" y1=\"195\" x2=\"584\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"587,195 581,191 581,199\" fill=\"#1F242B\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1.3\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#1D6B48\"/>\n  <text x=\"604\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">STEP 03 \u00b7 \uacb0\uc815 \uc2dc\uc810\uae4c\uc9c0 \ud655\uc7a5<\/text>\n  <text x=\"604\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">\uc811\uc218 \ud6c4 \uc0ac\uc815 \ubcc0\uacbd\uae4c\uc9c0 \uc804\uba74 \ubc18\uc601<\/text>\n  <text x=\"604\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#1D6B48\">Waensila [2016] FCAFC 32<\/text>\n  <line x1=\"604\" y1=\"182\" x2=\"840\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"604\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">\uba74\uc81c \uc0ac\uc720\ub294 \ube44\uc790 \uc2e0\uccad\uc77c \uc2dc\uc810\uc5d0 \ubb36\uc774\uc9c0 \uc54a\uc74c!<\/text>\n  <text x=\"604\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc2ec\uc0ac\u00b7ART \uc7ac\uc2ec \uacb0\uc815\uc77c\uae4c\uc9c0 \ubc1c\uc0dd\ud55c \uc0ac\uc815 \ud3ec\ud568<\/text>\n  <text x=\"604\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ud638\uc8fc \uc2dc\ubbfc \uc790\ub140 \ucd9c\uc0b0\u00b7\uc911\uc99d \uc9c8\ud658\u00b7\ub3cc\ubd04 \uc758\uc874\uc131<\/text>\n  <text x=\"604\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc804\ubb38 \uc758\ud559\u00b7\uc2ec\ub9ac \uac10\uc815\uc11c\uc640 \ubc95\ub9ac \uc758\uacac\uc11c \uacb0\ud569<\/text>\n  <rect x=\"22\" y=\"312\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#FEF8EC\" stroke=\"#ECD9B0\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"335\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">\uc2e4\ubb34 \ud575\uc2ec: &#x27;\uc11c\ub85c \uc0ac\ub791\ud558\ub2c8 \ubd10\ub2ec\ub77c&#x27;\ub294 \ud0c4\uc6d0\uc11c\ub294 Schedule 3\uc5d0\uc11c \ubc31\uc804\ubc31\ud328\ud569\ub2c8\ub2e4. Waensila\u00b7Babicci \uae30\uc900\uc5d0 \ub9de\ucd98 \uac1d\uad00\uc801 \uc190\ud574 \uc785\uc99d\uc774 \uad00\uac74\uc785\ub2c8\ub2e4.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 1: \ud638\uc8fc \ub0b4 \ud30c\ud2b8\ub108\ube44\uc790(820) \uc2e0\uccad \uc2dc Section 48 \uc608\uc678 \ubc0f Schedule 3 \uba74\uc81c \uc2ec\uc0ac \uad00\ubb38<\/figcaption><\/figure>\n<h2 id=\"\uccab-\ubc88\uc9f8-\uad00\ubb38-section-48-\uc7ac\uc2e0\uccad-\uae08\uc9c0-\uc7a5\ubcbd\uacfc-reg-212-\ud30c\ud2b8\ub108\ube44\uc790-\uc608\uc678\" class=\"doc-h2\">\uccab \ubc88\uc9f8 \uad00\ubb38: Section 48 \uc7ac\uc2e0\uccad \uae08\uc9c0 \uc7a5\ubcbd\uacfc reg 2.12 \ud30c\ud2b8\ub108\ube44\uc790 \uc608\uc678<\/h2>\n<p class=\"doc-p\">\ud638\uc8fc \uc774\ubbfc\ubc95(Migration Act 1958)\uc5d0\ub294 \ube44\uc790\uac00 \ud55c \ubc88 \uaebe\uc778 \uc0ac\ub78c\uc758 \uad6d\ub0b4 \uc7ac\uc2e0\uccad\uc744 \ub9c9\ub294 \ub192\uc740 \uc131\ubcbd\uc774 \uc788\uc5b4\uc694. \ubc14\ub85c Section 48 \uc870\ud56d\uc774\uc5d0\uc694. \ub9c8\uc9c0\ub9c9 \ud638\uc8fc \uc785\uad6d \uc774\ud6c4 \ube44\uc790\uac00 \uac70\uc808\ub418\uac70\ub098 \ucde8\uc18c\ub41c \uc774\ub825\uc774 \uc788\uace0 \ud604\uc7ac \uc815\uc2dd \uccb4\ub958 \ube44\uc790\uc778 \uc2e4\uc9c8\ube44\uc790(Substantive Visa, \ube0c\ub9ac\uc9d5\ube44\uc790 \uc81c\uc678)\uac00 \uc5c6\ub2e4\uba74 \uc6d0\uce59\uc801\uc73c\ub85c \ud638\uc8fc \uc548\uc5d0\uc11c\ub294 \ub2e4\ub978 \ube44\uc790\ub97c \uc811\uc218\ud560 \uc218 \uc5c6\uc5b4\uc694.<\/p>\n<p class=\"doc-p\">\ub2e4\ud589\ud788 \uc774\ubbfc\ubc95 \uc2dc\ud589\uaddc\uce59(Migration Regulations 1994) reg 2.12\uac00 \uc881\uc740 \ucabd\ubb38\uc744 \ud558\ub098 \uc5f4\uc5b4 \ub450\uc5c8\uc5b4\uc694. \ud638\uc8fc \ub0b4 \ud30c\ud2b8\ub108\ube44\uc790(Subclass 820/801)\ub97c Section 48 \uc81c\ud55c\uc5d0\uc11c \ud480\ub9ac\ub294 \uc608\uc678 \ube44\uc790\uad70\uc73c\ub85c \uc815\ud574 \ub193\uc558\uac70\ub4e0\uc694. \uacfc\uac70 \uc785\uad6d \ud6c4 \ud30c\ud2b8\ub108\ube44\uc790\ub97c \uac70\uc808\ub2f9\ud55c \uc804\ub825\uc774 \uc5c6\uace0 \uc801\uaca9 \uc2a4\ud3f0\uc11c \ud6c4\uc6d0\uacfc \uc720\ud6a8 \uc591\uc2dd \uc694\uac74\uc744 \uac16\ucd94\uba74 \uc811\uc218\uac00 \uac00\ub2a5\ud574\uc694. \ud558\uc9c0\ub9cc \uaf2d \uae30\uc5b5\ud558\uc2e4 \uc810\uc774 \uc788\uc5b4\uc694. Section 48 \uc608\uc678 \ud1b5\uacfc\ub294 \ub0b4\ubb34\ubd80 \ud604\uad00\ubb38\uc744 \ub118\uc5b4 \uc2ec\uc0ac\uad00 \ucc45\uc0c1\uc5d0 \uc11c\ub958\ub97c \uc62c\ub838\ub2e4\ub294 \ub73b\uc77c \ubfd0\uc774\uc5d0\uc694. \uace7\ubc14\ub85c \ud6e8\uc52c \uac00\ud30c\ub978 \ub450 \ubc88\uc9f8 \uc131\ubcbd\uc774 \ub098\ud0c0\ub098\uac70\ub4e0\uc694.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">\ub2e8\uacc4 \ubc0f \ubc95\uc801 \uad00\ubb38<\/th><th style=\"text-align:left\">\uadfc\uac70 \uc870\ubb38 \u00b7 \ud575\uc2ec \ud310\ub840<\/th><th style=\"text-align:left\">\uc2ec\uc0ac \uae30\uc900 \ubc0f \uc2e4\ubb34\uc0c1 \uce58\uba85\uc801 \ud568\uc815<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>1\ub2e8\uacc4: \uc720\ud6a8 \uc811\uc218 (Section 48)<\/strong><\/td><td style=\"text-align:left\">\uc774\ubbfc\ubc95 s 48 \u00b7 \uc2dc\ud589\uaddc\uce59 reg 2.12<\/td><td style=\"text-align:left\">\uc2e4\uc9c8\ube44\uc790 \ubbf8\uc18c\uc9c0 + \uac70\uc808\u00b7\ucde8\uc18c \uc774\ub825\uc790\ub3c4 \ud638\uc8fc \ub0b4 820/801 \uc811\uc218 \ud5c8\uc6a9(\uacfc\uac70 \ud30c\ud2b8\ub108\ube44\uc790 \uac70\uc808 \uc804\ub825 \ub4f1 \uacb0\uaca9 \uc5c6\uc744 \uac83) \u00b7 \ub2e8\uc21c \uc811\uc218 \ud5c8\uc6a9\uc77c \ubfd0 \uc2b9\uc778 \ubcf4\uc7a5 \uc544\ub2d8<\/td><\/tr><tr><td style=\"text-align:left\"><strong>2\ub2e8\uacc4: 28\uc77c \uae30\ud55c\uacfc Schedule 3<\/strong><\/td><td style=\"text-align:left\">cl 820.211(2)(d)(ii) \u00b7 Schedule 3 (3001\u00b73003\u00b73004)<\/td><td style=\"text-align:left\">\ub9c8\uc9c0\ub9c9 \uc2e4\uc9c8\ube44\uc790 \ub9cc\ub8cc \ud6c4 28\uc77c \ucd08\uacfc \uc811\uc218\uc790\ub294 \uc6d0\uce59\uc801 \uac70\uc808 \ub300\uc0c1 \u00b7 \ucd9c\uad6d \uc5c6\uc774 \uc2b9\uc778\ubc1b\uc73c\ub824\uba74 Schedule 3 \uc801\uc6a9 \uba74\uc81c(Waiver) \ud544\uc218<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uba74\uc81c \ubb38\ud131\uc758 \uc5c4\uaca9\uc131 (<em>Babicci<\/em>)<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCAFC/2005/77.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Babicci<\/em> [2005] FCAFC 77<\/a> ([21]\u2013[24])<\/td><td style=\"text-align:left\">\uc9c4\uc815\ud55c \ud63c\uc778\u00b7\uc0ac\uc2e4\ud63c \uad00\uacc4 \uc790\uccb4\ub098 \uad6d\uc678 309 \ub300\uae30 \uc911 \uacaa\ub294 \ud1b5\uc0c1\uc801 \ubcc4\uac70 \ubd88\ud3b8\ub9cc\uc73c\ub85c\ub294 \uba74\uc81c \ubd88\uac00 \u00b7 \uc2ec\uc0ac\uad00\uc744 \uc6c0\uc9c1\uc77c \uac15\ub825\ud55c \uc0ac\uc720 \uc694\uad6c<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ud310\ub2e8 \uc2dc\uc810\uc758 \ud655\uc7a5 (<em>Waensila<\/em>)<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCAFC/2016/32.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Waensila<\/em> [2016] FCAFC 32<\/a><\/td><td style=\"text-align:left\">\uba74\uc81c \uc0ac\uc720\uac00 \uc2e0\uccad\uc77c\uc5d0 \uace0\uc815\ub418\uc9c0 \uc54a\uc74c \u00b7 \ucd5c\uc885 \uacb0\uc815 \uc2dc\uc810(\uc7ac\uc2ec ART \ud3ec\ud568)\uae4c\uc9c0 \ubc1c\uc0dd\ud55c \uc790\ub140 \ucd9c\uc0dd\u00b7\uc911\uc99d \uc9c8\ud658 \ub4f1 \ud6c4\ubc1c\uc801 \uc0ac\uc815 \ubaa8\ub450 \ubc18\uc601 \uc758\ubb34<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uccb4\ub958 \uc911 \ube0c\ub9ac\uc9d5\ube44\uc790 \uc81c\uc57d<\/strong><\/td><td style=\"text-align:left\">Bridging Visa C (BVC) \u00b7 Bridging Visa E (BVE)<\/td><td style=\"text-align:left\">\ud574\uc678 \ucd9c\uad6d\uc6a9 BVB \ubc1c\uae09 \uc6d0\ucc9c \ubd88\uac00(\ucd9c\uad6d \uc2dc \uc7ac\uc785\uad6d \ucc28\ub2e8) \ubc0f \uae30\ubcf8 \ucde8\uc5c5 \uc81c\ud55c \ubd80\uacfc \u00b7 \uc7a5\uae30 \uc2ec\uc0ac \uae30\uac04\uc758 \uc0dd\uacc4\u00b7\uc774\ub3d9 \uc124\uacc4 \ud544\uc218<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"\ub450-\ubc88\uc9f8-\uad00\ubb38-\uc2e4\uc9c8\ube44\uc790-\ub9cc\ub8cc-28\uc77c-\ub3c4\uacfc\uc640-schedule-3300130033004\uc758-\" class=\"doc-h2\">\ub450 \ubc88\uc9f8 \uad00\ubb38: \uc2e4\uc9c8\ube44\uc790 \ub9cc\ub8cc 28\uc77c \ub3c4\uacfc\uc640 Schedule 3(3001\u00b73003\u00b73004)\uc758 \ubcbd<\/h2>\n<p class=\"doc-p\">\ubcf8\uc548 \uc2ec\uc0ac\ub85c \ub4e4\uc5b4\uc11c\uba74 cl 820.211(2)(d)(ii) \uc870\ud56d\uc774 \uc55e\uc744 \uac00\ub85c\ub9c9\uc544\uc694. \uc811\uc218 \ub2f9\uc2dc \uc2e4\uc9c8\ube44\uc790\uac00 \uc5c6\ub294 \uc2e0\uccad\uc790\ub294 \ubd80\uce59 Schedule 3 \ucd94\uac00 \uc694\uac74(Criteria 3001, 3003, 3004)\uc744 \ucda9\uc871\ud574\uc57c \ud558\uac70\ub4e0\uc694. \uadf8\uc911 Criterion 3001\uc740 \ub9c8\uc9c0\ub9c9 \uc2e4\uc9c8\ube44\uc790 \ub9cc\ub8cc\uc77c\ub85c\ubd80\ud130 28\uc77c \uc774\ub0b4\uc5d0 \uc811\uc218\ud588\uc744 \uac83\uc744 \uc694\uad6c\ud574\uc694.<\/p>\n<p class=\"doc-p\">\ud604\uc2e4\uc744 \ubcfc\uae4c\uc694? \uc774\uc804 \ube44\uc790 \uac70\uc808 \ud6c4 \ud589\uc815\uc7ac\uc2ec\uc6d0(ART) \uc808\ucc28\ub97c \ubc1f\uc73c\uba70 \ube0c\ub9ac\uc9d5\ube44\uc790\ub85c 1~2\ub144\uc744 \ubcf4\ub0c8\uac70\ub098 \uc624\ubc84\uc2a4\ud14c\uc774\uac00 \uae38\uc5b4\uc9c4 \ubd84\ub4e4\uc740 \uc2e4\uc9c8\ube44\uc790 \ub9cc\ub8cc \ud6c4 28\uc77c\uc774 \uc774\ubbf8 \ud6cc\uca4d \uc9c0\ub09c \uc0c1\ud0dc\uc608\uc694. Criterion 3001 \ud1b5\uacfc\uac00 \uc0b0\uc220\uc801\uc73c\ub85c \ubd88\uac00\ub2a5\ud558\uc8e0. \uc6d0\uce59\ub300\ub85c\ub77c\uba74 \ucd9c\uad6d\ud574 \uad6d\uc678 \ud30c\ud2b8\ub108\ube44\uc790(Subclass 309/100)\ub97c \ubc1f\uc544\uc57c \ud574\uc694. \ud638\uc8fc \uc548\uc5d0\uc11c 820 \uc2b9\uc778\uc744 \ubc1b\uc73c\ub824\uba74 cl 820.211(2)(d)(ii) \ub2e8\uc11c\uc5d0 \ub530\ub77c \uc774 \uaddc\uc815\uc744 \uc801\uc6a9\ud558\uc9c0 \ub9d0\uc544\uc57c \ud560 \uac15\ub825\ud558\uace0 \ubd88\uac00\ud53c\ud55c \uc0ac\uc720(compelling reasons)\ub97c \uc785\uc99d\ud574 \uba74\uc81c\ub97c \ubc1b\uc544\ub0b4\uc57c \ud574\uc694.<\/p>\n<h2 id=\"\uc9c4\uc2e4\ud55c-\uc0ac\ub791\ub9cc\uc73c\ub85c\ub294-\uba74\uc81c\ub418\uc9c0-\uc54a\ub294-\uc774\uc720-babicci-\ud310\uacb0\uc758-\ub0c9\uc815\ud55c-\uae30\uc900\" class=\"doc-h2\">\uc9c4\uc2e4\ud55c \uc0ac\ub791\ub9cc\uc73c\ub85c\ub294 \uba74\uc81c\ub418\uc9c0 \uc54a\ub294 \uc774\uc720: Babicci \ud310\uacb0\uc758 \ub0c9\uc815\ud55c \uae30\uc900<\/h2>\n<p class=\"doc-p\">\ub450 \uc0ac\ub78c\uc774 \ub728\uac81\uac8c \uc0ac\ub791\ud558\uace0 \uacb0\ud63c\uc2dd\ub3c4 \uc62c\ub838\ub2e4\ub294 \uc0ac\uc9c4\uacfc \ud3b8\uc9c0\ub97c \uc218\ubc31 \uc7a5 \ub0b4\uba74 \uba74\uc81c\ub420\uae4c\uc694? \uc544\uc27d\uac8c\ub3c4 \uc790\ub825 \uc2e0\uccad(DIY)\uc758 \ub300\ub2e4\uc218\uac00 \ubc14\ub85c \uc5ec\uae30\uc11c \ubb34\ub108\uc838\uc694. \uc5f0\ubc29\ud56d\uc18c\ubc95\uc6d0 \uc804\uc6d0\uc7ac\ud310\ubd80\uc758 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCAFC/2005/77.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Babicci v Minister for Immigration &amp; Multicultural &amp; Indigenous Affairs<\/em> [2005] FCAFC 77<\/a> ([21]\u2013[24]) \ud310\uacb0\uc774 \uadf8 \uc774\uc720\ub97c \uba85\ud655\ud788 \ubc1d\ud614\uc5b4\uc694.<\/p>\n<p class=\"doc-p\">\uc7ac\ud310\ubd80\ub294 compelling\uc774\ub780 \uc2ec\uc0ac\uad00\uc758 \ub9c8\uc74c\uc744 \uc6c0\uc9c1\uc5ec \uc6d0\uce59\uc744 \uba74\uc81c\ud558\uac8c \ub9cc\ub4e4 \ub9cc\ud07c \uac15\ub825\ud558\uace0 \uc124\ub4dd\ub825 \uc788\ub294 \uc0ac\uc815(so powerful, forceful or convincing)\uc744 \ub73b\ud55c\ub2e4\uace0 \uc815\uc758\ud588\uc5b4\uc694. \uc65c \uc9c4\uc2e4\ud55c \ubd80\ubd80 \uad00\uacc4\ub9cc\uc73c\ub85c\ub294 \uc548 \ub420\uae4c\uc694? \uc9c4\uc815\ud55c \ud63c\uc778\u00b7\uc0ac\uc2e4\ud63c \uad00\uacc4\ub294 \uc77c\ubc18 \uc2e0\uccad\uc790 \ubaa8\ub450\uac00 \uac16\ucdb0\uc57c \ud560 \uae30\ubcf8 \ucd9c\ubc1c\uc120\uc774\uae30 \ub54c\ubb38\uc774\uc5d0\uc694. \ub0a8\ub4e4\ub3c4 \ub2e4 \uac16\ucd94\ub294 \uae30\ubcf8 \uc694\uac74\uc744 \uc608\uc678 \ud2b9\ud61c \uc0ac\uc720\ub85c \uccd0\uc904 \uc218\ub294 \uc5c6\uc796\uc544\uc694. \ubcf8\uad6d\uc73c\ub85c \ub098\uac00 \uad6d\uc678 309 \ube44\uc790\ub97c \uae30\ub2e4\ub9ac\ub294 \ub3d9\uc548 \uacaa\uc744 \ud3c9\ubc94\ud55c \uadf8\ub9ac\uc6c0\uc774\ub098 \uc774\uc0ac \ube44\uc6a9 \ubd80\ub2f4\ub9cc \ud638\uc18c\ud574\uc11c\ub294 Schedule 3\uc758 \ubcbd\uc744 \ub118\uc9c0 \ubabb\ud574\uc694.<\/p>\n<h2 id=\"\uc811\uc218-\uc774\ud6c4-\ud0dc\uc5b4\ub09c-\uc790\ub140\uc640-\ud6c4\ubc1c\uc801-\uc0ac\uc815\uc758-\ud798-waensila-\uc804\uc6d0\uc7ac\ud310\ubd80-\ud310\uacb0\" class=\"doc-h2\">\uc811\uc218 \uc774\ud6c4 \ud0dc\uc5b4\ub09c \uc790\ub140\uc640 \ud6c4\ubc1c\uc801 \uc0ac\uc815\uc758 \ud798: Waensila \uc804\uc6d0\uc7ac\ud310\ubd80 \ud310\uacb0<\/h2>\n<p class=\"doc-p\">\uadf8\ub807\ub2e4\uba74 \uc5b4\ub5a4 \uc0ac\uc815\uc774 \uc788\uc5b4\uc57c \ub3cc\ud30c\ud560 \uc218 \uc788\uc744\uae4c\uc694? \uc811\uc218 \ub2f9\uc2dc\uc5d0\ub294 \uc0ac\uc720\uac00 \uc57d\ud588\ub294\ub370 \ub300\uae30 \uc911\uc5d0 \ud070 \ubcc0\ud654\uac00 \uc0dd\uacbc\ub2e4\uba74 \uc5b4\ub5a8\uae4c\uc694? \uc774 \ubb3c\uc74c\uc5d0 \uc804\ud658\uc810\uc744 \ucc0d\uc740 \ud310\ub840\uac00 \uc5f0\ubc29\ud56d\uc18c\ubc95\uc6d0 \uc804\uc6d0\uc7ac\ud310\ubd80\uc758 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCAFC/2016/32.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Waensila v Minister for Immigration and Border Protection<\/em> [2016] FCAFC 32<\/a> \ud310\uacb0\uc774\uc5d0\uc694. \uc608\uc804 \ub0b4\ubb34\ubd80\ub294 \uc2e0\uccad\uc77c(time of application) \ub2f9\uc2dc\uc5d0 \uc788\ub358 \uc0ac\uc720\ub9cc \ubcf4\uace0 \uadf8 \ub4a4\uc758 \ubcc0\ud654\ub294 \uc798\ub77c\ub0b4\uace4 \ud588\uc5b4\uc694.<\/p>\n<p class=\"doc-p\">\uc5f0\ubc29\ud56d\uc18c\ubc95\uc6d0\uc740 \uc804\uc6d0\uc77c\uce58\ub85c \uc774 \uc881\uc740 \ud574\uc11d\uc744 \ub4a4\uc9d1\uc5c8\uc5b4\uc694. \uba74\uc81c \ud310\ub2e8\uc740 \uc2e0\uccad\uc77c\uc5d0 \uc5bc\uc5b4\ubd99\uc5b4 \uc788\uc9c0 \uc54a\ub2e4\ub294 \uacb0\ub860\uc774\uc5c8\uc8e0. \ub0b4\ubb34\ubd80 \uc2ec\uc0ac\uad00\uacfc \uc7ac\uc2ec\uae30\uad00(ART) \ubaa8\ub450 \ucd5c\uc885 \uacb0\uc815 \uc2dc\uc810(time of decision)\uae4c\uc9c0 \ubc1c\uc0dd\ud55c \ubaa8\ub4e0 \uc0ac\uc815\uc744 \uc885\ud569 \ud3c9\uac00\ud574\uc57c \ud55c\ub2e4\uace0 \ud310\uc2dc\ud588\uc5b4\uc694. \uc774 \ubc95\ub9ac\uac00 \ud604\uc7a5\uc5d0\uc11c \ubc1c\ud718\ud558\ub294 \uc704\ub825\uc740 \ub300\ub2e8\ud574\uc694. \ud638\uc8fc \uc2dc\ubbfc\uad8c\uc790 \uacf5\ub3d9 \uc790\ub140\uc758 \ucd9c\uc0b0\uacfc \ub3cc\ubd04 \uacf5\ubc31\uc774 \ub300\ud45c\uc801\uc774\uc5d0\uc694. \ud638\uc8fc\uc778 \uc2a4\ud3f0\uc11c \ubc30\uc6b0\uc790\uc758 \uc911\uc99d \uc9c8\ud658\uc774\ub098 \uc784\uc0c1\uc801\uc73c\ub85c \ud655\uc778\ub41c \uc815\uc2e0\uac74\uac15 \uc545\ud654\ub85c \uc0c1\uc2dc \uac04\ubcd1\uc774 \ud544\uc694\ud574\uc9c4 \uc0ac\uc815\ub3c4 \ub9c8\ucc2c\uac00\uc9c0\uc8e0. \ubcf8\uad6d\uc758 \uce58\uc548 \uc704\ud611\ucc98\ub7fc \uc2e0\uccad\uc778\uc758 \ucd9c\uad6d\uc774 \ud638\uc8fc\uc778 \uac00\uc871\uc5d0\uac8c \ub3cc\uc774\ud0ac \uc218 \uc5c6\ub294 \ud0c0\uaca9\uc744 \uc900\ub2e4\ub294 \uac1d\uad00\uc801 \uc99d\uac70\uac00 \uc313\uc77c\uc218\ub85d \uba74\uc81c \uc2b9\uc0b0\uc774 \uc62c\ub77c\uac00\uc694.<\/p>\n<h2 id=\"\ube0c\ub9ac\uc9d5\ube44\uc790-ce\uc758-\ucd9c\uad6d\ucde8\uc5c5-\uc81c\ud55c-\ud568\uc815\uacfc-\uc548\uc804\ud55c-\uc811\uc218-\uc124\uacc4\" class=\"doc-h2\">\ube0c\ub9ac\uc9d5\ube44\uc790 C\u00b7E\uc758 \ucd9c\uad6d\u00b7\ucde8\uc5c5 \uc81c\ud55c \ud568\uc815\uacfc \uc548\uc804\ud55c \uc811\uc218 \uc124\uacc4<\/h2>\n<p class=\"doc-p\">\uad6d\ub0b4 \uc811\uc218\ub97c \uac10\ud589\ud558\uae30 \uc804\uc5d0 \ud604\uc2e4 \uc81c\uc57d\ub3c4 \uaf2d \ub530\uc838 \ubcf4\uc138\uc694. \uc2e4\uc9c8\ube44\uc790 \uc5c6\uc774 820\uc744 \ub123\uc73c\uba74 \ud1b5\uc0c1 Bridging Visa C (BVC) \ub610\ub294 Bridging Visa E (BVE)\uac00 \uc5f0\uacb0\ub3fc\uc694. \uc774 \ube44\uc790\ub4e4\uc740 \ud574\uc678\uc5ec\ud589\uc6a9 Bridging Visa B (BVB) \ubc1c\uae09\uc774 \uc6d0\ucc9c \ucc28\ub2e8\ub3fc \uc788\uc5b4\uc694. \uc2ec\uc0ac \uc911 \uae09\ud55c \uc77c\ub85c \ucd9c\uad6d\ud558\ub294 \uc21c\uac04 \ube44\uc790\uac00 \uc18c\uba78\ud574 \uc7ac\uc785\uad6d \uae38\uc774 \ub9c9\ud788\uc8e0. \ucd08\uae30 \uadfc\ub85c \uc81c\ud55c \uc870\uac74\uc744 \ud480\ub824\uba74 \uc7ac\uc815\uc801 \uace4\uad81(financial hardship)\ub3c4 \ubcc4\ub3c4\ub85c \uc18c\uba85\ud558\uc154\uc57c \ud574\uc694.<\/p>\n<p class=\"doc-p\">\uc7a0\uae50 \ud574\uc678\uc5d0 \ub098\uac14\ub2e4 \uc624\uba74 \uae30\ub85d\uc774 \uae68\ub057\ud574\uc9c4\ub2e4\ub294 \uc18c\ubb38\uc744 \ubbff\uace0 \uc123\ubd88\ub9ac \uc6c0\uc9c1\uc774\uc9c0 \ub9c8\uc138\uc694. \uc0c1\ub2f4 \ud655\uc778\uc11c \ud55c \uc7a5\uc774\uba74 Schedule 3\uac00 \ud480\ub9b0\ub2e4\ub294 \ub9d0\ub3c4 \uc704\ud5d8\ud574\uc694. \ud55c \ubc88 \uac70\uc808 \uae30\ub85d\uc774 \ub0a8\uc73c\uba74 \ub2e4\uc74c \uc120\ud0dd\uc9c0\ub294 \ud6e8\uc52c \uc881\uc544\uc838\uc694. \uac70\uc808 \uc774\ub825, \uc624\ubc84\uc2a4\ud14c\uc774 \uae30\uac04, \uc2a4\ud3f0\uc11c \uac00\uc871\uc758 \uac74\uac15\u00b7\uc591\uc721 \uc0ac\uc815\uc774 \uc5bd\ud78c \ubcf5\uc7a1\ud55c \ud30c\ud2b8\ub108\ube44\uc790 \uc0ac\uc548\uc77c\uc218\ub85d \ud638\uc8fc \ub0b4 820 \ub3cc\ud30c\uc640 \uad6d\uc678 309 \uc804\ub7b5 \uc911 \uc5b4\ub290 \ucabd\uc774 \uc720\ub9ac\ud55c\uc9c0 \uba3c\uc800 \ube44\uad50\ud574 \ubcf4\uc138\uc694. \uccb4\ub958 \uae30\ud55c\uc774 \uc9c0\ub0ac\uac70\ub098 \uac70\uc808 \uc9c1\ud6c4\ub77c\uba74 \ube44\uc790 \uae34\uae09 \ub300\uc751 \uc13c\ud130(<a href=\"https://parklawyers.com.au/case-emergency/visa/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ube44\uc790 \uac70\uc808\u00b7\uc624\ubc84\uc2a4\ud14c\uc774 \uae34\uae09 \uc811\uc218 \ud5c8\ube0c<\/a>)\ub97c \uc0b4\ud3b4\ubcf4\uc2dc\uace0 \ubc15\uc564\ucf54 \uc774\ubbfc\ubc95 \uc804\uc6a9 \uc628\ub77c\uc778 \uc9c8\ubb38\uc9c0(<a href=\"https://form.jotform.com/220391469091053\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ud30c\ud2b8\ub108\ube44\uc790 \ubc0f Schedule 3 \uc815\ubc00 \uc9c4\ub2e8 \uc811\uc218<\/a>) \ub610\ub294 \uacf5\uc2dd \ucc3d\uad6c(<a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ubc15\uc564\ucf54 \uacf5\uc2dd \ub9c1\ud06c \ud5c8\ube0c<\/a>)\ub85c \ud604\uc7ac \uccb4\ub958 \uc0c1\ud0dc\ub97c \ub0a8\uaca8 \uc8fc\uc138\uc694. \ub450 \ubd84\uc758 \uc77c\uc0c1\uc774 \ud754\ub4e4\ub9ac\uc9c0 \uc54a\ub3c4\ub85d \ud0c4\ud0c4\ud55c \ubc95\ub9ac \uc124\uacc4\ub97c \ub3c4\uc640\ub4dc\ub9b4\uac8c\uc694.<\/p>\n\n          <div class=\"col-sources-box\">\n            \uadfc\uac70 \ubc95\ub839 \ubc0f \ud310\ub840: Migration Act 1958 s 48 \u00b7 Migration Regulations 1994 reg 2.12, Sch 2 cl 820.211(2)(d)(ii), Sch 3 Criteria 3001, 3003, 3004 \u00b7 Waensila v MIBP [2016] FCAFC 32 \u00b7 Babicci v MIMIA [2005] FCAFC 77.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">QLS \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac \ub3c4\uc6c0\uc774 \uaf2d \ud544\uc694\ud55c \uc21c\uac04<\/span>\n            <h3 class=\"col-cta-title\">\uc774\ubbfc\uc131 \uc18c\uba85 \uc694\uccad(s 57)\u00b7\ube44\uc790 \ucde8\uc18c \ud1b5\uc9c0(NOICC)\u00b7ART \uc7ac\uc2ec \ub9c8\uac10 \uae30\ud55c\uc774 \ud750\ub974\uace0 \uc788\uac70\ub098 \ud68c\uc0ac \uc2a4\ud3f0\uc11c\uc2ed\uc744 \uc900\ube44 \uc911\uc774\uc2e0\uac00\uc694?<\/h3>\n            <p class=\"col-cta-desc\">\uc774\ubbfc\uc131 \ub2f5\ubcc0 \uae30\ud55c\uacfc ART \uc7ac\uc2ec \uc811\uc218 \uae30\ud55c\uc740 \ub2e8 \ud558\ub8e8\ub3c4 \ub2a6\ucd9c \uc218 \uc5c6\uc5b4\uc694. \ubc1b\uc73c\uc2e0 \ud1b5\uc9c0\ubb38(Decision Record / s 57 / NOICC)\uc774\ub098 \ud68c\uc0ac \uc2a4\ud3f0\uc11c\uc2ed \ub0b4\uc6a9\uc744 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\uc5d0 \uc62c\ub824 \uc8fc\uc2dc\uba74 \ud574\uacb0 \ubc29\ud5a5\uc744 \ube60\ub974\uac8c \uc9da\uc5b4 \ub4dc\ub824\uc694.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/220391469091053\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">\uc774\ubbfc\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../files/KO/PDF/01_Immigration_Self_Diagnosis_and_Official_Forms_Manual_2026_KO.pdf\" download class=\"col-btn-ghost\">01 \ube44\uc790 \uc11c\ub958\u00b7\uc18c\uba85 \uc810\uac80 \uc694\uc57d PDF \ubc1b\uae30<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">\ubc15\uc564\ucf54 \uacf5\uc2dd \uc0c1\ub2f4 \ub9c1\ud06c \ud5c8\ube0c<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">\ubc95\ub960 \uc548\ub0b4: \uc774 \uce7c\ub7fc\uc740 \ud638\uc8fc \uc774\ubbfc\ubc95(Migration Act 1958), \uc774\ubbfc\uaddc\uc815, \uc7a5\uad00\ud6c8\ub839 \uc81c123\ud638\uc640 \ubc95\uc6d0 \ud310\ub840\ub97c \ubc14\ud0d5\uc73c\ub85c \uc54c\uae30 \uc27d\uac8c \uc815\ub9ac\ud55c \uc77c\ubc18 \ubc95\ub960 \uc815\ubcf4\uc608\uc694. \uac1c\ubcc4 \uc0ac\uac74\uc5d0 \ub300\ud55c \ubc95\ub960 \uc790\ubb38\uc774\ub098 \uc218\uc784 \uacc4\uc57d \uc131\ub9bd\uc744 \ub73b\ud558\uc9c0 \uc54a\uc73c\ub2c8 \ube44\uc790 \ub9cc\ub8cc\uc77c\uc774\ub098 \uc7ac\uc2ec \ub9c8\uac10\uc77c \uc804\uc5d0 \uaf2d \uc804\ubb38\ubcc0\ud638\uc0ac\uc758 \uc9c4\ub2e8\uc744 \ubc1b\uc544 \ubcf4\uc138\uc694.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">\ud568\uaed8 \uc77d\uc73c\uba74 \uc88b\uc740 \uc774\ubbfc\ubc95 \ud310\ub840 \uce7c\ub7fc<\/h3>\n        <a href=\"../../?lang=ko&amp;tab=immigration\" class=\"col-back-link num\">\u2190 \ube44\uc790\u00b7\uc774\ubbfc \uc140\ud504 \uac00\uc774\ub4dc\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../pic-4020-s57-bogus-documents-withdrawal/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PIC 4020 \uc18c\uba85 \u00b7 \uc774\ubbfc\ubc95 \uce7c\ub7fc 09<\/span><h4 class=\"col-sib-title\">PIC 4020 \uc18c\uba85 \ub808\ud130(s 57)\ub97c \ubc1b\uc558\uc744 \ub54c \ube44\uc790\ub9cc \ucde8\ud558\ud558\uba74 3\ub144 \uc785\uad6d\uae08\uc9c0\ub97c \ud53c\ud560 \uc218 \uc788\uc744\uae4c<\/h4><p class=\"col-sib-desc\">\uc608\uc804 \ub300\ud589\uc0ac \uc2e4\uc218\ub098 \uacbd\ub825\uc11c\ub958 \ubb38\uc81c\ub85c \uc18c\uba85 \uc694\uad6c(s 57)\ub97c \ubc1b\uc558\uc744 \ub54c \ub35c\ucee5 \ube44\uc790\ubd80\ud130 \ucde8\uc18c(\ucde8\ud558)\ud558\uba74 \uc65c \ube0c\ub9ac\uc9d5\ube44\uc790\uac00 \ub04a\uae30\uace0 \uc758\uc2ec \uae30\ub85d\ub9cc \ub0a8\ub294\uc9c0 \uc54c\ub824\ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../noicc-visa-cancellation-direction-123/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ube44\uc790\ucde8\uc18c\u00b7\ud6c8\ub839 123\ud638 \u00b7 \uc774\ubbfc\ubc95 \uce7c\ub7fc 10<\/span><h4 class=\"col-sib-title\">\uc720\uc8c4 \ud310\uacb0 \uc804 \uae30\uc18c\ub9cc\uc73c\ub85c \ube44\uc790 \ucde8\uc18c \uc608\uace0(NOICC)\uac00 \uc624\ub294 \uc774\uc720\uc640 2026\ub144 10\uc6d4 \uc7a5\uad00\ud6c8\ub839 \uc81c123\ud638 \uae34\uae09 \ubd84\uc11d<\/h4><p class=\"col-sib-desc\">\uacbd\ucc30 \uc870\uc0ac\ub97c \ubc1b\uc740 \uc9c1\ud6c4 \ub0a0\uc544\uc628 \ube44\uc790 \ucde8\uc18c \uc608\uace0\uc7a5(NOICC)\uc5d0 \uc123\ubd88\ub9ac \ubc18\uc131\ubb38\ubd80\ud130 \ub0b4\uba74 \uc65c \ud615\uc0ac \uc7ac\ud310\uacfc \ube44\uc790 \ubaa8\ub450 \uc704\ud5d8\ud574\uc9c0\ub294\uc9c0 \ucd5c\uc2e0 \uc7a5\uad00\ud6c8\ub839 123\ud638 \uae30\uc900\uc73c\ub85c \uc124\uba85\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../corporate-nomination-genuine-position-csit/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uae30\uc5c5\uc2a4\ud3f0\uc11c \ub178\ubbf8\ub124\uc774\uc158 \u00b7 \uc774\ubbfc\ubc95 \uce7c\ub7fc 11<\/span><h4 class=\"col-sib-title\">\ucd5c\uc800\uc5f0\ubd09 $79,423(CSIT)\ub9cc \ub9de\ucd94\uba74 \ub05d\uc77c\uae4c: SID 482\u00b7186 \ub178\ubbf8\ub124\uc774\uc158 \uac70\uc808 1\uc704 &#x27;\uc9c4\uc815\ud55c \uc9c1\uc704&#x27;\uc640 ABN \ubcc0\uacbd\uc758 \ub36b<\/h4><p class=\"col-sib-desc\">\uc218\ucc9c \ub2ec\ub7ec \ud6c8\ub828\ubd80\ub2f4\uae08(SAF)\uc744 \ub0a0\ub9ac\uc9c0 \uc54a\uc73c\ub824\uba74 \uc811\uc218 \uc804 \ubb34\uc5c7\uc744 \ubd10\uc57c \ud560\uae4c\uc694? \ud68c\uc0ac \ub9e4\ucd9c \uaddc\ubaa8\uc640 \uc870\uc9c1\ub3c4 \uc810\uac80\ubd80\ud130 ABN \ubcc0\uacbd \ub54c \uc0dd\uae30\ub294 \ud568\uc815\uae4c\uc9c0 \uc27d\uac8c \ud480\uc5b4 \ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../art-merits-review-pic-4007-health-waiver/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ART \uc7ac\uc2ec\u00b7\uac74\uac15\uc694\uac74 \u00b7 \uc774\ubbfc\ubc95 \uce7c\ub7fc 13<\/span><h4 class=\"col-sib-title\">\ube44\uc790 \uac70\uc808 \ud6c4 \ud589\uc815\uc7ac\uc2ec\uc6d0(ART) \uc2b9\uc18c \uc804\ub7b5\uacfc $86,000 \uac74\uac15 \uc694\uac74(PIC 4007) \uba74\uc81c \ub3cc\ud30c\ubc95<\/h4><p class=\"col-sib-desc\">\ucc98\uc74c \ub0c8\ub358 \uc11c\ub958\ub9cc \ub2e4\uc2dc \ub0b4\ub2e4 \uc7ac\uc2ec\uc5d0\uc11c \uc9c0\ub294 \uc2e4\uc218\ub97c \ub9c9\uc544 \ub4dc\ub824\uc694. \uc790\ub140 \ubc1c\ub2ec\uc9c0\uc5f0\uc774\ub098 \ub9cc\uc131\uc9c8\ud658\uc73c\ub85c $86,000 \ucd08\uacfc \ud310\uc815\uc744 \ubc1b\uc558\uc744 \ub54c \ub3cc\ud30c\ud558\ub294 2\ub2e8\uacc4 \ud574\ubc95\uc744 \uc815\ub9ac\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}, "en": {"doc_title": "Lodging an Onshore Partner Visa After Refusal or Overstay: Section 48 Bars and Schedule 3 Waivers \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">All Guides Hub<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=en\">Visa Solution Guide<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=en\">Employment Navigator<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=en\">DIY & Cost-Smart Guide<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\">Consult Park & Co \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=en&amp;tab=immigration\" class=\"col-back-btn\">\u2190 Back to Immigration Self-Help Hub<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">Park &amp; Co Lawyers \u00b7 Accredited Specialist Immigration Column<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn\">KO<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn active\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/220391121528851\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">Consult Park &amp; Co \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">SECTION 48 &amp; SCHEDULE 3 \u00b7 IMMIGRATION 12<\/span>\n          <span class=\"col-verified-pill num\">QLS Accredited Specialist Verified (Nov 2026)<\/span>\n          <span class=\"col-time-pill num\">8 min read<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">Lodging an Onshore Partner Visa After Refusal or Overstay: Section 48 Bars and Schedule 3 Waivers<\/h1>\n        <p class=\"col-subtitle\">Clearing reg 2.12 validity gates, proving &#x27;compelling reasons&#x27; under Babicci, leveraging post-lodgement facts under Waensila, and weighing Subclass 309<\/p>\n\n        <div class=\"col-byline\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">Chang Min Park<\/div>\n            <div class=\"col-author-role\">Legal Practitioner Director, Park &amp; Co Lawyers \u00b7 Accredited Specialist in Immigration Law (QLS)<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col12_immi_sch3_hero.jpg\" alt=\"Lodging an Onshore Partner Visa After Refusal or Overstay: Section 48 Bars and Schedule 3 Waivers\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">While Partner Subclass 820 is an exception to the s 48 bar, applicants without a substantive visa for over 28 days face strict Schedule 3 scrutiny unless compelling reasons are proven.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">28 Calendar Days<\/div><div class=\"col-stat-lbl\">Criterion 3001 window after last substantive visa ceases<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">Up-to-Decision Scope<\/div><div class=\"col-stat-lbl\">Post-lodgement facts weighed under Waensila [2016] FCAFC 32<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">High &#x27;Compelling&#x27; Bar<\/div><div class=\"col-stat-lbl\">Forceful circumstances required beyond genuine marriage (Babicci)<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">In This Column<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#clearing-section-48-only-makes-the-partner-appli\" class=\"col-toc-link lvl-2\">Clearing Section 48 only makes the Partner application valid, not approvable<\/a><a href=\"#how-criteria-3001-3003-and-3004-trap-bridging-vi\" class=\"col-toc-link lvl-2\">How Criteria 3001, 3003 and 3004 trap Bridging Visa holders and overstayers<\/a><a href=\"#compelling-reasons-under-babicci-and-post-lodgem\" class=\"col-toc-link lvl-2\">Compelling reasons under Babicci and post-lodgement evidence after Waensila<\/a><a href=\"#bridging-visa-c-and-e-traps-work-bans-travel-loc\" class=\"col-toc-link lvl-2\">Bridging Visa C and E traps: work bans, travel locks and when offshore 309 wins<\/a><a href=\"#building-a-schedule-3-waiver-record-before-you-l\" class=\"col-toc-link lvl-2\">Building a Schedule 3 waiver record before you lodge or face a delegate invitation<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/220391121528851\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">Open Immigration Consultation Form<\/a>\n              <a href=\"../../?lang=en&amp;tab=immigration\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 Back to Immigration Self-Help Hub<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">Couples where one partner holds a Bridging Visa after an earlier Student, Graduate, or Skilled visa refusal, or has stayed in Australia unlawfully after a visa expired, regularly hear a comforting half-truth about the onshore Partner Visa (Subclass 820/801). Friends point out that Partner visas sit on the statutory exception list to Section 48, convincing the couple to pay the multi-thousand-dollar government visa charge on the assumption that a marriage certificate will secure residency onshore. Months later, a natural justice letter arrives warning of mandatory refusal under Schedule 3 unless the couple proves &quot;compelling reasons&quot; for waiving Criteria 3001, 3003 and 3004.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 366\" width=\"100%\" role=\"img\" aria-label=\"Three Legal Gateways for Onshore Subclass 820 After Refusal or Overstay\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"365\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">ONSHORE PARTNER VISA (820/801) \u00b7 s 48 &amp; SCHEDULE 3<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">Three Legal Gateways for Onshore Subclass 820 After Refusal or Overstay<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">Authorities: Migration Act s 48 \u00b7 Reg 2.12 \u00b7 cl 820.211(2)(d)(ii) \u00b7 Waensila [2016] FCAFC 32 \u00b7 Babicci [2005] FCAFC 77<\/text>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"36\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">STEP 01 \u00b7 VALIDITY GATE<\/text>\n  <text x=\"36\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">Clearing the Section 48 Bar<\/text>\n  <text x=\"36\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E5F\">Migration Act s 48 \u00b7 Reg 2.12<\/text>\n  <line x1=\"36\" y1=\"182\" x2=\"272\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">s 48 bars most onshore visas after refusal<\/text>\n  <text x=\"36\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Subclass 820/801 sits on reg 2.12 list<\/text>\n  <text x=\"36\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Must check prior partner refusal bars<\/text>\n  <text x=\"36\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Invalid lodgement leaves no Bridging Visa<\/text>\n  <line x1=\"289\" y1=\"195\" x2=\"300\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"303,195 297,191 297,199\" fill=\"#1F242B\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"320\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">STEP 02 \u00b7 SCHEDULE 3 TRAP<\/text>\n  <text x=\"320\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">Substantive Expiry &gt;28 Days<\/text>\n  <text x=\"320\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\">Schedule 3 Criteria 3001, 3003, 3004<\/text>\n  <line x1=\"320\" y1=\"182\" x2=\"556\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"320\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">BVA/BVB/BVC or unlawful status triggers Sch 3<\/text>\n  <text x=\"320\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Genuine marriage alone NEVER waives Sch 3<\/text>\n  <text x=\"320\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Routine offshore inconvenience fails (Babicci)<\/text>\n  <text x=\"320\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Requires forceful &#x27;compelling reasons&#x27;<\/text>\n  <line x1=\"573\" y1=\"195\" x2=\"584\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"587,195 581,191 581,199\" fill=\"#1F242B\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1.3\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#1D6B48\"/>\n  <text x=\"604\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">STEP 03 \u00b7 WAENSILA DOCTRINE<\/text>\n  <text x=\"604\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">Up-to-Decision Evidence<\/text>\n  <text x=\"604\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#1D6B48\">Waensila [2016] FCAFC 32<\/text>\n  <line x1=\"604\" y1=\"182\" x2=\"840\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"604\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">Waiver NOT frozen at date of application<\/text>\n  <text x=\"604\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Weighs all facts up to decision / ART review<\/text>\n  <text x=\"604\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">AU citizen child birth, illness, care needs<\/text>\n  <text x=\"604\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Backed by clinical &amp; specialist submissions<\/text>\n  <rect x=\"22\" y=\"312\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#FEF8EC\" stroke=\"#ECD9B0\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"335\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">Practice Rule: Emotional love letters fail Schedule 3. Build objective clinical, child-welfare &amp; hardship evidence under Waensila.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 1: Clearing Section 48 Validity Gates and Proving Compelling Reasons Under Schedule 3<\/figcaption><\/figure>\n<h2 id=\"clearing-section-48-only-makes-the-partner-appli\" class=\"doc-h2\">Clearing Section 48 only makes the Partner application valid, not approvable<\/h2>\n<p class=\"doc-p\">Australian migration law draws a sharp line between application validity (getting through the ImmiAccount front door) and substantive grant criteria (winning the visa). Under s 48 of the <em>Migration Act 1958<\/em> (Cth), a non-citizen in Australia who does not hold a substantive visa (remembering that Bridging Visas A, B, C and E are non-substantive) and who has had a visa refused or cancelled since last entering Australia is barred from lodging most onshore visas.<\/p>\n<p class=\"doc-p\">Regulation 2.12(1)(a) of the <em>Migration Regulations 1994<\/em> (Cth) prescribes Subclass 820/801 as an exception class to s 48, provided strict Schedule 1 Item 1124B sponsorship and form rules are met and the applicant has no prior onshore Partner refusal since last entry or character s 501 bar. Passing s 48, however, simply means the Department accepts your filing and keeps your fee. Because you lodged without holding a substantive visa, your file immediately hits cl 820.211(2)(d)(ii) and Schedule 3.<\/p>\n<h2 id=\"how-criteria-3001-3003-and-3004-trap-bridging-vi\" class=\"doc-h2\">How Criteria 3001, 3003 and 3004 trap Bridging Visa holders and overstayers<\/h2>\n<p class=\"doc-p\">Under cl 820.211(2)(d)(ii), an onshore Partner applicant who lacks a substantive visa must satisfy Schedule 3 Criteria 3001, 3003 and 3004, unless the Minister is satisfied that there are compelling reasons for not applying those criteria.<\/p>\n<p class=\"doc-p\">Criterion 3001 requires valid lodgement within 28 calendar days after the &quot;relevant day&quot;, usually the last day the applicant held a substantive Student, Visitor, Working Holiday, or 482 visa. Anyone who appealed an earlier refusal to the Administrative Review Tribunal (ART) and spent a year or two on a Bridging Visa A (BVA) is already far beyond that 28-day limit. Even inside 28 days, Criterion 3004 requires proving that you ceased to hold a substantive visa because of factors beyond your control. Overlooking an expiry date or failing an English test rarely qualifies as beyond your control, pushing nearly every long-term Bridging Visa holder or overstayer onto the compelling-reasons waiver.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">Applicant&#x27;s Onshore Status at Lodgement<\/th><th style=\"text-align:left\">Section 48 Bar &amp; Validity<\/th><th style=\"text-align:left\">Schedule 3 Impact &amp; Bridging Visa Consequences<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Holds Current Substantive Visa<\/strong> (no 8503 No Further Stay)<\/td><td style=\"text-align:left\">s 48 inapplicable; valid 820/801 filing<\/td><td style=\"text-align:left\">Schedule 3 inapplicable; receives Bridging Visa A (BVA) with full work rights and BVB travel eligibility<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Holds BVA/BVC &gt;28 Days Post-Substantive Expiry, No Refusal<\/strong><\/td><td style=\"text-align:left\">s 48 inapplicable; valid 820/801 filing<\/td><td style=\"text-align:left\">Fails Criterion 3001; must win Schedule 3 waiver; granted Bridging Visa C (BVC) with zero BVB travel rights<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Prior Onshore Refusal + Holds BVA/BVC or Unlawful (&gt;28 Days)<\/strong><\/td><td style=\"text-align:left\">Exempt from s 48 under reg 2.12 (subject to Item 1124B rules)<\/td><td style=\"text-align:left\">Fails Criterion 3001 &amp; 3004; must win Schedule 3 waiver; granted BVC with initial 8101 no-work ban (or BVE if unlawful)<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Prior Character (s 501) Action or Prior Partner Refusal Since Entry<\/strong><\/td><td style=\"text-align:left\">Invalid onshore filing barred by s 48 / s 501E / Item 1124B<\/td><td style=\"text-align:left\">Cannot lodge 820 onshore; requires offshore strategy or specialist judicial review assessment<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Voluntary Departure &amp; Offshore Subclass 309/100 Lodgement<\/strong><\/td><td style=\"text-align:left\">s 48 ends on departure; valid offshore filing<\/td><td style=\"text-align:left\">Bypasses Schedule 3 completely (and avoids PIC 4014 3-yr ban if departing on BVA/BVB/BVC or within 28 days of expiry)<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"compelling-reasons-under-babicci-and-post-lodgem\" class=\"doc-h2\">Compelling reasons under Babicci and post-lodgement evidence after Waensila<\/h2>\n<p class=\"doc-p\">Two Full Federal Court authorities govern every Schedule 3 submission. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCAFC/2005/77.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Babicci v Minister for Immigration &amp; Multicultural &amp; Indigenous Affairs<\/em> [2005] FCAFC 77<\/a> ([21]-[24]), the Court defined &quot;compelling&quot; circumstances as matters so powerful, forceful, or convincing that they move the decision-maker to waive the requirement. Because a genuine married or de facto relationship (s 5F / s 5CB) is already mandatory for every Partner visa, relying solely on genuine affection, joint leases, or the ordinary stress and airfare cost of departing to lodge an offshore Subclass 309 fails <em>Babicci<\/em> routinely.<\/p>\n<p class=\"doc-p\">The timeline for proving compelling reasons widened substantially in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCAFC/2016/32.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Waensila v Minister for Immigration and Border Protection<\/em> [2016] FCAFC 32<\/a>. Overturning years of restrictive policy that froze Schedule 3 waivers at the application date, the Full Court held unanimously that delegates and the ART must consider compelling circumstances existing right up to the time of decision. The post-lodgement birth of an Australian citizen child, high-risk pregnancy, an Australian sponsor&#x27;s documented medical or psychiatric dependency on the applicant&#x27;s daily care, or acute safety risks abroad must all be weighed at decision date when backed by specialist clinical and financial evidence.<\/p>\n<h2 id=\"bridging-visa-c-and-e-traps-work-bans-travel-loc\" class=\"doc-h2\">Bridging Visa C and E traps: work bans, travel locks and when offshore 309 wins<\/h2>\n<p class=\"doc-p\">Lodging onshore without mapping Bridging Visa rules creates years of hidden strain. Applying for a Subclass 820 from a BVA or BVC issues a Bridging Visa C (BVC), while lodging from unlawful status yields a Bridging Visa E (BVE). Neither a BVC nor a BVE can ever step up to a Bridging Visa B (BVB), locking the applicant inside Australia with zero international travel rights until final decision. An s 48-barred 820 filing also attaches Condition 8101 (No Work) to the BVC unless financial hardship is separately proved. For couples without children or acute care needs, departing voluntarily on a Bridging Visa (avoiding a PIC 4014 re-entry ban) to lodge an offshore Subclass 309/100 (which can now be granted onshore under cl 309.412 if returning on a Visitor visa) is often cleaner and safer than fighting a thin Schedule 3 case.<\/p>\n<h2 id=\"building-a-schedule-3-waiver-record-before-you-l\" class=\"doc-h2\">Building a Schedule 3 waiver record before you lodge or face a delegate invitation<\/h2>\n<p class=\"doc-p\">Before paying the Partner Visa fee from a Bridging Visa or overstay, or as soon as a Schedule 3 natural justice letter arrives, submit your visa history, last substantive expiry date, and household circumstances via the <a href=\"https://form.jotform.com/220391121528851\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Immigration Consultation Form<\/a> or visit the <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Official Links Hub<\/a> so an Accredited Specialist in Immigration Law (QLS) can compare a <em>Waensila<\/em>-grade Schedule 3 waiver against an offshore Subclass 309 strategy.<\/p>\n\n          <div class=\"col-sources-box\">\n            Primary Authorities: Migration Act 1958 (Cth) s 48 \u00b7 Migration Regulations 1994 reg 2.12, Sch 2 cl 820.211(2)(d)(ii), Sch 3 Criteria 3001, 3003, 3004 \u00b7 Waensila v MIBP [2016] FCAFC 32 \u00b7 Babicci v MIMIA [2005] FCAFC 77.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">WHEN TO CONSULT A QLS ACCREDITED SPECIALIST<\/span>\n            <h3 class=\"col-cta-title\">Facing an Urgent s 57 / NOICC / ART Deadline or Planning Corporate Sponsorship?<\/h3>\n            <p class=\"col-cta-desc\">Departmental response windows and ART review deadlines carry zero extension discretion. Attach your notice or corporate sponsorship details via our online consultation form for prompt specialist assessment.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/220391121528851\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">Open Immigration Consultation Form<\/a>\n              <a href=\"../../files/EN/PDF/01_Immigration_Self_Diagnosis_and_Official_Forms_Manual_2026_EN.pdf\" download class=\"col-btn-ghost\">Download Manual 01 (Immigration PDF)<\/a>\n              <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">Park &amp; Co Official Consultation Hub<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">Legal Disclaimer: This publication provides general legal information grounded in the Migration Act 1958 (Cth), Migration Regulations 1994, Ministerial Direction No. 123 and Federal Court authorities current as at November 2026. It does not constitute legal advice or create a solicitor-client relationship.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">More Curated Immigration Law Columns<\/h3>\n        <a href=\"../../?lang=en&amp;tab=immigration\" class=\"col-back-link num\">\u2190 Back to Immigration Self-Help Hub<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../pic-4020-s57-bogus-documents-withdrawal/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">PIC 4020 &amp; INTEGRITY \u00b7 IMMIGRATION 09<\/span><h4 class=\"col-sib-title\">Received an s 57 Natural Justice Letter Over PIC 4020? Why Withdrawing Will Not Erase the Risk<\/h4><p class=\"col-sib-desc\">Examines purposeful falsity vs innocent mistake, skills assessment traps (Arora), why blind s 49 withdrawal backfires onshore, and Kaur waiver proof.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../noicc-visa-cancellation-direction-123/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">NOICC &amp; DIRECTION 123 \u00b7 IMMIGRATION 10<\/span><h4 class=\"col-sib-title\">NOICC Cancellations on Pending Charges and the 31 October 2026 Shift to Ministerial Direction 123<\/h4><p class=\"col-sib-desc\">Why untested police charges trigger s 116(1)(e) notices under Gong, how DIY apology letters prejudice criminal trials, and how to plead under Direction 123.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a><a href=\"../corporate-nomination-genuine-position-csit/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">CORPORATE SPONSORSHIP \u00b7 IMMIGRATION 11<\/span><h4 class=\"col-sib-title\">Why Employer Nominations Fail Despite Paying the $79,423 CSIT: Genuine Position Audits and ABN Restructures<\/h4><p class=\"col-sib-desc\">Protects Australian sponsors from non-refundable SAF levy losses across SID Subclass 482 and Subclass 186 ENS nominations, restructures and FWO/ATO audits.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../art-merits-review-pic-4007-health-waiver/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ART APPEALS &amp; HEALTH WAIVERS \u00b7 IMMIGRATION 13<\/span><h4 class=\"col-sib-title\">Winning at the Administrative Review Tribunal (ART) and Challenging $86,000 Health Refusals<\/h4><p class=\"col-sib-desc\">How to cure refusals on de novo review, dismantle inflated MOC special-education or pharmaceutical costings, and win PIC 4007 undue-cost health waivers.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}}</script>
  <script>
    (function () {
      const payload = JSON.parse(document.getElementById('col-payload').textContent);
      const root = document.getElementById('col-root');
      let cleanupScroll = null;

      function getLang() {
        const q = new URLSearchParams(window.location.search).get('lang');
        return q === 'en' ? 'en' : 'ko';
      }

      function bindTocSpy() {
        if (cleanupScroll) cleanupScroll();
        const links = Array.from(root.querySelectorAll('.col-toc-link'));
        if (!links.length) return;
        const targets = links
          .map((a) => document.getElementById(a.getAttribute('href').slice(1)))
          .filter(Boolean);
        function onScroll() {
          let activeIdx = 0;
          const offset = window.scrollY + 130;
          for (let i = 0; i < targets.length; i++) {
            if (targets[i].offsetTop <= offset) activeIdx = i;
          }
          links.forEach((a, idx) => a.classList.toggle('active', idx === activeIdx));
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        cleanupScroll = () => window.removeEventListener('scroll', onScroll);
        onScroll();
      }

      function render(lg) {
        const data = payload[lg] || payload.ko;
        document.documentElement.lang = lg;
        document.title = data.doc_title;
        root.innerHTML = data.html;
        root.querySelectorAll('[data-set-lang]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const next = btn.getAttribute('data-set-lang');
            const url = new URL(window.location.href);
            url.searchParams.set('lang', next);
            window.history.replaceState({}, '', url.toString());
            render(next);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });
        bindTocSpy();
      }

      render(getLang());
    })();
  </script>

(function () {

  /* 429-aware retry spanning >15s across retries to cleanly outlast Abacus 30;w=10 windows */
  function fetchRetry(url, isHit, attempt) {
    var tries = attempt || 0;
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 15000) : null;
    var opts = { mode: 'cors' };
    if (ctrl) opts.signal = ctrl.signal;
    if (isHit) opts.keepalive = true;
    return fetch(url, opts)
      .then(function (r) {
        if (timer) clearTimeout(timer);
        if (!isHit && r.status === 404) return { value: 0 };
        if (r.status === 429) {
          var err429 = new Error('HTTP 429');
          err429.isRateLimit = true;
          throw err429;
        }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (j) {
        if (typeof j.value !== 'number') throw new Error('bad payload');
        return j.value;
      })
      .catch(function (err) {
        if (timer) clearTimeout(timer);
        var maxTries = (err && err.isRateLimit) ? 3 : 2;
        if (tries < maxTries) {
          var waitMs = (err && err.isRateLimit) ? (3800 + tries * 3600) : (1100 * (tries + 1));
          return new Promise(function (res) { setTimeout(res, waitMs); })
            .then(function () { return fetchRetry(url, isHit, tries + 1); });
        }
        throw err;
      });
  }

      return head + '<p class="vc-ref-note">' +
        (isEn
          ? 'Anonymous referral channel buckets (Naver, Cafe, KakaoTalk, Threads, Hub, Direct) are recorded once per browser per day as new visits arrive (zero personal or URL path data stored).'
          : '익명 유입 경로(검색·카페·카카오톡·스레드·허브 이동 등) 집계는 신규 방문부터 하루 브라우저당 1회씩 기록돼요 (세부 URL·개인정보 미수집).') +
        '</p>';
    }
    var rowsHtml = items.map(function (item) {
      var pct = totalRef > 0 ? Math.round((item.count / totalRef) * 100) : 0;
      return '<div class="vc-ref-row">' +
        '<span class="vc-ref-name" title="' + item.label + '">' + item.label + '</span>' +
        '<div class="vc-ref-track"><div class="vc-ref-fill" style="width:' + Math.max(4, pct) + '%"></div></div>' +
        '<span class="vc-ref-val">' + fmt(item.count) + ' (' + pct + '%)</span>' +
        '</div>';
    }).join('');
    var note = isEn
      ? 'Privacy-safe coarse channel buckets only (1 per browser/day; zero IP, query string, or full referrer URL stored).'
      : '개인정보 보호형 채널 그룹 집계 (하루 브라우저당 1회 기준 &middot; 검색어·세부 URL·IP 미수집)';
    return head + '<div class="vc-ref-list">' + rowsHtml + '</div><p class="vc-ref-note">' + note + '</p>';
  }

  function loadHistoryRows(days) {
    var histCache = {};
    try { histCache = JSON.parse(localStorage.getItem(HIST_KEY) || '{}') || {}; } catch (e) {}
    var results = new Array(days.length);
    var pending = [];
    days.forEach(function (d, idx) {
      if (d < today && Array.isArray(histCache[d])) {
        results[idx] = histCache[d];
      } else if (d === today && typeof liveTodayViews === 'number' && typeof liveTodayVis === 'number') {
        results[idx] = [liveTodayViews, liveTodayVis];
      } else {
        pending.push({ d: d, idx: idx });
      }
    });

    var batchSize = pending.length > 7 ? 4 : 6;
    var pauseMs = pending.length > 7 ? 2900 : 180;
    var chain = Promise.resolve();
    for (var c = 0; c < pending.length; c += batchSize) {
      (function (slice, waitFirst) {
        chain = chain.then(function () {
          return (waitFirst ? delay(pauseMs) : Promise.resolve()).then(function () {
            return Promise.all(slice.map(function (item) {
              var k = item.d.replace(/-/g, '');
              var pViews = (item.d === today && typeof liveTodayViews === 'number')
                ? Promise.resolve(liveTodayViews)
                : call('get', 'day-' + k).catch(function () { return null; });
              var pVis = (item.d === today && typeof liveTodayVis === 'number')
                ? Promise.resolve(liveTodayVis)
                : call('get', 'vday-' + k).catch(function () { return null; });
              return Promise.all([pViews, pVis]).then(function (pair) {
                var v0 = pair[0] == null ? 0 : pair[0];
                var v1 = pair[1] == null ? 0 : pair[1];
                results[item.idx] = [v0, v1];
                if (item.d < today && pair[0] !== null && pair[1] !== null) {
                  histCache[item.d] = [v0, v1];
                }
              });
            }));
          });
        });
      })(pending.slice(c, c + batchSize), c > 0);
    }
    return chain.then(function () {
      try { localStorage.setItem(HIST_KEY, JSON.stringify(histCache)); } catch (e) {}
      return results.map(function (r) { return r || [0, 0]; });
    });
  }

  var cachedRefMap = null;

  function loadAndRenderModal(refreshRefs) {
    syncCounterLang();
    var isEn = uiLang() === 'en';
    var fullDays = lastDays(30);
    var days = activeRange === 7 ? lastDays(7) : fullDays;
    var body = modal.querySelector('.vc-body');
    var chartWaitMsg = isEn ? 'Loading daily statistics&hellip;' : '일별 통계를 불러오는 중이에요&hellip;';
    var refWaitMsg = isEn ? 'Loading today&rsquo;s referral channels&hellip;' : '오늘 유입 채널 집계를 불러오는 중이에요&hellip;';
    var existingRefHtml = (!refreshRefs && cachedRefMap) ? renderReferrerBox(cachedRefMap) : ('<div class="vc-ref-note">' + refWaitMsg + '</div>');

    /* Render toolbar, loading placeholder, referral box, and 1-click share bar IMMEDIATELY (0ms) */
    body.innerHTML = renderToolbar(isEn, fullDays.length) +
      '<div id="vc-chart-slot"><p class="vc-sum">' + chartWaitMsg + '</p></div>' +
      '<div id="vc-ref-box" class="vc-ref-box">' + existingRefHtml + '</div>' +
      renderShareBar(isEn);

    loadHistoryRows(days)
      .then(function (rows) {
        var slot = document.getElementById('vc-chart-slot');
        if (slot) slot.innerHTML = renderChartSvg(days, rows, uiLang() === 'en');
        if (!refreshRefs && cachedRefMap) return cachedRefMap;
        return delay(180).then(function () { return loadTodayReferrers(day); });
      })
      .then(function (refMap) {
        if (refMap) cachedRefMap = refMap;
        var refBox = document.getElementById('vc-ref-box');
        if (refBox && refMap) refBox.innerHTML = renderReferrerBox(refMap);
      })
      .catch(function () {
        var slot = document.getElementById('vc-chart-slot');
        if (slot && !slot.querySelector('svg')) {
          slot.textContent = uiLang() === 'en' ? 'Could not load the chart.' : '그래프를 불러오지 못했어요.';
        }
      });
  }

  function open() {
    activeRange = 7;
    modal.classList.add('open');
    loadAndRenderModal(true);
  }
  box.setAttribute('role', 'button');
  box.setAttribute('tabindex', '0');
  box.addEventListener('click', open);
  box.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
})();
  </script>
</body>
