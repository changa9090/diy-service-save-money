/assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">\ubc15\ucc3d\ubbfc \ub300\ud45c\ubcc0\ud638\uc0ac (Chang Min Park)<\/div>\n            <div class=\"col-author-role\">\ubc95\ubb34\ubc95\uc778 \ubc15\uc564\ucf54 \ub300\ud45c\ubcc0\ud638\uc0ac \u00b7 \ud638\uc8fc \ud038\uc990\ub79c\ub4dc\uc8fc \ubcc0\ud638\uc0ac\ud68c \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col06_emp_contractor_hero.jpg\" alt=\"ABN \ud504\ub9ac\ub79c\uc11c \uacc4\uc57d\uc11c \uc37c\uc73c\ub2c8 \uadfc\ub85c\uc790\uac00 \uc544\ub2c8\ub2e4? FWA s 15AA \uc2e4\uc9c8 \uc2ec\uc0ac\uc640 6\ub144 \uce58 \uc5f0\uae08\u00b7\uc218\ub2f9 \uc5ed\ucd94\uc9d5\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">\uc0c8\ub85c \ubc14\ub010 \uacf5\uc815\uadfc\ub85c\ubc95(s 15AA)\uc5d0\uc11c\ub294 \uacc4\uc57d\uc11c \uc81c\ubaa9\uc774 \ubb34\uc5c7\uc774\ub4e0 \uc2e4\uc81c\ub85c \ub204\uac00 \ucd9c\ud1f4\uadfc\uc744 \uc9c0\uc2dc\ud558\uace0 \uc0ac\uc5c5 \uc704\ud5d8\uc744 \ubd80\ub2f4\ud588\ub294\uc9c0\ub97c \ubcf4\uace0 \uc9c1\uc6d0 \uc5ec\ubd80\ub97c \ud310\ub2e8\ud574\uc694.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">$190,100 \uae30\uc900<\/div><div class=\"col-stat-lbl\">2026.7.1 \ub3c4\uae09 \uace0\uc18c\ub4dd \uae30\uc900\uc120 \u00b7 \ubbf8\ub9cc \uc2dc s 15AA \uc2e4\uc9c8 \uc2ec\uc0ac \uac15\ud589 \uc801\uc6a9<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">12% \uc5f0\uae08 \uc758\ubb34<\/div><div class=\"col-stat-lbl\">\uc9c4\uc815\ud55c \uac1c\uc778 ABN \ud504\ub9ac\ub79c\uc11c\ub3c4 \ub178\ubb34 \uc911\uc2ec \uacc4\uc57d\uc774\uba74 \ud1f4\uc9c1\uc5f0\uae08 \ubd80\uacfc (SGAA s 12(3))<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">\ud569\ub9ac\uc801 \ubbff\uc74c \uc785\uc99d<\/div><div class=\"col-stat-lbl\">\ub300\ud3ed \uac15\ud654\ub41c \uc704\uc7a5\ub3c4\uae09(s 357(2)) \uace0\uc6a9\uc8fc \uba74\ucc45 \uc785\uc99d \ubb38\ud131<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">\uc774 \uce7c\ub7fc\uc758 \ubaa9\ucc28<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#\ub300\ubc95\uc6d0-\uacc4\uc57d\uc11c-\uc9c0\uc0c1\uc8fc\uc758\ub97c-\ub4a4\uc9d1\uc740-fwa-s-15aa-\uc2e4\uc9c8-\uad00\uacc4-\uc2ec\uc0ac\" class=\"col-toc-link lvl-2\">\ub300\ubc95\uc6d0 \uacc4\uc57d\uc11c \uc9c0\uc0c1\uc8fc\uc758\ub97c \ub4a4\uc9d1\uc740 FWA s 15AA \uc2e4\uc9c8 \uad00\uacc4 \uc2ec\uc0ac<\/a><a href=\"#2026\ub144-7\uc6d4-190100-\uc18c\ub4dd-\uae30\uc900\uc120\uacfc-\uc5c7\uac08\ub9b0-\ucd5c\uc2e0-fwc-\ud310\uc815-\uc138-\uac74\" class=\"col-toc-link lvl-2\">2026\ub144 7\uc6d4 $190,100 \uc18c\ub4dd \uae30\uc900\uc120\uacfc \uc5c7\uac08\ub9b0 \ucd5c\uc2e0 FWC \ud310\uc815 \uc138 \uac74<\/a><a href=\"#\uae50\uae50\ud574\uc9c4-\uc704\uc7a5\ub3c4\uae09-\uba74\ucc45-\uc694\uac74s-3572\uacfc-\uc9c4\uc9dc-\ud504\ub9ac\ub79c\uc11c\uc5d0\uac8c\ub3c4-\ubd99\ub294-12-\ud1f4\uc9c1\uc5f0\uae08sgaa\" class=\"col-toc-link lvl-2\">\uae50\uae50\ud574\uc9c4 \uc704\uc7a5\ub3c4\uae09 \uba74\ucc45 \uc694\uac74(s 357(2))\uacfc \uc9c4\uc9dc \ud504\ub9ac\ub79c\uc11c\uc5d0\uac8c\ub3c4 \ubd99\ub294 12% \ud1f4\uc9c1\uc5f0\uae08(SGAA s 12(3))<\/a><a href=\"#6\ub144-\uce58-\uc5f0\ucc28\uc8fc\ub9d0\uc218\ub2f9\uc5f0\uae08-\uc5ed\ucd94\uc9d5\uc774-\ud130\uc9c0\ub294-\ub300\ud45c-\uc5c5\uc885\ub4e4\" class=\"col-toc-link lvl-2\">6\ub144 \uce58 \uc5f0\ucc28\u00b7\uc8fc\ub9d0\uc218\ub2f9\u00b7\uc5f0\uae08 \uc5ed\ucd94\uc9d5\uc774 \ud130\uc9c0\ub294 \ub300\ud45c \uc5c5\uc885\ub4e4<\/a><a href=\"#abn-\uc778\ub825-\uad6c\uc870-\uc810\uac80\uacfc-\ubbf8\uc9c0\uae09-\uccad\uad6c-\uc5b4\ub514\uc11c\ubd80\ud130-\uc2dc\uc791\ud560\uae4c\" class=\"col-toc-link lvl-2\">ABN \uc778\ub825 \uad6c\uc870 \uc810\uac80\uacfc \ubbf8\uc9c0\uae09 \uccad\uad6c, \uc5b4\ub514\uc11c\ubd80\ud130 \uc2dc\uc791\ud560\uae4c<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/221801513691854\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">\uace0\uc6a9\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../?lang=ko&amp;tab=employment\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 \uc9c1\uc7a5\u00b7\ubc00\ub9b0 \uc784\uae08 \uacc4\uc0b0\uae30\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">\uac74\uc124 \ud0c0\uc77c\u00b7\ubaa9\uacf5 \ud300\ubd80\ud130 \uccad\uc18c \uc5c5\uccb4, \ud544\ub77c\ud14c\uc2a4 \uc13c\ud130, \ubdf0\ud2f0 \uc0b4\ub871, \uc7a5\uc560\uc778 \ub3cc\ubd04(NDIS), \ubb3c\ub958 \uc5c5\uacc4\uae4c\uc9c0 \ud55c\uc778 \uc0ac\uc5c5\uc7a5\uc5d0\uc11c \uc790\uc8fc \ub4e3\ub294 \ub9d0\uc774 \uc788\uc5b4\uc694. \uc6b0\ub9ac \ub9e4\uc7a5\uc740 \uac1c\uc778 \uc0ac\uc5c5\uc790 \ubc88\ud638(ABN) \uc778\ubcf4\uc774\uc2a4\ub85c \uc815\uc0b0\ud558\ub2c8 \ub178\ub3d9\ubc95\uacfc \ubb34\uad00\ud558\ub2e4\ub294 \uc774\uc57c\uae30\uc8e0. \uc77c\ud558\ub294 \uc0ac\ub78c\ub3c4 \ucc98\uc74c \ub4e4\uc5b4\uc62c \ub54c \ub3c5\ub9bd \ub3c4\uae09\uacc4\uc57d\uc11c(Independent Contractor Agreement)\uc5d0 \uc9c1\uc811 \uc11c\uba85\ud588\uc73c\ub2c8 \ubb38\uc81c\uc5c6\uc744 \uac70\ub77c\uace0 \ubbff\uace4 \ud574\uc694. \uba87 \ub144 \uc804\uae4c\uc9c0\ub294 \uacc4\uc57d\uc11c \ubb38\uad6c\ub9cc \ucd18\ucd18\ud788 \uc368 \ub450\uba74 \ubc95\uc815\uc5d0\uc11c \ub4e0\ub4e0\ud55c \ubc29\ud328 \ub178\ub987\uc744 \ud588\uc5b4\uc694. \uadf8\ub7ec\ub098 2024\ub144 8\uc6d4 \uc2dc\ud589\ub41c \uacf5\uc815\uadfc\ub85c\ubc95(FWA s 15AA)\uacfc \ucd5c\uc2e0 \ud310\uc815\ub4e4\uc774 \uadf8 \ubc29\ud328\ub97c \uac70\ub46c\ub0c8\uc5b4\uc694.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 382\" width=\"100%\" role=\"img\" aria-label=\"2026\ub144 7\uc6d4 $190,100 \uc18c\ub4dd \uae30\uc900\uc120\uc5d0 \ub530\ub978 ABN \uacc4\uc57d\uc790 \ubc95\uc801 \uc9c0\uc704 \ubd84\uae30\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"381\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">2024\u20132026 \ub3c4\uae09\u00b7\uadfc\ub85c\uc790 \ud310\ubcc4 \u00b7 FWA s 15AA \uc2e4\uc9c8 \uc2ec\uc0ac &amp; $190,100 \uae30\uc900\uc120<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">2026\ub144 7\uc6d4 $190,100 \uc18c\ub4dd \uae30\uc900\uc120\uc5d0 \ub530\ub978 ABN \uacc4\uc57d\uc790 \ubc95\uc801 \uc9c0\uc704 \ubd84\uae30<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">\uadfc\uac70: FWA ss 15AA\u201315AC, s 357(2) \u00b7 Dickerson [2025] FWC 2219 \u00b7 Crooks v Hyundai Rotem [2026] FWC 1104<\/text>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"38\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">\uc5f0 \uc18c\ub4dd $190,100 \ubbf8\ub9cc \u00b7 s 15AA \uc2e4\uc9c8 \uc6b0\uc120 \uc6d0\uce59<\/text>\n  <circle cx=\"42\" cy=\"144\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\uacc4\uc57d\uc11c \ubb38\uad6c\ubcf4\ub2e4 \uc2e4\uc81c \uadfc\ubb34 \uc2e4\ud0dc \uc6b0\uc120<\/text>\n  <text x=\"54\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">\ucd9c\ud1f4\uadfc \ud1b5\uc81c\u00b7\uace0\uc815 \uc2dc\uae09\u00b7\ub300\uccb4 \uc778\ub825 \ud22c\uc785 \ubd88\uac00 \uc2dc \uadfc\ub85c\uc790\ub85c \uc9c1\uad8c \uc804\ud658.<\/text>\n  <circle cx=\"42\" cy=\"196\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">6\ub144 \uce58 \uc5f0\ucc28\u00b7\uc8fc\ub9d0\uc218\ub2f9 + \ubcf5\uc9c1 \uba85\ub839 (Dickerson)<\/text>\n  <text x=\"54\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">\ub3c5\ub9bd\uacc4\uc57d\uc11c \uc11c\uba85\uc5d0\ub3c4 \uadfc\ub85c\uc790 \uc778\uc815 \ubc0f 6\uac1c\uc6d4 \uc784\uae08\u00b7\ubcf5\uc9c1 \uc120\uace0.<\/text>\n  <circle cx=\"42\" cy=\"248\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\uac1c\uc778 \ub178\ubb34 ABN\ub3c4 12% \ud1f4\uc9c1\uc5f0\uae08 \uc758\ubb34 (SGAA s 12(3))<\/text>\n  <text x=\"54\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">\uc9c4\uc815\ud55c \ud504\ub9ac\ub79c\uc11c\ub77c\ub3c4 \ubcf8\uc778 \ub178\ub3d9\ub825 \ub300\uac00\uba74 12% \uc5f0\uae08 \ubcc4\ub3c4 \ubd80\uacfc!<\/text>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"466\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">\uc5f0 \uc18c\ub4dd $190,100 \ucd08\uacfc \u00b7 s 15AB \uc11c\uba74 \ubc30\uc81c \ud1b5\uc9c0<\/text>\n  <circle cx=\"470\" cy=\"144\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\uc801\ubc95\ud55c s 15AB Opt-Out \ud1b5\uc9c0 \uc2dc \uacc4\uc57d\ubb38\uc5b8 \uc720\uc9c0<\/text>\n  <text x=\"482\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">\uace0\ubc95 \ud310\ub840(Personnel Contracting) \uc720\uc9c0 \u00b7 Crooks [2026] FWC 1104.<\/text>\n  <circle cx=\"470\" cy=\"196\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\uc9c4\uc815\ud55c \ubc95\uc778 \ub300 \ubc95\uc778(Pty Ltd) \ub3c4\uae09 \uad6c\uc870<\/text>\n  <text x=\"482\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">\ub3c5\uc790\uc801 \uc0ac\uc5c5 \ub9ac\uc2a4\ud06c\u00b7\ub2e4\uc218 \uac70\ub798\ucc98 \ubcf4\uc720 \uc2dc \ub3c4\uae09 \uc778\uc815 (Barakat [2026]).<\/text>\n  <circle cx=\"470\" cy=\"248\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">\uac15\ud654\ub41c \uc704\uc7a5\ub3c4\uae09 \ud56d\ubcc0 \ubb38\ud131 (FWA s 357(2))<\/text>\n  <text x=\"482\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">\uace0\uc6a9\uc8fc\uac00 &#x27;\ud569\ub9ac\uc801 \ubbff\uc74c(Reasonable Belief)&#x27;\uc744 \uac1d\uad00\uc801 \uc790\ubb38\uc73c\ub85c \uc785\uc99d\ud574\uc57c \uba74\ucc45.<\/text>\n  <rect x=\"22\" y=\"328\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"351\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1D6B48\">\uc810\uac80 \ud3ec\uc778\ud2b8: \uac74\uc124\u00b7\uccad\uc18c\u00b7\ud544\ub77c\ud14c\uc2a4\u00b7NDIS\u00b7\ubdf0\ud2f0 \uc5c5\uc885 \ub2e4\uc218 ABN \uc6b4\uc601 \ubc95\uc778\uacfc \uc7a5\uae30 \uc804\uc18d ABN \uc778\ub825\uc740 6\ub144 \uc5ed\ucd94\uc9d5 \uc804\uc5d0 \uad6c\uc870\ub97c \uc7ac\uc124\uacc4\ud574\uc57c \ud569\ub2c8\ub2e4.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 1: 2026\ub144 7\uc6d4 $190,100 \uae30\uc900\uc120\uc5d0 \ub530\ub978 ABN \ub3c4\uae09\u00b7\uadfc\ub85c\uc790 \ud310\ubcc4 \uad6c\uc870<\/figcaption><\/figure>\n<h2 id=\"\ub300\ubc95\uc6d0-\uacc4\uc57d\uc11c-\uc9c0\uc0c1\uc8fc\uc758\ub97c-\ub4a4\uc9d1\uc740-fwa-s-15aa-\uc2e4\uc9c8-\uad00\uacc4-\uc2ec\uc0ac\" class=\"doc-h2\">\ub300\ubc95\uc6d0 \uacc4\uc57d\uc11c \uc9c0\uc0c1\uc8fc\uc758\ub97c \ub4a4\uc9d1\uc740 FWA s 15AA \uc2e4\uc9c8 \uad00\uacc4 \uc2ec\uc0ac<\/h2>\n<p class=\"doc-p\">\uc608\uc804 \uc790\ubb38\ub9cc \ubbff\ub358 \uc0ac\uc5c5\uc8fc\ub4e4\uc774 \uc694\uc998 \uc65c \uc787\ub530\ub77c \ud328\uc18c\ud560\uae4c\uc694? \ubc95\uc758 \uae30\uc900\uc120\uc774 \ubd88\uacfc 2\ub144\uc5ec \ub9cc\uc5d0 \uc815\ubc18\ub300\ub85c \ubc14\ub00c\uc5c8\uae30 \ub54c\ubb38\uc774\uc5d0\uc694. 2022\ub144 \ucd08 \ud638\uc8fc \uc5f0\ubc29\ub300\ubc95\uc6d0\uc740 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2022/1.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>CFMMEU v Personnel Contracting Pty Ltd<\/em> [2022] HCA 1<\/a> \ud310\uacb0\uacfc <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2022/2.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>ZG Operations Australia Pty Ltd v Jamsek<\/em> [2022] HCA 2<\/a> \ud310\uacb0\uc5d0\uc11c \ubcf4\ud1b5\ubc95\uc0c1 \uc11c\uba74 \uacc4\uc57d \uc6b0\uc120 \uc6d0\uce59(contract primacy)\uc744 \uc138\uc6e0\uc5b4\uc694. \uacc4\uc57d\uc11c\uac00 \uac00\uc9dc\uac00 \uc544\ub2cc \ud55c \uc11c\uba74 \uc870\ud56d\ub9cc\uc73c\ub85c \uc9c0\uc704\ub97c \uac00\ub9ac\uace0 \uc2e4\uc81c \uadfc\ubb34 \uc2e4\ud0dc\ub294 \ub4a4\ub85c \ubbf8\ub8e8\uaca0\ub2e4\ub294 \uc785\uc7a5\uc774\uc5c8\uc8e0.<\/p>\n<p class=\"doc-p\">\ud558\uc9c0\ub9cc \uc5f0\ubc29 \uc758\ud68c\uac00 2024\ub144 8\uc6d4 26\uc77c \uacf5\uc815\uadfc\ub85c\ubc95(Fair Work Act 2009, FWA)\uc5d0 s 15AA\ub97c \uc2e0\uc124\ud558\uba74\uc11c \ud310\ub3c4\uac00 \ub4a4\uc9d1\ud614\uc5b4\uc694. \uacf5\uc815\uadfc\ub85c\ubc95 \uc0ac\uac74\uc5d0\uc11c\ub294 \uc11c\uba74 \uacc4\uc57d \uc6b0\uc120 \uc6d0\uce59\uc744 \ubc30\uc81c\ud558\uace0 \uad00\uacc4\uc758 \uc2e4\uc9c8, \ud604\uc2e4\uc801 \uc6b4\uc601 \ubc0f \uc9c4\uc815\ud55c \ubcf8\uc9c8(real substance, practical reality and true nature of the relationship)\uc744 \ubcf4\ub3c4\ub85d \ubabb \ubc15\uc558\uac70\ub4e0\uc694. \uacc4\uc57d\uc11c \uccab \uc904\uc5d0 \ud504\ub9ac\ub79c\uc11c\ub77c\uace0 \uc801\uc5b4 \ub450\uc5c8\ub354\ub77c\ub3c4 \uc18c\uc6a9\uc774 \uc5c6\uc5b4\uc694. \uacf5\uc815\uadfc\ub85c\uc704\uc6d0\ud68c(FWC)\uc640 \ubc95\uc6d0\uc740 \uadfc\ubb34\uc2dc\uac04\uacfc \uc5c5\ubb34 \ubc29\uc2dd\uc744 \ub204\uac00 \ud1b5\uc81c\ud588\ub294\uc9c0, \uc81c3\uc790\uc5d0\uac8c \uc77c\uc744 \uc790\uc720\ub86d\uac8c \uc7ac\ud558\ub3c4\uae09(delegation) \uc904 \uc218 \uc788\uc5c8\ub294\uc9c0, \uc5c5\uccb4 \uc720\ub2c8\ud3fc\uc744 \uc785\uace0 \ub0b4\ubd80 \uc9c1\uc6d0\ucc98\ub7fc \uc77c\ud588\ub294\uc9c0\ub97c \ud604\uc7a5 \uc2e4\ud0dc \uadf8\ub300\ub85c \ub530\uc838\ubd10\uc694.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"4\"><thead><tr><th style=\"text-align:left\">\ud310\ubcc4 \uad6c\uac04 \ubc0f \ud575\uc2ec \uc7c1\uc810<\/th><th style=\"text-align:left\">\uc801\uc6a9 \ubc95\ub9ac \ubc0f 2026.07 \uae30\uc900\uc120<\/th><th style=\"text-align:left\">\ub300\ud45c \ud310\ub840 \ubc0f \ubc95\ub839 \uadfc\uac70<\/th><th style=\"text-align:left\">\uc0ac\uc5c5\uc8fc \ub9ac\uc2a4\ud06c \ubc0f \uccad\uad6c \ubc94\uc704<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>\uc5f0 \uc18c\ub4dd $190,100 \ubbf8\ub9cc \uac1c\uc778 ABN<\/strong><\/td><td style=\"text-align:left\">FWA s 15AA \uc2e4\uc9c8 \uad00\uacc4 \uc2ec\uc0ac \uac15\ud589 \uc801\uc6a9<\/td><td style=\"text-align:left\"><em>Dickerson v Kagura Games<\/em> [2025] FWC 2219<\/td><td style=\"text-align:left\">\ub3c4\uae09\uacc4\uc57d\uc11c\uc5d0\ub3c4 \uadfc\ub85c\uc790 \uc778\uc815 \u00b7 \ubcf5\uc9c1 \ubc0f 6\ub144 \uce58 \uc218\ub2f9\u00b7\uc5f0\ucc28 \uccad\uad6c<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc5f0 \uc18c\ub4dd $190,100 \ucd08\uacfc + \ubc30\uc81c \ud1b5\uc9c0<\/strong><\/td><td style=\"text-align:left\">s 15AB \uc11c\uba74 \ud1b5\uc9c0 \uc2dc \ubcf4\ud1b5\ubc95 \uacc4\uc57d \uc6b0\uc120 \uc720\uc9c0<\/td><td style=\"text-align:left\"><em>Crooks v Hyundai Rotem<\/em> [2026] FWC 1104<\/td><td style=\"text-align:left\">s 15AA \uc801\uc6a9 \ubc30\uc81c \u00b7 \uc11c\uba74 \uacc4\uc57d\ub300\ub85c \ub3c5\ub9bd \uc218\uae09\uc778 \uc720\uc9c0<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\ubcc4\ub3c4 \ubc95\uc778(Pty Ltd) \u00b7 3\uc790 \ub3c4\uae09<\/strong><\/td><td style=\"text-align:left\">\ub3c5\ub9bd \uae30\uc5c5 \uac04 \uc2e4\uc9c8 \uc6a9\uc5ed \uc5ec\ubd80 \uc2ec\ub9ac<\/td><td style=\"text-align:left\"><em>Barakat v Grimshaw Architects<\/em> [2026] FWC 1941<\/td><td style=\"text-align:left\">\uc2e4\uc9c8\uc801 \ubc95\uc778\u00b73\uc790 \ub3c4\uae09 \uad6c\uc870 \uc785\uc99d \uc2dc \uadfc\ub85c\uc790\uc131 \ubd80\uc815<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc704\uc7a5\ub3c4\uae09(Sham Contracting) \uba74\ucc45<\/strong><\/td><td style=\"text-align:left\">2024.02.27 \uac1c\uc815 FWA s 357(2) \ud569\ub9ac\uc801 \uc2e0\ub8b0<\/td><td style=\"text-align:left\">\uae30\uc5c5 \uaddc\ubaa8\u00b7\uc0ac\uc804 \ubc95\ub960\uc790\ubb38 \uc720\ubb34 \uc2ec\uc0ac ($364 PU)<\/td><td style=\"text-align:left\">\uacfc\uac70 \ubb34\ubaa8\ud558\uc9c0 \uc54a\uc558\uc74c(not reckless) \ud56d\ubcc0 \ud3d0\uc9c0 \u00b7 \uc81c\uc7ac\uae08 \ub178\ucd9c<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uac1c\uc778 \ud504\ub9ac\ub79c\uc11c \ud1f4\uc9c1\uc5f0\uae08(12%)<\/strong><\/td><td style=\"text-align:left\">\ub178\ub3d9\ub825 \uc704\uc8fc \uac1c\uc778 ABN \ub3c4\uae09 \uc2dc \uc5f0\uae08 \uc758\ubb34<\/td><td style=\"text-align:left\">\ud1f4\uc9c1\uc5f0\uae08\ubcf4\uc7a5\ud589\uc815\ubc95(SGAA) s 12(3) + Payday Super<\/td><td style=\"text-align:left\">\ub3c4\uae09\uc774 \uc801\ubc95\ud574\ub3c4 12% \uc5f0\uae08 \ubbf8\ub0a9 \uc2dc \uc77c\ubcf5\ub9ac SGC \ucd94\uc9d5<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"2026\ub144-7\uc6d4-190100-\uc18c\ub4dd-\uae30\uc900\uc120\uacfc-\uc5c7\uac08\ub9b0-\ucd5c\uc2e0-fwc-\ud310\uc815-\uc138-\uac74\" class=\"doc-h2\">2026\ub144 7\uc6d4 $190,100 \uc18c\ub4dd \uae30\uc900\uc120\uacfc \uc5c7\uac08\ub9b0 \ucd5c\uc2e0 FWC \ud310\uc815 \uc138 \uac74<\/h2>\n<p class=\"doc-p\">\ubb3c\ub860 \ubaa8\ub4e0 \ub3c4\uae09 \uacc4\uc57d\uc774 \uadfc\ub85c\uacc4\uc57d\uc73c\ub85c \ubb36\uc774\uc9c0\ub294 \uc54a\uc544\uc694. \uae30\uc900\uc120\uc774 \ubd84\uba85\ud558\uac70\ub4e0\uc694. \uac1c\uc815\ubc95 FWA ss 15AB\u201315AC\ub294 \ub3c4\uae09 \uace0\uc18c\ub4dd \uae30\uc900\uc120(Contractor High Income Threshold)\uc744 \ub530\ub85c \ub450\uc5c8\uc5b4\uc694. \uc774 \uae08\uc561\uc740 2026\ub144 7\uc6d4 1\uc77c\ubd80\ub85c \uae30\uc874 $183,100\uc5d0\uc11c \uc5f0\uac04 $190,100\uc73c\ub85c \uc62c\ub790\uc5b4\uc694. \uc5f0 \uc218\uc785\uc774 $190,100\uc744 \ub118\ub294 \uace0\uc18c\ub4dd \uc218\uae09\uc778\uc740 \uc801\ubc95\ud55c s 15AB \uc11c\uba74 \uc801\uc6a9\ubc30\uc81c \ud1b5\uc9c0(opt-out notice)\ub85c s 15AA \uc2e4\uc9c8 \uc2ec\uc0ac\ub97c \ub044\uace0 \uc11c\uba74 \uacc4\uc57d \uc6b0\uc120 \uc6d0\uce59\uc744 \uc720\uc9c0\ud560 \uc218 \uc788\uc5b4\uc694. <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FWC/2026/1104.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Mr Amon John Crooks v Hyundai Rotem Company<\/em> [2026] FWC 1104<\/a> (2026\ub144 7\uc6d4 13\uc77c \ud310\uc815) \uc0ac\uac74\uc774 \ubc14\ub85c \uc774 \uace0\uc18c\ub4dd \ubc30\uc81c \ud1b5\uc9c0\uc758 \ud6a8\ub825\uc744 \uc778\uc815\ud55c \ud310\ub840\uc608\uc694.<\/p>\n<p class=\"doc-p\">\ubc18\uba74 \uc5f0 \uc218\uc785\uc774 $190,100 \ubbf8\ub9cc\uc778 \ud604\uc7a5 ABN \uc778\ub825\uc740 \ubc30\uc81c \ud1b5\uc9c0\ub97c \uc4f8 \uc218 \uc5c6\uc5b4\uc694. <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FWC/2025/2219.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Ms Tabitha Dickerson v Kagura Games LLC<\/em> [2025] FWC 2219<\/a> (2025\ub144 8\uc6d4 1\uc77c \ud310\uc815) \uc0ac\uac74\uc774 \ub300\ud45c\uc801\uc774\uc8e0. \uc6d0\uaca9 \uac8c\uc784 \ud14c\uc2a4\ud130\uac00 \uc601\ubb38 \ub3c5\ub9bd \ub3c4\uae09\uacc4\uc57d\uc11c\uc5d0 \uc11c\uba85\ud558\uace0 \uc778\ubcf4\uc774\uc2a4\ub97c \ub04a\uc5b4 \uc654\uc9c0\ub9cc \uc704\uc6d0\ud68c\ub294 s 15AA\uc5d0 \ub530\ub77c \uc77c\uc77c \uc5c5\ubb34 \ud1b5\uc81c \uc2e4\ud0dc\ub97c \uadfc\uac70\ub85c \uc815\uc2dd \uadfc\ub85c\uc790 \uc9c0\uc704\ub97c \uc778\uc815\ud588\uc5b4\uc694. \uc6d0\uc9c1 \ubcf5\uc9c1 \uba85\ub839\uacfc 6\uac1c\uc6d4 \uce58 \uc784\uae08 \ubc30\uc0c1\uae4c\uc9c0 \ub0b4\ub824\uc84c\uc8e0. \ubc18\ub300\ub85c <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FWC/2026/1941.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Mr Rafat Barakat v Grimshaw Architects Pty Ltd<\/em> [2026] FWC 1941<\/a> \uc0ac\uac74\ucc98\ub7fc \ubcc4\ub3c4 \ubc95\uc778(Pty Ltd)\uacfc \uc9c4\uc815\ud55c 3\uc790 \uc0c1\uc0ac \uacc4\uc57d \uad6c\uc870\ub97c \uac16\ucdb0 \ub3c5\uc790 \uc0ac\uc5c5\uccb4\ub85c \uc77c\ud55c \uacbd\uc6b0\uc5d0\ub294 \ub3c4\uae09 \uc9c0\uc704\uac00 \uc720\uc9c0\ub410\uc5b4\uc694. \uc885\uc774 \ud45c\uc9c0\ubcf4\ub2e4 \uc2e4\uc81c \uc0ac\uc5c5 \uad6c\uc870\uc640 \uc9c0\ud718 \uc720\ubb34\uac00 \uacb0\ub860\uc744 \uac08\ub77c\uc694.<\/p>\n<h2 id=\"\uae50\uae50\ud574\uc9c4-\uc704\uc7a5\ub3c4\uae09-\uba74\ucc45-\uc694\uac74s-3572\uacfc-\uc9c4\uc9dc-\ud504\ub9ac\ub79c\uc11c\uc5d0\uac8c\ub3c4-\ubd99\ub294-12-\ud1f4\uc9c1\uc5f0\uae08sgaa\" class=\"doc-h2\">\uae50\uae50\ud574\uc9c4 \uc704\uc7a5\ub3c4\uae09 \uba74\ucc45 \uc694\uac74(s 357(2))\uacfc \uc9c4\uc9dc \ud504\ub9ac\ub79c\uc11c\uc5d0\uac8c\ub3c4 \ubd99\ub294 12% \ud1f4\uc9c1\uc5f0\uae08(SGAA s 12(3))<\/h2>\n<p class=\"doc-p\">\uc0ac\uc5c5\uc8fc\uac00 \ub193\uce58\uae30 \uc26c\uc6b4 \ud568\uc815\uc740 \ub450 \uac00\uc9c0\uac00 \ub354 \uc788\uc5b4\uc694. \uccab\uc9f8\ub294 2024\ub144 2\uc6d4 27\uc77c \uc2dc\ud589\ub41c FWA s 357(2) \uc704\uc7a5\ub3c4\uae09 \uba74\ucc45 \uc694\uac74 \uac15\ud654\uc608\uc694. \uacfc\uac70\uc5d0\ub294 \ubab0\ub790\uace0 \ubb34\ubaa8\ud558\uc9c0 \uc54a\uc558\ub2e4(not reckless)\ub294 \uc810\ub9cc \ubcf4\uc774\uba74 \uc81c\uc7ac\uae08\uc744 \ud53c\ud558\uae30 \uc26c\uc6e0\uc8e0. \uc774\uc81c\ub294 \uc644\uc804\ud788 \ub2ec\ub77c\uc84c\uc5b4\uc694. \ub2f9\uc2dc \uadf8 \uacc4\uc57d\uc744 \uc9c4\uc815\ud55c \ub3c4\uae09\uc73c\ub85c \ud569\ub9ac\uc801\uc73c\ub85c \ubbff\uc5c8\uc74c(reasonably believed)\uc744 \uc0ac\uc5c5\uc8fc\uac00 \uc9c1\uc811 \uc99d\uba85\ud574\uc57c\ub9cc \uba74\ucc45\ub3fc\uc694. \uc0ac\uc804 \ubc95\ub960\uc790\ubb38\uc744 \ubc1b\uc744 \uc5ec\ub825\uc774 \uc788\uc5c8\ub294\ub370\ub3c4 \uc591\uc2dd\ub9cc \ubca0\uaef4 \uc37c\ub2e4\uba74 \ubc29\uc5b4\uac00 \ud1b5\ud558\uc9c0 \uc54a\uc544\uc694.<\/p>\n<p class=\"doc-p\">\ub458\uc9f8\ub294 \ud1f4\uc9c1\uc5f0\uae08\ubcf4\uc7a5\ud589\uc815\ubc95(Superannuation Guarantee (Administration) Act 1992, SGAA) s 12(3) \uaddc\uc815\uc774\uc5d0\uc694. \uc9c4\uc9dc \ub3c5\ub9bd \ud504\ub9ac\ub79c\uc11c\uac00 \ub9de\ub354\ub77c\ub3c4 \ubc29\uc2ec\uc740 \uae08\ubb3c\uc774\uc5d0\uc694. \uacc4\uc57d \ubaa9\uc801\uc774 \uc7a5\ube44 \uacf5\uae09\ubcf4\ub2e4 \uadf8 \uac1c\uc778\uc758 \uc9c1\uc811 \ub178\ub3d9\ub825(wholly or principally for the labour of the person)\uc5d0 \uc788\uace0 \uc2dc\uac04\ub2f9 \ubcf4\uc218\ub97c \ubc1b\uc73c\uba70 \ub300\uccb4 \ud22c\uc785\uc774 \uc548 \ub418\ub294 \uac1c\uc778 ABN \ubcf4\uc720\uc790\ub77c\uba74 12% \ud1f4\uc9c1\uc5f0\uae08 \uc758\ubb34\uac00 \uadf8\ub300\ub85c \ubd99\uc5b4\uc694. 2026\ub144 7\uc6d4 \uc2dc\ud589\ub41c Payday Super 7\uc601\uc5c5\uc77c \uc785\uae08 \uc6d0\uce59\uae4c\uc9c0 \uacb9\uccd0 \uc5f0\uae08\uc744 \ub204\ub77d\ud55c \uc0ac\uc5c5\uc7a5\uc740 \uad6d\uc138\uccad(ATO) \uc77c\ubcf5\ub9ac \ubd80\ub2f4\uae08(SGC) \ucd94\uc9d5\uc5d0 \uc9c1\uba74\ud574\uc694.<\/p>\n<h2 id=\"6\ub144-\uce58-\uc5f0\ucc28\uc8fc\ub9d0\uc218\ub2f9\uc5f0\uae08-\uc5ed\ucd94\uc9d5\uc774-\ud130\uc9c0\ub294-\ub300\ud45c-\uc5c5\uc885\ub4e4\" class=\"doc-h2\">6\ub144 \uce58 \uc5f0\ucc28\u00b7\uc8fc\ub9d0\uc218\ub2f9\u00b7\uc5f0\uae08 \uc5ed\ucd94\uc9d5\uc774 \ud130\uc9c0\ub294 \ub300\ud45c \uc5c5\uc885\ub4e4<\/h2>\n<p class=\"doc-p\">\uc65c ABN \ubd84\uc7c1 \ud558\ub098\uac00 \ud68c\uc0ac \ubb38\uc744 \ub2eb\uc744 \ub9cc\ud07c \ucee4\uc9c8\uae4c\uc694? \uccad\uad6c \uc2dc\ud6a8\uac00 6\ub144(FWA s 544)\uc774\ub098 \ub418\uae30 \ub54c\ubb38\uc774\uc5d0\uc694. \uac74\uc124, \uccad\uc18c, \ud544\ub77c\ud14c\uc2a4, NDIS \ub3cc\ubd04, \ubdf0\ud2f0\uc20d, \ubc30\uc1a1 \uc5c5\uacc4\uc5d0\uc11c \uc2dc\uae09 $35~$45 \uc778\ubcf4\uc774\uc2a4\ub85c 3~5\ub144\uac04 \uc77c\ud558\ub358 \uc778\ub825\uc774 \ud1f4\uc0ac\ud558\uba74\uc11c \uc18c\uc1a1\uc774 \uc2dc\uc791\ub418\uace4 \ud558\uc8e0.<\/p>\n<p class=\"doc-p\">s 15AA \uc2ec\uc0ac\uc5d0\uc11c \uadfc\ub85c\uc790\ub85c \uc778\uc815\ub418\uba74 \ud30c\uc7a5\uc740 \ucee4\uc694. \ucd5c\ub300 6\ub144 \uce58 \uc720\uae09 \uc5f0\ucc28\u00b7\ubcd1\uac00, \uc8fc\ub9d0\u00b7\uacf5\ud734\uc77c Award \uc218\ub2f9, \ud574\uace0 \uc608\uace0\uc218\ub2f9\uc5d0 6\ub144 \uce58 12% \ud1f4\uc9c1\uc5f0\uae08\uae4c\uc9c0 \ud55c\uaebc\ubc88\uc5d0 \ucc44\ubb34\ub85c \ub418\uc0b4\uc544\ub098\uac70\ub4e0\uc694. 1\uc778\ub2f9 \uccad\uad6c\uc561\uc774 $50,000~$150,000 \uc774\uc0c1\uc73c\ub85c \ubd88\uc5b4\ub098\ub294 \uac74 \uc21c\uc2dd\uac04\uc774\uc5d0\uc694.<\/p>\n<h2 id=\"abn-\uc778\ub825-\uad6c\uc870-\uc810\uac80\uacfc-\ubbf8\uc9c0\uae09-\uccad\uad6c-\uc5b4\ub514\uc11c\ubd80\ud130-\uc2dc\uc791\ud560\uae4c\" class=\"doc-h2\">ABN \uc778\ub825 \uad6c\uc870 \uc810\uac80\uacfc \ubbf8\uc9c0\uae09 \uccad\uad6c, \uc5b4\ub514\uc11c\ubd80\ud130 \uc2dc\uc791\ud560\uae4c<\/h2>\n<p class=\"doc-p\">\uc608\uc0c1 \uaddc\ubaa8\uc640 \uc785\uc7a5\uc5d0 \ub530\ub77c \uccab \ub2e8\ucd94\ub97c \uace8\ub77c \ubcf4\uc138\uc694. \ubbf8\uc9c0\uae09 \uc218\ub2f9\u00b7\uc5f0\ucc28\u00b7\uc5f0\uae08 \uc608\uc0c1\uc561\uc774 $50,000 \ubbf8\ub9cc\uc774\uac70\ub098 \uc544\uc9c1 \ubd80\uc871\ubd84\uc744 \uacc4\uc0b0\ud574 \ubcf4\uc9c0 \uc54a\uc740 ABN \ub178\ubb34\uc81c\uacf5\uc790\ub77c\uba74 \ubcc0\ud638\uc0ac\ube44\ub97c \uc4f0\uc2e4 \ud544\uc694\uac00 \uc5c6\uc5b4\uc694. \uc5f0\ubc29\uc21c\ud68c\u00b7\uac00\uc871\ubc95\uc6d0(FCFCOA) FWA s 548 \uc18c\uc561\uccad\uad6c\ub294 \ubb34\uc18c\uc1a1\ube44\uc6a9 \uad00\ud560(s 570)\uc774\uac70\ub4e0\uc694. \ubcf8 \ud3ec\ud138\uc758 \ubb34\ub8cc <a href=\"../../?lang=ko#employment\" class=\"doc-link\">\uc9c1\uc885\ubcc4 Award \ud504\ub9ac\uc14b \uacc4\uc0b0\uae30<\/a>\uc640 <a href=\"../../files/KO/Excel_Calculator/Park_Co_Underpayment_Self_Calculator_2026_KO.xlsx\" download class=\"doc-link\">208\uc218\uc2dd \uc790\ub3d9 \uc815\uc0b0 \uc5d1\uc140(.xlsx)<\/a>\ub85c \ucc28\uc561\uacfc 12% \uc5f0\uae08\uc744 \uba3c\uc800 \uc9c1\uc811 \uc0b0\ucd9c\ud574 \ubcf4\uc138\uc694. \uc774\uc5b4\uc11c <a href=\"../../files/KO/PDF/02_Employment_Underpayment_Self_Calculation_and_Evidence_Manual_2026_KO.pdf\" download class=\"doc-link\">\uccb4\ubd88\uc784\uae08 \uc140\ud504 \uc815\uc0b0 \ubc0f Form 5 \ub9e4\ub274\uc5bc<\/a>\uc744 \ub530\ub77c \ucd5c\uace0\uc7a5 \ubc1c\uc1a1\uacfc \uc18c\uc561\uccad\uad6c\ub97c \uc9c4\ud589\ud558\uc2dc\uba74 \ub3fc\uc694.<\/p>\n<p class=\"doc-p\">\ubc18\uba74 \uac74\uc124, \uccad\uc18c, \ud544\ub77c\ud14c\uc2a4, NDIS, \ubdf0\ud2f0, \ubb3c\ub958 \uc5c5\uc885\uc5d0\uc11c \uac10\uc0ac \uc804\uc5d0 ABN \uacc4\uc57d \uad6c\uc870\ub97c s 15AA\u00b7SGAA s 12(3) \uae30\uc900\uc5d0 \ub9de\ucdb0 \uc7ac\ud3b8\ud558\ub824\ub294 \ubcf5\uc7a1\ud55c \uae30\uc5c5 \ub178\ubb34 \uac10\uc0ac, \uadf8\ub9ac\uace0 \ubcf8 \ud3ec\ud138 \uc5d1\uc140\ub85c \uc9c1\uc811 \uc0b0\ucd9c\ud55c 6\ub144 \uce58 \ubbf8\uc9c0\uae09 \ud569\uacc4\uac00 $50,000~$150,000 \uc774\uc0c1\uc778 \uc7a5\uae30 ABN \uace0\uc561 \uccad\uad6c \uc0ac\uac74\uc740 \uc804\ubb38 \uc18c\uc1a1 \uc804\ub7b5\uc774 \uc2e4\uc775\uc744 \uc88c\uc6b0\ud574\uc694. \ubc15\uc564\ucf54 \uace0\uc6a9\ubc95 \ucc3d\uad6c(<a href=\"https://form.jotform.com/221801513691854\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\uace0\uc6a9\ubc95 \uc0ac\uc548 \uc811\uc218 \ubc14\ub85c\uac00\uae30<\/a>)\uc640 \uc548\ub0b4 \ud398\uc774\uc9c0(<a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ubc15\uc564\ucf54 \uacf5\uc2dd \ub9c1\ud06c \ud5c8\ube0c<\/a>)\ub85c \uc815\uc0b0\ud45c\ub098 \uacc4\uc57d\uc11c\ub97c \ubcf4\ub0b4 \uc8fc\uc138\uc694. \uc774\ud574\ucda9\ub3cc \uc810\uac80 \ud6c4 \ud655\uc2e4\ud55c \ud574\ubc95\uc744 \uc9da\uc5b4 \ub4dc\ub9b4\uac8c\uc694.<\/p>\n\n          <div class=\"col-sources-box\">\n            \uadfc\uac70 \ubc95\ub839 \ubc0f \ud310\ub840: Fair Work Act 2009 ss 15AA\u201315AC, 357(2) \u00b7 Superannuation Guarantee (Administration) Act 1992 s 12(3) \u00b7 Dickerson v Kagura Games LLC [2025] FWC 2219 \u00b7 Crooks v Hyundai Rotem Company [2026] FWC 1104 \u00b7 Barakat v Grimshaw Architects [2026] FWC 1941.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">\ud63c\uc790 \uc9c4\ud589\uc744 \uba48\ucd94\uace0 \ubcc0\ud638\uc0ac\ub97c \ucc3e\uc544\uc57c \ud558\ub294 \uc21c\uac04<\/span>\n            <h3 class=\"col-cta-title\">\ud68c\uc0ac \uae09\uc5ec\u00b7\uacc4\uc57d\uc11c \uc810\uac80, \ud574\uace0 21\uc77c \ub9c8\uac10 \uae30\ud55c, \ub610\ub294 \uc9c1\uc811 \uacc4\uc0b0\uc744 \ub9c8\uce5c $50,000 \uc774\uc0c1 \ubbf8\uc9c0\uae09 \uc0ac\uac74\uc778\uac00\uc694?<\/h3>\n            <p class=\"col-cta-desc\">$50,000 \ubbf8\ub9cc\uc758 \uc77c\ubc18 \ubc00\ub9b0 \uae09\uc5ec\ub294 \ud3ec\ud138 \ubb34\ub8cc \uacc4\uc0b0\uae30\uc640 208\uc218\uc2dd \uc5d1\uc140\ub85c \uc9c1\uc811 \uacc4\uc0b0\ud574 \uccad\uad6c\ud558\uc154\uc57c \ubc1b\uc73c\uc2e4 \ub3c8\ubcf4\ub2e4 \ubcc0\ud638\uc0ac\ube44\uac00 \ub354 \ucee4\uc9c0\ub294 \uc77c\uc744 \ub9c9\uc744 \uc218 \uc788\uc5b4\uc694. \ubc18\uba74 \ud574\uace0 \ud6c4 21\uc77c \uae30\ud55c\uc774 \uc784\ubc15\ud588\uac70\ub098 \ud68c\uc0ac \uc2a4\ud3f0\uc11c\uc2ed \ubc29\uc5b4\u00b7$50,000 \uc774\uc0c1 \uace0\uc561 \uccad\uad6c\u00b7\ud3d0\uc5c5 \ub300\ud45c\uc790 \ucc45\uc784 \ucd94\uad81(s 550) \ub2e8\uacc4\ub77c\uba74 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uc54c\ub824 \uc8fc\uc138\uc694.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/221801513691854\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">\uace0\uc6a9\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../files/KO/PDF/02_Employment_Underpayment_Self_Calculation_and_Evidence_Manual_2026_KO.pdf\" download class=\"col-btn-ghost\">02 \ubc00\ub9b0 \uc784\uae08 \uacc4\uc0b0\u00b7\uccad\uad6c \uc694\uc57d PDF \ubc1b\uae30<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">\ubc15\uc564\ucf54 \uacf5\uc2dd \uc0c1\ub2f4 \ub9c1\ud06c \ud5c8\ube0c<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">\ubc95\ub960 \uc548\ub0b4: \uc774 \uce7c\ub7fc\uc740 \ud638\uc8fc \uacf5\uc815\uadfc\ub85c\ubc95(Fair Work Act 2009), \ud1f4\uc9c1\uc5f0\uae08\ubc95, \uc774\ubbfc\ubc95\ub839\uacfc \ubc95\uc6d0 \ud310\ub840\ub97c \ubc14\ud0d5\uc73c\ub85c \uc54c\uae30 \uc27d\uac8c \ud480\uc5b4 \uc4f4 \uc77c\ubc18 \ubc95\ub960 \uc815\ubcf4\uc608\uc694. \uac1c\ubcc4 \uc0ac\uac74\uc5d0 \ub300\ud55c \ubc95\ub960 \uc790\ubb38\uc774\ub098 \uc218\uc784 \uacc4\uc57d \uc131\ub9bd\uc744 \ub73b\ud558\uc9c0 \uc54a\uc73c\ub2c8 FWC 21\uc77c \ub9c8\uac10 \uae30\ud55c \ub4f1\uc774 \uc784\ubc15\ud588\ub2e4\uba74 \uc9c0\uccb4 \uc5c6\uc774 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uac80\ud1a0\ub97c \ubc1b\uc544 \ubcf4\uc138\uc694.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">\ud568\uaed8 \uc77d\uc73c\uba74 \uc88b\uc740 \uace0\uc6a9\ubc95 \ud310\ub840 \uce7c\ub7fc<\/h3>\n        <a href=\"../../?lang=ko&amp;tab=employment\" class=\"col-back-link num\">\u2190 \uc9c1\uc7a5\u00b7\ubc00\ub9b0 \uc784\uae08 \uacc4\uc0b0\uae30\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../annualised-salary-setoff-audit-2026/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ud3ec\uad04\uc5f0\ubd09\u00b7\uc784\uae08\uc808\ub3c4 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 04<\/span><h4 class=\"col-sib-title\">\ud3ec\uad04\uc5f0\ubd09\uc81c(All-In Salary) \uacc4\uc57d\uc11c\uc758 \ubc30\uc2e0: Woolworths\u00b7Coles \uc5f0\ubc29\ubc95\uc6d0 \ud310\uacb0\uacfc \uc784\uae08\uc808\ub3c4 \ud615\uc0ac\ucc98\ubc8c \ub300\uc751\ubc95<\/h4><p class=\"col-sib-desc\">&#x27;\uc5f0\ubd09\uc5d0 \uc8fc\ub9d0\u00b7\uc57c\uadfc\uc218\ub2f9\uc774 \ub2e4 \ud3ec\ud568\ub410\ub2e4&#x27;\ub294 \uacc4\uc57d\uc11c \ubb38\uad6c\uac00 \uc65c \uc5f0\ubc29\ubc95\uc6d0([2025] FCA 1092)\uc5d0\uc11c \uae68\uc84c\ub294\uc9c0 \uc0b4\ud3b4\ubcf4\uace0 \ud68c\uc0ac\uc758 \uae09\uc5ec \uc810\uac80\uacfc $50,000 \uc774\uc0c1 \ubc00\ub9b0 \uc218\ub2f9 \uccad\uad6c \uae30\uc900\uc744 \uc54c\ub824\ub4dc\ub824\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../director-accountant-liability-s550/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubc95\uc778\ud3d0\uc5c5\u00b7\uc5f0\ub300\ucc45\uc784 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 05<\/span><h4 class=\"col-sib-title\">\ud68c\uc0ac\ub97c \ud3d0\uc5c5(Liquidation)\ud558\uba74 \ub05d\uc77c\uae4c: \ub300\ud45c\uc774\uc0ac\u00b7\ud68c\uacc4\uc0ac \uac1c\uc778 \uc7ac\uc0b0\uc744 \ucd94\uad81\ud558\ub294 FWA s 550 \uc5f0\ub300\ucc45\uc784<\/h4><p class=\"col-sib-desc\">\ubb38\uc744 \ub2eb\uc740 \ube48 \uaecd\ub370\uae30 \ud68c\uc0ac\ub9cc \uc0c1\ub300\ub85c \uc18c\uc1a1\ud558\uba74 \uc65c \ub3c8\uc744 \ud55c \ud47c\ub3c4 \ubabb \ubc1b\ub294\uc9c0 \uc54c\uc544\ubcf4\uace0 \uc0ac\uc7a5\ub2d8\u00b7\uad00\uc5ec \ud68c\uacc4\uc0ac \uac1c\uc778 \uc7ac\uc0b0\uc5d0 \ucc45\uc784\uc744 \ubb3b\ub294 s 550 \uaddc\uc815\uc744 \uc27d\uac8c \uc124\uba85\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../sponsored-worker-dismissal-482-186/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ube44\uc790\uc5f0\ub3d9 \ud574\uace0 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 07<\/span><h4 class=\"col-sib-title\">482\u00b7186 \uc2a4\ud3f0\uc11c \ube44\uc790 \uc911 \ud574\uace0 \ud1b5\ubcf4: 21\uc77c\uacfc 180\uc77c\uc758 \uc774\uc911 \uc2dc\uacc4\uc640 \ud569\uc758\uc11c(Deed) \ud568\uc815<\/h4><p class=\"col-sib-desc\">\uc2a4\ud3f0\uc11c \ube44\uc790\ub85c \uc77c\ud558\ub2e4 \ud574\uace0\ub410\uc744 \ub54c \uc65c \ub178\ub3d9\ubc95\uacfc \uc774\ubbfc\ubc95\uc744 \ub530\ub85c \ubcf4\uba74 \uc704\ud5d8\ud55c\uc9c0 \uc9da\uc5b4 \ubcf4\uace0 \ud1f4\uc0ac\uc77c\uc744 \uc870\uc728\ud558\ub294 \ud569\uc758\uc11c \uc791\uc131\ubc95\uacfc \uc8fc\uc758\uc810\uc744 \uc815\ub9ac\ud588\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../executive-dismissal-general-protections-restraints/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc784\uc6d0\ud574\uace0\u00b7\uacbd\uc5c5\uae08\uc9c0 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 08<\/span><h4 class=\"col-sib-title\">\uc5f0\ubd09 $190,100 \uc774\uc0c1 \uc784\uc6d0 \ud574\uace0\uc640 \ubb34\uc81c\ud55c \uc77c\ubc18\ubcf4\ud638 \uc18c\uc1a1\uc758 \ucc29\uac01: $520\ub9cc \ud310\uacb0 \ud30c\uae30 \uc0ac\ub840\uc640 \uacbd\uc5c5\uae08\uc9c0 \uac00\ucc98\ubd84<\/h4><p class=\"col-sib-desc\">\ud68c\uc0ac\uc5d0 \ubb38\uc81c\ub97c \uc81c\uae30\ud55c \uc9c1\ud6c4 \ud574\uace0\ub418\uba74 \ubb34\uc870\uac74 \uac70\uc561 \ubc30\uc0c1\uc744 \ubc1b\ub294\ub2e4\ub294 \uc624\ud574\ub97c \ubc14\ub85c\uc7a1\uace0 \uace0\uc5f0\ubd09 \uc784\uc6d0 \ud1f4\uc0ac \ud611\uc0c1\uacfc \uacbd\uc5c5\uae08\uc9c0 \uc870\ud56d \ub300\uc751\ubc95\uc744 \uc27d\uac8c \ud480\uc5c8\uc5b4\uc694.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}, "en": {"doc_title": "ABN Contractor or Employee? How Section 15AA Overturned High Court Contract Primacy \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">All Guides Hub<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=en\">Visa Solution Guide<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=en\">Employment Navigator<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=en\">DIY & Cost-Smart Guide<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\">Consult Park & Co \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=en&amp;tab=employment\" class=\"col-back-btn\">\u2190 Back to Employment Self-Help Hub<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">Park &amp; Co Lawyers \u00b7 Employment Law Deep-Dive Column<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn\">KO<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn active\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">Consult Park &amp; Co \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">ABN &amp; SHAM CONTRACTING \u00b7 EMPLOYMENT 06<\/span>\n          <span class=\"col-verified-pill num\">Primary-Source Verified (Nov 2026)<\/span>\n          <span class=\"col-time-pill num\">8 min read<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">ABN Contractor or Employee? How Section 15AA Overturned High Court Contract Primacy<\/h1>\n        <p class=\"col-subtitle\">Post-August 2024 practical-reality testing, the 1 July 2026 $190,100 opt-out threshold, tightened s 357(2) defences, and 12% super under SGAA s 12(3)<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">Chang Min Park<\/div>\n            <div class=\"col-author-role\">Legal Practitioner Director, Park &amp; Co Lawyers \u00b7 Accredited Specialist in Immigration Law (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col06_emp_contractor_hero.jpg\" alt=\"ABN Contractor or Employee? How Section 15AA Overturned High Court Contract Primacy\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">Below the $190,100 contractor high income threshold, FWA s 15AA looks straight past boilerplate ABN clauses to examine how the relationship operates in practice.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">$190,100 Floor<\/div><div class=\"col-stat-lbl\">1 July 2026 contractor opt-out threshold under FWA ss 15AB\u201315AC<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">12% SG Liability<\/div><div class=\"col-stat-lbl\">SGAA s 12(3) captures sole-trader ABNs paid principally for personal labour<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">Reasonable Belief<\/div><div class=\"col-stat-lbl\">Tightened employer onus to defend s 357 sham contracting penalties<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">In This Column<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#from-personnel-contracting-to-the-s-15aa-practic\" class=\"col-toc-link lvl-2\">From Personnel Contracting to the s 15AA practical reality test<\/a><a href=\"#the-190100-contractor-opt-out-gate-and-2025-2026\" class=\"col-toc-link lvl-2\">The $190,100 contractor opt-out gate and 2025-2026 FWC case law<\/a><a href=\"#tightened-s-3572-sham-contracting-rules-remove-t\" class=\"col-toc-link lvl-2\">Tightened s 357(2) sham contracting rules remove the recklessness shield<\/a><a href=\"#why-genuine-sole-trader-contractors-still-attrac\" class=\"col-toc-link lvl-2\">Why genuine sole-trader contractors still attract 12% superannuation under s 12(3)<\/a><a href=\"#workforce-audits-and-six-year-misclassification-\" class=\"col-toc-link lvl-2\">Workforce audits and six-year misclassification claims<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">Open Employment Consultation Form<\/a>\n              <a href=\"../../?lang=en&amp;tab=employment\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 Back to Employment Self-Help Hub<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">Between February 2022 and August 2024, Australian principals operated under the most protective contractor rules in a generation. After the High Court decided <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2022/1.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>CFMMEU v Personnel Contracting Pty Ltd<\/em> [2022] HCA 1<\/a> and <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2022/2.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>ZG Operations Australia Pty Ltd v Jamsek<\/em> [2022] HCA 2<\/a>, a comprehensive, non-sham written contractor agreement largely settled a worker&#x27;s status at common law without courts sifting through years of post-contract workplace conduct. Construction, commercial cleaning, Pilates and fitness, NDIS, beauty, and logistics businesses rolled out ABN subcontractor agreements during that period and left them untouched. On 26 August 2024, s 15AA of the <em>Fair Work Act 2009<\/em> (Cth) (FWA) repealed that shelter for most of the workforce, and 2025 to 2026 Fair Work Commission (FWC) rulings show how readily tribunals now look past paper labels.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 382\" width=\"100%\" role=\"img\" aria-label=\"How the $190,100 Threshold Splits ABN Contractor Law (FY 2026\u201327)\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"381\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">POST-2024 CONTRACTOR TEST \u00b7 FWA s 15AA &amp; SGAA s 12(3)<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">How the $190,100 Threshold Splits ABN Contractor Law (FY 2026\u201327)<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">Authorities: FWA ss 15AA\u201315AC, s 357(2) \u00b7 Dickerson [2025] FWC 2219 \u00b7 Crooks v Hyundai Rotem [2026] FWC 1104<\/text>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"38\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">BELOW $190,100 \u00b7 MANDATORY s 15AA SUBSTANCE TEST<\/text>\n  <circle cx=\"42\" cy=\"144\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Practical Reality Overrides Written Labels<\/text>\n  <text x=\"54\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">Rosters, supervision &amp; inability to delegate convert ABN to employee.<\/text>\n  <circle cx=\"42\" cy=\"196\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">6-Year Backpay &amp; Reinstatement (Dickerson)<\/text>\n  <text x=\"54\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">FWC overrode contractor contract, ordering reinstatement &amp; backpay.<\/text>\n  <circle cx=\"42\" cy=\"248\" r=\"4\" fill=\"#7A1F2B\"/>\n  <text x=\"54\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">12% Super Owed Even to Real Contractors<\/text>\n  <text x=\"54\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">SGAA s 12(3) mandates 12% super on contracts principally for labour.<\/text>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"218\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"450\" y=\"94\" width=\"408\" height=\"32\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"466\" y=\"115\" font-size=\"11.8\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">ABOVE $190,100 \u00b7 WRITTEN s 15AB OPT-OUT TRACK<\/text>\n  <circle cx=\"470\" cy=\"144\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"148\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Valid s 15AB Notice Preserves Contract Primacy<\/text>\n  <text x=\"482\" y=\"167\" font-size=\"11.1\" fill=\"#525B67\">Keeps Personnel Contracting alive (Crooks v Hyundai Rotem [2026]).<\/text>\n  <circle cx=\"470\" cy=\"196\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"200\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Genuine Tripartite Corporate Structures<\/text>\n  <text x=\"482\" y=\"219\" font-size=\"11.1\" fill=\"#525B67\">Independent business risk &amp; corporate invoicing upheld (Barakat [2026]).<\/text>\n  <circle cx=\"470\" cy=\"248\" r=\"4\" fill=\"#1F4E5F\"/>\n  <text x=\"482\" y=\"252\" font-size=\"12.2\" font-weight=\"800\" fill=\"#1F242B\">Strict s 357(2) &#x27;Reasonable Belief&#x27; Defence<\/text>\n  <text x=\"482\" y=\"271\" font-size=\"11.1\" fill=\"#525B67\">Employers bear the onus of proving objective grounds for ABN engagement.<\/text>\n  <rect x=\"22\" y=\"328\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#EDF7F2\" stroke=\"#1D6B48\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"351\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1D6B48\">Action Point: Construction, cleaning, fitness, NDIS &amp; logistics operators must audit ABN cohorts before 6-year claims crystallise.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 1: The $190,100 Opt-Out Threshold and Post-2024 s 15AA Substance Inquiry<\/figcaption><\/figure>\n<h2 id=\"from-personnel-contracting-to-the-s-15aa-practic\" class=\"doc-h2\">From Personnel Contracting to the s 15AA practical reality test<\/h2>\n<p class=\"doc-p\">Under <em>Personnel Contracting<\/em> and <em>Jamsek<\/em>, where parties reduced their bargain comprehensively to writing without sham or variation, legal status turned on the rights and duties inside the four corners of that document. Even where a driver or labourer wore company uniforms and worked set hours for years, clauses requiring an ABN, pricing work by invoice, and allowing paper delegation kept statutory leave and unfair dismissal claims at bay.<\/p>\n<p class=\"doc-p\">Parliament overrode that rule for FWA purposes when s 15AA commenced on 26 August 2024. Deciding whether an individual is an employee or an independent contractor now requires assessing the &quot;real substance, practical reality and true nature of the relationship&quot;. Under s 15AA(2), courts and the FWC examine the totality of the relationship, weighing both the written contract terms and how the agreement is performed in daily practice. Requiring weekly ABN invoices or inserting a theoretical right to subcontract that site managers would never permit in practice will not defeat employee status where the worker is rostered into the host&#x27;s business, holds no pricing power, and builds no independent goodwill.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">Statutory Rule / Threshold<\/th><th style=\"text-align:left\">Effective Date &amp; Leading Authority<\/th><th style=\"text-align:left\">Practical Test &amp; Financial Exposure<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Substantive Reality Test (FWA s 15AA)<\/strong><\/td><td style=\"text-align:left\">26 Aug 2024; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FWC/2025/2219.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Dickerson v Kagura Games<\/em> [2025] FWC 2219<\/a><\/td><td style=\"text-align:left\">Examines &quot;real substance, practical reality and true nature&quot;, including post-contract performance below $190,100<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Contractor High Income Opt-Out (ss 15AB-15AC)<\/strong><\/td><td style=\"text-align:left\">$190,100 from 1 Jul 2026; <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FWC/2026/1104.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Crooks v Hyundai Rotem<\/em> [2026] FWC 1104<\/a><\/td><td style=\"text-align:left\">Valid written s 15AB opt-out preserves <em>Personnel Contracting<\/em> / <em>Jamsek<\/em> common-law contract primacy<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Genuine Corporate / Tripartite Structures<\/strong><\/td><td style=\"text-align:left\"><a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FWC/2026/1941.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Barakat v Grimshaw Architects<\/em> [2026] FWC 1941<\/a><\/td><td style=\"text-align:left\">Properly structured commercial entities exercising genuine business autonomy remain outside employment<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Sham Contracting Defence (FWA s 357(2))<\/strong><\/td><td style=\"text-align:left\">27 Feb 2024 ($364 penalty unit from 1 Jul 2026)<\/td><td style=\"text-align:left\">Principal must prove an objectively reasonable belief (replacing the former lenient &quot;not reckless&quot; defence)<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Sole-Trader Superannuation (SGAA s 12(3))<\/strong><\/td><td style=\"text-align:left\"><em>Superannuation Guarantee (Administration) Act 1992<\/em> (12% SG)<\/td><td style=\"text-align:left\">Individual ABN contractors paid wholly or principally for personal labour are still owed 12% super<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"the-190100-contractor-opt-out-gate-and-2025-2026\" class=\"doc-h2\">The $190,100 contractor opt-out gate and 2025-2026 FWC case law<\/h2>\n<p class=\"doc-p\">Parliament split the contractor rules along a statutory earnings line. Under FWA ss 15AB and 15AC, individuals earning above the Contractor High Income Threshold (indexed to $190,100 from 1 July 2026, up from $183,100) may give a written s 15AB opt-out notice electing for s 15AA not to apply. While an unrevoked opt-out notice sits on file, <em>Personnel Contracting<\/em> contract primacy continues to govern, as confirmed in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FWC/2026/1104.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Mr Amon John Crooks v Hyundai Rotem Company<\/em> [2026] FWC 1104<\/a> (13 July 2026).<\/p>\n<p class=\"doc-p\">Below $190,100 (or wherever no valid s 15AB notice exists), s 15AA governs in full. In <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FWC/2025/2219.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Ms Tabitha Dickerson v Kagura Games LLC<\/em> [2025] FWC 2219<\/a> (1 August 2025), a remote tester engaged under an independent contractor agreement won unfair dismissal reinstatement plus six months&#x27; backpay after the Commission looked past the contract wording to her daily supervision, fixed hourly pay, and lack of a standalone business. Conversely, genuine corporate or tripartite consulting structures carrying real commercial independence still stand up, as upheld in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FWC/2026/1941.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Mr Rafat Barakat v Grimshaw Architects Pty Ltd<\/em> [2026] FWC 1941<\/a>.<\/p>\n<h2 id=\"tightened-s-3572-sham-contracting-rules-remove-t\" class=\"doc-h2\">Tightened s 357(2) sham contracting rules remove the recklessness shield<\/h2>\n<p class=\"doc-p\">Misclassifying an employee also carries sharper penalty risk since FWA s 357(2) was amended on 27 February 2024. Previously, an employer defeated a sham contracting penalty claim simply by proving it was &quot;not reckless&quot; when presenting an ABN contract. Under current s 357(2), the employer must prove that when the representation was made, it reasonably believed the contract was a contract for services, assessed objectively against the enterprise&#x27;s size and any legal or HR advice actually obtained. Handing an unreviewed ABN template to a rostered cleaner, Pilates instructor, or NDIS worker leaves little room to plead reasonable belief against civil penalties calculated on the $364 penalty unit.<\/p>\n<h2 id=\"why-genuine-sole-trader-contractors-still-attrac\" class=\"doc-h2\">Why genuine sole-trader contractors still attract 12% superannuation under s 12(3)<\/h2>\n<p class=\"doc-p\">Even businesses that prove an individual ABN holder is a genuine contractor regularly get caught by s 12(3) of the <em>Superannuation Guarantee (Administration) Act 1992<\/em> (Cth) (SGAA). Under s 12(3), anyone working under a contract that is &quot;wholly or principally for the labour of the person&quot; is owed 12% compulsory superannuation just like an employee. Whenever an individual contracts under a personal sole-trader ABN, gets paid mainly for personal labour rather than heavy plant or materials, and cannot actively delegate the work, six years of unpaid superannuation plus non-deductible Superannuation Guarantee Charge (SGC) interest apply, tightened further by 7-business-day Payday Super rules from 1 July 2026.<\/p>\n<h2 id=\"workforce-audits-and-six-year-misclassification-\" class=\"doc-h2\">Workforce audits and six-year misclassification claims<\/h2>\n<p class=\"doc-p\">Modest invoice disputes or simple under-$50,000 award checks belong in our free Self-Help Award Calculator and Form 5 Small Claims guide. Park &amp; Co&#x27;s complex employment practice conducts B2B workforce audits for construction, cleaning, Pilates and fitness, NDIS, beauty, and logistics businesses restructuring ABN models or implementing s 15AB opt-outs above $190,100, and acts for long-term misclassified ABN workers pursuing six-year backpay, annual leave, and 12% superannuation claims exceeding $50,000 to $150,000+. Send your contract and sample invoices via the <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Employment Consultation Form<\/a> or visit the <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Official Links Hub<\/a>.<\/p>\n\n          <div class=\"col-sources-box\">\n            Primary Authorities: Fair Work Act 2009 (Cth) ss 15AA\u201315AC, 357(2) \u00b7 Superannuation Guarantee (Administration) Act 1992 s 12(3) \u00b7 Personnel Contracting [2022] HCA 1 \u00b7 Dickerson v Kagura Games [2025] FWC 2219 \u00b7 Crooks v Hyundai Rotem [2026] FWC 1104 \u00b7 Barakat [2026] FWC 1941.\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#F5C2C7;\">WHEN TO CONSULT PARK &amp; CO LAWYERS \u00b7 EMPLOYMENT<\/span>\n            <h3 class=\"col-cta-title\">Facing a 21-Day Dismissal Deadline, Corporate Audit, or &gt;$50,000 / s 550 Claim?<\/h3>\n            <p class=\"col-cta-desc\">For modest &lt;$50k wage shortfalls, self-calculating with our free Award Calculator and 208-formula Excel protects 100% of your payout. Once your matter involves a 21-day dismissal bar, sponsor defence, or &gt;$50k / s 550 director exposure, submit our online consultation form.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">Open Employment Consultation Form<\/a>\n              <a href=\"../../files/EN/PDF/02_Employment_Underpayment_Self_Calculation_and_Evidence_Manual_2026_EN.pdf\" download class=\"col-btn-ghost\">Download Manual 02 (Employment PDF)<\/a>\n              <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">Park &amp; Co Official Consultation Hub<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">Legal Disclaimer: This publication provides general legal information grounded in the Fair Work Act 2009 (Cth), superannuation/migration statutes and Australian court authorities current as at November 2026. It does not constitute legal advice or create a solicitor-client relationship. Strict 21-day FWC limits apply.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">More Curated Employment Law Columns<\/h3>\n        <a href=\"../../?lang=en&amp;tab=employment\" class=\"col-back-link num\">\u2190 Back to Employment Self-Help Hub<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../annualised-salary-setoff-audit-2026/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ANNUALISED SALARIES \u00b7 EMPLOYMENT 04<\/span><h4 class=\"col-sib-title\">Why Annualised Salary Set-Off Clauses Fail After Woolworths and Coles [2025] FCA 1092<\/h4><p class=\"col-sib-desc\">Why &#x27;all-in&#x27; salaries cannot average overtime across quiet weeks, how missing penalty records flip the onus onto employers, and when &gt;$50k recovery or B2B restructuring applies.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../director-accountant-liability-s550/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">DIRECTOR LIABILITY \u00b7 EMPLOYMENT 05<\/span><h4 class=\"col-sib-title\">Liquidating the Company Will Not Shield Directors or Accountants From s 550 Liability<\/h4><p class=\"col-sib-desc\">How FWA s 550 pierces insolvent corporate shells to reach directors, HR managers and external accountants who had actual knowledge of award breaches.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../sponsored-worker-dismissal-482-186/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">VISA WORKER DISMISSALS \u00b7 EMPLOYMENT 07<\/span><h4 class=\"col-sib-title\">Dismissed on a Subclass 482 Visa: Managing the 21-Day FWC Bar, 180-Day Mobility Rule and Deed Traps<\/h4><p class=\"col-sib-desc\">How to structure FWC settlement deeds around new SID 482 nominations without breaking Subclass 186 TRT qualifying service or triggering visa cancellation.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../executive-dismissal-general-protections-restraints/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">EXECUTIVES &amp; RESTRAINTS \u00b7 EMPLOYMENT 08<\/span><h4 class=\"col-sib-title\">Executive Dismissals Above $190,100, General Protections Myths and Post-Employment Restraints<\/h4><p class=\"col-sib-desc\">Dissects Barclay subjective causation under s 361, executive notice/bonus claims, Supreme Court injunction risks, and upcoming federal non-compete reforms.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}}</script>
  <script>
    (function () {
      const payload = JSON.parse(document.getElementById('col-payload').textContent);
      const root = document.getElementById('col-root');
      let cleanupScroll = null;

      function getLang() {
        const q = new URLSearchParams(window.location.search).get('lang');
        return q === 'en' ? 'en' : 'ko';
      }

      function bindTocSpy() {
        if (cleanupScroll) cleanupScroll();
        const links = Array.from(root.querySelectorAll('.col-toc-link'));
        if (!links.length) return;
        const targets = links
          .map((a) => document.getElementById(a.getAttribute('href').slice(1)))
          .filter(Boolean);
        function onScroll() {
          let activeIdx = 0;
          const offset = window.scrollY + 130;
          for (let i = 0; i < targets.length; i++) {
            if (targets[i].offsetTop <= offset) activeIdx = i;
          }
          links.forEach((a, idx) => a.classList.toggle('active', idx === activeIdx));
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        cleanupScroll = () => window.removeEventListener('scroll', onScroll);
        onScroll();
      }

      function render(lg) {
        const data = payload[lg] || payload.ko;
        document.documentElement.lang = lg;
        document.title = data.doc_title;

    var summaryLine = isEn
      ? (days.length + ' day(s) &middot; ' + fmt(sum[0]) + ' page views &middot; ' + fmt(sum[1]) + ' daily visitors (since ' + START + '; 1 daily visitor per browser).')
      : ('표시 구간 ' + days.length + '일 합계 &middot; 페이지 조회 ' + fmt(sum[0]) + '회 &middot; 일별 순방문자 ' + fmt(sum[1]) + '명 (' + START + ' 집계 시작 &middot; 하루 브라우저당 1회)');
    return svg + '<div class="vc-legend"><span><i class="vc-k-bar"></i>' + (isEn ? 'Page views' : '페이지 조회') + '</span>' +
      '<span><i class="vc-k-line"></i>' + (isEn ? 'Daily visitors' : '일별 순방문자') + '</span></div>' +
      '<p class="vc-sum">' + summaryLine + '</p>';
  }

  function loadTodayReferrers(dayKey) {
    if (liveTodayViews === 0 && liveTodayVis === 0) {
      return Promise.resolve({});
    }
    var out = {};
    var remaining = [];
    REF_BUCKETS.forEach(function (b) {
      if (typeof liveRefHints[b.id] === 'number') {
        out[b.id] = liveRefHints[b.id];
      } else {
        remaining.push(b);
      }
    });
    var firstSlice = remaining.slice(0, 6);
    var secondSlice = remaining.slice(6);
    return Promise.all(firstSlice.map(function (b) {
      return call('get', 'ref-' + b.id + '-' + dayKey).catch(function () { return 0; }).then(function (v) { out[b.id] = v || 0; });
    })).then(function () {
      return secondSlice.length ? delay(260) : Promise.resolve();
    }).then(function () {
      return Promise.all(secondSlice.map(function (b) {
        return call('get', 'ref-' + b.id + '-' + dayKey).catch(function () { return 0; }).then(function (v) { out[b.id] = v || 0; });
      }));
    }).then(function () {
      return out;
    });
  }

  function renderReferrerBox(countsMap) {
    var isEn = uiLang() === 'en';
    var items = REF_BUCKETS.map(function (b) {
      return { id: b.id, label: isEn ? b.en : b.ko, count: countsMap[b.id] || 0 };
    }).filter(function (x) { return x.count > 0; }).sort(function (a, b) { return b.count - a.count; });
    var totalRef = items.reduce(function (acc, x) { return acc + x.count; }, 0);
    var head = '<div class="vc-ref-title"><span>' +
      (isEn ? ('Today&rsquo;s Referral Channels (' + today + ')') : ('오늘 유입 채널 분포 (' + today + ')')) +
      '</span><small>' + (isEn ? ('Tracked visitors: ' + fmt(totalRef)) : ('채널 집계 방문자: ' + fmt(totalRef) + '명')) + '</small></div>';
    if (!items.length) {
      return head + '<p class="vc-ref-note">' +
        (isEn
          ? 'Anonymous referral channel buckets (Naver, Cafe, KakaoTalk, Threads, Hub, Direct) are recorded once per browser per day as new visits arrive (zero personal or URL path data stored).'
          : '익명 유입 경로(검색·카페·카카오톡·스레드·허브 이동 등) 집계는 신규 방문부터 하루 브라우저당 1회씩 기록돼요 (세부 URL·개인정보 미수집).') +
        '</p>';
    }
    var rowsHtml = items.map(function (item) {
      var pct = totalRef > 0 ? Math.round((item.count / totalRef) * 100) : 0;
      return '<div class="vc-ref-row">' +
        '<span class="vc-ref-name" title="' + item.label + '">' + item.label + '</span>' +
        '<div class="vc-ref-track"><div class="vc-ref-fill" style="width:' + Math.max(4, pct) + '%"></div></div>' +
        '<span class="vc-ref-val">' + fmt(item.count) + ' (' + pct + '%)</span>' +
        '</div>';
    }).join('');
    var note = isEn
      ? 'Privacy-safe coarse channel buckets only (1 per browser/day; zero IP, query string, or full referrer URL stored).'
      : '개인정보 보호형 채널 그룹 집계 (하루 브라우저당 1회 기준 &middot; 검색어·세부 URL·IP 미수집)';
    return head + '<div class="vc-ref-list">' + rowsHtml + '</div><p class="vc-ref-note">' + note + '</p>';
  }

  function loadHistoryRows(days) {
    var histCache = {};
    try { histCache = JSON.parse(localStorage.getItem(HIST_KEY) || '{}') || {}; } catch (e) {}
    var results = new Array(days.length);
    var pending = [];
    days.forEach(function (d, idx) {
      if (d < today && Array.isArray(histCache[d])) {
        results[idx] = histCache[d];
      } else if (d === today && typeof liveTodayViews === 'number' && typeof liveTodayVis === 'number') {
        results[idx] = [liveTodayViews, liveTodayVis];
      } else {
        pending.push({ d: d, idx: idx });
      }
    });

    var batchSize = pending.length > 7 ? 4 : 6;
    var pauseMs = pending.length > 7 ? 2900 : 180;
    var chain = Promise.resolve();
    for (var c = 0; c < pending.length; c += batchSize) {
      (function (slice, waitFirst) {
        chain = chain.then(function () {
          return (waitFirst ? delay(pauseMs) : Promise.resolve()).then(function () {
            return Promise.all(slice.map(function (item) {
              var k = item.d.replace(/-/g, '');
              var pViews = (item.d === today && typeof liveTodayViews === 'number')
                ? Promise.resolve(liveTodayViews)
                : call('get', 'day-' + k).catch(function () { return null; });
              var pVis = (item.d === today && typeof liveTodayVis === 'number')
                ? Promise.resolve(liveTodayVis)
                : call('get', 'vday-' + k).catch(function () { return null; });
              return Promise.all([pViews, pVis]).then(function (pair) {
                var v0 = pair[0] == null ? 0 : pair[0];
                var v1 = pair[1] == null ? 0 : pair[1];
                results[item.idx] = [v0, v1];
                if (item.d < today && pair[0] !== null && pair[1] !== null) {
                  histCache[item.d] = [v0, v1];
                }
              });
            }));
          });
        });
      })(pending.slice(c, c + batchSize), c > 0);
    }
    return chain.then(function () {
      try { localStorage.setItem(HIST_KEY, JSON.stringify(histCache)); } catch (e) {}
      return results.map(function (r) { return r || [0, 0]; });
    });
  }

  var cachedRefMap = null;

  function loadAndRenderModal(refreshRefs) {
    syncCounterLang();
    var isEn = uiLang() === 'en';
    var fullDays = lastDays(30);
    var days = activeRange === 7 ? lastDays(7) : fullDays;
    var body = modal.querySelector('.vc-body');
    var chartWaitMsg = isEn ? 'Loading daily statistics&hellip;' : '일별 통계를 불러오는 중이에요&hellip;';
    var refWaitMsg = isEn ? 'Loading today&rsquo;s referral channels&hellip;' : '오늘 유입 채널 집계를 불러오는 중이에요&hellip;';
    var existingRefHtml = (!refreshRefs && cachedRefMap) ? renderReferrerBox(cachedRefMap) : ('<div class="vc-ref-note">' + refWaitMsg + '</div>');

    /* Render toolbar, loading placeholder, referral box, and 1-click share bar IMMEDIATELY (0ms) */
    body.innerHTML = renderToolbar(isEn, fullDays.length) +
      '<div id="vc-chart-slot"><p class="vc-sum">' + chartWaitMsg + '</p></div>' +
      '<div id="vc-ref-box" class="vc-ref-box">' + existingRefHtml + '</div>' +
      renderShareBar(isEn);

    loadHistoryRows(days)
      .then(function (rows) {
        var slot = document.getElementById('vc-chart-slot');
        if (slot) slot.innerHTML = renderChartSvg(days, rows, uiLang() === 'en');
        if (!refreshRefs && cachedRefMap) return cachedRefMap;
        return delay(180).then(function () { return loadTodayReferrers(day); });
      })
      .then(function (refMap) {
        if (refMap) cachedRefMap = refMap;
        var refBox = document.getElementById('vc-ref-box');
        if (refBox && refMap) refBox.innerHTML = renderReferrerBox(refMap);
      })
      .catch(function () {
        var slot = document.getElementById('vc-chart-slot');
        if (slot && !slot.querySelector('svg')) {
          slot.textContent = uiLang() === 'en' ? 'Could not load the chart.' : '그래프를 불러오지 못했어요.';
        }
      });
  }

  function open() {
    activeRange = 7;
    modal.classList.add('open');
    loadAndRenderModal(true);
  }
  box.setAttribute('role', 'button');
  box.setAttribute('tabindex', '0');
  box.addEventListener('click', open);
  box.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
})();
  </script>
</body>
</html>
