-lbl\">\ube44\uc790 \uc2a4\ud3f0\uc11c\uc2ed \ub300\uac00 \uae08\ud488 \uc694\uad6c \ud615\uc0ac\ucc98\ubc8c (Migration Act s 245AR)<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">\uc774 \uce7c\ub7fc\uc758 \ubaa9\ucc28<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#\ud574\uace0-\ud1b5\ubcf4-\uc9c1\ud6c4-\ub3d9\uc2dc\uc5d0-\ub3cc\uc544\uac00\ub294-21\uc77c\uacfc-180\uc77c\uc758-\ub450-\uc2dc\uacc4\" class=\"col-toc-link lvl-2\">\ud574\uace0 \ud1b5\ubcf4 \uc9c1\ud6c4 \ub3d9\uc2dc\uc5d0 \ub3cc\uc544\uac00\ub294 21\uc77c\uacfc 180\uc77c\uc758 \ub450 \uc2dc\uacc4<\/a><a href=\"#condition-8607-\uac1c\uc815180\uc77c-\ub8f0\uc758-\uc9c4\uc9dc-\uc758\ubbf8\uc640-186-\uc601\uc8fc\uad8ctrt-\ub2e8\uc808\uc758-\ub36b\" class=\"col-toc-link lvl-2\">Condition 8607 \uac1c\uc815(180\uc77c \ub8f0)\uc758 \uc9c4\uc9dc \uc758\ubbf8\uc640 186 \uc601\uc8fc\uad8c(TRT) \ub2e8\uc808\uc758 \ub36b<\/a><a href=\"#\uacbd\uc601\uc0c1-\uc815\ub9ac\ud574\uace0redundancy-\ud56d\ubcc0\uc744-\ud754\ub4e0-2025\ub144-\uc5f0\ubc29\ub300\ubc95\uc6d0-\ud310\uacb0\" class=\"col-toc-link lvl-2\">\uacbd\uc601\uc0c1 \uc815\ub9ac\ud574\uace0(Redundancy) \ud56d\ubcc0\uc744 \ud754\ub4e0 2025\ub144 \uc5f0\ubc29\ub300\ubc95\uc6d0 \ud310\uacb0<\/a><a href=\"#\ube44\uc790-\ub9ac\ubca0\uc774\ud2b8\uc2a4\ud3f0\uc11c\uc2ed-\ub300\uac00-\uc694\uad6css-245ar245as\uc758-\uc591\ubc29\ud5a5-\ud3ed\ud0c4\" class=\"col-toc-link lvl-2\">\ube44\uc790 \ub9ac\ubca0\uc774\ud2b8\u00b7\uc2a4\ud3f0\uc11c\uc2ed \ub300\uac00 \uc694\uad6c(ss 245AR\u2013245AS)\uc758 \uc591\ubc29\ud5a5 \ud3ed\ud0c4<\/a><a href=\"#\ud654\ud574\ud569\uc758\uc11cdeed-of-release-\uc124\uacc4\uc640-\ub0b4-\uc0ac\uac74\uc5d0-\ub9de\ub294-\ub2e4\uc74c-\ub2e8\uacc4\" class=\"col-toc-link lvl-2\">\ud654\ud574\ud569\uc758\uc11c(Deed of Release) \uc124\uacc4\uc640 \ub0b4 \uc0ac\uac74\uc5d0 \ub9de\ub294 \ub2e4\uc74c \ub2e8\uacc4<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/221801513691854\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">\uace0\uc6a9\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../?lang=ko&amp;tab=employment\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 \uc9c1\uc7a5\u00b7\ubc00\ub9b0 \uc784\uae08 \uacc4\uc0b0\uae30\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">\uae08\uc694\uc77c \uc624\ud6c4 \uac11\uc790\uae30 \uc778\uc0ac\ud300 \ud68c\uc758\uc2e4\ub85c \ubd88\ub824 \uac00\uace4 \ud558\uc8e0. \uc190\uc5d0 \ub4e4\ub9b0 \uac74 \ud574\uace0 \ud1b5\uc9c0\uc11c \ud55c \uc7a5\ubfd0\uc774\uc5d0\uc694. \uc2dc\ubbfc\uad8c\uc790\uc5d0\uac8c \ud574\uace0\ub294 \ub2f9\uc7a5 \uc6d4\uae09\uacfc \uc774\uc9c1 \uac71\uc815\uc73c\ub85c \uadf8\uccd0\uc694. \ud558\uc9c0\ub9cc Subclass 482(TSS\u00b7SID)\ub098 Subclass 186 \uc2ec\uc0ac\ub97c \uae30\ub2e4\ub9ac\ub358 \ubd84\ub4e4\uc5d0\uac8c\ub294 \uccb4\ub958 \uc790\uaca9 \uc804\uccb4\uac00 \ud754\ub4e4\ub9ac\ub294 \ube44\uc0c1\uc0ac\ud0dc\uc608\uc694. \ud604\uc7a5\uc5d0\uc11c \ubd59\ub294 \ub9ce\uc740 \ubd84\uc774 \uc0c8 \uc2a4\ud3f0\uc11c \uad6c\ud558\uae30\uc5d0\ub9cc \uc628 \uc2e0\uacbd\uc744 \uc3df\uc73c\uc2dc\uac70\ub4e0\uc694. \uadf8\ub7ec\ub2e4 \uacf5\uc815\uadfc\ub85c\uc704\uc6d0\ud68c(FWC) \uc81c\uc18c \uc2dc\ud55c\uc744 \ud5c8\ubb34\ud558\uac8c \ub118\uaca8 \ubc84\ub824\uc694. \ubc18\ub300\ub85c \ube44\uc790 \uad6c\uc870\ub97c \ubaa8\ub974\ub294 \uc790\ubb38\ub9cc \ubbff\uace0 \uc704\ub85c\uae08 \uba87 \uc8fc \uce58\uc5d0 \ub3c4\uc7a5\uc744 \ucc0d\uc5c8\ub2e4\uac00 \uc601\uc8fc\uad8c \ub2e4\ub9ac\uac00 \ub04a\uae30\uae30\ub3c4 \ud558\uc8e0. \uc2a4\ud3f0\uc11c \ube44\uc790 \ud574\uace0 \uc0ac\uac74\uc740 \uccab\ub0a0\ubd80\ud130 \ub178\ub3d9\ubc95\uacfc \uc774\ubbfc\ubc95 \uc2dc\uacc4\ub97c \ud55c \ud310 \uc704\uc5d0\uc11c \ud568\uaed8 \uc77d\uc5b4\uc57c \ud480\ub824\uc694.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 366\" width=\"100%\" role=\"img\" aria-label=\"482\u00b7186 \ube44\uc790 \uadfc\ub85c\uc790 \ud574\uace0 \uc2dc \ub3d9\uc2dc\uc5d0 \ud750\ub974\ub294 3\ub300 \ubc95\uc801 \uc704\ud5d8 \uad6c\uac04\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"365\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">\uace0\uc6a9\ubc95 \u00d7 \uc774\ubbfc\ubc95 \ub3d9\uc2dc \uc791\ub3d9 \u00b7 \uc2a4\ud3f0\uc11c \ube44\uc790 \ud574\uace0 \uc774\uc911 \uc2dc\uacc4<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">482\u00b7186 \ube44\uc790 \uadfc\ub85c\uc790 \ud574\uace0 \uc2dc \ub3d9\uc2dc\uc5d0 \ud750\ub974\ub294 3\ub300 \ubc95\uc801 \uc704\ud5d8 \uad6c\uac04<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">\uadfc\uac70: FWA ss 389(2), 394(2) \u00b7 Helensburgh Coal [2025] HCA 29 \u00b7 Migration Regs cl 8607 \u00b7 ss 245AR\u2013245AS<\/text>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"36\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">CLOCK 01 \u00b7 \ub2e8 21\uc77c (\ub2ec\ub825\uc77c)<\/text>\n  <text x=\"36\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">FWC \ubd80\ub2f9\ud574\uace0\u00b7\uc77c\ubc18\ubcf4\ud638 \uc81c\uc18c<\/text>\n  <text x=\"36\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\">Helensburgh Coal [2025] HCA 29<\/text>\n  <line x1=\"36\" y1=\"182\" x2=\"272\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">\ud574\uace0 \ud6a8\ub825\uc77c\ub85c\ubd80\ud130 21\uc77c \ub0b4 \uc811\uc218 ($92.70)<\/text>\n  <text x=\"36\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc678\uc8fc \uc778\ub825 \uc720\uc9c0 \uc2dc \uc815\ub9ac\ud574\uace0 \ubb34\ud6a8 \uac00\ub2a5(HCA)<\/text>\n  <text x=\"36\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc77c\ubc29\uc801 \ud569\uc758\uc11c(Deed) \uc11c\uba85 \uc2dc \uccad\uad6c\uad8c \uc18c\uba78<\/text>\n  <text x=\"36\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\ud1f4\uc0ac \uc0ac\uc720\ub97c \uc790\ubc1c\uc801 \uc0ac\uc784\uc73c\ub85c \uc815\uc815 \ud611\uc0c1 \ud575\uc2ec<\/text>\n  <line x1=\"289\" y1=\"195\" x2=\"300\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"303,195 297,191 297,199\" fill=\"#1F242B\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"320\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">CLOCK 02 \u00b7 \uc5f0\uc18d 180\uc77c / \ucd1d 365\uc77c<\/text>\n  <text x=\"320\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">Condition 8607 \uc2a4\ud3f0\uc11c \ubcc0\uacbd<\/text>\n  <text x=\"320\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E5F\">Migration Regs Sch 8 cl 8607<\/text>\n  <line x1=\"320\" y1=\"182\" x2=\"556\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"320\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">\uace0\uc6a9 \uc885\ub8cc \ud6c4 \ucd5c\ub300 180\uc77c\uac04 \ud0c0 \uc9c1\uc7a5 \uadfc\ubb34 \ud5c8\uc6a9<\/text>\n  <text x=\"320\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc804\uccb4 \ube44\uc790 \uae30\uac04 \uc911 \ub204\uc801 365\uc77c \uc0c1\ud55c \uc5c4\uc218<\/text>\n  <text x=\"320\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc8fc\uc758: \ubb34\uc2a4\ud3f0\uc11c \uacf5\ubc31\uae30\ub294 186 TRT \uacbd\ub825 \ub2e8\uc808<\/text>\n  <text x=\"320\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc0c8 SID 482 \ub178\ubbf8\ub124\uc774\uc158 \uc811\uc218 \uc2dc\uc810 \uc815\ubc00 \uc5f0\ub3d9<\/text>\n  <line x1=\"573\" y1=\"195\" x2=\"584\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"587,195 581,191 581,199\" fill=\"#1F242B\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FEF8EC\" stroke=\"#9A6700\" stroke-width=\"1.3\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#9A6700\"/>\n  <text x=\"604\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">TRAP 03 \u00b7 \ubd88\ubc95 \ube44\uc790 \ub300\uac00<\/text>\n  <text x=\"604\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">\uc2a4\ud3f0\uc11c\uc2ed \uae08\ud488 \uc218\uc218 \uc591\ubc8c \uaddc\uc815<\/text>\n  <text x=\"604\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#9A6700\">Migration Act ss 245AR\u2013245AS \u00b7 s 116<\/text>\n  <line x1=\"604\" y1=\"182\" x2=\"840\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"604\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">\uc694\uad6c\u00b7\uc218\ub839(s 245AR): \uc9d5\uc5ed 2\ub144 / $131,040 \ubc8c\uae08<\/text>\n  <text x=\"604\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc81c\uc548\u00b7\uc9c0\uae09(s 245AS): $87,360 \uacfc\ud0dc\ub8cc \uc8fc\uc758<\/text>\n  <text x=\"604\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uacf5\ubaa8 \uc2dc reg 2.43(1)(la) \ube44\uc790 \uc9c1\uad8c \ucde8\uc18c \uc704\ud5d8<\/text>\n  <text x=\"604\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">\uc774\ubbfc\u00b7\uace0\uc6a9 \ud1b5\ud569 \uc790\ubb38\uc73c\ub85c \uc790\ubc31 \ub9ac\uc2a4\ud06c \ucc28\ub2e8<\/text>\n  <rect x=\"22\" y=\"312\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#FEF8EC\" stroke=\"#ECD9B0\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"335\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">\ud575\uc2ec \uc6d0\uce59: \uc774\ubbfc \ubc95\ubb34\uc0ac\ub294 FWC \ud569\uc758\uc11c\ub97c \ubabb \ub2e4\ub8e8\uace0 \uc77c\ubc18 \ub178\ub3d9 \ubcc0\ud638\uc0ac\ub294 186 \uc601\uc8fc\uad8c \ub2e8\uc808\uc744 \ub193\uce69\ub2c8\ub2e4. \ub450 \uc2dc\uacc4\ub97c \ud55c \ud14c\uc774\ube14\uc5d0\uc11c \ubb36\uc5b4\uc57c \ud569\ub2c8\ub2e4.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">\ub3c4\ud45c 1: \uc2a4\ud3f0\uc11c \ube44\uc790 \ud574\uace0 \uc9c1\ud6c4 \ub3d9\uc2dc\uc5d0 \uc791\ub3d9\ud558\ub294 21\uc77c FWC \uae30\ud55c\uacfc 180\uc77c \ube44\uc790 \uc2dc\uacc4<\/figcaption><\/figure>\n<h2 id=\"\ud574\uace0-\ud1b5\ubcf4-\uc9c1\ud6c4-\ub3d9\uc2dc\uc5d0-\ub3cc\uc544\uac00\ub294-21\uc77c\uacfc-180\uc77c\uc758-\ub450-\uc2dc\uacc4\" class=\"doc-h2\">\ud574\uace0 \ud1b5\ubcf4 \uc9c1\ud6c4 \ub3d9\uc2dc\uc5d0 \ub3cc\uc544\uac00\ub294 21\uc77c\uacfc 180\uc77c\uc758 \ub450 \uc2dc\uacc4<\/h2>\n<p class=\"doc-p\">\ud574\uace0 \ud6a8\ub825\uc774 \ubc1c\uc0dd\ud55c \ub0a0 \uc790\uc815\ubd80\ud130 \ub450 \uac1c\uc758 \ubc95\uc815 \uc2dc\uacc4\uac00 \uc6c0\uc9c1\uc774\uae30 \uc2dc\uc791\ud574\uc694. \uccab\uc9f8\ub294 \uacf5\uc815\uadfc\ub85c\ubc95(Fair Work Act 2009, FWA)\uc774 \uc815\ud55c \ub2ec\ub825 \uae30\uc900 \ub531 21\uc77c \uae30\ud55c\uc774\uc5d0\uc694. \ubd80\ub2f9\ud574\uace0 \uad6c\uc81c \uc2e0\uccad(s 394(2), Form F2)\uacfc \uc77c\ubc18\ubcf4\ud638 \ud574\uace0 \ubd84\uc7c1 \uc2e0\uccad(s 366(1), Form F8) \ubaa8\ub450 \ud574\uace0 \ud6a8\ub825\uc77c\ub85c\ubd80\ud130 \uc8fc\ub9d0\u00b7\uacf5\ud734\uc77c\uc744 \ud3ec\ud568\ud574 21\uc77c \uc548\uc5d0 \uc811\uc218\ud574\uc57c \ud574\uc694. 2026\u201327 \ud68c\uacc4\uc5f0\ub3c4 \uae30\uc900 FWC \uc811\uc218 \uc218\uc218\ub8cc\ub294 $92.70\uc73c\ub85c \ubb38\ud131\uc774 \uc544\uc8fc \ub0ae\uc544\uc694. \ud558\uc9c0\ub9cc \uae30\ud55c \uacc4\uc0b0\ub9cc\ud07c\uc740 \uce7c\ub0a0\ucc98\ub7fc \ub0c9\uc815\ud558\uc8e0.<\/p>\n<p class=\"doc-p\">\ud558\ub8e8\ub77c\ub3c4 \ub2a6\uc73c\uba74 \uacb0\uacfc\ub294 \uce58\uba85\uc801\uc774\uc5d0\uc694. \uc9c0\uac01 \uc811\uc218\ub294 \uac70\uc758 \uad6c\uc81c\ubc1b\uc9c0 \ubabb\ud574\uc694. \ubc95\uc774 \uc815\ud55c \uadf9\ud788 \uc608\uc678\uc801\uc778 \uc0ac\uc815(exceptional circumstances)\uc744 \uc785\uc99d\ud558\uc9c0 \ubabb\ud558\uba74 \uc2e0\uccad\uc11c \uc790\uccb4\uac00 \uace7\uc7a5 \uac01\ud558\ub418\uac70\ub4e0\uc694. \ube44\uc790 \ubb38\uc81c\ub85c \uacbd\ud669\uc774 \uc5c6\uc5c8\ub2e4\ub294 \uc0ac\uc815\uc740 FWC\uc5d0\uc11c \ud1b5\ud558\uc9c0 \uc54a\uc544\uc694. \uc0ac\ub0b4 \uc7ac\uc2ec \uba54\uc77c \ub2f5\uc7a5\uc744 \uae30\ub2e4\ub9ac\ub290\ub77c 3\uc8fc\ub97c \ud758\ub824\ubcf4\ub0b4\ub294 \uc2e4\uc218\ub3c4 \uc815\ub9d0 \ud754\ud558\uc8e0. \uc77c\ub2e8 21\uc77c \uc548\uc5d0 \uc2e0\uccad\uc11c\ub97c \ub123\uc5b4 \ud611\uc0c1 \uc9c0\ub81b\ub300\ub97c \uc950\uc5b4\uc57c \uace0\uc6a9\uc8fc\ub3c4 \ube44\ub85c\uc18c \ud569\uc758 \ud14c\uc774\ube14\uc5d0 \ub098\uc640\uc694.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"4\"><thead><tr><th style=\"text-align:left\">\uc810\uac80 \ud56d\ubaa9<\/th><th style=\"text-align:left\">\uadfc\uac70 \ubc95\ub839 \ubc0f \ud310\ub840<\/th><th style=\"text-align:left\">\ud575\uc2ec \uae30\ud55c\u00b7\uc218\uce58<\/th><th style=\"text-align:left\">\uc2a4\ud3f0\uc11c \ube44\uc790 \uadfc\ub85c\uc790 \uc2e4\ubb34 \ud568\uc815<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>FWC \uad6c\uc81c \uc2e0\uccad<\/strong><\/td><td style=\"text-align:left\">FWA s 394(2) (Form F2) \u00b7 s 366(1) (Form F8)<\/td><td style=\"text-align:left\">\ud574\uace0 \ud6a8\ub825\uc77c \ud6c4 \ub2ec\ub825 21\uc77c ($92.70)<\/td><td style=\"text-align:left\">\uc0ac\ub0b4 \ud56d\uc758 \ub2f5\ubcc0\ub9cc \uae30\ub2e4\ub9ac\ub2e4 \ub3c4\uacfc \uc2dc \ud611\uc0c1 \uce74\ub4dc \uc0c1\uc2e4<\/td><\/tr><tr><td style=\"text-align:left\"><strong>482 \uc720\uc608\uae30\uac04<\/strong><\/td><td style=\"text-align:left\">Migration Regulations 1994 Sch 8 cl 8607 (F2024L00810)<\/td><td style=\"text-align:left\">1\ud68c \uc5f0\uc18d 180\uc77c \u00b7 \ud1b5\uc0b0 365\uc77c<\/td><td style=\"text-align:left\">\ud0c0 \uc9c1\uc7a5 \ub2e8\uae30 \uadfc\ubb34\ub294 \ud569\ubc95\uc774\ub098 \ub178\ubbf8\ub124\uc774\uc158 \uacf5\ubc31 \uc8fc\uc758<\/td><\/tr><tr><td style=\"text-align:left\"><strong>186 \uc601\uc8fc\uad8c \uc5f0\uacc4<\/strong><\/td><td style=\"text-align:left\">Migration Regulations 1994 reg 5.19 \u00b7 186 TRT<\/td><td style=\"text-align:left\">\ucd5c\uadfc 3\ub144 \uc911 2\ub144 \uc2a4\ud3f0\uc11c \uc815\uaddc\uc9c1<\/td><td style=\"text-align:left\">\uc0c8 SID 482 \ub178\ubbf8\ub124\uc774\uc158 \uc804 \uadfc\ubb34\ub294 \uacbd\ub825 \ud569\uc0b0 \uc81c\uc678 \uc704\ud5d8<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc815\ub9ac\ud574\uace0 \uc2ec\uc0ac<\/strong><\/td><td style=\"text-align:left\">FWA s 389(2) \u00b7 <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2025/29.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Helensburgh Coal<\/em> [2025] HCA 29<\/a><\/td><td style=\"text-align:left\">\uc7ac\ubc30\uce58 \uac00\ub2a5\uc131 \uac1d\uad00 \uc2ec\uc0ac<\/td><td style=\"text-align:left\">\uc678\uc8fc \uc778\ub825 \ucd95\uc18c \ud6c4 \ub0b4\ubd80 \uc7ac\ubc30\uce58 \uac00\ub2a5\uc131\uae4c\uc9c0 \uc9c1\uc811 \uc2ec\ub9ac<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\uc2a4\ud3f0\uc11c\uc2ed \uae08\ud488 \uae08\uc9c0<\/strong><\/td><td style=\"text-align:left\">Migration Act 1958 ss 245AR\u2013245AS \u00b7 FWA s 325<\/td><td style=\"text-align:left\">\uc9d5\uc5ed 2\ub144 / $131,040 \u00b7 $87,360 + \ucde8\uc18c<\/td><td style=\"text-align:left\">\uc11c\uba74 \ubb34\ubc29\ube44 \uc790\ubc31 \uc2dc \ubcf8\uc778\ub3c4 s 116(1)(g) \ucde8\uc18c \ub178\ucd9c<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"condition-8607-\uac1c\uc815180\uc77c-\ub8f0\uc758-\uc9c4\uc9dc-\uc758\ubbf8\uc640-186-\uc601\uc8fc\uad8ctrt-\ub2e8\uc808\uc758-\ub36b\" class=\"doc-h2\">Condition 8607 \uac1c\uc815(180\uc77c \ub8f0)\uc758 \uc9c4\uc9dc \uc758\ubbf8\uc640 186 \uc601\uc8fc\uad8c(TRT) \ub2e8\uc808\uc758 \ub36b<\/h2>\n<p class=\"doc-p\">\ub450 \ubc88\uc9f8 \uc2dc\uacc4\ub294 \ube44\uc790\uc5d0 \ubd99\uc740 Condition 8607(cl 8607) \ucde8\uc5c5 \uc870\uac74\uc774\uc5d0\uc694. \uc608\uc804 60\uc77c \uaddc\uc815\uc744 \ub5a0\uc62c\ub9ac\ub294 \ubd84\ub4e4\uc774 \uc544\uc9c1 \ub9ce\uc73c\uc2e0\ub370\uc694. 2024\ub144 7\uc6d4 1\uc77c \ubc1c\ud6a8\ub41c \uac1c\uc815 \uace0\uc2dc(F2024L00810)\ub85c \uc228\ud1b5\uc774 \ud2b8\uc600\uc5b4\uc694. \uc774\uc81c Subclass 482 \uc18c\uc9c0\uc790\ub294 \ud1f4\uc0ac \ud6c4 1\ud68c \uc5f0\uc18d \ucd5c\ub300 180\uc77c(\ube44\uc790 \uc804\uccb4 \uae30\uac04 \ub204\uc801 365\uc77c) \ub3d9\uc548 \ud638\uc8fc\uc5d0 \ud569\ubc95 \uccb4\ub958\ud558\uba70 \uc0c8 \ub178\ubbf8\ub124\uc774\uc158\uc774\ub098 \ub2e4\ub978 \ube44\uc790\ub97c \uc900\ube44\ud560 \uc218 \uc788\uc5b4\uc694. \uac8c\ub2e4\uac00 \uc774 180\uc77c \ub3d9\uc548\uc5d0\ub294 \uc0dd\uacc4\ub97c \uc704\ud574 \uc2a4\ud3f0\uc11c \uc678 \ub2e4\ub978 \uace0\uc6a9\uc8fc \ubc11\uc5d0\uc11c \uc77c\ud558\ub294 \uac83\ub3c4 \ud569\ubc95\uc774\uc5d0\uc694.<\/p>\n<p class=\"doc-p\">\uadf8\ub807\ub2e4\uace0 180\uc77c \ub0b4\ub0b4 \ub9c8\uc74c \ub193\uace0 \ub2e8\uae30 \uc77c\uc790\ub9ac\ub9cc \ub6f0\uc5b4\ub3c4 \ub420\uae4c\uc694? \uc808\ub300 \uadf8\ub807\uc9c0 \uc54a\uc544\uc694. \uc601\uc8fc\uad8c\uc744 \uc900\ube44\ud558\ub358 \ubd84\ub4e4\uc774 \ubc14\ub85c \uc5ec\uae30\uc11c \uc4f0\ub77c\ub9ac\uac8c \ubc1c\ubaa9\uc744 \uc7a1\ud600\uc694. \ube44\uc790\uac00 \ub2f9\uc7a5 \ucde8\uc18c\ub418\uc9c0\ub294 \uc54a\ub354\ub77c\ub3c4 \uc2b9\uc778\ub41c \ub178\ubbf8\ub124\uc774\uc158 \uc5c6\uc774 \ub2e4\ub978 \uacf3\uc5d0\uc11c \uc77c\ud55c \uae30\uac04\uc740 Subclass 186 TRT \uc601\uc8fc\uad8c \uc804\ud658\uc744 \uc704\ud55c \uc2a4\ud3f0\uc11c \uadfc\uc18d \uc0b0\uc815\uc5d0\uc11c \ube60\uc838 \ubc84\ub9ac\uac70\ub4e0\uc694. \uc774\ubbf8 186 \uc2e0\uccad\uc11c\ub97c \uc811\uc218\ud574 \ub454 \uc0c1\ud0dc\uc5d0\uc11c \ud574\uace0\ub410\ub2e4\uba74 \uc0c1\ud669\uc740 \ub354\uc6b1 \uae09\ubc15\ud574\uc838\uc694. \uc804 \uace0\uc6a9\uc8fc\uac00 \ub0b4\ubb34\ubd80\uc5d0 \ud6c4\uc6d0 \ucca0\ud68c\ub97c \ud1b5\ubcf4\ud558\ub294 \uc21c\uac04 \uc9c4\ud589 \uc911\uc774\ub358 \uc601\uc8fc\uad8c \uc2ec\uc0ac\uc758 \ubfcc\ub9ac\uac00 \ud754\ub4e4\ub9ac\uae30 \ub54c\ubb38\uc774\uc8e0.<\/p>\n<h2 id=\"\uacbd\uc601\uc0c1-\uc815\ub9ac\ud574\uace0redundancy-\ud56d\ubcc0\uc744-\ud754\ub4e0-2025\ub144-\uc5f0\ubc29\ub300\ubc95\uc6d0-\ud310\uacb0\" class=\"doc-h2\">\uacbd\uc601\uc0c1 \uc815\ub9ac\ud574\uace0(Redundancy) \ud56d\ubcc0\uc744 \ud754\ub4e0 2025\ub144 \uc5f0\ubc29\ub300\ubc95\uc6d0 \ud310\uacb0<\/h2>\n<p class=\"doc-p\">\ud68c\uc0ac\uac00 \uc2a4\ud3f0\uc11c \ube44\uc790 \uc9c1\uc6d0\uc744 \ub0b4\ubcf4\ub0bc \ub54c \uac00\uc7a5 \uc990\uaca8 \uc4f0\ub294 \uba85\ubd84\uc740 \uacbd\uc601\uc0c1 \uc815\ub9ac\ud574\uace0(Genuine Redundancy)\uc608\uc694. \ub9e4\ucd9c \uac10\uc18c\ub85c \uc9c1\ubb34\uac00 \uc0ac\ub77c\uc84c\ub2e4\uace0 \ub458\ub7ec\ub300\uba74 \ubd80\ub2f9\ud574\uace0 \uc2ec\uc0ac\ub97c \ud53c\ud560 \uc218 \uc788\ub2e4\uace0 \ubbff\uac70\ub4e0\uc694. \uc2e4\uc81c\ub85c FWA s 389 \uc694\uac74\uc744 \ubaa8\ub450 \uac16\ucd94\uba74 \ubd80\ub2f9\ud574\uace0 \uad00\ud560\uc5d0\uc11c \uc81c\uc678\ub3fc\uc694. \ud558\uc9c0\ub9cc \ud68c\uc0ac\uac00 \uc815\ub9ac\ud574\uace0 \uc774\ub984\ud45c\ub9cc \ubd99\uc600\ub2e4\uace0 \ubc95\uc6d0\uc774 \uadf8\ub300\ub85c \ubbff\uc5b4 \uc8fc\uc9c0\ub294 \uc54a\uc544\uc694.<\/p>\n<p class=\"doc-p\">2025\ub144 8\uc6d4 6\uc77c \uc5f0\ubc29\ub300\ubc95\uc6d0\uc774 \uc804\uc6d0\uc77c\uce58\ub85c \uc120\uace0\ud55c <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2025/29.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Helensburgh Coal Pty Ltd v Bartley<\/em> [2025] HCA 29<\/a> \ud310\uacb0\uc774 \ud310\ub3c4\ub97c \ubc14\uafd4 \ub193\uc558\uc5b4\uc694. \ud575\uc2ec \uc7c1\uc810\uc740 \uc678\uc8fc \uc778\ub825\uc774\uc5c8\uc8e0. \uad11\uc0b0 \ud68c\uc0ac\uac00 \uc815\uaddc\uc9c1\uc744 \uc815\ub9ac\ud574\uace0\ud558\uba74\uc11c\ub3c4 \ud604\uc7a5 \uc5c5\ubb34\ub97c \uc678\uc8fc \ub3c4\uae09 \uc778\ub825(external contractors)\uc5d0\uac8c \uadf8\ub300\ub85c \ub9e1\uae34 \uc0ac\uac74\uc774\uc5c8\uac70\ub4e0\uc694. \uc5f0\ubc29\ub300\ubc95\uc6d0\uc740 FWA s 389(2) \uc7ac\ubc30\uce58 \uc2ec\uc0ac\ub97c \ud560 \ub54c FWC\uac00 \uc678\uc8fc \uc778\ub825\uc744 \uc904\uc774\uace0 \uadf8 \uc5c5\ubb34\ub97c \uc0ac\ub0b4\ub85c \uac70\ub46c\ub4e4\uc5ec \ud574\uace0 \ub300\uc0c1 \uc9c1\uc6d0\uc744 \uc7ac\ubc30\uce58\ud560 \uc218 \uc788\uc5c8\ub294\uc9c0\uae4c\uc9c0 \uc9c1\uc811 \ub530\uc9c8 \uad8c\ud55c\uc774 \uc788\ub2e4\uace0 \ud310\uc2dc\ud588\uc5b4\uc694. \uc815\uc9c1\uc6d0\uc744 \uc790\ub978 \uc790\ub9ac\uc5d0 ABN \uc678\uc8fc \uc778\ub825\uc744 \ucc44\uc6b0\ub294 \uad6c\uc870\uc870\uc815\uc740 \uc774\uc81c \ud1b5\ud558\uc9c0 \uc54a\uc544\uc694.<\/p>\n<h2 id=\"\ube44\uc790-\ub9ac\ubca0\uc774\ud2b8\uc2a4\ud3f0\uc11c\uc2ed-\ub300\uac00-\uc694\uad6css-245ar245as\uc758-\uc591\ubc29\ud5a5-\ud3ed\ud0c4\" class=\"doc-h2\">\ube44\uc790 \ub9ac\ubca0\uc774\ud2b8\u00b7\uc2a4\ud3f0\uc11c\uc2ed \ub300\uac00 \uc694\uad6c(ss 245AR\u2013245AS)\uc758 \uc591\ubc29\ud5a5 \ud3ed\ud0c4<\/h2>\n<p class=\"doc-p\">\ud574\uace0 \uc0c1\ub2f4\uc5d0\uc11c \uac00\uc7a5 \uc544\uc2ac\uc544\uc2ac\ud55c \ub1cc\uad00\uc740 \ube44\uc790 \ub300\uac00 \uc9c0\uae09\uc774\ub098 \uae09\uc5ec \ud398\uc774\ubc31(cashback) \ubb38\uc81c\uc608\uc694. \uc2a4\ud3f0\uc11c\uc2ed \uc870\uac74\uc73c\ub85c \uc0ac\uc7a5\uc5d0\uac8c \ud604\uae08\uc744 \uac74\ub138\ub358 \uc77c\uc744 \uc5b5\uc6b8\ud55c \ub9c8\uc74c\uc5d0 FWC \uc2e0\uccad\uc11c\uc5d0 \ub365\uc11d \uc801\uc5b4 \ub123\ub294 \ubd84\ub4e4\uc774 \uacc4\uc138\uc694. \uadf8 \uc21c\uac04 \uba48\ucdb0 \uc11c\uc57c \ud574\uc694.<\/p>\n<p class=\"doc-p\">\uc774\ubbfc\ubc95(Migration Act 1958) ss 245AR\u2013245AS\uc640 FWA s 325\ub294 \uc2a4\ud3f0\uc11c\uc2ed \ub300\uac00 \uac70\ub798\ub97c \uc591\ubc29\ud5a5\uc73c\ub85c \ucc98\ubc8c\ud558\uac70\ub4e0\uc694. \ub300\uac00\ub97c \uc694\uad6c\ud558\uac70\ub098 \ubc1b\uc740 \uce21(s 245AR)\uc740 \ucd5c\uace0 \uc9d5\uc5ed 2\ub144 \ub610\ub294 \uc5f0\ubc29 \ubc8c\uae08\ub2e8\uc704($364) \uae30\uc900 \uac1c\uc778 \ud615\uc0ac\ubc8c\uae08 \ucd5c\ub300 $131,040\uc5d0 \ucc98\ud574\uc838\uc694. \uadf8\ub7f0\ub370 \ub3c8\uc744 \uac74\ub128 \uadfc\ub85c\uc790(s 245AS)\uc5d0\uac8c\ub3c4 \ucd5c\ub300 $87,360 \ubbfc\uc0ac \uc81c\uc7ac\uae08\uacfc \uc774\ubbfc\ubc95 s 116(1)(g) \ubc0f reg 2.43(1)(la) \ube44\uc790 \ucde8\uc18c \uc0ac\uc720\ub77c\ub294 \ubd88\ub625\uc774 \ud280\uc5b4\uc694. \uac15\uc694 \ud53c\ud574 \uc815\ud669\uc774\ub77c\ub294 \ubc29\uc5b4 \ub17c\ub9ac \uc5c6\uc774 \uc11c\uba74\uc5d0 \uc790\ubc31\ubd80\ud130 \ub0a8\uae30\uba74 \ub0b4 \uccb4\ub958 \uc790\uaca9\uc774 \uba3c\uc800 \ub2e4\uce60 \uc218 \uc788\uc5b4\uc694.<\/p>\n<h2 id=\"\ud654\ud574\ud569\uc758\uc11cdeed-of-release-\uc124\uacc4\uc640-\ub0b4-\uc0ac\uac74\uc5d0-\ub9de\ub294-\ub2e4\uc74c-\ub2e8\uacc4\" class=\"doc-h2\">\ud654\ud574\ud569\uc758\uc11c(Deed of Release) \uc124\uacc4\uc640 \ub0b4 \uc0ac\uac74\uc5d0 \ub9de\ub294 \ub2e4\uc74c \ub2e8\uacc4<\/h2>\n<p class=\"doc-p\">\uc65c \ub178\ub3d9\ubc95 \ubcc0\ud638\uc0ac\ub098 \uc774\ubbfc \ubc95\ubb34\uc0ac \ud55c\ucabd\ub9cc\uc73c\ub85c\ub294 \uc548\uc804\ud55c \ucd9c\uad6c\ub97c \ubabb \ub9cc\ub4e4\uae4c\uc694? \uc774\ubbfc \ubc95\ubb34\uc0ac\ub294 FWC \uc870\uc815\uae30\uc77c\uc5d0\uc11c \ud654\ud574\ud569\uc758\uc11c(Deed of Release)\ub97c \ub300\ub9ac \ud611\uc0c1\ud560 \uad8c\ud55c\uc774 \uc5c6\uc5b4\uc694. \ubc18\ub300\ub85c \ube44\uc790 \uc2e4\ubb34\ub97c \ubaa8\ub974\ub294 \ubcc0\ud638\uc0ac\ub294 \ud569\uc758\uae08 \uba87\ucc9c \ubd88\ub9cc \ucc59\uae30\ub2e4 \ud1f4\uc0ac \uc77c\uc790\uc640 \uc0ac\uc720 \uae30\ub85d\uc744 \uc5b4\uae0b\ub098\uac8c \ud569\uc758\ud558\uace4 \ud558\uc8e0.<\/p>\n<p class=\"doc-p\">\uc2a4\ud3f0\uc11c \ube44\uc790 \uadfc\ub85c\uc790\uc758 \ud569\uc758\uc11c\ub294 \uc77c\ubc29 \ud574\uace0\ub97c \ud569\uc758 \uc0ac\uc9c1(resignation)\uc73c\ub85c \ubc14\uafb8\uace0 \uc911\ub9bd\uc801 \uc7ac\uc9c1\uc99d\uba85\uc11c(Statement of Service)\ub97c \ud655\ubcf4\ud574\uc57c \uc81c\uac12\uc744 \ud574\uc694. \uc720\uae09 \uc608\uace0\uae30\uac04\uc744 \uc870\uc728\ud574 \uacf5\uc2dd \ud1f4\uc0ac\uc77c\uc744 \uc0c8 SID 482 \ub178\ubbf8\ub124\uc774\uc158 \ubc0f 186 TRT \ud0c0\uc784\ub77c\uc778\uc5d0 \ub9de\ucd94\uace0 \uc591\uce21\uc5d0 \ub3c5\uc774 \ub420 \uc704\ubc18 \uc2dc\uc778 \ubb38\uad6c\ub3c4 \ub35c\uc5b4\ub0b4\uc57c \ud558\uc8e0. 21\uc77c \uc2dc\uacc4\uc640 \ube44\uc790 \uacbd\ub825\uc774 \uc5bd\ud78c \ubcf5\uc7a1\ud55c \uc0ac\uac74\uc774\ub77c\uba74 \ud63c\uc790 \uc11c\uba85\ud558\uc9c0 \ub9c8\uc138\uc694. \ubc15\uc564\ucf54 \uace0\uc6a9\ubc95 \uc804\uc6a9 \uc9c8\ubb38\uc9c0(<a href=\"https://form.jotform.com/221801513691854\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\uace0\uc6a9\u00b7\ud574\uace0 \uc0ac\uc548 \uc811\uc218 \ubc14\ub85c\uac00\uae30<\/a>)\ub098 \uacf5\uc2dd \ucc3d\uad6c(<a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">\ubc15\uc564\ucf54 \uacf5\uc2dd \ub9c1\ud06c \ud5c8\ube0c<\/a>)\ub85c \ud574\uace0\uc77c\uacfc \ube44\uc790 \ud604\ud669\uc744 \ub0a8\uaca8 \uc8fc\uc138\uc694. \uacf5\uc778 \uc774\ubbfc\ubc95 \uc804\ubb38\ubcc0\ud638\uc0ac(QLS) \uc2dc\uac01\uacfc \uacf5\uc815\uadfc\ub85c\ubc95 \uc2e4\ubb34\ub97c \uacb0\ud569\ud574 \ube44\uc790\uc640 \ubcf4\uc0c1\uc744 \ud568\uaed8 \uc9c0\ud0a4\ub294 \ud574\ubc95\uc744 \uc9da\uc5b4 \ub4dc\ub9b4\uac8c\uc694.<\/p>\n\n          <div class=\"col-sources-box\">\n            \uadfc\uac70 \ubc95\ub839 \ubc0f \ud310\ub840: Fair Work Act 2009 ss 325, 366(1), 389(2), 394(2) \u00b7 Helensburgh Coal Pty Ltd v Bartley [2025] HCA 29 \u00b7 Migration Act 1958 ss 116(1)(g), 245AR\u2013245AS \u00b7 Migration Regulations 1994 reg 2.43(1)(la), Sch 8 cl 8607 (F2024L00810).\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#E6C98C;\">\ud63c\uc790 \uc9c4\ud589\uc744 \uba48\ucd94\uace0 \ubcc0\ud638\uc0ac\ub97c \ucc3e\uc544\uc57c \ud558\ub294 \uc21c\uac04<\/span>\n            <h3 class=\"col-cta-title\">\ud68c\uc0ac \uae09\uc5ec\u00b7\uacc4\uc57d\uc11c \uc810\uac80, \ud574\uace0 21\uc77c \ub9c8\uac10 \uae30\ud55c, \ub610\ub294 \uc9c1\uc811 \uacc4\uc0b0\uc744 \ub9c8\uce5c $50,000 \uc774\uc0c1 \ubbf8\uc9c0\uae09 \uc0ac\uac74\uc785\ub2c8\uae4c?<\/h3>\n            <p class=\"col-cta-desc\">$50,000 \ubbf8\ub9cc\uc758 \uc77c\ubc18 \ubc00\ub9b0 \uae09\uc5ec\ub294 \ud3ec\ud138 \ubb34\ub8cc \uacc4\uc0b0\uae30\uc640 208\uc218\uc2dd \uc5d1\uc140\ub85c \uc9c1\uc811 \uacc4\uc0b0\ud574 \uccad\uad6c\ud558\uc154\uc57c \ubc1b\uc73c\uc2e4 \ub3c8\ubcf4\ub2e4 \ubcc0\ud638\uc0ac\ube44\uac00 \ub354 \ucee4\uc9c0\ub294 \uc77c\uc744 \ub9c9\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \ubc18\uba74 \ud574\uace0 \ud6c4 21\uc77c \uae30\ud55c\uc774 \uc784\ubc15\ud588\uac70\ub098 \ud68c\uc0ac \uc2a4\ud3f0\uc11c\uc2ed \ubc29\uc5b4\u00b7$50,000 \uc774\uc0c1 \uace0\uc561 \uccad\uad6c\u00b7\ud3d0\uc5c5 \ub300\ud45c\uc790 \ucc45\uc784 \ucd94\uad81(s 550) \ub2e8\uacc4\ub77c\uba74 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uc54c\ub824 \uc8fc\uc2ed\uc2dc\uc624.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/221801513691854\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">\uace0\uc6a9\ubc95 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0 \uc791\uc131\ud558\uae30<\/a>\n              <a href=\"../../files/KO/PDF/02_Employment_Underpayment_Self_Calculation_and_Evidence_Manual_2026_KO.pdf\" download class=\"col-btn-ghost\">02 \ubc00\ub9b0 \uc784\uae08 \uacc4\uc0b0\u00b7\uccad\uad6c \uc694\uc57d PDF \ubc1b\uae30<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=ko\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">\ubc15\uc564\ucf54 \uacf5\uc2dd \uc0c1\ub2f4 \ub9c1\ud06c \ud5c8\ube0c<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">\ubc95\ub960 \uc548\ub0b4: \uc774 \uce7c\ub7fc\uc740 \ud638\uc8fc \uacf5\uc815\uadfc\ub85c\ubc95(Fair Work Act 2009), \ud1f4\uc9c1\uc5f0\uae08\ubc95, \uc774\ubbfc\ubc95\ub839\uacfc \ubc95\uc6d0 \ud310\ub840\ub97c \ubc14\ud0d5\uc73c\ub85c \uc54c\uae30 \uc27d\uac8c \ud480\uc5b4 \uc4f4 \uc77c\ubc18 \ubc95\ub960 \uc815\ubcf4\uc785\ub2c8\ub2e4. \uac1c\ubcc4 \uc0ac\uac74\uc5d0 \ub300\ud55c \ubc95\ub960 \uc790\ubb38\uc774\ub098 \uc218\uc784 \uacc4\uc57d \uc131\ub9bd\uc744 \ub73b\ud558\uc9c0 \uc54a\uc73c\ubbc0\ub85c FWC 21\uc77c \ub9c8\uac10 \uae30\ud55c \ub4f1\uc774 \uc784\ubc15\ud588\ub2e4\uba74 \uc9c0\uccb4 \uc5c6\uc774 \uc628\ub77c\uc778 \uc0c1\ub2f4 \uc9c8\ubb38\uc9c0\ub85c \uac80\ud1a0\ub97c \ubc1b\uc544 \ubcf4\uc2dc\uae30 \ubc14\ub78d\ub2c8\ub2e4.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">\ud568\uaed8 \uc77d\uc73c\uba74 \uc88b\uc740 \uace0\uc6a9\ubc95 \ud310\ub840 \uce7c\ub7fc<\/h3>\n        <a href=\"../../?lang=ko&amp;tab=employment\" class=\"col-back-link num\">\u2190 \uc9c1\uc7a5\u00b7\ubc00\ub9b0 \uc784\uae08 \uacc4\uc0b0\uae30\ub85c \ub3cc\uc544\uac00\uae30<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../annualised-salary-setoff-audit-2026/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ud3ec\uad04\uc5f0\ubd09\u00b7\uc784\uae08\uc808\ub3c4 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 04<\/span><h4 class=\"col-sib-title\">\ud3ec\uad04\uc5f0\ubd09\uc81c(All-In Salary) \uacc4\uc57d\uc11c\uc758 \ubc30\uc2e0: Woolworths\u00b7Coles \uc5f0\ubc29\ubc95\uc6d0 \ud310\uacb0\uacfc \uc784\uae08\uc808\ub3c4 \ud615\uc0ac\ucc98\ubc8c \ub300\uc751\ubc95<\/h4><p class=\"col-sib-desc\">&#x27;\uc5f0\ubd09\uc5d0 \uc8fc\ub9d0\u00b7\uc57c\uac04\uc218\ub2f9\uc774 \ubaa8\ub450 \ud3ec\ud568\ub410\ub2e4&#x27;\ub294 \uacc4\uc57d \uc870\ud56d\uc774 \uc5f0\ubc29\ubc95\uc6d0([2025] FCA 1092)\uc5d0\uc11c \ubc30\ucc99\ub41c \ubc95\ub9ac\ub97c \ubd84\uc11d\ud558\uace0 \uae30\uc5c5 \uae09\uc5ec \uac10\uc0ac \ubc0f $50,000 \uc774\uc0c1 \uc218\ub2f9 \uccad\uad6c \uae30\uc900\uc744 \uc548\ub0b4\ud569\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../director-accountant-liability-s550/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\ubc95\uc778\ud3d0\uc5c5\u00b7\uc5f0\ub300\ucc45\uc784 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 05<\/span><h4 class=\"col-sib-title\">\ud68c\uc0ac\ub97c \ud3d0\uc5c5(Liquidation)\ud558\uba74 \ub05d\uc77c\uae4c: \ub300\ud45c\uc774\uc0ac\u00b7\ud68c\uacc4\uc0ac \uac1c\uc778 \uc7ac\uc0b0\uc744 \ucd94\uad81\ud558\ub294 FWA s 550 \uc5f0\ub300\ucc45\uc784<\/h4><p class=\"col-sib-desc\">\ud3d0\uc5c5\ud55c \ubb34\uc790\uc0b0 \ubc95\uc778\ub9cc\uc744 \ud53c\uace0\ub85c \uc0bc\uc744 \ub54c \ud68c\uc218\uac00 \ubd88\uac00\ub2a5\ud55c \uc774\uc720\ub97c \uc9da\uace0 \ubc95 \uc704\ubc18\uc5d0 \uad00\uc5ec\ud55c \ub300\ud45c\uc774\uc0ac\uc640 \uc678\ubd80 \ud68c\uacc4\uc0ac \uac1c\uc778 \uc7ac\uc0b0\uc744 \ucd94\uad81\ud558\ub294 s 550 \ubc95\ub9ac\ub97c \ud574\uc124\ud569\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../sham-contracting-abn-s15aa/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ABN \uc704\uc7a5\ub3c4\uae09 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 06<\/span><h4 class=\"col-sib-title\">ABN \ud504\ub9ac\ub79c\uc11c \uacc4\uc57d\uc11c \uc37c\uc73c\ub2c8 \uadfc\ub85c\uc790\uac00 \uc544\ub2c8\ub2e4? FWA s 15AA \uc2e4\uc9c8 \uc2ec\uc0ac\uc640 6\ub144 \uce58 \uc5f0\uae08\u00b7\uc218\ub2f9 \uc5ed\ucd94\uc9d5<\/h4><p class=\"col-sib-desc\">\uc678\uc8fc \ub3c4\uae09 \uacc4\uc57d\uc11c\ub97c \uc791\uc131\ud558\uace0\ub3c4 \uc815\uc2dd \uadfc\ub85c\uc790\ub85c \uc778\uc815\ubc1b\uc544 \ubcf5\uc9c1\ud55c \ud310\ub840\uc640 \uc5f0\ubd09 $190,100 \uc774\uc0c1 \uad6c\uac04\uc5d0\uc11c \uc801\uc6a9 \uc81c\uc678 \ud1b5\uc9c0\uac00 \uc778\uc815\ub41c \ucd5c\uc2e0 \uacb0\uc815\ub840\ub97c \ub300\uc870\ud569\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 8\ubd84 \uc18c\uc694 \u2192<\/span><\/a><a href=\"../executive-dismissal-general-protections-restraints/?lang=ko\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">\uc784\uc6d0\ud574\uace0\u00b7\uacbd\uc5c5\uae08\uc9c0 \u00b7 \uace0\uc6a9\ubc95 \uce7c\ub7fc 08<\/span><h4 class=\"col-sib-title\">\uc5f0\ubd09 $190,100 \uc774\uc0c1 \uc784\uc6d0 \ud574\uace0\uc640 \ubb34\uc81c\ud55c \uc77c\ubc18\ubcf4\ud638 \uc18c\uc1a1\uc758 \ucc29\uac01: $520\ub9cc \ud310\uacb0 \ud30c\uae30 \uc0ac\ub840\uc640 \uacbd\uc5c5\uae08\uc9c0 \uac00\ucc98\ubd84<\/h4><p class=\"col-sib-desc\">\uc0ac\ub0b4 \ubb38\uc81c \uc81c\uae30 \uc9c1\ud6c4 \ud574\uace0\ub418\uba74 \ub2f9\uc5f0\ud788 \ubc30\uc0c1\uc774 \uc778\uc815\ub41c\ub2e4\ub294 \ud1b5\ub150\uc744 \ud310\ub840\ub85c \uac80\uc99d\ud558\uace0 \uace0\uc5f0\ubd09 \uc784\uc6d0 \ud1f4\uc9c1 \ud611\uc0c1\uacfc \uacbd\uc5c5\uae08\uc9c0 \uac00\ucc98\ubd84 \ubc29\uc5b4 \uc804\ub7b5\uc744 \ud574\uc124\ud569\ub2c8\ub2e4.<\/p><span class=\"col-sib-meta num\">\uc57d 9\ubd84 \uc18c\uc694 \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}, "en": {"doc_title": "Dismissed on a Subclass 482 Visa: Managing the 21-Day FWC Bar, 180-Day Mobility Rule and Deed Traps \u00b7 Park & Co Lawyers", "html": "\n  <nav class=\"pnc-eco-bar\" aria-label=\"Park &amp; Co Legal Guides Ecosystem\">\n    <div class=\"pnc-eco-inner\">\n      <a class=\"pnc-eco-brand\" href=\"https://changa9090.github.io/\">\n        <span class=\"pnc-eco-dot\" aria-hidden=\"true\"><\/span>\n        <span>Park &amp; Co Legal Guides<\/span>\n      <\/a>\n      <div class=\"pnc-eco-links\">\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/\">All Guides Hub<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-visa-solution-guide/?lang=en\">Visa Solution Guide<\/a>\n        <a class=\"pnc-eco-link\" href=\"https://changa9090.github.io/parkco-employment-law-navigator/?lang=en\">Employment Navigator<\/a>\n        <a class=\"pnc-eco-link is-current\" href=\"../../?lang=en\">DIY & Cost-Smart Guide<\/a>\n        <a class=\"pnc-eco-cta\" href=\"https://parklawyers.com.au/links/?lang=en\" target=\"_blank\" rel=\"noopener\">Consult Park & Co \u2197<\/a>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <header class=\"col-topbar\">\n    <div class=\"col-topbar-inner\">\n      <div class=\"col-topbar-left\">\n        <a href=\"../../?lang=en&amp;tab=employment\" class=\"col-back-btn\">\u2190 Back to Employment Self-Help Hub<\/a>\n        <span class=\"col-topbar-divider\" aria-hidden=\"true\">|<\/span>\n        <span class=\"col-topbar-brand\">Park &amp; Co Lawyers \u00b7 Employment Law Deep-Dive Column<\/span>\n      <\/div>\n      <div class=\"col-topbar-right\">\n        <div class=\"lang-switch\" role=\"group\" aria-label=\"Language switch\">\n          <button type=\"button\" data-set-lang=\"ko\" class=\"lang-btn\">KO<\/button>\n          <button type=\"button\" data-set-lang=\"en\" class=\"lang-btn active\">EN<\/button>\n        <\/div>\n        <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"col-top-cta num\">Consult Park &amp; Co \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"col-shell\">\n    <article class=\"col-article-card\">\n      <div class=\"col-hero-header\">\n        <div class=\"col-meta-pills\">\n          <span class=\"col-tag-pill num\">VISA WORKER DISMISSALS \u00b7 EMPLOYMENT 07<\/span>\n          <span class=\"col-verified-pill num\">QLS Accredited Specialist Verified (Nov 2026)<\/span>\n          <span class=\"col-time-pill num\">8 min read<\/span>\n        <\/div>\n        <h1 class=\"col-h1\">Dismissed on a Subclass 482 Visa: Managing the 21-Day FWC Bar, 180-Day Mobility Rule and Deed Traps<\/h1>\n        <p class=\"col-subtitle\">Coordinating FWC Form F2/F8 leverage, Helensburgh Coal [2025] HCA 29 redundancy audits, 186 TRT continuity, and ss 245AR\u2013245AS sponsorship laws<\/p>\n\n        <a href=\"https://parklawyers.com.au/our-people/chang-park/\" target=\"_blank\" rel=\"noopener\" class=\"col-byline\" style=\"text-decoration:none;color:inherit;\">\n          <img src=\"../../assets/logo-positive.png\" alt=\"Park &amp; Co Lawyers\" class=\"col-byline-logo\">\n          <div>\n            <div class=\"col-author-name\">Chang Min Park<\/div>\n            <div class=\"col-author-role\">Legal Practitioner Director, Park &amp; Co Lawyers \u00b7 Accredited Specialist in Immigration Law (QLS)<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n\n      <figure class=\"col-hero-figure\">\n        <img src=\"../../static/columns/img/col07_emp_visadismissal_hero.jpg\" alt=\"Dismissed on a Subclass 482 Visa: Managing the 21-Day FWC Bar, 180-Day Mobility Rule and Deed Traps\" class=\"col-hero-img\">\n        <figcaption class=\"col-hero-caption\">Terminating a Subclass 482 employee starts a strict 21-day Fair Work deadline alongside a 180-day Condition 8607 visa clock that can quietly derail Subclass 186 PR.<\/figcaption>\n      <\/figure>\n\n      <section class=\"col-stats-strip\" aria-label=\"Key verified metrics\">\n        <div class=\"col-stat-card\"><div class=\"col-stat-val num\">21 Calendar Days<\/div><div class=\"col-stat-lbl\">Strict FWC Form F2 / F8 filing deadline ($92.70 fee in FY 2026\u201327)<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">180 / 365 Days<\/div><div class=\"col-stat-lbl\">Condition 8607 single-cessation &amp; cumulative visa mobility caps<\/div><\/div><div class=\"col-stat-card\"><div class=\"col-stat-val num\">2 Yrs / $131,040<\/div><div class=\"col-stat-lbl\">Individual criminal maximum for s 245AR payment-for-visa offences<\/div><\/div>\n      <\/section>\n\n      <div class=\"col-content-grid\">\n        <aside class=\"col-toc-rail\">\n          <div class=\"col-toc-sticky\">\n            <div class=\"col-toc-title num\">In This Column<\/div>\n            <nav class=\"col-toc-nav\">\n              <a href=\"#two-statutory-clocks-21-calendar-days-at-the-fwc\" class=\"col-toc-link lvl-2\">Two statutory clocks: 21 calendar days at the FWC versus 180 days under Condition 8607<\/a><a href=\"#challenging-contractor-redundancies-after-helens\" class=\"col-toc-link lvl-2\">Challenging contractor redundancies after Helensburgh Coal v Bartley<\/a><a href=\"#visa-cashback-demands-and-the-s-245as-self-incri\" class=\"col-toc-link lvl-2\">Visa cashback demands and the s 245AS self-incrimination trap<\/a><a href=\"#why-an-fwc-deed-of-release-requires-dual-employm\" class=\"col-toc-link lvl-2\">Why an FWC deed of release requires dual employment and migration drafting<\/a><a href=\"#protecting-your-21-day-bar-and-sponsorship-pathw\" class=\"col-toc-link lvl-2\">Protecting your 21-day bar and sponsorship pathway together<\/a>\n            <\/nav>\n            <div class=\"col-side-cta-box\">\n              <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"width:100%;justify-content:center;text-align:center;\">Open Employment Consultation Form<\/a>\n              <a href=\"../../?lang=en&amp;tab=employment\" class=\"btn-outline\" style=\"width:100%;justify-content:center;text-align:center;margin-top:8px;\">\u2190 Back to Employment Self-Help Hub<\/a>\n            <\/div>\n          <\/div>\n        <\/aside>\n\n        <div class=\"col-prose doc-prose\">\n          <p class=\"doc-p\">Losing an employer-sponsored job on a Subclass 482 (Skills in Demand / former TSS) visa starts two statutory clocks on the same afternoon: one in the Fair Work Commission (FWC) and one inside the Department of Home Affairs. Most dismissed visa holders either rush straight to a migration agent and forfeit their workplace leverage before learning a new sponsor takes months to secure, or instruct a generalist employment lawyer who settles for a quick cash payout without noticing that the termination record just derailed a Subclass 186 Temporary Residence Transition (TRT) permanent residence pathway. Where dismissal and visa sponsorship collide, managing both files off one legal chronology is essential.<\/p>\n<figure class=\"col-figure col-svg-figure\"><div class=\"col-svg-frame\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 366\" width=\"100%\" role=\"img\" aria-label=\"Three Interlocking Clocks After a Subclass 482 / 186 Dismissal\" style=\"max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\">\n  <rect x=\"0.5\" y=\"0.5\" width=\"879\" height=\"365\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <rect x=\"1\" y=\"1\" width=\"878\" height=\"76\" rx=\"13\" fill=\"#FAF9F6\"/>\n  <line x1=\"1\" y1=\"77\" x2=\"879\" y2=\"77\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"26\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\" letter-spacing=\"0.05em\">EMPLOYMENT \u00d7 MIGRATION INTERSECTION \u00b7 DUAL CLOCKS<\/text>\n  <text x=\"26\" y=\"51\" font-size=\"16\" font-weight=\"800\" fill=\"#1F242B\">Three Interlocking Clocks After a Subclass 482 / 186 Dismissal<\/text>\n  <text x=\"26\" y=\"69\" font-size=\"11.2\" fill=\"#525B67\">Authorities: FWA ss 389(2), 394(2) \u00b7 Helensburgh Coal [2025] HCA 29 \u00b7 Condition 8607 \u00b7 ss 245AR\u2013245AS<\/text>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FDF3F4\" stroke=\"#7A1F2B\" stroke-width=\"1.3\"/>\n  <rect x=\"22\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#7A1F2B\"/>\n  <text x=\"36\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">CLOCK 01 \u00b7 STRICT 21 DAYS<\/text>\n  <text x=\"36\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">FWC Form F2 / F8 Bar<\/text>\n  <text x=\"36\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#7A1F2B\">Helensburgh Coal [2025] HCA 29<\/text>\n  <line x1=\"36\" y1=\"182\" x2=\"272\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">Strict 21 calendar days from dismissal<\/text>\n  <text x=\"36\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">FWC checks contractor insourcing (HCA 29)<\/text>\n  <text x=\"36\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Rushed Deed of Release kills leverage<\/text>\n  <text x=\"36\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Negotiate resignation &amp; neutral reference<\/text>\n  <line x1=\"289\" y1=\"195\" x2=\"300\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"303,195 297,191 297,199\" fill=\"#1F242B\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#EEF5F7\" stroke=\"#1F4E5F\" stroke-width=\"1.3\"/>\n  <rect x=\"306\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#1F4E5F\"/>\n  <text x=\"320\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">CLOCK 02 \u00b7 180 / 365 DAYS<\/text>\n  <text x=\"320\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">Condition 8607 Mobility<\/text>\n  <text x=\"320\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E5F\">Migration Regs Sch 8 cl 8607<\/text>\n  <line x1=\"320\" y1=\"182\" x2=\"556\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"320\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">Up to 180 consecutive days per cessation<\/text>\n  <text x=\"320\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">365 days cumulative cap across visa grant<\/text>\n  <text x=\"320\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Trap: Unsponsored gap breaks 186 TRT clock<\/text>\n  <text x=\"320\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Align notice/cessation date with new 482<\/text>\n  <line x1=\"573\" y1=\"195\" x2=\"584\" y2=\"195\" stroke=\"#1F242B\" stroke-width=\"1.8\"/>\n  <polygon points=\"587,195 581,191 581,199\" fill=\"#1F242B\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"202\" rx=\"10\" fill=\"#FEF8EC\" stroke=\"#9A6700\" stroke-width=\"1.3\"/>\n  <rect x=\"590\" y=\"94\" width=\"264\" height=\"30\" rx=\"9\" fill=\"#9A6700\"/>\n  <text x=\"604\" y=\"114\" font-size=\"11.3\" font-weight=\"700\" font-family=\"'JetBrains Mono', 'Inter', monospace\" fill=\"#FFFFFF\">TRAP 03 \u00b7 CASHBACK BAN<\/text>\n  <text x=\"604\" y=\"149\" font-size=\"13.2\" font-weight=\"800\" fill=\"#1F242B\">ss 245AR\u2013245AS Sanctions<\/text>\n  <text x=\"604\" y=\"170\" font-size=\"11\" font-weight=\"700\" fill=\"#9A6700\">Migration Act ss 245AR\u2013245AS \u00b7 s 116<\/text>\n  <line x1=\"604\" y1=\"182\" x2=\"840\" y2=\"182\" stroke=\"#E3DFD7\" stroke-width=\"1\"/>\n  <text x=\"604\" y=\"204\" font-size=\"11.2\" fill=\"#1F242B\" font-weight=\"600\">Demanding benefit (s 245AR): 2 yrs / $131k<\/text>\n  <text x=\"604\" y=\"225\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Offering payment (s 245AS): $87,360 fine<\/text>\n  <text x=\"604\" y=\"246\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Risks s 116 / reg 2.43(1)(la) visa cancel<\/text>\n  <text x=\"604\" y=\"267\" font-size=\"11.2\" fill=\"#525B67\" font-weight=\"400\">Requires dual employment-migration defence<\/text>\n  <rect x=\"22\" y=\"312\" width=\"836\" height=\"38\" rx=\"8\" fill=\"#FEF8EC\" stroke=\"#ECD9B0\" stroke-width=\"1\"/>\n  <text x=\"36\" y=\"335\" font-size=\"11.2\" font-weight=\"700\" fill=\"#1F242B\">Core Rule: Migration agents cannot draft FWC Deeds, and employment-only lawyers miss 186 TRT breaks. Coordinate both clocks together.<\/text>\n<\/svg>\n<\/div><figcaption class=\"col-figcaption\">Figure 1: Dual Statutory Timelines on Sponsored Worker Dismissal (21 Days vs 180 Days)<\/figcaption><\/figure>\n<h2 id=\"two-statutory-clocks-21-calendar-days-at-the-fwc\" class=\"doc-h2\">Two statutory clocks: 21 calendar days at the FWC versus 180 days under Condition 8607<\/h2>\n<p class=\"doc-p\">Your tightest deadline sits under the <em>Fair Work Act 2009<\/em> (Cth) (FWA). Both Form F2 Unfair Dismissal (s 394(2)) and Form F8 General Protections Involving Dismissal (s 366(1)) must be lodged with the FWC within strictly 21 calendar days after the dismissal takes effect, together with the FY 2026-27 filing fee of $92.70 (or a fee-waiver form). Weekends and public holidays count, and waiting around for migration advice before filing almost never qualifies as &quot;exceptional circumstances&quot; for an extension of time.<\/p>\n<p class=\"doc-p\">Your second clock sits in Schedule 8 Condition 8607 of the <em>Migration Regulations 1994<\/em> (Cth), as amended from 1 July 2024 by F2024L00810. After ceasing work with an approved sponsor, Subclass 482 holders have up to 180 consecutive days per cessation (and 365 days cumulative across the visa grant period) to secure a new sponsor nomination, lodge another visa, or depart Australia. You may lawfully work for other employers during that 180-day window subject to licensing rules, yet un-nominated employment gaps still disrupt Subclass 186 TRT qualifying service if your cessation date and new nomination transfer are mishandled.<\/p>\n<div class=\"doc-table-wrap\"><table class=\"doc-table\" data-cols=\"3\"><thead><tr><th style=\"text-align:left\">Statutory Mechanism<\/th><th style=\"text-align:left\">Governing Rule &amp; Fee / Penalty<\/th><th style=\"text-align:left\">Strategic Effect on Sponsored Dismissal<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>FWC Dismissal Filing Limit<\/strong><\/td><td style=\"text-align:left\">FWA s 394(2) (Form F2) &amp; s 366(1) (Form F8); $92.70 fee (FY 2026-27)<\/td><td style=\"text-align:left\">Strict 21 calendar days from dismissal taking effect; preserves bargaining power over cessation date and references<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Condition 8607 Mobility Rule<\/strong><\/td><td style=\"text-align:left\">Migration Regulations 1994 Sch 8 cl 8607 (F2024L00810, eff. 1 Jul 2024)<\/td><td style=\"text-align:left\">Up to 180 consecutive days per cessation (365 days total cap) with interim work rights, though un-nominated gaps affect 186 TRT continuity<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Contractor Insourcing in Redundancy<\/strong><\/td><td style=\"text-align:left\">FWA s 389(2); <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2025/29.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Helensburgh Coal Pty Ltd v Bartley<\/em> [2025] HCA 29<\/a> (6 Aug 2025)<\/td><td style=\"text-align:left\">FWC may examine whether the sponsor could reasonably have reduced external contractors to redeploy redundant staff<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Demanding Visa Cashbacks<\/strong><\/td><td style=\"text-align:left\">Migration Act 1958 s 245AR &amp; FWA s 325 ($364 penalty unit)<\/td><td style=\"text-align:left\">Up to 2 years&#x27; imprisonment or $131,040 individual criminal fine for asking for or receiving sponsorship payments<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Paying for Sponsorship<\/strong><\/td><td style=\"text-align:left\">Migration Act 1958 s 245AS, s 116(1)(g) &amp; reg 2.43(1)(la)<\/td><td style=\"text-align:left\">$87,360 civil penalty on the payer plus discretionary visa cancellation risk even where employer demanded the money<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"challenging-contractor-redundancies-after-helens\" class=\"doc-h2\">Challenging contractor redundancies after Helensburgh Coal v Bartley<\/h2>\n<p class=\"doc-p\">Sponsors seeking to exit a Subclass 482 worker after friction over unpaid overtime or a promised 186 nomination frequently badge the dismissal as a &quot;genuine redundancy&quot; under FWA s 389, hoping to block Unfair Dismissal jurisdiction while keeping ABN subcontractors or labour-hire workers on the roster performing the same tasks.<\/p>\n<p class=\"doc-p\">On 6 August 2025, a unanimous High Court curbed that tactic in <a href=\"https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/HCA/2025/29.html\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\"><em>Helensburgh Coal Pty Ltd v Bartley<\/em> [2025] HCA 29<\/a>. Interpreting the redeployment duty in FWA s 389(2), the High Court held that the FWC has power to examine whether the employer could reasonably have reduced external contractors and insourced their work to redeploy otherwise redundant employees. Where a sponsor terminates a 482 chef, mechanic, or engineer for &quot;restructure&quot; while retaining contractors in the same operational slot, a timely Form F2 challenges the s 389 jurisdictional objection directly.<\/p>\n<h2 id=\"visa-cashback-demands-and-the-s-245as-self-incri\" class=\"doc-h2\">Visa cashback demands and the s 245AS self-incrimination trap<\/h2>\n<p class=\"doc-p\">Where a sponsor demanded secret cash repayments for wages, the Skilling Australians Fund (SAF) levy, or nomination fees, statutory risk cuts both ways. Under Migration Act 1958 (Cth) s 245AR and FWA s 325, demanding or receiving a sponsorship benefit carries up to 2 years&#x27; imprisonment or an individual criminal fine of $131,040 (at the $364 penalty unit from 1 July 2026).<\/p>\n<p class=\"doc-p\">However, Migration Act s 245AS also imposes a civil penalty of up to $87,360 on a worker who offers or provides a sponsorship benefit, and s 116(1)(g) paired with reg 2.43(1)(la) authorises Home Affairs to cancel the worker&#x27;s visa on payment-for-visas grounds. Firing off an unvetted DIY complaint admitting sponsorship payments without privileged legal assessment distinguishing unlawful s 325 coercion from a consensual s 245AS payment can trigger a cancellation notice against your own visa.<\/p>\n<h2 id=\"why-an-fwc-deed-of-release-requires-dual-employm\" class=\"doc-h2\">Why an FWC deed of release requires dual employment and migration drafting<\/h2>\n<p class=\"doc-p\">At FWC conciliation, non-monetary clauses inside a Deed of Release often matter far more to a sponsored worker than six weeks&#x27; pay. Registered migration agents cannot run FWC litigation or draft settlement deeds, while specialist employment lawyers without migration accreditation frequently overlook s 140M Home Affairs notifications and ANZSCO or OSCA verification rules. Coordinated drafting converts summary dismissal into an agreed resignation, matches the cessation date (via paid notice or garden leave) to a new SID 482 nomination, locks in a neutral statement of service proving full-time duties for 186 permanent residence, and structures Employment Termination Payment (ETP) terms without harmful admissions.<\/p>\n<h2 id=\"protecting-your-21-day-bar-and-sponsorship-pathw\" class=\"doc-h2\">Protecting your 21-day bar and sponsorship pathway together<\/h2>\n<p class=\"doc-p\">At Park &amp; Co, our Legal Practitioner Director is an Accredited Specialist in Immigration Law (QLS) working directly alongside our employment litigation practice. Simple under-$50,000 award wage calculations without visa cessation or cashback risks belong in our free Self-Help Award Calculator and Form 5 Small Claims guide. For complex 482 or 186 dismissals inside the 21-day FWC bar, visa-safe settlement deeds, or corporate sponsor compliance under Condition 8607, lodge your termination date and visa details urgently via the <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Employment Consultation Form<\/a> or visit the <a href=\"https://parklawyers.com.au/links/\" target=\"_blank\" rel=\"noopener\" class=\"doc-link\">Park &amp; Co Official Links Hub<\/a>.<\/p>\n\n          <div class=\"col-sources-box\">\n            Primary Authorities: Fair Work Act 2009 (Cth) ss 325, 366(1), 389(2), 394(2) \u00b7 Helensburgh Coal Pty Ltd v Bartley [2025] HCA 29 \u00b7 Migration Act 1958 ss 116(1)(g), 245AR\u2013245AS \u00b7 Migration Regulations 1994 reg 2.43(1)(la), Sch 8 cl 8607 (F2024L00810).\n          <\/div>\n\n          <section class=\"col-cta-banner\">\n            <span class=\"section-overline num\" style=\"color:#E6C98C;\">WHEN TO CONSULT PARK &amp; CO LAWYERS \u00b7 EMPLOYMENT<\/span>\n            <h3 class=\"col-cta-title\">Facing a 21-Day Dismissal Deadline, Corporate Audit, or &gt;$50,000 / s 550 Claim?<\/h3>\n            <p class=\"col-cta-desc\">For modest &lt;$50k wage shortfalls, self-calculating with our free Award Calculator and 208-formula Excel protects 100% of your payout. Once your matter involves a 21-day dismissal bar, sponsor defence, or &gt;$50k / s 550 director exposure, submit our online consultation form.<\/p>\n            <div class=\"col-cta-actions\">\n              <a href=\"https://form.jotform.com/221642058161853\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-white\">Open Employment Consultation Form<\/a>\n              <a href=\"../../files/EN/PDF/02_Employment_Underpayment_Self_Calculation_and_Evidence_Manual_2026_EN.pdf\" download class=\"col-btn-ghost\">Download Manual 02 (Employment PDF)<\/a>\n              <a href=\"https://parklawyers.com.au/links/?lang=en\" target=\"_blank\" rel=\"noopener\" class=\"col-btn-ghost\">Park &amp; Co Official Consultation Hub<\/a>\n            <\/div>\n          <\/section>\n\n          <p class=\"col-disclaimer\">Legal Disclaimer: This publication provides general legal information grounded in the Fair Work Act 2009 (Cth), superannuation/migration statutes and Australian court authorities current as at November 2026. It does not constitute legal advice or create a solicitor-client relationship. Strict 21-day FWC limits apply.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <section class=\"col-siblings-section\">\n      <div class=\"col-siblings-hdr\">\n        <h3 class=\"section-title-sm\">More Curated Employment Law Columns<\/h3>\n        <a href=\"../../?lang=en&amp;tab=employment\" class=\"col-back-link num\">\u2190 Back to Employment Self-Help Hub<\/a>\n      <\/div>\n      <div class=\"col-siblings-grid\">\n        <a href=\"../annualised-salary-setoff-audit-2026/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ANNUALISED SALARIES \u00b7 EMPLOYMENT 04<\/span><h4 class=\"col-sib-title\">Why Annualised Salary Set-Off Clauses Fail After Woolworths and Coles [2025] FCA 1092<\/h4><p class=\"col-sib-desc\">Why &#x27;all-in&#x27; salaries cannot average overtime across quiet weeks, how missing penalty records flip the onus onto employers, and when &gt;$50k recovery or B2B restructuring applies.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../director-accountant-liability-s550/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">DIRECTOR LIABILITY \u00b7 EMPLOYMENT 05<\/span><h4 class=\"col-sib-title\">Liquidating the Company Will Not Shield Directors or Accountants From s 550 Liability<\/h4><p class=\"col-sib-desc\">How FWA s 550 pierces insolvent corporate shells to reach directors, HR managers and external accountants who had actual knowledge of award breaches.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../sham-contracting-abn-s15aa/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">ABN &amp; SHAM CONTRACTING \u00b7 EMPLOYMENT 06<\/span><h4 class=\"col-sib-title\">ABN Contractor or Employee? How Section 15AA Overturned High Court Contract Primacy<\/h4><p class=\"col-sib-desc\">Compares Dickerson [2025] FWC 2219, Crooks v Hyundai Rotem [2026] FWC 1104 and Barakat [2026] FWC 1941 across multi-year leave, penalty and super exposure.<\/p><span class=\"col-sib-meta num\">8 min read \u2192<\/span><\/a><a href=\"../executive-dismissal-general-protections-restraints/?lang=en\" class=\"col-sib-card\"><span class=\"col-sib-tag num\">EXECUTIVES &amp; RESTRAINTS \u00b7 EMPLOYMENT 08<\/span><h4 class=\"col-sib-title\">Executive Dismissals Above $190,100, General Protections Myths and Post-Employment Restraints<\/h4><p class=\"col-sib-desc\">Dissects Barclay subjective causation under s 361, executive notice/bonus claims, Supreme Court injunction risks, and upcoming federal non-compete reforms.<\/p><span class=\"col-sib-meta num\">9 min read \u2192<\/span><\/a>\n      <\/div>\n    <\/section>\n  <\/main>"}}</script>

    (function () {
      const payload = JSON.parse(document.getElementById('col-payload').textContent);
      const root = document.getElementById('col-root');
      let cleanupScroll = null;

      function getLang() {
        const q = new URLSearchParams(window.location.search).get('lang');
        return q === 'en' ? 'en' : 'ko';
      }

      function bindTocSpy() {
        if (cleanupScroll) cleanupScroll();
        const links = Array.from(root.querySelectorAll('.col-toc-link'));
        if (!links.length) return;
        const targets = links
          .map((a) => document.getElementById(a.getAttribute('href').slice(1)))
          .filter(Boolean);
        function onScroll() {
          let activeIdx = 0;
          const offset = window.scrollY + 130;
          for (let i = 0; i < targets.length; i++) {
            if (targets[i].offsetTop <= offset) activeIdx = i;
          }
          links.forEach((a, idx) => a.classList.toggle('active', idx === activeIdx));
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        cleanupScroll = () => window.removeEventListener('scroll', onScroll);
        onScroll();
      }

      function render(lg) {
        const data = payload[lg] || payload.ko;
        document.documentElement.lang = lg;
        document.title = data.doc_title;
        root.innerHTML = data.html;
        root.querySelectorAll('[data-set-lang]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const next = btn.getAttribute('data-set-lang');
            const url = new URL(window.location.href);
            url.searchParams.set('lang', next);
            window.history.replaceState({}, '', url.toString());
            render(next);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });
        bindTocSpy();
      }

      render(getLang());
    })();
  </script>

      .catch(function (err) {

        if (tries < maxTries) {

            .then(function () { return fetchRetry(url, isHit, tries + 1); });
        }
        throw err;

        '<span class="vc-ref-name" title="' + item.label + '">' + item.label + '</span>' +
        '<div class="vc-ref-track"><div class="vc-ref-fill" style="width:' + Math.max(4, pct) + '%"></div></div>' +
        '<span class="vc-ref-val">' + fmt(item.count) + ' (' + pct + '%)</span>' +
        '</div>';
    }).join('');
    var note = isEn
      ? 'Privacy-safe coarse channel buckets only (1 per browser/day; zero IP, query string, or full referrer URL stored).'
      : '개인정보 보호형 채널 그룹 집계 (하루 브라우저당 1회 기준 &middot; 검색어·세부 URL·IP 미수집)';
    return head + '<div class="vc-ref-list">' + rowsHtml + '</div><p class="vc-ref-note">' + note + '</p>';
  }

  function loadHistoryRows(days) {
    var histCache = {};
    try { histCache = JSON.parse(localStorage.getItem(HIST_KEY) || '{}') || {}; } catch (e) {}
    var results = new Array(days.length);
    var pending = [];
    days.forEach(function (d, idx) {
      if (d < today && Array.isArray(histCache[d])) {
        results[idx] = histCache[d];
      } else if (d === today && typeof liveTodayViews === 'number' && typeof liveTodayVis === 'number') {
        results[idx] = [liveTodayViews, liveTodayVis];
      } else {
        pending.push({ d: d, idx: idx });
      }
    });

    var batchSize = pending.length > 7 ? 4 : 6;
    var pauseMs = pending.length > 7 ? 2900 : 180;
    var chain = Promise.resolve();
    for (var c = 0; c < pending.length; c += batchSize) {
      (function (slice, waitFirst) {
        chain = chain.then(function () {
          return (waitFirst ? delay(pauseMs) : Promise.resolve()).then(function () {
            return Promise.all(slice.map(function (item) {
              var k = item.d.replace(/-/g, '');
              var pViews = (item.d === today && typeof liveTodayViews === 'number')
                ? Promise.resolve(liveTodayViews)
                : call('get', 'day-' + k).catch(function () { return null; });
              var pVis = (item.d === today && typeof liveTodayVis === 'number')
                ? Promise.resolve(liveTodayVis)
                : call('get', 'vday-' + k).catch(function () { return null; });
              return Promise.all([pViews, pVis]).then(function (pair) {
                var v0 = pair[0] == null ? 0 : pair[0];
                var v1 = pair[1] == null ? 0 : pair[1];
                results[item.idx] = [v0, v1];
                if (item.d < today && pair[0] !== null && pair[1] !== null) {
                  histCache[item.d] = [v0, v1];
                }
              });
            }));
          });
        });
      })(pending.slice(c, c + batchSize), c > 0);
    }
    return chain.then(function () {
      try { localStorage.setItem(HIST_KEY, JSON.stringify(histCache)); } catch (e) {}
      return results.map(function (r) { return r || [0, 0]; });
    });
  }

  var cachedRefMap = null;

  function loadAndRenderModal(refreshRefs) {
    syncCounterLang();
    var isEn = uiLang() === 'en';
    var fullDays = lastDays(30);
    var days = activeRange === 7 ? lastDays(7) : fullDays;
    var body = modal.querySelector('.vc-body');
    var chartWaitMsg = isEn ? 'Loading daily statistics&hellip;' : '일별 통계를 불러오는 중입니다&hellip;';
    var refWaitMsg = isEn ? 'Loading today&rsquo;s referral channels&hellip;' : '오늘 유입 채널 집계를 불러오는 중입니다&hellip;';
    var existingRefHtml = (!refreshRefs && cachedRefMap) ? renderReferrerBox(cachedRefMap) : ('<div class="vc-ref-note">' + refWaitMsg + '</div>');

    /* Render toolbar, loading placeholder, referral box, and 1-click share bar IMMEDIATELY (0ms) */
    body.innerHTML = renderToolbar(isEn, fullDays.length) +
      '<div id="vc-chart-slot"><p class="vc-sum">' + chartWaitMsg + '</p></div>' +
      '<div id="vc-ref-box" class="vc-ref-box">' + existingRefHtml + '</div>' +
      renderShareBar(isEn);

    loadHistoryRows(days)
      .then(function (rows) {
        var slot = document.getElementById('vc-chart-slot');
        if (slot) slot.innerHTML = renderChartSvg(days, rows, uiLang() === 'en');
        if (!refreshRefs && cachedRefMap) return cachedRefMap;
        return delay(180).then(function () { return loadTodayReferrers(day); });
      })
      .then(function (refMap) {
        if (refMap) cachedRefMap = refMap;
        var refBox = document.getElementById('vc-ref-box');
        if (refBox && refMap) refBox.innerHTML = renderReferrerBox(refMap);
      })
      .catch(function () {
        var slot = document.getElementById('vc-chart-slot');
        if (slot && !slot.querySelector('svg')) {
          slot.textContent = uiLang() === 'en' ? 'Could not load the chart.' : '그래프를 불러오지 못했습니다.';
        }
      });
  }

  function open() {
    activeRange = 7;
    modal.classList.add('open');
    loadAndRenderModal(true);
  }
  box.setAttribute('role', 'button');
  box.setAttribute('tabindex', '0');
  box.addEventListener('click', open);
  box.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
})();
  </script>
</body>
</html>
