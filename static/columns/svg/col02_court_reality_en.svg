<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="100%" role="img" aria-label="FCFCOA Contested Case Outcomes &amp; Parenting Risk Profile (FY 2025–26)" style="max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
