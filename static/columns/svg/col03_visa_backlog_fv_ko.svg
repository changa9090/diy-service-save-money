  <text x="38" y="332" font-size="11.2" font-weight="700" fill="#7A1F2B">2025–26 신규 접수 66,916건 vs 연간 쿼터 40,500건 → 대기 2배 증가(+100%)</text>
  <rect x="450" y="96" width="408" height="252" rx="10" fill="#FAF9F6" stroke="#E3DFD7" stroke-width="1"/>
