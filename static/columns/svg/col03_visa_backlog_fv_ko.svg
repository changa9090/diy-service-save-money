  <line x1="1" y1="79" x2="879" y2="79" stroke="#E3DFD7" stroke-width="1"/>
  <text x="28" y="29" font-size="11" font-weight="700" fill="#7A1F2B" letter-spacing="0.06em">내무부 공식 통계 &amp; FOI 공개자료 · 대기 기간 2배 증가와 구제 승인 현실</text>
  <text x="28" y="52" font-size="16.8" font-weight="800" fill="#1F242B">호주 파트너비자 적체 급증(116,917건)과 가정폭력 영주권 특례(Div 1.5) 승인 통계</text>
  <text x="28" y="70" font-size="11.3" fill="#525B67">출처: 내무부(DHA) 2025–26 이민 프로그램 보고서 · 내무부 정보공개청구(FOI FA 25/08/01932 및 FA 21/08/01425)</text>
  <rect x="22" y="96" width="412" height="252" rx="10" fill="#FAF9F6" stroke="#E3DFD7" stroke-width="1"/>
  <text x="38" y="122" font-size="13.2" font-weight="800" fill="#1F242B">① 파트너비자 미처리 대기 물량 추이 (6월 30일 기준)</text>
