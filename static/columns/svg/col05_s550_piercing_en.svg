<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 382" width="100%" role="img" aria-label="Suing an Insolvent Pty Ltd Alone vs Pleading s 550 Personal Liability" style="max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <rect x="0.5" y="0.5" width="879" height="381" rx="14" fill="#FFFFFF" stroke="#E3DFD7" stroke-width="1"/>
  <rect x="1" y="1" width="878" height="76" rx="13" fill="#FAF9F6"/>
  <line x1="1" y1="77" x2="879" y2="77" stroke="#E3DFD7" stroke-width="1"/>
  <text x="26" y="28" font-size="11" font-weight="700" fill="#7A1F2B" letter-spacing="0.05em">ACCESSORIAL LIABILITY · FAIR WORK ACT s 550</text>
  <text x="26" y="51" font-size="16" font-weight="800" fill="#1F242B">Suing an Insolvent Pty Ltd Alone vs Pleading s 550 Personal Liability</text>
  <text x="26" y="69" font-size="11.2" fill="#525B67">Authorities: FWO v Sushi Bay [2024] FCA 76 &amp; 869 ($15.3M penalties) · EZY Accounting 123 [2018] FCAFC 134</text>
  <rect x="22" y="94" width="408" height="218" rx="10" fill="#FAF9F6" stroke="#76808F" stroke-width="1.3"/>
  <rect x="22" y="94" width="408" height="32" rx="9" fill="#76808F"/>
  <text x="38" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">PATH A · SUING INSOLVENT PTY LTD ALONE</text>
  <circle cx="42" cy="144" r="4" fill="#76808F"/>
  <text x="54" y="148" font-size="12.2" font-weight="800" fill="#1F242B">Automatic Stay on Liquidation (s 471B)</text>
  <text x="54" y="167" font-size="11.1" fill="#525B67">Naming only a gutted Pty Ltd leaves zero corporate assets to enforce.</text>
  <circle cx="42" cy="196" r="4" fill="#76808F"/>
  <text x="54" y="200" font-size="12.2" font-weight="800" fill="#1F242B">Phoenix Asset-Stripping Trap</text>
  <text x="54" y="219" font-size="11.1" fill="#525B67">Operators reopen under a fresh ABN while leaving an empty judgment.</text>
  <circle cx="42" cy="248" r="4" fill="#76808F"/>
  <text x="54" y="252" font-size="12.2" font-weight="800" fill="#1F242B">DIY Small Claims Limitation</text>
  <text x="54" y="271" font-size="11.1" fill="#525B67">Unpleaded claims against directors fail strict s 550 knowledge rules.</text>
  <rect x="450" y="94" width="408" height="218" rx="10" fill="#FDF3F4" stroke="#7A1F2B" stroke-width="1.3"/>
  <rect x="450" y="94" width="408" height="32" rx="9" fill="#7A1F2B"/>
  <text x="466" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">PATH B · PLEADED s 550 PERSONAL LIABILITY</text>
  <circle cx="470" cy="144" r="4" fill="#7A1F2B"/>
  <text x="482" y="148" font-size="12.2" font-weight="800" fill="#1F242B">Reaches Director Personal Equity (Sushi Bay)</text>
  <text x="482" y="167" font-size="11.1" fill="#525B67">$1.6M personal penalty ordered despite 4 liquidations ([2024] FCA 869).</text>
  <circle cx="470" cy="196" r="4" fill="#7A1F2B"/>
  <text x="482" y="200" font-size="12.2" font-weight="800" fill="#1F242B">External Accountants &amp; HR Caught (EZY)</text>
  <text x="482" y="219" font-size="11.1" fill="#525B67">Processing known below-award flat rates triggers accessory liability.</text>
  <circle cx="470" cy="248" r="4" fill="#7A1F2B"/>
  <text x="482" y="252" font-size="12.2" font-weight="800" fill="#1F242B">Strict Proof: Actual Knowledge of Elements</text>
  <text x="482" y="271" font-size="11.1" fill="#525B67">Requires forensic pleading of payroll control, rosters &amp; award rates.</text>
  <rect x="22" y="328" width="836" height="38" rx="8" fill="#EDF7F2" stroke="#1D6B48" stroke-width="1"/>
  <text x="36" y="351" font-size="11.2" font-weight="700" fill="#1D6B48">Key Takeaway: Recovering &gt;$50k from phoenix operators, or defending personal s 550 claims, hinges on actual-knowledge pleadings.</text>
