<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 382" width="100%" role="img" aria-label="폐업한 법인만 상대하는 소액소송 vs s 550 대표이사·회계사 개인 추궁" style="max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <rect x="0.5" y="0.5" width="879" height="381" rx="14" fill="#FFFFFF" stroke="#E3DFD7" stroke-width="1"/>
  <rect x="1" y="1" width="878" height="76" rx="13" fill="#FAF9F6"/>
  <line x1="1" y1="77" x2="879" y2="77" stroke="#E3DFD7" stroke-width="1"/>
  <text x="26" y="28" font-size="11" font-weight="700" fill="#7A1F2B" letter-spacing="0.05em">법인격 방패 무력화 · FWA s 550 관여자 개인 연대책임</text>
  <text x="26" y="51" font-size="16" font-weight="800" fill="#1F242B">폐업한 법인만 상대하는 소액소송 vs s 550 대표이사·회계사 개인 추궁</text>
  <text x="26" y="69" font-size="11.2" fill="#525B67">근거: FWO v Sushi Bay (No 2)/(No 3) [2024] FCA 76, 869 ($15.3M 제재) · EZY Accounting 123 [2018] FCAFC 134</text>
  <rect x="22" y="94" width="408" height="218" rx="10" fill="#FAF9F6" stroke="#76808F" stroke-width="1.3"/>
  <rect x="22" y="94" width="408" height="32" rx="9" fill="#76808F"/>
  <text x="38" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">PATH A · 폐업 법인(In Liq) 단독 제소의 함정</text>
  <circle cx="42" cy="144" r="4" fill="#76808F"/>
  <text x="54" y="148" font-size="12.2" font-weight="800" fill="#1F242B">법인 청산 시 소송 자동 중지 (Corps Act s 471B)</text>
  <text x="54" y="167" font-size="11.1" fill="#525B67">빈 껍데기 Pty Ltd만 피고로 적으면 집행할 자산이 0원입니다.</text>
  <circle cx="42" cy="196" r="4" fill="#76808F"/>
  <text x="54" y="200" font-size="12.2" font-weight="800" fill="#1F242B">휴지조각 승소 판결문 위험</text>
  <text x="54" y="219" font-size="11.1" fill="#525B67">새 법인(Phoenix)으로 간판만 바꿔 영업해도 기존 판결로 압류 불가.</text>
  <circle cx="42" cy="248" r="4" fill="#76808F"/>
  <text x="54" y="252" font-size="12.2" font-weight="800" fill="#1F242B">소액절차(s 548)의 구조적 한계</text>
  <text x="54" y="271" font-size="11.1" fill="#525B67">사실관계 인정(Actual Knowledge) 법리 입증 없이는 개인 추심 실패.</text>
  <rect x="450" y="94" width="408" height="218" rx="10" fill="#FDF3F4" stroke="#7A1F2B" stroke-width="1.3"/>
  <rect x="450" y="94" width="408" height="32" rx="9" fill="#7A1F2B"/>
  <text x="466" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">PATH B · FWA s 550 대표이사·회계사 개인 추궁</text>
  <circle cx="470" cy="144" r="4" fill="#7A1F2B"/>
  <text x="482" y="148" font-size="12.2" font-weight="800" fill="#1F242B">대표이사 개인 주택·예금 직접 집행 (Sushi Bay)</text>
  <text x="482" y="167" font-size="11.1" fill="#525B67">4개 법인 청산에도 대표 개인에게 $160만 제재 부과 ([2024] FCA 869).</text>
  <circle cx="470" cy="196" r="4" fill="#7A1F2B"/>
  <text x="482" y="200" font-size="12.2" font-weight="800" fill="#1F242B">외부 기장 회계사·HR 매니저 연대책임 (EZY)</text>
  <text x="482" y="219" font-size="11.1" fill="#525B67">법정 최저시급 미달 사실을 알고도 급여 처리 시 공동 관여자 성립.</text>
  <circle cx="470" cy="248" r="4" fill="#7A1F2B"/>
  <text x="482" y="252" font-size="12.2" font-weight="800" fill="#1F242B">핵심 요건: 위반 사실요소의 현실적 인식 입증</text>
  <text x="482" y="271" font-size="11.1" fill="#525B67">지시·이메일·페이슬립 결재 흔적으로 개인 배상 및 과태료 병합 청구.</text>
  <rect x="22" y="328" width="836" height="38" rx="8" fill="#EDF7F2" stroke="#1D6B48" stroke-width="1"/>
  <text x="36" y="351" font-size="11.2" font-weight="700" fill="#1D6B48">핵심 교훈: 폐업 징후가 있는 $50,000+ 체불 회수나 FWO의 s 550 개인 소명 요구는 초기 법리 설계가 개인 재산 생사를 가릅니다.</text>
</svg>
