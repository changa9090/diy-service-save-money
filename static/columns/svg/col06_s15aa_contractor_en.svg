<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 382" width="100%" role="img" aria-label="How the $190,100 Threshold Splits ABN Contractor Law (FY 2026–27)" style="max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <rect x="0.5" y="0.5" width="879" height="381" rx="14" fill="#FFFFFF" stroke="#E3DFD7" stroke-width="1"/>
  <rect x="1" y="1" width="878" height="76" rx="13" fill="#FAF9F6"/>
  <line x1="1" y1="77" x2="879" y2="77" stroke="#E3DFD7" stroke-width="1"/>
  <text x="26" y="28" font-size="11" font-weight="700" fill="#7A1F2B" letter-spacing="0.05em">POST-2024 CONTRACTOR TEST · FWA s 15AA &amp; SGAA s 12(3)</text>
  <text x="26" y="51" font-size="16" font-weight="800" fill="#1F242B">How the $190,100 Threshold Splits ABN Contractor Law (FY 2026–27)</text>
  <text x="26" y="69" font-size="11.2" fill="#525B67">Authorities: FWA ss 15AA–15AC, s 357(2) · Dickerson [2025] FWC 2219 · Crooks v Hyundai Rotem [2026] FWC 1104</text>
  <rect x="22" y="94" width="408" height="218" rx="10" fill="#FDF3F4" stroke="#7A1F2B" stroke-width="1.3"/>
  <rect x="22" y="94" width="408" height="32" rx="9" fill="#7A1F2B"/>
  <text x="38" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">BELOW $190,100 · MANDATORY s 15AA SUBSTANCE TEST</text>
  <circle cx="42" cy="144" r="4" fill="#7A1F2B"/>
  <text x="54" y="148" font-size="12.2" font-weight="800" fill="#1F242B">Practical Reality Overrides Written Labels</text>
  <text x="54" y="167" font-size="11.1" fill="#525B67">Rosters, supervision &amp; inability to delegate convert ABN to employee.</text>
  <circle cx="42" cy="196" r="4" fill="#7A1F2B"/>
  <text x="54" y="200" font-size="12.2" font-weight="800" fill="#1F242B">6-Year Backpay &amp; Reinstatement (Dickerson)</text>
  <text x="54" y="219" font-size="11.1" fill="#525B67">FWC overrode contractor contract, ordering reinstatement &amp; backpay.</text>
  <circle cx="42" cy="248" r="4" fill="#7A1F2B"/>
  <text x="54" y="252" font-size="12.2" font-weight="800" fill="#1F242B">12% Super Owed Even to Real Contractors</text>
  <text x="54" y="271" font-size="11.1" fill="#525B67">SGAA s 12(3) mandates 12% super on contracts principally for labour.</text>
  <rect x="450" y="94" width="408" height="218" rx="10" fill="#EEF5F7" stroke="#1F4E5F" stroke-width="1.3"/>
  <rect x="450" y="94" width="408" height="32" rx="9" fill="#1F4E5F"/>
  <text x="466" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">ABOVE $190,100 · WRITTEN s 15AB OPT-OUT TRACK</text>
  <circle cx="470" cy="144" r="4" fill="#1F4E5F"/>
  <text x="482" y="148" font-size="12.2" font-weight="800" fill="#1F242B">Valid s 15AB Notice Preserves Contract Primacy</text>
  <text x="482" y="167" font-size="11.1" fill="#525B67">Keeps Personnel Contracting alive (Crooks v Hyundai Rotem [2026]).</text>
  <circle cx="470" cy="196" r="4" fill="#1F4E5F"/>
  <text x="482" y="200" font-size="12.2" font-weight="800" fill="#1F242B">Genuine Tripartite Corporate Structures</text>
  <text x="482" y="219" font-size="11.1" fill="#525B67">Independent business risk &amp; corporate invoicing upheld (Barakat [2026]).</text>
  <circle cx="470" cy="248" r="4" fill="#1F4E5F"/>
  <text x="482" y="252" font-size="12.2" font-weight="800" fill="#1F242B">Strict s 357(2) &#x27;Reasonable Belief&#x27; Defence</text>
  <text x="482" y="271" font-size="11.1" fill="#525B67">Employers bear the onus of proving objective grounds for ABN engagement.</text>
  <rect x="22" y="328" width="836" height="38" rx="8" fill="#EDF7F2" stroke="#1D6B48" stroke-width="1"/>
  <text x="36" y="351" font-size="11.2" font-weight="700" fill="#1D6B48">Action Point: Construction, cleaning, fitness, NDIS &amp; logistics operators must audit ABN cohorts before 6-year claims crystallise.</text>
