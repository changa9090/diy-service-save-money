<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 382" width="100%" role="img" aria-label="2026년 7월 $190,100 소득 기준선에 따른 ABN 계약자 법적 지위 분기" style="max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <rect x="0.5" y="0.5" width="879" height="381" rx="14" fill="#FFFFFF" stroke="#E3DFD7" stroke-width="1"/>
  <rect x="1" y="1" width="878" height="76" rx="13" fill="#FAF9F6"/>
  <line x1="1" y1="77" x2="879" y2="77" stroke="#E3DFD7" stroke-width="1"/>
  <text x="26" y="28" font-size="11" font-weight="700" fill="#7A1F2B" letter-spacing="0.05em">2024–2026 도급·근로자 판별 · FWA s 15AA 실질 심사 &amp; $190,100 기준선</text>
  <text x="26" y="51" font-size="16" font-weight="800" fill="#1F242B">2026년 7월 $190,100 소득 기준선에 따른 ABN 계약자 법적 지위 분기</text>
  <text x="26" y="69" font-size="11.2" fill="#525B67">근거: FWA ss 15AA–15AC, s 357(2) · Dickerson [2025] FWC 2219 · Crooks v Hyundai Rotem [2026] FWC 1104</text>
  <rect x="22" y="94" width="408" height="218" rx="10" fill="#FDF3F4" stroke="#7A1F2B" stroke-width="1.3"/>
  <rect x="22" y="94" width="408" height="32" rx="9" fill="#7A1F2B"/>
  <text x="38" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">연 소득 $190,100 미만 · s 15AA 실질 우선 원칙</text>
  <circle cx="42" cy="144" r="4" fill="#7A1F2B"/>
  <text x="54" y="148" font-size="12.2" font-weight="800" fill="#1F242B">계약서 문구보다 실제 근무 실태 우선</text>
  <text x="54" y="167" font-size="11.1" fill="#525B67">출퇴근 통제·고정 시급·대체 인력 투입 불가 시 근로자로 직권 전환.</text>
  <circle cx="42" cy="196" r="4" fill="#7A1F2B"/>
  <text x="54" y="200" font-size="12.2" font-weight="800" fill="#1F242B">6년 치 연차·주말수당 + 복직 명령 (Dickerson)</text>
  <text x="54" y="219" font-size="11.1" fill="#525B67">독립계약서 서명에도 근로자 인정 및 6개월 임금·복직 선고.</text>
  <circle cx="42" cy="248" r="4" fill="#7A1F2B"/>
  <text x="54" y="252" font-size="12.2" font-weight="800" fill="#1F242B">개인 노무 ABN도 12% 퇴직연금 의무 (SGAA s 12(3))</text>
  <text x="54" y="271" font-size="11.1" fill="#525B67">진정한 프리랜서라도 본인 노동력 대가면 12% 연금 별도 부과!</text>
  <rect x="450" y="94" width="408" height="218" rx="10" fill="#EEF5F7" stroke="#1F4E5F" stroke-width="1.3"/>
  <rect x="450" y="94" width="408" height="32" rx="9" fill="#1F4E5F"/>
  <text x="466" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">연 소득 $190,100 초과 · s 15AB 서면 배제 통지</text>
  <circle cx="470" cy="144" r="4" fill="#1F4E5F"/>
  <text x="482" y="148" font-size="12.2" font-weight="800" fill="#1F242B">적법한 s 15AB Opt-Out 통지 시 계약문언 유지</text>
  <text x="482" y="167" font-size="11.1" fill="#525B67">고법 판례(Personnel Contracting) 유지 · Crooks [2026] FWC 1104.</text>
  <circle cx="470" cy="196" r="4" fill="#1F4E5F"/>
  <text x="482" y="200" font-size="12.2" font-weight="800" fill="#1F242B">진정한 법인 대 법인(Pty Ltd) 도급 구조</text>
  <text x="482" y="219" font-size="11.1" fill="#525B67">독자적 사업 리스크·다수 거래처 보유 시 도급 인정 (Barakat [2026]).</text>
  <circle cx="470" cy="248" r="4" fill="#1F4E5F"/>
  <text x="482" y="252" font-size="12.2" font-weight="800" fill="#1F242B">강화된 위장도급 항변 문턱 (FWA s 357(2))</text>
  <text x="482" y="271" font-size="11.1" fill="#525B67">고용주가 &#x27;합리적 믿음(Reasonable Belief)&#x27;을 객관적 자문으로 입증해야 면책.</text>
  <rect x="22" y="328" width="836" height="38" rx="8" fill="#EDF7F2" stroke="#1D6B48" stroke-width="1"/>
  <text x="36" y="351" font-size="11.2" font-weight="700" fill="#1D6B48">점검 포인트: 건설·청소·필라테스·NDIS·뷰티 업종 다수 ABN 운영 법인과 장기 전속 ABN 인력은 6년 역추징 전에 구조를 재설계해야 합니다.</text>
</svg>
