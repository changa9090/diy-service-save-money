<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 366" width="100%" role="img" aria-label="482·186 비자 근로자 해고 시 동시에 흐르는 3대 법적 위험 구간" style="max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <rect x="0.5" y="0.5" width="879" height="365" rx="14" fill="#FFFFFF" stroke="#E3DFD7" stroke-width="1"/>
  <rect x="1" y="1" width="878" height="76" rx="13" fill="#FAF9F6"/>
  <line x1="1" y1="77" x2="879" y2="77" stroke="#E3DFD7" stroke-width="1"/>
  <text x="26" y="28" font-size="11" font-weight="700" fill="#7A1F2B" letter-spacing="0.05em">고용법 × 이민법 동시 작동 · 스폰서 비자 해고 이중 시계</text>
  <text x="26" y="51" font-size="16" font-weight="800" fill="#1F242B">482·186 비자 근로자 해고 시 동시에 흐르는 3대 법적 위험 구간</text>
  <text x="26" y="69" font-size="11.2" fill="#525B67">근거: FWA ss 389(2), 394(2) · Helensburgh Coal [2025] HCA 29 · Migration Regs cl 8607 · ss 245AR–245AS</text>
  <rect x="22" y="94" width="264" height="202" rx="10" fill="#FDF3F4" stroke="#7A1F2B" stroke-width="1.3"/>
  <rect x="22" y="94" width="264" height="30" rx="9" fill="#7A1F2B"/>
  <text x="36" y="114" font-size="11.3" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">CLOCK 01 · 단 21일 (달력일)</text>
  <text x="36" y="149" font-size="13.2" font-weight="800" fill="#1F242B">FWC 부당해고·일반보호 제소</text>
  <text x="36" y="170" font-size="11" font-weight="700" fill="#7A1F2B">Helensburgh Coal [2025] HCA 29</text>
  <line x1="36" y1="182" x2="272" y2="182" stroke="#E3DFD7" stroke-width="1"/>
  <text x="36" y="204" font-size="11.2" fill="#1F242B" font-weight="600">해고 효력일로부터 21일 내 접수 ($92.70)</text>
  <text x="36" y="225" font-size="11.2" fill="#525B67" font-weight="400">외주 인력 유지 시 정리해고 무효 가능(HCA)</text>
  <text x="36" y="246" font-size="11.2" fill="#525B67" font-weight="400">일방적 합의서(Deed) 서명 시 청구권 소멸</text>
  <text x="36" y="267" font-size="11.2" fill="#525B67" font-weight="400">퇴사 사유를 자발적 사임으로 정정 협상 핵심</text>
  <line x1="289" y1="195" x2="300" y2="195" stroke="#1F242B" stroke-width="1.8"/>
  <polygon points="303,195 297,191 297,199" fill="#1F242B"/>
  <rect x="306" y="94" width="264" height="202" rx="10" fill="#EEF5F7" stroke="#1F4E5F" stroke-width="1.3"/>
  <rect x="306" y="94" width="264" height="30" rx="9" fill="#1F4E5F"/>
  <text x="320" y="114" font-size="11.3" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">CLOCK 02 · 연속 180일 / 총 365일</text>
  <text x="320" y="149" font-size="13.2" font-weight="800" fill="#1F242B">Condition 8607 스폰서 변경</text>
  <text x="320" y="170" font-size="11" font-weight="700" fill="#1F4E5F">Migration Regs Sch 8 cl 8607</text>
  <line x1="320" y1="182" x2="556" y2="182" stroke="#E3DFD7" stroke-width="1"/>
  <text x="320" y="204" font-size="11.2" fill="#1F242B" font-weight="600">고용 종료 후 최대 180일간 타 직장 근무 허용</text>
  <text x="320" y="225" font-size="11.2" fill="#525B67" font-weight="400">전체 비자 기간 중 누적 365일 상한 엄수</text>
  <text x="320" y="246" font-size="11.2" fill="#525B67" font-weight="400">주의: 무스폰서 공백기는 186 TRT 경력 단절</text>
  <text x="320" y="267" font-size="11.2" fill="#525B67" font-weight="400">새 SID 482 노미네이션 접수 시점 정밀 연동</text>
  <line x1="573" y1="195" x2="584" y2="195" stroke="#1F242B" stroke-width="1.8"/>
  <polygon points="587,195 581,191 581,199" fill="#1F242B"/>
  <rect x="590" y="94" width="264" height="202" rx="10" fill="#FEF8EC" stroke="#9A6700" stroke-width="1.3"/>
  <rect x="590" y="94" width="264" height="30" rx="9" fill="#9A6700"/>
  <text x="604" y="114" font-size="11.3" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">TRAP 03 · 불법 비자 대가</text>
  <text x="604" y="149" font-size="13.2" font-weight="800" fill="#1F242B">스폰서십 금품 수수 양벌 규정</text>
  <text x="604" y="170" font-size="11" font-weight="700" fill="#9A6700">Migration Act ss 245AR–245AS · s 116</text>
  <line x1="604" y1="182" x2="840" y2="182" stroke="#E3DFD7" stroke-width="1"/>
  <text x="604" y="204" font-size="11.2" fill="#1F242B" font-weight="600">요구·수령(s 245AR): 징역 2년 / $131,040 벌금</text>
  <text x="604" y="225" font-size="11.2" fill="#525B67" font-weight="400">제안·지급(s 245AS): $87,360 과태료 주의</text>
  <text x="604" y="246" font-size="11.2" fill="#525B67" font-weight="400">공모 시 reg 2.43(1)(la) 비자 직권 취소 위험</text>
  <text x="604" y="267" font-size="11.2" fill="#525B67" font-weight="400">이민·고용 통합 자문으로 자백 리스크 차단</text>
  <rect x="22" y="312" width="836" height="38" rx="8" fill="#FEF8EC" stroke="#ECD9B0" stroke-width="1"/>
  <text x="36" y="335" font-size="11.2" font-weight="700" fill="#1F242B">핵심 원칙: 이민 법무사는 FWC 합의서를 못 다루고 일반 노동 변호사는 186 영주권 단절을 놓칩니다. 두 시계를 한 테이블에서 묶어야 합니다.</text>
</svg>
