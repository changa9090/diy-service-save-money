  <text x="26" y="51" font-size="16" font-weight="800" fill="#1F242B">Three Paths After a PIC 4020 s 57 Natural Justice Invitation</text>
  <text x="26" y="69" font-size="11.2" fill="#525B67">Authorities: Trivedi [2014] FCAFC 42 · Mudiyanselage [2013] FCA 266 · Arora [2016] FCAFC 35 · Kaur [2017] FCAFC 184</text>
