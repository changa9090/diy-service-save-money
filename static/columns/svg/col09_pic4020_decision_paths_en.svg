  <text x="604" y="204" font-size="11.2" fill="#1F242B" font-weight="600">Prove innocent error vs purposeful falsity</text>
  <text x="604" y="225" font-size="11.2" fill="#525B67" font-weight="400">ATO STP, bank &amp; metadata corroboration</text>
  <text x="604" y="246" font-size="11.2" fill="#525B67" font-weight="400">Plead PIC 4020(4) AU citizen/PR waiver</text>
  <text x="604" y="267" font-size="11.2" fill="#525B67" font-weight="400">Preserves clean record for permanent visa</text>
  <rect x="22" y="312" width="836" height="38" rx="8" fill="#FEF8EC" stroke="#ECD9B0" stroke-width="1"/>
  <text x="36" y="335" font-size="11.2" font-weight="700" fill="#1F242B">Urgent Rule: Never click withdraw blindly during the 28-day s 57 window without auditing Bridging status, s 48 bars &amp; ICSE flags.</text>
