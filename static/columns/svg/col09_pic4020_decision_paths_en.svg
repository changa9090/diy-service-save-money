  <text x="36" y="149" font-size="13.2" font-weight="800" fill="#1F242B">Swap Document Only → Refusal</text>
  <text x="36" y="170" font-size="11" font-weight="700" fill="#7A1F2B">Mudiyanselage [2013] FCA 266</text>
  <line x1="36" y1="182" x2="272" y2="182" stroke="#E3DFD7" stroke-width="1"/>
