  <text x="36" y="246" font-size="11.2" fill="#525B67" font-weight="400">Skills-body docs caught too (Arora)</text>
  <text x="36" y="267" font-size="11.2" fill="#525B67" font-weight="400">Triggers 3-yr bar (10-yr identity bar)</text>
  <rect x="306" y="94" width="264" height="202" rx="10" fill="#FEF8EC" stroke="#9A6700" stroke-width="1.3"/>
  <rect x="306" y="94" width="264" height="30" rx="9" fill="#9A6700"/>
  <text x="320" y="114" font-size="11.3" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">OPTION B · BLIND s 49 WITHDRAWAL</text>
  <text x="320" y="149" font-size="13.2" font-weight="800" fill="#1F242B">Avoids Bar, Leaves ICSE Flag</text>
  <text x="320" y="170" font-size="11" font-weight="700" fill="#9A6700">Migration Act ss 48, 49 &amp; ICSE</text>
  <line x1="320" y1="182" x2="556" y2="182" stroke="#E3DFD7" stroke-width="1"/>
  <text x="320" y="204" font-size="11.2" fill="#1F242B" font-weight="600">Halts formal refusal bar before decision</text>
  <text x="320" y="225" font-size="11.2" fill="#525B67" font-weight="400">Leaves permanent ICSE malafide alert</text>
  <text x="320" y="246" font-size="11.2" fill="#525B67" font-weight="400">Future employment claims clash with record</text>
  <text x="320" y="267" font-size="11.2" fill="#525B67" font-weight="400">Onshore BVA ceases + triggers s 48 / Sch 3</text>
