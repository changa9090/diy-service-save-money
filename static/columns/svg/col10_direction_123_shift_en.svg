  <text x="26" y="28" font-size="11" font-weight="700" fill="#7A1F2B" letter-spacing="0.05em">MINISTERIAL DIRECTION NO. 123 · COMMENCED 31 OCT 2026</text>
  <text x="26" y="51" font-size="16" font-weight="800" fill="#1F242B">From Revoked Direction 110 to Direction 123 (Effective 31 Oct 2026)</text>
  <text x="26" y="69" font-size="11.2" fill="#525B67">Authorities: Migration Act s 499, s 116(1)(e), s 501 · Gong [2016] FCCA 561 · Ismail [2024] HCA 2 · M1/2021 [2022] HCA 17</text>
