  <text x="38" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">4 PRIMARY CONSIDERATIONS (DIRECTION 123)</text>
  <circle cx="42" cy="144" r="4" fill="#7A1F2B"/>
  <text x="54" y="148" font-size="12.2" font-weight="800" fill="#1F242B">1. Protection of the Australian Community</text>
  <text x="54" y="167" font-size="11.1" fill="#525B67">Overarching safety priority; untested charges can trigger s 116(1)(e).</text>
  <circle cx="42" cy="196" r="4" fill="#7A1F2B"/>
  <text x="54" y="200" font-size="12.2" font-weight="800" fill="#1F242B">2. Expanded Domestic &amp; Family Violence</text>
  <text x="54" y="219" font-size="11.1" fill="#525B67">Expressly covers coercive control, stalking, image abuse &amp; order breaches.</text>
  <circle cx="42" cy="248" r="4" fill="#7A1F2B"/>
  <text x="54" y="252" font-size="12.2" font-weight="800" fill="#1F242B">3. Community Expectations &amp; 4. Minor Children</text>
  <text x="54" y="271" font-size="11.1" fill="#525B67">Adds hate speech/extremism under Expectations + best interests of kids.</text>
  <rect x="450" y="94" width="408" height="218" rx="10" fill="#EEF5F7" stroke="#1F4E5F" stroke-width="1.3"/>
  <rect x="450" y="94" width="408" height="32" rx="9" fill="#1F4E5F"/>
  <text x="466" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">DOWNGRADED &amp; DELETED FACTORS (CRITICAL SHIFT)</text>
  <circle cx="470" cy="144" r="4" fill="#1F4E5F"/>
  <text x="482" y="148" font-size="12.2" font-weight="800" fill="#1F242B">Ties to Australia Downgraded to &#x27;Other&#x27;</text>
  <text x="482" y="167" font-size="11.1" fill="#525B67">Long residence &amp; character references no longer carry primary weight.</text>
  <circle cx="470" cy="196" r="4" fill="#1F4E5F"/>
  <text x="482" y="200" font-size="12.2" font-weight="800" fill="#1F242B">Impact on Business Interests Deleted</text>
  <text x="482" y="219" font-size="11.1" fill="#525B67">Removed entirely as a standalone consideration under Direction 123.</text>
  <circle cx="470" cy="248" r="4" fill="#1F4E5F"/>
  <text x="482" y="252" font-size="12.2" font-weight="800" fill="#1F242B">Premature Apology = Criminal Self-Incrimination</text>
  <text x="482" y="271" font-size="11.1" fill="#525B67">NOICC replies on pending charges must protect criminal defence rights.</text>
  <rect x="22" y="328" width="836" height="38" rx="8" fill="#EDF7F2" stroke="#1D6B48" stroke-width="1"/>
  <text x="36" y="351" font-size="11.2" font-weight="700" fill="#1D6B48">Urgent Takeaway: Outdated Direction 99/110 templates fail under Direction 123. Structure representations strictly around the Oct 2026 rules.</text>
