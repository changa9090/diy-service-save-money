<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 382" width="100%" role="img" aria-label="From Revoked Direction 110 to Direction 123 (Effective 31 Oct 2026)" style="max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
