<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 382" width="100%" role="img" aria-label="구 장관훈령 제110호 폐지와 신설 제123호의 비자 취소 심사 구조 비교" style="max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <rect x="0.5" y="0.5" width="879" height="381" rx="14" fill="#FFFFFF" stroke="#E3DFD7" stroke-width="1"/>
  <rect x="1" y="1" width="878" height="76" rx="13" fill="#FAF9F6"/>
  <line x1="1" y1="77" x2="879" y2="77" stroke="#E3DFD7" stroke-width="1"/>
  <text x="26" y="28" font-size="11" font-weight="700" fill="#7A1F2B" letter-spacing="0.05em">2026년 10월 31일 전격 시행 · 장관훈령 제123호(Direction 123) 대개편</text>
  <text x="26" y="51" font-size="16" font-weight="800" fill="#1F242B">구 장관훈령 제110호 폐지와 신설 제123호의 비자 취소 심사 구조 비교</text>
  <text x="26" y="69" font-size="11.2" fill="#525B67">근거: Migration Act s 499, s 116(1)(e), s 501 · Gong [2016] FCCA 561 · Ismail [2024] HCA 2 · M1/2021 [2022] HCA 17</text>
  <rect x="22" y="94" width="408" height="218" rx="10" fill="#FDF3F4" stroke="#7A1F2B" stroke-width="1.3"/>
  <rect x="22" y="94" width="408" height="32" rx="9" fill="#7A1F2B"/>
  <text x="38" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">4대 최우선 고려사항 (4 PRIMARY CONSIDERATIONS)</text>
  <circle cx="42" cy="144" r="4" fill="#7A1F2B"/>
  <text x="54" y="148" font-size="12.2" font-weight="800" fill="#1F242B">1. 호주 지역사회 보호 (최상위 가중치)</text>
  <text x="54" y="167" font-size="11.1" fill="#525B67">범행 중대성 및 재범 위험도 · 기소 단계(s 116(1)(e))에서도 발동.</text>
  <circle cx="42" cy="196" r="4" fill="#7A1F2B"/>
  <text x="54" y="200" font-size="12.2" font-weight="800" fill="#1F242B">2. 가정폭력 범위 대폭 확대 (강압적 통제 포함)</text>
  <text x="54" y="219" font-size="11.1" fill="#525B67">불법 촬영물·스토킹·디지털 학대·보호명령 위반 모두 최우선 심사.</text>
  <circle cx="42" cy="248" r="4" fill="#7A1F2B"/>
  <text x="54" y="252" font-size="12.2" font-weight="800" fill="#1F242B">3. 지역사회 기대치(혐오발언 명시) &amp; 4. 미성년 자녀 이익</text>
  <text x="54" y="271" font-size="11.1" fill="#525B67">극단주의·사회 분열 선동 엄단 및 호주 내 미성년 자녀 최선의 이익.</text>
  <rect x="450" y="94" width="408" height="218" rx="10" fill="#EEF5F7" stroke="#1F4E5F" stroke-width="1.3"/>
  <rect x="450" y="94" width="408" height="32" rx="9" fill="#1F4E5F"/>
  <text x="466" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">등급 강등 및 완전 삭제 항목 (치명적 전략 변화!)</text>
  <circle cx="470" cy="144" r="4" fill="#1F4E5F"/>
  <text x="482" y="148" font-size="12.2" font-weight="800" fill="#1F242B">호주 내 유대관계(Ties to Australia) → 기타(Other)로 강등!</text>
  <text x="482" y="167" font-size="11.1" fill="#525B67">장기 거주·주변 탄원서만 호소하던 구식 방어 논리는 더 이상 안 통합니다.</text>
  <circle cx="470" cy="196" r="4" fill="#1F4E5F"/>
  <text x="482" y="200" font-size="12.2" font-weight="800" fill="#1F242B">호주 사업체 영향(Business Interests) → 아예 삭제!</text>
  <text x="482" y="219" font-size="11.1" fill="#525B67">고용주 피해 호소 항목 자체가 훈령 본문에서 완전히 폐지되었습니다.</text>
  <circle cx="470" cy="248" r="4" fill="#1F4E5F"/>
  <text x="482" y="252" font-size="12.2" font-weight="800" fill="#1F242B">형사 재판 전 섣부른 반성문 = 유죄 자백 독배</text>
  <text x="482" y="271" font-size="11.1" fill="#525B67">무죄 추정 방어권과 비자 소명(Gong 법리)을 동시에 조율해야 생존합니다.</text>
  <rect x="22" y="328" width="836" height="38" rx="8" fill="#EDF7F2" stroke="#1D6B48" stroke-width="1"/>
  <text x="36" y="351" font-size="11.2" font-weight="700" fill="#1D6B48">핵심 대응: NOICC 통지 후 수일~28일 기한 내에 구식 Direction 99/110 템플릿을 쓰면 패소합니다. 현행 123호 기준에 맞춘 법리 소명이 필수입니다.</text>
</svg>
