  <text x="36" y="225" font-size="11.2" fill="#525B67" font-weight="400">Specialist Skills stream: $146,576 SSIT</text>
  <text x="36" y="246" font-size="11.2" fill="#525B67" font-weight="400">Guaranteed monetary earnings only</text>
  <text x="36" y="267" font-size="11.2" fill="#525B67" font-weight="400">Must also match Australian Market Salary</text>
