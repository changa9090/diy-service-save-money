<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 366" width="100%" role="img" aria-label="Three Legal Gateways for Onshore Subclass 820 After Refusal or Overstay" style="max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <rect x="0.5" y="0.5" width="879" height="365" rx="14" fill="#FFFFFF" stroke="#E3DFD7" stroke-width="1"/>
  <rect x="1" y="1" width="878" height="76" rx="13" fill="#FAF9F6"/>
  <line x1="1" y1="77" x2="879" y2="77" stroke="#E3DFD7" stroke-width="1"/>
  <text x="26" y="28" font-size="11" font-weight="700" fill="#7A1F2B" letter-spacing="0.05em">ONSHORE PARTNER VISA (820/801) · s 48 &amp; SCHEDULE 3</text>
  <text x="26" y="51" font-size="16" font-weight="800" fill="#1F242B">Three Legal Gateways for Onshore Subclass 820 After Refusal or Overstay</text>
  <text x="26" y="69" font-size="11.2" fill="#525B67">Authorities: Migration Act s 48 · Reg 2.12 · cl 820.211(2)(d)(ii) · Waensila [2016] FCAFC 32 · Babicci [2005] FCAFC 77</text>
  <rect x="22" y="94" width="264" height="202" rx="10" fill="#EEF5F7" stroke="#1F4E5F" stroke-width="1.3"/>
  <rect x="22" y="94" width="264" height="30" rx="9" fill="#1F4E5F"/>
  <text x="36" y="114" font-size="11.3" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">STEP 01 · VALIDITY GATE</text>
  <text x="36" y="149" font-size="13.2" font-weight="800" fill="#1F242B">Clearing the Section 48 Bar</text>
  <text x="36" y="170" font-size="11" font-weight="700" fill="#1F4E5F">Migration Act s 48 · Reg 2.12</text>
  <line x1="36" y1="182" x2="272" y2="182" stroke="#E3DFD7" stroke-width="1"/>
  <text x="36" y="204" font-size="11.2" fill="#1F242B" font-weight="600">s 48 bars most onshore visas after refusal</text>
  <text x="36" y="225" font-size="11.2" fill="#525B67" font-weight="400">Subclass 820/801 sits on reg 2.12 list</text>
  <text x="36" y="246" font-size="11.2" fill="#525B67" font-weight="400">Must check prior partner refusal bars</text>
  <text x="36" y="267" font-size="11.2" fill="#525B67" font-weight="400">Invalid lodgement leaves no Bridging Visa</text>
  <line x1="289" y1="195" x2="300" y2="195" stroke="#1F242B" stroke-width="1.8"/>
  <polygon points="303,195 297,191 297,199" fill="#1F242B"/>
  <rect x="306" y="94" width="264" height="202" rx="10" fill="#FDF3F4" stroke="#7A1F2B" stroke-width="1.3"/>
  <rect x="306" y="94" width="264" height="30" rx="9" fill="#7A1F2B"/>
  <text x="320" y="114" font-size="11.3" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">STEP 02 · SCHEDULE 3 TRAP</text>
  <text x="320" y="149" font-size="13.2" font-weight="800" fill="#1F242B">Substantive Expiry &gt;28 Days</text>
  <text x="320" y="170" font-size="11" font-weight="700" fill="#7A1F2B">Schedule 3 Criteria 3001, 3003, 3004</text>
  <line x1="320" y1="182" x2="556" y2="182" stroke="#E3DFD7" stroke-width="1"/>
  <text x="320" y="204" font-size="11.2" fill="#1F242B" font-weight="600">BVA/BVB/BVC or unlawful status triggers Sch 3</text>
  <text x="320" y="225" font-size="11.2" fill="#525B67" font-weight="400">Genuine marriage alone NEVER waives Sch 3</text>
  <text x="320" y="246" font-size="11.2" fill="#525B67" font-weight="400">Routine offshore inconvenience fails (Babicci)</text>
  <text x="320" y="267" font-size="11.2" fill="#525B67" font-weight="400">Requires forceful &#x27;compelling reasons&#x27;</text>
  <line x1="573" y1="195" x2="584" y2="195" stroke="#1F242B" stroke-width="1.8"/>
  <polygon points="587,195 581,191 581,199" fill="#1F242B"/>
  <rect x="590" y="94" width="264" height="202" rx="10" fill="#EDF7F2" stroke="#1D6B48" stroke-width="1.3"/>
  <rect x="590" y="94" width="264" height="30" rx="9" fill="#1D6B48"/>
  <text x="604" y="114" font-size="11.3" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">STEP 03 · WAENSILA DOCTRINE</text>
  <text x="604" y="149" font-size="13.2" font-weight="800" fill="#1F242B">Up-to-Decision Evidence</text>
  <text x="604" y="170" font-size="11" font-weight="700" fill="#1D6B48">Waensila [2016] FCAFC 32</text>
  <line x1="604" y1="182" x2="840" y2="182" stroke="#E3DFD7" stroke-width="1"/>
  <text x="604" y="204" font-size="11.2" fill="#1F242B" font-weight="600">Waiver NOT frozen at date of application</text>
  <text x="604" y="225" font-size="11.2" fill="#525B67" font-weight="400">Weighs all facts up to decision / ART review</text>
  <text x="604" y="246" font-size="11.2" fill="#525B67" font-weight="400">AU citizen child birth, illness, care needs</text>
  <text x="604" y="267" font-size="11.2" fill="#525B67" font-weight="400">Backed by clinical &amp; specialist submissions</text>
  <rect x="22" y="312" width="836" height="38" rx="8" fill="#FEF8EC" stroke="#ECD9B0" stroke-width="1"/>
  <text x="36" y="335" font-size="11.2" font-weight="700" fill="#1F242B">Practice Rule: Emotional love letters fail Schedule 3. Build objective clinical, child-welfare &amp; hardship evidence under Waensila.</text>
</svg>
