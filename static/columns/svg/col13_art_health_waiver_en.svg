<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 382" width="100%" role="img" aria-label="Winning at the ART &amp; Challenging $86,000 MOC Health Cost Opinions" style="max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
