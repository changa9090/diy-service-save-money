  <text x="26" y="28" font-size="11" font-weight="700" fill="#7A1F2B" letter-spacing="0.05em">ART MERITS REVIEW ($3,727) · PIC 4005 / 4007 ($86,000 SCT)</text>
  <text x="26" y="51" font-size="16" font-weight="800" fill="#1F242B">Winning at the ART &amp; Challenging $86,000 MOC Health Cost Opinions</text>
  <text x="26" y="69" font-size="11.2" fill="#525B67">Authorities: ART Fee $3,727 (1 Jul 2026) · $86,000 SCT · Robinson [2005] FCA 1626 · Bui [1999] FCA 118</text>
  <rect x="22" y="94" width="408" height="218" rx="10" fill="#EEF5F7" stroke="#1F4E5F" stroke-width="1.3"/>
  <rect x="22" y="94" width="408" height="32" rx="9" fill="#1F4E5F"/>
  <text x="38" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">1. ART JURISDICTION &amp; TIME-OF-DECISION RULES</text>
  <circle cx="42" cy="144" r="4" fill="#1F4E5F"/>
  <text x="54" y="148" font-size="12.2" font-weight="800" fill="#1F242B">Zero Discretion to Extend Deadlines ($3,727)</text>
  <text x="54" y="167" font-size="11.1" fill="#525B67">Missing the 28-day (or 7/9/14-day) statutory window kills jurisdiction.</text>
  <circle cx="42" cy="196" r="4" fill="#1F4E5F"/>
  <text x="54" y="200" font-size="12.2" font-weight="800" fill="#1F242B">Time-of-Application vs Time-of-Decision</text>
  <text x="54" y="219" font-size="11.1" fill="#525B67">De novo review cures ToD criteria with fresh evidence up to hearing.</text>
  <circle cx="42" cy="248" r="4" fill="#1F4E5F"/>
  <text x="54" y="252" font-size="12.2" font-weight="800" fill="#1F242B">Linked Nomination &amp; Visa Strategy</text>
  <text x="54" y="271" font-size="11.1" fill="#525B67">Subclass 482/186 refusals require preserving a live approved nomination.</text>
  <rect x="450" y="94" width="408" height="218" rx="10" fill="#FDF3F4" stroke="#7A1F2B" stroke-width="1.3"/>
  <rect x="450" y="94" width="408" height="32" rx="9" fill="#7A1F2B"/>
  <text x="466" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">2. CHALLENGING $86,000 HEALTH REFUSALS</text>
  <circle cx="470" cy="144" r="4" fill="#7A1F2B"/>
  <text x="482" y="148" font-size="12.2" font-weight="800" fill="#1F242B">Weapon A: Robinson Severity Error (4005 &amp; 4007)</text>
  <text x="482" y="167" font-size="11.1" fill="#525B67">Generic MOC cost assumptions ignoring actual severity are invalid in law.</text>
  <circle cx="470" cy="196" r="4" fill="#7A1F2B"/>
  <text x="482" y="200" font-size="12.2" font-weight="800" fill="#1F242B">Weapon B: PIC 4007(2) Undue-Cost Waiver (Bui)</text>
  <text x="482" y="219" font-size="11.1" fill="#525B67">Available on Partner, SID 482 &amp; 186 TRT visas via tax/family mitigation.</text>
  <circle cx="470" cy="248" r="4" fill="#7A1F2B"/>
  <text x="482" y="252" font-size="12.2" font-weight="800" fill="#1F242B">5-Year (Max 10-Year) Costing Deconstruction</text>
  <text x="482" y="271" font-size="11.1" fill="#525B67">Specialist functional reports rebut inflated NDIS/special-ed estimates.</text>
  <rect x="22" y="328" width="836" height="38" rx="8" fill="#EDF7F2" stroke="#1D6B48" stroke-width="1"/>
  <text x="36" y="351" font-size="11.2" font-weight="700" fill="#1D6B48">Takeaway: An $86,000+ MOC costing is rarely the final word; audit Robinson validity and PIC 4007(2) mitigation immediately.</text>
