<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 382" width="100%" role="img" aria-label="ART 재심 승패를 가르는 시점 법리와 $86,000 의료비 거절 대응 전략" style="max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <rect x="0.5" y="0.5" width="879" height="381" rx="14" fill="#FFFFFF" stroke="#E3DFD7" stroke-width="1"/>
  <rect x="1" y="1" width="878" height="76" rx="13" fill="#FAF9F6"/>
  <line x1="1" y1="77" x2="879" y2="77" stroke="#E3DFD7" stroke-width="1"/>
  <text x="26" y="28" font-size="11" font-weight="700" fill="#7A1F2B" letter-spacing="0.05em">행정재심원(ART $3,727) 본안 재심 · $86,000 건강 요건(PIC 4005·4007) 돌파</text>
  <text x="26" y="51" font-size="16" font-weight="800" fill="#1F242B">ART 재심 승패를 가르는 시점 법리와 $86,000 의료비 거절 대응 전략</text>
  <text x="26" y="69" font-size="11.2" fill="#525B67">근거: ART Filing Fee $3,727 (2026.7.1) · SCT $86,000 · Robinson [2005] FCA 1626 · Bui [1999] FCA 118</text>
  <rect x="22" y="94" width="408" height="218" rx="10" fill="#EEF5F7" stroke="#1F4E5F" stroke-width="1.3"/>
  <rect x="22" y="94" width="408" height="32" rx="9" fill="#1F4E5F"/>
  <text x="38" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">트랙 1 · 행정재심원(ART) 접수 시한과 시점 요건</text>
  <circle cx="42" cy="144" r="4" fill="#1F4E5F"/>
  <text x="54" y="148" font-size="12.2" font-weight="800" fill="#1F242B">단 1분도 연장 없는 절대 제소기한 ($3,727)</text>
  <text x="54" y="167" font-size="11.1" fill="#525B67">일반 거절 28일 · 취소/구금 7영업일~14일 도과 시 관할권 영구 소멸.</text>
  <circle cx="42" cy="196" r="4" fill="#1F4E5F"/>
  <text x="54" y="200" font-size="12.2" font-weight="800" fill="#1F242B">신청 시점(ToA) vs 재심 결정 시점(ToD) 구분</text>
  <text x="54" y="219" font-size="11.1" fill="#525B67">접수일 요건 흠결은 보완이 불가능하나, 결정 시점 요건은 신규 증거로 치유!</text>
  <circle cx="42" cy="248" r="4" fill="#1F4E5F"/>
  <text x="54" y="252" font-size="12.2" font-weight="800" fill="#1F242B">스폰서 노미네이션 거절 연동 방어</text>
  <text x="54" y="271" font-size="11.1" fill="#525B67">고용주 지명 거절 시 비자 단독 재심만으론 불충분 · 노미네이션 연결 필수.</text>
  <rect x="450" y="94" width="408" height="218" rx="10" fill="#FDF3F4" stroke="#7A1F2B" stroke-width="1.3"/>
  <rect x="450" y="94" width="408" height="32" rx="9" fill="#7A1F2B"/>
  <text x="466" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">트랙 2 · $86,000 건강 요건(MOC 소견) 격파 2대 무기</text>
  <circle cx="470" cy="144" r="4" fill="#7A1F2B"/>
  <text x="482" y="148" font-size="12.2" font-weight="800" fill="#1F242B">무기 A · Robinson 중증도 개별화 오류 공격 (4005·4007 공통)</text>
  <text x="482" y="167" font-size="11.1" fill="#525B67">질환명 평균 비용만 기계적으로 대입한 MOC 소견은 위법 무효 ([2005] FCA 1626).</text>
  <circle cx="470" cy="196" r="4" fill="#7A1F2B"/>
  <text x="482" y="200" font-size="12.2" font-weight="800" fill="#1F242B">무기 B · PIC 4007(2) 건강 면제(Health Waiver) 발동</text>
  <text x="482" y="219" font-size="11.1" fill="#525B67">파트너·SID 482·186 TRT 비자는 고소득 납세·가족 유대로 면제 가능 (Bui).</text>
  <circle cx="470" cy="248" r="4" fill="#7A1F2B"/>
  <text x="482" y="252" font-size="12.2" font-weight="800" fill="#1F242B">5년(영구 질환 최대 10년) 비용 산식 정밀 해부</text>
  <text x="482" y="271" font-size="11.1" fill="#525B67">전문의 기능수준 소견서 + 주정부 특수교육·약제비 실제 단가 반박.</text>
  <rect x="22" y="328" width="836" height="38" rx="8" fill="#EDF7F2" stroke="#1D6B48" stroke-width="1"/>
  <text x="36" y="351" font-size="11.2" font-weight="700" fill="#1D6B48">핵심 조언: 자녀 발달지연·자폐나 만성질환으로 $86,000 초과 통지를 받아도 포기하지 마세요. MOC 산식 오류와 4007 면제로 뒤집히는 사건이 많습니다.</text>
</svg>
