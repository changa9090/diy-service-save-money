<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 382" width="100%" role="img" aria-label="Binding Financial Agreement (BFA) vs $4,950 Court Consent Orders" style="max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <rect x="0.5" y="0.5" width="879" height="381" rx="14" fill="#FFFFFF" stroke="#E3DFD7" stroke-width="1"/>
  <rect x="1" y="1" width="878" height="76" rx="13" fill="#FAF9F6"/>
  <line x1="1" y1="77" x2="879" y2="77" stroke="#E3DFD7" stroke-width="1"/>
  <text x="26" y="28" font-size="11" font-weight="700" fill="#7A1F2B" letter-spacing="0.05em">INSTRUMENT CHOICE · BINDING FINANCIAL AGREEMENT VS CONSENT ORDERS</text>
  <text x="26" y="51" font-size="16" font-weight="800" fill="#1F242B">Binding Financial Agreement (BFA) vs $4,950 Court Consent Orders</text>
  <text x="26" y="69" font-size="11.2" fill="#525B67">Authorities: Thorne v Kennedy [2017] HCA 49 · Black &amp; Black [2008] FamCAFC 7 · Saintclaire [2015] FamCAFC 245</text>
  <rect x="22" y="94" width="408" height="218" rx="10" fill="#EEF5F7" stroke="#1F4E5F" stroke-width="1.3"/>
  <rect x="22" y="94" width="408" height="32" rx="9" fill="#1F4E5F"/>
  <text x="38" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">INSTRUMENT A · BINDING FINANCIAL AGREEMENT (BFA)</text>
  <circle cx="42" cy="144" r="4" fill="#1F4E5F"/>
  <text x="54" y="148" font-size="12.2" font-weight="800" fill="#1F242B">Essential For: Pre-Marital &amp; Intact Couples</text>
  <text x="54" y="167" font-size="11.1" fill="#525B67">Consent Orders are unavailable before breakdown; wealth protection needs a BFA.</text>
  <circle cx="42" cy="196" r="4" fill="#1F4E5F"/>
  <text x="54" y="200" font-size="12.2" font-weight="800" fill="#1F242B">Two Separate Law Firms Mandatory (s 90G)</text>
  <text x="54" y="219" font-size="11.1" fill="#525B67">Each party requires independent legal advice certificates ($8k–$15k+ combined).</text>
  <circle cx="42" cy="248" r="4" fill="#1F4E5F"/>
  <text x="54" y="252" font-size="12.2" font-weight="800" fill="#1F242B">Thorne v Kennedy [2017] HCA 49 Vulnerability</text>
  <text x="54" y="271" font-size="11.1" fill="#525B67">&#x27;Sign or wedding is off&#x27; pressure &amp; non-disclosure crush BFAs despite ILA.</text>
  <rect x="450" y="94" width="408" height="218" rx="10" fill="#EDF7F2" stroke="#1D6B48" stroke-width="1.3"/>
  <rect x="450" y="94" width="408" height="32" rx="9" fill="#1D6B48"/>
  <text x="466" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">INSTRUMENT B · COURT CONSENT ORDERS (POST-SEPARATION)</text>
  <circle cx="470" cy="144" r="4" fill="#1D6B48"/>
  <text x="482" y="148" font-size="12.2" font-weight="800" fill="#1F242B">Gold Standard Once Separated &amp; Agreed</text>
  <text x="482" y="167" font-size="11.1" fill="#525B67">No mandatory dual-firm s 90G certificates; fixed $4,950 + $215 filing fee.</text>
  <circle cx="470" cy="196" r="4" fill="#1D6B48"/>
  <text x="482" y="200" font-size="12.2" font-weight="800" fill="#1F242B">Registrar Vets &#x27;Just &amp; Equitable&#x27; Fairness Upfront</text>
  <text x="482" y="219" font-size="11.1" fill="#525B67">Court seal gives rock-solid finality, far harder to overturn than a BFA.</text>
  <circle cx="470" cy="248" r="4" fill="#1D6B48"/>
  <text x="482" y="252" font-size="12.2" font-weight="800" fill="#1F242B">Stamp-Duty Exemption &amp; Super Split Included</text>
  <text x="482" y="271" font-size="11.1" fill="#525B67">Handles property transfer duty relief &amp; 28-day Super Trustee notice.</text>
  <rect x="22" y="328" width="836" height="38" rx="8" fill="#EDF7F2" stroke="#1D6B48" stroke-width="1"/>
  <text x="36" y="351" font-size="11.2" font-weight="700" fill="#1D6B48">Decision Rule: Use an early, disclosure-backed BFA BEFORE marriage/cohabitation; use $4,950 Consent Orders AFTER separation.</text>
</svg>
