<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 382" width="100%" role="img" aria-label="내 상황에 맞는 선택은? 혼전·혼중 BFA 대 별거 후 법원 합의명령 비교" style="max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <rect x="0.5" y="0.5" width="879" height="381" rx="14" fill="#FFFFFF" stroke="#E3DFD7" stroke-width="1"/>
  <rect x="1" y="1" width="878" height="76" rx="13" fill="#FAF9F6"/>
  <line x1="1" y1="77" x2="879" y2="77" stroke="#E3DFD7" stroke-width="1"/>
  <text x="26" y="28" font-size="11" font-weight="700" fill="#7A1F2B" letter-spacing="0.05em">재산 약정 수단 선택 · 재산합의서(BFA) vs 법원 합의명령($4,950)</text>
  <text x="26" y="51" font-size="16" font-weight="800" fill="#1F242B">내 상황에 맞는 선택은? 혼전·혼중 BFA 대 별거 후 법원 합의명령 비교</text>
  <text x="26" y="69" font-size="11.2" fill="#525B67">근거: Thorne v Kennedy [2017] HCA 49 · Black &amp; Black [2008] FamCAFC 7 · Saintclaire [2015] FamCAFC 245</text>
  <rect x="22" y="94" width="408" height="218" rx="10" fill="#EEF5F7" stroke="#1F4E5F" stroke-width="1.3"/>
  <rect x="22" y="94" width="408" height="32" rx="9" fill="#1F4E5F"/>
  <text x="38" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">수단 A · 재산합의서 (BFA · ss 90B–90D / 90UB–UD)</text>
  <circle cx="42" cy="144" r="4" fill="#1F4E5F"/>
  <text x="54" y="148" font-size="12.2" font-weight="800" fill="#1F242B">유일한 활용처: 결혼·동거 전(혼전) 및 혼인 유지 중</text>
  <text x="54" y="167" font-size="11.1" fill="#525B67">법원 합의명령은 파탄 전에 신청 불가하므로 사전 자산보호는 BFA만 가능!</text>
  <circle cx="42" cy="196" r="4" fill="#1F4E5F"/>
  <text x="54" y="200" font-size="12.2" font-weight="800" fill="#1F242B">양측 각각 독립 변호사 선임 필수 (비용 2배)</text>
  <text x="54" y="219" font-size="11.1" fill="#525B67">각 변호사가 s 90G 독립 법률자문 증명서를 발급해야만 효력 발생 (Black).</text>
  <circle cx="42" cy="248" r="4" fill="#1F4E5F"/>
  <text x="54" y="252" font-size="12.2" font-weight="800" fill="#1F242B">Thorne v Kennedy [2017] HCA 49 파기 주의보</text>
  <text x="54" y="271" font-size="11.1" fill="#525B67">결혼식 직전 서명 강요·현저한 불균형·은닉 시 증명서가 있어도 무효 파기!</text>
  <rect x="450" y="94" width="408" height="218" rx="10" fill="#EDF7F2" stroke="#1D6B48" stroke-width="1.3"/>
  <rect x="450" y="94" width="408" height="32" rx="9" fill="#1D6B48"/>
  <text x="466" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">수단 B · 법원 합의명령 (Consent Orders · 별거 후 1순위)</text>
  <circle cx="470" cy="144" r="4" fill="#1D6B48"/>
  <text x="482" y="148" font-size="12.2" font-weight="800" fill="#1F242B">별거·이혼 후 원만히 합의된 커플의 압도적 표준</text>
  <text x="482" y="167" font-size="11.1" fill="#525B67">양측이 각각 로펌을 선임할 의무 없이 정액($4,950 + $215)으로 깔끔히 완결.</text>
  <circle cx="470" cy="196" r="4" fill="#1D6B48"/>
  <text x="482" y="200" font-size="12.2" font-weight="800" fill="#1F242B">법관이 공정·형평성(Just &amp; Equitable) 사전 심사</text>
  <text x="482" y="219" font-size="11.1" fill="#525B67">법원 인장이 찍히면 사후 무효 소송(s 79A) 가능성이 극히 낮아 안정성 최고!</text>
  <circle cx="470" cy="248" r="4" fill="#1D6B48"/>
  <text x="482" y="252" font-size="12.2" font-weight="800" fill="#1F242B">인지세 면제 + 퇴직연금 분할(28일 통지) 일괄 처리</text>
  <text x="482" y="271" font-size="11.1" fill="#525B67">부동산 명의이전 세금 면제와 Super Splitting까지 한 번에 집행됩니다.</text>
  <rect x="22" y="328" width="836" height="38" rx="8" fill="#EDF7F2" stroke="#1D6B48" stroke-width="1"/>
  <text x="36" y="351" font-size="11.2" font-weight="700" fill="#1D6B48">명쾌한 결론: 결혼·동거 전 재산 보호는 충분한 시간과 공시를 갖춘 BFA로, 별거 후 합의 확정은 $4,950 법원 합의명령으로 진행하세요.</text>
</svg>
