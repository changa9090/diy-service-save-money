  <text x="38" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">GATEWAY 1 · DATING / AFFAIR VS s 4AA DE FACTO</text>
  <circle cx="42" cy="144" r="4" fill="#1F4E5F"/>
  <text x="54" y="148" font-size="12.2" font-weight="800" fill="#1F242B">Concurrent Marriage Does Not Bar s 4AA(5)(b)</text>
  <text x="54" y="167" font-size="11.1" fill="#525B67">A de facto tie can legally coexist with marriage, subject to strict proof.</text>
  <circle cx="42" cy="196" r="4" fill="#1F4E5F"/>
  <text x="54" y="200" font-size="12.2" font-weight="800" fill="#1F242B">Touchstone: Merger of Lives (&#x27;Coupledom&#x27;)</text>
  <text x="54" y="219" font-size="11.1" fill="#525B67">Jonah &amp; White [2012]: 17-yr secret affair + monthly allowance dismissed!</text>
  <circle cx="42" cy="248" r="4" fill="#1F4E5F"/>
  <text x="54" y="252" font-size="12.2" font-weight="800" fill="#1F242B">Breakdown Date Objectively Tested (Fairbairn)</text>
  <text x="54" y="271" font-size="11.1" fill="#525B67">HCA [2022]: Refusing mutual financial support marks separation date.</text>
