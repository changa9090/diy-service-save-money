  <text x="466" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">GATEWAY 2 · OUT-OF-TIME LEAVE (s 44(4) &amp; s 44(6))</text>
  <circle cx="470" cy="144" r="4" fill="#7A1F2B"/>
  <text x="482" y="148" font-size="12.2" font-weight="800" fill="#1F242B">Step 1: Prima Facie Claim &amp; Substantial Hardship</text>
  <text x="482" y="167" font-size="11.1" fill="#525B67">Weighs claim size against legal fees required to litigate it (Whitford).</text>
  <circle cx="470" cy="196" r="4" fill="#7A1F2B"/>
  <text x="482" y="200" font-size="12.2" font-weight="800" fill="#1F242B">Step 2: Delay Explanation &amp; Prejudice Balance</text>
  <text x="482" y="219" font-size="11.1" fill="#525B67">Holistic discretion on delay &amp; third-party reliance (Gadzen; Skelton [2022]).</text>
  <circle cx="470" cy="248" r="4" fill="#7A1F2B"/>
  <text x="482" y="252" font-size="12.2" font-weight="800" fill="#1F242B">High Adverse Costs Exposure at Threshold Trial</text>
