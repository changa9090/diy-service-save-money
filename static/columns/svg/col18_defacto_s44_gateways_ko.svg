<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 382" width="100%" role="img" aria-label="사실혼 재산분할 소송의 2대 선결 관문: 관계 성립과 제척기간 도과 허가" style="max-width:880px;height:auto;display:block;font-family:'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <rect x="0.5" y="0.5" width="879" height="381" rx="14" fill="#FFFFFF" stroke="#E3DFD7" stroke-width="1"/>
  <rect x="1" y="1" width="878" height="76" rx="13" fill="#FAF9F6"/>
  <line x1="1" y1="77" x2="879" y2="77" stroke="#E3DFD7" stroke-width="1"/>
  <text x="26" y="28" font-size="11" font-weight="700" fill="#7A1F2B" letter-spacing="0.05em">본안 전 관할권 전쟁 · 사실혼 성립(s 4AA) 경계선과 도과 구제(s 44)</text>
  <text x="26" y="51" font-size="16" font-weight="800" fill="#1F242B">사실혼 재산분할 소송의 2대 선결 관문: 관계 성립과 제척기간 도과 허가</text>
  <text x="26" y="69" font-size="11.2" fill="#525B67">근거: Jonah &amp; White [2012] FamCAFC 200 · Fairbairn v Radecki [2022] HCA 18 · Whitford [1979] · Skelton [2022]</text>
  <rect x="22" y="94" width="408" height="218" rx="10" fill="#EEF5F7" stroke="#1F4E5F" stroke-width="1.3"/>
  <rect x="22" y="94" width="408" height="32" rx="9" fill="#1F4E5F"/>
  <text x="38" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">관문 1 · 연인·후원 vs 법적 사실혼 (s 4AA / s 90SB)</text>
  <circle cx="42" cy="144" r="4" fill="#1F4E5F"/>
  <text x="54" y="148" font-size="12.2" font-weight="800" fill="#1F242B">기혼자와의 이중 사실혼도 법리상 가능 (s 4AA(5)(b))</text>
  <text x="54" y="167" font-size="11.1" fill="#525B67">법률혼 유지 중이라도 제3자와 사실혼 성립 가능 · 단 입증 기준이 매우 엄격.</text>
  <circle cx="42" cy="196" r="4" fill="#1F4E5F"/>
  <text x="54" y="200" font-size="12.2" font-weight="800" fill="#1F242B">핵심 잣대: &#x27;삶의 결합(Coupledom)&#x27; 유무 (Jonah &amp; White)</text>
  <text x="54" y="219" font-size="11.1" fill="#525B67">17년 교제·매달 생활비 송금에도 각자 가정을 유지해 사실혼 기각!</text>
  <circle cx="42" cy="248" r="4" fill="#1F4E5F"/>
  <text x="54" y="252" font-size="12.2" font-weight="800" fill="#1F242B">별거 시점 객관적 확정 (Fairbairn v Radecki HCA)</text>
  <text x="54" y="271" font-size="11.1" fill="#525B67">치매 요양원 입소 자체보다 재산 분리·상호 부양 거절 시점이 파탄일.</text>
  <rect x="450" y="94" width="408" height="218" rx="10" fill="#FDF3F4" stroke="#7A1F2B" stroke-width="1.3"/>
  <rect x="450" y="94" width="408" height="32" rx="9" fill="#7A1F2B"/>
  <text x="466" y="115" font-size="11.8" font-weight="700" font-family="'JetBrains Mono', 'Inter', monospace" fill="#FFFFFF">관문 2 · 기한 도과 후 특별허가 (s 44(3) 1년 / s 44(5) 2년)</text>
  <circle cx="470" cy="144" r="4" fill="#7A1F2B"/>
  <text x="482" y="148" font-size="12.2" font-weight="800" fill="#1F242B">1단계: 실질적 곤궁(Substantial Hardship) 입증</text>
  <text x="482" y="167" font-size="11.1" fill="#525B67">단순한 청구권 상실이 아니라 예상 배상액 대비 소송비 실익까지 심사(Whitford).</text>
  <circle cx="470" cy="196" r="4" fill="#7A1F2B"/>
  <text x="482" y="200" font-size="12.2" font-weight="800" fill="#1F242B">2단계: 지체 사유 소명 및 상대방 불이익 형량</text>
  <text x="482" y="219" font-size="11.1" fill="#525B67">일부 기간 설명 공백만으로 기계적 기각 불가하나 설득력 필수(Gadzen; Skelton).</text>
  <circle cx="470" cy="248" r="4" fill="#7A1F2B"/>
  <text x="482" y="252" font-size="12.2" font-weight="800" fill="#1F242B">패소 시 상대방 변호사비 배상(Costs Order) 직격탄</text>
  <text x="482" y="271" font-size="11.1" fill="#525B67">관할권 예비심문(Threshold Hearing) 전에 승산과 비용 리스크를 냉정히 따져야 함.</text>
  <rect x="22" y="328" width="836" height="38" rx="8" fill="#EDF7F2" stroke="#1D6B48" stroke-width="1"/>
  <text x="36" y="351" font-size="11.2" font-weight="700" fill="#1D6B48">실전 포인트: 사실혼 성립 부인 방어(s 90RD)나 1년·2년 도과 사건 구제는 본안 전에 열리는 예비 관할 심리에서 모든 승부가 갈립니다.</text>
</svg>
